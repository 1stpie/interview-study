에 주의합니다.<\/p>\n<p>Fragment에서는 viewLifecycleOwner를 씁니다. Fragment 자체의 Lifecycle은 View보다 오래 살아서, 백 스택에 들어가 View만 파괴된 동안에도 수집이 이어지고 View를 다시 만들 때마다 수집 코루틴이 하나씩 더 쌓입니다. Compose에서는 collectAsStateWithLifecycle()이 기본으로 STARTED에서 수집을 시작해 STOPPED에서 멈추고, minActiveState로 기준을 바꿀 수 있습니다. collectAsState()는 생명주기를 모르고 컴포지션에 있는 동안 계속 수집하므로 Android 앱에서는 collectAsStateWithLifecycle을 씁니다.<\/p>\n<p>launchWhenStarted 같은 launchWhenX와 whenX는 Lifecycle 2.6.0-alpha04에서 deprecated되었고, 대안으로 repeatOnLifecycle이 안내되었습니다. 이 API들은 STOPPED에서 코루틴을 취소하지 않고 Dispatcher를 멈춰 일시 정지만 시키기 때문에, 수집 코루틴은 멈춰 있어도 업스트림은 백그라운드에서 계속 값을 만들어 자원을 낭비합니다.<\/p>\n<pre class=\"kotlin\"><code>// Fragment\noverride fun onViewCreated(view: View, savedInstanceState: Bundle?) {\n    viewLifecycleOwner.lifecycleScope.launch {\n        viewLifecycleOwner.repeatOnLifecycle(Lifecycle.State.STARTED) {\n            launch { viewModel.uiState.collect(::render) }\n            launch { viewModel.alerts.collect(::showAlert) }\n        }\n    }\n}\n\n// Compose\nval uiState by viewModel.uiState.collectAsStateWithLifecycle()<\/code><\/pre>","f":"<ul>\n<li><strong>repeatOnLifecycle을 onStart에서 부르면?<\/strong> onStart마다 새 코루틴이 생겨 수집이 중복으로 쌓입니다. onCreate나 onViewCreated에서 한 번만 부릅니다.<\/li>\n<li><strong>RESUMED를 기준으로 수집하면?<\/strong> 투명 Activity가 위에 뜨거나 PiP 모드처럼 포커스를 받을 수 없는 상태가 되면 RESUMED에서 STARTED로 내려가므로, 그때마다 수집이 취소되고 다시 시작되어 업스트림 재시작이 잦아집니다. 화면에 보이는 동안 수집한다는 목적에는 STARTED가 맞습니다.<\/li>\n<li><strong>collectAsStateWithLifecycle이 멈춘 동안 들어온 값은 어떻게 됩니까?<\/strong> 멈춘 동안의 중간 값은 받지 않고, 다시 STARTED가 되면 그때의 값부터 받습니다. StateFlow라면 최신 값을 바로 받으므로 상태 표시에는 지장이 없지만, 이벤트를 이렇게 받으면 유실될 수 있습니다.<\/li>\n<\/ul>"},{"no":34,"t":"토스트나 화면 이동 같은 일회성 이벤트는 ViewModel에서 UI로 어떻게 보냅니까?","a":"<p>Google 아키텍처 가이드의 권장은 ViewModel 이벤트를 UI 상태로 바꾸는 것입니다. ViewModel은 \"보여 줄 메시지가 있다\", \"로그인이 끝났다\" 같은 상태를 내보내고, UI는 그 상태를 처리해 메시지를 띄우거나 화면을 이동한 뒤 ViewModel에 알려 상태를 지웁니다. SharedFlow는 수집자가 없을 때 값을 버리고, Channel은 수집자 하나에게 전달하지만 생산자인 ViewModel이 소비자인 UI보다 오래 사는 구조에서는 전달과 처리를 보장하지 못하므로, 가이드는 이런 방식 대신 상태로 줄이라고 합니다.<\/p>\n<p>SharedFlow를 replay 0으로 쓰면 구독자가 없을 때 emit한 값이 그대로 버려집니다. 회전하는 순간이나 repeatOnLifecycle로 수집을 멈춘 백그라운드 동안 발생한 이벤트는 사라집니다. replay를 1로 올리면 유실은 줄지만 다시 구독할 때 같은 이벤트가 또 와서 토스트가 두 번 뜹니다. Channel을 receiveAsFlow로 노출하면 수집자가 없는 동안 버퍼에 쌓였다가 다음 수집자에게 가므로 SharedFlow보다는 낫습니다. 그래도 수집 코루틴이 값을 받은 직후 처리하기 전에 취소되면 그 값은 사라질 수 있고, 수집자가 둘이면 값이 한쪽에만 갑니다.<\/p>\n<p>가이드는 ViewModel 이벤트가 항상 UI 상태 갱신으로 이어져야 한다고 하고, 그러면 구성 변경 뒤에도 이벤트가 재현되고 UI 동작이 유실되지 않는다고 설명합니다. SavedStateHandle에 두면 프로세스 종료 뒤까지 재현할 수 있습니다. 선택 기준은 이렇습니다. 오류 메시지나 로그인 성공 뒤 이동처럼 결과가 화면 상태를 바꾸는 이벤트는 상태 필드로 두고 처리 후 지웁니다. 버튼을 눌러 다른 화면으로 가는 것처럼 UI에서 시작해 UI에서 끝나는 동작은 ViewModel을 거치지 않고 UI가 바로 처리합니다. 기존 코드가 Channel을 쓰고 있다면 유실되어도 괜찮은 이벤트로 한정하고 차례로 상태로 옮깁니다.<\/p>\n<pre class=\"kotlin\"><code>data class RouteUiState(\n    val route: Route? = null,\n    val userMessage: String? = null,          // 보여 줄 메시지도 상태로 둔다\n)\n\nfun onSearchFailed() = _state.update { it.copy(userMessage = &quot;경로를 찾지 못했습니다&quot;) }\nfun onMessageShown() = _state.update { it.copy(userMessage = null) }\n\n// Compose\nuiState.userMessage?.let { message -&gt;\n    LaunchedEffect(message) {\n        snackbarHostState.showSnackbar(message)\n        viewModel.onMessageShown()             // 처리했다고 알려 상태를 지운다\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Channel 용량 종류는 무엇이 다릅니까?<\/strong> RENDEZVOUS는 버퍼가 없어 send가 receive를 만날 때까지 중단되고, BUFFERED는 기본 크기의 버퍼를 둡니다. CONFLATED는 값 하나만 두고 새 값이 오면 이전 값을 버리며, UNLIMITED는 send가 중단되지 않는 무제한 버퍼라 소비가 멈추면 메모리가 늘어납니다. 이벤트 채널에 CONFLATED를 쓰면 연달아 온 이벤트 중 앞의 것이 사라집니다.<\/li>\n<li><strong>같은 이벤트를 여러 화면이 받아야 하면?<\/strong> 가이드는 소비자가 여럿이면 정확히 한 번 전달을 보장하기 어려워진다며 구조를 다시 보라고 합니다. 이벤트를 더 위의 공통 상태로 올립니다.<\/li>\n<li><strong>메시지를 상태로 두면 백그라운드에서도 처리되지 않습니까?<\/strong> 가이드는 토스트처럼 백그라운드에서 처리하면 안 되는 상태는 UI가 포그라운드일 때 소비하라고 합니다. collectAsStateWithLifecycle로 수집하면 STARTED 이후에만 처리됩니다.<\/li>\n<\/ul>"},{"no":35,"t":"검색어 자동완성을 Flow로 만든다면 debounce, distinctUntilChanged, flatMapLatest를 어떻게 조합합니까? flatMapConcat, flatMapMerge와는 무엇이 다릅니까?","a":"<p>입력을 MutableStateFlow로 받아 debounce로 타이핑이 멈출 때까지 기다리고, 공백 정리와 최소 글자 수 처리를 한 뒤 distinctUntilChanged로 같은 검색어를 거르고 flatMapLatest로 검색합니다. flatMapLatest는 새 검색어가 오면 진행 중인 이전 요청의 내부 Flow를 취소하므로, 늦게 도착한 이전 결과가 최신 결과를 덮어쓰는 일이 생기지 않습니다. 예외는 내부 Flow에서 catch해야 바깥 입력 Flow가 끝나지 않습니다.<\/p>\n<p>단계마다 이유가 있습니다. debounce는 정해진 시간 안에 새 값이 오면 이전 값을 버리고 입력이 멈춘 뒤의 마지막 값만 보내 요청 수를 줄입니다. 시간 값은 기기와 서버 응답 시간을 보고 측정으로 정합니다. distinctUntilChanged는 검색어를 지웠다가 다시 쳐서 같은 값이 되었을 때 요청을 다시 보내지 않게 합니다. 최소 글자 수는 filter로 거를 수도 있지만, 그러면 글자를 지워 짧아졌을 때 아무것도 내보내지 않아 이전 결과가 화면에 남습니다. 그래서 flatMapLatest 안에서 짧은 입력을 Idle 상태로 바꿔 보냅니다. 내부 Flow가 Loading을 먼저 내보내고 결과를 내보내므로 로딩 상태도 같은 흐름에서 표현됩니다. 오류를 내부 Flow 안에서 상태로 바꾸지 않고 바깥에 catch를 두면, 한 번 실패한 뒤 바깥 Flow가 끝나 그 뒤 입력에 반응하지 않습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>연산자<\/th>\n<th>새 값이 오면<\/th>\n<th>맞는 곳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>flatMapLatest<\/td>\n<td>이전 내부 Flow를 취소하고 새로 시작<\/td>\n<td>검색, 필터 변경처럼 최신 요청만 의미 있을 때<\/td>\n<\/tr>\n<tr>\n<td>flatMapConcat<\/td>\n<td>이전 내부 Flow가 끝날 때까지 기다렸다가 순서대로<\/td>\n<td>순서가 중요한 순차 처리<\/td>\n<\/tr>\n<tr>\n<td>flatMapMerge<\/td>\n<td>여러 내부 Flow를 동시에 수집하고 concurrency로 개수 제한<\/td>\n<td>서로 독립인 병렬 처리<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>검색에 flatMapMerge를 쓰면 응답 순서가 뒤섞여 이전 검색어의 결과가 마지막에 표시될 수 있고, flatMapConcat을 쓰면 이전 요청이 끝나야 다음 요청이 시작되어 결과가 입력을 따라오지 못합니다. kotlinx.coroutines 1.11.0 API 문서 기준으로 flatMapLatest, flatMapConcat, flatMapMerge는 @ExperimentalCoroutinesApi, debounce는 @FlowPreview라 opt-in이 필요합니다. 같은 문서는 flatMapConcat과 flatMapMerge를 일반 앱 Flow에 쓰기 전에 map 안의 suspend 호출로 충분한지 먼저 보라고 권합니다.<\/p>\n<pre class=\"kotlin\"><code>@OptIn(FlowPreview::class, ExperimentalCoroutinesApi::class)\nval results: StateFlow&lt;SearchUiState&gt; = query\n    .debounce(300)                                     // 예시 값, 측정으로 정함\n    .map { it.trim() }\n    .distinctUntilChanged()\n    .flatMapLatest { q -&gt;\n        if (q.length &lt; 2) flowOf(SearchUiState.Idle)   // 최소 글자 수도 예시 값\n        else flow&lt;SearchUiState&gt; {\n            emit(SearchUiState.Loading)\n            emit(SearchUiState.Success(repository.search(q)))\n        }.catch { emit(SearchUiState.Error(it)) }      // 안쪽에서 잡아 입력 Flow를 유지\n    }\n    .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), SearchUiState.Idle)<\/code><\/pre>","f":"<ul>\n<li><strong>debounce 대신 sample을 쓰면?<\/strong> sample은 일정 주기마다 그때의 최신 값을 내보내므로 타이핑 중에도 요청이 나갑니다. 자동완성은 입력이 멈춘 뒤 요청하는 debounce가 맞습니다.<\/li>\n<li><strong>flatMapLatest가 취소해도 서버 요청은 이미 나가지 않았습니까?<\/strong> 코루틴이 취소되면 Retrofit의 suspend 호출은 OkHttp Call을 취소하지만, 서버가 이미 받은 요청은 처리됩니다. 클라이언트에서 늦은 응답을 버리고 연결 자원을 일찍 돌려받는 것이 목적입니다.<\/li>\n<li><strong>같은 검색어를 다시 요청하는 비용을 줄이려면?<\/strong> Repository에 검색어 단위의 메모리 캐시를 두고 flatMapLatest 안에서 먼저 확인합니다. 캐시 만료 시간과, 현재 위치가 바뀌었을 때 무효화하는 기준을 함께 정합니다.<\/li>\n<\/ul>"},{"no":36,"t":"combine, zip, merge는 어떻게 다르고, combine을 쓸 때 무엇을 주의합니까?","a":"<p>combine은 각 Flow의 최신 값을 조합해 어느 하나라도 새 값을 내면 다시 계산합니다. zip은 순서대로 짝을 맞춰 첫 번째끼리, 두 번째끼리 조합하고 한쪽이 끝나면 함께 끝납니다. merge는 조합하지 않고 여러 Flow의 값을 도착하는 순서대로 하나의 Flow로 합칩니다. 화면 상태는 보통 combine으로 여러 상태 Flow를 하나의 UI 상태로 합칩니다.<\/p>\n<p>combine에서 가장 자주 깨지는 지점은 시작 조건입니다. 모든 Flow가 최소 한 번씩 값을 내야 첫 결과가 나오므로, 하나라도 값을 내지 않으면 화면 전체가 초기 상태에 멈춥니다. 아직 응답이 없는 네트워크 Flow나 조건에 따라 emit하지 않는 Flow가 섞여 있으면 이렇게 됩니다. StateFlow처럼 초기값이 있는 소스를 쓰거나 onStart로 시작 값을 줍니다. 두 번째는 비용입니다. 위치, 센서, 스크롤 위치처럼 방출이 잦은 Flow를 combine에 넣으면 그때마다 transform이 다시 실행되고 새 UI 상태 객체가 만들어져 리컴포지션까지 이어집니다. 고빈도 값은 UI 상태에서 분리해 그 값을 쓰는 컴포저블만 따로 읽게 하거나, 소스 쪽에서 distinctUntilChanged나 sample로 줄인 뒤 합칩니다. 세 번째는 인자 개수입니다. 타입이 있는 combine 오버로드는 Flow 다섯 개까지이고 그보다 많으면 배열을 받는 오버로드로 넘어가 타입 안전성이 떨어지므로, 관련 있는 Flow끼리 먼저 묶어 중간 상태를 만듭니다.<\/p>\n<p>zip은 두 스트림이 1:1로 대응할 때 씁니다. 한 번 오는 결과 두 개를 합치는 용도라면 coroutineScope 안의 async 두 개가 의도를 더 잘 드러냅니다. merge는 서로 다른 이벤트 소스를 하나의 트리거로 모을 때 씁니다. 당겨서 새로고침, 푸시 수신, 주기 갱신을 merge해 하나의 새로고침 흐름으로 만드는 식입니다.<\/p>\n<pre class=\"kotlin\"><code>val uiState: StateFlow&lt;HomeUiState&gt; = combine(\n    favoritesRepository.favorites,                             // Flow&lt;List&lt;Place&gt;&gt;\n    settingsRepository.settings,                               // Flow&lt;Settings&gt;\n    recentRepository.searches.onStart { emit(emptyList()) },   // 첫 값 보장\n) { favorites, settings, recent -&gt;\n    HomeUiState(favorites, settings.homeAddress, recent)\n}.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), HomeUiState())\n\nval refreshTriggers: Flow&lt;Unit&gt; = merge(pullToRefresh, pushReceived, periodicTick)<\/code><\/pre>","f":"<ul>\n<li><strong>combine 결과가 너무 자주 나와 리컴포지션이 많으면?<\/strong> 소스마다 distinctUntilChanged를 붙이고, 고빈도 소스는 UI 상태에서 분리해 그 값을 쓰는 컴포저블만 따로 읽게 합니다.<\/li>\n<li><strong>combine의 transform 안에서 suspend 함수를 불러도 됩니까?<\/strong> transform이 suspend 람다라 가능하지만, 오래 걸리면 다음 조합이 밀립니다. 무거운 계산은 업스트림에서 미리 하거나 flowOn으로 Default에서 실행합니다.<\/li>\n<li><strong>zip에서 한쪽이 훨씬 빠르면?<\/strong> 짝이 맞을 때까지 빠른 쪽이 기다리고, 한쪽이 끝나면 나머지는 취소되어 남은 값은 버려집니다.<\/li>\n<\/ul>"},{"no":37,"t":"Flow의 buffer, conflate, collectLatest는 각각 어떤 문제를 풉니까?","a":"<p>셋 다 생산이 소비보다 빠를 때 쓰는 연산자입니다. 기본 Flow는 생산과 소비가 같은 코루틴에서 순차 실행되어 느린 소비가 생산을 붙잡습니다. buffer는 생산을 별도 코루틴으로 떼어 채널로 연결해 둘을 동시에 돌리면서 값은 모두 처리합니다. conflate는 소비가 바쁜 동안 들어온 중간 값을 버리고 최신 값만 남기며, collectLatest는 새 값이 오면 진행 중인 이전 처리를 취소하고 새 값으로 다시 시작합니다.<\/p>\n<p>buffer(capacity, onBufferOverflow)는 버퍼가 차면 기본적으로 생산을 중단시켜 배압을 겁니다. onBufferOverflow를 DROP_OLDEST나 DROP_LATEST로 바꾸면 중단하는 대신 값을 버립니다. 효과는 전체 시간이 생산과 소비 시간의 합에서 둘 중 긴 쪽에 가까워지는 것입니다. conflate는 이미 시작한 처리는 끝까지 하고, 끝난 뒤 그 사이에 들어온 값 중 최신 값 하나만 처리합니다. StateFlow는 이미 conflate된 것처럼 동작하므로 StateFlow에 conflate를 붙여도 효과가 없습니다. collectLatest는 처리 도중에 취소하므로 처리 블록에 중단 지점이 있어야 하고, 값이 계속 빨리 오면 끝까지 완료되는 처리가 하나도 없을 수 있습니다.<\/p>\n<p>고빈도 위치나 센서 값은 용도에 따라 다르게 다룹니다. 지도에 현재 위치 마커를 그리는 일은 최신 위치만 의미가 있으므로 conflate가 맞습니다. 선택한 장소의 상세 정보 로딩처럼 처리 도중 새 값이 오면 이전 처리가 쓸모없어지는 일은 collectLatest가 맞습니다. 반면 주행 거리 누적, 경로 이탈 판정, 주행 기록 저장처럼 모든 점이 필요한 처리는 값을 버리면 결과가 틀리므로 buffer로 동시성만 얻고 overflow는 SUSPEND로 둡니다. 소비가 계속 느리다면 버퍼를 키우기보다 처리 비용을 줄이거나 묶어서 저장합니다. 결제 완료나 도착 알림 같은 이벤트도 버리면 안 되므로 conflate와 DROP 계열을 쓰지 않습니다.<\/p>\n<pre class=\"kotlin\"><code>locationUpdates\n    .conflate()                              // 그리기는 최신 위치만 필요\n    .collect { mapView.moveMarker(it) }\n\nlocationUpdates\n    .buffer(capacity = 256)                  // 예시 값: 모든 점을 처리하되 생산은 막지 않음\n    .collect { tripRecorder.append(it) }\n\nselectedPlace.collectLatest { place -&gt;       // 새 선택이 오면 이전 상세 로딩 취소\n    detailPanel.show(repository.detail(place.id))\n}<\/code><\/pre>","f":"<ul>\n<li><strong>conflate와 collectLatest 중 무엇을 고릅니까?<\/strong> 처리 하나하나가 끝까지 가야 의미가 있으면 conflate, 처리 도중이라도 새 값이 오면 이전 결과가 쓸모없으면 collectLatest입니다.<\/li>\n<li><strong>flowOn과 buffer를 함께 쓰면?<\/strong> 인접한 flowOn, buffer, conflate는 하나의 채널로 합쳐지므로 flowOn의 Dispatcher 전환과 buffer의 용량 설정이 같은 채널에 적용됩니다.<\/li>\n<li><strong>collectLatest 블록이 블로킹 호출만 하면?<\/strong> 중단 지점이 없어 취소가 먹히지 않고, 새 값이 와도 이전 처리가 끝날 때까지 기다리게 되어 collectLatest를 쓴 의미가 없어집니다.<\/li>\n<\/ul>"},{"no":38,"t":"flowOn은 어떻게 동작하고, Flow 안에서 withContext로 Dispatcher를 바꾸면 왜 예외가 납니까?","a":"<p>질문을 조금 바로잡으면, 예외가 나는 것은 withContext 자체가 아니라 withContext 블록 안에서 emit을 부를 때입니다. Flow는 컨텍스트 보존 원칙에 따라 값을 수집하는 쪽의 컨텍스트에서 emit해야 하고, 다른 컨텍스트에서 emit하면 \"Flow invariant is violated\"라는 메시지의 IllegalStateException이 납니다. 업스트림의 실행 컨텍스트를 바꾸는 정식 방법은 flowOn입니다.<\/p>\n<p>이 원칙은 수집 쪽의 가정을 지키기 위한 것입니다. collect 람다는 수집을 시작한 코루틴의 컨텍스트, 예를 들어 Main에서 실행된다고 믿고 UI를 만집니다. emit은 사실상 수집 람다를 직접 호출하므로, 업스트림이 withContext(Dispatchers.IO) 안에서 emit하면 수집 람다가 IO 스레드에서 실행되어 버립니다. 그래서 Flow는 자기 실행 컨텍스트를 캡슐화해 하류로 새지 않게 하고, launch로 다른 코루틴을 띄워 emit하는 것도 같은 이유로 막습니다. withContext로 값만 받아 오고 emit은 블록 밖에서 하면 괜찮습니다.<\/p>\n<p>flowOn(ctx)는 자신보다 위에 있으면서 자기 컨텍스트가 없는 연산자들만 ctx에서 실행하고 하류는 그대로 둡니다. Dispatcher가 바뀌면 업스트림을 별도 코루틴에서 수집하고 기본 크기 버퍼의 채널로 하류에 넘기므로 buffer를 넣은 것과 비슷해지고, Dispatcher가 같으면 순차 실행이 유지됩니다. flowOn을 여러 개 쓰면 각자 바로 위 구간만 바꿉니다. map 다음에 flowOn(IO), filter 다음에 flowOn(Default)를 두면 map은 IO, filter는 Default, collect는 수집자의 컨텍스트에서 실행됩니다. flowOn에 Job을 넣으면 IllegalArgumentException이 나고, SharedFlow에 flowOn을 붙이면 효과가 없습니다.<\/p>\n<p>여러 소스를 서로 다른 Dispatcher에서 동시에 만들어 하나로 합쳐야 한다면 channelFlow를 씁니다. channelFlow 안에서는 launch로 여러 코루틴을 띄워 각자 send할 수 있고, 채널이 스레드 안전하게 하류로 전달합니다. 업스트림 전체의 Dispatcher만 바꾸는 일이라면 flowOn으로 충분합니다.<\/p>\n<pre class=\"kotlin\"><code>// 예외: 다른 컨텍스트에서 emit\nflow { withContext(Dispatchers.IO) { emit(load()) } }\n\n// 문제없음: withContext로 값만 받아 오고 emit은 원래 컨텍스트에서\nflow { emit(withContext(ioDispatcher) { load() }) }\n\n// 권장: 업스트림 전체를 flowOn으로\nflow { emit(load()) }\n    .map { parse(it) }              // ioDispatcher에서 실행\n    .flowOn(ioDispatcher)\n    .collect { render(it) }         // 수집을 시작한 코루틴의 컨텍스트<\/code><\/pre>","f":"<ul>\n<li><strong>Room이나 Retrofit을 부르는 Flow에도 flowOn이 필요합니까?<\/strong> Android 데이터 계층 가이드는 Room과 Retrofit의 suspend 호출이 이미 main-safe하다고 설명하므로 그 호출 때문에 flowOn을 붙일 필요는 보통 없습니다. 그 뒤에 붙는 무거운 변환에만 flowOn(Dispatchers.Default)를 씁니다.<\/li>\n<li><strong>flowOn으로 Dispatcher를 바꾸면 취소 때 무엇이 달라집니까?<\/strong> 생산과 소비가 다른 코루틴에서 채널로 연결되므로, 취소될 때 이미 채널에 들어 있던 값이 버려질 수 있다고 문서에 적혀 있습니다.<\/li>\n<li><strong>flowOn을 연달아 두 번 붙이면?<\/strong> 인접한 flowOn은 하나로 합쳐지고, 같은 키는 먼저 쓴 쪽, 즉 위쪽의 값이 우선합니다.<\/li>\n<\/ul>"},{"no":39,"t":"Flow의 예외는 catch, retry, retryWhen, onCompletion으로 어떻게 처리합니까?","a":"<p>Flow는 예외 투명성을 지켜야 합니다. 업스트림이 하류, 즉 수집자의 예외를 잡아 삼키면 안 되고, 예외 처리는 연산자로 선언합니다. catch는 자기보다 위에서 난 예외만 잡아 대체 값을 emit하거나 다시 던지고, retry와 retryWhen은 업스트림을 다시 수집하며, onCompletion은 성공, 실패, 취소 어느 경우든 끝날 때 원인을 받아 실행됩니다. catch로 잡더라도 그 Flow는 거기서 끝난다는 점이 설계의 출발점입니다.<\/p>\n<p>catch는 업스트림 예외만 잡고 collect 람다에서 난 예외는 잡지 못합니다. 수집 로직의 예외도 catch로 다루려면 그 로직을 onEach로 옮겨 catch 위에 두고, 마지막은 launchIn(scope)이나 인자 없는 collect()로 끝냅니다. Flow를 취소하려고 던진 예외는 잡지 않으며, 공식 문서는 예상한 예외만 처리하고 예상하지 못한 예외는 catch 안에서 다시 던지라고 합니다. retry(n)은 조건에 맞는 예외가 나면 업스트림을 최대 n번 다시 수집하는데, retries의 기본값이 Long.MAX_VALUE라서 횟수를 주지 않으면 사실상 무한 재시도가 됩니다. retryWhen은 원인과 0부터 세는 시도 번호를 받고 suspend 람다라서 delay로 지수 백오프를 구현하거나 재시도 중이라는 상태를 emit할 수 있습니다. onCompletion은 finally처럼 동작해서 원인이 null이면 정상 완료, CancellationException이면 취소, 그 밖이면 실패입니다. 하류 예외도 관찰하지만 예외를 처리하지는 않으므로 로딩 표시를 끄거나 로그를 남기는 데 씁니다.<\/p>\n<p>오류 뒤에도 Flow가 끝나지 않게 하려면 구조로 풀어야 합니다. catch로 잡아도 업스트림은 이미 끝났으므로 이후 값은 오지 않습니다. 검색어 Flow나 새로고침 트리거처럼 계속 살아 있어야 하는 바깥 Flow는, 실패할 수 있는 작업을 flatMapLatest의 내부 Flow로 넣고 그 안에서 catch해 오류를 상태로 바꿉니다. 한 번의 요청이라면 map 안에서 구체 예외를 try/catch로 잡아 결과 타입으로 바꿔도 됩니다. stateIn이나 shareIn으로 만든 Hot Flow는 업스트림 예외가 공유 코루틴을 끝내므로 그 앞에 retry와 catch를 둡니다.<\/p>\n<pre class=\"kotlin\"><code>repository.observeRoute(routeId)\n    .retryWhen { cause, attempt -&gt;\n        val retry = cause is IOException &amp;&amp; attempt &lt; 3          // 횟수는 예시 값\n        if (retry) delay(1_000L shl attempt.toInt())              // 1초, 2초, 4초 백오프\n        retry\n    }\n    .onEach { route -&gt; _state.update { it.copy(route = route) } } // 수집 로직을 catch 위로\n    .onCompletion { _state.update { it.copy(isLoading = false) } }\n    .catch { e -&gt; _state.update { it.copy(error = e.toUiError()) } } // 업스트림과 onEach 예외\n    .launchIn(viewModelScope)<\/code><\/pre>","f":"<ul>\n<li><strong>flow 빌더 안에서 emit을 try/catch로 감싸면?<\/strong> 하류에서 난 예외까지 잡아 예외 투명성을 깨고, 그 뒤에 다시 emit하면 Flow가 IllegalStateException을 던집니다. 업스트림 실패만 다루려면 catch 연산자를 씁니다.<\/li>\n<li><strong>catch 안에서 원래 Flow를 다시 수집해도 됩니까?<\/strong> emitAll로 다른 Flow로 대체하는 것은 되지만, 원래 Flow를 다시 시도하려면 retryWhen을 씁니다. catch 안에서 같은 Flow를 다시 수집하면 중단 호출이 계속 쌓인다고 문서가 경고합니다.<\/li>\n<li><strong>retry를 stateIn 뒤에 붙이면?<\/strong> StateFlow는 끝나지 않고 업스트림 예외를 구독자에게 전달하지 않으므로 효과가 없습니다. retry와 catch는 stateIn 앞에 둡니다.<\/li>\n<\/ul>"},{"no":40,"t":"코루틴 사이 공유 상태는 어떻게 보호합니까? Mutex, 단일 스레드 제한, MutableStateFlow.update, Atomic은 각각 언제 씁니까?","a":"<p>임계 구역 안에 중단 지점이 있으면 Mutex, 상태를 한곳에 가두고 순차 처리하면 되면 limitedParallelism(1)이나 상태를 가진 코루틴 하나, StateFlow로 노출하는 상태의 읽고 고치고 쓰기는 update, 중단 없는 단일 값 연산은 Atomic을 씁니다. synchronized는 블록 안에서 suspend 함수를 부를 수 없고 기다리는 동안 스레드를 막으므로 코루틴 코드의 기본 선택이 아닙니다. 다만 중단이 없는 짧은 임계 구역이라면 synchronized나 Atomic이 Mutex보다 빠릅니다.<\/p>\n<p>Mutex의 lock은 suspend 함수라 기다리는 동안 스레드를 다른 코루틴에 넘겨주고, withLock 블록 안에서 suspend 호출도 할 수 있습니다. 함정은 재진입이 안 된다는 점입니다. 문서에 non-reentrant라고 적혀 있듯이 같은 코루틴이 withLock 안에서 같은 Mutex를 다시 잡으면 자기 자신을 기다리는 Deadlock이 됩니다. 락을 잡은 채 오래 걸리는 네트워크 호출을 하면 다른 코루틴이 모두 기다리고, 두 Mutex를 서로 다른 순서로 잡아도 Deadlock이 납니다. 코루틴은 재개할 때 스레드가 바뀔 수 있으므로 ReentrantLock이나 ThreadLocal처럼 스레드 소유권을 전제로 하는 도구는 코루틴 코드에 쓰지 않습니다. Mutex가 맞는 대표 사례는 토큰 갱신 같은 single-flight입니다. 401을 받은 요청 여러 개가 동시에 갱신하면 갱신 API가 여러 번 불리고, 리프레시 토큰을 갱신 때마다 바꾸는 서버라면 앞의 갱신 결과가 뒤의 갱신 때문에 무효가 됩니다. Mutex로 한 번에 하나만 갱신하고, 락을 얻은 뒤 실패한 요청의 토큰과 지금 저장된 토큰이 다른지 다시 확인해 이미 다른 코루틴이 갱신했으면 그 토큰을 씁니다.<\/p>\n<p>limitedParallelism(1) Dispatcher에서 실행하는 코드는 중단 지점 사이의 구간이 순차 실행되고 구간 사이에 happens-before가 보장되어, 락 없이 카운터나 캐시 맵을 다룰 수 있습니다. 하지만 문서가 직접 \"Mutex가 아니다\"라고 경고합니다. 동시에 실행되는 스레드 수만 제한하므로 한 코루틴이 delay나 네트워크 호출로 중단하면 다른 코루틴이 들어옵니다. 읽기, 중단, 쓰기가 한 덩어리로 원자적이어야 하면 Mutex를 쓰거나, Channel로 메시지를 받아 순서대로 처리하는 코루틴 하나에 상태를 가둡니다.<\/p>\n<p>MutableStateFlow.update { }는 CAS를 반복해 원자적으로 갱신하며, 경합하면 함수가 여러 번 실행될 수 있다고 문서에 적혀 있습니다. 그래서 그 함수는 이전 상태로 새 상태만 계산하는 순수 함수여야 하고, 안에서 로그 전송이나 네트워크 호출 같은 사이드 이펙트를 일으키면 안 됩니다. Atomic은 java.util.concurrent.atomic의 AtomicInteger, AtomicReference가 중단 없는 단일 값 연산에 가장 가볍습니다. Kotlin 공통 원자 타입인 kotlin.concurrent.atomics는 아직 Experimental입니다. 여러 값을 함께 바꿔야 하면 불변 객체로 묶어 AtomicReference나 StateFlow에 통째로 교체합니다.<\/p>\n<pre class=\"kotlin\"><code>class TokenRefresher(private val api: AuthApi, private val store: TokenStore) {\n    private val mutex = Mutex()\n\n    suspend fun refresh(failedToken: String): String = mutex.withLock {\n        val current = store.accessToken()\n        if (current != failedToken) return current           // 다른 코루틴이 이미 갱신함\n        val tokens = api.refresh(store.refreshToken())       // 갱신 호출은 한 번만\n        store.save(tokens)\n        tokens.accessToken\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>state.value = state.value.copy(...)의 문제는?<\/strong> 읽기와 쓰기 사이에 다른 코루틴의 갱신이 끼어들면 덮어써서 손실됩니다. update를 씁니다.<\/li>\n<li><strong>Channel을 쓰는 액터 방식은 limitedParallelism(1)과 무엇이 다릅니까?<\/strong> 상태를 가진 코루틴 하나가 메시지를 하나씩 끝까지 처리하므로, 중단 지점이 있는 처리도 다른 메시지와 섞이지 않습니다. limitedParallelism(1)에서는 중단 지점에서 다른 코루틴이 끼어들 수 있습니다.<\/li>\n<li><strong>update에 넘긴 함수 안에서 카운터를 올리면?<\/strong> 경합 때 함수가 여러 번 실행되어 카운터가 실제 갱신 횟수보다 많이 올라갑니다. 사이드 이펙트는 update 밖에서 처리합니다.<\/li>\n<\/ul>"},{"no":41,"t":"코루틴과 Flow 코드는 어떻게 테스트합니까?","a":"<p>kotlinx-coroutines-test의 runTest로 테스트 본문을 실행하고, 코드 안의 Dispatcher는 주입받아 같은 스케줄러를 쓰는 TestDispatcher로 바꿉니다. runTest는 가상 시간으로 delay를 건너뛰고, 본문에서 시작한 코루틴이 모두 끝날 때까지 기다리며, 테스트 전체에 기본 60초 timeout을 둡니다. Flow는 Turbine으로 나오는 값을 순서대로 확인하고, StateFlow는 value를 직접 검사하는 쪽을 기본으로 합니다.<\/p>\n<p>TestDispatcher는 두 가지입니다. StandardTestDispatcher는 runTest의 기본이고, 새 코루틴을 바로 실행하지 않고 스케줄러 큐에 넣었다가 advanceUntilIdle, advanceTimeBy, runCurrent로 진행시킬 때 실행합니다. 실행 순서를 통제해야 하는 동시성 테스트에 맞습니다. UnconfinedTestDispatcher는 새 코루틴에 즉시 진입하므로 테스트가 간단해지고 수집 코루틴이 바로 재개되어 StateFlow나 Channel의 값을 건너뛰지 않지만, 여러 코루틴의 실행 순서는 보장하지 않습니다. 어느 쪽이든 한 테스트의 TestDispatcher는 모두 하나의 스케줄러를 공유해야 가상 시간이 맞습니다.<\/p>\n<p>로컬 단위 테스트에는 Android 메인 스레드가 없으므로 Dispatchers.Main을 쓰는 viewModelScope는 그대로 돌지 않습니다. Dispatchers.setMain으로 Main을 TestDispatcher로 바꾸고 끝나면 resetMain을 부르며, 보통 JUnit rule로 묶습니다. setMain 뒤에 만든 TestDispatcher는 Main의 스케줄러를 자동으로 공유합니다. 프로덕션 코드가 Dispatchers.IO나 Default를 직접 쓰면 그 부분은 실제 스레드에서 돌아 가상 시간 밖에 놓입니다. 특히 TestCoroutineScheduler를 모르는 Default 안의 delay는 건너뛰지 않으므로, Dispatcher를 주입받게 만드는 것이 테스트 가능성의 전제입니다. 현재 시각에 의존하는 로직은 Kotlin 2.3.0에서 Stable이 된 kotlin.time.Clock 같은 시계를 주입해 고정합니다.<\/p>\n<p>Flow는 끝나는 Flow라면 first()나 toList()로 충분합니다. 끝나지 않는 Hot Flow를 수집하는 코루틴은 backgroundScope에서 띄우면 테스트가 끝날 때 자동으로 취소됩니다. Turbine은 test { } 블록 안에서 awaitItem()으로 값을 하나씩 받아 확인하게 해 줍니다. StateFlow는 conflation 때문에 중간 값을 모두 받는다는 보장이 없어서 Android 문서는 value를 검사하라고 권하고, WhileSubscribed나 Lazily로 만든 StateFlow는 수집자가 있어야 업스트림이 시작되므로 backgroundScope에서 수집자를 하나 띄웁니다. runTest의 timeout은 kotlinx.coroutines 1.7.0에서 기본 10초로 들어왔다가 1.8.0에서 60초로 바뀌었고, runTest(timeout = ...)이나 JVM 시스템 속성으로 조정합니다.<\/p>\n<pre class=\"kotlin\"><code>class SearchViewModelTest {\n    @get:Rule val mainRule = MainDispatcherRule()          // setMain과 resetMain을 묶은 rule\n\n    @Test fun showsResultsAfterDebounce() = runTest {\n        val viewModel = SearchViewModel(FakeSearchRepository(results = fakePlaces))\n        backgroundScope.launch(UnconfinedTestDispatcher(testScheduler)) {\n            viewModel.results.collect()                     // WhileSubscribed 업스트림 시작\n        }\n        viewModel.onQueryChange(&quot;강남역&quot;)\n        advanceTimeBy(301)                                  // 가상 시간으로 debounce 통과\n        assertEquals(SearchUiState.Success(fakePlaces), viewModel.results.value)\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>runTest 안에서 끝나지 않는 수집 코루틴은 어떻게 합니까?<\/strong> backgroundScope에서 실행하면 테스트가 끝날 때 자동으로 취소됩니다.<\/li>\n<li><strong>viewModelScope를 쓰는 ViewModel은 어떻게 테스트합니까?<\/strong> Main을 TestDispatcher로 바꾸고 같은 스케줄러로 진행시켜 상태를 확인합니다.<\/li>\n<li><strong>Compose UI 테스트도 같은 원리입니까?<\/strong> Compose 1.11부터 v2 테스트 API가 기본이 되었고, v2는 StandardTestDispatcher를 써서 시작된 코루틴이 가상 시계를 진행할 때까지 기다립니다. 코루틴이 바로 실행된다고 가정한 예전 테스트는 시간을 진행시키도록 고쳐야 합니다.<\/li>\n<\/ul>"},{"no":42,"t":"RxJava 코드를 코루틴과 Flow로 옮긴다면 어떤 순서와 기준으로 진행합니까?","a":"<p>한 번에 바꾸지 않고 kotlinx-coroutines-rx3로 경계를 이으면서 데이터 계층부터 바깥쪽으로 옮깁니다. 옮기기 전에 기존 동작을 고정하는 테스트를 먼저 쓰고, Single은 suspend 함수, Observable과 Flowable은 Flow, BehaviorSubject는 StateFlow, PublishSubject는 SharedFlow, Scheduler는 Dispatcher, Disposable은 Job과 스코프로 대응시키되, 배압과 오류 처리의 의미가 다른 지점은 하나씩 확인합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>RxJava<\/th>\n<th>코루틴과 Flow<\/th>\n<th>확인할 차이<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Single, Maybe, Completable<\/td>\n<td>suspend 함수(T, T?, Unit 반환)<\/td>\n<td>취소는 호출한 스코프가 결정<\/td>\n<\/tr>\n<tr>\n<td>Observable, Flowable<\/td>\n<td>Flow<\/td>\n<td>Flow는 emit이 중단되는 방식으로 배압 처리<\/td>\n<\/tr>\n<tr>\n<td>BehaviorSubject<\/td>\n<td>MutableStateFlow<\/td>\n<td>초기값 필수, equals로 중복 제거, 완료와 오류 없음<\/td>\n<\/tr>\n<tr>\n<td>PublishSubject<\/td>\n<td>MutableSharedFlow<\/td>\n<td>구독자가 없으면 값을 버림, 버퍼 설정 필요<\/td>\n<\/tr>\n<tr>\n<td>subscribeOn, observeOn<\/td>\n<td>flowOn, 수집하는 코루틴의 Dispatcher<\/td>\n<td>flowOn은 자기 위쪽만 바꿈<\/td>\n<\/tr>\n<tr>\n<td>Disposable, CompositeDisposable<\/td>\n<td>Job, CoroutineScope<\/td>\n<td>스코프 취소로 한 번에 정리<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>순서는 이렇습니다. 첫째, 옮길 체인의 동작을 테스트로 고정합니다. 값의 순서, 오류, 재시도, 실행 스레드를 확인하는 테스트가 있어야 의미 차이를 잡을 수 있습니다. 둘째, 데이터 계층부터 바꿉니다. Retrofit은 suspend 함수를, Room은 suspend DAO와 Flow 반환을 지원하므로 Rx 어댑터를 걷어 낼 수 있고, Room 3.0은 RxJava 연동을 별도 아티팩트로 옮겼습니다. 셋째, 아직 Rx를 쓰는 상위 계층에는 kotlinx-coroutines-rx3의 rxSingle, Flow.asObservable(), Flow.asFlowable()로 내보내고, 반대로 Rx 소스를 코루틴에서 쓸 때는 SingleSource.await()와 ObservableSource.asFlow()를 씁니다. Flowable을 Flow로 바꾸는 확장은 kotlinx-coroutines-reactive 모듈에 있습니다. 넷째, 도메인과 ViewModel로 올라가며 CompositeDisposable을 viewModelScope로 바꾸고, 마지막에 Rx 의존성을 지웁니다.<\/p>\n<p>의미 차이는 네 가지를 봅니다. 배압은 Observable에는 없고 Flowable은 요청 수 기반인데, Flow는 emit이 중단되는 방식이라 별도 전략이 없으면 생산이 소비를 기다립니다. onBackpressureLatest는 conflate, onBackpressureDrop은 DROP_LATEST를 준 buffer에 대응합니다. onBackpressureBuffer()는 업스트림을 무제한으로 받아 두므로 buffer(Channel.UNLIMITED)에 대응하고, 용량을 준 onBackpressureBuffer(capacity)는 넘치면 MissingBackpressureException 오류로 끝나므로 차면 생산을 중단시키는 Flow의 buffer와 동작이 다릅니다. 오류는 둘 다 스트림을 끝내지만, StateFlow는 완료와 실패를 표현할 수 없어 BehaviorSubject에 onError를 보내던 코드는 오류를 상태 값으로 바꿔야 합니다. onErrorReturn은 catch에서 emit하는 것으로, Rx의 retryWhen은 Flow의 retryWhen으로 옮깁니다. 중복은 StateFlow가 같은 값을 다시 내보내지 않으므로, BehaviorSubject에 같은 값을 다시 넣어 화면을 강제로 갱신하던 코드는 동작이 달라집니다. 스레드는 subscribeOn이 체인 어디에 있든 소스 쪽 스레드를 정하는 반면 flowOn은 자기 위쪽만 바꾸므로, 연산자 위치를 옮길 때 실행 스레드가 바뀌지 않았는지 테스트로 확인합니다.<\/p>\n<pre class=\"kotlin\"><code>// 데이터 계층은 suspend와 Flow로 바꾸고\ninterface PlaceRepository {\n    suspend fun detail(id: String): Place                  // 이전 Single&lt;Place&gt;\n    fun favorites(): Flow&lt;List&lt;Place&gt;&gt;                     // 이전 Observable&lt;List&lt;Place&gt;&gt;\n}\n\n// 아직 Rx를 쓰는 화면에는 브리지로 내보낸다\nfun PlaceRepository.detailSingle(id: String): Single&lt;Place&gt; = rxSingle { detail(id) }\nfun PlaceRepository.favoritesObservable(): Observable&lt;List&lt;Place&gt;&gt; = favorites().asObservable()\n\n// 반대 방향: 남아 있는 Rx 소스를 코루틴에서 쓸 때\nsuspend fun legacyToken(): String = legacyAuth.tokenSingle().await()<\/code><\/pre>","f":"<ul>\n<li><strong>subscribeOn과 flowOn은 같습니까?<\/strong> 비슷하지만 다릅니다. subscribeOn은 체인 어디에 두어도 구독이 시작되는 소스 쪽 스레드를 정하고 소스에 가장 가까운 것이 적용되며, flowOn은 자기 위쪽 연산자만 바꾸고 구간마다 다르게 둘 수 있습니다.<\/li>\n<li><strong>CompositeDisposable.clear()에 해당하는 것은?<\/strong> 스코프 취소입니다. viewModelScope는 ViewModel이 clear될 때 자동으로 취소되므로 onCleared에서 dispose를 부를 필요가 없습니다. 다만 코루틴 취소는 협력적이라 dispose처럼 즉시 멈춘다고 가정하면 안 됩니다.<\/li>\n<li><strong>옮기는 동안 스레드 풀이 두 벌로 늘어나는 것은 어떻게 막습니까?<\/strong> Scheduler.asCoroutineDispatcher나 CoroutineDispatcher.asScheduler로 한쪽 스레드 풀을 다른 쪽에서 쓰게 해 전환 기간에 스레드 수가 불어나지 않게 합니다.<\/li>\n<\/ul>"}]},{"no":3,"title":"Jetpack Compose","qs":[{"no":43,"t":"Compose는 선언형 UI를 어떻게 구현합니까? 컴포지션, 레이아웃, 드로잉 단계 중 어디서 상태를 읽느냐에 따라 무엇이 달라집니까?","a":"<p>Compose의 UI는 상태를 받아 화면을 기술하는 컴포저블 함수의 실행 결과입니다. 상태가 바뀌면 View를 직접 고치지 않고 그 상태를 읽은 함수만 다시 실행하며, 런타임이 이전 결과와 비교해 바뀐 부분만 UI 트리에 반영합니다. 한 프레임은 컴포지션, 레이아웃, 드로잉 세 단계로 처리되고, 상태를 읽은 단계부터 다시 실행되므로 읽는 위치가 곧 비용을 정합니다.<\/p>\n<p>원리는 컴파일러 플러그인에 있습니다. Compose 컴파일러는 @Composable 함수마다 Composer 파라미터와 파라미터 변경 여부를 담는 비트 마스크 파라미터를 추가하고, 본문을 그룹으로 감쌉니다. 런타임은 실행 중에 생긴 그룹, remember한 값, 파라미터를 슬롯 테이블에 실행 순서대로 기록해 두고, 다음 실행 때 같은 위치의 값과 비교해 무엇이 바뀌었는지 판단합니다. 컴포지션이 만든 LayoutNode 트리를 레이아웃 단계에서 측정하고 배치한 뒤, 드로잉 단계에서 Canvas에 그립니다.<\/p>\n<p>상태 읽기는 단계별로 따로 추적됩니다. 컴포저블 본문에서 읽으면 값이 바뀔 때 그 범위의 리컴포지션부터 레이아웃, 드로잉까지 모두 다시 돕니다. Modifier.offset { }이나 Layout의 측정 람다처럼 레이아웃 단계에서 읽으면 리컴포지션을 건너뛰고 레이아웃부터, drawBehind { } 같은 그리기 람다에서 읽으면 드로잉만 다시 합니다. 스크롤 위치나 애니메이션 값처럼 매 프레임 바뀌는 값은 가능한 한 뒤 단계에서 읽는 것이 Compose 성능 최적화의 출발점입니다.<\/p>\n<pre class=\"kotlin\"><code>val y by animateFloatAsState(targetY)\n// 세 줄은 바꿔 쓰는 대안이다. 함께 두면 첫 줄 때문에 범위 전체가 매 프레임 리컴포지션된다\nBox(Modifier.offset(y = y.dp))                    // 컴포지션에서 읽음: 매 프레임 리컴포지션\nBox(Modifier.offset { IntOffset(0, y.toInt()) })  // 레이아웃에서 읽음: 배치부터 다시\nBox(Modifier.drawBehind { drawCircle(color, radius = y) })  // 드로잉에서 읽음: 그리기만 다시<\/code><\/pre>","f":"<ul>\n<li><strong>레이아웃 단계는 어떻게 동작합니까?<\/strong> 부모가 제약을 내려 보내면 자식이 크기를 정해 올려 보내고, 부모가 자식의 위치를 정합니다. Compose는 자식을 한 번만 측정하도록 강제해 트리가 깊어져도 측정 횟수가 불어나지 않게 하고, 미리 크기를 알아야 하면 intrinsic 측정을 씁니다.<\/li>\n<li><strong>슬롯 테이블이 위치 기반이라 생기는 문제는 없습니까?<\/strong> 반복문에서 항목 순서가 바뀌면 위치로 짝지어진 remember 값이 다른 항목에 붙을 수 있습니다. 그래서 key()로 항목의 정체성을 지정하며, LazyColumn의 key도 같은 이유로 씁니다.<\/li>\n<li><strong>슬롯 테이블 구현이 바뀐다는 이야기는 무엇입니까?<\/strong> Compose 1.11에서 새 SlotTable 구현이 Experimental로 들어왔고 기본으로 꺼져 있습니다. runtime 1.11.0 노트는 ComposeRuntimeFlags.isLinkBufferComposerEnabled로 켜면 긴 목록의 재배치 리컴포지션이 2배 넘게 빨라질 수 있다고 적었습니다. 앱 코드를 바꾸는 변화는 아닙니다.<\/li>\n<\/ul>"},{"no":44,"t":"리컴포지션은 언제 일어나고, 범위는 어떻게 정해집니까?","a":"<p>리컴포지션은 컴포지션 중에 읽힌 Snapshot 상태가 바뀌었을 때, 그 상태를 읽은 가장 가까운 재시작 가능 범위에서 일어납니다. 부모가 다시 실행되며 자식에게 파라미터를 넘기면 자식도 다시 실행될 수 있는데, 파라미터가 이전과 같으면 그 자식은 건너뜁니다. 범위의 단위는 화면 전체가 아니라 상태를 읽은 함수입니다.<\/p>\n<p>컴파일러는 Unit을 반환하는 컴포저블 함수와 컴포저블 람다를 restartable로 만들어 그 범위만 따로 다시 실행할 수 있게 하고, 파라미터 비교로 실행을 생략할 수 있으면 skippable로 표시합니다. Column, Row, Box는 inline 함수라서 content 람다가 호출한 함수 안에 펼쳐지므로 별도 범위가 생기지 않습니다. Column 안에서 상태를 읽으면 Column을 감싼 함수 전체가 다시 실행되는 이유이고, 범위를 좁히려면 상태를 읽는 부분을 별도 컴포저블로 떼어 냅니다. 값을 반환하는 컴포저블도 restartable이 아니어서 호출한 쪽 범위에 묶입니다.<\/p>\n<p>리컴포지션은 낙관적으로 실행됩니다. 진행 중에 상태가 다시 바뀌면 Compose는 진행 중이던 리컴포지션을 취소하고 새 값으로 다시 시작할 수 있으며, 취소된 결과는 버려집니다. 그래서 컴포저블은 몇 번, 어떤 순서로 실행되든 같은 입력에 같은 UI를 내야 하고, 실행 횟수와 순서에 기대면 안 됩니다. 본문에서 로그 전송, 네트워크 요청, ViewModel 함수 호출, 외부 변수 쓰기 같은 사이드 이펙트를 실행하면 취소된 실행이나 반복 실행에서도 그 작업이 일어나 중복 호출과 불일치가 생깁니다. 이런 작업은 이벤트 콜백이나 LaunchedEffect, SideEffect 같은 이펙트 API로 옮깁니다.<\/p>\n<pre class=\"kotlin\"><code>@Composable\nfun ResultHeader(state: SearchState) {  // state.count는 mutableIntStateOf로 만든 상태\n    Column {                            // inline이라 별도 범위가 아님\n        Title()                         // 파라미터가 없으니 건너뜀\n        Text(&quot;결과 ${state.count}건&quot;)    // count가 바뀌면 ResultHeader 범위가 다시 실행됨\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>컴포지션 중에 상태를 쓰면 어떻게 됩니까?<\/strong> 방금 읽은 상태를 같은 컴포지션에서 바꾸면 범위가 다시 무효화되어 리컴포지션이 반복될 수 있습니다. 공식 문서가 backwards write라고 부르며 피하라고 하는 패턴이고, 상태 쓰기는 이벤트 콜백이나 이펙트에서 합니다.<\/li>\n<li><strong>리컴포지션 횟수는 어떻게 확인합니까?<\/strong> Android Studio Layout Inspector에서 컴포저블별 리컴포지션 횟수와 건너뛴 횟수를 봅니다. 기대보다 많이 도는 곳은 넓은 범위에서 상태를 읽는지, 파라미터가 매번 새 인스턴스인지 확인합니다.<\/li>\n<li><strong>remember 값은 리컴포지션 사이에 어떻게 유지됩니까?<\/strong> 값이 슬롯 테이블의 해당 위치에 저장되어, 같은 위치가 다시 실행되면 저장된 값을 돌려줍니다. 그 위치가 컴포지션에서 빠지면 값도 사라집니다.<\/li>\n<\/ul>"},{"no":45,"t":"안정성(@Stable, @Immutable)과 strong skipping 모드는 무엇이고, 지금은 무엇이 달라졌습니까?","a":"<p>안정성은 Compose 컴파일러가 파라미터 타입에 내리는 판정으로, 안정 타입은 equals 결과가 일관되고 값이 바뀌면 컴포지션에 알려지거나 아예 바뀌지 않는다고 봅니다. 예전에는 불안정 파라미터가 하나라도 있으면 그 컴포저블을 건너뛸 수 없었지만, Kotlin 2.0.20부터 strong skipping 모드가 기본으로 켜져 재시작 가능한 모든 컴포저블이 건너뛰기 대상이 되었습니다. 지금은 안정 파라미터는 equals로, 불안정 파라미터는 인스턴스 동일성(===)으로 비교합니다.<\/p>\n<p>컴파일러는 기본 타입, String, 함수 타입, 안정 타입의 val만 가진 클래스를 안정으로 추론합니다. var 프로퍼티가 있거나, List, Set, Map처럼 구현이 가변일 수 있는 인터페이스 타입을 가지거나, 안정성을 알 수 없는 외부 모듈 타입을 쓰면 불안정으로 봅니다. List는 읽기 전용 인터페이스일 뿐 실제 객체가 ArrayList일 수 있기 때문입니다. 그래서 strong skipping 이전에는 List를 받는 컴포저블이 항상 다시 실행되었고, @Immutable 래퍼나 kotlinx.collections.immutable로 우회했습니다.<\/p>\n<p>strong skipping에서는 같은 List 인스턴스를 넘기면 건너뛰고 새 인스턴스일 때만 다시 실행합니다. 따라서 내용이 같아도 본문에서 filter나 map으로 매번 새 리스트를 만들면 여전히 건너뛰지 못합니다. 컴포저블 안의 람다는 캡처한 값을 키로 자동 remember되어 람다 때문에 건너뛰기가 깨지는 일도 줄었고, 제외가 필요하면 @NonSkippableComposable, @DontMemoize를 씁니다.<\/p>\n<p>@Immutable은 생성 뒤 공개 프로퍼티가 절대 바뀌지 않는다는 약속, @Stable은 바뀔 수 있지만 바뀌면 Snapshot 상태로 알린다는 약속입니다. 컴파일러가 검증하지 않으므로 약속을 어기면 화면이 갱신되지 않습니다. 고칠 수 없는 외부 타입은 composeCompiler { stabilityConfigurationFiles.add(...) }로 지정한 안정성 설정 파일에 적고, 판단은 reportsDestination으로 뽑은 컴파일러 보고서(classes.txt의 클래스 안정성, composables.txt의 restartable과 skippable 여부)로 합니다.<\/p>\n<p>판단 기준도 바뀌었습니다. 현재 공식 진단 문서는 strong skipping에서 불안정 타입이 그 자체로 고칠 문제는 아니고, 컬렉션을 담은 모델을 억지로 안정으로 만들면 리컴포지션마다 항목 전체를 equals로 비교하는 비용이 생긴다고 설명합니다. 같은 값의 새 인스턴스가 자주 만들어지고 벤치마크로 병목이 확인될 때만 안정성을 손봅니다. Kotlin 2.4.0에서는 StrongSkipping 플래그와 DSL 속성이 ERROR 수준 deprecated가 되었고 2.5.0에서 제거될 예정이라, 이 모드를 끄는 빌드 설정은 지워야 합니다.<\/p>\n<pre class=\"kotlin\"><code>@Composable\nfun PlaceSection(places: List&lt;Place&gt;, query: String) {\n    PlaceList(places.filter { it.name.contains(query) })  // 매번 새 List라 PlaceList를 못 건너뜀\n    val filtered = remember(places, query) { places.filter { it.name.contains(query) } }\n    PlaceList(filtered)  // 입력이 같으면 같은 인스턴스라 건너뜀\n}<\/code><\/pre>","f":"<ul>\n<li><strong>StateFlow로 받은 List도 매번 새 인스턴스입니까?<\/strong> StateFlow는 equals로 같은 값이면 내보내지 않으므로 내용이 같은 새 리스트는 화면까지 오지 않습니다. 문제는 컴포저블 본문이나 UI 매핑 단계에서 매번 새 리스트를 만드는 경우입니다.<\/li>\n<li><strong>@Stable을 잘못 붙이면 어떻게 됩니까?<\/strong> 컴파일러가 equals 결과를 믿고 건너뛰므로, 내부 var가 알림 없이 바뀌면 화면이 옛 값으로 남습니다. 약속을 지킬 수 없는 타입에는 붙이지 않습니다.<\/li>\n<li><strong>Kotlin 2.4.0에서 안정성 추론은 무엇이 바뀌었습니까?<\/strong> 다른 파일에 있는 internal 타입의 안정성을 런타임에 추론해 증분 컴파일 결과를 일관되게 했습니다. 최종 안정성 값과 동작은 같고, 산출물이 커질 수 있지만 R8 같은 전체 앱 최적화가 쓰지 않는 경로를 지웁니다.<\/li>\n<\/ul>"},{"no":46,"t":"remember, rememberSaveable, retain, ViewModel에는 각각 어떤 상태를 둡니까?","a":"<p>기준은 그 상태가 어떤 사건을 넘어 살아남아야 하느냐입니다. remember는 컴포지션 안에서만, rememberSaveable은 Bundle에 저장되어 구성 변경과 프로세스 종료까지, retain은 구성 변경 동안 직렬화 없이 같은 인스턴스로, ViewModel은 소유자(Activity나 내비게이션 항목)가 살아 있는 동안 유지됩니다. UI 요소의 상태는 앞의 세 가지로, 비즈니스 로직에서 나온 화면 상태는 ViewModel에 둡니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>방법<\/th>\n<th>컴포지션에서 빠짐<\/th>\n<th>구성 변경<\/th>\n<th>프로세스 종료<\/th>\n<th>백 스택에 갔다 돌아옴<\/th>\n<th>둘 상태<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>remember<\/td>\n<td>사라짐<\/td>\n<td>사라짐<\/td>\n<td>사라짐<\/td>\n<td>사라짐<\/td>\n<td>계산 캐시, 애니메이션과 상호작용 객체<\/td>\n<\/tr>\n<tr>\n<td>rememberSaveable<\/td>\n<td>사라짐(LazyColumn 항목처럼 저장 상태 홀더가 있으면 복원)<\/td>\n<td>유지<\/td>\n<td>유지<\/td>\n<td>유지(내비게이션이 저장 상태 관리)<\/td>\n<td>입력 중인 값, 선택한 탭, 펼침 여부<\/td>\n<\/tr>\n<tr>\n<td>retain<\/td>\n<td>사라짐<\/td>\n<td>유지(같은 인스턴스)<\/td>\n<td>사라짐<\/td>\n<td>사라짐(Navigation과 Navigation 3의 retain 지원은 공식 문서상 향후 릴리스 예정)<\/td>\n<td>직렬화할 수 없고 다시 만들기 비싼 객체<\/td>\n<\/tr>\n<tr>\n<td>ViewModel<\/td>\n<td>영향 없음<\/td>\n<td>유지<\/td>\n<td>사라짐(SavedStateHandle 값은 복원)<\/td>\n<td>유지(항목 범위일 때)<\/td>\n<td>화면 UI 상태, 진행 중인 작업<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>rememberSaveable은 Bundle에 들어가는 타입은 그대로 저장하고, 그 밖의 타입은 @Parcelize나 Saver(listSaver, mapSaver)로 바꿔 저장합니다. 저장된 상태는 Binder 트랜잭션으로 시스템에 넘어가는데, Binder 트랜잭션 버퍼는 1MB이고 프로세스에서 진행 중인 모든 트랜잭션이 함께 씁니다. 목록 데이터를 넣지 말고 검색어나 선택한 ID 같은 작은 값만 저장한 뒤 데이터는 다시 읽습니다. LazyColumn 항목 안의 rememberSaveable도 항목 key 기준으로 저장되어, 스크롤로 나갔다 돌아오면 복원됩니다.<\/p>\n<p>retain은 Compose 1.10에서 runtime-retain 아티팩트로 추가되었습니다. Android에서는 컴포지션 루트에 구성 변경 동안 값을 유지하는 저장소가 설치되어, 회전해도 플레이어 같은 객체를 다시 만들지 않습니다. 기본 구현인 ForgetfulRetainedValuesStore가 쓰이는 곳에서는 remember와 똑같이 동작하고, 프로세스 종료 뒤에는 남지 않습니다. 컴포저블보다 오래 살기 때문에 공식 문서는 Context나 Context를 참조하는 객체(View 포함)를 retain하지 말라고 경고합니다.<\/p>\n<p>ViewModel에는 Repository에서 받은 데이터와 그 가공 결과, 진행 중인 코루틴 작업을 둡니다. 프로세스 종료 뒤에도 필요한 작은 값은 SavedStateHandle에 둡니다. 스크롤 위치, 펼침 여부, 포커스처럼 화면 요소에만 의미가 있는 UI 로직 상태까지 ViewModel에 올리면 ViewModel이 커지고 재사용이 어려워지므로 컴포저블이나 상태 홀더에 둡니다.<\/p>","f":"<ul>\n<li><strong>rememberSaveable과 SavedStateHandle은 어떻게 나눕니까?<\/strong> 둘 다 같은 저장 경로를 씁니다. 검색어처럼 ViewModel이 요청에 쓰는 값은 SavedStateHandle에, 펼침 여부처럼 순수 UI 요소의 상태는 rememberSaveable에 둡니다.<\/li>\n<li><strong>retain이 ViewModel을 대체합니까?<\/strong> 아닙니다. retain은 컴포지션 위치에 묶인 객체를 구성 변경 동안 살려 두는 도구입니다. 비즈니스 로직, 테스트할 수 있는 상태 노출, 내비게이션 항목 범위 관리는 여전히 ViewModel 몫입니다.<\/li>\n<li><strong>retain과 rememberSaveable을 한 객체에 같이 쓰려면?<\/strong> 공식 문서는 두 수명이 섞인 객체가 필요하다면 먼저 SavedStateHandle을 쓰는 ViewModel이어야 한다는 신호일 수 있다고 봅니다. 상태가 컴포저블 범위에 묶여 ViewModel이 맞지 않을 때만 저장할 상태, retain할 상태, 상태 없이 둘에 위임하는 중개 객체로 나누라고 하며, 두 수명을 함께 다루면 복잡도가 크게 늘어난다고 경고합니다.<\/li>\n<\/ul>"},{"no":47,"t":"상태 호이스팅과 단방향 데이터 흐름은 무엇이고, stateful과 stateless 컴포저블은 어떻게 나눕니까?","a":"<p>상태 호이스팅은 컴포저블이 내부에 들고 있던 상태를 호출한 쪽으로 끌어올리고, 대신 현재 값과 변경 요청 콜백을 파라미터로 받게 하는 것입니다. 그러면 상태는 위에서 아래로 내려가고 이벤트는 아래에서 위로 올라가는 단방향 데이터 흐름이 됩니다. 상태의 소유자가 한 곳이라 같은 값을 두 군데서 따로 들고 있다가 어긋날 일이 없습니다.<\/p>\n<p>어디까지 올릴지는 그 상태를 읽고 쓰는 컴포저블들의 가장 낮은 공통 부모가 기준입니다. 필요보다 높이 올리면 상관없는 범위까지 리컴포지션되고 중간 컴포저블에 전달용 파라미터만 늘어나며, 너무 낮으면 형제 컴포저블이 같은 상태를 공유할 수 없습니다. 비즈니스 로직이 필요한 상태는 화면 수준의 ViewModel까지 올라가고, 스크롤이나 펼침 같은 UI 요소 상태는 그 요소 가까이에 둡니다.<\/p>\n<p>보통 한 화면을 두 겹으로 만듭니다. stateless 컴포저블은 상태와 콜백만 받아 그리므로 Preview와 UI 테스트에서 원하는 상태를 바로 넣어 볼 수 있고 다른 화면에서도 재사용됩니다. stateful 컴포저블은 상태를 만들거나 ViewModel에서 받아 stateless 버전에 넘기는 얇은 진입점입니다. ViewModel은 화면 진입점에서만 받고 하위에는 필요한 값과 람다만 넘깁니다. 깊은 컴포저블까지 ViewModel을 넘기면 그 컴포저블이 ViewModel 생성 방식에 묶여 Preview와 테스트가 어려워지고 재사용도 막힙니다.<\/p>\n<p>UI 요소 상태가 여러 개이고 로직이 붙으면 상태 홀더 클래스로 묶습니다. LazyListState와 rememberLazyListState()처럼 상태와 동작을 클래스에 담고 rememberXxxState() 함수로 만들어 기억하는 형태가 Compose 표준 API의 관례이고, 저장이 필요하면 Saver를 함께 제공해 rememberSaveable로 만듭니다.<\/p>\n<pre class=\"kotlin\"><code>@Composable\nfun SearchRoute(viewModel: SearchViewModel = hiltViewModel()) {  // stateful 진입점\n    val uiState by viewModel.uiState.collectAsStateWithLifecycle()\n    SearchScreen(uiState = uiState, onPlaceClick = viewModel::onPlaceClick)\n}\n\n@Composable\nfun SearchScreen(uiState: SearchUiState, onPlaceClick: (String) -&gt; Unit, modifier: Modifier = Modifier) {\n    // 상태를 받아 그리기만 하는 stateless 화면: Preview와 테스트에서 상태를 바로 주입\n}<\/code><\/pre>","f":"<ul>\n<li><strong>상태를 너무 높이 올리면 무엇이 나빠집니까?<\/strong> 그 상태가 바뀔 때 상위 범위가 다시 실행되고, 중간 컴포저블이 쓰지도 않는 값을 전달하게 됩니다. 값 대신 값을 읽는 람다를 넘기거나 상태 홀더를 내려 보내 읽는 위치를 좁힙니다.<\/li>\n<li><strong>호이스팅을 선택 사항으로 만들려면?<\/strong> 상태 홀더 파라미터에 rememberXxxState() 기본값을 줍니다. 호출한 쪽이 넘기면 호이스팅되고, 넘기지 않으면 내부에서 관리됩니다. LazyColumn의 state 파라미터가 이 방식입니다.<\/li>\n<li><strong>이벤트 콜백은 어떤 단위로 넘깁니까?<\/strong> 화면 진입점에서는 sealed 이벤트 하나를 받는 람다로 묶기도 하고, 재사용 컴포넌트에서는 onClick, onValueChange처럼 의미별 람다를 둡니다. Presentation 계층이 MVI라면 앞의 방식이 Reducer로 이어지기 쉽습니다.<\/li>\n<\/ul>"},{"no":48,"t":"derivedStateOf는 언제 쓰고, remember(key) { }와는 무엇이 다릅니까?","a":"<p>derivedStateOf는 자주 바뀌는 상태로부터 그보다 드물게 바뀌는 결과를 만들 때 씁니다. 블록에서 읽은 상태가 바뀌면 다시 계산하지만, 결과가 이전과 같으면 그 결과를 읽는 쪽을 무효화하지 않습니다. 스크롤 위치는 매 프레임 바뀌어도 맨 위로 버튼을 보일지는 가끔만 바뀌므로, 버튼을 그리는 컴포저블은 결과가 바뀔 때만 리컴포지션됩니다.<\/p>\n<p>remember(key) { }는 키가 바뀌면 블록을 다시 계산하는 캐시입니다. 키는 컴포지션에서 읽은 값이므로 키가 바뀌었다는 것은 이미 리컴포지션이 일어났다는 뜻이고, 리컴포지션 횟수를 줄여 주지는 않습니다. 정렬 기준이 바뀔 때만 목록을 다시 정렬하는 것처럼 입력이 바뀌면 결과도 바뀌는 비싼 계산에 맞습니다. derivedStateOf는 Snapshot 상태 읽기를 직접 추적해 결과의 변화만 전파하므로, 입력이 출력보다 자주 바뀔 때 의미가 있습니다.<\/p>\n<p>흔한 실수는 두 가지입니다. 첫째, remember 없이 derivedStateOf를 쓰면 리컴포지션마다 새 객체가 만들어져 효과가 없습니다. 둘째, 입력과 출력의 변화 빈도가 같은 곳에 쓰는 경우입니다. 이름과 성을 이어 붙이는 계산은 입력이 바뀔 때마다 결과도 바뀌므로 추적 비용만 더해지고, 그냥 계산하거나 remember(firstName, lastName)으로 충분합니다. 또 derivedStateOf 블록 안에서 Snapshot 상태가 아닌 일반 파라미터를 읽으면 그 값의 변화는 추적되지 않으므로, 그 파라미터를 remember 키로 넘기거나 rememberUpdatedState로 감싸야 합니다.<\/p>\n<pre class=\"kotlin\"><code>val listState = rememberLazyListState()\n// 스크롤 위치는 매 프레임 바뀌지만 결과는 true와 false 사이에서만 바뀜\nval showScrollToTop by remember {\n    derivedStateOf { listState.firstVisibleItemIndex &gt; 0 }\n}\n// 정렬 기준이나 목록이 바뀔 때만 다시 정렬하는 키 기반 캐시\nval sorted = remember(places, sortOrder) { places.sortedWith(sortOrder.comparator) }<\/code><\/pre>","f":"<ul>\n<li><strong>스크롤 위치로 툴바 투명도를 바꾸는 것도 derivedStateOf로 합니까?<\/strong> 투명도는 스크롤과 같은 빈도로 바뀌므로 derivedStateOf가 줄여 줄 것이 없습니다. graphicsLayer { } 람다 안에서 스크롤 값을 직접 읽어 리컴포지션 없이 처리합니다.<\/li>\n<li><strong>ViewModel 상태에서 파생 값을 만들 때도 derivedStateOf를 씁니까?<\/strong> ViewModel 상태가 StateFlow라면 map과 distinctUntilChanged가 같은 역할을 합니다. 파생 값은 따로 저장하지 않고 원본에서 계산하며, 한 계층 안에서는 한 가지 방식으로 맞춥니다.<\/li>\n<\/ul>"},{"no":49,"t":"LaunchedEffect, DisposableEffect, SideEffect, rememberUpdatedState, produceState는 각각 언제 씁니까?","a":"<p>모두 컴포저블 본문에 둘 수 없는 사이드 이펙트를 컴포지션 생명주기에 맞춰 실행하는 API입니다. LaunchedEffect는 컴포지션에 들어올 때 코루틴을 시작하고 키가 바뀌면 취소 후 재시작하며 떠날 때 취소합니다. DisposableEffect는 등록하면 반드시 해제해야 하는 작업, SideEffect는 리컴포지션이 적용될 때마다 Compose 상태를 외부 객체에 맞추는 작업에 쓰고, rememberUpdatedState는 오래 도는 이펙트에서 최신 값을 읽을 때, produceState는 콜백이나 Flow 같은 외부 값을 State로 바꿀 때 씁니다.<\/p>\n<p>키 설계가 핵심입니다. 이펙트는 키가 바뀌면 이전 작업을 정리하고 다시 시작하므로, 키에는 바뀌면 작업을 처음부터 다시 해야 하는 값만 넣습니다. LaunchedEffect(Unit)처럼 바뀌지 않는 키는 컴포지션에 머무는 동안 한 번만 실행된다는 뜻입니다. 이때 블록에서 파라미터로 받은 콜백을 쓰면 처음 캡처한 콜백이 계속 쓰이므로, rememberUpdatedState로 감싸 최신 콜백을 읽습니다. 반대로 매번 바뀌는 값을 키로 넣으면 이펙트가 계속 재시작되어 타이머나 요청이 끝나지 않습니다.<\/p>\n<p>DisposableEffect는 onDispose 블록이 필수라서 리스너 등록과 해제, 생명주기 관찰자 추가와 제거처럼 정리를 빠뜨리면 누수가 나는 작업에 맞습니다. SideEffect는 리컴포지션 결과가 적용된 뒤에만 실행되므로, 분석 SDK에 현재 사용자 속성을 넘기는 것처럼 Compose가 관리하지 않는 객체를 Compose 상태와 맞출 때 씁니다. compose-runtime 1.12.0에서는 키를 받는 SideEffect 오버로드가 추가되었습니다. produceState는 초기값을 받고 블록 안의 코루틴에서 value를 갱신하는 State 생산자이며, awaitDispose로 콜백 해제를 연결합니다. 버튼 클릭처럼 사용자 동작으로 시작하는 코루틴은 이펙트가 아니라 rememberCoroutineScope로 얻은 스코프에서 콜백 안에서 시작합니다.<\/p>\n<pre class=\"kotlin\"><code>@Composable\nfun GuidanceScreen(onTimeout: () -&gt; Unit, onStop: () -&gt; Unit) {\n    val currentOnTimeout by rememberUpdatedState(onTimeout)\n    val currentOnStop by rememberUpdatedState(onStop)\n    LaunchedEffect(Unit) {          // 한 번만 시작하고 콜백이 바뀌어도 재시작하지 않음\n        delay(TIMEOUT_MS)\n        currentOnTimeout()          // 항상 최신 콜백을 호출\n    }\n    val lifecycle = LocalLifecycleOwner.current.lifecycle\n    DisposableEffect(lifecycle) {   // 등록과 해제를 짝으로\n        val observer = LifecycleEventObserver { _, e -&gt; if (e == Lifecycle.Event.ON_STOP) currentOnStop() }\n        lifecycle.addObserver(observer)\n        onDispose { lifecycle.removeObserver(observer) }\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>LaunchedEffect 키에 콜백 람다를 넣으면 어떻게 됩니까?<\/strong> 호출한 쪽에서 캡처 값이 바뀔 때마다 새 람다가 오므로 이펙트가 계속 재시작됩니다. 콜백은 키에 넣지 않고 rememberUpdatedState로 읽습니다.<\/li>\n<li><strong>LaunchedEffect 안에서 Flow를 collect하면 생명주기는 어떻게 됩니까?<\/strong> 컴포지션에 있는 동안 계속 수집하므로 앱이 백그라운드로 가도 멈추지 않습니다. 화면이 보일 때만 수집해야 하면 collectAsStateWithLifecycle을 쓰거나 이펙트 안에서 repeatOnLifecycle(Lifecycle.State.STARTED)로 감쌉니다.<\/li>\n<li><strong>produceState와 collectAsState는 어떤 관계입니까?<\/strong> collectAsState는 produceState로 Flow를 수집하는 특수한 경우입니다. 콜백 API를 감싸거나 여러 소스를 합쳐 State 하나를 만들 때 produceState를 직접 씁니다.<\/li>\n<\/ul>"},{"no":50,"t":"Compose 상태와 Flow는 어떻게 잇습니까? collectAsStateWithLifecycle과 snapshotFlow는 각각 어느 방향입니까?","a":"<p>collectAsStateWithLifecycle은 Flow를 Compose State로 바꾸는 방향이고, snapshotFlow는 Compose State를 Flow로 바꾸는 방향입니다. ViewModel이 내보내는 StateFlow는 collectAsStateWithLifecycle로 받아 그리고, 스크롤 위치처럼 Compose가 가진 상태를 로깅하거나 ViewModel로 흘려보낼 때 snapshotFlow를 씁니다.<\/p>\n<p>collectAsStateWithLifecycle은 lifecycle-runtime-compose에 있으며, Lifecycle이 minActiveState 이상일 때만 수집하고 그 아래로 내려가면 수집을 멈춥니다. minActiveState의 기본값은 Lifecycle.State.STARTED입니다. collectAsState는 컴포지션에 있는 동안 계속 수집하므로, 앱이 백그라운드에 있어도 위치나 DB 구독 같은 업스트림이 계속 돌 수 있습니다. 그래서 Android 화면 코드에서는 collectAsStateWithLifecycle이 기본 선택입니다. StateFlow는 현재 값을 초기값으로 쓰고 일반 Flow는 initialValue를 반드시 넘겨야 하는데, 첫 프레임은 이 초기값으로 그려지므로 로딩 상태를 초기값으로 모델링해 두면 빈 화면이 깜빡이지 않습니다.<\/p>\n<p>snapshotFlow { }는 블록에서 읽은 Snapshot 상태가 바뀔 때마다 블록을 다시 계산하고, 결과가 이전 값과 같으면 내보내지 않습니다. distinctUntilChanged가 내장된 것과 같아서 자주 바뀌는 상태라도 계산 결과가 달라질 때만 흐릅니다. 보통 LaunchedEffect 안에서 수집하고 뒤에 filter, map, debounce를 붙여 노출 로깅이나 스크롤 깊이 측정을 만듭니다. 블록 안에서는 Snapshot 상태만 추적되므로 일반 변수를 읽으면 변경을 감지하지 못합니다.<\/p>\n<pre class=\"kotlin\"><code>val uiState by viewModel.uiState.collectAsStateWithLifecycle()  // Flow → State\n\nval listState = rememberLazyListState()\nLaunchedEffect(listState) {                                    // State → Flow\n    snapshotFlow { listState.isScrollInProgress }\n        .filter { scrolling -&gt; !scrolling }                    // 스크롤이 멈출 때마다\n        .collect { logImpressions(listState.layoutInfo.visibleItemsInfo.map { it.key }) }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>collectAsStateWithLifecycle은 ViewModel의 stateIn과 어떻게 맞물립니까?<\/strong> 화면이 STARTED 아래로 내려가면 구독이 끊기고, stateIn에 WhileSubscribed를 썼다면 정해 둔 시간이 지난 뒤 업스트림도 멈춥니다. 회전처럼 잠깐 끊기는 동안 업스트림을 유지하는 기준은 2절의 stateIn 문항에서 다룹니다.<\/li>\n<li><strong>Flow를 LaunchedEffect에서 collect해 mutableStateOf에 넣으면 안 됩니까?<\/strong> 동작은 하지만 생명주기에 따른 중지와 재시작, 초기값, 취소를 직접 챙겨야 합니다. collectAsStateWithLifecycle이 같은 일을 표준 방식으로 처리합니다.<\/li>\n<li><strong>snapshotFlow를 ViewModel에서도 쓸 수 있습니까?<\/strong> ViewModel이 TextFieldState 같은 Snapshot 상태를 들고 있다면 viewModelScope에서 snapshotFlow로 감싸 요청 Flow로 이을 수 있습니다. 검색창 문항에서 이 구조를 다룹니다.<\/li>\n<\/ul>"},{"no":51,"t":"Snapshot 시스템은 어떻게 동작합니까? 백그라운드 스레드에서 mutableStateOf 값을 바꿔도 안전합니까?","a":"<p>Snapshot 시스템은 Compose 상태 객체를 위한 다중 버전 동시성 제어입니다. 상태 객체는 값 하나가 아니라 스냅샷 ID가 붙은 레코드 목록을 들고 있고, 각 스냅샷은 자기가 볼 수 있는 레코드만 읽습니다. 공식 아키텍처 가이드는 UI 상태를 메인 디스패처에서 만들기를 권하고, 백그라운드에서 Compose 상태를 바꿔야 하면 Snapshot.withMutableSnapshot으로 감싸 원자적으로 갱신하라고 하며, 감싸지 않으면 만든 상태가 어긋날 수 있다고 경고합니다. 값 하나를 쓰는 것 자체는 전역 스냅샷에 반영되어 화면도 갱신되지만, 읽고 계산한 뒤 다시 쓰는 연산과 여러 상태를 차례로 바꾸는 경우에는 경쟁 조건과 중간 상태 노출이 남습니다.<\/p>\n<p>스냅샷을 열면 그 시점의 상태 값이 격리되어 보이고, 안에서 쓴 값은 apply 전까지 다른 스냅샷에 보이지 않습니다. 스냅샷에는 읽기 관찰자와 쓰기 관찰자를 달 수 있어서, Compose는 컴포지션을 스냅샷 안에서 실행하며 어떤 범위가 어떤 상태를 읽었는지 기록합니다. 컴포지션 밖의 일반 코드는 전역 스냅샷에서 읽고 씁니다. 전역 스냅샷의 변경은 Snapshot.sendApplyNotifications()가 호출될 때 적용 알림으로 퍼지는데, Android의 Compose UI는 전역 쓰기가 생기면 메인 스레드에서 이 알림을 보내도록 예약합니다. Recomposer는 적용 알림을 받아 그 상태를 읽은 범위를 무효화하고 다음 프레임에 리컴포지션합니다.<\/p>\n<p>남는 문제는 경쟁 조건입니다. 두 스레드가 동시에 값을 읽어 1을 더해 쓰면 둘 다 같은 이전 값을 읽었으므로 증가 하나가 사라집니다. 여러 상태를 차례로 바꾸는 동안 다른 쪽이 중간 상태를 볼 수도 있습니다. Snapshot.withMutableSnapshot { }은 블록 안의 쓰기를 한 번에 적용해 중간 상태가 보이지 않게 하고, 같은 상태를 다른 쪽이 먼저 바꿔 적용할 수 없으면 SnapshotApplyConflictException을 던집니다. 블록 안에서는 suspend하면 안 되므로 오래 걸리는 계산은 블록 밖에서 끝냅니다. 목록은 mutableStateListOf로 만들면 add와 remove가 추적되고, 불변 리스트를 쓴다면 통째로 새 리스트로 교체합니다. 실무에서는 상태 쓰기를 메인 스레드나 MutableStateFlow.update처럼 원자적 갱신을 주는 한 곳으로 모으는 편이 단순합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 경로와 도착 예정 시각을 한 번에 바꿔 중간 상태가 보이지 않게 함\nviewModelScope.launch(defaultDispatcher) {   // 주입한 Default 디스패처\n    val result = computeRoute()\n    Snapshot.withMutableSnapshot {\n        routeState.value = result.route\n        etaState.value = result.eta\n    }\n}\n// 경쟁 조건: 여러 스레드가 동시에 실행하면 증가가 사라질 수 있음\ncounter.value = counter.value + 1<\/code><\/pre>","f":"<ul>\n<li><strong>백그라운드에서 쓴 값은 언제 화면에 반영됩니까?<\/strong> 쓰기는 바로 보이지만 Recomposer가 반응하는 것은 적용 알림이 간 뒤입니다. Android에서는 Compose UI가 이 알림을 메인 스레드에 예약하므로 다음 프레임에 반영됩니다.<\/li>\n<li><strong>다른 스레드에서 새로 만든 상태 객체도 바로 보입니까?<\/strong> compose-runtime 1.7.0부터 새로 만든 상태 객체는 초기값 상태로 전역 스냅샷을 포함한 다른 스냅샷에서 바로 보입니다.<\/li>\n<li><strong>ViewModel에는 StateFlow와 Snapshot 상태 중 무엇을 둡니까?<\/strong> 둘 다 가능합니다. Flow 연산자와 코루틴 테스트 도구를 쓰려면 StateFlow를, TextFieldState처럼 Compose API가 Snapshot 상태를 요구하면 그 상태를 둡니다. 한 화면 안에서 두 방식이 섞이는 범위는 줄입니다.<\/li>\n<\/ul>"},{"no":52,"t":"Modifier 순서는 왜 결과를 바꾸고, 커스텀 Modifier는 왜 Modifier.Node로 만듭니까?","a":"<p>Modifier 체인은 왼쪽에서 오른쪽 순서로, 바깥에서 안쪽으로 감싸며 적용됩니다. 각 Modifier가 뒤에 오는 Modifier와 콘텐츠를 감싸므로, 앞의 Modifier가 뒤의 것이 받을 제약과 그릴 영역을 정합니다. 그래서 같은 Modifier라도 순서를 바꾸면 크기, 배경 범위, 터치 영역이 달라집니다.<\/p>\n<p>Modifier.padding(16.dp).background(color)는 여백을 먼저 두고 남은 영역에만 배경을 칠하고, background를 앞에 두면 여백까지 칠합니다. clickable도 같아서 clickable { }.padding(16.dp)이면 여백까지 터치되고, padding(16.dp).clickable { }이면 여백은 터치되지 않습니다. 작은 아이콘의 터치 영역을 넓히려면 clickable을 padding 앞에 둡니다. size를 두 번 이어 쓰면 바깥 제약이 먼저 고정되어 뒤의 값이 무시되는 것도 같은 원리입니다.<\/p>\n<p>커스텀 Modifier는 Modifier.Node로 만듭니다. 공식 문서는 Modifier.Node를 Compose가 자체 Modifier 구현에 쓰는 하위 수준 API이자 커스텀 Modifier를 만드는 가장 성능 좋은 방법으로 설명하고, composed { }는 성능 문제로 더 이상 권장하지 않습니다. composed { }는 일반 함수라 바깥으로 끌어올릴 수는 있지만, 적용된 요소마다 컴포지션 때 factory 람다를 실행해 그 요소의 Modifier를 만드는 방식입니다. @Composable 확장 함수로 만든 Modifier는 컴포지션 안에서만 만들 수 있어 바깥으로 끌어올려 재사용할 수 없고, 값을 반환하는 컴포저블이라 건너뛸 수 없어 리컴포지션마다 다시 실행됩니다. 이 방식은 CompositionLocal을 사용 위치가 아니라 Modifier를 만든 위치에서 읽는 함정도 있습니다.<\/p>\n<p>Modifier.Node 방식은 두 부분으로 나뉩니다. ModifierNodeElement는 인자만 담은 가벼운 값이고, 리컴포지션에서 새 Element가 이전 Element와 equals로 같으면 아무것도 하지 않고, 다르면 기존 Node의 update()만 호출합니다. Node 인스턴스는 리컴포지션을 넘어 유지되면서 상태를 들고, DrawModifierNode, LayoutModifierNode, PointerInputModifierNode 같은 인터페이스로 그리기, 측정, 입력 처리에 직접 참여합니다. 그래서 data class로 Element를 만들어 equals를 정확히 정의하는 것이 재사용의 전제입니다.<\/p>\n<pre class=\"kotlin\"><code>fun Modifier.circle(color: Color) = this then CircleElement(color)\n\nprivate data class CircleElement(val color: Color) : ModifierNodeElement&lt;CircleNode&gt;() {\n    override fun create() = CircleNode(color)\n    override fun update(node: CircleNode) { node.color = color }  // equals가 다를 때만 호출\n}\n\nprivate class CircleNode(var color: Color) : DrawModifierNode, Modifier.Node() {\n    override fun ContentDrawScope.draw() {\n        drawCircle(color)\n        drawContent()\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>composed { }로 만든 Modifier는 어떻게 옮깁니까?<\/strong> 인자는 ModifierNodeElement의 프로퍼티로, remember하던 상태는 Node의 필드로, LaunchedEffect로 하던 작업은 Node가 붙어 있는 동안 쓸 수 있는 coroutineScope와 onAttach, onDetach로 옮깁니다.<\/li>\n<li><strong>기존 Modifier를 묶기만 하는 것도 Node로 만들어야 합니까?<\/strong> 아닙니다. padding과 background를 이어 붙이는 정도라면 체인을 반환하는 Modifier 확장 함수로 충분합니다. 직접 측정하거나 그리거나 입력을 처리하거나 상태를 가져야 할 때 Node로 만듭니다.<\/li>\n<\/ul>"},{"no":53,"t":"LazyColumn의 성능을 지키려면 무엇을 챙깁니까?","a":"<p>첫 번째는 화면이 아니라 데이터입니다. 항목이 많으면 전체를 한 번에 불러오지 말고 Paging 3처럼 필요한 만큼 나눠 불러오며, 끝에 가까워지면 다음 페이지를 미리 요청합니다. 화면 쪽에서는 LazyColumn이 보이는 근처 항목만 컴포지션하고, Compose도 RecyclerView처럼 화면 밖으로 나간 항목의 컴포지션을 새로 들어오는 항목에 재사용합니다. 그 위에서 key로 항목의 정체성을 지키고, contentType으로 같은 종류끼리 재사용되게 하고, 항목 하나를 그리는 비용을 줄입니다.<\/p>\n<p>항목 상태는 기본으로 목록 안 위치에 묶입니다. 앞에 항목이 끼어들거나 순서가 바뀌면 위치가 바뀐 항목은 remember 값과 가로 스크롤 위치를 잃거나 다른 항목의 상태를 받습니다. items(places, key = { it.id })처럼 안정적이고 고유한 키를 주면 위치가 바뀌어도 상태가 항목을 따라가고, 항목 안 rememberSaveable도 키 기준으로 복원됩니다. 키는 Bundle에 넣을 수 있는 타입이어야 합니다. contentType은 Compose 1.2부터 지정할 수 있고, 지정하면 같은 타입 항목끼리만 컴포지션을 재사용합니다. 헤더, 장소 카드, 광고가 섞인 목록에서 타입을 주지 않으면 구조가 전혀 다른 항목 위에 다시 컴포지션하느라 재사용 이득이 줄어듭니다. 재사용될 때 remember 값은 초기화되므로 항목 상태는 키 기반 rememberSaveable이나 상위 상태에 둡니다.<\/p>\n<p>항목 비용도 줄여야 합니다. 항목 파라미터는 같은 입력이면 같은 인스턴스가 오도록 UI 모델을 ViewModel에서 미리 만들어 두고, 항목 안에서 정렬, 문자열 포맷팅, 큰 객체 생성 같은 계산을 하지 않습니다. 불안정 타입을 억지로 안정으로 바꾸기보다 인스턴스를 유지하는 것이 먼저입니다. 이미지는 Coil 같은 로더로 표시 크기에 맞춰 디코딩하고 로딩 전에도 같은 크기의 placeholder를 둡니다. 크기가 0인 항목이 있으면 첫 측정에서 화면에 모두 들어간다고 계산해 많은 항목을 한꺼번에 컴포지션하고, 로딩 뒤 크기가 바뀌며 스크롤 위치도 흔들립니다.<\/p>\n<p>같은 방향으로 스크롤되는 Column(verticalScroll) 안에 높이가 정해지지 않은 LazyColumn을 넣으면 IllegalStateException이 납니다. 헤더와 목록은 하나의 LazyColumn 안에 item과 items로 함께 넣습니다. 성능은 릴리스 빌드에 R8을 켠 상태에서만 제대로 측정되고, 디버그 빌드의 스크롤은 실제보다 느리게 보입니다. 첫 스크롤의 JIT 비용은 Baseline Profile로 줄입니다.<\/p>\n<pre class=\"kotlin\"><code>val places = viewModel.places.collectAsLazyPagingItems()      // 나눠 불러오기\nLazyColumn {\n    item(contentType = &quot;header&quot;) { SearchHeader() }\n    items(\n        count = places.itemCount,\n        key = places.itemKey { it.id },                        // 항목 정체성과 상태 보존\n        contentType = places.itemContentType { &quot;place&quot; },      // 같은 종류끼리 재사용\n    ) { index -&gt;\n        val place = places[index]\n        if (place != null) PlaceRow(place) else PlaceRowPlaceholder()  // 로딩 중에도 같은 크기\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>RecyclerView의 재사용과 무엇이 다릅니까?<\/strong> RecyclerView는 ViewHolder의 View 객체를 재사용하고 onBindViewHolder로 데이터를 다시 묶습니다. LazyColumn은 항목의 컴포지션을 재사용하고 새 파라미터로 리컴포지션하며, 재사용 단위를 contentType으로 나눕니다.<\/li>\n<li><strong>미리 컴포지션하는 범위를 조정할 수 있습니까?<\/strong> Compose 1.9에서 prefetch 범위를 정하는 LazyLayoutCacheWindow가 추가되었고, compose-foundation 1.13.0-alpha01에서 Stable이 되었습니다. 범위를 늘리면 스크롤은 부드러워질 수 있지만 메모리와 사전 작업이 늘어나므로 측정하고 정합니다.<\/li>\n<li><strong>스크롤 버벅임이 리컴포지션 때문인지는 어떻게 압니까?<\/strong> Layout Inspector로 항목의 리컴포지션 횟수를 보고, Macrobenchmark의 FrameTimingMetric과 Perfetto 트레이스로 프레임이 어디서 늦는지 봅니다. 상위에서 스크롤 위치를 직접 읽어 목록 전체가 매 프레임 리컴포지션되는 경우가 흔합니다.<\/li>\n<\/ul>"},{"no":54,"t":"스크롤 위치나 애니메이션 값처럼 매 프레임 바뀌는 상태를 읽을 때 성능을 어떻게 지킵니까?","a":"<p>원칙은 상태 읽기를 가능한 한 늦추는 것입니다. 매 프레임 바뀌는 값을 컴포저블 본문에서 읽으면 매 프레임 리컴포지션, 레이아웃, 드로잉이 모두 다시 돕니다. 같은 값을 레이아웃 단계나 드로잉 단계에서 읽으면 앞 단계를 건너뛰므로, 값을 쓰는 쪽을 람다 기반 API로 바꾸는 것이 핵심입니다.<\/p>\n<p>첫째, 람다를 받는 Modifier를 씁니다. 위치는 Modifier.offset(x, y) 대신 offset { IntOffset(...) }, 투명도와 크기 변환은 Modifier.alpha 대신 graphicsLayer { alpha = ... }, 배경색 애니메이션은 background 대신 drawBehind { drawRect(color) }로 바꿉니다. 람다 안에서 읽으면 각각 배치, 레이어 속성, 그리기만 다시 합니다.<\/p>\n<p>둘째, 값 대신 람다를 넘깁니다. 부모가 scrollState.value를 읽어 자식에게 Int로 넘기면 부모 범위가 매 프레임 리컴포지션됩니다. 자식에게 () -&gt; Int 타입의 람다를 넘기고 자식이 람다 Modifier 안에서 호출하면, 실제 읽기가 자식의 레이아웃 단계로 내려가 부모와 자식 모두 리컴포지션되지 않습니다.<\/p>\n<p>셋째, 임계값만 필요하면 derivedStateOf를 씁니다. 툴바 그림자를 보일지, 맨 위로 버튼을 보일지처럼 결과가 가끔만 바뀌는 값은 derivedStateOf로 만들어 결과가 바뀔 때만 리컴포지션되게 합니다. 투명도처럼 결과도 매 프레임 바뀌는 값은 derivedStateOf가 아니라 첫째 방법으로 처리합니다.<\/p>\n<pre class=\"kotlin\"><code>@Composable\nfun CollapsingHeader(scrollProvider: () -&gt; Int, modifier: Modifier = Modifier) {\n    Box(\n        modifier\n            .offset { IntOffset(x = 0, y = -scrollProvider()) }      // 레이아웃 단계에서 읽음\n            .graphicsLayer { alpha = headerAlpha(scrollProvider()) }  // 레이어 속성만 갱신\n    )\n}\n// 부모는 값을 읽지 않고 람다만 넘긴다: CollapsingHeader(scrollProvider = { scrollState.value })<\/code><\/pre>","f":"<ul>\n<li><strong>graphicsLayer { }와 Modifier.graphicsLayer(alpha = x)는 무엇이 다릅니까?<\/strong> 파라미터 버전은 값을 컴포지션에서 읽으므로 값이 바뀔 때마다 리컴포지션이 일어납니다. 람다 버전은 레이어 블록 안에서 읽어 리컴포지션과 레이아웃 없이 레이어 속성만 갱신합니다.<\/li>\n<li><strong>람다로 바꿨는데도 매 프레임 리컴포지션이 보이면?<\/strong> 람다 밖에서 같은 상태를 또 읽는 곳을 찾습니다. animate*AsState 결과를 by로 받은 뒤 본문에서 텍스트 표시 등에 한 번이라도 쓰면 그 읽기 때문에 범위 전체가 다시 실행됩니다.<\/li>\n<\/ul>"},{"no":55,"t":"Compose 화면의 성능 문제는 어떻게 찾고 고칩니까?","a":"<p>측정 조건부터 맞춥니다. 디버그 빌드는 최적화가 꺼져 있고 R8도 적용되지 않아 실제보다 느리게 보이며, Compose는 플랫폼에 들어 있지 않고 앱과 함께 배포되는 라이브러리라 첫 실행 성능이 Baseline Profile 적용 여부에 좌우됩니다. R8을 켠 릴리스 빌드에 Baseline Profile을 적용한 상태에서 증상을 수치로 고정하고, 원인을 좁히고, 고친 뒤 같은 조건으로 다시 재는 순서로 진행합니다.<\/p>\n<p>수치는 Macrobenchmark로 고정합니다. Macrobenchmark는 별도 com.android.test 모듈에서 앱 시작, LazyColumn 스크롤, 애니메이션 같은 사용자 여정을 자동으로 실행해 측정하고, FrameTimingMetric으로 프레임 시간 분포를 보여 줍니다. 같은 모듈로 Baseline Profile도 만드는데, Baseline Profile은 포함된 코드 경로를 미리 AOT 컴파일해 첫 실행부터 코드 실행을 빠르게 하며 공식 문서는 그 효과를 약 30%로 적습니다. 현장 지표로는 Android vitals의 excessive slow frames(16ms를 넘은 프레임이 50%를 넘는 일일 세션의 비율)를 봅니다.<\/p>\n<p>원인은 도구로 좁힙니다. Layout Inspector에서 컴포저블별 리컴포지션 횟수와 건너뛴 횟수를 보고 기대보다 많이 도는 곳을 찾습니다. composeCompiler 블록의 reportsDestination으로 뽑은 보고서에서 그 컴포저블이 skippable인지와 파라미터 안정성을 보고, metricsDestination으로 모듈 전체 통계를 봅니다. 프레임이 어디서 늦는지는 Perfetto 시스템 트레이스에서 메인 스레드와 RenderThread를 나눠 보고, runtime-tracing 의존성을 추가하면 컴포지션 트레이싱으로 컴포저블 함수 이름까지 트레이스에 나타납니다. 이 기능은 API 30 이상 기기에서 동작합니다.<\/p>\n<p>흔한 원인은 넓은 범위에서 매 프레임 바뀌는 상태를 읽는 코드, 본문에서 매번 새 인스턴스를 만드는 파라미터, LazyColumn의 key와 contentType 누락, 크기가 0인 항목, 원본 크기로 디코딩한 큰 이미지, 메인 스레드 I/O, 레이아웃 크기를 매 프레임 바꾸는 애니메이션입니다. 보고서에 불안정 파라미터가 보인다고 바로 고치지 않고, 같은 값의 새 인스턴스가 자주 만들어지고 측정으로 병목이 확인될 때만 안정성을 손봅니다.<\/p>\n<pre class=\"kotlin\"><code>// 모듈 build.gradle.kts\ncomposeCompiler {\n    reportsDestination = layout.buildDirectory.dir(&quot;compose_compiler&quot;)\n    metricsDestination = layout.buildDirectory.dir(&quot;compose_compiler&quot;)\n}\ndependencies {\n    implementation(&quot;androidx.compose.runtime:runtime-tracing&quot;)  // BOM으로 버전 관리\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Macrobenchmark 결과는 무엇을 비교합니까?<\/strong> 같은 기기, 같은 컴파일 모드에서 프레임 시간의 백분위 분포를 변경 전후로 비교합니다. 사용자가 느끼는 버벅임은 평균보다 느린 쪽 꼬리 구간에 가깝습니다.<\/li>\n<li><strong>R8로 축소한 릴리스 빌드의 Compose 크래시 스택은 어떻게 읽습니까?<\/strong> Kotlin 2.3.0의 Compose 컴파일러는 R8로 축소한 앱의 Compose 스택 트레이스용 ProGuard 매핑을 내보내고, 그룹 키 스택 트레이스에는 Compose runtime 1.10 이상이 필요합니다. 매핑 파일을 크래시 수집 도구에 올리는 단계를 배포 절차에 넣습니다.<\/li>\n<li><strong>실제 사용자 기기의 버벅임은 어떻게 수집합니까?<\/strong> JankStats로 버벅인 프레임과 그때의 UI 상태를 함께 기록합니다. JankStats는 API 24 이상에서 FrameMetrics API 위에서 동작합니다.<\/li>\n<\/ul>"},{"no":56,"t":"CompositionLocal은 언제 쓰고, 남용하면 무엇이 나빠집니까? compositionLocalOf와 staticCompositionLocalOf는 어떻게 다릅니까?","a":"<p>CompositionLocal은 파라미터로 일일이 넘기지 않고 컴포지션 트리 아래로 값을 암묵적으로 전달하는 도구입니다. MaterialTheme의 색과 글꼴, LocalDensity의 화면 밀도, LocalContext처럼 트리 어디서나 쓸 수 있고 좋은 기본값이 있는 값에 맞습니다. 화면 하나의 ViewModel을 넣는 것은 공식 문서가 나쁜 예로 드는 남용이고, Repository 같은 데이터 계층 객체도 같은 이유로 넣지 않습니다.<\/p>\n<p>남용하면 의존이 함수 시그니처에 드러나지 않아 컴포저블의 동작을 추론하기 어렵고, 호출하는 쪽이 필요한 값이 모두 제공되었는지 챙겨야 합니다. 값이 트리 어디서든 바뀔 수 있어 진실 공급원이 흐려지고, 버그가 나면 어디서 값을 제공했는지 위로 거슬러 올라가며 찾아야 합니다. 기본값이 없으면 Preview와 테스트마다 값을 명시적으로 제공해야 합니다. ViewModel을 넣으면 하위 컴포저블 모두가 ViewModel을 알게 되어 상태는 내려가고 이벤트는 올라가는 구조가 깨지고 재사용과 테스트가 어려워집니다. 대안은 명시적 파라미터, 슬롯 API, 상태 홀더입니다.<\/p>\n<p>두 생성 함수는 무효화 범위가 다릅니다. compositionLocalOf는 current를 읽은 곳을 추적해, 제공한 값이 바뀌면 그 값을 읽은 범위만 리컴포지션합니다. staticCompositionLocalOf는 읽기를 추적하지 않는 대신, 값이 바뀌면 그 값을 제공한 CompositionLocalProvider의 content 람다 전체를 리컴포지션합니다. 추적 비용이 없으므로 값이 거의 또는 전혀 바뀌지 않으면 staticCompositionLocalOf가 유리하고, 자주 바뀌는 값에 쓰면 넓은 범위가 다시 실행됩니다. 다크 모드 전환처럼 바뀔 수 있는 테마 값은 compositionLocalOf가 맞습니다.<\/p>\n<pre class=\"kotlin\"><code>val LocalSpacing = staticCompositionLocalOf { Spacing() }    // 앱 실행 중 거의 바뀌지 않음\nval LocalMapColors = compositionLocalOf { MapColors.Light }   // 다크 모드에서 바뀜\n\n@Composable\nfun AppTheme(darkTheme: Boolean, content: @Composable () -&gt; Unit) {\n    CompositionLocalProvider(\n        LocalMapColors provides if (darkTheme) MapColors.Dark else MapColors.Light,\n        content = content,\n    )\n}<\/code><\/pre>","f":"<ul>\n<li><strong>기본값이 없는 CompositionLocal은 어떻게 만듭니까?<\/strong> compositionLocalOf { error(\"값이 제공되지 않았습니다\") }처럼 빠뜨리면 바로 실패하게 만듭니다. 공식 문서는 기본값이 없다면 값을 빠뜨리기 어렵다는 것을 보장할 수 있을 때만 쓰라고 합니다.<\/li>\n<li><strong>다른 CompositionLocal 값에서 계산되는 값은 어떻게 제공합니까?<\/strong> compose-runtime 1.7.0에서 compositionLocalWithComputedDefault()와 providesComputed가 추가되어, 테마 색에서 파생한 값처럼 다른 CompositionLocal 값으로 계산되는 값을 제공할 수 있습니다.<\/li>\n<\/ul>"},{"no":57,"t":"기존 View 기반 화면을 Compose로 점진 전환하려면 어떻게 합니까?","a":"<p>새 화면과 말단 컴포넌트부터 Compose로 만들고, 기존 화면은 상호 운용 API로 섞어 쓰면서 화면 단위로 옮깁니다. View 안에 Compose를 넣을 때는 ComposeView를, Compose 안에 View를 넣을 때는 AndroidView를 씁니다. Google은 2026-05-19 'Android UI Development is Compose First' 글에서 android.widget의 View 컴포넌트를 유지 관리 모드로 두어 새 기능을 넣지 않고, Fragments, RecyclerView, ViewPager 같은 View 기반 라이브러리는 중요한 버그만 고친다고 밝혔습니다. 새 UI는 Compose로 만드는 것이 기본이 되었습니다.<\/p>\n<p>순서는 버튼, 카드, 목록 항목 같은 말단 컴포넌트를 디자인 시스템 컴포넌트로 먼저 만들고, 새 화면은 처음부터 Compose로, 기존 화면은 기능 변경이 생길 때 화면 단위로 옮기는 식입니다. 데이터 계층과 ViewModel은 그대로 두고 UI 계층만 바꾸면 위험이 작습니다. Fragment 안에서는 ComposeView를 반환하고 ViewCompositionStrategy를 DisposeOnViewTreeLifecycleDestroyed로 지정해, Fragment의 View 생명주기에 맞춰 컴포지션을 해제합니다. 기본 전략인 DisposeOnDetachedFromWindowOrReleasedFromPool은 ComposeView가 창에서 떨어질 때 정리하되, RecyclerView 같은 풀링 컨테이너 안에서는 컨테이너가 창에서 떨어지거나 항목이 풀에서 버려질 때 정리하므로 RecyclerView 항목 안의 ComposeView와도 맞물립니다.<\/p>\n<p>반대 방향으로, 아직 Compose 버전이 없는 지도, 광고, 웹뷰는 AndroidView로 넣고, 작은 XML 레이아웃 조각은 AndroidViewBinding으로 넣습니다. Fragment를 Compose 화면에 넣어야 하는 과도기에는 AndroidFragment 컴포저블을 씁니다. 내비게이션은 전환 중에는 Fragment 기반 구조를 유지한 채 각 Fragment의 내용만 Compose로 바꾸고, Compose 화면이 대부분이 되면 Compose 내비게이션으로 옮깁니다. 공식 문서도 Compose만 쓰는 앱이라면 Fragment 없이 단일 Activity와 Navigation 3 같은 최신 내비게이션 라이브러리를 쓰라고 권합니다.<\/p>\n<p>공존 기간의 비용도 관리합니다. 색, 글꼴, 간격을 디자인 토큰으로 한 곳에 정의해 XML 테마와 Compose 테마가 같은 값을 보게 하고, 다크 모드를 두 테마에서 함께 확인합니다. 전환 전후 같은 화면의 시작 시간, 스크롤 프레임, APK 크기를 비교하고, 팀은 상태 호이스팅, 리컴포지션, 이펙트 사용 규칙을 코드 리뷰 기준으로 먼저 맞춘 뒤 공통 컴포넌트와 Preview, 스크린샷 테스트로 사례를 쌓습니다.<\/p>\n<pre class=\"kotlin\"><code>class PlaceDetailFragment : Fragment() {\n    override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View =\n        ComposeView(requireContext()).apply {\n            setViewCompositionStrategy(ViewCompositionStrategy.DisposeOnViewTreeLifecycleDestroyed)\n            setContent { AppTheme { PlaceDetailRoute() } }\n        }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>RecyclerView 항목에 ComposeView를 넣어도 됩니까?<\/strong> 됩니다. 기본 ViewCompositionStrategy는 항목이 화면에서 잠시 떨어질 때가 아니라 풀에서 버려지거나 RecyclerView가 창에서 떨어질 때 컴포지션을 정리하므로 항목 재사용과 맞물립니다. 목록 전체를 옮길 수 있다면 LazyColumn으로 바꾸는 편이 단순합니다.<\/li>\n<li><strong>전환 뒤 성능이 나빠지지 않았는지는 어떻게 확인합니까?<\/strong> 같은 화면을 전환 전후로 Macrobenchmark로 측정해 시작 시간과 프레임 시간을 비교하고, APK 크기 변화를 CI에서 봅니다. Compose 쪽은 릴리스 빌드와 Baseline Profile 조건에서 재야 공정한 비교가 됩니다.<\/li>\n<li><strong>전환 순서를 정하는 기준은 무엇입니까?<\/strong> 변경이 잦은 화면, 새로 만드는 화면, 재사용 컴포넌트가 많은 화면을 먼저 옮기고, 안정적으로 돌고 바뀌지 않는 화면은 뒤로 미룹니다. 이전 자체보다 기능 개발과 함께 옮기는 것이 비용 대비 효과가 큽니다.<\/li>\n<\/ul>"},{"no":58,"t":"지도 SDK처럼 무거운 View를 Compose 화면에 넣을 때 생명주기와 성능에서 무엇을 주의합니까?","a":"<p>지도 View는 AndroidView로 넣되, 한 번 만든 지도 객체를 리컴포지션과 상관없이 유지하고, 화면 생명주기를 지도에 전달하고, 카메라 이동 같은 고빈도 콜백 값을 컴포지션에서 읽는 상태로 올리지 않는 것이 핵심입니다. AndroidView의 factory는 View를 만들 때 한 번, update는 상태를 View에 반영할 때, onReset은 Lazy 목록에서 View를 재사용하기 직전, onRelease는 View가 컴포지션을 떠나 다시 쓰이지 않을 때 불립니다.<\/p>\n<p>update는 View를 만든 직후, 그리고 update 안에서 읽은 상태가 바뀌거나 리컴포지션에서 캡처한 값이 바뀔 때 다시 불리므로 자주 실행될 수 있습니다. 그래서 update에는 마커 목록이나 경로가 이전과 달라졌는지 비교한 뒤 바뀐 것만 지도에 반영하는 가벼운 코드만 두고, 지도 초기화와 리스너 등록은 factory에서 합니다. 공식 문서도 View를 remember로 AndroidView 바깥에 들고 있기보다 factory 안에서 만들라고 권합니다. 아래 코드는 View를 factory에서 만들되, 생명주기 전달 때문에 참조만 홀더에 담는 절충을 쓰고 onRelease에서 그 참조를 비웁니다. onReset은 null이 아니어야 View 재사용이 켜지지만, 지도처럼 무거운 View는 애초에 Lazy 목록 항목에 넣지 않습니다.<\/p>\n<p>MapView 계열은 onCreate부터 onDestroy까지 생명주기 콜백을 직접 받아야 렌더링과 위치 표시 자원을 제때 켜고 끕니다. Compose에서는 LocalLifecycleOwner의 Lifecycle에 LifecycleEventObserver를 DisposableEffect로 등록하고 onDispose에서 해제합니다. 화면이 컴포지션에서 빠지는데 Activity는 살아 있는 경우(다른 화면으로 이동)도 있으므로 onRelease에서 지도를 정리합니다. AndroidView를 key()나 조건문으로 감싸 지도가 다시 만들어지는 구조도 피합니다. 지도를 다시 만들면 타일과 렌더링 컨텍스트를 처음부터 준비하느라 화면이 깜빡이고 메모리가 튑니다.<\/p>\n<p>카메라 이동 콜백은 제스처 중 매 프레임 옵니다. 이 값을 ViewModel 상태로 올려 화면 진입점이나 컴포저블 본문에서 읽으면 그 상태를 받는 지도 위 UI가 매 프레임 리컴포지션되므로, 이동 중 연속 값은 지도 SDK가 갖게 두고 이동이 끝났을 때의 위치와 줌만 ViewModel로 올립니다. 나침반 버튼처럼 이동 중에도 값을 따라가야 하는 UI는 그 값을 지도 가까이의 Snapshot 상태에 두고 graphicsLayer { } 같은 람다 Modifier 안에서만 읽어 리컴포지션 없이 반영합니다. 지도 렌더링에 SurfaceView와 TextureView 중 무엇을 쓰는지는 7절에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 지도 View는 factory에서 한 번 만들고 화면 생명주기를 전달\nval holder = remember { MapViewHolder() }                      // 생명주기 전달용 View 참조만 담는 절충\nval lifecycle = LocalLifecycleOwner.current.lifecycle\nDisposableEffect(lifecycle) {\n    val observer = LifecycleEventObserver { _, event -&gt; holder.view?.forward(event) }  // ON_START → onStart() 식, 파괴는 onRelease에서\n    lifecycle.addObserver(observer)\n    onDispose { lifecycle.removeObserver(observer) }\n}\nAndroidView(\n    factory = { context -&gt; MapView(context).also { holder.view = it } },\n    update = { view -&gt; view.showRouteIfChanged(route) },       // 바뀐 값만 반영\n    onRelease = { view -&gt; view.onDestroy(); holder.view = null },  // 정리하고 참조를 비움\n)<\/code><\/pre>","f":"<ul>\n<li><strong>지도 카메라 위치는 누가 소유합니까?<\/strong> 사용자가 지도를 움직이는 동안의 연속 값은 지도 SDK가 진실 공급원이고, 이동이 끝난 위치와 줌만 ViewModel이 받습니다. 경로 안내처럼 앱이 카메라를 움직여야 할 때는 ViewModel이 목표 카메라를 상태로 내리고, update에서 이전 목표와 다를 때만 이동을 명령합니다.<\/li>\n<li><strong>다른 화면에 다녀올 때마다 지도가 다시 만들어지는 것을 피하려면?<\/strong> 백 스택에 들어간 화면은 컴포지션에서 빠지므로 AndroidView도 해제됩니다. View는 Context를 잡고 있어 ViewModel이나 retain에 보관하면 누수가 나므로, 초기화 비용이 크다면 지도를 루트에 두고 다른 화면을 그 위에 시트나 오버레이로 띄우는 구조를 검토합니다.<\/li>\n<\/ul>"},{"no":59,"t":"Navigation Compose의 type-safe route와 Navigation 3는 무엇이 다르고, 화면 사이 데이터는 어떻게 넘깁니까?","a":"<p>type-safe route는 Navigation 2 라이브러리 위에서 문자열 경로 대신 직렬화 가능한 객체로 목적지를 지정하는 방식이고, Navigation 3는 앱이 백 스택 상태를 직접 소유하는 별도 라이브러리입니다. Navigation 2(androidx.navigation)는 최신 안정 버전이 2.10.2이며, 릴리스 페이지에 유지 관리 모드라 중요한 수정만 받고 새 기능은 계획하지 않는다고 적혀 있습니다. Navigation 3는 1.0.0이 2025-11-19 안정판으로 나왔고 최신 안정 버전은 1.2.1입니다. 화면 사이 데이터는 두 방식 모두 ID 같은 작은 키만 넘기고, 실제 데이터는 다음 화면의 ViewModel이 Repository에서 읽습니다.<\/p>\n<p>type-safe route는 Navigation 2.8.0 안정판부터 쓸 수 있습니다. @Serializable 객체나 data class를 route로 정의하고 <code>composable&lt;PlaceDetail&gt; { }<\/code>로 목적지를 선언한 뒤 navController.navigate(PlaceDetail(id))로 이동하며, 인자는 NavBackStackEntry.toRoute()나 ViewModel의 <code>SavedStateHandle.toRoute&lt;PlaceDetail&gt;()<\/code>로 꺼냅니다. 백 스택은 NavController 안에 있고 앱은 navigate와 popBackStack으로 요청만 합니다. 목적지 안에서 hiltViewModel()이나 viewModel()을 부르면 그 NavBackStackEntry 범위의 ViewModel이 만들어져 화면이 백 스택에 있는 동안 유지됩니다.<\/p>\n<p>Navigation 3에서는 백 스택이 앱이 가진 SnapshotStateList이고, 이동은 그 리스트에 키를 넣고 빼는 일입니다. NavDisplay가 백 스택을 관찰해 entryProvider로 키를 화면으로 바꿔 그립니다. rememberNavBackStack을 쓰려면 키가 NavKey를 구현하고 @Serializable이어야 하며, 이렇게 만든 백 스택은 구성 변경과 프로세스 종료를 넘어 유지됩니다. 항목별 rememberSaveable 상태는 기본 데코레이터인 rememberSaveableStateHolderNavEntryDecorator()가, 항목 범위 ViewModel은 Lifecycle 2.10.0에서 추가된 rememberViewModelStoreNavEntryDecorator()가 맡습니다. 여러 항목을 한 화면에 함께 그리는 Scene으로 목록과 상세 같은 적응형 레이아웃을 만들 수 있고, 1.2.0에서 NavEntry 사이 결과 전달용 Result API와 KMP 딥링크 API가 추가되었습니다. 백 스택을 앱이 소유하므로 딥링크로 들어올 때 필요한 키들을 미리 쌓아 합성 백 스택을 만드는 것도 리스트 조작으로 끝납니다. 어느 방식이든 딥링크 파라미터는 외부 입력이므로 검증합니다.<\/p>\n<p>옮길지는 상황으로 판단합니다. 새 프로젝트나 Compose만 쓰는 앱은 Navigation 3로 시작합니다. 기존 앱이 type-safe route로 잘 돌고 있다면 유지 관리 모드라는 이유만으로 서둘러 옮길 필요는 없고, 큰 화면의 다중 창 레이아웃, 탭별 백 스택이나 조건부 로그인 흐름처럼 백 스택을 직접 다뤄야 하는 요구, KMP 공유가 생길 때 옮깁니다. Navigation 3는 Compose 전용이므로 Fragment 화면이 많으면 Compose 전환이 먼저이고, 공식 문서의 이전 가이드를 따라 단계적으로 진행합니다.<\/p>\n<pre class=\"kotlin\"><code>@Serializable data class PlaceDetail(val placeId: String)\n\ncomposable&lt;PlaceDetail&gt; { PlaceDetailRoute() }                 // Navigation 2: 목적지 선언\nnavController.navigate(PlaceDetail(placeId = place.id))        // ID만 넘김\n\n@HiltViewModel\nclass PlaceDetailViewModel @Inject constructor(\n    savedStateHandle: SavedStateHandle,\n    placeRepository: PlaceRepository,\n) : ViewModel() {\n    private val route = savedStateHandle.toRoute&lt;PlaceDetail&gt;()\n    val place = placeRepository.observePlace(route.placeId)      // 데이터는 Repository에서 읽음\n        .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), null)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>객체 전체를 route에 넣으면 왜 안 됩니까?<\/strong> route 인자는 백 스택의 저장 상태로 Bundle에 들어가므로 크기 한도에 걸릴 수 있고, 화면이 열린 뒤 원본이 바뀌면 낡은 사본을 보여 줍니다. ID만 넘기고 Repository를 진실 공급원으로 둡니다.<\/li>\n<li><strong>이전 화면에 결과를 돌려주려면?<\/strong> Navigation 2에서는 이전 항목의 SavedStateHandle에 값을 넣어 돌려주는 방식을 주로 쓰고, Navigation 3는 1.2.0에서 Result API가 추가되었습니다. 결과가 앱 데이터라면 공유 Repository를 거치는 편이 단순합니다.<\/li>\n<li><strong>Navigation 3에서 ViewModel 범위를 따로 챙겨야 하는 이유는?<\/strong> 데코레이터 없이 viewModel()을 부르면 Activity 범위로 만들어져 화면을 닫아도 ViewModel이 남습니다. rememberViewModelStoreNavEntryDecorator()를 넣어야 항목이 백 스택에서 빠질 때 ViewModelStore도 정리됩니다.<\/li>\n<\/ul>"},{"no":60,"t":"Compose UI 테스트는 어떻게 작성합니까?","a":"<p>Compose UI 테스트는 화면을 Semantics 트리로 보고, finder로 노드를 찾아 동작을 수행하고 단언합니다. createComposeRule()로 컴포저블을 띄운 뒤 onNodeWithText, onNodeWithContentDescription, onNodeWithTag로 찾고 performClick, assertIsDisplayed 같은 API를 씁니다. Compose 1.11부터 v2 테스트 API가 기본이 되고 v1은 deprecated되었는데, v2는 StandardTestDispatcher를 써서 테스트에서 시작된 코루틴이 가상 시계가 진행될 때까지 실행되지 않는다는 점이 가장 큰 변화입니다.<\/p>\n<p>finder는 사용자 관점부터 고릅니다. 텍스트, contentDescription, 역할로 찾으면 접근성 정보도 함께 검증됩니다. 텍스트가 자주 바뀌거나 같은 텍스트가 반복되는 곳에서는 Modifier.testTag를 붙이고 onNodeWithTag로 찾습니다. 여러 자식이 하나로 병합된 버튼의 안쪽 노드를 찾을 때는 useUnmergedTree = true를 씁니다.<\/p>\n<p>동기화는 테스트 규칙이 맡습니다. 규칙은 대기 중인 리컴포지션과 레이아웃이 없는 유휴 상태가 될 때까지 기다린 뒤 다음 줄을 실행하고, Espresso의 idling 리소스와도 연동됩니다. 애니메이션이나 delay처럼 시간에 의존하는 동작은 mainClock.autoAdvance = false로 자동 진행을 끄고 advanceTimeBy로 원하는 시점에 멈춰 단언합니다. Compose가 모르는 비동기 작업은 waitUntil을 쓰거나 가짜 데이터 소스로 바꿉니다. v2로 옮긴 뒤 ViewModel이 데이터를 불렀는데 상태가 아직 Loading이라 실패한다면, 코루틴이 대기열에만 들어가 있는 것이므로 waitForIdle 같은 동기화 API나 시계 진행으로 실행시킵니다. 옮기는 작업 자체는 createComposeRule 같은 진입 API의 import를 androidx.compose.ui.test.junit4.v2 패키지로 바꾸는 것이 기본입니다.<\/p>\n<p>테스트 대상은 상태를 주입받는 stateless 화면입니다. ViewModel과 Hilt를 띄우지 않고 SearchScreen에 원하는 상태를 넣어 로딩, 빈 결과, 오류 표시를 빠르게 검증하고, ViewModel 로직은 JVM 단위 테스트로 따로 봅니다. 레이아웃 회귀는 Paparazzi, Roborazzi, Compose Preview Screenshot Testing 같은 스크린샷 테스트로 잡고, Compose 테스트를 Robolectric 위에서 JVM으로 돌리면 CI 시간이 줄어듭니다.<\/p>\n<pre class=\"kotlin\"><code>class SearchScreenTest {\n    @get:Rule val rule = createComposeRule()  // androidx.compose.ui.test.junit4.v2\n\n    @Test fun emptyResults_showsEmptyMessage() {\n        rule.setContent { SearchScreen(uiState = SearchUiState(results = emptyList()), onPlaceClick = {}) }\n        rule.onNodeWithText(&quot;검색 결과가 없습니다&quot;).assertIsDisplayed()\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>testTag와 텍스트 finder 중 무엇을 먼저 씁니까?<\/strong> 사용자가 보는 텍스트와 접근성 정보로 찾는 것이 먼저입니다. 다국어나 동적 텍스트로 깨지기 쉬운 곳, 같은 항목이 반복되는 목록에서만 testTag를 씁니다.<\/li>\n<li><strong>애니메이션이 있는 화면은 어떻게 테스트합니까?<\/strong> mainClock.autoAdvance를 끄고 advanceTimeBy로 중간 프레임에서 멈춰 상태를 단언합니다. 끝 상태만 보면 된다면 시계를 충분히 진행하거나 waitForIdle로 끝날 때까지 기다립니다.<\/li>\n<li><strong>Robolectric 테스트와 기기 테스트는 어떻게 나눕니까?<\/strong> 상태별 화면 표시와 상호작용은 Robolectric으로 빠르게 많이 돌리고, 실제 렌더링, 성능, 기기별 동작은 기기나 에뮬레이터 테스트로 적게 돌립니다.<\/li>\n<\/ul>"},{"no":61,"t":"다양한 화면 크기와 폴더블, 큰 화면에는 어떻게 대응합니까? Android 16부터는 무엇이 달라졌습니까?","a":"<p>기기 종류가 아니라 앱이 받은 창 크기를 기준으로 레이아웃을 정합니다. material3-adaptive의 currentWindowAdaptiveInfo()로 WindowSizeClass를 구해 너비가 Expanded 이상이면 목록과 상세를 나란히 두고, Medium과 Compact에서는 한 창씩 보여 주는 식으로 바꾸고, 방향 고정에 기대지 않습니다. Android 16 이상 기기에서 targetSdk 36 앱은 최소 너비 600dp 이상 화면이면 방향, 크기 조절, 화면비 제한이 무시되므로, 큰 화면에서 세로 고정으로 버티던 앱도 어떤 창 크기든 받아들이도록 고쳐야 합니다.<\/p>\n<p>공식 문서의 너비 기준은 600dp 미만 Compact, 600dp 이상 840dp 미만 Medium, 840dp 이상 1200dp 미만 Expanded이고, 데스크톱과 외부 디스플레이를 위해 1200dp 이상 1600dp 미만 Large와 1600dp 이상 Extra-large가 추가되었습니다. Large와 Extra-large를 받으려면 currentWindowAdaptiveInfo(supportLargeAndXLargeWidth = true)로 부릅니다. 높이는 480dp 미만이 Compact라서, 가로로 눕힌 폰처럼 너비는 Medium인데 높이가 낮으면 두 창 레이아웃을 피합니다. 창 크기는 분할 화면, 폴더블 접기와 펴기, 데스크톱 창 크기 조절로 실행 중에도 바뀌므로 isTablet 같은 고정 판단을 쓰지 않습니다. 목록과 상세, 내비게이션 형태 전환은 ListDetailPaneScaffold, NavigationSuiteScaffold 같은 적응형 구성 요소로 만듭니다. targetSdk 35부터는 Configuration.screenWidthDp가 시스템 바를 빼지 않은 값을 주므로 레이아웃 분기에는 창 크기 기반 API를 씁니다.<\/p>\n<p>Android 16의 변화는 구체적입니다. sw600dp 이상 디스플레이에서 screenOrientation, resizeableActivity, minAspectRatio, maxAspectRatio, setRequestedOrientation(), getRequestedOrientation()이 무시되고, 앱은 pillarboxing 없이 창 전체를 채웁니다. 예외는 android:appCategory가 게임인 앱, 사용자가 기기의 화면비 설정에서 앱 기본 동작을 고른 경우, sw600dp 미만 화면입니다. PROPERTY_COMPAT_ALLOW_RESTRICTED_RESIZABILITY를 true로 선언하면 임시로 opt-out할 수 있지만 targetSdk 37에서는 쓸 수 없습니다. Google Play가 2026-08-31부터 새 앱과 업데이트에 API 36 이상 타깃을 요구했으므로, 지금 업데이트를 내는 앱은 이 동작을 전제로 대응합니다.<\/p>\n<p>창 크기가 바뀌면 구성 변경으로 Activity가 다시 만들어질 수 있습니다. 화면 상태는 ViewModel과 rememberSaveable에 두어 접거나 펴도 입력값과 스크롤 위치가 유지되게 하고, 한 화면 레이아웃과 두 창 레이아웃 사이를 오갈 때 선택된 항목이 사라지지 않도록 선택 상태를 레이아웃보다 위로 호이스팅합니다.<\/p>","f":"<ul>\n<li><strong>폴더블의 접힌 부분은 어떻게 처리합니까?<\/strong> Jetpack WindowManager의 FoldingFeature로 접힘 위치와 상태를 받아, 반쯤 접어 세운 자세에서 위아래로 나누는 식으로 대응합니다. 대부분의 화면은 WindowSizeClass로 충분하고 지도나 영상처럼 자세가 의미 있는 화면에만 씁니다.<\/li>\n<li><strong>큰 화면의 지도 앱은 무엇을 바꿉니까?<\/strong> 지도를 넓게 두고 검색 결과나 경로 목록을 옆 창에 고정하는 목록과 상세 구조가 자연스럽습니다. 방향 고정이 무시되므로 가로 화면에서도 버튼과 안내 패널이 가려지지 않는지 확인합니다.<\/li>\n<li><strong>resizeableActivity를 false로 두어 막으면 안 됩니까?<\/strong> targetSdk 36 앱은 Android 16의 sw600dp 이상 화면에서 이 속성이 무시됩니다. 임시 opt-out 속성도 targetSdk 37에서는 쓸 수 없으므로 막기보다 대응해야 합니다.<\/li>\n<\/ul>"},{"no":62,"t":"targetSdk를 올리면 edge-to-edge가 강제되는데, Compose에서 WindowInsets는 어떻게 처리합니까?","a":"<p>targetSdk 35 앱은 Android 15 이상 기기에서 기본으로 edge-to-edge로 그려지고, inset을 처리하지 않으면 UI 일부가 시스템 바에 가려집니다. Android 15에서는 windowOptOutEdgeToEdgeEnforcement를 true로 두어 opt-out할 수 있었지만, targetSdk 36 앱이 Android 16 기기에서 실행되면 이 속성은 deprecated되고 비활성화됩니다. Android 15 기기에서는 계속 동작합니다. Compose에서는 Activity에서 enableEdgeToEdge()를 호출하고, Scaffold의 innerPadding과 windowInsetsPadding 계열 Modifier로 중요한 콘텐츠를 안전 영역 안에 둡니다.<\/p>\n<p>ComponentActivity.enableEdgeToEdge()는 Activity 1.8.0에서 추가되었고 이전 Android 버전에서도 같은 화면 구성을 맞춰 줍니다. 기본으로 시스템 바를 투명하게 하되 3버튼 내비게이션에서는 대비를 위해 반투명 스크림을 두고, 아이콘 색은 시스템의 밝은 테마와 어두운 테마에 맞춥니다. Android 15의 edge-to-edge에서는 setStatusBarColor가 효과가 없으므로 상태 바 색을 칠하는 대신 뒤에 그려지는 콘텐츠를 보고 아이콘 색을 정하며, 직접 정할 때는 WindowInsetsControllerCompat의 isAppearanceLightStatusBars를 씁니다. 키보드 inset을 받으려면 Activity에 android:windowSoftInputMode=\"adjustResize\"를 지정합니다.<\/p>\n<p>Material 3 Scaffold는 inset을 innerPadding으로 넘겨줄 뿐 콘텐츠에 적용하지 않습니다. 목록이라면 contentPadding = innerPadding으로 마지막 항목이 내비게이션 바 위까지 스크롤되게 하고, consumeWindowInsets(innerPadding)으로 하위에서 같은 inset을 다시 적용하지 않게 합니다. 어떤 inset을 넘길지는 contentWindowInsets로 바꿉니다. Scaffold 밖에서는 Modifier.windowInsetsPadding(WindowInsets.safeDrawing)이나 systemBarsPadding()을, 키보드 위로 입력창을 올릴 때는 imePadding()을 씁니다. TopAppBar, NavigationBar 같은 Material 3 컴포넌트는 자기 위치의 inset을 스스로 처리합니다.<\/p>\n<p>지도 화면이라면 지도는 시스템 바 뒤까지 그리고, 현재 위치 버튼이나 검색창처럼 눌러야 하는 요소만 WindowInsets.safeDrawing 안에 둡니다. 카메라 구멍이나 노치는 WindowInsets.displayCutout으로 피하는데 safeDrawing에 포함되어 있습니다. 가장자리에서 안쪽으로 끄는 뒤로 가기 제스처 영역은 WindowInsets.systemGestures로 알 수 있고, 지도 드래그와 겹치는 일부 영역은 Modifier.systemGestureExclusion으로 제외할 수 있지만 mandatorySystemGestures 영역은 제외할 수 없습니다.<\/p>\n<pre class=\"kotlin\"><code>// Activity.onCreate에서 enableEdgeToEdge()를 호출한 뒤\nScaffold(bottomBar = { AppNavigationBar() }) { innerPadding -&gt;\n    LazyColumn(\n        modifier = Modifier.consumeWindowInsets(innerPadding),\n        contentPadding = innerPadding,              // 마지막 항목이 내비게이션 바 위까지 스크롤됨\n    ) { /* 항목 */ }\n}\n\nBox(Modifier.fillMaxSize()) {\n    MapHost(Modifier.fillMaxSize())                 // 지도는 시스템 바 뒤까지 그림\n    MyLocationButton(\n        Modifier.align(Alignment.BottomEnd).windowInsetsPadding(WindowInsets.safeDrawing)\n    )\n}<\/code><\/pre>","f":"<ul>\n<li><strong>여백이 두 배로 들어가는 문제는 왜 생깁니까?<\/strong> 상위에서 적용한 inset을 하위가 모르고 다시 적용하기 때문입니다. 상위에서 consumeWindowInsets로 소비했다고 알리면 하위의 windowInsetsPadding은 남은 만큼만 적용합니다.<\/li>\n<li><strong>키보드가 올라올 때 입력창이 가려지면 무엇을 봅니까?<\/strong> Activity가 adjustResize인지 확인하고, 입력창을 감싼 컨테이너에 imePadding()을 줍니다. Scaffold 안이라면 contentWindowInsets에 키보드 inset이 들어가는지와 중복 소비 여부를 함께 봅니다.<\/li>\n<li><strong>edge-to-edge 대응은 어떻게 검증합니까?<\/strong> 제스처 내비게이션과 3버튼 내비게이션, 컷아웃이 있는 기기, 가로 화면, 키보드 표시 상태에서 스크린샷 테스트나 수동 점검으로 가려지는 요소가 없는지 봅니다.<\/li>\n<\/ul>"},{"no":63,"t":"Compose 애니메이션 API는 어떤 기준으로 고르고, 성능상 무엇을 주의합니까?","a":"<p>무엇을 움직이느냐로 고릅니다. 값 하나가 목표값을 따라가면 animate*AsState, 한 상태 전환에 여러 값이 함께 움직이면 updateTransition, 컴포저블이 나타나고 사라지면 AnimatedVisibility, 상태에 따라 내용이 바뀌면 AnimatedContent, 제스처를 따라가거나 중간에 멈추고 이어 가는 등 직접 제어해야 하면 코루틴 기반 Animatable을 씁니다. 반복 애니메이션은 rememberInfiniteTransition으로 만듭니다.<\/p>\n<p>animate*AsState는 가장 간단하지만 값마다 따로 움직여 여러 값의 타이밍을 묶기 어렵습니다. updateTransition은 하나의 상태 전환을 기준으로 여러 자식 애니메이션이 함께 시작하고 끝나게 묶고, Android Studio의 애니메이션 미리보기에서 전환을 확인할 수 있습니다. AnimatedContent는 이전 내용과 새 내용을 함께 그리며 전환하는데, targetState 객체의 일부만 바뀌어도 전환이 일어나므로 전환 기준이 되는 값만 contentKey로 지정합니다. Animatable은 animateTo, snapTo, stop을 suspend 함수로 다뤄 드래그를 놓은 뒤 이어지는 움직임처럼 사용자 입력과 섞이는 애니메이션에 맞습니다.<\/p>\n<p>성능의 핵심은 어느 단계를 다시 하느냐입니다. animateContentSize나 높이, 패딩 값을 애니메이션하면 매 프레임 측정과 배치를 다시 하고 주변 레이아웃까지 밀어냅니다. 같은 효과를 graphicsLayer의 scale, translation, alpha로 낼 수 있으면 레이어 속성만 바뀌어 리컴포지션과 레이아웃 없이 처리됩니다. 애니메이션 값을 컴포저블 본문에서 읽으면 매 프레임 리컴포지션이 일어나므로 offset { }, graphicsLayer { }, drawBehind { } 같은 람다 안에서 읽습니다. Compose 1.8에서 추가된 animateBounds처럼 크기와 위치를 함께 바꾸는 애니메이션도 레이아웃을 다시 하므로, 목록 항목처럼 많은 곳에 동시에 쓰기 전에 측정합니다.<\/p>\n<p>공유 요소 전환은 compose-animation 1.10.0에서 shared transition API가 Stable이 되었고, 같은 버전에 Modifier.skipToLookaheadPosition과 veil 전환이 추가되었습니다. SharedTransitionLayout 안에서 Modifier.sharedElement와 sharedBounds로 목록의 썸네일이 상세 화면 이미지로 이어지게 만들고, Navigation 3는 1.1.0에서 Scene 사이 공유 요소를 지원합니다. 실험 opt-in 없이 쓸 수 있게 되었지만, 전환 중에는 두 화면이 함께 컴포지션되므로 무거운 화면에서는 전환 프레임을 측정합니다.<\/p>\n<pre class=\"kotlin\"><code>// 레이아웃을 다시 하는 방식: 높이가 매 프레임 바뀌어 주변까지 다시 배치됨\nval height by animateDpAsState(if (expanded) 200.dp else 56.dp)\nBox(Modifier.height(height))\n\n// 레이어 속성만 바꾸는 방식: 리컴포지션과 레이아웃 없이 처리됨\nval scale by animateFloatAsState(if (pressed) 0.95f else 1f)\nBox(Modifier.graphicsLayer { scaleX = scale; scaleY = scale })<\/code><\/pre>","f":"<ul>\n<li><strong>LazyColumn 항목의 추가, 삭제, 순서 변경은 어떻게 애니메이션합니까?<\/strong> 항목 Modifier에 animateItem()을 붙이면 나타남, 사라짐, 위치 이동이 애니메이션됩니다. key가 있어야 Compose가 같은 항목의 이동을 알아봅니다.<\/li>\n<li><strong>애니메이션 도중 목표가 다시 바뀌면 어떻게 됩니까?<\/strong> animate*AsState와 updateTransition은 진행 중인 값과 속도에서 새 목표로 이어서 움직입니다. Animatable은 새 animateTo가 이전 애니메이션을 취소하므로 제스처가 끼어들어도 자연스럽게 끊고 이어 갈 수 있습니다.<\/li>\n<\/ul>"},{"no":64,"t":"검색창 TextField를 ViewModel 상태와 연결할 때 커서가 튀거나 입력이 사라지는 문제는 왜 생기고 어떻게 고칩니까?","a":"<p>value와 onValueChange 방식의 TextField에서 입력 상태를 비동기로 갱신하기 때문입니다. 키보드는 입력할 때마다 앱이 받은 값을 바로 반영해 돌려줄 것으로 기대하는데, onValueChange에서 받은 값을 코루틴이나 debounce를 거쳐 늦게 되돌려주면 그 사이 키보드가 보낸 다음 입력과 옛 값이 섞여 커서가 튀거나 글자가 사라집니다. 고치는 방법은 입력 상태는 동기로 즉시 갱신하고 검색 요청은 그 상태에서 파생한 별도 Flow로 처리하는 것이며, 현재 공식 문서는 TextFieldState를 쓰는 상태 기반 TextField를 권장합니다.<\/p>\n<p>value 방식에서는 TextField에 보이는 값의 진실 공급원이 앱 상태라서, 앱이 값을 돌려줄 때까지 TextField와 키보드가 서로 다른 값을 들고 있습니다. 조합 중인 글자가 있는 한글 입력에서는 이 어긋남이 더 쉽게 드러납니다. 흔한 원인은 onValueChange에서 viewModelScope.launch로 상태를 바꾸는 것, debounce나 filter를 거친 Flow를 다시 value로 쓰는 것, 입력값을 StateFlow에 넣고 수집을 거쳐 value로 받는 것입니다. value 방식을 유지해야 한다면 입력값을 수집 단계가 없는 mutableStateOf에 두고 onValueChange 안에서 동기로 바꾼 뒤 그 값을 그대로 TextField에 넘깁니다.<\/p>\n<p>TextFieldState는 내용과 선택 영역을 함께 담고, 키보드와 TextField 사이의 편집 동기화를 내부에서 처리합니다. 공식 문서는 value 기반 텍스트 필드를 deprecated로 안내하며 상태 기반 TextField로 옮기라고 하고, TextFieldState는 UI 의존이 없는 Snapshot 기반 상태 홀더이므로 ViewModel에 두는 것을 권합니다. 입력 필터는 InputTransformation으로 입력 직후 바로 적용되어 키보드와 어긋나지 않고, 전화번호 하이픈 같은 표시 서식은 OutputTransformation으로 처리합니다.<\/p>\n<p>검색 요청은 snapshotFlow { query.text }로 TextFieldState를 Flow로 바꾼 뒤 ViewModel 안에서 debounce 이후 단계로 잇습니다. 디바운스를 입력 상태가 아니라 요청 쪽에 걸어야 입력은 즉시 보이고 요청만 줄어듭니다. debounce, distinctUntilChanged, flatMapLatest 조합의 세부는 2절의 검색어 자동완성 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>class SearchViewModel(private val repository: PlaceRepository) : ViewModel() {\n    val query = TextFieldState()                       // 입력 상태는 바로 갱신됨\n    val results: StateFlow&lt;List&lt;Place&gt;&gt; =\n        snapshotFlow { query.text.toString() }         // 입력 상태 → 요청 Flow\n            .debounce(300)                             // 예시 값, 요청 쪽에만 디바운스\n            .distinctUntilChanged()\n            .flatMapLatest { q -&gt; repository.search(q) }\n            .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())\n}\n\n@Composable\nfun SearchField(query: TextFieldState, modifier: Modifier = Modifier) {\n    TextField(state = query, modifier = modifier, lineLimits = TextFieldLineLimits.SingleLine)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>ViewModel에 TextFieldState를 두면 UI 의존 아닙니까?<\/strong> TextFieldState는 Compose Foundation에 있지만 UI 요소를 갖지 않는 Snapshot 기반 상태 홀더입니다. 공식 문서도 StateFlow 같은 의존과 다르지 않다고 보고 ViewModel에 두는 것을 권합니다.<\/li>\n<li><strong>ViewModel에서 만든 TextFieldState는 프로세스 종료 뒤 어떻게 복원합니까?<\/strong> rememberTextFieldState가 해 주는 저장과 복원이 없으므로, 검색어를 SavedStateHandle에 저장해 두었다가 ViewModel을 만들 때 그 값으로 TextFieldState를 초기화합니다.<\/li>\n<li><strong>기존 UiState 구조를 당장 바꿀 수 없다면?<\/strong> 공식 문서의 절충안처럼 화면에서 rememberTextFieldState를 쓰고 snapshotFlow로 텍스트 변화를 수집해 ViewModel에 전달합니다. 입력 상태의 소유자는 TextField 쪽이고 ViewModel은 그 값을 받아 쓰기만 합니다.<\/li>\n<\/ul>"},{"no":65,"t":"재사용할 컴포저블 API는 어떻게 설계합니까?","a":"<p>필수 파라미터, modifier, 선택 파라미터 순서로 두고, 상태는 밖에서 받고 이벤트는 람다로 올리며, 바뀔 수 있는 내용은 슬롯으로 열어 두는 것이 기본입니다. Compose 컴포넌트 API 가이드라인은 UI를 내보내는 컴포저블이 Modifier 파라미터를 받아 최상위 레이아웃에 적용하고, 그 파라미터를 첫 번째 선택 파라미터로 두며 기본값을 Modifier로 하라고 권합니다.<\/p>\n<p>기본값은 가장 흔한 쓰임새에 맞추고, 색, 크기, 간격 같은 묶음 기본값은 ButtonDefaults처럼 XxxDefaults 객체에 모아 호출하는 쪽이 일부만 바꿀 수 있게 합니다. 텍스트나 아이콘을 String이나 ImageVector로 고정하면 디자인이 바뀔 때마다 파라미터가 늘어나므로, 내용이 바뀔 수 있는 자리는 @Composable 람다 슬롯으로 받습니다. 이벤트 람다는 onClick, onValueChange, onDismissRequest처럼 on으로 시작하는 현재형 이름을 쓰고, 상태는 값과 콜백 쌍이나 상태 홀더로 받습니다.<\/p>\n<p>상호작용이 복잡한 컴포넌트는 rememberXxxState()로 만드는 상태 홀더와, 상태를 받아 그리기만 하는 기본 구현으로 나눕니다. 대부분의 호출은 기본 상태를 그대로 쓰고, 스크롤 위치나 펼침을 바깥에서 제어해야 할 때만 상태를 끌어올립니다. 접근성도 API의 일부라서, 아이콘만 있는 버튼은 contentDescription을 필수 파라미터로 받습니다.<\/p>\n<p>디자인 시스템 컴포넌트는 Material 3 컴포넌트를 앱의 색, 글꼴, 간격, 모양 토큰으로 감싼 얇은 층으로 만들고, 화면 코드는 Material 컴포넌트 대신 디자인 시스템 컴포넌트만 쓰게 합니다. 감싼 층이 Material 타입을 그대로 노출하지 않으면 디자인이나 Material 버전이 바뀌어도 화면 코드를 덜 고칩니다. 각 컴포넌트에는 기본, 비활성, 오류, 다크 모드, 큰 글꼴 상태의 Preview를 붙이고, 그 Preview를 스크린샷 테스트로 돌려 회귀를 막습니다.<\/p>\n<pre class=\"kotlin\"><code>@Composable\nfun PlaceChip(\n    label: String,                                        // 필수 파라미터\n    onClick: () -&gt; Unit,\n    modifier: Modifier = Modifier,                        // 첫 번째 선택 파라미터\n    selected: Boolean = false,\n    leadingIcon: (@Composable () -&gt; Unit)? = null,        // 바뀔 수 있는 내용은 슬롯으로\n    colors: PlaceChipColors = PlaceChipDefaults.colors(), // 묶음 기본값은 Defaults 객체에\n) {\n    // modifier는 최상위 레이아웃에 한 번만 적용\n}<\/code><\/pre>","f":"<ul>\n<li><strong>modifier를 내부 자식에 적용하면 왜 안 됩니까?<\/strong> 호출한 쪽은 modifier가 컴포넌트 전체에 적용된다고 기대합니다. 내부 자식에 적용하면 크기와 클릭 범위가 예상과 달라지므로 가이드라인대로 최상위 레이아웃 체인의 맨 앞에 한 번만 적용합니다. Modifier 타입 파라미터는 하나만 두고, 내부 요소의 설정은 의미가 드러나는 별도 파라미터로 받습니다.<\/li>\n<li><strong>파라미터가 계속 늘어나면 어떻게 합니까?<\/strong> 내용이 바뀌는 부분은 슬롯으로 열고, 스타일 묶음은 Colors나 Defaults 클래스로 묶고, 변형이 크게 다르면 별도 컴포저블로 나눕니다. Boolean 플래그로 모양을 분기하는 코드가 늘면 나눌 때라는 신호입니다.<\/li>\n<li><strong>디자인 시스템이 Material을 감싸는 이유는 무엇입니까?<\/strong> 디자인 토큰과 규칙을 한 곳에서 강제하고, Material 버전 변경이나 디자인 변경이 생겨도 화면 코드 대신 감싼 층만 고치기 위해서입니다.<\/li>\n<\/ul>"},{"no":66,"t":"최근 1~2년 Compose에서 실무에 영향을 준 변화는 무엇입니까?","a":"<p>2024년 11월 이후로 꼽으면 View 시스템의 유지 관리 모드 전환, Navigation 3 안정판, strong skipping 정착과 컴파일러 플래그 정리, 새 retain API와 Stable이 된 공유 요소 전환, 테스트 기본 동작 변경, 빌드 요구 사항 상승입니다. 각 변화는 새 화면을 무엇으로 만들지, 빌드와 테스트를 어떤 순서로 올릴지에 영향을 줍니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>변화<\/th>\n<th>시점<\/th>\n<th>팀 코드에 주는 영향<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google 'Compose First' 발표: View 컴포넌트는 유지 관리 모드, Fragments, RecyclerView, ViewPager는 중요 버그만 수정<\/td>\n<td>2026-05-19<\/td>\n<td>새 UI는 Compose로 만들고 View 화면은 전환 계획을 세움<\/td>\n<\/tr>\n<tr>\n<td>Navigation 3 1.0.0 안정판<\/td>\n<td>2025-11-19<\/td>\n<td>새 내비게이션은 Navigation 3로, 기존 type-safe route는 요구가 생길 때 이전(Navigation 2는 현재 유지 관리 모드)<\/td>\n<\/tr>\n<tr>\n<td>Kotlin 2.4.0에서 StrongSkipping, IntrinsicRemember 플래그가 ERROR 수준 deprecated(2.5.0 제거 예정). strong skipping 자체는 Kotlin 2.0.20부터 기본<\/td>\n<td>2026-06-03<\/td>\n<td>끄는 설정을 지우고, 안정성 우회 코드보다 인스턴스 유지에 집중<\/td>\n<\/tr>\n<tr>\n<td>runtime-retain 아티팩트의 retain API 추가<\/td>\n<td>Compose 1.10, 2025-12-03<\/td>\n<td>직렬화할 수 없는 객체를 구성 변경 동안 유지, 프로세스 종료 복원은 따로 처리<\/td>\n<\/tr>\n<tr>\n<td>shared transition API Stable<\/td>\n<td>compose-animation 1.10.0, 2025-12-03<\/td>\n<td>실험 opt-in 없이 화면 전환에 공유 요소 사용<\/td>\n<\/tr>\n<tr>\n<td>lazy prefetch의 pausable composition: 1.10에서 기본 켬, 1.10.6에서 안정성 문제로 기본 끔, 1.13.0-alpha03에서 임시 플래그 제거<\/td>\n<td>2025-12 ~ 2026-09<\/td>\n<td>버전을 올릴 때마다 목록 스크롤 성능을 다시 측정<\/td>\n<\/tr>\n<tr>\n<td>compose-foundation 기본 minSdk를 21에서 23으로 상향<\/td>\n<td>1.10.0-alpha01, 2025-08-13<\/td>\n<td>minSdk 21, 22를 지원하던 앱은 지원 범위를 다시 정함<\/td>\n<\/tr>\n<tr>\n<td>v2 테스트 API 기본, v1 deprecated(StandardTestDispatcher 사용)<\/td>\n<td>Compose 1.11, 2026-04-22<\/td>\n<td>코루틴이 즉시 실행된다고 가정한 테스트를 동기화 API나 시계 진행으로 수정<\/td>\n<\/tr>\n<tr>\n<td>Compose 1.12부터 compileSdk 37과 AGP 9.1.1 이상 필요<\/td>\n<td>2026-08-12<\/td>\n<td>BOM을 올리기 전에 AGP 9의 내장 Kotlin과 새 DSL 이전을 먼저 끝냄<\/td>\n<\/tr>\n<tr>\n<td>Material 3 1.4.0: material-icons 의존성 제외, Motio
