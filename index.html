ssinline을 씁니다.<\/p>\n<p>표준 컬렉션 연산(map, filter)은 inline이라 람다 비용은 없지만 단계마다 중간 리스트를 만듭니다. 원소가 많고 체인이 길면 Sequence로 지연 평가해 중간 리스트를 없애고, 작은 컬렉션은 List가 더 빠릅니다. 또 람다가 Activity의 this를 캡처한 채 오래 사는 곳에 저장되면 누수가 됩니다(162번).<\/p>","f":"<ul>\n<li><strong>Sequence가 항상 빠른가요?<\/strong> 아닙니다. 원소마다 단계를 거치는 오버헤드가 있어 작은 컬렉션에서는 List 연산이 빠릅니다.<\/li>\n<li><strong>non-local return이 inline에서만 되는 이유는?<\/strong> 람다가 호출 지점에 복사되어야 바깥 함수의 return이 의미를 갖기 때문입니다.<\/li>\n<\/ul>"}]},{"no":8,"title":"보안","qs":[{"no":178,"t":"대칭키 암호화와 비대칭키 암호화를 비교하고, 실제 시스템은 둘을 어떻게 함께 씁니까?","a":"<p>대칭키 암호화(AES)는 같은 키로 암호화와 복호화를 해서 빠르고 하드웨어 가속도 받지만, 그 키를 상대에게 안전하게 전달하는 것이 문제입니다. 비대칭키 암호화(RSA, ECC)는 공개키와 개인키 한 쌍을 씁니다. 공개키로 암호화하면 개인키로만 풀 수 있어 비밀을 전달할 수 있고, 개인키로 서명하면 누구나 공개키로 검증할 수 있어 보낸 사람과 변조 여부를 확인할 수 있습니다. 대신 느리고 한 번에 다룰 수 있는 데이터 크기가 작습니다.<\/p>\n<p>그래서 섞어 씁니다. TLS는 키 교환(ECDHE)으로 대칭 세션 키를 합의하고, 인증서 서명으로 서버 신원을 확인하고, 실제 데이터는 AES-GCM 같은 대칭 암호로 보냅니다.<\/p>\n<p>구현에서 자주 틀리는 것은 모드와 nonce입니다. 같은 평문 블록이 같은 암호문이 되는 ECB 모드는 패턴이 드러나 쓰지 않고, GCM 같은 인증 암호를 쓰되 같은 키로 nonce를 재사용하면 기밀성과 무결성이 함께 무너집니다. 모바일에서는 Android Keystore가 키를 하드웨어 보안 영역에 두어 앱도 키 원본을 꺼낼 수 없게 합니다.<\/p>","f":"<ul>\n<li><strong>ECC가 RSA보다 선호되는 이유는?<\/strong> 같은 보안 수준에서 키가 훨씬 짧고 연산이 빨라 모바일과 TLS에 유리합니다.<\/li>\n<li><strong>인증 암호(AEAD)란?<\/strong> 암호화와 함께 위변조 검증 태그를 만들어, 변조된 암호문은 복호화 단계에서 거부합니다.<\/li>\n<\/ul>"},{"no":179,"t":"해시, 암호화, 인코딩은 어떻게 다르고, 각각 어디에 씁니까?","a":"<p>인코딩(Base64, URL 인코딩)은 데이터 형식을 바꾸는 것으로 키가 없어 누구나 되돌릴 수 있습니다. 보안 기능이 아닙니다. 암호화는 키가 있어야 되돌릴 수 있어 기밀성을 줍니다. 해시는 되돌릴 수 없는 단방향 함수로, 길이가 고정되고 입력이 조금만 바뀌어도 결과가 완전히 달라집니다. 파일 무결성 확인, 비밀번호 저장(전용 함수로), 전자서명의 대상에 씁니다.<\/p>\n<p>보안용 해시는 결과로 입력을 찾기 어렵고 같은 결과를 내는 두 입력을 찾기 어려워야 합니다. MD5와 SHA-1은 충돌 공격이 실제로 시연되어 보안 용도에는 쓰지 않고 SHA-256 이상을 씁니다. 해시만으로는 위변조를 막지 못합니다. 공격자가 내용을 바꾸고 해시도 다시 계산하면 되기 때문입니다. 비밀 키를 섞는 HMAC이나 전자서명을 써야 합니다.<\/p>\n<p>자주 보는 오해가 JWT입니다. 페이로드는 Base64 인코딩일 뿐이라 누구나 읽을 수 있으니 비밀 정보를 넣으면 안 됩니다. 또 해시 테이블용 해시는 빠름이 목적인 비암호 해시라 보안용과 구분합니다.<\/p>","f":"<ul>\n<li><strong>HMAC이 hash(key + message)보다 나은 이유는?<\/strong> 단순 결합은 일부 해시에서 길이 확장 공격에 취약한데, HMAC은 구조적으로 이를 막습니다.<\/li>\n<li><strong>CRC 체크섬과 암호 해시의 차이는?<\/strong> CRC는 우연한 전송 오류 탐지용이고 의도적인 조작은 막지 못합니다.<\/li>\n<\/ul>"},{"no":180,"t":"비밀번호는 어떻게 저장해야 하고, SHA-256으로 해시하면 왜 부족합니까?","a":"<p>평문이나 되돌릴 수 있는 암호화로 저장하면 안 되고, 해시하더라도 SHA-256 같은 빠른 해시는 부족합니다. GPU로 초당 수십억 번 계산할 수 있어서 유출된 해시에 사전 공격과 무차별 대입을 하면 흔한 비밀번호는 금방 풀립니다. 미리 계산한 해시 표(레인보우 테이블)는 사용자마다 다른 무작위 salt를 섞어 무력화합니다.<\/p>\n<p>핵심은 일부러 느리게 만든 전용 함수입니다. bcrypt, scrypt, Argon2가 있고 현재 권장은 메모리를 많이 써서 GPU와 전용 하드웨어 공격을 어렵게 만드는 Argon2id입니다. 호환성 때문에 PBKDF2를 쓰기도 합니다. 작업 비용 값은 하드웨어 발전에 맞춰 올리고, 사용자가 로그인할 때 새 설정으로 다시 해시해 점진적으로 바꿉니다. DB 밖에 보관하는 서버 비밀값(pepper)을 더하면 DB만 유출됐을 때 한 겹 더 막습니다.<\/p>\n<p>함께 할 것은 상수 시간 비교, 유출된 비밀번호 목록과 대조, 로그인 시도 제한, 다중 인증입니다. 클라이언트에서만 해시해 보내는 것은 그 해시가 곧 비밀번호 역할을 하게 되어 의미가 없습니다.<\/p>","f":"<ul>\n<li><strong>salt는 비밀이어야 하나요?<\/strong> 아닙니다. 사용자마다 다르기만 하면 되고 해시와 함께 저장합니다.<\/li>\n<li><strong>상수 시간 비교가 필요한 이유는?<\/strong> 앞에서부터 다른 글자를 만나면 바로 끝나는 비교는 응답 시간 차이로 정답을 한 글자씩 추측하는 타이밍 공격에 노출됩니다.<\/li>\n<\/ul>"},{"no":181,"t":"전자서명은 무엇을 보장하고, APK 서명과 앱 업데이트에는 어떻게 적용됩니까?","a":"<p>전자서명은 메시지의 해시를 개인키로 서명하고, 누구나 공개키로 검증하게 합니다. 내용이 바뀌면 검증이 실패하므로 무결성을, 개인키를 가진 사람만 만들 수 있으므로 출처 인증과 부인 방지를 보장합니다. 공개키가 정말 그 주체의 것인지는 인증 기관이 \"이 공개키는 이 주체의 것\"이라고 서명한 인증서로 해결합니다(PKI).<\/p>\n<p>APK는 개발자 개인키로 서명하고 설치할 때 검증합니다. 업데이트는 기존 앱과 같은 키로 서명되어야만 허용되므로 서명 키가 앱의 신원입니다. 키를 잃어버리면 업데이트를 낼 수 없고, 유출되면 누군가 위장 업데이트를 만들 수 있습니다. 그래서 Play 앱 서명은 구글이 앱 서명 키를 보관하고 개발자는 업로드 키만 가지게 해서, 업로드 키가 유출되거나 분실되어도 교체할 수 있게 합니다. 서명 방식 v3는 키 교체 이력을 담아 키를 바꿀 수 있게 합니다.<\/p>\n<p>코드 서명, 소프트웨어 업데이트 검증, JWT의 RS256, 인앱 결제 영수증 검증이 모두 같은 원리입니다.<\/p>","f":"<ul>\n<li><strong>서명과 HMAC의 차이는?<\/strong> HMAC은 검증자도 같은 키로 만들 수 있어 부인 방지가 안 되고, 서명은 검증자가 서명을 만들 수 없습니다.<\/li>\n<li><strong>서명 검증 순서는?<\/strong> 메시지를 해시하고, 서명을 공개키로 검증해 같은 해시인지 확인합니다.<\/li>\n<\/ul>"},{"no":182,"t":"JWT 액세스 토큰만으로 인증할 때의 약점과 보완책은 무엇입니까?","a":"<p>JWT는 헤더, 페이로드, 서명으로 되어 있어 서버가 서명만 확인하면 상태를 저장하지 않고 인증할 수 있습니다. 약점은 그 장점의 뒷면입니다. 발급한 토큰을 만료 전에 무효화하기 어려워 로그아웃, 탈취, 권한 변경을 즉시 반영하지 못하고, 탈취되면 만료까지 그대로 쓰입니다. 페이로드는 누구나 읽을 수 있습니다. 구현 실수도 많습니다. alg를 none으로 바꾼 토큰을 받아 주거나, 공개키를 HMAC 비밀키로 오인해 검증하는 알고리즘 혼동, 서명이나 만료 검사 누락입니다.<\/p>\n<p>보완은 이렇습니다. 액세스 토큰은 수 분에서 15분 정도로 짧게 둡니다. 리프레시 토큰은 길게 두되 서버에 저장해 무효화할 수 있게 하고, 쓸 때마다 새것으로 바꿉니다(rotation). 이미 쓴 리프레시 토큰이 다시 오면 탈취로 보고 그 계열 토큰을 모두 폐기합니다. 꼭 필요하면 토큰 ID(jti) 차단 목록을 둡니다. 검증하는 쪽은 허용 알고리즘을 고정합니다.<\/p>\n<p>저장 위치도 설계입니다. 웹은 XSS로 읽히지 않는 HttpOnly 쿠키와 CSRF 방어를 함께 쓰고, 모바일은 Keystore로 보호한 암호화 저장소에 둡니다. 여러 요청이 동시에 401을 받으면 토큰 갱신은 한 번만 하게 합니다(110번).<\/p>","f":"<ul>\n<li><strong>세션과 JWT 중 무엇을 고르나요?<\/strong> 즉시 무효화와 단순함이 중요하면 세션, 여러 서비스가 독립적으로 검증해야 하면 짧은 JWT와 리프레시 토큰 조합입니다.<\/li>\n<li><strong>토큰에 권한 정보를 넣으면?<\/strong> 권한이 바뀌어도 토큰 만료 전까지 옛 권한이 남으므로 민감한 권한은 서버에서 다시 확인합니다.<\/li>\n<\/ul>"},{"no":183,"t":"OAuth 2.0의 Authorization Code 흐름과 PKCE를 설명하고, 모바일 앱에서 왜 PKCE가 필요한지 말해 보세요.","a":"<p>OAuth는 사용자가 비밀번호를 앱에 주지 않고 앱에 자원 접근 권한을 위임하는 인가 프레임워크입니다. 로그인 신원 확인은 그 위의 OpenID Connect가 ID 토큰으로 합니다. Authorization Code 흐름에서는 앱이 브라우저로 인가 서버 로그인 화면을 열고, 사용자가 동의하면 리다이렉트로 인가 코드를 받고, 앱이 그 코드를 토큰으로 교환합니다.<\/p>\n<p>모바일 앱과 SPA는 클라이언트 비밀을 안전하게 숨길 수 없는 공개 클라이언트입니다. 다른 앱이 같은 커스텀 스킴을 등록해 리다이렉트로 오는 인가 코드를 가로챌 수 있습니다. PKCE는 앱이 매번 무작위 code_verifier를 만들고 그 해시(code_challenge)를 인가 요청에 보낸 뒤, 코드를 교환할 때 원래 verifier를 제출하게 합니다. 코드만 가로챈 공격자는 verifier가 없어 교환할 수 없습니다. 토큰을 URL로 바로 받던 Implicit 흐름은 토큰 노출 위험으로 쓰지 않는 것이 권고입니다.<\/p>\n<p>구현에서는 앱 내장 WebView 대신 시스템 브라우저나 Custom Tabs를 씁니다. 앱이 사용자의 비밀번호 입력을 엿볼 수 없어 신뢰할 수 있고, 브라우저에 남은 로그인 상태를 재사용할 수 있습니다. 리다이렉트는 App Links로 소유를 검증하고, state 값으로 요청과 응답을 묶어 CSRF를 막습니다.<\/p>","f":"<ul>\n<li><strong>state와 PKCE는 같은 역할인가요?<\/strong> state는 응답이 내가 시작한 요청에 대한 것인지 확인하고, PKCE는 가로챈 코드가 교환되지 않게 해서 서로 보완합니다.<\/li>\n<li><strong>WebView 로그인을 막는 인가 서버가 있는 이유는?<\/strong> 앱이 입력을 가로챌 수 있어 사용자 비밀번호 보호를 보장할 수 없기 때문입니다.<\/li>\n<\/ul>"},{"no":184,"t":"XSS와 CSRF는 어떻게 다르고, 각각 어떻게 막습니까?","a":"<p>XSS는 공격자의 스크립트가 피해 사이트의 문맥에서 실행되는 것입니다. 저장된 게시물에 심는 저장형, URL 파라미터를 그대로 출력해 생기는 반사형, 클라이언트 JavaScript가 만드는 DOM 기반이 있고, 세션 탈취와 화면 조작으로 이어집니다. 막는 방법은 출력 위치(HTML 본문, 속성, JavaScript, URL)에 맞는 이스케이프, 프레임워크의 자동 이스케이프를 우회하는 innerHTML 같은 API 피하기, CSP로 허용된 스크립트만 실행, HttpOnly 쿠키로 탈취 피해 줄이기입니다. 입력 검증은 보조 수단입니다.<\/p>\n<p>CSRF는 피해자 브라우저가 로그인 쿠키를 자동으로 붙인다는 점을 이용해, 공격자 사이트가 피해 사이트로 상태를 바꾸는 요청을 보내게 하는 것입니다. SameSite 쿠키, 요청마다 확인하는 CSRF 토큰, 상태 변경을 GET으로 하지 않기, Origin 헤더 확인으로 막습니다.<\/p>\n<p>한 줄로 정리하면 XSS는 사이트를 믿는 사용자를, CSRF는 사용자를 믿는 사이트를 공격합니다. XSS가 있으면 페이지 안의 CSRF 토큰도 읽히므로 XSS 방어가 먼저입니다. 모바일 WebView에서 JavaScript 인터페이스를 노출한 채 신뢰할 수 없는 페이지를 열면, XSS가 네이티브 기능 호출로 커지므로 허용 도메인을 제한합니다.<\/p>","f":"<ul>\n<li><strong>Authorization 헤더로 토큰을 보내는 API는 CSRF에 안전한가요?<\/strong> 브라우저가 자동으로 붙이지 않으므로 대체로 안전하지만, 그 토큰을 JavaScript가 다루므로 XSS로 탈취될 위험이 커집니다.<\/li>\n<li><strong>CSP는 무엇을 하나요?<\/strong> 페이지가 불러오고 실행할 수 있는 스크립트와 리소스의 출처를 제한해, 주입된 인라인 스크립트 실행을 막습니다.<\/li>\n<\/ul>"},{"no":185,"t":"인증서 피닝은 무엇을 막고, 운영에서 어떤 위험이 있으며, 어떻게 안전하게 적용합니까?","a":"<p>기본 검증은 기기에 있는 어떤 CA든 서명했으면 믿습니다. 피닝은 여기에 더해 특정 인증서나 공개키만 허용해서, 사용자가 설치한 CA나 잘못 발급된 인증서를 이용한 중간자 공격을 막습니다.<\/p>\n<p>운영 위험이 큽니다. 서버 인증서가 만료, CA 변경, 키 유출로 바뀌었는데 새 값을 모르는 구버전 앱은 모두 통신이 끊기고, 업데이트를 받기 전까지 앱이 사실상 먹통이 됩니다. 브라우저 쪽의 HTTP 공개키 피닝(HPKP)이 이런 위험 때문에 폐기되었습니다.<\/p>\n<p>그래서 적용한다면 인증서가 아니라 공개키(SPKI) 해시를 고정하고, 예비 키의 핀을 반드시 함께 넣고, 잎 인증서보다 바뀔 일이 적은 중간 CA 키를 고정하는 방식을 검토하고, Network Security Config의 만료 날짜를 걸어 두고, 원격으로 끌 수 있는 안전장치와 실패 모니터링을 둡니다. 금융처럼 위험이 큰 앱에 주로 쓰고, 루팅과 후킹 앞에서는 우회될 수 있으므로 여러 보안 층 중 하나로 봅니다.<\/p>","f":"<ul>\n<li><strong>Android에서 피닝은 어디에 설정하나요?<\/strong> Network Security Config의 pin-set이나 OkHttp의 CertificatePinner로 설정합니다.<\/li>\n<li><strong>Certificate Transparency는?<\/strong> CA가 발급한 인증서를 공개 로그에 기록하게 해서 잘못된 발급을 찾아내는 장치입니다.<\/li>\n<\/ul>"},{"no":186,"t":"모바일 앱에 API 키나 비밀을 넣으면 왜 안 되고, 기기에 저장해야 하는 비밀은 어떻게 보호합니까?","a":"<p>앱에 넣은 문자열은 디컴파일(jadx), 메모리 관찰, 트래픽 가로채기로 결국 꺼낼 수 있습니다. 클라이언트는 비밀을 지킬 수 없다는 것이 전제입니다. 난독화는 시간을 조금 벌어 줄 뿐입니다.<\/p>\n<p>그래서 진짜 비밀(결제 비밀 키, 서드파티의 서버용 키)은 서버에만 두고 앱은 우리 서버를 거쳐 호출합니다. 지도 SDK 키처럼 앱에 넣을 수밖에 없는 키는 노출을 전제로 서비스 쪽에서 패키지 이름과 서명 해시로 제한하고 사용량 한도를 겁니다.<\/p>\n<p>사용자 토큰처럼 기기에 저장해야 하는 비밀은 Android Keystore로 보호합니다. 키를 하드웨어 보안 영역(TEE, 지원 기기는 StrongBox)에서 만들고 보관해, 앱도 키 원본을 꺼낼 수 없고 암호화와 복호화 연산만 요청합니다. 생체 인증을 통과해야 키를 쓸 수 있게 묶을 수도 있습니다. 데이터는 그 키로 암호화해 저장하며, 요즘은 Keystore 키로 직접 암호화하거나 Tink 같은 라이브러리를 쓰는 방식을 많이 씁니다. 앱이 정품인지에 대한 판단은 서버가 Play Integrity로 검증합니다(189번).<\/p>","f":"<ul>\n<li><strong>루팅된 기기에서 Keystore 키는 안전한가요?<\/strong> 키 원본을 꺼내기는 여전히 어렵지만, 앱 프로세스를 장악하면 그 키로 연산을 요청할 수는 있습니다.<\/li>\n<li><strong>BuildConfig에 키를 넣으면?<\/strong> 빌드 결과물에 그대로 들어가므로 노출된 것과 같습니다.<\/li>\n<\/ul>"},{"no":187,"t":"보안 토큰을 만들 때 Random 대신 SecureRandom을 써야 하는 이유는?","a":"<p>java.util.Random은 선형 합동 생성기라 출력 몇 개를 보면 내부 상태를 계산해 다음 값을 예측할 수 있고, 시각을 시드로 쓰면 더 쉽습니다. kotlin.random.Random의 기본 구현도 암호 용도가 아닙니다. 게임 연출이나 시뮬레이션에는 괜찮지만, 세션 ID, 비밀번호 재설정 링크, 인증 코드, nonce, IV, 키, 경품 추첨처럼 예측되면 안 되는 값에는 OS의 엔트로피를 쓰는 SecureRandom을 쓰고 충분한 길이(128비트 이상)를 줍니다.<\/p>\n<p>Android에서는 2013년에 SecureRandom 초기화 결함으로 비트코인 지갑의 키가 예측되어 도난당한 사례가 있었습니다. 난수 품질이 실제 금전 피해로 이어진다는 예입니다.<\/p>\n<p>UUIDv4(Java randomUUID)는 내부적으로 SecureRandom을 써서 추측이 어렵지만, 보안 토큰으로 설계된 형식은 아니므로 전용 토큰 생성을 씁니다. 테스트를 위해 난수 생성기를 주입받게 해 두면 시드를 고정해 결정적으로 검증할 수 있습니다.<\/p>","f":"<ul>\n<li><strong>여러 스레드가 Random 하나를 공유하면?<\/strong> 내부 상태 갱신에서 경합이 생겨 느려지므로 ThreadLocalRandom을 씁니다.<\/li>\n<li><strong>6자리 인증 코드의 보안은 무엇으로 지키나요?<\/strong> 난수 품질과 함께 짧은 만료 시간과 시도 횟수 제한이 필수입니다.<\/li>\n<\/ul>"},{"no":188,"t":"리플레이 공격은 무엇이고, 암호화와 서명을 했는데도 왜 막히지 않으며, 어떻게 막습니까?","a":"<p>공격자가 정상 요청을 가로채 내용을 바꾸지 않고 그대로 다시 보내는 공격입니다. 내용이 바뀌지 않았으니 암호화와 서명 검증을 그대로 통과합니다. 송금 요청을 다시 보내 두 번 송금되게 하거나, 인증 메시지를 재사용해 로그인하는 식입니다. TLS 1.3의 0-RTT 데이터도 같은 위험이 있습니다.<\/p>\n<p>막는 방법은 요청이 한 번만 유효하게 만드는 것입니다. 한 번만 쓰는 nonce를 넣고 서버가 사용 기록을 남겨 거부하기, 타임스탬프를 서명 범위에 넣고 허용 시간 창을 두기(서버 시각 기준, 시계 차이 고려), 순서 번호, 짧은 만료 토큰, 상태를 바꾸는 요청의 멱등 키(109번)입니다. 타임스탬프만으로는 허용 창 안의 재전송을 못 막으므로 nonce와 함께 씁니다.<\/p>\n<p>요청 서명을 직접 설계한다면 AWS SigV4처럼 메서드, 경로, 정렬된 쿼리, 본문 해시, 타임스탬프를 모두 HMAC 범위에 넣어 일부만 바꿔치기하는 공격도 막습니다.<\/p>","f":"<ul>\n<li><strong>클라이언트 시계가 틀리면?<\/strong> 서버가 응답에 시각을 주고 클라이언트가 차이를 보정해 서명합니다.<\/li>\n<li><strong>nonce 기록은 얼마나 보관하나요?<\/strong> 타임스탬프 허용 창 동안만 보관하면 됩니다. 창 밖 요청은 타임스탬프로 거부되기 때문입니다.<\/li>\n<\/ul>"},{"no":189,"t":"APK 리버스 엔지니어링에 대해 난독화는 어디까지 효과가 있고, 앱 무결성은 어떻게 검증해야 합니까?","a":"<p>APK는 디컴파일이 쉽습니다. R8은 이름을 짧게 바꾸고 쓰지 않는 코드를 지워 분석을 번거롭게 하지만, 주목적은 크기와 성능이고 보안 효과는 분석 시간을 늘리는 정도입니다. 상용 도구로 문자열과 로직을 더 숨길 수 있어도 Frida 같은 동적 후킹과 디버거로 결국 우회됩니다.<\/p>\n<p>그래서 원칙은 중요한 판단을 서버에서 하는 것입니다. 결제 검증, 권한 확인, 가격, 게임 점수처럼 조작되면 안 되는 결정은 서버가 하고, 클라이언트가 보내는 값은 참고만 합니다.<\/p>\n<p>앱과 기기가 정상인지 확인하려면 Play Integrity API를 씁니다. 앱이 서버에서 받은 nonce를 넣어 무결성 토큰을 요청하고, 그 토큰을 우리 서버로 보내 서버가 구글 서버로 검증한 뒤 정품 앱인지, 인증된 기기인지, 정상 설치인지 판단합니다. 클라이언트 안에서 결과를 판단하면 그 판단 코드가 후킹되므로 반드시 서버에서 검증합니다. 루팅 탐지는 쉽게 우회되어 여러 위험 신호 중 하나로만 씁니다.<\/p>","f":"<ul>\n<li><strong>무결성 토큰 요청에 nonce를 넣는 이유는?<\/strong> 예전에 받은 정상 토큰을 재사용하는 리플레이를 막기 위해서입니다(188번).<\/li>\n<li><strong>인앱 결제 영수증은 어디서 검증하나요?<\/strong> 서버에서 스토어의 검증 API로 확인하고, 처리한 거래 ID를 기록해 중복 지급을 막습니다.<\/li>\n<\/ul>"},{"no":190,"t":"HTTPS(TLS)가 보호하는 것과 보호하지 못하는 것은 무엇이고, 종단 간 암호화는 무엇이 다릅니까?","a":"<p>TLS는 전송 구간의 기밀성, 무결성, 서버 인증을 보호합니다. 보호하지 못하는 것도 분명합니다. 접속하는 IP, 시각, 트래픽 크기와 패턴 같은 메타데이터, 핸드셰이크의 서버 이름(SNI, 이를 숨기는 ECH가 도입되는 중), 그리고 양 끝단입니다. 서버는 평문을 보므로 서버 침해, 내부자, 로그에 남긴 개인정보는 TLS와 무관합니다. 기기의 악성 코드와 사용자가 설치한 CA를 이용한 중간자도 막지 못합니다. 또 TLS는 클라이언트와 TLS를 끝내는 지점(로드 밸런서, CDN) 사이만 보호하므로 내부 구간은 mTLS 같은 별도 보호가 필요합니다.<\/p>\n<p>종단 간 암호화(E2EE)는 보내는 기기에서 암호화하고 받는 기기에서만 복호화해서 중간 서버도 내용을 볼 수 없습니다. Signal 프로토콜은 키 합의와 메시지마다 키를 바꾸는 이중 래칫으로 전방 비밀성까지 줍니다.<\/p>\n<p>대가는 서버가 내용을 모르기 때문에 서버 검색, 백업, 여러 기기 동기화, 스팸 필터가 어려워지고, 키를 잃으면 복구할 수 없다는 점입니다. 저장 데이터 암호화(at rest)는 이것과 또 다른 층입니다.<\/p>","f":"<ul>\n<li><strong>mTLS란?<\/strong> 서버뿐 아니라 클라이언트도 인증서로 자신을 증명하는 TLS로, 서비스 간 통신에 씁니다.<\/li>\n<li><strong>로그에서 흔히 새는 것은?<\/strong> 인증 토큰, 개인정보, 요청 본문입니다. 로깅 인터셉터에서 마스킹하고 릴리스 빌드에서는 본문 로깅을 끕니다.<\/li>\n<\/ul>"}]},{"no":9,"title":"소프트웨어 설계","qs":[{"no":191,"t":"객체지향의 네 가지 특징을 실무 관점에서 설명하고, 왜 상속보다 합성을 권합니까?","a":"<p>캡슐화는 상태와 지켜야 할 규칙을 객체 안에 숨기고 메서드로만 바꾸게 하는 것, 추상화는 필요한 개념만 드러내는 것, 상속은 구현을 물려받는 것, 다형성은 같은 인터페이스 뒤에 다른 구현을 두어 호출자가 구체 타입을 모르게 하는 것입니다. 실무에서 가치가 가장 큰 것은 캡슐화와 인터페이스 기반 다형성입니다. 바뀌는 부분을 감추고 갈아 끼울 수 있게 해 주기 때문입니다.<\/p>\n<p>상속은 자식이 부모의 구현 세부에 묶입니다. 부모의 내부 구현이 바뀌면 자식이 깨지는 취약한 기반 클래스 문제가 대표적이고, 계층이 굳어 바꾸기 어렵고, 하나만 상속할 수 있습니다. Stack이 Vector를 상속해 리스트 연산이 노출된 것처럼(6번) 잘못된 is-a 관계도 생깁니다. 합성은 기능을 가진 객체를 필드로 두고 위임하므로 실행 중에 교체할 수 있고 테스트에서 가짜로 바꾸기 쉽습니다.<\/p>\n<p>Kotlin은 클래스가 기본으로 final이라 상속을 열려면 open으로 의도를 밝혀야 하고, by 키워드로 위임을 간단히 쓸 수 있습니다. 상속은 진짜 is-a 관계이고 부모가 확장을 위해 설계된 경우에만 씁니다.<\/p>","f":"<ul>\n<li><strong>취약한 기반 클래스 문제의 예는?<\/strong> HashSet을 상속해 add마다 개수를 세었는데, 부모의 addAll이 내부에서 add를 불러 두 번 세어지는 사례가 유명합니다.<\/li>\n<li><strong>리스코프 치환 원칙은?<\/strong> 하위 타입은 상위 타입이 약속한 동작을 깨지 않고 그 자리를 대신할 수 있어야 한다는 원칙입니다.<\/li>\n<\/ul>"},{"no":192,"t":"SOLID 원칙을 설명하고, 실무에서 어떻게 적용하는지 말해 보세요.","a":"<p>단일 책임은 클래스가 바뀌는 이유가 하나여야 한다는 것입니다. 개방 폐쇄는 새 결제 수단을 추가할 때 기존 코드를 고치지 않고 새 구현만 더할 수 있게 하라는 것입니다. 리스코프 치환은 하위 타입이 상위 타입의 계약을 지켜야 한다는 것으로, 정사각형을 직사각형의 하위 타입으로 만들면 너비만 바꾸는 코드가 깨지는 예가 유명합니다. 인터페이스 분리는 쓰지 않는 메서드에 의존하지 않게 인터페이스를 쪼개라는 것입니다. 의존성 역전은 상위 정책이 하위 구현이 아니라 추상에 의존하게 하라는 것으로, 도메인 계층이 저장소 인터페이스를 정의하고 데이터 계층이 그것을 구현하는 구조가 예입니다.<\/p>\n<p>실무 감각에서 중요한 것은 원칙을 기계적으로 적용하지 않는 것입니다. 구현이 하나뿐이고 바뀔 계획도 없는 인터페이스를 모든 클래스에 만들면 탐색만 어려워지는 과설계가 됩니다. 실제로 변경이 일어나는 방향에 적용합니다.<\/p>\n<p>체감 효과가 가장 큰 것은 의존성 역전입니다. 테스트에서 가짜 구현을 끼울 수 있고, 모듈 간 빌드 의존 방향이 정리되어 하위 모듈 변경이 상위로 번지지 않습니다.<\/p>","f":"<ul>\n<li><strong>구현이 하나뿐인 인터페이스는 언제 만드나요?<\/strong> 모듈 경계를 넘거나, 테스트에서 교체가 필요하거나, 외부 시스템을 감쌀 때입니다.<\/li>\n<li><strong>sealed class와 when은 개방 폐쇄 원칙에 어긋나나요?<\/strong> 새 타입 추가는 어렵지만 새 연산 추가는 쉬운 반대 방향의 선택입니다. 어느 쪽 변경이 잦은지로 고릅니다.<\/li>\n<\/ul>"},{"no":193,"t":"의존성 주입을 쓰는 이유는 무엇이고, 서비스 로케이터와는 어떻게 다릅니까?","a":"<p>객체가 필요한 의존 대상을 직접 만들지 않고 밖에서 받는 것입니다. 구체 클래스를 몰라도 되어 결합이 줄고, 테스트에서 가짜를 넣을 수 있고, 싱글턴인지 화면 범위인지 같은 생명주기를 한곳에서 관리하며, 무엇에 의존하는지가 생성자에 드러납니다. 생성자 주입을 권하는 이유는 필수 의존이 빠지면 생성 시점에 바로 드러나고 의존을 불변으로 둘 수 있기 때문입니다.<\/p>\n<p>서비스 로케이터는 객체가 필요할 때 전역 저장소에서 의존을 꺼내 옵니다. 의존이 함수 시그니처에 보이지 않아 숨겨지고, 테스트마다 전역 상태를 설정해야 하며, 등록을 빠뜨린 것이 실행 중에야 발견됩니다.<\/p>\n<p>DI 도구는 컴파일 시점에 그래프를 만드는 방식(Dagger, Hilt)과 실행 시점에 해석하는 방식(Koin)이 있습니다. 앞쪽은 설정이 무겁지만 그래프 오류를 빌드에서 잡고, 뒤쪽은 간단하지만 오류가 실행 시점에 납니다. 작은 앱은 수동 주입으로도 충분합니다.<\/p>","f":"<ul>\n<li><strong>순환 의존이 생기면?<\/strong> Provider나 Lazy로 끊기보다 책임을 다시 나눠야 한다는 설계 신호로 봅니다.<\/li>\n<li><strong>범위를 잘못 지정하면?<\/strong> 화면 범위 객체가 싱글턴에 주입되어 화면이 사라진 뒤에도 남는 누수가 생깁니다.<\/li>\n<\/ul>"},{"no":194,"t":"싱글턴 패턴의 문제점은 무엇이고, 어떻게 다루는 것이 좋습니까?","a":"<p>싱글턴은 인스턴스가 하나임을 보장하고 어디서든 접근하게 합니다. 문제는 \"어디서든 접근\"에서 옵니다. 전역 상태라 의존이 숨겨지고, 테스트 사이에 상태가 공유되어 실행 순서에 따라 결과가 달라지며, 가짜로 교체하기 어렵습니다. 여러 스레드가 함께 쓰면 초기화와 상태 동기화가 필요하고, 프로세스 전체 수명을 가지므로 Context 같은 것을 잡으면 누수가 됩니다. Android에서는 프로세스가 종료되었다가 재시작되면 메모리 싱글턴에 둔 데이터가 사라진다는 점도 놓치기 쉽습니다.<\/p>\n<p>다루는 방법은 \"하나만 존재\"와 \"전역 접근\"을 분리하는 것입니다. 하나만 존재하는 것은 DI 컨테이너의 범위(@Singleton)로 보장하고, 쓰는 쪽은 주입받습니다. 그러면 테스트에서 다른 구현으로 바꿀 수 있습니다.<\/p>\n<p>상태가 없는 싱글턴(순수 함수 모음, 불변 설정)은 문제가 적습니다. 상태를 가진다면 메모리 상한, 로그아웃이나 사용자 전환 때 초기화, 멀티 프로세스에서는 프로세스마다 따로 존재한다는 점(55번)을 함께 설계합니다.<\/p>","f":"<ul>\n<li><strong>Kotlin object를 테스트에서 바꾸려면?<\/strong> 인터페이스 뒤에 두고 그 인터페이스를 주입받게 바꿉니다.<\/li>\n<li><strong>싱글턴이 Application Context를 잡는 것은 괜찮나요?<\/strong> Application은 프로세스와 수명이 같아서 누수가 아닙니다. Activity Context가 문제입니다.<\/li>\n<\/ul>"},{"no":195,"t":"옵저버 패턴과 리액티브 스트림의 관계, 그리고 콜드 스트림과 핫 스트림의 차이를 설명해 보세요.","a":"<p>옵저버 패턴은 주체의 상태 변화를 구독자들에게 알려 발행자와 구독자를 분리합니다. 구독 해제를 빠뜨리면 누수가 되고, 어느 스레드에서 어떤 순서로 알릴지 정해야 합니다. 리액티브 스트림은 여기에 시간 축, map, filter, debounce 같은 연산자, 완료와 오류 신호, 소비자가 따라가지 못할 때의 배압 처리를 더한 것입니다.<\/p>\n<p>콜드 스트림은 구독할 때마다 처음부터 실행됩니다. Kotlin Flow가 기본적으로 콜드라, 같은 Flow를 화면 두 곳에서 수집하면 네트워크 요청도 두 번 나갑니다. 핫 스트림은 구독과 무관하게 흐름이 존재하고 구독한 시점 이후의 값을 받습니다. StateFlow는 항상 최신 값 하나를 가지고 같은 값은 다시 보내지 않아 UI 상태에 맞고, SharedFlow는 다시 보내 줄 개수를 정할 수 있어 여러 구독자에게 같은 흐름을 나눌 때 씁니다.<\/p>\n<p>콜드 Flow를 여러 곳에서 공유해야 하면 stateIn이나 shareIn으로 핫하게 바꾸고, WhileSubscribed(5000)처럼 구독자가 잠시 없어도 유지해 화면 회전 중 재요청을 피합니다. UI에서는 생명주기에 맞춰 수집해 백그라운드에서 쓸데없이 일하지 않게 합니다.<\/p>","f":"<ul>\n<li><strong>토스트 같은 일회성 이벤트를 StateFlow로 보내면?<\/strong> 다시 구독할 때 같은 이벤트가 재전달될 수 있어, 이벤트를 상태로 모델링하고 처리 후 지우는 방식을 권합니다.<\/li>\n<li><strong>소비자가 느릴 때 쓸 수 있는 연산자는?<\/strong> buffer, 최신 값만 남기는 conflate, 새 값이 오면 이전 처리를 취소하는 collectLatest입니다.<\/li>\n<\/ul>"},{"no":196,"t":"실무에서 자주 보는 디자인 패턴을 실제 라이브러리 예와 함께 설명해 보세요.","a":"<p>전략 패턴은 알고리즘을 인터페이스로 갈아 끼우는 것으로 Comparator가 대표이고, Kotlin에서는 함수 타입으로 충분한 경우가 많습니다. 팩토리는 생성 로직을 감추는 것으로 ViewModelProvider.Factory가 있고, Retrofit.create는 동적 프록시로 인터페이스 구현체를 만들어 줍니다. 어댑터는 맞지 않는 인터페이스를 이어 주는 것으로 데이터를 뷰로 잇는 RecyclerView.Adapter, Retrofit의 CallAdapter와 Converter가 있습니다. 데코레이터는 같은 인터페이스로 감싸 기능을 더하는 것으로 BufferedInputStream(FileInputStream(...))이 교과서적인 예입니다.<\/p>\n<p>책임 연쇄는 요청을 처리기 사슬로 넘기는 것으로 OkHttp의 인터셉터가 그렇습니다. 로깅, 인증 헤더, 재시도 인터셉터가 chain.proceed로 이어지고 각자 요청이나 응답을 바꿀 수 있습니다. 빌더는 선택 옵션이 많은 불변 객체를 만드는 것으로 OkHttpClient.Builder가 있습니다.<\/p>\n<p>시니어답게 말하려면 패턴 이름보다 \"어떤 변경을 쉽게 하려고 이 구조를 썼는지\"를 말합니다. 그리고 Kotlin의 고차 함수, 기본 인자와 이름 있는 인자, 위임, sealed class가 고전 패턴 상당수를 더 짧게 대신한다는 점도 덧붙입니다.<\/p>","f":"<ul>\n<li><strong>OkHttp의 애플리케이션 인터셉터와 네트워크 인터셉터 차이는?<\/strong> 애플리케이션 인터셉터는 호출당 한 번이고, 네트워크 인터셉터는 리다이렉트와 재시도마다 실제 네트워크 요청 단위로 실행되며 연결 정보를 볼 수 있습니다.<\/li>\n<li><strong>Kotlin에서 빌더가 여전히 필요한 경우는?<\/strong> Java에서 호출해야 하거나 여러 단계에 걸쳐 조립해야 할 때입니다.<\/li>\n<\/ul>"},{"no":197,"t":"테스트 피라미드와 테스트 대역(목, 스텁, 페이크)을 설명하고, 목을 남용하면 어떤 문제가 생기는지 말해 보세요.","a":"<p>단위 테스트를 가장 많이, 통합 테스트를 중간, UI나 E2E 테스트를 가장 적게 두는 구조입니다. 아래로 갈수록 빠르고 안정적이고, 위로 갈수록 실제와 가깝지만 느리고 잘 깨지기 때문에 피드백 속도와 유지 비용의 균형을 맞춘 것입니다. E2E는 핵심 사용자 흐름에만 둡니다.<\/p>\n<p>테스트 대역에는 자리만 채우는 더미, 정해진 값을 돌려주는 스텁, 가볍지만 실제로 동작하는 페이크(메모리 DB, 메모리 저장소), 호출 여부와 순서를 검증하는 목, 실제 객체에 기록을 더한 스파이가 있습니다.<\/p>\n<p>목을 남용하면 테스트가 \"결과\"가 아니라 \"구현 방식\"을 검증하게 됩니다. 내부 호출 순서를 바꾸는 리팩터링만 해도 테스트가 깨지고, 정작 동작 오류는 잡지 못합니다. 그래서 결과 상태를 확인하는 테스트와 페이크를 우선하고, 목은 이메일 발송처럼 호출 자체가 결과인 경계에 씁니다. Android 공식 테스트 가이드도 목보다 페이크를 권합니다. 좋은 테스트는 결정적(시간, 난수, 스레드를 주입해 제어)이고 서로 독립적이며 실패 메시지가 분명합니다. 커버리지 숫자보다 계산, 상태 전이, 경계값처럼 위험한 로직을 먼저 덮습니다.<\/p>","f":"<ul>\n<li><strong>불안정한 테스트는 어떻게 다루나요?<\/strong> 원인(시간, 순서, 공유 상태, 실제 네트워크)을 찾아 고치고, 고칠 때까지 격리해 신뢰를 잃지 않게 합니다.<\/li>\n<li><strong>페이크가 실제와 달라지는 문제는?<\/strong> 같은 계약 테스트를 실제 구현과 페이크 양쪽에 돌려 동작을 맞춥니다.<\/li>\n<\/ul>"},{"no":198,"t":"코루틴이나 비동기 코드는 어떻게 테스트합니까?","a":"<p>실제 시간을 기다리면 테스트가 느리고 불안정합니다. 그래서 시간과 디스패처를 주입해 테스트가 통제하게 만듭니다. kotlinx-coroutines-test의 runTest는 가상 시간으로 실행해 delay를 실제로 기다리지 않고 건너뛰며, advanceTimeBy와 advanceUntilIdle로 시간을 원하는 만큼 진행시킵니다. StandardTestDispatcher는 명시적으로 진행시킬 때까지 작업을 쌓아 두고, UnconfinedTestDispatcher는 즉시 실행합니다. Dispatchers.setMain으로 Main 디스패처를 테스트용으로 바꾸고, 모든 테스트 디스패처가 같은 스케줄러를 공유하게 합니다.<\/p>\n<p>그래서 프로덕션 코드가 Dispatchers.IO를 직접 쓰지 않고 주입받아야 합니다. 그렇지 않으면 그 부분은 가상 시간 밖에서 실제 스레드로 돌아 기다려 주지 않거나 불안정해집니다. Flow는 Turbine 같은 도구로 나오는 값을 순서대로 확인하고, 시각에 의존하는 로직은 Clock을 주입합니다.<\/p>\n<p>진짜 경쟁 상태는 단위 테스트로 잡기 어렵습니다. 많은 스레드로 반복 실행하는 스트레스 테스트, 불변식 검사, JVM 동시성 테스트 도구(jcstress)를 쓰고, 근본적으로는 공유 상태를 줄이는 설계로 대응합니다.<\/p>","f":"<ul>\n<li><strong>runTest 안에서 무한히 도는 수집 코루틴은?<\/strong> backgroundScope에서 실행하면 테스트 끝에 자동으로 취소됩니다.<\/li>\n<li><strong>viewModelScope를 쓰는 ViewModel은 어떻게 테스트하나요?<\/strong> Main 디스패처를 테스트 디스패처로 바꾸고, 같은 스케줄러로 진행시켜 상태를 확인합니다.<\/li>\n<\/ul>"},{"no":199,"t":"Git의 장점과, merge와 rebase의 차이 및 팀에서의 사용 규칙을 설명해 보세요.","a":"<p>Git은 분산 버전 관리라 모두가 전체 이력을 로컬에 가집니다. 오프라인에서도 커밋할 수 있고 서버가 죽어도 복제본이 남습니다. 브랜치가 커밋을 가리키는 포인터일 뿐이라 만들고 바꾸는 비용이 거의 없어 기능별 브랜치 작업이 자연스럽습니다. 커밋은 스냅샷이고 해시로 식별되어 이력이 조작되면 드러납니다. 스테이징으로 커밋 단위를 조절하고, log, blame, revert, bisect로 추적하고 되돌리며, Pull Request로 코드 리뷰 흐름을 만듭니다.<\/p>\n<p>merge는 두 이력을 병합 커밋으로 합쳐 실제로 일어난 이력을 그대로 남기지만 그래프가 복잡해집니다. rebase는 내 커밋들을 대상 브랜치 끝에 다시 적용해 이력을 한 줄로 만들지만 커밋 해시가 바뀝니다. 그래서 이미 다른 사람과 공유한 브랜치는 rebase하지 않습니다. 남의 로컬 이력과 어긋나기 때문입니다. PR 전체를 커밋 하나로 합치는 squash merge도 많이 씁니다.<\/p>\n<p>팀 규칙은 보통 개인 브랜치 정리에는 rebase, 공유 브랜치에는 merge, main의 이력 정책(squash 여부)은 팀이 합의합니다. bisect는 회귀가 생긴 커밋을 이분 탐색으로 찾는 기능이라 34번과 같은 원리입니다.<\/p>","f":"<ul>\n<li><strong>rebase 중 충돌이 나면?<\/strong> 다시 적용되는 커밋마다 충돌을 풀어야 해서 여러 번 해결할 수 있습니다.<\/li>\n<li><strong>Git Flow와 trunk-based 개발의 차이는?<\/strong> Git Flow는 긴 수명의 브랜치 여러 개로 배포를 관리하고, trunk-based는 짧은 브랜치를 자주 main에 합치고 기능 플래그로 미완성 기능을 숨깁니다.<\/li>\n<\/ul>"},{"no":200,"t":"테스트가 없는 레거시 코드를 맡았습니다. 어떻게 개선을 시작합니까?","a":"<p>처음부터 다시 짜는 것부터 하지 않습니다. 기존 코드에 숨은 요구 사항과 다른 시스템이 기대는 버그까지 잃기 쉽고, 재작성 기간 동안 기능 개발이 멈추며, 대부분 예상보다 오래 걸립니다.<\/p>\n<p>순서는 이렇습니다. 먼저 바꾸려는 부분의 현재 동작을 고정하는 특성 테스트를 씁니다. 지금 출력이 맞다고 가정하고 기록해 두는 테스트라, 이후 변경이 동작을 바꿨는지 알려 줍니다. 다음으로 테스트를 넣을 수 있게 이음매를 만듭니다. 내부에서 직접 만들던 의존을 생성자로 받게 하는 식의 작고 기계적인 리팩터링을 IDE 자동 도구로 합니다. 그 위에서 작은 단계로 개선하고 단계마다 배포 가능한 상태를 유지합니다. 큰 덩어리는 새 구현을 옆에 만들고 기능 플래그로 조금씩 넘기는 스트랭글러 방식으로 교체하며 지표를 비교합니다.<\/p>\n<p>우선순위는 변경이 잦고 장애가 나는 곳입니다. 아무도 건드리지 않고 문제도 없는 레거시는 그대로 둡니다. 리팩터링과 기능 변경은 다른 PR로 나눠 리뷰와 롤백을 쉽게 하고, 효과는 크래시율, 빌드 시간, 변경에 걸리는 시간 같은 지표로 보여 줍니다.<\/p>","f":"<ul>\n<li><strong>기술 부채 해결 시간을 어떻게 확보하나요?<\/strong> 장애 건수와 개발 속도 저하를 숫자로 보여 주고, 기능 작업에 붙여 조금씩 갚는 계획을 제안합니다.<\/li>\n<li><strong>어디가 위험한지 어떻게 찾나요?<\/strong> 변경 빈도와 복잡도를 함께 보면(핫스팟 분석) 손댈 곳의 우선순위가 나옵니다.<\/li>\n<\/ul>"}]}]}}</script>
  <script type="application/json" id="quiz-data">{"android":{"1":[{"q":"nullability 어노테이션이 없는 Java 메서드의 반환값을 Kotlin에서 받을 때 가장 안전한 방법은?","options":["플랫폼 타입 그대로 받아 두고 필요할 때 !!를 붙인다","Kotlin 컴파일러가 null 검사를 자동으로 넣어 주므로 그대로 받는다","val name: String? 처럼 타입을 명시해 경계에서 받는다"],"answer":2,"explanation":"nullability 정보가 없는 Java 반환 타입은 String! 같은 플랫폼 타입이 되고, 컴파일러는 이를 검사하지 않습니다. 경계에서 타입을 명시해 받으면 실패가 그 자리에서 바로 드러납니다.","src":1},{"q":"Kotlin의 val과 List에 대한 설명으로 옳은 것은?","options":["val은 재대입만 막고, List는 수정 메서드가 없는 읽기 전용 인터페이스일 뿐 불변은 아니다","val로 선언한 객체는 내부 상태도 바뀌지 않는다","List 뒤의 실제 객체는 항상 불변 컬렉션이라 다른 코드가 바꿀 수 없다"],"answer":0,"explanation":"List 참조 뒤의 실제 객체가 ArrayList일 수 있어, 같은 객체를 MutableList로 들고 있는 코드가 바꾸면 내 List도 바뀝니다. 상태로 저장하거나 밖으로 내보낼 때는 toList()로 방어적 복사를 합니다.","src":2},{"q":"data class 본문(주 생성자 밖)에 선언한 프로퍼티는 equals와 toString에서 어떻게 다뤄집니까?","options":["주 생성자 프로퍼티와 똑같이 비교되고 출력된다","비교와 출력에서 빠지므로 그 값이 달라도 equals가 true일 수 있다","컴파일 오류가 나서 선언할 수 없다"],"answer":1,"explanation":"컴파일러는 equals, hashCode, toString, copy, componentN을 주 생성자에 선언한 프로퍼티로만 만듭니다.","src":3},{"q":"inline 함수에 넘긴 람다를 필드에 저장하거나 inline이 아닌 함수에 넘겨야 할 때 그 파라미터에 붙이는 것은?","options":["noinline","crossinline","reified"],"answer":0,"explanation":"저장하거나 다른 함수에 넘기는 람다는 호출 지점에 펼칠 수 없으므로 noinline으로 일반 함수 객체로 남깁니다. crossinline은 람다를 다른 실행 맥락에서 부를 때 non-local return을 막고, reified는 타입 인자를 런타임에 쓰게 합니다.","src":5},{"q":"@JvmInline value class Meters(val v: Int)가 박싱되는 경우는?","options":["Meters 타입 지역 변수에 담을 때","List<Meters>나 Meters?처럼 래퍼 자신이 아닌 타입으로 쓰일 때","Meters를 받는 일반 함수의 파라미터로 넘길 때"],"answer":1,"explanation":"value class는 런타임에 감싼 값 하나로 컴파일되지만, 제네릭이나 인터페이스 타입으로 쓰이거나 원시 타입을 감싼 채 nullable로 쓰이면 박싱됩니다. 그래서 List<Meters>는 원소마다 래퍼 객체가 생깁니다.","src":6},{"q":"fun Shape.name()과 fun Circle.name()이 있을 때, val s: Shape = Circle()에서 s.name()은 어느 쪽을 부릅니까?","options":["Shape 쪽 확장 함수. 변수의 선언 타입으로 컴파일 타임에 정해진다","Circle 쪽 확장 함수. 실행 시점 객체의 클래스로 정해진다","어느 쪽인지 모호하다는 컴파일 오류가 난다"],"answer":0,"explanation":"확장 함수는 수신 객체를 첫 파라미터로 받는 정적 메서드로 컴파일되어 가상 디스패치 대상이 아닙니다. 시그니처가 같은 멤버 함수가 있으면 멤버가 항상 이깁니다.","src":7},{"q":"by lazy의 기본 모드와, 초기화 블록이 예외를 던졌을 때의 동작으로 옳은 것은?","options":["기본은 NONE이고, 예외가 나면 null이 저장된다","기본은 SYNCHRONIZED이고, 예외가 나면 값이 저장되지 않아 다음 접근 때 다시 실행된다","기본은 PUBLICATION이고, 예외가 나면 이후 접근도 계속 같은 예외를 던진다"],"answer":1,"explanation":"SYNCHRONIZED는 여러 스레드가 동시에 읽어도 초기화 블록이 한 번만 실행되도록 잠급니다. 메인 스레드에서만 쓰는 값이면 NONE으로 동기화 비용을 아낄 수 있습니다.","src":10},{"q":"Collection 연산보다 Sequence가 오히려 느려지기 쉬운 경우는?","options":["원소가 적고 map, filter 단계가 두세 개뿐인 짧은 체인","원소가 많고 first나 take로 일찍 끝낼 수 있는 체인","원소가 많고 단계가 긴 체인"],"answer":0,"explanation":"Collection의 map, filter는 inline이라 단순한 루프로 펼쳐지지만, Sequence는 단계마다 람다 객체와 Iterator 래퍼가 생깁니다. 작은 컬렉션에서는 중간 리스트를 아끼는 이득보다 이 비용이 큽니다.","src":13}],"2":[{"q":"suspend 함수가 스레드를 막지 않는다는 말의 정확한 뜻은?","options":["suspend 함수 안의 블로킹 코드도 컴파일러가 논블로킹으로 바꿔 준다는 뜻이다","suspend 함수는 항상 별도 스레드 풀에서 실행된다는 뜻이다","중단하는 동안 COROUTINE_SUSPENDED를 반환하고 호출 스택을 빠져나가 스레드를 돌려준다는 뜻이다"],"answer":2,"explanation":"컴파일러는 suspend 함수를 Continuation을 받는 상태 머신(CPS)으로 바꿉니다. 함수 안에서 블로킹 호출을 하면 그 스레드는 그대로 막힙니다.","src":19},{"q":"자식 코루틴이 부모 스코프의 컨텍스트에서 물려받지 않고 새로 만드는 Element는?","options":["CoroutineDispatcher","CoroutineName","Job"],"answer":2,"explanation":"자식은 부모 컨텍스트를 물려받고 빌더 인자로 일부를 덮어쓰지만, Job만은 새로 만들어 부모 Job의 자식으로 붙입니다. 이것이 Job 트리와 구조화된 동시성의 바탕입니다.","src":21},{"q":"Job.cancel()을 불러도 코루틴이 계속 도는 대표적인 경우는?","options":["중단 지점 없이 도는 CPU 계산 루프","delay를 반복 호출하는 루프","withContext 블록 안에서 suspend 함수를 부르는 코드"],"answer":0,"explanation":"취소는 협력적이라 다음 중단 지점이나 isActive 같은 명시적 확인에서 CancellationException으로 끝납니다. 중단 지점이 없는 루프나 스레드를 막는 블로킹 호출은 이 확인을 하지 않습니다.","src":24},{"q":"코루틴 안에서 catch (e: Exception)이나 runCatching으로 예외를 잡을 때의 함정은?","options":["Error 계열만 잡히고 일반 예외는 빠져나간다","CancellationException까지 잡혀 취소된 코루틴이 계속 진행한다","suspend 함수 안에서는 try-catch가 동작하지 않는다"],"answer":1,"explanation":"JVM에서 CancellationException은 IllegalStateException의 하위 타입이라 catch (e: Exception)에 걸리고, Throwable을 잡는 runCatching도 같습니다. 떠난 화면을 갱신하거나 재시도가 취소를 실패로 오인하는 문제가 생깁니다.","src":25},{"q":"CoroutineExceptionHandler가 없을 때 viewModelScope.launch로 시작한 작업 하나가 예외로 실패하면?","options":["다른 작업도 모두 취소되고 예외는 조용히 사라진다","다른 작업은 계속 돌고 예외는 로그만 남긴 채 무시된다","SupervisorJob이라 다른 작업은 계속 돌지만, 예외를 받아 줄 곳이 없어 앱이 크래시한다"],"answer":2,"explanation":"SupervisorJob은 자식의 실패를 부모와 형제에게 전파하지 않습니다. 대신 끝까지 전파할 곳이 없는 예외는 스레드의 uncaught exception handler로 넘어가 크래시합니다.","src":27},{"q":"화면 상태를 stateIn으로 만들 때 기본 선택인 SharingStarted는?","options":["WhileSubscribed(5000)","Eagerly","Lazily"],"answer":0,"explanation":"화면 상태는 화면이 보이는 동안만 업스트림이 돌면 됩니다. Lazily는 첫 구독 뒤 스코프가 끝날 때까지, Eagerly는 즉시 시작해 스코프가 끝날 때까지 업스트림을 돌립니다.","src":32},{"q":"lifecycleScope.launch { flow.collect { } }가 문제인 이유는?","options":["lifecycleScope는 백그라운드 스레드에서 실행되어 UI를 갱신할 수 없다","lifecycleScope는 DESTROYED에서야 취소되어, 화면이 STOPPED여도 수집과 업스트림이 계속 돈다","collect가 첫 값을 받은 뒤 끝나 이후 값을 놓친다"],"answer":1,"explanation":"보이지 않는 동안에도 위치, 센서, DB 관찰이 돌고 STOPPED 이후 Fragment 트랜잭션으로 크래시가 날 수 있습니다. View에서는 repeatOnLifecycle(STARTED), Compose에서는 collectAsStateWithLifecycle로 수집합니다.","src":33},{"q":"flow { } 블록 안에서 withContext(Dispatchers.IO) { emit(x) }를 하면 어떻게 됩니까?","options":["IO 스레드에서 정상적으로 값이 내보내진다","값은 내보내지지만 수집하는 쪽도 IO 스레드로 옮겨진다","컨텍스트 보존 원칙 위반으로 IllegalStateException이 난다. 업스트림 컨텍스트는 flowOn으로 바꾼다"],"answer":2,"explanation":"Flow는 수집하는 쪽의 컨텍스트에서 emit해야 하며, 다른 컨텍스트에서 emit하면 Flow invariant is violated 예외가 납니다.","src":38}],"3":[{"q":"Compose에서 상태를 어느 단계에서 읽느냐가 중요한 이유는?","options":["상태를 읽은 단계부터 다시 실행되므로, 드로잉 단계에서 읽으면 컴포지션과 레이아웃을 건너뛸 수 있다","상태가 바뀌면 항상 컴포지션부터 세 단계를 모두 다시 실행하므로 차이가 없다","레이아웃 단계에서 읽은 상태는 화면에 반영되지 않는다"],"answer":0,"explanation":"한 프레임은 컴포지션, 레이아웃, 드로잉 순서로 처리되고, 상태를 읽은 단계부터 다시 돕니다. 읽는 위치가 곧 비용입니다.","src":43},{"q":"strong skipping 모드가 기본이 된 지금(Kotlin 2.0.20 이후), 불안정 파라미터는 어떻게 비교됩니까?","options":["불안정 파라미터가 하나라도 있으면 그 컴포저블은 건너뛸 수 없다","인스턴스 동일성(===)으로 비교해 같은 인스턴스면 건너뛴다","안정 파라미터와 똑같이 equals로 비교한다"],"answer":1,"explanation":"안정 파라미터는 equals로, 불안정 파라미터는 ===로 비교합니다. 재시작 가능한 모든 컴포저블이 건너뛰기 대상이 되었습니다.","src":45},{"q":"구성 변경과 프로세스 종료 뒤에도 남아야 하는 작은 UI 요소 상태(예: 펼침 여부)를 두는 곳은?","options":["rememberSaveable","remember","retain"],"answer":0,"explanation":"remember는 컴포지션 안에서만, retain은 구성 변경 동안 직렬화 없이 같은 인스턴스로 유지됩니다. rememberSaveable은 Bundle에 저장되어 프로세스 종료까지 견딥니다. 비즈니스 로직에서 나온 화면 상태는 ViewModel에 둡니다.","src":46},{"q":"스크롤 위치에서 맨 위로 버튼을 보일지 정하듯, 자주 바뀌는 상태에서 드물게 바뀌는 결과를 만들 때 쓰는 것은?","options":["remember(key) { }","SideEffect","derivedStateOf"],"answer":2,"explanation":"derivedStateOf는 결과가 이전과 같으면 그 결과를 읽는 쪽을 무효화하지 않으므로, 버튼을 그리는 컴포저블은 결과가 바뀔 때만 리컴포지션됩니다.","src":48},{"q":"리스너를 등록하고 컴포저블이 사라질 때 반드시 해제해야 하는 작업에 맞는 API는?","options":["SideEffect","produceState","DisposableEffect"],"answer":2,"explanation":"DisposableEffect는 onDispose에서 해제를 보장합니다. SideEffect는 리컴포지션이 적용될 때마다 외부 객체를 맞추는 용도, produceState는 외부 값을 State로 바꾸는 용도입니다.","src":49},{"q":"collectAsStateWithLifecycle과 snapshotFlow의 방향을 바르게 짝지은 것은?","options":["둘 다 Flow를 State로 바꾼다","collectAsStateWithLifecycle은 Flow를 State로, snapshotFlow는 State를 Flow로 바꾼다","collectAsStateWithLifecycle은 State를 Flow로, snapshotFlow는 Flow를 State로 바꾼다"],"answer":1,"explanation":"ViewModel의 StateFlow는 collectAsStateWithLifecycle로 받아 그리고, 스크롤 위치처럼 Compose가 가진 상태를 ViewModel로 흘려보낼 때 snapshotFlow를 씁니다.","src":50},{"q":"스크롤 오프셋처럼 매 프레임 바뀌는 값으로 요소를 움직일 때 성능을 지키는 방법은?","options":["값을 컴포저블 본문에서 읽고 remember로 감싼다","람다를 받는 Modifier API로 바꿔 값을 레이아웃이나 드로잉 단계에서 읽는다","값이 바뀔 때마다 LaunchedEffect로 리컴포지션을 강제한다"],"answer":1,"explanation":"본문에서 읽으면 매 프레임 컴포지션, 레이아웃, 드로잉이 모두 다시 돕니다. 상태 읽기를 늦출수록 앞 단계를 건너뜁니다.","src":54},{"q":"value와 onValueChange 방식 TextField에서 커서가 튀거나 글자가 사라지는 원인은?","options":["TextField가 StateFlow를 지원하지 않아서","rememberSaveable을 쓰지 않아서","onValueChange로 받은 값을 debounce나 코루틴을 거쳐 늦게 되돌려, 입력 상태를 비동기로 갱신해서"],"answer":2,"explanation":"입력 상태는 동기로 즉시 갱신하고, 검색 요청은 그 상태에서 파생한 별도 Flow에서 처리합니다. 지금 공식 문서는 TextFieldState를 쓰는 상태 기반 TextField를 권장합니다.","src":64}],"4":[{"q":"Google 권장 앱 아키텍처와 Clean Architecture의 가장 큰 차이는?","options":["Google 가이드에는 Data 계층이 없다","의존 방향. Google 가이드는 UI에서 Domain, Data 순서로 의존하고, Clean Architecture는 Data가 Domain의 인터페이스를 구현해 안쪽으로만 의존한다","Clean Architecture는 Domain 계층을 선택 사항으로 둔다"],"answer":1,"explanation":"Google 가이드에서는 UseCase가 Data 계층의 Repository 클래스에 의존하는 것이 기본입니다. Clean Architecture는 의존 규칙 때문에 의존 역전이 필요합니다. Google 문서도 두 domain layer를 혼동하지 말라고 적습니다.","src":67},{"q":"MVI가 MVVM에 비해 더 잘 푸는 문제는?","options":["View와 화면 로직을 처음으로 분리한다","입력을 Intent로 받아 Reducer 한 곳에서 새 상태를 만들게 해, 상태가 바뀌는 길을 모아 재현과 추적을 쉽게 한다","ViewModel 없이 View가 Repository를 직접 부르게 한다"],"answer":1,"explanation":"둘 다 UI 계층의 Presentation 패턴입니다. MVVM도 View와 화면 로직을 나누고, MVI는 여기에 상태 변경 경로를 한 곳으로 모읍니다.","src":68},{"q":"새로고침 중에도 기존 검색 결과를 계속 보여 줘야 하는 화면 상태는 어떻게 모델링합니까?","options":["겹칠 수 있는 필드는 data class에 함께 두고, 배타적인 부분만 sealed 필드로 둔다","Loading, Success, Error를 가진 sealed interface 하나로만 표현한다","새로고침 중에는 상태를 Loading으로 바꿔 기존 결과를 지운다"],"answer":0,"explanation":"한 번에 하나만 참인 상태는 sealed가 맞지만, 새로고침 중 결과 표시나 부분 오류처럼 상태가 겹치면 sealed 하나로는 표현이 깨집니다.","src":69},{"q":"UseCase를 만들지 않는 편이 나은 경우는?","options":["여러 ViewModel이 같은 비즈니스 로직을 쓸 때","Repository 함수를 그대로 전달하기만 할 때","복잡한 비즈니스 로직이 있을 때"],"answer":1,"explanation":"Google 가이드에서 Domain 계층은 선택 사항이고 UseCase는 필요할 때만 더합니다. 모든 접근을 UseCase로 강제하면 이득 없이 복잡도만 늘 수 있습니다.","src":70},{"q":"네트워크와 로컬 DB를 함께 쓰는 오프라인 우선 앱에서 Single Source of Truth로 두는 것은?","options":["로컬 DB. UI는 DB의 Flow를 구독하고 네트워크 응답은 DB에 쓴다","네트워크 응답. DB는 캐시로만 쓰고 UI는 응답을 바로 그린다","ViewModel이 들고 있는 메모리 상태"],"answer":0,"explanation":"SSOT만 데이터를 바꿀 수 있고 밖에는 불변 타입으로 내보냅니다. 네트워크 응답을 UI로 바로 보내지 않고 DB에 쓰면 화면이 한 경로로만 갱신됩니다.","src":71},{"q":"오프라인에서도 되는 즐겨찾기 추가에서, 재시도가 서버에 중복 생성을 만들지 않게 하는 방법은?","options":["재시도 횟수를 1회로 제한한다","클라이언트가 만든 멱등 키를 요청에 붙인다","네트워크가 없으면 즐겨찾기 버튼을 비활성화한다"],"answer":1,"explanation":"로컬 DB에 먼저 쓰고 화면에 바로 반영한 뒤, WorkManager가 네트워크가 연결될 때 재시도합니다. 멱등 키가 있으면 같은 요청이 여러 번 가도 서버는 한 번만 반영합니다.","src":72},{"q":"Hilt와 Koin의 차이로 옳은 것은?","options":["Hilt는 컴파일 타임에 의존 그래프를 만들고 검증하고, Koin은 기본 구성에서 처음 요청할 때 누락이 예외로 드러난다","Koin은 Dagger 위에서 동작하고 Hilt는 실행 중 컨테이너에서 정의를 찾는다","둘 다 실행 중에 리플렉션으로 그래프를 만든다"],"answer":0,"explanation":"Hilt는 Dagger 위에서 누락과 범위 오류를 빌드에서 잡습니다. Koin도 verify()나 컴파일러 플러그인으로 검사를 앞당길 수 있지만 정의를 찾는 일은 실행 시점에 일어납니다.","src":73},{"q":"기능 모듈 사이 화면 이동을 서로 의존하지 않고 하려면?","options":["검색 모듈이 장소 상세 모듈의 impl을 직접 의존해 화면 클래스를 부른다","각 기능의 api 모듈에 이동 계약을 두고, 구현은 impl 모듈이 DI로 내보내며, 앱 모듈만 내비게이션 그래프를 조립한다","모든 화면을 하나의 공통 모듈로 모은다"],"answer":1,"explanation":"검색 기능은 장소 상세의 구현을 모른 채 이동만 요청하고, 장소 상세를 고쳐도 검색 모듈은 다시 빌드되지 않습니다.","src":75}],"5":[{"q":"같은 Activity가 띄운 Dialog가 화면에 뜨면 그 Activity의 생명주기 콜백은?","options":["onPause가 불린다","onPause와 onStop이 불린다","불리지 않는다. Dialog는 Activity 위에 뜬 별도 창일 뿐이다"],"answer":2,"explanation":"완전히 가려지면 onPause와 onStop이, 반투명 Activity처럼 일부라도 보이면 onPause까지만 불립니다. Dialog는 이 경우에 해당하지 않습니다.","src":86},{"q":"프로세스 종료 뒤 사용자가 앱으로 돌아왔을 때 남아 있는 것은?","options":["ViewModel과 싱글턴, 메모리 캐시","시스템이 보관한 저장된 상태와 태스크의 백 스택","remember로 기억한 값"],"answer":1,"explanation":"구성 변경은 Activity만 다시 만들어 ViewModel과 싱글턴이 남지만, 프로세스 종료는 ViewModel을 포함한 모든 메모리가 사라지고 사용자가 돌아오면 마지막 화면부터 복원됩니다.","src":87},{"q":"Fragment에서 View를 다루는 작업을 viewLifecycleOwner에 묶어야 하는 이유는?","options":["백 스택에 들어가면 Fragment 인스턴스는 남고 View만 파괴되어, Fragment의 Lifecycle이 View보다 오래 살기 때문","viewLifecycleOwner가 백그라운드 스레드에서 실행되기 때문","Fragment의 Lifecycle은 onCreateView 전에 끝나기 때문"],"answer":0,"explanation":"replace와 addToBackStack으로 바꾸면 이전 Fragment는 onDestroyView까지만 가서 CREATED에 머물고, 돌아올 때 onCreateView부터 View를 다시 만듭니다.","src":88},{"q":"콜드 스타트에서 매니페스트에 등록된 ContentProvider의 onCreate는 언제 불립니까?","options":["Application.onCreate보다 먼저, 메인 스레드에서","첫 Activity가 그려진 뒤 백그라운드 스레드에서","앱이 그 Provider를 처음 조회할 때"],"answer":0,"explanation":"그래서 라이브러리가 자동 초기화용으로 넣은 Provider와 Application.onCreate의 초기화 코드가 모두 첫 프레임을 늦춥니다.","src":92},{"q":"Bundle에 넣은 데이터가 1MB보다 작은데도 TransactionTooLargeException이 날 수 있는 이유는?","options":["Bundle은 최대 100KB까지만 담을 수 있기 때문","Parcelable은 Serializable보다 크게 직렬화되기 때문","1MB인 Binder 트랜잭션 버퍼를 프로세스에서 진행 중인 모든 트랜잭션이 함께 쓰기 때문"],"answer":2,"explanation":"화면 사이에는 ID처럼 작은 값만 넘기고, 데이터는 받는 쪽이 Repository에서 다시 읽습니다.","src":94},{"q":"늦어져도 되지만 앱이 종료되거나 기기가 재부팅되어도 끝까지 보장해야 하는 작업은 무엇으로 합니까?","options":["포그라운드 서비스","AlarmManager","WorkManager"],"answer":2,"explanation":"사용자가 시작하고 진행을 지켜보는 작업은 포그라운드 서비스, 정해진 시각에 알려야 하는 일은 AlarmManager입니다. JobScheduler는 WorkManager가 내부에서 씁니다.","src":98},{"q":"targetSdk 34 이상 앱이 BroadcastReceiver를 코드로 등록할 때 반드시 지정해야 하는 것은?","options":["RECEIVER_EXPORTED나 RECEIVER_NOT_EXPORTED","foregroundServiceType","FLAG_IMMUTABLE이나 FLAG_MUTABLE"],"answer":0,"explanation":"다른 앱의 브로드캐스트를 받을지를 명시해야 합니다. targetSdk 26 이상에서는 암시적 브로드캐스트를 manifest로 받을 수 없어 예외 목록만 manifest에 둡니다.","src":100},{"q":"SharedPreferences의 apply()가 ANR을 낼 수 있는 이유는?","options":["apply()는 commit()과 달리 동기로 디스크에 쓰기 때문","apply()가 매번 파일 전체를 클라우드로 백업하기 때문","Activity나 Service가 시작하거나 멈추기 전에, 밀린 디스크 쓰기가 끝나기를 프레임워크가 메인 스레드에서 기다리기 때문"],"answer":2,"explanation":"apply()는 쓰기를 비동기로 미루지만 그 시점에 메인 스레드가 기다릴 수 있습니다. 새 저장소는 DataStore로 만듭니다.","src":102}],"6":[{"q":"앱 시작 시간을 볼 때 기준으로 삼는 두 지표는?","options":["웜 스타트 기준의 FPS와 APK 크기","콜드 스타트 기준의 TTID와 TTFD","핫 스타트 기준의 PSS와 GC 횟수"],"answer":1,"explanation":"현장 값은 Android vitals와 ApplicationStartInfo로, 개발 중에는 Macrobenchmark의 StartupTimingMetric으로 잽니다.","src":107},{"q":"Baseline Profile이 첫 실행을 빠르게 하는 원리는?","options":["R8이 그 코드를 지워 APK를 줄인다","첫 실행 때 서버에서 미리 컴파일된 코드를 내려받는다","핵심 흐름에서 쓰는 클래스와 메서드 목록을 함께 배포해, 설치할 때 ART가 그 부분을 미리 AOT 컴파일한다"],"answer":2,"explanation":"Startup Profile은 그중 시작 경로만 담은 부분집합으로, 빌드 때 R8이 DEX 배치를 바꾸는 데 씁니다.","src":108},{"q":"R8 full mode에서 가장 자주 깨지는 곳은?","options":["코루틴의 suspend 함수","Compose의 remember 블록","리플렉션과 직렬화처럼 런타임에 이름으로 코드를 찾는 곳"],"answer":2,"explanation":"AGP 8.0부터 full mode가 기본입니다. keep 규칙은 필요한 곳만 좁게 쓰고, 릴리스와 같은 R8 설정의 빌드로 QA합니다.","src":109},{"q":"Android 메모리 누수의 대표적인 형태는?","options":["지역 변수에 큰 비트맵을 잠깐 담는 것","싱글턴, 등록한 리스너, 끝나지 않는 코루틴처럼 화면보다 오래 사는 것이 Activity나 View를 붙잡는 것","data class 인스턴스를 많이 만드는 것"],"answer":1,"explanation":"GC는 루트에서 닿는 객체를 회수하지 않습니다. 개발 중에는 LeakCanary로 잡고, 고칠 때는 등록과 해제를 같은 생명주기 쌍에 둡니다.","src":111},{"q":"가장 흔한 ANR인 input dispatching timed out의 기준과 대표 원인은?","options":["1초 안에 프레임을 그리지 못한 것이고, 원인은 GPU 과부하다","10초 안에 네트워크 응답이 없는 것이고, 원인은 서버 지연이다","입력 이벤트에 5초 안에 응답하지 못한 것이고, 메인 스레드가 디스크 I/O, 락 대기, 동기 Binder 호출에 묶인 것이 대표 원인이다"],"answer":2,"explanation":"분석은 Android vitals의 ANR 클러스터와 ApplicationExitInfo의 ANR 트레이스로 하고, 개발 중에는 StrictMode로 메인 스레드 I/O를 미리 잡습니다.","src":114},{"q":"OkHttp에서 401 응답을 받아 토큰을 갱신하고 다시 보내는 역할을 맡기는 곳은?","options":["Authenticator. 동시에 401이 여러 개 와도 갱신은 한 번만 한다","network interceptor. 요청마다 토큰을 새로 받는다","EventListener. 401을 기록하고 재시도한다"],"answer":0,"explanation":"토큰은 application interceptor가 헤더에 붙이고, 갱신이 거절되면 로그아웃합니다.","src":117},{"q":"기기에 토큰 같은 비밀을 저장하는 방법으로 지금 권장되는 것은?","options":["Android Keystore 안에서 만든 키로 암호화해 저장하거나 Tink 기반 datastore-tink를 쓴다","EncryptedSharedPreferences에 저장한다","Base64로 인코딩해 SharedPreferences에 저장한다"],"answer":0,"explanation":"security-crypto는 1.1.0-alpha07에서 모든 API가 deprecated되었습니다. 저장 파일은 백업에서 빼고, 서버용 비밀은 애초에 앱에 넣지 않습니다.","src":120},{"q":"결제 검증이나 포인트처럼 조작되면 안 되는 판단은 어디서 합니까?","options":["앱 안의 난독화된 코드","서버. 앱과 기기가 정상인지는 Play Integrity 판정을 서버에서 확인한다","루팅 탐지를 통과한 기기의 앱"],"answer":1,"explanation":"APK는 디컴파일과 후킹으로 결국 분석되므로 클라이언트는 신뢰할 수 없다는 전제에서 시작합니다. 루팅 탐지와 서명 검사는 우회되는 보조 신호입니다.","src":122}],"7":[{"q":"Google Play 서비스가 있는 기기에서 위치를 얻는 표준 API는?","options":["LocationManager의 GPS_PROVIDER","FusedLocationProviderClient","TelephonyManager의 셀 정보"],"answer":1,"explanation":"FLP는 GPS, Wi-Fi, 셀, 센서 신호를 합쳐 정한 정확도와 간격에 맞는 방법을 고르고 배터리를 조절합니다. LocationManager는 Play 서비스가 없는 환경의 대안입니다.","src":125},{"q":"Android 12부터 위치 권한 설계에서 꼭 대비해야 하는 점은?","options":["FINE을 요청해도 사용자가 대략적 위치만 허용할 수 있다","COARSE 권한이 폐지되었다","포그라운드 위치를 받으면 백그라운드 위치도 자동으로 허용된다"],"answer":0,"explanation":"COARSE와 FINE을 한 요청으로 묻고, 대략적 위치만 있을 때 어디까지 동작할지 미리 정합니다. 백그라운드 위치는 꼭 필요한 기능에서만 따로 요청합니다.","src":126},{"q":"화면이 꺼져도 주행 안내를 이어 가는 구조로 맞는 것은?","options":["ACCESS_BACKGROUND_LOCATION을 받아 WorkManager로 주기적으로 위치를 받는다","Activity의 onStop 이후에도 화면 코드에서 위치 요청을 유지한다","안내를 시작할 때 foregroundServiceType이 location인 포그라운드 서비스를 시작해 위치 수집과 안내 계산을 맡긴다"],"answer":2,"explanation":"포그라운드 서비스가 실행 중이면 홈 버튼을 누르거나 화면을 꺼도 포그라운드 위치로 봅니다. 화면과 서비스는 같은 Repository의 StateFlow를 봅니다.","src":127},{"q":"targetSdk 29 이상에서 지오펜싱에 대한 설명으로 옳은 것은?","options":["ACCESS_FINE_LOCATION과 ACCESS_BACKGROUND_LOCATION이 모두 필요해, 백그라운드 위치 권한을 피하는 수단이 아니다","위치 권한 없이 쓸 수 있다","ACCESS_COARSE_LOCATION만 있으면 된다"],"answer":0,"explanation":"안내 중이라면 포그라운드 서비스 안에서 도착 감지를 처리하고, 앱이 꺼져 있을 때도 반응해야 하는 기능만 지오펜싱을 검토합니다.","src":128},{"q":"앱이 백그라운드이고 안내도 진행 중이 아닐 때 위치 요청은?","options":["PRIORITY_HIGH_ACCURACY와 1초 간격을 유지한다","BALANCED로 바꿔 계속 받는다","요청 자체를 해제한다"],"answer":2,"explanation":"안내 중 주행은 HIGH_ACCURACY와 짧은 간격, 지도만 볼 때는 BALANCED와 긴 간격처럼 상황마다 LocationRequest를 바꿔 다시 등록합니다.","src":129},{"q":"위치 콜백 Flow를 화면과 안내 서비스가 함께 쓰면서 FLP 등록을 하나만 유지하는 방법은?","options":["callbackFlow로 감싼 뒤 Repository가 앱 스코프에서 shareIn으로 공유한다","화면과 서비스가 각자 requestLocationUpdates를 부른다","콜백 결과를 SharedPreferences에 써서 공유한다"],"answer":0,"explanation":"awaitClose에서 removeLocationUpdates로 해제하고, SharingStarted.WhileSubscribed로 공유하면 아무도 수집하지 않을 때 위치 요청이 해제됩니다.","src":131},{"q":"경로 이탈을 확정하는 방식으로 알맞은 것은?","options":["경로까지의 거리와 진행 방향이 함께 벗어난 상태가 몇 번 연속되거나 일정 시간 이어질 때만 확정한다","위치 하나가 경로에서 벗어나면 즉시 재탐색을 보낸다","위치 정확도와 무관하게 고정 거리 하나로 판정한다"],"answer":0,"explanation":"임계값은 위치 정확도에 따라 넓히고, 재탐색 요청은 늘 하나만 두어 새로 확정되면 이전 요청을 취소합니다.","src":132},{"q":"지도처럼 OpenGL로 그리는 화면에 기본으로 쓰는 것은?","options":["TextureView","ImageView","SurfaceView"],"answer":2,"explanation":"SurfaceView의 Surface는 SurfaceFlinger가 앱 UI와 따로 합성해 추가 GPU 복사가 없습니다. TextureView는 반투명과 회전이 자유롭지만 내용을 복사해 합성하므로 비용이 더 듭니다.","src":137}],"8":[{"q":"Java 8부터 HashMap에서 한 버킷에 키가 몰렸을 때 바뀐 점은?","options":["몰린 버킷을 레드블랙 트리로 바꿔 최악을 O(log n)으로 낮춘다","버킷 배열을 두 배로 늘려 항상 O(1)을 보장한다","충돌한 키를 거부하고 예외를 던진다"],"answer":0,"explanation":"해시가 고르면 평균 O(1)이지만, 키가 한 버킷에 몰리면 equals로 하나씩 비교해 최악 O(n)이 됩니다. JEP 180이 이를 트리로 완화했습니다.","src":138},{"q":"ArrayMap과 SparseArray를 쓰는 주된 이유는?","options":["항목별 객체와 박싱을 없애 메모리를 아끼려고. 조회는 이진 탐색이라 대체로 HashMap보다 느리다","HashMap보다 조회가 항상 빠르기 때문","스레드 안전하기 때문"],"answer":0,"explanation":"공식 문서도 일반적으로 HashMap보다 느리고, 항목이 수백 개까지인 컨테이너에서는 그 차이가 50% 미만이라고 적습니다.","src":139},{"q":"LRU 캐시를 O(1)로 구현하는 자료구조 조합은?","options":["정렬된 배열과 이진 탐색","힙과 스택","해시맵과 이중 연결 리스트"],"answer":2,"explanation":"해시맵으로 노드를 O(1)에 찾고, 리스트로 사용 순서를 유지합니다. 이중 연결이어야 중간 노드를 O(1)에 떼어 낼 수 있습니다.","src":141},{"q":"음수가 없는 가중치 그래프에서 목적지까지 남은 비용의 하한을 추정할 수 있을 때 고르는 최단 경로 알고리즘은?","options":["BFS","A*","벨만 포드"],"answer":1,"explanation":"가중치가 없으면 BFS, 음수 없는 가중치면 다익스트라, 하한 추정이 가능하면 A*, 음수 간선이 있으면 벨만 포드입니다. 대륙 규모 도로망은 Contraction Hierarchies 같은 전처리 기법을 씁니다.","src":143},{"q":"검색어 자동완성에서 노드마다 인기 상위 k개를 미리 저장해 두고 쓰는 자료구조는?","options":["해시맵","트라이","힙"],"answer":1,"explanation":"문자 하나가 간선 하나라 접두사 길이 L에 대해 O(L)로 해당 노드에 닿고, 저장해 둔 상위 k개를 바로 돌려줍니다.","src":144},{"q":"Geohash, S2, H3 같은 공간 인덱스의 공통 방식은?","options":["지구 표면을 셀로 나눠 셀 ID라는 1차원 키를 만들고 일반 B-트리나 키 값 저장소에 넣는다","위도와 경도 컬럼에 인덱스를 따로 건다","공간 자체를 트리로 나눠 노드마다 영역 사각형을 저장한다"],"answer":0,"explanation":"Quadtree와 R-tree는 공간을 트리로 나누는 다른 갈래입니다. 어느 쪽이든 인덱스로 후보를 좁힌 뒤 실제 거리로 반경 밖을 거릅니다.","src":145},{"q":"Kotlin의 sortedBy가 안정 정렬이라는 점이 실무에서 중요한 이유는?","options":["안정 정렬은 항상 O(n)이라 빠르다","관련도순 목록을 별점순으로 다시 정렬해도, 별점이 같은 항목끼리는 관련도 순서가 남는다","안정 정렬은 추가 메모리를 쓰지 않는다"],"answer":1,"explanation":"JVM에서 Kotlin은 원소를 객체 배열로 옮겨 TimSort로 정렬합니다. 기본형 배열 정렬은 Dual-Pivot Quicksort라 불안정하지만 같은 값의 기본형은 구별되지 않아 문제가 없습니다.","src":147},{"q":"동적 계획법과 분할 정복의 차이는?","options":["동적 계획법은 같은 하위 문제가 반복되어 답을 저장해 다시 쓰고, 분할 정복은 하위 문제가 독립이라 저장할 이유가 없다","분할 정복만 재귀를 쓴다","동적 계획법은 매 단계 그 순간 가장 좋아 보이는 선택만 한다"],"answer":0,"explanation":"동적 계획법에는 중복 하위 문제와 최적 부분 구조가 필요합니다. 메모이제이션은 위에서 아래로, 타뷸레이션은 아래에서 위로 채웁니다.","src":149}],"9":[{"q":"캐시에 없는 도메인에 TCP 위 TLS 1.3으로 처음 HTTPS 요청을 보낼 때, 서버 처리 시간을 빼고 드는 최소 왕복은?","options":["1 RTT. 요청과 응답만 왕복한다","2 RTT. DNS와 요청만 왕복한다","4 RTT. DNS, TCP 3-way handshake, TLS 1.3 핸드셰이크, 요청과 응답에 1 RTT씩 든다"],"answer":2,"explanation":"그래서 첫 요청이 느리고, 연결 재사용과 캐시가 체감 속도를 좌우합니다. 같은 호스트의 연결이 풀에 살아 있으면 요청과 응답 1 RTT만 남습니다.","src":151},{"q":"TCP에서 확인 응답 없이 보낼 수 있는 데이터 양을 정하는 것은?","options":["수신 윈도우만","수신자가 알려 주는 수신 윈도우와 송신자가 추정하는 혼잡 윈도우 중 작은 값","수신 윈도우와 혼잡 윈도우의 합"],"answer":1,"explanation":"흐름 제어는 받는 쪽 버퍼를, 혼잡 제어는 중간 네트워크를 지킵니다. 모바일에서는 무선 손실과 짧은 연결 때문에 혼잡 제어가 대역폭을 다 쓰지 못하는 일이 잦습니다.","src":153},{"q":"HTTP/2에서도 남아 있는 HOL 블로킹은 어디서 생깁니까?","options":["TCP의 순서 보장 때문에 전송 계층에서","응답을 요청 순서대로 보내야 하는 애플리케이션 계층에서","HTTP/2에는 HOL 블로킹이 전혀 없다"],"answer":0,"explanation":"HTTP/1.1은 애플리케이션 계층에서 막히고, HTTP/2는 그것을 풀었지만 TCP 패킷 하나가 빠지면 모든 스트림이 기다립니다. HTTP/3는 QUIC이 스트림마다 순서를 관리해 이것까지 없앴습니다.","src":154},{"q":"QUIC이 Wi-Fi에서 셀룰러로 바뀌어도 연결을 유지할 수 있는 이유는?","options":["연결을 IP 주소와 포트가 아니라 연결 ID로 식별하기 때문","TCP Keep-Alive를 더 자주 보내기 때문","두 망의 DNS 캐시를 공유하기 때문"],"answer":0,"explanation":"손실된 스트림만 기다리는 것도 무선망에서의 이점입니다. OkHttp는 HTTP/3를 기본 지원하지 않으므로 Android에서는 Cronet이나 플랫폼 HttpEngine을 씁니다.","src":155},{"q":"TLS 1.3 0-RTT를 쓸 때 지켜야 할 조건은?","options":["처음 연결할 때만 쓸 수 있다","리플레이 공격을 막아 주지 않으므로 다시 실행돼도 안전한 요청에만 쓴다","인증서 검증을 생략하므로 사내망에서만 쓴다"],"answer":1,"explanation":"0-RTT는 이전 세션의 키로 첫 메시지에 요청까지 싣는 모드입니다. Android 10 이상 플랫폼 TLS는 TLS 1.3을 기본으로 켜지만 0-RTT는 지원하지 않습니다.","src":156},{"q":"HTTPS 중간자 공격이 성공하는 경우는?","options":["공격자가 서버 IP와 포트를 알아냈을 때","공용 Wi-Fi에 접속했을 때는 항상 성공한다","클라이언트가 가짜 인증서를 믿게 될 때. 믿지 말아야 할 CA를 믿거나, CA가 잘못 발급했거나, 앱이 검증을 꺼 버린 경우다"],"answer":2,"explanation":"중간자는 유효한 인증서의 개인키가 없어 가짜 인증서를 내밀 수밖에 없습니다. 클라이언트는 체인, 유효 기간, 도메인, 핸드셰이크 서명을 확인합니다.","src":157},{"q":"Cache-Control의 no-cache와 no-store를 바르게 설명한 것은?","options":["no-cache는 저장을 금지하고, no-store는 확인 없이 계속 쓴다","둘은 같은 뜻이다","no-cache는 저장은 하되 쓰기 전에 매번 서버에 확인하고, no-store는 저장 자체를 금지한다"],"answer":2,"explanation":"확인은 ETag를 If-None-Match로 보내는 조건부 요청으로 하고, 바뀌지 않았으면 서버가 본문 없이 304를 돌려줍니다.","src":158},{"q":"자동 재시도를 해도 되는 요청의 조건으로 알맞은 것은?","options":["멱등한 요청이거나 멱등 키가 있는 요청이 일시적인 오류로 실패했을 때","응답이 4xx인 모든 요청","타임아웃이 난 결제 요청이라면 같은 요청을 즉시 다시 보낸다"],"answer":0,"explanation":"응답을 받기 전에 연결이 끊기면 서버가 처리했는지 알 수 없어, 멱등성이 없으면 결제나 주문이 두 번 처리됩니다. 재시도에는 지수 백오프와 지터를 더하고 횟수와 기한을 정합니다.","src":161}],"10":[{"q":"같은 프로세스의 스레드끼리 공유하지 않고 스레드마다 따로 갖는 것은?","options":["스택, 레지스터와 프로그램 카운터","힙","열린 파일"],"answer":0,"explanation":"코드, 힙, 전역 데이터, 열린 파일은 같은 프로세스의 스레드끼리 공유합니다. 앱이 프로세스를 여러 개 쓰면 메모리, 싱글턴, 초기화가 프로세스마다 따로 생깁니다.","src":165},{"q":"프로세스 전환이 같은 프로세스의 스레드 전환보다 비싼 주된 이유는?","options":["프로세스 전환 때마다 메모리 전체를 디스크에 기록하기 때문","주소 공간까지 바뀌어 캐시와 TLB 미스 같은 간접 비용이 커지기 때문","스레드 전환은 커널을 전혀 거치지 않기 때문"],"answer":1,"explanation":"직접 비용은 커널 진입, 레지스터 저장과 복원, 스케줄러 실행이고, 더 큰 것은 새 작업의 데이터와 주소 변환 정보가 캐시와 TLB에 없어 생기는 간접 비용입니다.","src":166},{"q":"코어 하나에서 두 작업을 번갈아 실행하는 경우를 바르게 설명한 것은?","options":["병렬성은 있지만 동시성은 없다","동시성과 병렬성이 모두 있다","동시성은 있지만 병렬성은 없다"],"answer":2,"explanation":"동시성은 여러 작업이 겹치는 시간 동안 함께 진행되는 구조이고, 병렬성은 같은 순간 여러 코어에서 실제로 실행되는 것입니다.","src":168},{"q":"뮤텍스와 세마포어의 차이로 옳은 것은?","options":["세마포어는 한 번에 하나만 들여보낸다","뮤텍스는 다른 스레드가 대신 풀어도 된다","뮤텍스는 소유권이 있어 잠근 쪽이 풀어야 하고, 세마포어는 허가 수를 세며 소유권이 없다"],"answer":2,"explanation":"세마포어는 동시에 N개까지 들여보내고 다른 스레드가 허가를 돌려줄 수 있습니다. 코루틴 코드에서는 kotlinx.coroutines의 Mutex와 Semaphore를 씁니다.","src":169},{"q":"실무에서 Deadlock을 예방하는 가장 흔한 방법은?","options":["모든 공유 변수에 volatile을 붙인다","락 획득 순서를 전역으로 정해 순환 대기를 깬다","스레드 우선순위를 높인다"],"answer":1,"explanation":"상호 배제, 점유 대기, 비선점, 순환 대기 네 조건이 모두 성립해야 Deadlock이 되므로 하나만 깨면 됩니다. 앱의 메인 스레드가 걸리면 ANR로 드러납니다.","src":170},{"q":"@Volatile var count에 대해 여러 스레드가 count++를 하면 안전하지 않은 이유는?","options":["volatile은 가시성을 보장하지 않기 때문","volatile은 가시성과 순서는 보장하지만, 읽기, 더하기, 쓰기로 이뤄진 연산의 원자성은 보장하지 않기 때문","volatile 변수는 CPU 캐시에만 저장되기 때문"],"answer":1,"explanation":"두 스레드가 같은 값을 읽고 각자 더해 쓰면 하나가 사라집니다. 원자적 갱신이 필요하면 AtomicInteger 같은 Atomic을 씁니다.","src":171},{"q":"kotlinx.coroutines의 Dispatchers.Default와 Dispatchers.IO에 대한 설명으로 옳은 것은?","options":["IO와 Default는 서로 완전히 별도의 스레드 풀이다","Default는 스레드 64개, IO는 코어 수만큼 쓴다","Default는 최대 스레드 수가 CPU 코어 수(최소 2)인 계산용 풀이고, IO는 병렬 한도 기본값이 64와 코어 수 중 큰 값이며 Default와 스레드를 공유한다"],"answer":2,"explanation":"I/O 대기 위주 작업은 기다리는 동안 다른 작업이 CPU를 쓸 수 있어 코어 수보다 많은 스레드를 둡니다. 경험식은 코어 수 × (1 + 대기 시간 / 계산 시간)입니다.","src":175},{"q":"GC가 회수하는 객체는?","options":["오래 쓰지 않은 객체","참조 카운트가 0인 객체만. 순환 참조는 회수되지 않는다","GC 루트에서 참조로 닿을 수 없는 객체. 서로 참조하는 순환 구조도 루트에서 닿지 않으면 회수된다"],"answer":2,"explanation":"GC 루트는 스레드 스택의 지역 변수, static 필드, JNI 전역 참조 같은 것입니다. ART의 GC는 대부분 앱과 동시에 돌지만 할당이 많을수록 자주 돌아 프레임 예산을 갉아먹습니다.","src":176}],"11":[{"q":"장소 검색 화면(자동완성, 최근 검색어, 결과 목록, 지도) 설계의 결론으로 알맞은 것은?","options":["모드마다 별도 Activity를 띄우고 Intent로 검색어를 넘긴다","ViewModel 하나가 입력 전(최근 검색어), 입력 중(자동완성), 제출 뒤(결과와 지도) 세 모드를 하나의 화면 상태로 내보낸다","자동완성, 최근 검색어, 결과 목록마다 독립된 ViewModel을 두고 서로 이벤트를 주고받는다"],"answer":1,"explanation":"데이터는 기기 저장소와 서버 API로 나눕니다. 설계 문제는 먼저 범위를 확인하고 가정을 밝힌 뒤 결론부터 답합니다.","src":178},{"q":"주행 안내 클라이언트 구조에서 안내 상태를 두는 곳으로 알맞은 것은?","options":["싱글턴 세션 하나가 소유하고, 계산은 위치 포그라운드 서비스 안에서 돌리며, 화면, 알림, 음성은 그 상태를 구독한다","안내 화면의 ViewModel이 소유하고, 화면이 꺼지면 상태를 서버에 올린다","알림이 상태를 소유하고 화면은 알림에서 값을 읽는다"],"answer":0,"explanation":"화면이 꺼지거나 다른 앱을 쓰는 동안에도 안내가 이어져야 하므로 상태와 계산은 화면 밖에 있어야 합니다.","src":179},{"q":"여러 기기에서 쓰는 즐겨찾기 동기화 설계로 알맞은 것은?","options":["바뀔 때마다 서버의 전체 목록을 내려받아 로컬을 덮어쓴다","기기마다 로컬 DB 먼저 쓰기, 멱등 키, 버전 충돌 감지, 삭제 표시를 두고, 서버를 최종 기준으로 커서 기반 증분 동기화와 변경 신호 푸시를 더한다","로컬 DB 없이 매번 서버 API를 불러 화면을 그린다"],"answer":1,"explanation":"4절의 오프라인 쓰기 구조를 기기마다 두고 그 위에 동기화를 얹는 설계입니다.","src":180},{"q":"지도에 주변 주유소와 충전소를 보여 줄 때 요청과 캐시 설계로 알맞은 것은?","options":["지도가 움직일 때마다 화면 영역 전체를 즉시 다시 요청한다","모든 장소를 앱 시작 때 한 번에 받아 영구히 캐시한다","지도가 멈춘 영역을 셀 단위 키로 바꿔 셀마다 요청하고 캐시하며, 정적 정보와 실시간 정보(가격, 충전기 상태)는 요청과 만료 시간을 나눈다"],"answer":2,"explanation":"셀 단위로 나누면 조금만 움직였을 때 겹치는 셀은 캐시에서 쓰고 새 셀만 요청합니다. 자주 바뀌는 정보만 짧은 만료로 따로 받습니다.","src":181},{"q":"홈 화면 첫 표시를 빠르게 하는 데이터 로딩 설계로 알맞은 것은?","options":["모든 API 응답이 올 때까지 스플래시 화면을 유지한다","실시간 정보부터 받아 그린 뒤 기기 데이터를 읽는다","마지막으로 저장한 값으로 첫 화면을 먼저 그리고, 기기 데이터, 서버 구성, 실시간 정보 순으로 뒤에서 갱신한다"],"answer":2,"explanation":"네트워크를 기다리지 않고 그릴 수 있는 것부터 그리는 구조입니다.","src":182},{"q":"사용자가 많은 앱에 새 기능을 안전하게 배포하는 체계의 핵심은?","options":["앱 배포와 기능 노출을 분리한다. 코드는 꺼진 플래그 뒤에 넣어 정기 배포하고, 원격 플래그로 노출 비율을 늘리며 지표로 진행과 중단을 판단한다","기능이 완성될 때마다 전체 사용자에게 바로 배포한다","문제가 생기면 사용자에게 이전 버전 APK를 다시 설치하게 한다"],"answer":0,"explanation":"앱 업데이트 없이 문제 기능을 끌 수 있어야 롤백이 빨라집니다.","src":183},{"q":"성능과 안정성 감시 체계의 두 고리로 알맞은 것은?","options":["출시 뒤 스토어 리뷰만 모니터링한다","개발 중에는 고정된 조건의 벤치마크로 회귀를 막고, 출시 뒤에는 버전별 현장 지표를 이전 버전과 비교해 경보를 낸다","개발자 기기에서 디버그 빌드로 체감 속도를 확인한다"],"answer":1,"explanation":"지표마다 기준값과 담당을 정해 두어야 경보가 대응으로 이어집니다.","src":184},{"q":"View 기반 대형 앱을 Compose로 옮기는 계획으로 알맞은 것은?","options":["기능 개발을 멈추고 모든 화면을 한 번에 다시 작성한다","View와 Compose는 함께 쓸 수 없으므로 모듈 하나씩 통째로 바꾼다","전면 재작성 없이 새 화면은 Compose로, 기존 화면은 기능 변경이 생길 때 화면 단위로 옮기되, 빌드 조건, 디자인 시스템, 측정 기준을 먼저 갖춘다"],"answer":2,"explanation":"ComposeView와 AndroidView로 섞어 쓸 수 있으므로 화면 단위 점진 전환이 가능합니다. 단계마다 완료 기준을 둡니다.","src":185}]},"cs":{"1":[{"q":"동적 배열이 꽉 찼을 때 용량을 일정량이 아니라 배수로 늘리는 이유는?","options":["배수로 늘리면 add 한 번의 최악 시간도 O(1)이 되기 때문","배수로 늘려야 n개를 넣는 동안 복사 총량이 O(n)이 되어 add가 분할상환 O(1)이 되기 때문","일정량으로 늘리면 메모리를 더 많이 쓰기 때문"],"answer":1,"explanation":"두 배씩 늘리면 복사 총량이 n + n/2 + n/4 + ... 로 2n을 넘지 않습니다. 10칸씩 늘리면 전체가 O(n²)이 됩니다. 분할상환은 평균이 낮다는 뜻이지 한 번의 최악이 작다는 뜻이 아닙니다.","src":2},{"q":"equals만 재정의하고 hashCode는 재정의하지 않으면 생기는 버그는?","options":["논리적으로 같은 두 객체가 다른 버킷에 들어가, HashSet에 중복 저장되거나 contains가 false를 돌려준다","컴파일 오류가 난다","HashMap 조회가 항상 O(n)이 된다"],"answer":0,"explanation":"equals가 true인 두 객체는 hashCode가 같아야 합니다. 반대로 hashCode가 같다고 equals가 true일 필요는 없습니다(충돌 허용).","src":4},{"q":"로그 1억 건에서 응답 시간 상위 100건을 메모리를 아끼며 뽑는 방법은?","options":["전체를 메모리에 올려 정렬한 뒤 앞의 100건을 고른다","1억 건을 모두 최대 힙에 넣고 100번 꺼낸다","크기 100짜리 최소 힙을 유지하며 스트림으로 읽는다. 시간 O(N log K), 메모리 O(K)"],"answer":2,"explanation":"힙이 다 찼으면 새 값이 힙의 최솟값보다 클 때만 최솟값을 빼고 넣습니다. 전체 정렬은 O(N log N)에 메모리 N이 듭니다.","src":8},{"q":"DB 인덱스가 이진 트리가 아니라 B+트리를 쓰는 이유는?","options":["B+트리는 디스크를 전혀 읽지 않기 때문","노드 하나를 디스크 페이지 하나로 잡아 수백 개 키를 담으므로, 높이가 3~4 수준으로 낮아 페이지 I/O가 적기 때문","이진 트리는 범위 검색을 할 수 없기 때문"],"answer":1,"explanation":"디스크와 SSD는 페이지 단위로 읽습니다. 1억 건이면 이진 트리 높이는 약 27이고 노드마다 다른 페이지일 수 있습니다.","src":10},{"q":"블룸 필터의 보장으로 옳은 것은?","options":["거짓 양성은 있고 거짓 음성은 없다","거짓 음성은 있고 거짓 양성은 없다","거짓 양성과 거짓 음성이 모두 없다"],"answer":0,"explanation":"k개 위치가 모두 1이면 있을 수도 있음, 하나라도 0이면 확실히 없음입니다. 아주 적은 메모리로 없는 것을 빠르게 걸러 낼 때 씁니다.","src":15},{"q":"Kotlin String의 length가 사용자가 보는 글자 수와 다른 이유는?","options":["length는 UTF-8 바이트 수를 세기 때문","length는 UTF-16 코드 유닛 수라, 이모지 같은 서로게이트 쌍이나 여러 코드 포인트를 묶은 한 글자가 2 이상으로 세어지기 때문","length는 공백과 줄바꿈을 세지 않기 때문"],"answer":1,"explanation":"사람이 보는 한 글자(grapheme cluster)가 length 2~10 이상이 되기도 합니다. 입력 글자 수 제한은 이 글자 단위로 세야 합니다.","src":20},{"q":"캐시 서버를 3대에서 4대로 늘렸더니 적중률이 급락했습니다. 원인과 해결책은?","options":["hash(key) % N으로 서버를 고르면 N이 바뀔 때 대부분의 키가 다른 서버로 가기 때문이다. 일관된 해싱으로 바꾼다","서버가 늘어 서버당 메모리가 줄었기 때문이다. 서버 메모리를 늘린다","TTL이 짧기 때문이다. TTL을 늘린다"],"answer":0,"explanation":"3에서 4로 바꾸면 키의 약 3/4이 다른 서버로 가서 사실상 캐시를 비운 것과 같고, 그 요청이 한꺼번에 DB로 몰립니다.","src":21},{"q":"최근 본 상품 20개를 중복 없이 최신 순으로 보여 주는 자료구조는?","options":["ArrayList에 계속 추가하고 화면에서 중복을 거른다","TreeSet에 상품 ID 순으로 넣는다","LinkedHashMap이나 LinkedHashSet. 다시 보면 지우고 다시 넣고, 20개를 넘으면 가장 오래된 첫 원소를 지운다"],"answer":2,"explanation":"모든 연산이 O(1)이고, 사실상 용량 20짜리 LRU 캐시와 같은 구조입니다.","src":28}],"2":[{"q":"퀵 정렬이 최악 O(n²)이 되는 대표적인 경우는?","options":["입력이 무작위로 섞여 있을 때","원소 수가 2의 거듭제곱일 때","첫 원소나 마지막 원소를 피벗으로 쓰면서 이미 정렬된 입력을 받을 때"],"answer":2,"explanation":"피벗이 매번 최솟값이나 최댓값이 되면 분할이 n-1 대 0으로 갈라집니다. 같은 값이 아주 많은 입력을 두 갈래로만 나눌 때도 그렇습니다.","src":30},{"q":"병합 정렬이 퀵 정렬보다 나은 경우는?","options":["추가 메모리를 최소로 써야 할 때","최악에도 O(n log n)이 보장되어야 하거나, 안정 정렬이 필요하거나, 연결 리스트처럼 순차 접근만 가능할 때","작은 배열을 캐시 친화적으로 빠르게 정렬해야 할 때"],"answer":1,"explanation":"메모리에 다 안 들어가는 데이터를 디스크에서 정렬하는 외부 정렬도 병합 정렬이 기본입니다.","src":31},{"q":"10GB 로그 파일을 메모리 1GB로 정렬하는 방법은?","options":["1GB씩 읽어 정렬한 조각 파일 10개를 만든 뒤, 최소 힙으로 k-way 병합한다","가상 메모리를 10GB로 늘려 한 번에 퀵 정렬한다","파일을 10개로 나눠 각각 정렬한 뒤 차례로 이어 붙인다"],"answer":0,"explanation":"두 번째 단계에서 각 조각 파일의 앞부분을 버퍼로 읽고, 힙으로 가장 작은 원소를 골라 결과 파일에 씁니다.","src":33},{"q":"이분 탐색을 적용할 수 있는 정확한 조건은?","options":["원소가 모두 서로 다를 것","어떤 조건이 한 지점 이후로 계속 참인(거짓, 거짓, ..., 참, 참) 단조성","배열 크기가 2의 거듭제곱일 것"],"answer":1,"explanation":"그래서 배열 탐색뿐 아니라 D일 안에 배송하는 최소 트럭 용량처럼 답 자체를 이분 탐색하는 매개 변수 탐색에도 씁니다.","src":34},{"q":"다익스트라가 음수 간선에서 틀리는 이유는?","options":["거리가 가장 짧은 미확정 정점을 확정하는 탐욕적 가정이, 나중에 음수 간선으로 돌아오는 더 짧은 경로 때문에 깨지기 때문","음수 가중치는 우선순위 큐에 넣을 수 없기 때문","음수 간선이 있으면 그래프가 항상 끊어지기 때문"],"answer":0,"explanation":"음수 간선이 있으면 모든 간선을 V-1번 완화하는 벨만 포드를 쓰고, V번째에도 줄어들면 음수 사이클입니다.","src":36},{"q":"멀티 모듈 프로젝트의 빌드 순서를 정하고 순환 의존을 찾는 알고리즘은?","options":["위상 정렬. Kahn 알고리즘에서 모든 정점을 꺼내지 못하면 사이클이 있다","다익스트라","크루스칼"],"answer":0,"explanation":"모듈을 정점, 의존 관계를 간선으로 둔 방향 그래프에서 O(V+E)입니다.","src":37},{"q":"0/1 배낭 문제를 1차원 dp로 풀 때 무게 w를 큰 값부터 작은 값으로 도는 이유는?","options":["큰 무게부터 채워야 최적이기 때문","메모리를 O(1)로 줄이기 위해서","같은 물건을 두 번 쓰지 않기 위해서. 작은 쪽부터 돌면 무한 배낭 문제가 된다"],"answer":2,"explanation":"시간 O(nW), 메모리 O(W)입니다. W는 값의 크기라 입력 길이에 지수적이어서 다항 시간이라고 하지 않습니다.","src":43},{"q":"모든 순열이 같은 확률로 나오는 올바른 셔플 방법은?","options":["Fisher-Yates. 뒤에서부터 i번째 원소를 0부터 i 사이에서 무작위로 고른 원소와 바꾼다","각 원소를 0부터 n-1 사이 무작위 위치의 원소와 바꾼다","무작위 결과를 돌려주는 비교 함수로 정렬한다"],"answer":0,"explanation":"각 원소를 전체 범위의 무작위 위치와 바꾸면 n의 n제곱 가지 경우가 n! 개 순열에 고르게 나뉘지 않아 편향이 생깁니다. Collections.shuffle과 Kotlin shuffled가 Fisher-Yates입니다.","src":51}],"3":[{"q":"실행 중인 프로세스가 I/O를 요청하면 어느 상태로 갑니까?","options":["실행에서 대기로","실행에서 준비로","대기에서 준비로"],"answer":0,"explanation":"타임 슬라이스를 다 쓰면 실행에서 준비로, I/O가 끝나면 대기에서 준비로 갑니다. 이 정보는 PCB에 저장됩니다.","src":57},{"q":"기아와 우선순위 역전의 해결책을 바르게 짝지은 것은?","options":["기아는 우선순위 상속, 우선순위 역전은 에이징","기아는 에이징, 우선순위 역전은 우선순위 상속","둘 다 라운드 로빈으로 해결한다"],"answer":1,"explanation":"에이징은 기다린 시간만큼 우선순위를 올립니다. 우선순위 상속은 높은 우선순위 작업이 기다리는 락을 쥔 낮은 작업의 우선순위를 잠시 올려 락을 빨리 풀게 합니다.","src":59},{"q":"스핀락이 유리한 경우는?","options":["임계 구역 안에서 디스크 I/O를 할 때","코어가 하나뿐인 기기에서 오래 기다릴 때","임계 구역이 매우 짧고 다른 코어에서 락이 곧 풀릴 것이 확실할 때"],"answer":2,"explanation":"잠들고 깨어나는 컨텍스트 스위칭이 없는 대신, 기다리는 동안 CPU를 계속 씁니다. 커널의 인터럽트 처리처럼 잠들 수 없는 문맥에서도 씁니다.","src":63},{"q":"조건 변수로 생산자 소비자를 구현할 때 대기 조건을 if가 아니라 while로 확인하는 이유는?","options":["while이 if보다 빠르게 컴파일되기 때문","가짜 깨어남이 있고, 신호를 받고 락을 다시 얻기 전에 다른 소비자가 항목을 먼저 가져갈 수 있기 때문","notify가 항상 모든 스레드를 깨우기 때문"],"answer":1,"explanation":"깨어났을 때 조건이 여전히 참이라는 보장이 없으므로 다시 확인하고, 여전히 비어 있으면 다시 기다립니다.","src":66},{"q":"교착 상태와 라이브락의 차이로 옳은 것은?","options":["라이브락은 스레드가 잠들어 CPU를 쓰지 않는다","둘은 같은 현상의 다른 이름이다","교착 상태는 스레드가 잠들어 CPU를 거의 쓰지 않고, 라이브락은 계속 양보하거나 재시도하느라 CPU를 쓰지만 진행하지 못한다"],"answer":2,"explanation":"tryLock 실패 뒤 둘이 똑같은 간격으로 재시도할 때 라이브락이 생깁니다. 기아는 전체는 진행하지만 특정 스레드만 계속 밀리는 상태입니다.","src":67},{"q":"FIFO 페이지 교체에서 프레임을 늘렸는데 페이지 폴트가 오히려 늘어나는 현상은?","options":["스래싱","외부 단편화","벨레이디 이상"],"answer":2,"explanation":"OPT는 미래를 알아야 해서 비교 기준으로만 쓰고, LRU는 성능이 좋지만 접근마다 시각을 기록하는 정확한 구현은 비싸서 실제 OS는 근사 방식을 씁니다.","src":71},{"q":"Android Zygote가 앱 프로세스를 빠르게 띄울 수 있는 이유는?","options":["프레임워크를 미리 올려 둔 Zygote를 fork하고, Copy-on-Write로 쓰지 않는 페이지는 계속 공유하기 때문","앱마다 새 런타임을 처음부터 띄우되 여러 개를 병렬로 띄우기 때문","설치된 모든 앱의 코드를 미리 메모리에 올려 두기 때문"],"answer":0,"explanation":"fork는 메모리를 즉시 복사하지 않고, 어느 한쪽이 쓰려고 할 때 그 페이지만 복사합니다.","src":75},{"q":"Android meminfo의 기본 지표이고, 모든 프로세스의 값을 더하면 실제 사용량과 맞는 것은?","options":["RSS","USS","PSS"],"answer":2,"explanation":"RSS는 공유 페이지를 통째로 세어 더하면 실제보다 크고, PSS는 공유 페이지를 공유하는 프로세스 수로 나눕니다. USS는 그 프로세스만 쓰는 페이지로, 종료하면 돌아오는 양입니다.","src":86}],"4":[{"q":"L1 캐시 접근(약 1나노초)을 1초로 늘려 보면 DRAM과 NVMe SSD 접근은 대략 어느 정도입니까?","options":["DRAM은 약 2초, SSD는 약 1분","DRAM은 약 2분, SSD는 약 하루","DRAM과 SSD 모두 약 1시간"],"answer":1,"explanation":"DRAM은 약 100나노초, NVMe SSD는 수십에서 100마이크로초, HDD는 수 밀리초입니다. 빠를수록 비싸고 작으며, 이 자릿수 차이가 캐시와 지역성을 중요하게 만듭니다.","src":88},{"q":"2차원 배열을 행 순서로 돌 때가 열 순서로 돌 때보다 빠른 이유는?","options":["열 순서는 컴파일러가 최적화하지 못하는 문법이기 때문","행 안의 원소가 메모리에 연속으로 놓여, 한 번 가져온 64바이트 캐시 라인을 끝까지 쓰기 때문","행 순서로 돌면 원소를 덜 읽기 때문"],"answer":1,"explanation":"프리페처도 순차 접근에 맞춰져 있습니다. 열 순서로 돌면 접근마다 다른 라인을 가져와 캐시 미스가 반복됩니다.","src":89},{"q":"false sharing이란?","options":["두 스레드가 같은 변수를 락 없이 공유해 값이 틀리는 버그","캐시가 꺼져 모든 접근이 DRAM으로 가는 현상","서로 다른 스레드가 서로 다른 변수를 쓰는데, 두 변수가 같은 캐시 라인에 있어 그 라인이 코어 사이를 계속 오가는 성능 저하"],"answer":2,"explanation":"캐시 일관성은 라인 단위로 관리되므로 논리적으로는 공유가 없는데 하드웨어에서는 공유가 생깁니다. 스레드별 카운터를 배열에 나란히 두는 코드가 전형적인 예입니다.","src":90},{"q":"캐시 일관성 프로토콜(MESI)이 있는데도 다른 스레드가 쓴 값을 못 볼 수 있는 이유는?","options":["MESI는 코어가 하나일 때만 동작하기 때문","쓰기 버퍼, 무효화 큐, 명령 재배치, 컴파일러와 JIT의 레지스터 최적화가 있기 때문","캐시 라인이 변수보다 작기 때문"],"answer":1,"explanation":"가시성은 캐시만의 문제가 아닙니다. 그래서 volatile, 락, Atomic 같은 언어의 메모리 모델 도구로 happens-before 관계를 만들어야 합니다.","src":91},{"q":"같은 반복문이 정렬된 배열에서 더 빠른 이유는?","options":["정렬된 배열은 메모리를 덜 쓰기 때문","정렬된 배열이면 컴파일러가 반복문을 없애기 때문","분기 결과가 일정한 패턴이 되어 분기 예측이 잘 맞기 때문"],"answer":2,"explanation":"CPU는 분기 방향을 추측해 미리 실행하고, 추측이 틀리면 미리 한 일을 버리고 파이프라인을 비워 수십 사이클을 손해 봅니다.","src":92},{"q":"금액 계산에 맞는 방법은?","options":["double로 계산하고 화면에 보일 때만 반올림한다","BigDecimal이나 원, 센트 같은 최소 단위의 정수(Long)로 계산한다","float으로 계산해 메모리를 아낀다"],"answer":1,"explanation":"0.1은 이진수로 무한히 반복되는 소수라 double에 정확히 담을 수 없어, 0.1 + 0.2 == 0.3이 false가 됩니다.","src":93},{"q":"Kotlin에서 Math.abs(Int.MIN_VALUE)의 결과는?","options":["Int.MAX_VALUE다","여전히 음수(Int.MIN_VALUE)다","ArithmeticException이 난다"],"answer":1,"explanation":"2의 보수 범위는 -2³¹에서 2³¹-1까지로 비대칭이고, Java와 Kotlin은 오버플로가 나도 예외 없이 반대쪽 끝으로 돌아갑니다.","src":94},{"q":"앱이 느린데 CPU 사용률은 낮다면 먼저 무엇을 봅니까?","options":["스레드 상태 타임라인에서 잠금 대기, I/O 대기, 실행 대기 중 무엇이 긴지 본다","샘플링 프로파일러로 가장 뜨거운 함수를 찾는다","더 빠른 CPU 기기에서 다시 재 본다"],"answer":0,"explanation":"CPU가 한가한데 느리면 무언가를 기다리는 것입니다. CPU 사용률이 높고 특정 함수에 시간이 몰릴 때 플레임 그래프로 뜨거운 함수를 찾습니다.","src":97}],"5":[{"q":"Wi-Fi, IP, TCP, HTTP를 TCP/IP 4계층에 바르게 배치한 것은?","options":["Wi-Fi는 링크, IP는 인터넷, TCP는 전송, HTTP는 응용 계층","Wi-Fi는 인터넷, IP는 전송, TCP는 응용, HTTP는 링크 계층","Wi-Fi와 IP는 링크, TCP와 HTTP는 전송 계층"],"answer":0,"explanation":"OSI는 7계층 참조 모델이고 실제 인터넷은 TCP/IP 4계층으로 동작합니다. TLS는 전송 위, 응용 아래에 있어 어느 한 계층에 딱 맞지 않습니다.","src":98},{"q":"TCP 연결을 3번 주고받아 맺는 이유는?","options":["보안을 위해 같은 정보를 세 번 확인하기 때문","양쪽이 서로의 초기 순서 번호를 보내고 확인받아야 하는데, 서버의 확인과 자기 SYN을 하나로 합쳐 3번이 되기 때문","패킷 손실에 대비해 같은 SYN을 세 번 보내기 때문"],"answer":1,"explanation":"2번으로 끝내면 서버는 자기 순서 번호가 전달됐는지 모르고, 네트워크에 떠돌던 옛 SYN 때문에 원치 않는 연결이 열릴 수도 있습니다.","src":101},{"q":"TCP 연결 종료에 4번 주고받는 이유는?","options":["양방향을 따로 닫을 수 있어(half-close), 방향마다 FIN과 ACK가 필요하기 때문","종료 과정에서 데이터를 다시 암호화하기 때문","3-way handshake를 거꾸로 한 번 더 하기 때문"],"answer":0,"explanation":"한쪽이 FIN을 보내고 ACK를 받아도 상대는 남은 데이터를 더 보낸 뒤 자기 FIN을 보냅니다.","src":102},{"q":"TCP 송신자가 같은 ACK를 세 번 받으면?","options":["연결을 끊고 다시 맺는다","혼잡 윈도우를 두 배로 늘린다","재전송 타이머를 기다리지 않고 바로 재전송한다"],"answer":2,"explanation":"TCP는 순서 번호와 누적 ACK, 재전송, 슬라이딩 윈도우, SACK로 신뢰성을 보장합니다. 체크섬은 약해서 무결성은 TLS가 맡습니다.","src":104},{"q":"다음 HTTP 메서드 중 멱등하지 않은 것은?","options":["PUT","DELETE","POST"],"answer":2,"explanation":"멱등성은 응답 코드가 아니라 서버 상태 기준이라 DELETE를 두 번 해 두 번째가 404여도 멱등입니다. 타임아웃 난 결제 같은 POST는 멱등 키로 중복을 막습니다.","src":109},{"q":"403 응답에 대한 클라이언트 대응으로 알맞은 것은?","options":["누구인지는 알지만 권한이 없는 것이라 재시도하지 않고 권한 안내를 보여 준다","토큰을 갱신하고 다시 보낸다","지수 백오프로 재시도한다"],"answer":0,"explanation":"401은 인증이 안 된 상태라 토큰 갱신이나 재로그인으로 대응합니다. 503은 일시적 과부하라 Retry-After를 보고 재시도할 수 있습니다.","src":110},{"q":"TLS 1.3이 TLS 1.2보다 첫 연결 왕복을 줄인 방법은?","options":["인증서 검증을 생략한다","TCP 연결 수립을 생략한다","ClientHello에 키 교환용 공개값(ECDHE)을 미리 넣어 보내, ServerHello 시점부터 양쪽이 공유 비밀을 계산한다"],"answer":2,"explanation":"그 뒤의 인증서, CertificateVerify, Finished는 암호화해서 보냅니다. TLS 1.3 첫 연결은 1 RTT이고, TLS 1.2는 같은 일에 2 RTT가 들었습니다.","src":118},{"q":"HTTP/2나 WebSocket처럼 연결 하나로 오래 많은 요청을 보낼 때 L4 로드 밸런서의 문제는?","options":["L4는 TCP를 지원하지 않는다","연결 단위로 분산하므로 특정 서버에 요청이 쏠린다. 요청 단위로 나누는 L7이 맞다","L4는 TLS 연결을 항상 끊어 버린다"],"answer":1,"explanation":"L4는 빠르고 프로토콜과 상관없지만 요청 내용을 모릅니다. L7은 경로별 라우팅, TLS 종료, 재시도까지 할 수 있지만 비용이 더 듭니다.","src":124}],"6":[{"q":"REPEATABLE READ에서 표준상 생길 수 있는 이상 현상은?","options":["범위 조회에 새 행이 나타나는 팬텀","커밋되지 않은 값을 읽는 더티 리드","같은 행을 다시 읽으면 값이 바뀌는 반복 불가능 읽기"],"answer":0,"explanation":"READ UNCOMMITTED는 더티 리드, READ COMMITTED는 반복 불가능 읽기, REPEATABLE READ는 표준상 팬텀이 생길 수 있고, SERIALIZABLE은 순서대로 실행한 것과 같은 결과를 보장합니다.","src":133},{"q":"MVCC의 핵심 동작은?","options":["모든 읽기에 공유 락을 걸어 쓰기를 막는다","행을 덮어쓰지 않고 여러 버전을 남겨, 읽기는 자기 스냅샷 시점에 맞는 버전을 본다","쓰기를 큐에 모아 한 번에 처리한다"],"answer":1,"explanation":"읽기가 쓰기를 막지 않고 쓰기도 읽기를 막지 않습니다. 쓰기끼리의 충돌은 여전히 락으로 처리합니다.","src":135},{"q":"낙관적 락을 구현하는 방법은?","options":["SELECT ... FOR UPDATE로 행을 먼저 잠근다","version 컬럼을 두고 WHERE version = ? 조건으로 갱신해, 영향받은 행이 0이면 충돌로 본다","테이블 전체에 락을 건다"],"answer":1,"explanation":"충돌이 드물 때 맞습니다. 충돌이 잦으면 먼저 잠그는 비관적 락이 낫지만 대기와 교착 상태 위험이 있습니다.","src":136},{"q":"복합 인덱스 (user_id, created_at)가 있는데 WHERE created_at > ? 쿼리가 느린 이유는?","options":["created_at은 같은 user_id 안에서만 정렬되어 있어, 선두 컬럼 조건 없이는 인덱스 범위를 정할 수 없기 때문","복합 인덱스는 범위 조건을 지원하지 않기 때문","created_at이 날짜 타입이라 인덱스를 탈 수 없기 때문"],"answer":0,"explanation":"선두 컬럼부터 차례로 써야 하는 이 원칙을 leftmost prefix라고 합니다.","src":139},{"q":"성별처럼 값이 두 개뿐인 컬럼에 단독 인덱스를 거는 것이 보통 효과가 없는 이유는?","options":["값이 두 개뿐이면 인덱스를 만들 수 없기 때문","문자열 컬럼에는 인덱스를 걸 수 없기 때문","선택도가 낮아, 인덱스로 절반을 찾고 행마다 테이블을 다시 읽느니 순차로 다 읽는 편이 싸서 옵티마이저가 무시하기 때문"],"answer":2,"explanation":"이메일이나 주문 번호처럼 값이 거의 고유한 컬럼이 단독 인덱스에 좋습니다.","src":141},{"q":"무한 스크롤에서 같은 글이 두 번 보이는 버그의 흔한 원인과 해결은?","options":["캐시 TTL이 길기 때문이다. TTL을 줄인다","정렬 컬럼에 인덱스가 없기 때문이다. 인덱스를 추가한다","OFFSET 페이지네이션 중에 앞에 새 글이 추가되어 경계가 밀리기 때문이다. 마지막 항목 키를 기준으로 하는 커서 페이지네이션으로 바꾼다"],"answer":2,"explanation":"OFFSET은 앞의 n행을 실제로 읽고 버려 뒤 페이지로 갈수록 느려지기도 합니다.","src":146},{"q":"읽기 복제본을 둔 뒤 사용자가 방금 쓴 글이 목록에 안 보이는 원인은?","options":["비동기 복제 지연 때문에 아직 변경을 받지 못한 복제본에서 읽었기 때문","쓰기 트랜잭션이 롤백되었기 때문","목록 쿼리에 인덱스가 없기 때문"],"answer":0,"explanation":"내가 쓴 것은 바로 보여야 한다는 read-your-writes 일관성이 깨진 것입니다.","src":150},{"q":"좋아요 수를 동시에 많은 사용자가 누를 때 갱신 손실을 막는 첫 단계는?","options":["애플리케이션에서 값을 읽고 1을 더해 다시 쓴다","좋아요를 누를 때마다 테이블 전체를 잠근다","UPDATE ... SET like_count = like_count + 1처럼 DB가 원자적으로 증가시키게 한다"],"answer":2,"explanation":"애플리케이션에서 읽고 더해 쓰면 동시에 읽은 두 요청 중 하나가 사라집니다.","src":158}],"7":[{"q":"HotSpot JVM이 Java 8부터 메서드 영역(클래스 정보)을 둔 곳은?","options":["스레드마다 있는 JVM 스택","힙 밖 네이티브 메모리의 메타스페이스","힙의 Old 영역"],"answer":1,"explanation":"스레드마다 프로그램 카운터, JVM 스택, 네이티브 메서드 스택이 있고, 모든 스레드가 힙과 메서드 영역을 공유합니다.","src":160},{"q":"Android에서 메모리 캐시를 소프트 참조 대신 크기를 정한 LruCache로 만드는 이유는?","options":["소프트 참조는 회수 시점을 예측하기 어려워 권장되지 않기 때문","소프트 참조는 절대 회수되지 않기 때문","LruCache에 담긴 객체는 GC 대상이 아니기 때문"],"answer":0,"explanation":"약한 참조는 강한 참조가 없으면 다음 GC에서 회수될 수 있고, 팬텀 참조는 회수 뒤 알림을 받아 네이티브 자원을 정리할 때 씁니다.","src":163},{"q":"ReentrantLock을 써야 하는 경우는?","options":["단순한 임계 구역을 실수 없이 보호하고 싶을 때","변수 하나를 원자적으로 증가시킬 때","시간 제한 tryLock, 인터럽트로 대기 중단, 공정성 옵션, 여러 조건 변수가 필요할 때"],"answer":2,"explanation":"기본 선택은 블록을 벗어나면 자동으로 해제되는 synchronized입니다. ReentrantLock은 finally에서 반드시 unlock해야 하고, 변수 하나의 원자적 갱신은 Atomic이 맞습니다.","src":165},{"q":"Java 8 이후 ConcurrentHashMap이 동시성을 보장하는 방식은?","options":["빈 버킷에는 CAS로 넣고, 충돌한 버킷은 첫 노드에만 synchronized를 걸며, 읽기는 락 없이 한다","맵 전체에 락 하나를 건다","쓰기마다 맵 전체를 복사한 새 맵으로 바꾼다"],"answer":0,"explanation":"흔한 실수는 containsKey 뒤 put처럼 개별 연산을 조합하는 것입니다. putIfAbsent, computeIfAbsent, merge처럼 한 번에 하는 연산을 씁니다.","src":166},{"q":"이중 검사 잠금(DCL) 싱글턴에서 instance에 volatile이 필요한 이유는?","options":["volatile이 없으면 synchronized 블록이 동작하지 않기 때문","volatile이 객체 생성 속도를 높이기 때문","volatile이 없으면 참조 대입이 생성자 실행보다 앞당겨져, 다른 스레드가 초기화가 끝나지 않은 객체를 볼 수 있기 때문"],"answer":2,"explanation":"객체 생성은 할당, 생성자 실행, 참조 대입 세 단계입니다. volatile이 happens-before를 만들어 이 재배치를 막습니다.","src":167},{"q":"코루틴이 스레드보다 가볍다는 말의 근거는?","options":["suspend 지점에서 지역 변수와 재개 위치를 Continuation 객체에 저장하고 스레드를 돌려주므로, 코루틴마다 스택 메모리를 따로 잡거나 커널 전환을 하지 않는다","코루틴은 항상 하나의 스레드에서만 실행되기 때문","코루틴은 실행 중에 CPU를 쓰지 않기 때문"],"answer":0,"explanation":"스레드는 OS가 스케줄링하는 선점형 실행 단위라 생성할 때 스택을 잡고 전환에 커널이 개입합니다.","src":168},{"q":"코루틴 사이 공유 상태 보호에 synchronized 대신 Mutex를 쓰는 이유는?","options":["Mutex는 재진입이 되어 같은 코루틴이 여러 번 잠가도 된다","Mutex의 lock은 suspend 함수라 기다리는 동안 스레드를 막지 않고, withLock 안에서 suspend 함수도 부를 수 있다","Mutex는 락 없이 동작해 경합이 전혀 없다"],"answer":1,"explanation":"synchronized 블록 안에서는 suspend 함수를 부를 수 없습니다. 반대로 Mutex는 재진입이 되지 않아 withLock 안에서 다시 lock하면 교착 상태가 됩니다.","src":171},{"q":"Kotlin 제네릭 함수 안에서 T::class를 쓰려면?","options":["inline 함수에 reified 타입 파라미터로 선언한다","타입 파라미터에 out을 붙인다","함수에 @JvmStatic을 붙인다"],"answer":0,"explanation":"JVM 제네릭은 런타임에 타입 인자를 지웁니다. reified는 호출 지점에 실제 타입을 넣어 줍니다.","src":173}],"8":[{"q":"TLS 같은 실제 시스템이 대칭키와 비대칭키를 함께 쓰는 방식은?","options":["데이터 전체를 비대칭키로 암호화하고 대칭키는 서명에만 쓴다","비대칭키로 키를 합의하거나 서명으로 상대를 인증하고, 실제 데이터는 빠른 대칭키로 암호화한다","대칭키를 평문으로 먼저 보낸 뒤 비대칭키로 데이터를 암호화한다"],"answer":1,"explanation":"대칭키(AES)는 빠르지만 키 전달이 문제이고, 비대칭키(RSA, ECC)는 느리고 한 번에 다룰 수 있는 크기가 작습니다.","src":178},{"q":"Base64 인코딩에 대한 설명으로 옳은 것은?","options":["키가 있어야 되돌릴 수 있는 암호화다","키 없이 누구나 되돌릴 수 있는 형식 변환이라 보안 기능이 아니다","되돌릴 수 없는 단방향 해시다"],"answer":1,"explanation":"암호화는 키가 있어야 되돌릴 수 있어 기밀성을 주고, 해시는 되돌릴 수 없는 단방향 함수라 무결성 확인과 서명 대상에 씁니다.","src":179},{"q":"비밀번호를 SHA-256으로 해시해 저장하면 부족한 이유는?","options":["SHA-256은 키만 있으면 되돌릴 수 있기 때문","SHA-256은 결과 길이가 입력마다 달라지기 때문","너무 빨라 GPU로 초당 수십억 번 계산할 수 있어, 유출되면 사전 공격과 무차별 대입에 흔한 비밀번호가 금방 풀리기 때문"],"answer":2,"explanation":"사용자마다 다른 무작위 salt로 레인보우 테이블을 무력화하고, 일부러 느리게 만든 비밀번호 전용 함수를 씁니다.","src":180},{"q":"전자서명이 보장하는 것은?","options":["무결성, 출처 인증, 부인 방지","기밀성","가용성"],"answer":0,"explanation":"메시지 해시를 개인키로 서명하고 누구나 공개키로 검증합니다. 공개키가 정말 그 주체의 것인지는 인증서(PKI)로 해결합니다. APK 서명도 같은 원리입니다.","src":181},{"q":"JWT 액세스 토큰만으로 인증할 때의 약점은?","options":["서버가 세션 상태를 저장해야 해서 확장이 어렵다","발급한 토큰을 만료 전에 무효화하기 어려워, 로그아웃이나 탈취를 즉시 반영하지 못한다","페이로드가 암호화되어 클라이언트가 만료 시각을 읽을 수 없다"],"answer":1,"explanation":"페이로드는 누구나 읽을 수 있습니다. alg를 none으로 바꾼 토큰을 받아 주거나 서명과 만료 검사를 빠뜨리는 구현 실수도 흔합니다.","src":182},{"q":"XSS를 막는 방법으로 알맞은 것은?","options":["출력 위치에 맞는 이스케이프, innerHTML 같은 API 피하기, CSP로 허용된 스크립트만 실행","서버에서 HTTPS만 쓰면 막힌다","쿠키에 SameSite만 지정하면 막힌다"],"answer":0,"explanation":"XSS는 공격자의 스크립트가 피해 사이트 문맥에서 실행되는 것입니다. HttpOnly 쿠키는 탈취 피해를 줄이고, 입력 검증은 보조 수단입니다.","src":184},{"q":"세션 ID나 비밀번호 재설정 링크처럼 예측되면 안 되는 값을 만들 때 쓰는 것은?","options":["SecureRandom","java.util.Random","현재 시각을 시드로 쓴 Random"],"answer":0,"explanation":"java.util.Random은 선형 합동 생성기라 출력 몇 개로 내부 상태를 계산해 다음 값을 예측할 수 있습니다. 길이는 128비트 이상을 줍니다.","src":187},{"q":"리플레이 공격이 암호화와 서명 검증을 그대로 통과하는 이유는?","options":["암호화 키를 탈취해 새로 서명하기 때문","서명 알고리즘의 해시 충돌을 이용하기 때문","내용을 바꾸지 않고 가로챈 정상 요청을 그대로 다시 보내기 때문"],"answer":2,"explanation":"송금 요청을 다시 보내 두 번 송금되게 하는 식입니다. nonce나 타임스탬프, 멱등 키로 같은 요청을 한 번만 처리하게 해서 막습니다. TLS 1.3의 0-RTT 데이터도 같은 위험이 있습니다.","src":188}],"9":[{"q":"상속보다 합성을 권하는 이유로 알맞은 것은?","options":["상속은 상위 클래스 구현에 강하게 묶이지만, 합성은 바뀌는 부분을 인터페이스 뒤에 감춰 갈아 끼울 수 있게 하기 때문","합성을 쓰면 다형성을 쓸 수 없기 때문","상속으로는 코드를 재사용할 수 없기 때문"],"answer":0,"explanation":"실무에서 가치가 큰 것은 캡슐화와 인터페이스 기반 다형성입니다. Java의 Stack이 Vector를 상속해 리스트 연산이 열려 버린 것이 대표적인 반례입니다.","src":191},{"q":"정사각형을 직사각형의 하위 타입으로 만들면 너비만 바꾸는 코드가 깨진다는 예가 보여 주는 원칙은?","options":["단일 책임 원칙","인터페이스 분리 원칙","리스코프 치환 원칙"],"answer":2,"explanation":"하위 타입은 상위 타입의 계약을 지켜야 상위 타입 자리에 넣어도 코드가 깨지지 않습니다.","src":192},{"q":"의존성 주입에서 생성자 주입을 권하는 이유는?","options":["생성자 주입이 필드 주입보다 항상 실행 속도가 빠르기 때문","생성자 주입을 쓰면 싱글턴을 만들 수 없기 때문","필수 의존이 빠지면 생성 시점에 바로 드러나고, 의존을 불변으로 둘 수 있기 때문"],"answer":2,"explanation":"무엇에 의존하는지가 생성자에 드러납니다. 서비스 로케이터는 필요할 때 전역 저장소에서 꺼내므로 의존이 시그니처에 드러나지 않습니다.","src":193},{"q":"Android에서 메모리 싱글턴에 데이터를 둘 때 놓치기 쉬운 점은?","options":["싱글턴은 화면을 회전할 때마다 새로 만들어진다","프로세스가 종료되었다가 재시작되면 싱글턴에 둔 데이터가 사라진다","싱글턴은 메인 스레드에서만 읽을 수 있다"],"answer":1,"explanation":"전역 상태라 의존이 숨겨지고 테스트 사이에 상태가 공유되는 문제도 있어, DI 컨테이너의 싱글턴 범위로 관리합니다.","src":194},{"q":"리액티브 스트림이 옵저버 패턴에 더한 것은?","options":["구독자를 하나로 제한하는 규칙","발행자와 구독자를 같은 클래스로 합치는 구조","시간 축, map이나 debounce 같은 연산자, 완료와 오류 신호, 배압 처리"],"answer":2,"explanation":"옵저버 패턴은 발행자와 구독자를 분리합니다. 콜드 스트림은 구독할 때마다 처음부터 실행되고, 핫 스트림은 구독과 상관없이 값을 내보냅니다.","src":195},{"q":"Comparator처럼 알고리즘을 인터페이스로 갈아 끼우는 패턴은?","options":["어댑터 패턴","데코레이터 패턴","전략 패턴"],"answer":2,"explanation":"Kotlin에서는 함수 타입으로 충분한 경우가 많습니다. RecyclerView.Adapter는 어댑터, BufferedInputStream은 데코레이터의 예입니다.","src":196},{"q":"runTest 안에서 delay(10_000)이 들어간 코드를 테스트하면?","options":["실제로 10초를 기다린다","가상 시간으로 실행되어 실제로 10초를 기다리지 않고 건너뛴다","delay는 테스트에서 예외를 던진다"],"answer":1,"explanation":"advanceTimeBy와 advanceUntilIdle로 시간을 원하는 만큼 진행시키고, Main 디스패처는 Dispatchers.setMain으로 바꿉니다.","src":198},{"q":"테스트가 없는 레거시 코드를 맡았을 때 첫 순서로 알맞은 것은?","options":["처음부터 다시 작성한다","바꿀 부분의 현재 동작을 테스트로 고정한 뒤, 이음매를 만들어 조금씩 고친다","테스트 없이 구조를 크게 바꾼 뒤 QA로 확인한다"],"answer":1,"explanation":"재작성은 숨은 요구 사항과 다른 시스템이 기대는 동작까지 잃기 쉽고, 그동안 기능 개발이 멈추며 대부분 예상보다 오래 걸립니다.","src":200}]}}</script>
  <script>
    const DATA = JSON.parse(document.getElementById('study-data').textContent);
    const QUIZ = JSON.parse(document.getElementById('quiz-data').textContent);
    const DOCS = ['android', 'cs'];
    const LS = 'interview-study:';
    function lsGet(k, d) { try { const v = localStorage.getItem(LS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
    function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }

    const state = {
      doc: 'android',
      sec: 0,
      query: '',
      openAll: false,
      hideDone: lsGet('hideDone', false),
      done: new Set(lsGet('done', [])),
      open: new Set(),
      closed: new Set(),
      quiz: {}
    };

    // 검색용 평문
    const TEXT = {};
    DOCS.forEach(doc => {
      DATA[doc].sections.forEach(s => s.qs.forEach(q => {
        TEXT[doc + '-' + q.no] = (q.t + ' ' + q.a + ' ' + q.f).replace(/<[^>]+>/g, ' ').replace(/&[a-z#0-9]+;/gi, ' ').toLowerCase();
      }));
    });

    const qid = (doc, no) => doc + '-' + no;
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function docCounts(doc) {
      let total = 0, done = 0;
      DATA[doc].sections.forEach(s => s.qs.forEach(q => { total++; if (state.done.has(qid(doc, q.no))) done++; }));
      return { total, done };
    }
    function secCounts(doc, s) {
      let done = 0;
      s.qs.forEach(q => { if (state.done.has(qid(doc, q.no))) done++; });
      return { total: s.qs.length, done };
    }

    function renderHeader() {
      document.getElementById('doc-switch').innerHTML = DOCS.map(doc => {
        const on = doc === state.doc;
        return `<button data-doc="${doc}" class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs sm:text-sm transition-all ${on ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm font-semibold' : 'text-slate-600 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-white'}">${DATA[doc].label}</button>`;
      }).join('');
      const c = docCounts(state.doc);
      document.getElementById('progress-text').textContent = `외움 ${c.done} / ${c.total}`;
      document.getElementById('progress-bar').style.width = (c.total ? (c.done / c.total * 100) : 0) + '%';

      const tabs = [{ i: 0, label: '소개' }].concat(DATA[state.doc].sections.map((s, i) => {
        const sc = secCounts(state.doc, s);
        return { i: i + 1, label: `${s.no}. ${s.title}`, sub: `${sc.done}/${sc.total}` };
      }));
      document.getElementById('sec-tabs').innerHTML = tabs.map(t => {
        const on = !state.query && t.i === state.sec;
        return `<button data-sec="${t.i}" class="shrink-0 px-3 py-1.5 rounded-lg text-xs sm:text-[13px] whitespace-nowrap transition-all border ${on ? 'bg-indigo-600 border-indigo-600 text-white font-semibold shadow-sm' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-indigo-400'}">${esc(t.label)}${t.sub ? ` <span class="ml-1 font-mono text-[10px] ${on ? 'text-indigo-100' : 'text-slate-400'}">${t.sub}</span>` : ''}</button>`;
      }).join('');
      const active = document.querySelector('#sec-tabs button[data-sec="' + state.sec + '"]');
      if (active && !state.query) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });

      document.getElementById('open-all-btn').textContent = state.openAll ? '답 모두 접기' : '답 모두 펼치기';
      const hd = document.getElementById('hide-done-btn');
      hd.textContent = state.hideDone ? '외운 문항 보이기' : '외운 문항 숨기기';
      hd.className = 'flex-1 sm:flex-none px-3 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border transition-colors ' +
        (state.hideDone ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 hover:border-indigo-400');
    }

    function highlight(html, q) {
      if (!q) return html;
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return html.split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part : part.replace(re, '<mark>$1</mark>')).join('');
    }

    function card(doc, q, secLabel) {
      const id = qid(doc, q.no);
      const isDone = state.done.has(id);
      const isOpen = (state.openAll || state.query) ? !state.closed.has(id) : state.open.has(id);
      const nf = (q.f.match(/<li>/g) || []).length;
      const hq = state.query;
      return `
        <article id="card-${id}" class="rounded-2xl border ${isDone ? 'border-emerald-300/70 dark:border-emerald-800/70' : 'border-slate-200 dark:border-slate-800'} bg-white dark:bg-slate-900 shadow-sm">
          <div class="p-4 sm:p-5 pb-3 sm:pb-3 flex gap-3 items-start">
            <span class="shrink-0 mt-0.5 min-w-[2.25rem] text-center text-xs font-mono font-bold px-2 py-1 rounded-lg ${isDone ? 'bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300' : 'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300'}">${q.no}</span>
            <div class="flex-1 min-w-0">
              ${secLabel ? `<div class="text-[11px] font-semibold text-slate-400 mb-0.5">${esc(secLabel)}</div>` : ''}
              <h3 class="q-title text-[15px] sm:text-base font-bold leading-relaxed text-slate-900 dark:text-white">${highlight(q.t, hq)}</h3>
            </div>
            <button data-act="done" data-id="${id}" aria-pressed="${isDone}" title="외움 표시" class="shrink-0 flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors ${isDone ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-emerald-400'}">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>외움
            </button>
          </div>
          <div class="px-4 sm:px-5 pb-4">
            <button data-act="toggle" data-id="${id}" class="text-xs sm:text-sm font-semibold px-3 py-1.5 rounded-lg ${isOpen ? 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}">${isOpen ? '답 접기' : '답 보기'}</button>
            ${isOpen ? `
              <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                <div class="prose-ans">${highlight(q.a, hq)}</div>
                ${nf ? `
                <details class="mt-3 group" ${hq ? 'open' : ''}>
                  <summary class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-indigo-600 dark:text-indigo-300 select-none">
                    <svg class="chev w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>꼬리 질문 ${nf}개
                  </summary>
                  <div class="prose-ans follow mt-1">${highlight(q.f, hq)}</div>
                </details>` : ''}
              </div>` : ''}
          </div>
        </article>`;
    }

    function introView() {
      const d = DATA[state.doc];
      const grid = d.sections.map((s, i) => {
        const sc = secCounts(state.doc, s);
        const pct = Math.round(sc.done / sc.total * 100);
        const nquiz = ((QUIZ[state.doc] || {})[String(s.no)] || []).length;
        return `<button data-sec="${i + 1}" class="text-left p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-400 shadow-sm transition-colors">
          <div class="text-[11px] font-mono font-bold text-indigo-600 dark:text-indigo-300">${s.no}절, ${s.qs[0].no}~${s.qs[s.qs.length - 1].no}번</div>
          <div class="mt-0.5 font-bold text-slate-900 dark:text-white">${esc(s.title)}</div>
          <div class="mt-2 flex items-center gap-2 text-[11px] text-slate-500 dark:text-slate-400">
            <span>${sc.total}문항${nquiz ? `, 퀴즈 ${nquiz}` : ''}</span>
            <span class="flex-1 h-1 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden"><span class="block h-full bg-emerald-500" style="width:${pct}%"></span></span>
            <span class="font-mono">${sc.done}/${sc.total}</span>
          </div>
        </button>`;
      }).join('');
      return `
        <section class="space-y-4">
          <div class="rounded-2xl p-5 sm:p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mb-3">${esc(d.title)}</h2>
            <div class="prose-ans">${d.intro}</div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${grid}</div>
        </section>`;
    }

    function quizView(doc, s) {
      const items = (QUIZ[doc] || {})[String(s.no)];
      if (!items || !items.length) return '';
      const key = doc + '-' + s.no;
      const answers = state.quiz[key] || {};
      let score = 0;
      items.forEach((it, i) => { if (answers[i] === it.answer) score++; });
      const answered = Object.keys(answers).length;
      const body = items.map((it, qi) => {
        const choice = answers[qi];
        const isAns = choice !== undefined;
        return `
          <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-3">
            <p class="text-sm sm:text-[15px] font-bold text-slate-900 dark:text-white leading-relaxed">Q${qi + 1}. ${esc(it.q)}</p>
            <div class="space-y-2">
              ${it.options.map((opt, oi) => {
                let st = 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 hover:border-indigo-400';
                if (isAns) {
                  if (oi === it.answer) st = 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-800 dark:text-emerald-200 font-semibold';
                  else if (oi === choice) st = 'bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-800 dark:text-rose-200';
                  else st = 'bg-white/60 dark:bg-slate-900/60 border-slate-200 dark:border-slate-800 opacity-60';
                }
                return `<button data-act="quiz" data-key="${key}" data-q="${qi}" data-o="${oi}" ${isAns ? 'disabled' : ''} class="w-full text-left p-3 rounded-xl border text-[13px] sm:text-sm transition-all flex items-start gap-2.5 ${st}">
                  <span class="w-5 h-5 mt-0.5 rounded-full border border-current flex items-center justify-center text-[11px] font-bold shrink-0">${oi + 1}</span>
                  <span class="leading-relaxed">${esc(opt)}</span></button>`;
              }).join('')}
            </div>
            ${isAns ? `
              <div class="p-3 rounded-xl text-[13px] leading-relaxed ${choice === it.answer ? 'bg-emerald-100/70 dark:bg-emerald-900/30 text-emerald-900 dark:text-emerald-200' : 'bg-amber-100/70 dark:bg-amber-900/30 text-amber-900 dark:text-amber-200'}">
                <strong>${choice === it.answer ? '정답입니다.' : `오답입니다. 정답은 ${it.answer + 1}번입니다.`}</strong> ${esc(it.explanation)}
                <button data-act="goto" data-id="${qid(doc, it.src)}" class="ml-1 underline font-semibold">${it.src}번 문항 보기</button>
              </div>` : ''}
          </div>`;
      }).join('');
      return `
        <section class="mt-6 rounded-2xl p-5 sm:p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h3 class="text-lg font-bold text-slate-900 dark:text-white">${s.no}절 확인 퀴즈</h3>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">위 문항의 결론을 객관식으로 확인합니다. 한 번 고르면 바꿀 수 없습니다.</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300">정답 ${score} / ${items.length}${answered < items.length ? `, 푼 문항 ${answered}` : ''}</span>
              ${answered ? `<button data-act="quiz-reset" data-key="${key}" class="px-3 py-1 rounded-full text-xs font-semibold border border-slate-200 dark:border-slate-700 hover:border-indigo-400">다시 풀기</button>` : ''}
            </div>
          </div>
          <div class="space-y-4">${body}</div>
        </section>`;
    }

    function sectionView() {
      const s = DATA[state.doc].sections[state.sec - 1];
      const sc = secCounts(state.doc, s);
      let qs = s.qs;
      if (state.hideDone) qs = qs.filter(q => !state.done.has(qid(state.doc, q.no)));
      const nquiz = ((QUIZ[state.doc] || {})[String(s.no)] || []).length;
      const prev = state.sec > 1 ? DATA[state.doc].sections[state.sec - 2] : null;
      const next = state.sec < DATA[state.doc].sections.length ? DATA[state.doc].sections[state.sec] : null;
      return `
        <section>
          <div class="mb-4 flex flex-wrap items-end justify-between gap-2">
            <div>
              <div class="text-xs font-mono font-bold text-indigo-600 dark:text-indigo-300">${DATA[state.doc].label}, ${s.no}절</div>
              <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">${esc(s.title)}</h2>
            </div>
            <div class="text-xs text-slate-500 dark:text-slate-400">${sc.total}문항, 외움 ${sc.done}${nquiz ? `, 퀴즈 ${nquiz}문항은 맨 아래` : ''}</div>
