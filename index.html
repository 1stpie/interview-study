          </div>
          <div class="space-y-3">
            ${qs.length ? qs.map(q => card(state.doc, q)).join('') : `<div class="p-6 rounded-2xl text-center text-sm text-slate-500 bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700">이 절의 문항을 모두 외웠습니다.</div>`}
          </div>
          ${quizView(state.doc, s)}
          <div class="mt-6 flex justify-between gap-2">
            ${prev ? `<button data-sec="${state.sec - 1}" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-indigo-400">← ${prev.no}. ${esc(prev.title)}</button>` : '<span></span>'}
            ${next ? `<button data-sec="${state.sec + 1}" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-indigo-400 text-right">${next.no}. ${esc(next.title)} →</button>` : '<span></span>'}
          </div>
        </section>`;
    }

    function searchView() {
      const q = state.query.toLowerCase();
      const hits = [];
      DATA[state.doc].sections.forEach(s => s.qs.forEach(item => {
        if (TEXT[qid(state.doc, item.no)].includes(q)) hits.push({ s, item });
      }));
      const shown = hits.slice(0, 40);
      return `
        <section>
          <div class="mb-3 text-sm text-slate-500 dark:text-slate-400">「${esc(state.query)}」 ${DATA[state.doc].label}에서 ${hits.length}문항${hits.length > shown.length ? `, 앞의 ${shown.length}문항만 표시` : ''}</div>
          <div class="space-y-3">${shown.map(h => card(state.doc, h.item, `${h.s.no}. ${h.s.title}`)).join('') || '<div class="p-6 rounded-2xl text-center text-sm text-slate-500 bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700">찾는 내용이 없습니다.</div>'}</div>
        </section>`;
    }

    function render() {
      renderHeader();
      const v = document.getElementById('view');
      if (state.query) v.innerHTML = searchView();
      else if (state.sec === 0) v.innerHTML = introView();
      else v.innerHTML = sectionView();
    }

    function setHash() {
      const h = '#' + state.doc + (state.sec ? '-' + state.sec : '');
      if (location.hash !== h) history.replaceState(null, '', h);
    }
    function readHash() {
      const m = location.hash.match(/^#(android|cs)(?:-(\d+))?$/);
      if (m) {
        state.doc = m[1];
        const n = m[2] ? parseInt(m[2], 10) : 0;
        state.sec = n >= 0 && n <= DATA[state.doc].sections.length ? n : 0;
        return true;
      }
      return false;
    }

    function go(doc, sec) {
      state.doc = doc; state.sec = sec; state.query = '';
      document.getElementById('search').value = '';
      lsSet('last', { doc, sec });
      setHash();
      render();
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.doc) { go(b.dataset.doc, 0); return; }
      if (b.dataset.sec !== undefined) { go(state.doc, parseInt(b.dataset.sec, 10)); return; }
      const act = b.dataset.act;
      if (act === 'done') {
        const id = b.dataset.id;
        state.done.has(id) ? state.done.delete(id) : state.done.add(id);
        lsSet('done', Array.from(state.done));
        render();
      } else if (act === 'toggle') {
        const id = b.dataset.id;
        const set = (state.openAll || state.query) ? state.closed : state.open;
        set.has(id) ? set.delete(id) : set.add(id);
        const top = b.closest('article').getBoundingClientRect().top;
        render();
        const el = document.getElementById('card-' + id);
        if (el) window.scrollBy(0, el.getBoundingClientRect().top - top);
      } else if (act === 'quiz') {
        const k = b.dataset.key;
        state.quiz[k] = state.quiz[k] || {};
        if (state.quiz[k][b.dataset.q] === undefined) state.quiz[k][b.dataset.q] = parseInt(b.dataset.o, 10);
        const top = b.getBoundingClientRect().top;
        const sel = `[data-key="${k}"][data-q="${b.dataset.q}"][data-o="${b.dataset.o}"]`;
        render();
        const el = document.querySelector(sel);
        if (el) window.scrollBy(0, el.getBoundingClientRect().top - top);
      } else if (act === 'quiz-reset') {
        delete state.quiz[b.dataset.key];
        render();
      } else if (act === 'goto') {
        const [doc, no] = b.dataset.id.split('-');
        const n = parseInt(no, 10);
        const si = DATA[doc].sections.findIndex(s => s.qs.some(q => q.no === n));
        state.open.add(b.dataset.id);
        state.hideDone = false;
        go(doc, si + 1);
        const el = document.getElementById('card-' + b.dataset.id);
        if (el) el.scrollIntoView({ block: 'start' });
        window.scrollBy(0, -140);
      }
    });

    document.getElementById('open-all-btn').addEventListener('click', () => {
      state.openAll = !state.openAll;
      state.open.clear();
      state.closed.clear();
      render();
    });
    document.getElementById('hide-done-btn').addEventListener('click', () => {
      state.hideDone = !state.hideDone;
      lsSet('hideDone', state.hideDone);
      render();
    });
    let timer = null;
    document.getElementById('search').addEventListener('input', e => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        state.query = e.target.value.trim();
        state.closed.clear();
        render();
      }, 200);
    });
    document.getElementById('theme-btn').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('interview-study:theme', dark ? 'dark' : 'light'); } catch (e) {}
    });
    window.addEventListener('hashchange', () => { if (readHash()) { state.query = ''; document.getElementById('search').value = ''; render(); } });

    if (!readHash()) {
      const last = lsGet('last', null);
      if (last && DATA[last.doc] && last.sec >= 0 && last.sec <= DATA[last.doc].sections.length) { state.doc = last.doc; state.sec = last.sec; }
    }
    render();
  </script>
</body>
</html>
