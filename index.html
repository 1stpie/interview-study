nScheme, SecureTextField, 새 SearchBar API<\/td>\n<td>2025-09-24<\/td>\n<td>아이콘 의존성을 직접 추가하거나 벡터 리소스로 교체<\/td>\n<\/tr>\n<tr>\n<td>Kotlin 2.3.0 Compose 컴파일러: R8로 축소한 앱의 Compose 스택 트레이스용 매핑(그룹 키 스택 트레이스는 runtime 1.10 이상)<\/td>\n<td>2025-12-16<\/td>\n<td>릴리스 크래시 분석이 쉬워짐, 매핑 업로드 확인<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>업그레이드는 묶어서 계획합니다. AGP 9.1.1 이상과 compileSdk 37 같은 빌드 요구를 먼저 맞추고, BOM을 올린 뒤 테스트를 v2로 옮기고 deprecated 경고를 정리하며, 마지막으로 Macrobenchmark로 시작과 스크롤 성능을 전후 비교합니다. targetSdk 35와 36의 edge-to-edge 강제, Android 16의 큰 화면 제한 무시도 Compose 화면 코드에 직접 영향을 주는 플랫폼 변화라 같은 계획에 넣습니다.<\/p>","f":"<ul>\n<li><strong>지금 기준 Compose 버전은 무엇입니까?<\/strong> 최신 BOM은 2026.09.00이고 runtime, ui, foundation, animation, material을 1.12.1로, material3를 1.4.0으로, material3-adaptive를 1.3.0으로 묶습니다. compose-runtime 1.13.0-rc01이 2026-11-04에 나왔습니다.<\/li>\n<li><strong>Experimental API는 실무에서 어떻게 다룹니까?<\/strong> opt-in 범위를 모듈이나 파일 단위로 좁히고 쓰는 곳을 래퍼 하나에 모아, API가 바뀔 때 고칠 곳을 줄입니다. Compose 1.8 글은 실험 API 수가 1.7의 172개에서 1.8의 70개로 줄었다고 적었을 만큼 안정화가 진행 중이므로, 버전을 올릴 때 opt-in을 걷어 낼 수 있는지 확인합니다.<\/li>\n<li><strong>Material 3 Expressive는 지금 써도 됩니까?<\/strong> Compose 1.10 글 기준 Material 3 Expressive API는 alpha였고, Material 3 1.4 계열에서는 ExperimentalMaterial3ExpressiveApi가 붙은 공개 API가 빠졌습니다. 1.5.0 알파에서 일부 컴포넌트의 실험 표시가 벗겨졌고 1.5.0-rc01이 2026-11-04에 나왔으므로, 안정판을 확인하고 도입을 정합니다.<\/li>\n<\/ul>"}]},{"no":4,"title":"아키텍처","qs":[{"no":67,"t":"Google 권장 앱 아키텍처와 Clean Architecture는 어떻게 다르고, 둘을 섞어 부르면 어떤 오해가 생깁니까?","a":"<p>둘은 같은 것이 아니고, 가장 큰 차이는 의존 방향입니다. Google 가이드의 Domain 계층 문서도 \"domain layer\"라는 말이 Clean Architecture에서는 다른 뜻으로 쓰이니 혼동하지 말라고 따로 적어 둡니다. Google 가이드는 UI → Domain → Data 순서로 의존하고, UseCase가 Data 계층의 Repository 클래스에 의존하는 것을 기본으로 봅니다. Clean Architecture는 소스 코드 의존이 바깥에서 Entity와 Use Case가 있는 안쪽으로만 향해야 한다는 의존 규칙이 핵심이라, Data 계층이 Domain이 정의한 인터페이스를 구현하는 의존 역전이 필요합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>Google 권장 앱 아키텍처<\/th>\n<th>Clean Architecture<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>성격<\/td>\n<td>Android 앱을 위한 권장 가이드<\/td>\n<td>플랫폼과 무관한 설계 원칙<\/td>\n<\/tr>\n<tr>\n<td>계층<\/td>\n<td>UI, Data, 필요할 때만 Domain<\/td>\n<td>Entity, Use Case, Interface Adapters, Frameworks &amp; Drivers<\/td>\n<\/tr>\n<tr>\n<td>의존 방향<\/td>\n<td>UI → Domain → Data<\/td>\n<td>바깥 → 안쪽만 허용, Data가 Domain의 인터페이스를 구현<\/td>\n<\/tr>\n<tr>\n<td>비즈니스 로직<\/td>\n<td>Data 계층의 Repository와 선택적인 UseCase<\/td>\n<td>Entity와 Use Case<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Google 가이드는 앱을 UI 계층과 Data 계층 두 개 이상으로 나누고, 복잡하거나 여러 ViewModel이 다시 쓰는 비즈니스 로직이 있을 때만 Domain 계층을 넣습니다. 데이터마다 Single Source of Truth(SSOT)를 하나 두고, 데이터는 데이터 출처에서 UI로, 사용자 이벤트는 UI에서 SSOT로 흐르는 단방향 데이터 흐름을 모든 계층에 적용합니다. 실무에서는 Google 가이드의 계층을 쓰면서 Domain과 Data 사이만 Repository 인터페이스로 의존을 뒤집어, Clean Architecture의 의존 규칙을 함께 따르는 구성도 많이 씁니다.<\/p>\n<p>MVVM과 MVI는 이 둘과 층위가 다른 Presentation 패턴입니다. 계층 구조는 무엇이 무엇에 의존하는지를 정하고, Presentation 패턴은 UI 계층 안에서 상태와 이벤트를 어떻게 주고받을지를 정합니다. 그래서 \"Clean Architecture 기반 MVVM\"처럼 섞어 부르면 층위가 뒤섞입니다. 흔한 오해는 UseCase 클래스가 있으니 Clean Architecture라고 보는 것인데, UseCase가 Retrofit DTO나 Room 클래스에 직접 의존하면 의존 규칙을 어긴 것입니다. Google 가이드대로 Domain이 Data에 의존하게 만들어 놓고 Clean Architecture라고 부르면 리뷰 기준도 사람마다 달라집니다. 설명할 때는 \"계층 구조는 Google 가이드의 UI, Data 계층과 선택적 Domain 계층, Domain과 Data 사이는 의존 역전, UI 계층의 Presentation 패턴은 MVVM\"처럼 층위를 나눠 말합니다.<\/p>","f":"<ul>\n<li><strong>Google 가이드를 따르면서 의존 역전을 넣어도 됩니까?<\/strong> 됩니다. 가이드 스스로 권장 사항이니 요구에 맞게 조정하라고 적습니다. Repository 인터페이스를 Domain이나 순수 Kotlin 모듈에 두고 Data 모듈이 구현하면 Domain을 Android와 라이브러리에서 떼어 낼 수 있지만, 인터페이스와 모델 매핑이 늘어나므로 모듈 경계를 강제할 필요가 있을 때 넣습니다.<\/li>\n<li><strong>Clean Architecture의 Entity와 Room의 @Entity는 같은 것입니까?<\/strong> 다릅니다. Clean Architecture의 Entity는 업무 규칙을 담은 도메인 객체이고, Room의 @Entity는 테이블 구조를 나타내는 Data 계층 모델입니다. 같은 클래스를 쓰면 DB 스키마 변경이 도메인과 UI로 번집니다.<\/li>\n<li><strong>MVVM은 어느 계층에 속합니까?<\/strong> UI 계층 안의 Presentation 패턴입니다. 계층 구조를 Google 가이드로 하든 Clean Architecture로 하든 함께 쓸 수 있습니다.<\/li>\n<\/ul>"},{"no":68,"t":"MVVM과 MVI는 무엇이 다르고, 각각 어떤 문제를 풉니까?","a":"<p>둘 다 UI 계층 안에서 화면 상태와 사용자 입력을 다루는 Presentation 패턴입니다. MVVM은 ViewModel이 관찰 가능한 상태와 호출할 함수를 노출하고 View가 상태를 구독하는 구조로, View와 화면 로직을 떼어 놓는 문제를 풉니다. MVI는 사용자 입력을 Intent 객체로 받아 Reducer가 이전 상태와 Intent로 새 상태 하나를 만드는 구조로, 상태가 바뀌는 길을 한 곳으로 모아 재현하고 추적하기 쉽게 만드는 문제를 풉니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>MVVM<\/th>\n<th>MVI<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>상태 노출<\/td>\n<td>하나 또는 여러 개의 관찰 가능한 상태<\/td>\n<td>불변 상태 객체 하나<\/td>\n<\/tr>\n<tr>\n<td>입력<\/td>\n<td>ViewModel 함수 호출<\/td>\n<td>Intent 객체를 한 통로로 전달<\/td>\n<\/tr>\n<tr>\n<td>상태 변경 위치<\/td>\n<td>ViewModel 안의 여러 함수<\/td>\n<td>Reducer 한 곳<\/td>\n<\/tr>\n<tr>\n<td>사이드 이펙트<\/td>\n<td>함수 안에서 바로 처리<\/td>\n<td>Effect로 분리해 Reducer 밖에서 처리<\/td>\n<\/tr>\n<tr>\n<td>비용<\/td>\n<td>상태 변경 지점이 흩어지기 쉬움<\/td>\n<td>타입이 늘고 Reducer가 비대해지기 쉬움<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>MVVM 이전의 MVP는 Presenter가 View 인터페이스를 잡고 직접 갱신했습니다. Presenter가 파괴된 Activity를 계속 참조하면 누수가 생기고, 구성 변경 때 Presenter 상태를 따로 보존해야 했으며, 화면 요소가 늘수록 View 인터페이스 메서드도 늘었습니다. MVVM은 ViewModel이 View를 모르고 상태만 노출하게 해 이 참조와 생명주기 문제를 없앴고, Jetpack ViewModel이 구성 변경을 넘어 상태를 보존합니다. 다만 MVVM에서 상태를 여러 StateFlow로 나누고 아무 함수에서나 바꾸면, 상태 조합이 어긋나거나 어떤 순서로 바뀌었는지 추적하기 어려워집니다.<\/p>\n<p>MVI는 상태 변경을 Reducer에서만 하므로 Intent 기록으로 같은 상태를 재현할 수 있고, 상태 전이를 순수 함수로 단위 테스트할 수 있습니다. 네트워크 호출, 화면 이동, 분석 로그 같은 사이드 이펙트는 Reducer 밖으로 분리합니다. 대신 Intent, State, Effect 타입과 보일러플레이트가 늘고, 화면이 커질수록 Reducer가 비대해집니다. 지도, 검색창, 바텀시트가 동시에 상태를 바꾸는 복잡한 화면은 MVI가 맞고, 입력 폼 수준의 단순한 화면은 MVVM의 단일 UiState와 함수 호출로 충분합니다. MVVM에서도 상태를 data class 하나로 모으고 update로만 바꾸면 MVI의 장점 상당 부분을 얻습니다. Compose는 상태를 그리는 UI라 단일 불변 상태를 내보내는 MVI와 잘 맞습니다.<\/p>","f":"<ul>\n<li><strong>Jetpack ViewModel과 MVVM의 ViewModel은 같은 것입니까?<\/strong> 다릅니다. MVVM의 ViewModel은 패턴 속 역할이고, Jetpack ViewModel은 구성 변경을 넘어 상태를 보존하고 viewModelScope를 주는 생명주기 컴포넌트입니다. MVI에서도 상태 보관은 보통 Jetpack ViewModel이 맡습니다.<\/li>\n<li><strong>화면 이동 같은 일회성 이벤트는 어떻게 다룹니까?<\/strong> Google 가이드는 ViewModel 이벤트가 항상 UI 상태 갱신으로 이어져야 한다고 권합니다. Channel 같은 스트림으로 보내면 ViewModel이 UI보다 오래 사는 동안 전달과 처리가 보장되지 않기 때문입니다. 이벤트를 상태 필드로 두고 UI가 처리한 뒤 지웁니다.<\/li>\n<li><strong>Reducer가 비대해지면?<\/strong> 화면 상태를 검색창, 결과 목록, 필터 같은 하위 상태로 나눠 하위 Reducer로 쪼개고, 비동기 처리는 Reducer 밖의 처리기로 뺍니다.<\/li>\n<\/ul>"},{"no":69,"t":"UI 상태는 어떻게 모델링합니까? 하나의 data class와 sealed 상태 중 무엇을 고릅니까?","a":"<p>상태가 서로 배타적이면 sealed, 동시에 성립할 수 있으면 data class를 고르고, 실제 화면은 둘을 조합합니다. Loading, Success, Error처럼 한 번에 하나만 참인 상태는 sealed interface로 두면 when이 모든 경우를 처리하게 강제해 빠뜨림이 없습니다. 하지만 새로고침 중에도 기존 결과를 계속 보여 주거나, 검색 결과는 떴는데 최근 검색어 영역만 실패한 부분 오류처럼 상태가 겹치면 sealed 하나로는 표현이 깨집니다. 이런 화면은 data class에 겹칠 수 있는 필드를 함께 두고, 배타적인 부분만 sealed 필드로 둡니다.<\/p>\n<pre class=\"kotlin\"><code>data class SearchUiState(\n    val query: String = &quot;&quot;,\n    val isRefreshing: Boolean = false,          // 결과를 보여 주는 중에도 true일 수 있다\n    val results: ResultsState = ResultsState.Idle,\n    val recentSearches: List&lt;String&gt; = emptyList(),\n) {\n    val showClearButton: Boolean get() = query.isNotEmpty()  // 파생 값은 저장하지 않는다\n}\n\nsealed interface ResultsState {\n    data object Idle : ResultsState\n    data object Loading : ResultsState\n    data class Success(val places: List&lt;PlaceUi&gt;) : ResultsState\n    data class Error(val retryable: Boolean) : ResultsState\n}<\/code><\/pre>\n<p>파생 값은 저장하지 않습니다. 지우기 버튼 표시 여부나 적용한 필터 개수처럼 다른 필드로 계산되는 값을 필드로 두면, 원본만 바뀌고 파생 값은 그대로인 불일치가 생깁니다. 계산 프로퍼티로 두거나 ViewModel에서 combine으로 만들어 냅니다.<\/p>\n<p>상태는 불변으로 두고 copy로 새 객체를 만듭니다. MutableStateFlow는 update { it.copy(...) }로 바꿔야 값을 읽고 쓰는 사이에 다른 코루틴이 끼어들어 변경을 덮어쓰는 일이 없습니다. 필드에 MutableList를 넣고 내부를 고치면 이전 상태와 새 상태가 같은 리스트를 가리켜 StateFlow가 같은 값으로 보고 내보내지 않습니다. strong skipping이 기본인 Compose(Kotlin 2.0.20부터)도 불안정한 매개변수를 인스턴스 동일성으로 비교하므로, 같은 인스턴스면 리컴포지션을 건너뜁니다. 바뀔 때마다 새 불변 인스턴스를 만들면 두 쪽 모두 예측대로 동작합니다.<\/p>","f":"<ul>\n<li><strong>일회성 이벤트도 UI 상태에 넣습니까?<\/strong> 넣는 쪽을 권합니다. 토스트나 화면 이동을 상태 필드로 두고 UI가 처리한 뒤 ViewModel에 알려 지우면, 구성 변경이나 다시 구독할 때 재실행되거나 사라지지 않습니다.<\/li>\n<li><strong>isLoading, isError 같은 Boolean 여러 개로 두면 무엇이 나쁩니까?<\/strong> 둘 다 true인 것처럼 있을 수 없는 조합을 타입이 막지 못합니다. 배타적인 부분을 sealed로 묶으면 그런 조합이 아예 만들어지지 않습니다.<\/li>\n<li><strong>상태를 여러 StateFlow로 나눠 노출하면?<\/strong> 화면이 여러 Flow를 따로 구독하면 한 이벤트로 바뀐 값들이 서로 다른 시점에 반영되어 잠깐 어긋난 화면이 보일 수 있습니다. ViewModel에서 combine으로 하나의 UiState로 합쳐 내보냅니다.<\/li>\n<\/ul>"},{"no":70,"t":"Domain 계층의 UseCase는 언제 만들고 언제 만들지 않습니까?","a":"<p>복잡한 비즈니스 로직이 있거나 여러 ViewModel이 같은 로직을 쓸 때 만들고, Repository 함수를 그대로 전달하기만 할 때는 만들지 않습니다. Google 가이드에서 Domain 계층은 선택 사항이고, UseCase는 필요할 때만 더하라고 적습니다. 모든 데이터 접근을 UseCase로 강제하면 단순한 함수 호출까지 UseCase를 만들어야 해 이득 없이 복잡도만 늘 수 있다는 점도 가이드가 단점으로 듭니다.<\/p>\n<p>만드는 경우는 세 가지입니다. 경로 목록과 즐겨찾기를 합쳐 즐겨찾기 표시가 붙은 경로를 만드는 것처럼 여러 Repository를 조합할 때, 거리와 도착 시각 표기나 검색어 정규화처럼 여러 화면이 같은 규칙을 쓸 때, ViewModel이 업무 규칙까지 떠안아 비대해질 때입니다. 다만 DB가 SSOT이고 Room 관계 쿼리로 조합이 끝난다면 UseCase보다 그 결과를 돌려주는 Repository가 낫다고 가이드는 적습니다. 반대로 전달만 하는 UseCase는 클래스와 DI 바인딩, 호출 경로만 늘리고 검증할 규칙이 없어 테스트 가치도 없습니다.<\/p>\n<p>구현은 가이드의 관례를 따릅니다. 이름은 \"동사 현재형 + 대상 + UseCase\"로 짓고 기능 하나만 맡기며, operator fun invoke로 함수처럼 호출합니다. UseCase는 가변 상태와 자체 생명주기가 없으므로 주입받을 때마다 새 인스턴스를 써도 되고, main-safe해야 하므로 무거운 계산은 주입받은 디스패처로 옮깁니다. Domain을 Android 의존이 없는 순수 Kotlin 모듈로 두면 Context 같은 Android 클래스가 섞여 들어올 수 없고, JVM 단위 테스트가 빠르며, 필요할 때 Kotlin Multiplatform으로 옮기기도 쉽습니다.<\/p>\n<pre class=\"kotlin\"><code>class GetFavoriteRoutesUseCase @Inject constructor(\n    private val routeRepository: RouteRepository,\n    private val favoriteRepository: FavoriteRepository,\n    @DefaultDispatcher private val dispatcher: CoroutineDispatcher,\n) {\n    // 두 Repository를 조합하는 규칙이 있어서 UseCase로 둔다\n    operator fun invoke(origin: Coordinate): Flow&lt;List&lt;RouteWithFavorite&gt;&gt; =\n        combine(routeRepository.observeRoutes(origin), favoriteRepository.observeIds()) { routes, ids -&gt;\n            routes.map { RouteWithFavorite(it, isFavorite = it.id in ids) }\n        }.flowOn(dispatcher)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>UseCase를 @Singleton으로 두면?<\/strong> 상태가 없으니 공유할 이유가 없고 앱 수명 동안 메모리에 남습니다. 가이드도 UseCase는 자체 생명주기 없이 쓰는 쪽의 범위를 따르며, 의존성으로 넘길 때마다 새 인스턴스를 만들라고 적습니다.<\/li>\n<li><strong>UseCase가 다른 UseCase를 써도 됩니까?<\/strong> 됩니다. 가이드도 여러 단계의 UseCase를 정상으로 봅니다. 다만 깊어질수록 흐름을 따라가기 어려우므로 실제로 재사용되는 규칙만 나눕니다.<\/li>\n<li><strong>UI가 Repository를 직접 부르는 것을 허용해야 합니까?<\/strong> 팀이 정할 규칙입니다. 가이드는 필요할 때만 UseCase를 더하다가, UI가 거의 UseCase로만 데이터에 접근하게 되면 그때 직접 접근을 막는 규칙으로 굳히는 방식을 권합니다.<\/li>\n<\/ul>"},{"no":71,"t":"Repository와 Single Source of Truth는 무엇이고, 네트워크와 로컬 DB를 함께 쓸 때 데이터 흐름은 어떻게 설계합니까?","a":"<p>Repository는 데이터가 네트워크, DB, 파일 중 어디서 오는지 감추고 한 종류의 데이터를 앱의 나머지에 노출하는 경계입니다. SSOT는 그 데이터의 소유자로, SSOT만 데이터를 바꿀 수 있고 밖에는 불변 타입으로 내보내며 변경은 함수나 이벤트로 받습니다. 네트워크와 로컬 DB를 함께 쓰면 DB를 SSOT로 두고 UI는 DB의 Flow를 구독하며, 네트워크 응답은 UI로 바로 보내지 않고 DB에 쓰는 구조가 표준입니다. Google 가이드도 오프라인 우선 앱의 SSOT는 보통 DB라고 적습니다.<\/p>\n<p>데이터가 흐르는 길이 하나라는 점이 핵심입니다. 새로고침하면 Repository가 네트워크에서 받아 DB에 쓰고, DB가 바뀌면 Room이 Flow로 새 값을 내보내 화면이 갱신됩니다. 그래서 네트워크 응답과 캐시가 서로 다른 값을 보여 주는 불일치가 없고, 오프라인에서도 마지막 데이터가 그대로 보입니다. Room 3.0에서는 Flow 같은 반응형 타입을 돌려주지 않는 DAO 함수가 suspend여야 하므로, 관찰은 Flow로, 쓰기는 suspend 함수로 나뉘는 구조가 더 분명해졌습니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: DB가 SSOT, 네트워크는 DB를 갱신하는 역할만 한다\n@Singleton class PlaceRepository @Inject constructor(\n    private val dao: PlaceDao,\n    private val api: PlaceApi,\n    private val clock: Clock,\n) {\n    private val refreshMutex = Mutex()  // @Singleton이라 모든 화면이 같은 Mutex를 쓴다\n    fun observePlaces(): Flow&lt;List&lt;Place&gt;&gt; = dao.observeAll().map { rows -&gt; rows.map { it.toDomain() } }\n\n    suspend fun refreshIfStale(maxAge: Duration) = refreshMutex.withLock {\n        val last = dao.lastFetchedAt()\n        if (last != null &amp;&amp; clock.now() - last &lt; maxAge) return@withLock  // 방금 다른 호출이 갱신했으면 건너뜀\n        dao.replaceAll(api.fetchPlaces().map { it.toEntity(fetchedAt = clock.now()) })\n    }\n}<\/code><\/pre>\n<p>캐시 만료는 받은 시각을 데이터와 함께 저장해 판단합니다. 화면에 들어올 때 만료 시간이 지났을 때만 네트워크를 부르고, 만료 기준은 데이터 성격으로 정합니다. 장소 상세처럼 잘 안 바뀌는 데이터는 길게, 실시간 교통처럼 금방 낡는 데이터는 짧게 둡니다. 여러 화면이 동시에 새로고침을 부르면 같은 요청이 여러 번 나가므로, @Singleton으로 하나만 둔 Repository의 Mutex로 한 번에 하나만 실행하고 기다리던 호출은 방금 갱신된 시각을 보고 건너뛰게 해 요청을 합칩니다. Repository는 문자열 포맷, 색, 리소스 ID 같은 화면용 값을 담은 UI 모델을 돌려주지 않습니다. 도메인이나 데이터 모델을 돌려줘야 여러 화면이 같은 Repository를 쓸 수 있고, 화면용 변환은 UI 계층이 맡습니다.<\/p>","f":"<ul>\n<li><strong>새로고침이 실패하면 UI에 어떻게 알립니까?<\/strong> DB Flow는 마지막 데이터를 계속 내보내고, 새로고침 함수의 결과(성공, 실패와 원인)를 따로 돌려줘 ViewModel이 스낵바나 재시도 버튼 상태를 만듭니다. 데이터 스트림과 새로고침 상태를 섞지 않습니다.<\/li>\n<li><strong>DB 없이 메모리 캐시만 쓰면 SSOT는 어디입니까?<\/strong> Repository 안에 둔 StateFlow 같은 메모리 상태가 SSOT입니다. Google 가이드도 경우에 따라 ViewModel이 SSOT가 될 수 있다고 적습니다. 프로세스 종료 때 사라져도 되는 데이터에만 씁니다.<\/li>\n<li><strong>Repository는 화면마다 만듭니까?<\/strong> 데이터 종류마다 만듭니다. 가이드의 예도 MoviesRepository, PaymentsRepository처럼 데이터 기준입니다. 여러 데이터를 화면에 맞게 조합하는 일은 ViewModel이나 UseCase가 맡습니다.<\/li>\n<\/ul>"},{"no":72,"t":"오프라인에서도 쓰기가 되는 기능은 어떻게 설계합니까? 즐겨찾기를 예로 들어 보세요.","a":"<p>로컬 DB에 먼저 쓰고 화면은 바로 반영하며, 서버 동기화는 WorkManager가 네트워크가 연결될 때 재시도하는 구조로 만듭니다. 각 행에 동기화 상태를 두어 화면에 \"동기화 대기\"를 표시하고, 서버 요청에는 클라이언트가 만든 멱등 키를 붙여 재시도가 중복 생성을 만들지 않게 합니다. 충돌은 서버의 버전 번호로 감지하고, 삭제는 바로 지우지 않고 삭제 표시로 남겨 다른 기기까지 전파합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 로컬 행 하나가 동기화 상태와 멱등 키를 함께 가진다\n@Entity(tableName = &quot;favorite&quot;)\ndata class FavoriteEntity(\n    @PrimaryKey val localId: String,   // 클라이언트가 만든 UUID, 서버 멱등 키로도 쓴다\n    val placeId: String,\n    val name: String,\n    val serverVersion: Long?,          // 서버가 준 버전, 충돌 감지용\n    val syncState: SyncState,          // SYNCED, PENDING_UPSERT, PENDING_DELETE, FAILED\n    val deleted: Boolean = false,      // 삭제 표시, 서버가 확인한 뒤 행을 지운다\n)<\/code><\/pre>\n<p>쓰기 경로는 이렇습니다. 사용자가 즐겨찾기를 추가하면 UUID를 만들어 로컬 ID이자 멱등 키로 쓰고, 추가 대기 상태로 저장합니다. DB가 SSOT라 화면은 즉시 바뀝니다. 그다음 고유 이름의 작업을 네트워크 연결 조건과 지수 백오프로 enqueueUniqueWork에 넣습니다. Worker는 대기 중인 행을 모두 서버에 보내 성공하면 서버 버전으로 갱신하고 동기화 완료로 바꿉니다. 네트워크 오류와 5xx는 Result.retry()로 다시 시도하고, 검증 실패 같은 4xx는 재시도해도 소용없으므로 실패 상태로 표시하고 알려, 사용자가 내용을 고치거나 되돌릴 수 있게 합니다.<\/p>\n<p>충돌 해결은 데이터 성격으로 고릅니다. 마지막 쓰기 우선은 단순하지만 기기 시계가 틀리면 오래된 값이 이기므로, 판단은 서버 시각이나 버전으로 합니다. 버전 번호 방식은 클라이언트가 마지막으로 본 버전을 함께 보내고, 서버 버전이 더 크면 충돌 응답(409)을 돌려 클라이언트가 최신 값을 받아 다시 합치게 합니다. 이름, 메모, 정렬 순서처럼 필드가 서로 독립적이면 필드 단위로 병합해 두 기기의 수정이 모두 살아남게 합니다.<\/p>\n<p>삭제를 바로 지우면 동기화 전에 다른 기기나 서버 응답이 그 항목을 되살립니다. 삭제 표시로 남겨 화면에서 숨기고, 서버에서 삭제를 확인한 뒤 지웁니다. 서버도 삭제 표시를 일정 기간 보관해야 다른 기기가 증분 동기화 때 삭제를 받아 갈 수 있습니다. 여러 기기 동기화는 서버를 최종 기준으로 두고, 클라이언트는 마지막 동기화 커서 이후의 변경분만 받아 오며, 앱 시작과 화면 진입, 푸시 수신 때 동기화를 시작합니다. Android 16은 standby bucket에 따라 작업 실행 quota를 조정하고 이 변경이 WorkManager 작업에도 적용되므로, 동기화가 늦어질 수 있다고 전제하고 중지 이유는 WorkInfo.getStopReason()으로 확인합니다.<\/p>","f":"<ul>\n<li><strong>멱등 키는 왜 클라이언트가 만듭니까?<\/strong> 요청은 서버에 도착했는데 응답만 잃은 경우, 재시도가 같은 키로 가야 서버가 중복으로 알아보고 처음 결과를 돌려줄 수 있기 때문입니다. 키는 작업을 처음 저장할 때 만들어 DB에 함께 둡니다.<\/li>\n<li><strong>Kotlin의 Uuid를 써도 됩니까?<\/strong> 됩니다. Kotlin 2.4.0부터 kotlin.uuid.Uuid API가 Stable이라 Uuid.random()으로 opt-in 없이 v4 UUID를 만들 수 있고, Experimental로 남은 것은 generateV4(), generateV7() 같은 버전 지정 생성 함수입니다. 2.4.0 미만에서 실험 API를 피하려면 java.util.UUID.randomUUID()를 씁니다.<\/li>\n<li><strong>동기화 작업을 expedited로 올려야 합니까?<\/strong> 즐겨찾기 동기화는 사용자가 결과를 기다리는 작업이 아니어서 일반 작업이면 충분합니다. expedited는 standby bucket과 프로세스 중요도로 정해지는 별도 quota를 쓰므로 꼭 즉시 실행해야 하는 작업에 아낍니다.<\/li>\n<li><strong>로그아웃할 때 동기화되지 않은 항목이 있으면?<\/strong> 사라진다고 알리고 동기화를 먼저 시도할지 묻습니다. 그대로 지우면 사용자가 저장했다고 믿은 데이터를 잃습니다.<\/li>\n<\/ul>"},{"no":73,"t":"의존성 주입은 왜 쓰고, Hilt와 Koin은 어떻게 다릅니까? Hilt의 컴포넌트와 스코프를 설명해 보세요.","a":"<p>의존성 주입은 객체를 만드는 책임과 쓰는 책임을 나누는 것입니다. 클래스가 의존 대상을 생성자로 받으면 구체 구현을 몰라도 되고, 테스트에서 페이크로 바꿔 끼울 수 있으며, 싱글턴인지 화면 범위인지 같은 생명주기를 한 곳에서 관리합니다. Hilt는 Dagger 위에서 컴파일 타임에 의존 그래프를 만들고 검증해 누락과 범위 오류를 빌드에서 잡습니다. Koin은 실행 중에 컨테이너에서 정의를 찾아 주입해 설정이 가볍지만, 기본 구성에서는 누락이 그 객체를 처음 요청할 때 예외로 드러납니다. Koin도 테스트의 verify()나 빌드 때 그래프를 검사하는 컴파일러 플러그인으로 검사 시점을 앞당길 수 있지만, 정의를 찾는 일 자체는 여전히 실행 시점에 일어납니다.<\/p>\n<p>Hilt는 Android 클래스의 수명에 맞춘 컴포넌트를 미리 정의해 두고, 모듈을 @InstallIn으로 설치한 컴포넌트와 그 아래 자식 컴포넌트에서만 바인딩을 쓸 수 있게 합니다. 아래 표는 Android 개발자 문서가 싣는 컴포넌트이고, dagger.dev의 Hilt 문서에는 Fragment용 FragmentComponent(@FragmentScoped)와 View용 ViewComponent, ViewWithFragmentComponent(@ViewScoped)도 있습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>컴포넌트<\/th>\n<th>생성과 소멸<\/th>\n<th>스코프<\/th>\n<th>기본 바인딩<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SingletonComponent<\/td>\n<td>Application#onCreate() ~ 앱 종료<\/td>\n<td>@Singleton<\/td>\n<td>Application<\/td>\n<\/tr>\n<tr>\n<td>ActivityRetainedComponent<\/td>\n<td>첫 Activity#onCreate() ~ 마지막 Activity#onDestroy(), 구성 변경을 넘어 유지<\/td>\n<td>@ActivityRetainedScoped<\/td>\n<td>Application<\/td>\n<\/tr>\n<tr>\n<td>ViewModelComponent<\/td>\n<td>ViewModel 생성 ~ 소멸<\/td>\n<td>@ViewModelScoped<\/td>\n<td>SavedStateHandle<\/td>\n<\/tr>\n<tr>\n<td>ActivityComponent<\/td>\n<td>Activity#onCreate() ~ Activity#onDestroy()<\/td>\n<td>@ActivityScoped<\/td>\n<td>Application, Activity<\/td>\n<\/tr>\n<tr>\n<td>ServiceComponent<\/td>\n<td>Service#onCreate() ~ Service#onDestroy()<\/td>\n<td>@ServiceScoped<\/td>\n<td>Application, Service<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>바인딩은 기본으로 스코프가 없어 요청마다 새 인스턴스가 만들어집니다. 스코프를 붙이면 컴포넌트가 사라질 때까지 메모리에 남으므로, Hilt 문서도 공유해야 할 내부 상태가 있거나 동기화가 필요하거나 생성 비용이 크다고 측정된 경우에만 쓰라고 합니다. @Singleton을 남용하면 상태 없는 클래스까지 앱 수명 동안 붙잡고, 사용자별 상태를 담은 싱글턴은 로그아웃 뒤에도 이전 사용자 데이터를 들고 있게 됩니다.<\/p>\n<p>ViewModel은 @HiltViewModel과 @Inject 생성자로 만들고, ViewModelComponent의 기본 바인딩인 SavedStateHandle로 화면 인자와 복원할 상태를 받습니다. Parcelable이 아니어서 SavedStateHandle로 넘기기 어려운 런타임 값을 넘길 때는 @HiltViewModel(assistedFactory = ...)과 @AssistedInject로 assisted injection을 쓰는데, 이 값은 SavedStateHandle과 달리 저장된 상태에 기록되지 않아 프로세스 종료 뒤에는 복원되지 않습니다. SavedStateHandle 값도 디스크가 아니라 시스템이 앱 프로세스 밖 메모리에 보관한 직렬화 사본에서 복원됩니다. 새 프로젝트는 KAPT 대신 KSP로 Hilt 컴파일러를 돌립니다. Dagger 문서는 Dagger 2.60과 KSP 2.3.9부터 KSP 지원이 Stable이라고 적고, AGP 9의 내장 Kotlin은 kotlin-kapt 플러그인과 호환되지 않습니다.<\/p>\n<pre class=\"kotlin\"><code>@HiltViewModel\nclass PlaceDetailViewModel @Inject constructor(\n    savedStateHandle: SavedStateHandle,              // ViewModelComponent 기본 바인딩\n    private val getPlaceDetail: GetPlaceDetailUseCase,\n) : ViewModel() {\n    private val placeId: String = checkNotNull(savedStateHandle[&quot;placeId&quot;])\n}\n\n@Module\n@InstallIn(SingletonComponent::class)\nabstract class DataModule {\n    @Binds @Singleton  // 상태와 캐시를 공유하는 Repository만 스코프를 붙인다\n    abstract fun bindPlaceRepository(impl: DefaultPlaceRepository): PlaceRepository\n}<\/code><\/pre>","f":"<ul>\n<li><strong>@Singleton 객체가 Activity 범위 객체를 주입받으면?<\/strong> Hilt에서는 부모 컴포넌트가 자식 컴포넌트의 바인딩을 볼 수 없어 컴파일 오류가 납니다. 다만 싱글턴이 메서드 인자로 받은 Activity나 콜백을 필드에 담는 누수는 그래프 밖의 일이라 막지 못하므로 코드 리뷰와 LeakCanary로 잡습니다.<\/li>\n<li><strong>서비스 로케이터와는 무엇이 다릅니까?<\/strong> 서비스 로케이터는 객체가 필요할 때 전역 저장소에서 꺼내 오므로 의존이 시그니처에 드러나지 않고, 등록 누락이 실행 중에야 발견됩니다. 주입은 의존이 생성자에 보입니다.<\/li>\n<li><strong>KAPT와 KSP 처리기를 섞어 쓰면?<\/strong> KSP 처리기는 KAPT가 생성한 타입을 해석하지 못합니다. Hilt가 봐야 하는 타입을 만드는 다른 처리기가 있다면 함께 KSP로 옮겨야 합니다.<\/li>\n<\/ul>"},{"no":74,"t":"멀티 모듈은 어떻게 나눕니까? 계층별 분리와 기능별 분리의 장단점은 무엇입니까?","a":"<p>기능이 여러 개인 앱은 기능 단위의 feature 모듈과 목적별 공통 core 모듈로 나누고, 계층은 기능 모듈 안의 패키지나 하위 모듈로 나누는 방식을 기본으로 합니다. 계층별 분리는 시작이 쉽지만 기능 하나를 고쳐도 여러 계층 모듈이 다시 빌드되고, 모듈 하나가 앱 전체 기능을 담아 커집니다. 기능별 분리는 변경이 그 기능 모듈 안에 머물러 빌드와 소유권이 나뉘는 대신, 공통 코드를 어디에 둘지와 모듈 사이 의존 규칙을 관리해야 합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th>계층별 분리<\/th>\n<th>기능별 분리<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>빌드<\/td>\n<td>기능 하나를 고쳐도 여러 계층 모듈이 다시 빌드됨<\/td>\n<td>변경이 대개 그 기능 모듈 안에 머묾<\/td>\n<\/tr>\n<tr>\n<td>경계<\/td>\n<td>계층 사이 의존 방향만 강제<\/td>\n<td>기능 사이 접근까지 강제<\/td>\n<\/tr>\n<tr>\n<td>소유권<\/td>\n<td>계층 단위라 기능 담당과 어긋남<\/td>\n<td>기능 담당과 모듈이 맞음<\/td>\n<\/tr>\n<tr>\n<td>비용<\/td>\n<td>모듈이 적어 설정이 단순<\/td>\n<td>공통 코드 위치와 모듈 사이 규칙 관리 필요<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>빌드 시간 이득은 두 가지에서 옵니다. Gradle과 Kotlin 컴파일러는 바뀐 모듈을 다시 컴파일하되 그 모듈에 의존하는 모듈은 바뀐 모듈의 공개 API가 달라졌을 때만 다시 컴파일하고, 서로 의존하지 않는 모듈은 병렬로 빌드합니다. 그래서 의존 그래프가 깊고 좁은 것보다 넓고 얕은 것이 유리합니다. 의존은 implementation으로 걸어 모듈 내부 의존이 사용하는 쪽으로 새지 않게 하고, api는 공개 타입에 꼭 필요할 때만 씁니다. 경계는 internal 가시성과 모듈 의존으로 강제되어 다른 기능의 내부 클래스를 import할 수 없고, 모듈 단위로 코드 소유자와 리뷰 담당을 정할 수 있습니다.<\/p>\n<p>다른 기능이 참조하는 기능은 :feature:search:api(화면 진입 계약, 공개 모델)와 :feature:search:impl(구현)로 나눕니다. 다른 모듈은 api에만 의존하므로 impl을 고쳐도 다른 기능이 다시 컴파일되지 않습니다. 모듈 수가 늘어나는 비용이 있어 모든 기능에 기계적으로 적용하지는 않습니다. 흔히 깨지는 지점은 core 비대화입니다. :core:common에 이것저것 넣으면 거의 모든 모듈이 의존하게 되어 core의 공개 API가 바뀔 때마다 그 모듈들이 모두 다시 컴파일되므로, :core:network, :core:database, :core:designsystem처럼 목적별로 쪼갭니다. 반대로 모듈을 너무 잘게 나누면 모듈마다 build 파일과 Gradle 구성 시간이 늘어 이득보다 비용이 커지므로, convention plugin으로 설정 중복을 없애고 configuration cache로 구성 시간을 줄입니다.<\/p>","f":"<ul>\n<li><strong>계층별 분리가 맞는 경우는?<\/strong> 기능 수가 적은 앱이거나, 모듈화 첫 단계로 Domain을 순수 Kotlin 모듈로 떼어 의존 방향부터 강제하고 싶을 때입니다.<\/li>\n<li><strong>여러 기능이 쓰는 모델은 어디에 둡니까?<\/strong> 여러 기능이 함께 쓰는 모델은 :core:model 같은 작은 모듈에, 한 기능의 공개 모델은 그 기능의 api 모듈에 둡니다.<\/li>\n<li><strong>모듈화 효과는 어떻게 확인합니까?<\/strong> 빌드 스캔으로 \"검색 화면 한 줄 수정\", \"core 한 줄 수정\" 같은 변경 시나리오마다 증분 빌드 시간과 다시 컴파일된 모듈 수를 비교합니다.<\/li>\n<\/ul>"},{"no":75,"t":"기능 모듈 사이의 화면 이동과 의존성은 어떻게 끊습니까?","a":"<p>feature 모듈끼리는 서로 의존하지 않게 하고, 화면 이동은 각 기능의 api 모듈에 둔 계약(경로 타입이나 이동 인터페이스)으로만 합니다. 구현은 impl 모듈이 DI로 내보내고, 모든 impl을 아는 앱 모듈만 내비게이션 그래프를 조립합니다. 그러면 검색 기능은 장소 상세 기능의 구현을 모른 채 \"장소 상세로 이동\"만 요청할 수 있고, 장소 상세 화면을 고쳐도 검색 모듈은 다시 빌드되지 않습니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: :feature:place:api, 다른 기능은 이 모듈만 안다\n@Serializable data class PlaceDetailRoute(val placeId: String)\n\ninterface FeatureEntry {\n    fun register(registry: NavRegistry)   // 이 기능의 화면을 경로에 등록\n}\n\n// :feature:place:impl, 화면 등록을 Hilt 멀티 바인딩으로 내보낸다\n@Module\n@InstallIn(SingletonComponent::class)\nabstract class PlaceEntryModule {\n    @Binds @IntoSet\n    abstract fun bindEntry(entry: PlaceFeatureEntry): FeatureEntry\n}<\/code><\/pre>\n<p>진입점은 DI로 모읍니다. 각 impl 모듈이 자기 화면을 등록하는 FeatureEntry를 @IntoSet으로 내보내면, 앱 모듈은 <code>Set&lt;FeatureEntry&gt;<\/code>를 주입받아 그래프를 만듭니다. 새 기능을 더해도 앱 모듈의 조립 코드는 바뀌지 않습니다. 다른 기능의 동작이 필요할 때도 같은 방식으로 api의 인터페이스를 주입받고, 구현은 impl이 바인딩합니다.<\/p>\n<p>외부에서 들어오는 딥링크와 알림은 URI를 경로 객체로 바꾸는 파서를 한 곳에 두고, 각 기능은 자기 URI 패턴만 등록합니다. 앱 내부 이동까지 URI 문자열로 하면 기능 사이 결합이 문자열 뒤로 숨어 컴파일러가 잡지 못하므로, 내부 이동은 타입이 있는 경로 객체를 씁니다. 결과 전달은 결과 타입을 호출받는 기능의 api에 정의합니다. Navigation 2에서는 이전 백스택 항목의 SavedStateHandle로 결과를 넘기고, Navigation 3는 1.2.0에서 NavEntry 사이 결과 전달용 Result API가 추가되었습니다. 즐겨찾기 추가처럼 결과가 곧 데이터 변경이면 결과를 넘기지 말고 두 화면이 같은 Repository의 Flow를 보게 하는 편이 단순합니다.<\/p>\n<p>순환 의존은 Gradle이 프로젝트 사이 순환을 만나면 빌드를 실패시키므로 그 자체는 드러납니다. 놓치기 쉬운 것은 순환이 아닌 규칙 위반입니다. feature가 다른 feature의 impl에 의존하는 것은 순환이 아니어서 그대로 빌드되므로, convention plugin에서 의존 대상 모듈 이름을 검사하거나 CI에서 모듈 그래프 규칙을 검사해 \"feature는 다른 feature의 api에만 의존한다\"를 강제합니다.<\/p>","f":"<ul>\n<li><strong>api 모듈에는 무엇까지 둡니까?<\/strong> 경로 타입, 결과 타입, 다른 기능이 꼭 써야 하는 인터페이스와 공개 모델만 둡니다. 화면 Composable이나 ViewModel을 api에 두면 결국 구현에 의존하는 것과 같습니다.<\/li>\n<li><strong>Navigation 2와 Navigation 3 중 무엇을 씁니까?<\/strong> Navigation 2(androidx.navigation)는 유지 관리 모드라 중요한 수정만 받고 새 기능 계획이 없습니다. 새 Compose 프로젝트는 2025-11-19에 1.0.0 안정판이 나온 Navigation 3를 검토하고, 기존 앱은 이전 비용과 함께 판단합니다.<\/li>\n<li><strong>기능 사이에 상태를 공유해야 하면?<\/strong> feature끼리 직접 부르지 않고, 공유할 데이터를 core의 Repository로 내리거나 한 기능의 api 인터페이스를 다른 기능이 주입받습니다.<\/li>\n<\/ul>"},{"no":76,"t":"대규모 프로젝트의 Gradle 빌드는 어떻게 관리하고 빠르게 합니까?","a":"<p>설정은 version catalog와 build-logic의 convention plugin으로 한 곳에 모으고, 속도는 configuration cache와 build cache로 다시 하지 않아도 되는 일을 건너뛰며, 어노테이션 처리는 KAPT에서 KSP로 옮기는 것이 기본입니다. 그리고 감으로 고치지 않고 빌드 스캔으로 시간이 드는 곳을 측정한 뒤 고칩니다.<\/p>\n<p>관리 쪽에서는 gradle/libs.versions.toml의 version catalog에 라이브러리와 플러그인 버전을 모아 모듈마다 버전이 어긋나지 않게 합니다. 모듈 build 파일마다 반복되는 android 블록, Kotlin 컴파일러 옵션, Compose와 테스트 설정은 build-logic 포함 빌드의 convention plugin으로 옮겨, 기능 모듈의 build 파일에는 플러그인 적용과 의존 몇 줄만 남깁니다. 설정을 바꿀 때 모든 모듈 파일을 고치지 않아도 되고, 새 모듈도 같은 규칙으로 시작합니다.<\/p>\n<p>속도 쪽에서 configuration cache는 구성 단계 결과를 저장해 구성 입력이 바뀌지 않으면 구성 단계를 통째로 건너뛰고, 같은 프로젝트 안의 작업도 병렬로 실행합니다. Gradle 9.0부터 권장 실행 방식입니다. build cache는 작업 출력을 입력 기준으로 저장해 다시 쓰며, CI가 채운 원격 캐시를 개발자 PC가 읽으면 브랜치를 바꾼 뒤의 빌드가 빨라집니다. KAPT는 Kotlin 코드를 Java 스텁으로 만든 뒤 Java 어노테이션 처리기를 돌려 느리고, KSP는 Kotlin 심볼을 직접 읽습니다. AGP 9의 내장 Kotlin은 kotlin-kapt 플러그인과 호환되지 않고, Room 3.0은 KSP 전용이며, Dagger와 Hilt는 2.60(KSP 2.3.9 이상)부터 KSP 지원이 Stable입니다. non-transitive R class는 모듈의 R 클래스가 자기 리소스만 담게 해 리소스 변경이 의존 모듈 전체의 R 재생성으로 번지지 않게 합니다. AGP 8.0부터 android.nonTransitiveRClass 기본값이 true라, 오래된 프로젝트의 gradle.properties에 false가 남아 있는지 확인합니다.<\/p>\n<pre class=\"properties\"><code>org.gradle.configuration-cache=true\norg.gradle.caching=true\norg.gradle.parallel=true\n# AGP 8.0부터 기본값이 true라 false로 남아 있지 않은지만 확인한다\nandroid.nonTransitiveRClass=true<\/code><\/pre>\n<p>AGP의 최근 변경도 빌드 관리에 영향을 줍니다. AGP 9.0부터 내장 Kotlin이 기본이라 org.jetbrains.kotlin.android 플러그인 없이 Kotlin을 컴파일하고, 새 DSL만 쓰게 되어 android.applicationVariants 같은 이전 variant API에 접근하던 스크립트와 플러그인이 깨집니다. 같은 9.0에서 android.enableAppCompileTimeRClass 기본값도 true가 되어 앱 모듈도 라이브러리처럼 non-final R 클래스로 컴파일하므로, R 필드를 switch case처럼 상수가 필요한 자리에 쓴 코드는 고쳐야 합니다. 이것은 AGP 8.0의 nonTransitiveRClass와 다른 설정입니다. 최신 안정판 AGP 9.5는 Gradle 9.6.0 이상과 JDK 17을 요구합니다. KSP는 2.3.0부터 버전이 Kotlin 컴파일러 버전과 분리되었습니다. 빌드 스캔(--scan)으로는 구성 시간, 작업별 시간, 캐시 적중 여부와 캐시가 맞지 않은 이유를 확인합니다.<\/p>","f":"<ul>\n<li><strong>configuration cache를 켰더니 빌드가 실패하면?<\/strong> 작업 실행 중에 Project 객체를 참조하거나, 구성 단계에서 ProcessBuilder나 Runtime.exec()로 외부 프로세스를 실행하거나, 실행 단계에서 호출될 빌드 리스너를 구성 단계에서 등록하는 코드가 흔한 원인입니다. 구성 단계에서 파일과 환경 변수를 읽는 것은 실패가 아니라 구성 입력으로 기록되어 값이 바뀌면 구성 단계를 다시 돌리므로, 자주 바뀌는 값은 providers.environmentVariable()과 providers.fileContents()로 작업 입력에 연결합니다. 문제 리포트를 보고 외부 프로세스 실행은 providers.exec()로 바꾸고, 호환되지 않는 플러그인은 버전을 올리거나 교체합니다.<\/li>\n<li><strong>KAPT를 당장 없앨 수 없으면?<\/strong> AGP 9에서 내장 Kotlin을 쓰면서 KAPT가 필요하면 같은 AGP 버전의 com.android.legacy-kapt 플러그인으로 바꾸는 길이 있지만 과도기용입니다. KSP 처리기는 KAPT가 만든 타입을 보지 못하므로, 서로 참조하는 처리기를 묶어 함께 옮기는 순서로 진행합니다.<\/li>\n<li><strong>CI 빌드 시간은 어떻게 줄입니까?<\/strong> 원격 build cache는 CI만 쓰고 개발자는 읽게 하며, 바뀐 모듈과 그 모듈에 의존하는 모듈의 테스트만 돌려 범위를 줄입니다.<\/li>\n<\/ul>"},{"no":77,"t":"오류는 계층별로 어떻게 바꿔 UI까지 전달합니까?","a":"<p>Data 계층 경계에서 HTTP, 직렬화, I/O 예외를 도메인 오류 타입으로 바꾸고, UI 계층은 그 오류를 보고 사용자에게 보일 문장과 재시도 버튼을 정합니다. Retrofit의 HttpException이나 IOException이 ViewModel까지 올라오면 UI가 네트워크 라이브러리에 묶이고, 상태 코드 분기가 화면마다 흩어집니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: Data 계층 경계에서 라이브러리 예외를 도메인 오류로 바꾼다\nsuspend fun &lt;T&gt; apiCall(block: suspend () -&gt; T): AppResult&lt;T&gt; = try {\n    AppResult.Success(block())\n} catch (e: IOException) {\n    AppResult.Failure(DomainError.Network)        // 재시도 가능\n} catch (e: HttpException) {\n    AppResult.Failure(e.toDomainError())          // 401, 404, 5xx를 구분\n} catch (e: SerializationException) {\n    reportNonFatal(e)                             // 서버와 앱의 계약 위반은 보고\n    AppResult.Failure(DomainError.Unexpected)\n}\n// CancellationException은 잡지 않으므로 그대로 전파된다<\/code><\/pre>\n<p>Data 계층에서는 Exception 전체가 아니라 IOException, HttpException, 직렬화 예외처럼 구체 타입만 잡아 네트워크 오류, 인증 만료, 없음, 서버 오류, 응답 형식 오류 같은 sealed 오류로 바꿉니다. CancellationException을 잡으면 코루틴 취소가 전파되지 않으므로, 넓게 잡아야 한다면 다시 던집니다. runCatching은 CancellationException까지 잡으므로 suspend 호출을 감쌀 때 같은 주의가 필요합니다.<\/p>\n<p>사용자 메시지는 UI 계층이 정합니다. 같은 네트워크 오류라도 검색 화면은 전체 오류와 \"다시 시도\"를, 이미 경로를 보여 주는 화면은 기존 결과를 유지한 채 작은 배너를 띄우는 식으로 화면 맥락에 따라 다르고, 다국어 문자열 리소스도 UI에 있기 때문입니다. 도메인 오류에 재시도 가능 여부를 담아, 네트워크 오류와 5xx에는 재시도 버튼을, 4xx 검증 오류에는 입력 수정 안내를 보여 줍니다.<\/p>\n<p>인증 오류는 화면마다 처리하지 않고 전역에서 처리합니다. OkHttp Authenticator가 401 응답에서 토큰 갱신을 시도하고 원 요청을 다시 보내며, 갱신마저 실패하면 앱 수명 SessionRepository에 세션 만료를 알려 앱 전체가 로그인 화면으로 이동합니다. non-fatal 보고는 선별합니다. 오프라인처럼 예상한 오류는 보고하지 않고, 직렬화 실패나 처리하지 못한 상태 코드처럼 앱이나 서버의 결함을 뜻하는 오류만 Crashlytics 같은 도구에 non-fatal로 보내며 API 경로와 상태 코드를 키로 붙입니다. 모든 오류를 보내면 정작 결함 신호가 묻힙니다.<\/p>","f":"<ul>\n<li><strong>kotlin.Result를 쓰면 안 됩니까?<\/strong> 써도 되지만 실패 쪽이 Throwable이라 오류 종류를 타입으로 강제하지 못합니다. 실패 종류를 when으로 빠짐없이 처리하게 하려면 sealed 오류 타입을 둡니다.<\/li>\n<li><strong>동시에 여러 요청이 401을 받으면?<\/strong> Authenticator는 OkHttp 스레드에서 동기로 불리므로 synchronized로 갱신을 한 번만 실행하고, 기다리던 요청은 이미 새 토큰이 있으면 갱신 없이 그 토큰으로 다시 보냅니다.<\/li>\n<li><strong>Flow 중간에서 오류가 나면?<\/strong> catch 연산자로 위쪽 스트림의 오류를 상태로 바꿔 내보내고, retryWhen으로 IOException일 때만 지연을 두고 다시 시도합니다. catch는 아래쪽 collect에서 난 예외는 잡지 않습니다.<\/li>\n<\/ul>"},{"no":78,"t":"검색 결과처럼 페이지 단위로 불러오는 목록은 어떻게 설계합니까?","a":"<p>Paging 3로 PagingSource를 만들고, ViewModel에서 검색어 Flow를 flatMapLatest로 새 Pager에 연결한 뒤 cachedIn(viewModelScope)으로 캐시합니다. Compose에서는 collectAsLazyPagingItems로 받아 LoadState로 로딩과 오류를 그립니다. 서버 API는 OFFSET이 아니라 커서 기반이어야 결과 앞쪽에 항목이 끼어들거나 빠질 때 중복과 누락이 생기지 않습니다.<\/p>\n<p>PagingSource의 load는 params.key(커서)로 한 페이지를 받아 LoadResult.Page를 돌려주고, 실패는 LoadResult.Error로 돌려 UI가 재시도하게 합니다. 커서 기반이면 nextKey에 서버가 준 다음 커서를, 마지막 페이지면 null을 넣습니다. getRefreshKey는 새로고침 때 시작할 키인데, 커서 API는 중간 위치로 다시 들어갈 방법이 없는 경우가 많아 null로 두고 처음부터 불러옵니다. 오프라인에서도 보여야 하는 목록은 RemoteMediator가 네트워크에서 받은 페이지를 Room에 쓰고 PagingSource는 Room에서 읽게 해 DB를 SSOT로 둡니다. 검색 결과처럼 금방 버리는 목록은 네트워크 PagingSource로 충분합니다.<\/p>\n<pre class=\"kotlin\"><code>@HiltViewModel\nclass SearchViewModel @Inject constructor(\n    private val repository: PlaceSearchRepository,\n) : ViewModel() {\n    private val query = MutableStateFlow(&quot;&quot;)\n\n    val results: Flow&lt;PagingData&lt;PlaceUi&gt;&gt; = query\n        .debounce(300)\n        .distinctUntilChanged()\n        .flatMapLatest { q -&gt; if (q.isBlank()) flowOf(PagingData.empty()) else repository.search(q) }\n        .map { page -&gt; page.map { it.toUi() } }   // 변환은 cachedIn 앞에 둔다\n        .cachedIn(viewModelScope)\n\n    fun onQueryChange(text: String) { query.value = text }\n}<\/code><\/pre>\n<p>검색어가 바뀌면 이전 PagingData를 버리고 새로 시작해야 하므로 flatMapLatest로 새 Pager의 flow로 갈아탑니다. cachedIn이 없으면 PagingData를 다시 수집할 수 없고 구성 변경 때 처음부터 다시 불러오게 됩니다. cachedIn은 그 앞의 변환 결과까지 캐시하므로 map 같은 변환은 cachedIn 앞에 둡니다. UI에서는 loadState.refresh가 Loading이면 전체 로딩을, Error면 전체 오류와 retry()를 보여 주고, loadState.append가 Error면 목록 끝에 다시 시도 항목을 둡니다. 항목에는 itemKey로 안정적인 key를 줘 스크롤 위치와 항목 상태가 유지되게 합니다.<\/p>","f":"<ul>\n<li><strong>커서 기반이 왜 필요합니까?<\/strong> OFFSET은 다음 페이지를 불러오기 전에 앞쪽에 항목이 추가되면 경계 항목이 또 나오고, 삭제되면 하나를 건너뜁니다. 커서는 마지막으로 본 항목의 정렬 키를 기준으로 하므로 앞쪽 변경에 흔들리지 않고, 서버가 불투명한 문자열로 줘서 클라이언트는 해석하지 않습니다.<\/li>\n<li><strong>목록의 항목 하나만 바꾸려면 어떻게 합니까?<\/strong> PagingData는 불변이라 직접 고치지 못합니다. DB가 SSOT면 행을 고쳐 PagingSource가 무효화되며 다시 읽게 하고, 네트워크 PagingSource라면 즐겨찾기처럼 바뀐 ID 집합을 combine으로 합쳐 표시 상태만 덮어씁니다.<\/li>\n<li><strong>Room 3로 옮기면 Paging 연동은 어떻게 됩니까?<\/strong> Room 3.0은 Paging, RxJava, LiveData 연동을 @DaoReturnTypeConverter 기반의 별도 아티팩트로 옮겼으므로 해당 아티팩트를 따로 추가합니다.<\/li>\n<\/ul>"},{"no":79,"t":"계층마다 무엇을 어떤 테스트로 검증합니까? 페이크와 목은 어떻게 고릅니까?","a":"<p>테스트 피라미드대로 JVM 단위 테스트를 가장 많이, 통합 테스트를 중간에, 기기에서 도는 UI 테스트는 핵심 흐름에만 둡니다. UseCase와 ViewModel은 JVM 단위 테스트로 상태 전이를, Repository는 페이크 데이터 소스로 데이터 규칙을, DAO는 Room 인메모리 DB로 실제 쿼리를, UI는 Compose 테스트와 스크린샷 테스트로 화면을 검증합니다. 테스트 대역은 페이크를 기본으로 하고, 목은 호출 자체가 결과인 경계에만 씁니다.<\/p>\n<pre class=\"kotlin\"><code>@Test\nfun 검색이_네트워크_오류로_실패하면_재시도_가능한_오류_상태가_된다() = runTest {\n    // Main 디스패처는 테스트 규칙에서 같은 스케줄러의 테스트 디스패처로 바꿔 둔다\n    val repository = FakePlaceRepository().apply { failNextWith(DomainError.Network) }\n    val viewModel = SearchResultViewModel(repository)\n\n    viewModel.onSearch(&quot;강남역&quot;)\n    advanceUntilIdle()\n\n    assertEquals(ResultsState.Error(retryable = true), viewModel.uiState.value.results)\n}<\/code><\/pre>\n<p>ViewModel 테스트는 페이크 Repository를 넣고 이벤트를 보낸 뒤 uiState가 기대한 순서로 바뀌는지 봅니다. StandardTestDispatcher는 advanceUntilIdle 같은 진행 호출 전까지 코루틴을 실행하지 않아 로딩 같은 중간 상태도 검증할 수 있습니다. Repository는 페이크 네트워크와 DAO로 \"새로고침하면 DB에 쓰고, 실패하면 기존 데이터를 유지한다\" 같은 규칙을 검증합니다. DAO는 Room.inMemoryDatabaseBuilder로 실제 SQL을 실행해야 쿼리 오류를 잡고, 마이그레이션은 내보낸 스키마와 MigrationTestHelper로 검증합니다. UI는 Compose 테스트로 상태별 화면과 클릭 동작을 확인하고, Paparazzi나 Roborazzi 같은 JVM 스크린샷 테스트로 디자인 회귀를 잡습니다. Compose 1.11부터 v2 테스트 API가 기본이고 StandardTestDispatcher로 코루틴을 돌리므로, 시작된 코루틴이 가상 시계를 진행할 때까지 대기한다는 점을 알고 씁니다.<\/p>\n<p>목을 남용하면 테스트가 결과가 아니라 내부 호출 순서를 검증하게 되어, 동작은 그대로인 리팩터링에도 깨지고 정작 동작 오류는 놓칩니다. Android 테스트 문서도 페이크를 권하고, Google 가이드는 Domain 계층을 테스트할 때도 페이크 Repository를 쓰라고 적습니다. 페이크가 실제와 달라지지 않도록 같은 계약 테스트를 실제 구현과 페이크 양쪽에 돌립니다. 목은 분석 이벤트 전송이나 알림 발송처럼 \"불렸는가\"가 요구 사항인 곳에 씁니다.<\/p>\n<p>디스패처와 시간은 주입합니다. Dispatchers.IO를 코드에 박아 두면 그 부분은 runTest의 가상 시간 밖에서 실제 스레드로 돌아, 테스트가 기다려 주지 않거나 불안정해집니다. Main은 Dispatchers.setMain으로 테스트 디스패처로 바꾸고, 모든 테스트 디스패처가 같은 스케줄러를 쓰게 합니다. runTest는 delay를 가상 시간으로 건너뛰고 본문에 기본 60초 timeout을 둡니다. 캐시 만료처럼 시각에 의존하는 로직은 Clock을 주입해 테스트가 시각을 정하게 합니다.<\/p>","f":"<ul>\n<li><strong>Robolectric은 언제 씁니까?<\/strong> Android 프레임워크 클래스가 필요하지만 기기까지는 필요 없는 테스트를 JVM에서 빠르게 돌릴 때 씁니다. 실제 기기 동작과 다를 수 있어 핵심 흐름은 기기 테스트로 한 번 더 확인합니다.<\/li>\n<li><strong>Flow에서 나오는 값을 어떻게 검증합니까?<\/strong> 값의 순서가 중요하면 Turbine 같은 도구로 나오는 값을 차례로 확인하고, 최종 상태만 보면 되면 StateFlow.value를 봅니다. 끝나지 않는 수집은 backgroundScope에서 시작하면 테스트가 끝날 때 자동으로 취소됩니다.<\/li>\n<li><strong>불안정한 테스트는 어떻게 다룹니까?<\/strong> 실제 시간, 실행 순서, 테스트 사이 공유 상태, 실제 네트워크가 흔한 원인입니다. 원인을 고칠 때까지 격리해 테스트 전체의 신뢰를 지킵니다.<\/li>\n<\/ul>"},{"no":80,"t":"테스트가 부족한 레거시 앱을 서비스 중단 없이 새 구조로 바꾸려면 어떤 순서로 진행합니까?","a":"<p>전면 재작성은 하지 않습니다. 기존 코드에 숨은 요구 사항과 다른 기능이 기대는 동작까지 잃기 쉽고, 그동안 기능 개발이 멈추기 때문입니다. 순서는 바꿀 부분의 현재 동작을 특성 테스트로 고정하고, 테스트 대역을 끼울 이음매를 만든 뒤, 새 구현을 옆에 만들어 기능 플래그로 조금씩 넘기는 점진 교체입니다. 계층은 Data 계층부터 아래에서 위로 올라가고, 단계마다 배포 가능한 상태를 유지하며 크래시와 성능 지표로 확인합니다.<\/p>\n<p>첫 단계는 특성 테스트입니다. 지금의 출력이 맞다고 가정하고 입력과 출력을 기록해 두는 테스트라, 새 구조가 동작을 바꿨는지 알려 줍니다. API 응답 파싱, 요금과 거리 계산, 정렬 규칙처럼 로직이 몰린 곳부터 씁니다. 다음은 이음매입니다. Activity나 전역 싱글턴 안에서 직접 만들던 네트워크 클라이언트와 DB 접근을 생성자 인자나 인터페이스로 받게 바꾸는 작고 기계적인 리팩터링을 IDE의 자동 리팩터링으로 합니다.<\/p>\n<p>그다음은 아래에서 위로 바꿉니다. 네트워크와 DB 접근을 Repository로 감싸 Data 계층을 먼저 만들고, 기존 화면은 그대로 둔 채 Repository를 쓰게 합니다. 이어서 화면 로직을 ViewModel로 옮기고 마지막에 UI를 바꿉니다. Google이 2026-05-19에 View 컴포넌트를 유지보수 모드로 두고 Compose 우선을 발표한 만큼 새 UI는 Compose로 만들되, 동작하는 View 화면을 한 번에 바꾸지 않고 기존 Fragment에 ComposeView를 넣는 식으로 화면 일부부터 바꿉니다. 큰 덩어리는 새 구현을 옆에 만들고 기능 플래그로 신구 경로를 전환하는 스트랭글러 방식으로 교체합니다. 일부 사용자부터 켜서 크래시율, ANR, 화면 표시 시간을 이전 경로와 비교하고, 이상이 보이면 플래그로 즉시 되돌립니다. Android vitals의 나쁜 동작 기준(전체 user-perceived crash rate 1.09%, user-perceived ANR rate 0.47%)도 함께 봅니다.<\/p>\n<p>기능 개발은 멈추지 않고 병행합니다. 새 기능은 새 구조로 만들고, 기존 코드는 고칠 일이 생긴 곳부터 바꿉니다. 리팩터링과 기능 변경은 다른 PR로 나눠 리뷰와 롤백을 쉽게 하고, 변경이 잦고 장애가 나는 곳을 먼저 하며, 아무도 건드리지 않고 탈도 없는 코드는 그대로 둡니다.<\/p>","f":"<ul>\n<li><strong>어디부터 손댈지 어떻게 정합니까?<\/strong> 변경 빈도와 복잡도를 함께 보는 핫스팟 분석에 크래시와 VOC가 몰리는 화면을 겹쳐 우선순위를 정합니다.<\/li>\n<li><strong>새 구조와 이전 구조가 함께 있는 기간의 비용은?<\/strong> 같은 기능이 두 벌이라 버그를 양쪽에서 고쳐야 합니다. 전환 완료 기준(사용자 비율과 지표)과 이전 코드 삭제 시점을 처음부터 정해 공존 기간을 짧게 합니다.<\/li>\n<li><strong>기술 부채를 갚을 시간은 어떻게 확보합니까?<\/strong> 장애 건수와 개발 속도 저하를 숫자로 보여 주고, 기능 작업에 붙여 조금씩 갚는 계획을 제안합니다.<\/li>\n<\/ul>"},{"no":81,"t":"기능 플래그, 원격 설정, A/B 테스트는 앱 구조 어디에 넣습니까?","a":"<p>플래그와 실험 값은 FeatureFlags 같은 인터페이스 하나를 경계로 두고 그 안에서만 평가하며, ViewModel이나 UseCase는 그 인터페이스를 주입받아 결과만 씁니다. 원격 설정 SDK를 화면 곳곳에서 직접 부르면 키 이름과 기본값이 흩어지고, 테스트에서 값을 고정하기 어렵고, 끝난 플래그를 지울 때 사용처를 찾기 어렵습니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 플래그 평가는 이 인터페이스 한 곳에서만 한다\ninterface FeatureFlags {\n    fun isEnabled(flag: Flag): Boolean\n}\n\nenum class Flag(val key: String, val defaultValue: Boolean) {\n    NEW_ROUTE_SUMMARY(&quot;new_route_summary&quot;, defaultValue = false),   // 앱에 넣는 기본값\n}\n\n@HiltViewModel\nclass RouteSummaryViewModel @Inject constructor(flags: FeatureFlags) : ViewModel() {\n    // 화면 진입 때 한 번 읽어 화면이 열려 있는 동안 고정한다\n    private val useNewSummary = flags.isEnabled(Flag.NEW_ROUTE_SUMMARY)\n}<\/code><\/pre>\n<p>모든 플래그는 앱에 기본값을 두고, 네트워크가 없거나 첫 실행이면 기본값이나 마지막으로 받은 값을 씁니다. 원격 값을 받는 즉시 적용하면 사용 중인 화면이 바뀌므로, 가져오기와 적용을 나눠 받은 값은 다음 시작이나 다음 화면 진입 때 적용합니다. Firebase Remote Config 문서도 앞서 받아 둔 값을 시작할 때 적용하고 새로 받은 값은 다음 시작에 쓰는 방식을 효과적인 전략으로 소개합니다. 다만 같은 문서는 A/B 테스트 값은 사용자를 실험에 배정하고 실험 값을 적용하는 데 시간이 더 걸리므로, 로딩 화면을 보여 주는 동안 가져와 활성화하는 방식을 강하게 권합니다. 화면이 열려 있는 동안 값이 바뀌면 UI가 중간에 바뀌고 실험 데이터도 섞이므로, 화면 진입 때 읽은 값을 그 화면 동안 고정합니다. 새 기능에는 kill switch를 두어 배포 후 결함이 보이면 앱 업데이트 없이 이전 경로로 되돌리고, 그래서 이전 경로는 플래그를 정리할 때까지 지우지 않습니다.<\/p>\n<p>A/B 테스트에서는 노출 로깅을 배정 시점이 아니라 사용자가 실제로 변형을 본 시점에 남겨야 효과가 희석되지 않습니다. 배정은 서버나 실험 플랫폼이 로그인 사용자 ID 같은 안정적인 식별자와 실험 키를 해시해 정하면, 세션이 바뀌거나 앱을 다시 실행해도 같은 그룹에 머뭅니다. 그룹 크기 비율이 설계와 다르게 나오는 표본 비율 불일치는 배정이나 로깅에 결함이 있다는 신호라, 결과를 해석하기 전에 원인부터 찾습니다. 한 그룹만 화면 로딩이 느려 이탈한 사용자의 노출 로그가 덜 남는 경우가 전형적입니다. 실험이 끝나면 이긴 경로만 남기고 플래그와 분기 코드를 지웁니다. 플래그마다 담당자와 만료일을 두지 않으면 남은 플래그가 조합 수를 늘려 테스트를 어렵게 합니다.<\/p>","f":"<ul>\n<li><strong>실험군 배정을 클라이언트에서 직접 하면?<\/strong> 재설치나 기기 변경 때 그룹이 바뀌고, 앱 버전마다 해시 로직이 다르면 배정이 어긋납니다. 배정은 서버나 실험 플랫폼이 하고 클라이언트는 결과를 캐시해 씁니다.<\/li>\n<li><strong>플래그가 켜진 경우와 꺼진 경우는 어떻게 테스트합니까?<\/strong> 페이크 FeatureFlags로 두 경우를 각각 테스트하고, 모든 조합 대신 실제로 함께 켜질 조합만 확인합니다.<\/li>\n<li><strong>실험 결과를 매일 보다가 유의해 보이면 멈춰도 됩니까?<\/strong> 유의해 보이는 순간에 멈추면 거짓 양성이 늘어납니다. 필요한 표본 크기와 기간을 미리 정하고 그 시점에 판단합니다.<\/li>\n<\/ul>"},{"no":82,"t":"서버 주도 UI는 언제 도입할 만하고, 위험은 무엇입니까?","a":"<p>서버 주도 UI는 서버가 화면 구성(어떤 컴포넌트를 어떤 순서와 데이터로 보일지)을 내려 주고 앱은 미리 넣어 둔 네이티브 컴포넌트로 그리는 방식입니다. 홈 피드, 배너, 프로모션과 이벤트 화면처럼 배치가 자주 바뀌고 앱 배포 주기보다 빨리 바꿔야 하는 화면에 도입할 만합니다. 반대로 길안내, 결제, 로그인처럼 상호작용이 복잡하고 안정성이 우선인 화면은 네이티브로 둡니다.<\/p>\n<p>전제는 컴포넌트 카탈로그와 버전 협상입니다. 서버가 보낼 수 있는 컴포넌트를 카탈로그로 관리해 디자인 시스템 컴포넌트와 맞추고, 앱은 요청에 자기가 그릴 수 있는 스키마 버전과 컴포넌트 목록을 담아 보내 서버가 그 앱이 그릴 수 있는 것만 내려 주게 합니다. 오래된 앱 버전은 계속 남아 있으므로 하위 호환이 핵심입니다. 앱은 모르는 컴포넌트나 필드를 만나면 크래시 없이 건너뛰거나 대체 UI를 그리고, 서버는 필드를 지우거나 뜻을 바꾸지 않고 추가만 합니다. 버튼이 일으키는 동작도 화면 이동이나 딥링크처럼 앱이 아는 종류로 제한합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 아는 컴포넌트만 그리고 모르는 것은 건너뛴다\n@Composable\nfun ServerSection(component: UiComponent, onAction: (UiAction) -&gt; Unit) {\n    when (component) {\n        is UiComponent.Banner -&gt; Banner(component.imageUrl, component.a11yLabel) { onAction(component.action) }\n        is UiComponent.PlaceCarousel -&gt; PlaceCarousel(component.places, onAction)\n        is UiComponent.Unknown -&gt; Unit   // 구버전 앱은 새 컴포넌트를 무시한다\n    }\n}<\/code><\/pre>\n<p>위험은 네 가지입니다. 성능 면에서는 응답 파싱과 깊은 중첩이 첫 화면 표시를 늦추고 레이아웃이 응답을 받은 뒤에야 정해지므로, 마지막 응답을 캐시해 먼저 그리고 중첩 깊이를 제한합니다. 접근성 면에서는 서버가 준 이미지와 버튼에 설명 문구가 빠지기 쉬워, 스키마에서 접근성 문구를 필수 필드로 두고 의미 역할은 컴포넌트 쪽에서 정합니다. 테스트 면에서는 화면 조합이 서버 데이터에 따라 바뀌어 화면 단위 테스트가 어렵기 때문에, 컴포넌트 단위 스크린샷 테스트와 응답 스키마 계약 테스트, 대표 응답 샘플을 그리는 테스트를 둡니다. 정책 면에서는 서버가 보내는 것이 실행 코드가 아니라 화면 구성 데이터여야 합니다. Google Play 정책은 Play 밖에서 dex, JAR, .so 같은 실행 코드를 내려받는 것을 금지하고, 실행 중 불러오는 인터프리터 코드도 정책 위반을 가능하게 해서는 안 된다고 적습니다. 그래서 앱 전체를 서버 주도로 바꾸기보다 일부 영역에 적은 수의 컴포넌트로 시작하고, 화면 이상을 재현할 수 있게 응답 ID를 로그에 남깁니다.<\/p>","f":"<ul>\n<li><strong>서버 주도 UI와 WebView는 어떻게 다릅니까?<\/strong> WebView는 웹 기술로 화면 전체를 그려 배포가 자유롭지만 네이티브 성능과 디자인 일관성을 잃습니다. 서버 주도 UI는 네이티브 컴포넌트로 그려 성능과 디자인 시스템 일관성을 지키는 대신, 표현할 수 있는 범위가 카탈로그로 제한됩니다.<\/li>\n<li><strong>서버 응답이 실패하면?<\/strong> 마지막으로 성공한 구성을 캐시에서 보여 주고, 캐시도 없으면 앱에 넣어 둔 기본 구성을 그립니다.<\/li>\n<li><strong>A/B 테스트와 함께 쓰면?<\/strong> 서버가 실험군마다 다른 구성을 내려 줄 수 있어 실험이 쉬워지지만, 노출 로깅은 실제로 그려진 컴포넌트를 기준으로 남겨야 합니다.<\/li>\n<\/ul>"},{"no":83,"t":"로그인 세션, 사용자 설정 같은 앱 전역 상태는 화면 상태와 어떻게 나눠 관리합니까?","a":"<p>앱 전역 상태는 앱 수명 Repository가 StateFlow로 소유하고 DataStore로 영속하며, 화면 상태는 ViewModel이 그 Flow를 구독해 화면에 필요한 모양으로 만듭니다. 세션 Repository는 @Singleton으로 두고 주입받은 앱 범위 CoroutineScope에서 stateIn으로 공유하며, 화면은 세션을 직접 고치지 않고 Repository의 login, logout 함수를 부릅니다. 화면 상태는 화면과 함께 사라지고, 전역 상태는 화면과 무관하게 앱이 살아 있는 동안 하나만 있습니다.<\/p>\n<pre class=\"kotlin\"><code>@Singleton\nclass SessionRepository @Inject constructor(\n    private val store: DataStore&lt;SessionPrefs&gt;,\n    @ApplicationScope appScope: CoroutineScope,\n) {\n    val session: StateFlow&lt;Session&gt; = store.data\n        .map { it.toSession() }\n        .stateIn(appScope, SharingStarted.Eagerly, Session.Unknown)  // 첫 값을 읽기 전에는 Unknown\n\n    suspend fun logout() {\n        store.updateData { SessionPrefs() }\n        // 이어서 사용자 데이터 테이블, 캐시, 예약 작업을 정리한다\n    }\n}<\/code><\/pre>\n<p>object에 var user를 두는 전역 가변 싱글턴은 피합니다. 누가 언제 바꿨는지 추적되지 않고, 여러 스레드가 동시에 바꾸며, 테스트 사이에 상태가 새고, 무엇보다 프로세스 종료 뒤 메모리 값이 사라져 화면은 복원되었는데 세션은 비어 있는 상태가 됩니다. 그래서 세션 여부, 사용자 ID, 설정은 DataStore에 저장하고, Repository는 DataStore의 data Flow를 앱 수명 StateFlow로 노출합니다. 첫 값을 읽기 전에는 Unknown을 두어 로그인 여부를 모르는 사이에 로그인 화면이 잠깐 보이는 일을 막습니다. 토큰처럼 민감한 값은 Android Keystore의 키로 암호화해 저장합니다. DataStore 1.3.0은 Tink 기반 암호화 아티팩트 datastore-tink를 추가했고, security-crypto는 모든 API를 deprecated했으므로 EncryptedSharedPreferences를 새로 도입하지 않습니다.<\/p>\n<p>앱 범위 스코프는 GlobalScope 대신 @ApplicationScope 같은 한정자로 SupervisorJob을 가진 CoroutineScope를 주입받아 씁니다. 테스트에서 TestScope로 바꿀 수 있고, 누가 앱 수명 작업을 시작하는지 드러납니다. 로그아웃은 한 곳에서 순서대로 정리합니다. 세션과 토큰을 지우고, 사용자 데이터가 든 Room 테이블과 메모리, 이미지, HTTP 캐시를 비우고, 예약된 WorkManager 작업을 취소하고, 사용자별 상태를 가진 싱글턴을 초기화한 뒤 백스택을 비우고 로그인 화면으로 보냅니다. 하나라도 빠지면 다음 사용자에게 이전 사용자 데이터가 보이므로, 각 Repository가 세션 Flow를 구독해 로그아웃 때 스스로 정리하게 하면 빠뜨림이 줄어듭니다. 프로세스 종료 뒤에는 화면 인자와 입력값만 SavedStateHandle로 복원하고, 세션과 설정은 DataStore에서 다시 읽습니다. 복원된 화면이 세션을 메모리에서 바로 꺼내 쓰면 비어 있으므로, 세션 Flow의 첫 값을 기다린 뒤 화면을 그립니다.<\/p>","f":"<ul>\n<li><strong>화면이 DataStore를 직접 읽어도 됩니까?<\/strong> 화면이 DataStore를 직접 알면 저장 방식이 바뀔 때 모든 화면을 고쳐야 합니다. Repository 뒤에 두고 Flow로 받습니다.<\/li>\n<li><strong>SharingStarted.Eagerly와 WhileSubscribed 중 무엇을 씁니까?<\/strong> 세션처럼 앱 내내 필요한 상태는 앱 범위에서 Eagerly로 계속 유지하고, 화면 상태는 WhileSubscribed로 구독자가 없을 때 멈춰 백그라운드에서 쓸데없이 일하지 않게 합니다.<\/li>\n<li><strong>여러 프로세스가 세션을 함께 쓰면?<\/strong> 메모리 상태는 프로세스마다 따로 있으므로, 같은 파일을 여러 프로세스가 쓰려면 DataStore 1.1.0부터 지원하는 다중 프로세스 접근을 씁니다.<\/li>\n<\/ul>"},{"no":84,"t":"디자인 시스템과 공통 UI 컴포넌트는 어떻게 관리합니까?","a":"<p>디자인 토큰(색, 타이포그래피, 간격, 모양, 모션)을 Compose 테마로 옮기고, 그 테마 값만 쓰는 공통 컴포넌트를 :core:designsystem 모듈에 모읍니다. 기능 모듈은 Color(0xFF...)나 dp 숫자를 직접 쓰지 않고 테마 값과 공통 컴포넌트만 쓰게 해, 디자인 변경이 토큰 수정 한 번으로 앱 전체에 반영되게 합니다.<\/p>\n<p>색 토큰은 \"파랑 500\" 같은 원시 값 이름이 아니라 primary, surface, textSecondary, 경로 혼잡 표시색처럼 의미 이름으로 정의합니다. 그래야 다크 모드에서 의미 이름마다 다른 원시 값을 매핑하기만 하면 됩니다. Material 3를 쓰면 colorScheme, typography, shapes에 맞추고, Material에 없는 토큰(브랜드 색, 지도 위 표시 색, 간격)은 @Immutable 클래스를 staticCompositionLocalOf로 제공하는 확장 테마로 둡니다.<\/p>\n<pre class=\"kotlin\"><code>@Immutable\ndata class AppColors(val brand: Color, val textSecondary: Color, val routeCongested: Color)\nval LocalAppColors = staticCompositionLocalOf&lt;AppColors&gt; { error(&quot;AppTheme 밖에서 쓰였습니다&quot;) }\n\n@Composable\nfun AppTheme(darkTheme: Boolean = isSystemInDarkTheme(), content: @Composable () -&gt; Unit) {\n    val colors = if (darkTheme) DarkAppColors else LightAppColors   // 의미 이름별 원시 값 매핑\n    CompositionLocalProvider(LocalAppColors provides colors) {\n        MaterialTheme(colorScheme = colors.toColorScheme(), content = content)\n    }\n}\n\nobject AppTheme {\n    val colors: AppColors @Composable get() = LocalAppColors.current   // AppTheme.colors.brand\n}<\/code><\/pre>\n<p>컴포넌트 API는 Compose API 가이드라인에 맞춰 일관되게 만듭니다. 화면을 그리는 컴포넌트는 modifier를 첫 번째 선택 매개변수로 받고, 상태는 밖에서 받는 상태 호이스팅 형태로, 내용은 @Composable 람다 슬롯으로 받아 확장합니다. 색과 크기 기본값은 ButtonDefaults처럼 Defaults 객체에 모아 한 곳에서 바꾸고, 이름과 매개변수 순서도 컴포넌트끼리 맞춥니다. 디자이너와는 실제 구현을 상태별로 보여 주는 컴포넌트 카탈로그 앱이나 Preview 모음으로 협업하고, 컴포넌트마다 라이트와 다크, 글꼴 크기 확대 조합으로 스크린샷 테스트를 걸어 의도하지 않은 변경을 PR에서 잡습니다. 디자인 도구의 토큰 이름과 코드 이름을 맞추면 리뷰가 쉬워집니다.<\/p>\n<p>View 화면이 남아 있으면 같은 토큰을 XML과 Compose 두 곳에 손으로 복사하지 않습니다. 하나의 토큰 원본에서 XML 리소스와 Compose 테마 값을 함께 생성하거나, 한쪽을 원본으로 두고 다른 쪽이 그 값을 읽게 해 어긋남을 막습니다. Google이 View 컴포넌트를 유지보수 모드로 두고 Compose 우선을 발표했으므로, 새 컴포넌트는 Compose로만 만들고 View 화면에는 ComposeView로 넣는 쪽이 이중 구현을 줄입니다.<\/p>","f":"<ul>\n<li><strong>Material 컴포넌트를 감싸 씁니까, 직접 만듭니까?<\/strong> 대부분은 Material 3 컴포넌트를 감싸 토큰과 기본값만 고정한 래퍼로 시작하고, 디자인이 Material 동작과 크게 다를 때만 Foundation 위에서 직접 만듭니다. Material 3 1.4.0부터 material-icons 의존이 빠졌으므로 아이콘 세트도 디자인 시스템이 관리합니다.<\/li>\n<li><strong>공통 컴포넌트가 비대해지면?<\/strong> 한 화면만 쓰는 변형까지 매개변수로 넣으면 API가 커지므로, 두 곳 이상에서 쓰일 때만 공통으로 올리고 나머지는 기능 모듈에 둡니다.<\/li>\n<li><strong>원시 색을 직접 쓰는 코드는 어떻게 막습니까?<\/strong> 기능 모듈에서 Color 생성자나 하드코딩한 dp를 찾는 lint 규칙을 두고, 스크린샷 테스트를 라이트와 다크 두 벌로 돌려 다크 모드 누락을 잡습니다.<\/li>\n<\/ul>"},{"no":85,"t":"SOLID 원칙은 Android 코드에서 어떻게 드러나고, 자주 쓰는 디자인 패턴은 무엇입니까?","a":"<p>SOLID는 변경이 일어나는 방향으로 코드를 나누는 원칙이고, Android에서는 ViewModel과 Repository의 책임 분리, 인터페이스에 의존하는 Repository, 생성자 주입으로 드러납니다. 디자인 패턴은 이름을 외우기보다 이미 쓰는 라이브러리 안에서 찾아 \"어떤 변경을 쉽게 하려는 구조인가\"로 설명합니다. 다만 원칙을 기계적으로 적용해 구현이 하나뿐인 인터페이스를 모든 클래스에 만들면 탐색만 어려워지는 과잉 추상화가 됩니다.<\/p>\n<p>단일 책임은 바뀌는 이유가 하나가 되게 나누는 것으로, ViewModel은 화면 상태를 만들고 Repository는 데이터 출처를 관리하며 표시 형식은 UI가 맡습니다. Activity 하나에 네트워크 호출, 파싱, 화면 갱신이 함께 있는 코드가 반대 예입니다. 개방 폐쇄는 새 결제 수단이나 지도 레이어를 더할 때 기존 코드를 고치지 않고 구현만 더하는 것으로, 인터페이스와 DI 멀티 바인딩으로 만듭니다. sealed 결과와 when은 반대 방향의 선택입니다. 새 처리(새 when)를 더하기는 쉽지만 새 하위 타입을 더하면 모든 when을 고쳐야 하고, 대신 컴파일러가 빠진 곳을 알려 줘 누락을 막습니다. 어느 쪽 변경이 잦은지로 고릅니다. 리스코프 치환은 하위 타입이 상위 계약을 지키는 것으로, 페이크 Repository가 실제 구현과 다른 예외 규칙을 가지면 테스트는 통과해도 실제로는 깨집니다. 인터페이스 분리는 읽기만 하는 화면이 쓰기 메서드까지 가진 큰 인터페이스에 의존하지 않게 나누는 것입니다. 의존성 역전은 Domain이 Repository 인터페이스를 정의하고 Data가 구현하는 구조로, 테스트에서 페이크를 끼울 수 있고 모듈 빌드 의존 방향이 정리되어 체감 효과가 가장 큽니다.<\/p>\n<p>상속보다 합성을 씁니다. BaseActivity, BaseFragment에 공통 기능을 쌓으면 부모 변경이 모든 화면에 번지는 취약한 기반 클래스 문제를 만들고, 하나만 상속할 수 있다는 제약에도 걸립니다. 공통 기능은 생명주기 옵저버, by 위임, Modifier, Composable 함수 합성으로 붙입니다. Kotlin은 클래스가 기본 final이라 상속을 열려면 open으로 의도를 밝혀야 합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>패턴<\/th>\n<th>라이브러리 예<\/th>\n<th>쉽게 만드는 변경<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Builder<\/td>\n<td>Retrofit.Builder, OkHttpClient.Builder<\/td>\n<td>선택 옵션이 많은 불변 객체 조립<\/td>\n<\/tr>\n<tr>\n<td>Observer<\/td>\n<td>Flow, StateFlow<\/td>\n<td>발행자를 고치지 않고 구독자 추가<\/td>\n<\/tr>\n<tr>\n<td>Adapter<\/td>\n<td>RecyclerView.Adapter, Retrofit의 CallAdapter와 Converter<\/td>\n<td>맞지 않는 인터페이스 연결<\/td>\n<\/tr>\n<tr>\n<td>Factory<\/td>\n<td>ViewModelProvider.Factory, Retrofit.create<\/td>\n<td>생성 로직 숨기기<\/td>\n<\/tr>\n<tr>\n<td>책임 연쇄<\/td>\n<td>OkHttp Interceptor<\/td>\n<td>요청 처리 단계 추가와 순서 변경<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Flow를 Observer로 들 때는 Flow가 기본적으로 콜드라 수집할 때마다 처음부터 실행되고, StateFlow는 최신 값 하나를 가진 핫 스트림이라는 차이를 함께 말합니다. OkHttp 인터셉터는 chain.proceed로 다음 인터셉터에 요청을 넘기는 책임 연쇄이고, 각 인터셉터가 같은 요청 흐름에 헤더나 로깅을 덧입힌다는 점에서는 데코레이터와도 닮았습니다. Retrofit.create는 동적 프록시로 인터페이스 구현체를 만들어 줍니다.<\/p>\n<pre class=\"kotlin\"><code>class AuthHeaderInterceptor(private val tokens: TokenStore) : Interceptor {\n    override fun intercept(chain: Interceptor.Chain): Response {\n        val request = chain.request().newBuilder()\n            .header(&quot;Authorization&quot;, &quot;Bearer ${tokens.current()}&quot;)\n            .build()\n        return chain.proceed(request)   // 다음 인터셉터로 넘긴다\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>구현이 하나뿐인 인터페이스는 언제 만듭니까?<\/strong> 모듈 경계를 넘거나, 테스트에서 교체가 필요하거나, 외부 시스템을 감쌀 때입니다. 그 밖에는 클래스 하나로 두고 필요해질 때 추출합니다.<\/li>\n<li><strong>Kotlin에서 고전 패턴이 줄어드는 이유는?<\/strong> 고차 함수가 전략 패턴을, 기본 인자와 이름 있는 인자가 상당수의 빌더를, by 위임이 위임 구현을, sealed class가 결과와 상태 분기를 더 짧게 대신합니다.<\/li>\n<li><strong>애플리케이션 인터셉터와 네트워크 인터셉터의 차이는?<\/strong> 애플리케이션 인터셉터는 호출당 한 번 실행되고, 네트워크 인터셉터는 리다이렉트와 재시도마다 실제 네트워크 요청 단위로 실행되며 연결 정보를 볼 수 있습니다.<\/li>\n<\/ul>"}]},{"no":5,"title":"Android 플랫폼","qs":[{"no":86,"t":"Activity 생명주기 콜백은 다른 Activity로 이동, 반투명 화면이나 다이얼로그, 홈 버튼, 화면 회전에서 각각 어떤 순서로 불립니까?","a":"<p>기준은 화면이 보이는지와 입력 포커스를 가졌는지입니다. 완전히 가려지면 onPause와 onStop이 모두 불리고, 일부라도 보이면 onPause까지만 불립니다. 같은 Activity가 띄운 Dialog는 Activity 위에 뜬 별도 창일 뿐이라 생명주기 콜백이 불리지 않습니다. 회전 같은 구성 변경은 기본으로 Activity를 파괴하고 새 인스턴스를 만듭니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>상황<\/th>\n<th>순서<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A에서 B 시작<\/td>\n<td>A.onPause → B.onCreate → B.onStart → B.onResume → A.onStop<\/td>\n<\/tr>\n<tr>\n<td>B에서 뒤로 가기<\/td>\n<td>B.onPause → A.onRestart → A.onStart → A.onResume → B.onStop → B.onDestroy<\/td>\n<\/tr>\n<tr>\n<td>반투명 Activity나 Dialog 테마 Activity가 위에 뜸<\/td>\n<td>A.onPause만 불림, 닫히면 A.onResume<\/td>\n<\/tr>\n<tr>\n<td>같은 Activity의 AlertDialog, DialogFragment<\/td>\n<td>Activity 콜백 없음, onWindowFocusChanged(false)만 옴<\/td>\n<\/tr>\n<tr>\n<td>홈 버튼, 최근 앱 화면<\/td>\n<td>onPause → onStop, 돌아오면 onRestart → onStart → onResume<\/td>\n<\/tr>\n<tr>\n<td>회전<\/td>\n<td>onPause → onStop → onDestroy, 새 인스턴스에서 onCreate → onStart → onRestoreInstanceState → onResume<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A에서 B를 시작할 때 A의 onStop은 B가 onResume까지 끝난 뒤에 불립니다. 두 화면이 같은 데이터를 저장하고 읽는다면 A의 onPause에서 무거운 저장을 하면 B의 시작이 그만큼 늦어집니다. onSaveInstanceState는 생명주기 콜백이 아니어서 항상 불리지는 않습니다. 뒤로 가기로 끝나는 Activity는 다시 복원할 일이 없어 호출되지 않고, 호출될 때 targetSdk 28 이상 앱은 onStop 뒤, 그 이전 타깃은 onStop 전이며 onPause와의 순서는 보장되지 않습니다.<\/p>\n<p>멀티 윈도는 Android 버전에 따라 다릅니다. Android 10(API 29)부터는 multi-resume이라 멀티 윈도에서 보이는 Activity가 모두 RESUMED이고, 투명 Activity가 위에 있거나 PiP처럼 포커스를 받을 수 없을 때만 onPause가 불립니다. Android 9 이하에서는 마지막으로 상호작용한 Activity만 RESUMED이고 옆 창의 Activity는 STARTED에 머뭅니다. 그래서 지도 갱신이나 영상 재생처럼 보이는 동안 계속할 일은 onStart와 onStop에 맞추고, 카메라처럼 하나만 쓸 수 있는 자원은 onTopResumedActivityChanged로 최상위 여부를 봅니다. 멀티 윈도 진입과 창 크기 조절은 구성 변경으로 처리됩니다.<\/p>\n<p>onDestroy는 보장되지 않습니다. 백그라운드에 있는 동안 시스템이 메모리를 회수하려고 프로세스를 종료하면 onDestroy를 포함한 어떤 콜백도 불리지 않습니다. Activity 레퍼런스 기준으로 onStop이 반환된 뒤부터 프로세스는 언제든 종료될 수 있는 상태이므로, 사용자 데이터는 늦어도 onStop까지, 실제로는 사용자가 행동한 시점에 Repository로 저장합니다. onDestroy는 스레드나 리스너 같은 자원 정리에만 쓰고, isFinishing과 isChangingConfigurations로 사용자가 끝낸 것인지 구성 변경인지 구분합니다.<\/p>","f":"<ul>\n<li><strong>onStop에서 Fragment 트랜잭션을 해도 됩니까?<\/strong> targetSdk 28 이상이면 onSaveInstanceState가 onStop 뒤에 불리므로 onStop 안의 트랜잭션은 안전하다고 Activity 레퍼런스가 적습니다. 상태가 저장된 뒤의 commit은 IllegalStateException이 나므로, 비동기 결과로 화면을 바꿀 때는 생명주기 인식 수집을 거칩니다.<\/li>\n<li><strong>위치나 카메라 같은 자원은 onResume과 onStart 중 어디서 잡습니까?<\/strong> 보이는 동안 필요한 자원은 ON_START에서 잡고 ON_STOP에서 놓습니다. 생명주기 가이드도 자원을 잡은 이벤트와 짝이 되는 이벤트에서 놓으라고 하고, 멀티 윈도에서는 RESUMED가 아니어도 화면에 보일 수 있다고 적습니다.<\/li>\n<li><strong>Compose에서는 생명주기를 어떻게 다룹니까?<\/strong> 콜백을 직접 쓰기보다 상태를 ViewModel과 rememberSaveable에 두고, Flow는 collectAsStateWithLifecycle로 수집합니다. 시작과 정리가 짝을 이루는 작업은 LifecycleStartEffect나 LifecycleResumeEffect로, 이벤트에 한 번 반응하면 되는 작업은 LifecycleEventEffect로 처리합니다. 같은 Activity의 Dialog가 떠도 리컴포지션에는 영향이 없습니다.<\/li>\n<\/ul>"},{"no":87,"t":"구성 변경과 프로세스 종료는 무엇이 다르고, 각각 어떤 데이터가 사라집니까? 프로세스 종료는 어떻게 재현합니까?","a":"<p>구성 변경은 프로세스는 그대로 두고 Activity 인스턴스만 다시 만드는 일입니다. Activity 필드와 remember 값처럼 Activity와 컴포지션에 묶인 메모리만 사라지고, ViewModel과 싱글턴, 메모리 캐시는 남습니다. 프로세스 종료는 백그라운드에 있던 앱의 프로세스가 통째로 사라지는 일이라 ViewModel을 포함한 모든 메모리가 사라지고, 시스템이 보관한 저장된 상태와 태스크의 백 스택만 남아 사용자가 돌아오면 마지막 화면부터 복원됩니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>상태<\/th>\n<th>구성 변경<\/th>\n<th>프로세스 종료<\/th>\n<th>사용자가 완전히 닫음(최근 앱에서 밀기, 강제 종료, 재부팅, finish)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>remember, Activity 필드<\/td>\n<td>사라짐<\/td>\n<td>사라짐<\/td>\n<td>사라짐<\/td>\n<\/tr>\n<tr>\n<td>ViewModel<\/td>\n<td>유지<\/td>\n<td>사라짐<\/td>\n<td>사라짐<\/td>\n<\/tr>\n<tr>\n<td>rememberSaveable, SavedStateHandle<\/td>\n<td>유지<\/td>\n<td>복원<\/td>\n<td>사라짐<\/td>\n<\/tr>\n<tr>\n<td>Room, DataStore, 파일<\/td>\n<td>유지<\/td>\n<td>유지<\/td>\n<td>유지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>ViewModel이 회전을 넘기는 이유는 ComponentActivity가 onRetainNonConfigurationInstance로 ViewModelStore를 새 인스턴스에 넘기고, ON_DESTROY에서 isChangingConfigurations가 false일 때만 ViewModelStore를 비우기 때문입니다. 저장된 상태는 Save UI states 문서 기준으로 시스템이 앱 프로세스 밖의 메모리에 직렬화해 보관합니다. 디스크가 아니므로 사용자가 최근 앱 화면에서 밀거나 설정에서 강제 종료하거나 재부팅하면 함께 지워집니다. 저장된 상태는 Binder로 시스템에 넘어가고, Binder 트랜잭션 버퍼는 1MB로 프로세스에서 진행 중인 모든 트랜잭션이 함께 씁니다. 시스템은 사용자가 돌아올 수 있는 동안 이 데이터를 들고 있어야 하므로 공식 문서는 저장된 상태를 50KB 미만으로 두라고 권합니다. 검색어, 선택한 ID, 탭 같은 최소한만 넣고 데이터는 Repository에서 다시 읽습니다.<\/p>\n<p>재현은 앱을 홈 버튼으로 백그라운드에 보낸 뒤 adb shell am kill 패키지명으로 프로세스를 죽이고 최근 앱 화면에서 다시 엽니다. am kill은 사용자 경험에 영향이 없는, 종료해도 안전한 프로세스만 죽이므로 앱이 앞에 있으면 동작하지 않습니다. am force-stop이나 설정의 강제 종료는 사용자가 완전히 닫은 경우라 저장된 상태까지 지워져 재현이 되지 않습니다. 개발자 옵션의 활동 유지 안 함은 사용자가 떠나는 즉시 Activity를 파괴합니다. 구성 변경이 아니므로 ViewModel까지 사라지고 저장된 상태로 복원되는 경로는 확인되지만, 프로세스는 살아 있어 싱글턴과 static 값이 남으므로 프로세스 종료를 일부만 재현합니다.<\/p>\n<p>android:configChanges로 재생성을 막는 것은 상태 보존의 해결책이 아닙니다. 프로세스 종료는 그대로 일어나고, 모든 구성 변경을 막을 수 없으며, 막은 변경은 앱이 직접 반영해야 합니다. 다만 공식 문서는 Compose만 쓰는 앱에는 재생성보다 리컴포지션이 싸고 회전 중 애니메이션이 이어진다는 이유로 구성 변경을 직접 처리하라고 권합니다. 이때도 AndroidView나 AndroidFragment로 넣은 View는 리소스를 직접 갱신해야 하고 프로세스 종료 대비는 따로 합니다. Android 17(API 37)부터는 CONFIG_KEYBOARD, CONFIG_KEYBOARD_HIDDEN, CONFIG_NAVIGATION, CONFIG_TOUCHSCREEN, CONFIG_COLOR_MODE 변경에서 기본으로 Activity를 재시작하지 않고, 예전 동작이 필요하면 android:recreateOnConfigChanges로 지정합니다.<\/p>","f":"<ul>\n<li><strong>프로세스 종료 뒤 복원되면 어떤 코드가 깨집니까?<\/strong> 이전 화면이 메모리 싱글턴에 넣어 둔 값을 다음 화면이 꺼내 쓰는 코드, 시작 화면에서만 초기화하는 전역 상태, 세션을 메모리에만 둔 코드입니다. 복원은 마지막 화면부터 시작하므로 시작 화면을 거친다고 가정하지 않습니다. 세션 복원은 4절의 앱 전역 상태 문항에서 다룹니다.<\/li>\n<li><strong>저장된 상태와 Room은 어떻게 나눕니까?<\/strong> 사용자가 완전히 닫은 뒤에도 남아야 하는 데이터(즐겨찾기, 작성 중인 긴 글)는 Room이나 DataStore에, 화면을 다시 만들 때 필요한 작은 값은 저장된 상태에 둡니다. Compose 상태별 보관 위치는 3절의 상태 보관 문항에서 다룹니다.<\/li>\n<li><strong>ViewModel 테스트로 프로세스 종료를 검증할 수 있습니까?<\/strong> SavedStateHandle에 값을 넣어 ViewModel을 새로 만들면 복원 로직은 단위 테스트로 확인할 수 있습니다. 화면 전체 복원은 am kill로 실제 기기에서 확인합니다.<\/li>\n<\/ul>"},{"no":88,"t":"Fragment는 왜 Fragment 생명주기와 View 생명주기가 따로 있고, viewLifecycleOwner는 왜 써야 합니까?","a":"<p>Fragment가 백 스택에 들어가면 Fragment 인스턴스는 남고 View만 파괴되기 때문입니다. replace와 addToBackStack으로 다른 Fragment로 바꾸면 이전 Fragment는 onDestroyView까지만 가서 CREATED에 머물고, 돌아올 때 onCreateView부터 View를 다시 만듭니다. Fragment의 Lifecycle은 View보다 오래 살므로 View를 다루는 작업은 View의 Lifecycle인 viewLifecycleOwner에 묶습니다.<\/p>\n<p>공식 문서도 Fragment의 View는 Fragment와 따로 관리되는 별도 Lifecycle을 가진다고 설명하고, onDestroyView 뒤에는 View 참조를 모두 놓아 GC가 View 계층을 회수하게 하라고 적습니다. View Binding 문서가 binding을 nullable 필드에 두고 onDestroyView에서 null로 바꾸는 이유입니다. 이를 빠뜨리면 백 스택에 있는 동안 그 화면의 View 계층 전체가 메모리에 남습니다. RecyclerView 어댑터를 Fragment 필드로 들고 있어도 어댑터가 RecyclerView를 참조해 같은 누수가 생깁니다. viewLifecycleOwner는 onCreateView 안에서부터 onDestroyView 호출이 끝날 때까지 쓸 수 있습니다. onCreateView에서 접근하고 View를 돌려주지 않거나, onDestroyView가 끝난 뒤 접근하면 IllegalStateException이 납니다.<\/p>\n<p>구독도 viewLifecycleOwner 기준입니다. Flow는 viewLifecycleOwner.lifecycleScope에서 repeatOnLifecycle(STARTED)로, LiveData는 observe(viewLifecycleOwner)로 받습니다. Fragment 자신을 owner로 쓰면 View가 다시 만들어질 때마다 구독이 하나씩 쌓이고 파괴된 View를 갱신하게 됩니다. 수집 방법의 자세한 비교는 2절의 Flow 수집 문항에서 다룹니다.<\/p>\n<p>Fragment 사이의 일회성 결과는 Fragment Result API로 넘깁니다. Fragment 1.3.0부터 FragmentManager가 FragmentResultOwner를 구현하므로, 받는 쪽이 setFragmentResultListener(requestKey)를 등록하고 보내는 쪽이 같은 FragmentManager에 setFragmentResult(requestKey, bundle)을 부르면 받는 Fragment가 STARTED가 될 때 결과가 전달됩니다. 키마다 리스너와 결과는 하나뿐이라 리스너가 STARTED가 아닐 때 여러 번 보내면 마지막 결과만 남습니다. 부모가 자식 Fragment의 결과를 받을 때는 부모가 childFragmentManager에 리스너를 등록합니다. 2026-05-19 Compose First 발표에서 Fragment는 중요한 버그 수정만 받는 View 기반 라이브러리로 분류되었으므로, 새 화면은 Compose로 만들고 이 규칙은 기존 Fragment 화면을 유지보수할 때 적용합니다.<\/p>\n<pre class=\"kotlin\"><code>class PlaceFragment : Fragment(R.layout.fragment_place) {\n    private val viewModel: PlaceViewModel by viewModels()\n    private var _binding: FragmentPlaceBinding? = null\n    private val binding get() = _binding!!          // View가 있는 동안만 접근\n    override fun onViewCreated(view: View, savedInstanceState: Bundle?) {\n        _binding = FragmentPlaceBinding.bind(view)\n        viewLifecycleOwner.lifecycleScope.launch {\n            viewLifecycleOwner.repeatOnLifecycle(Lifecycle.State.STARTED) {\n                viewModel.uiState.collect { binding.title.text = it.title }\n            }\n        }\n    }\n    override fun onDestroyView() { super.onDestroyView(); _binding = null }  // View 계층 해제\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Fragment에서 LiveData를 this로 observe하면 무엇이 문제입니까?<\/strong> 백 스택에서 돌아와 View를 다시 만들 때마다 아직 살아 있는 Fragment Lifecycle에 관찰자가 하나씩 더 붙어 콜백이 여러 번 불립니다. viewLifecycleOwner로 관찰하면 onDestroyView 때 관찰자가 자동으로 정리됩니다.<\/li>\n<li><strong>Fragment Result API와 공유 ViewModel은 어떻게 고릅니까?<\/strong> 선택한 장소 ID나 QR 스캔 결과처럼 한 번 전달하고 끝나는 값은 Fragment Result API로, 두 화면이 같은 데이터를 계속 관찰해야 하면 부모 범위 ViewModel이나 공유 Repository를 씁니다.<\/li>\n<li><strong>onDestroyView 뒤에 도착한 비동기 콜백이 binding에 접근하면?<\/strong> binding의 !!에서 NPE가 납니다. 결과를 viewLifecycleOwner 범위의 코루틴에서 받으면 View가 파괴될 때 함께 취소되어 이런 접근이 생기지 않습니다.<\/li>\n<\/ul>"},{"no":89,"t":"Context에는 어떤 종류가 있고, 잘못 쓰면 어떤 문제가 생깁니까?","a":"<p>Context는 리소스, 시스템 서비스, 컴포넌트 시작 같은 앱 환경에 접근하는 창구이고, 종류에 따라 수명과 테마가 다릅니다. Application Context는 프로세스와 함께 살고 테마가 없습니다. Activity는 ContextThemeWrapper를 상속해 자기 테마와 창 정보를 갖고 Activity와 함께 파괴됩니다. Service도 ContextWrapper를 상속한 Context로 Service 수명을 따릅니다. 수명이 긴 객체에는 Application Context를, 화면을 만들거나 띄울 때는 Activity Context를 쓰는 것이 기준입니다.<\/p>\n<p>ContextWrapper는 실제 구현인 base Context에 호출을 넘기는 래퍼이고, ContextThemeWrapper는 여기에 테마를 덧씌웁니다. View와 Fragment는 자기 Context가 없습니다. View.getContext()는 inflate할 때 쓴 Context를 돌려주고, Fragment의 Context는 붙어 있는 호스트 Activity라서 Fragment.getContext()는 attach 전이나 detach 뒤에 null이고 requireContext()는 그때 예외를 던집니다. Compose의 LocalContext.current는 ContextThemeWrapper로 감싸여 있을 수 있으므로 Activity로 캐스팅하지 않습니다. 먼저 LocalConfiguration이나 LocalView처럼 필요한 값만 주는 CompositionLocal을 쓰고, 필요한 API가 Activity에만 있을 때 activity-compose의 LocalActivity.current를 씁니다.<\/p>\n<p>첫 번째 문제는 누수입니다. 싱글턴이나 Repository가 Activity Context를 잡으면 Activity가 파괴된 뒤에도 GC되지 못해 View 계층 전체가 남습니다. 수명이 긴 객체에는 applicationContext를 넘기고, Hilt에서는 @ApplicationContext로 주입받아 실수를 막습니다. static 필드, 앱 스코프 코루틴의 람다, 해제하지 않은 리스너도 같은 경로로 Activity를 잡습니다. 누수를 찾는 방법은 6절의 메모리 누수 문항에서 다룹니다.<\/p>\n<p>두 번째 문제는 Application Context로 화면을 다루는 경우입니다. Dialog를 띄우면 창 토큰이 없어 WindowManager.BadTokenException이 나고, inflate하면 Activity 테마가 적용되지 않아 Material 컴포넌트가 테마 속성을 찾지 못해 예외를 던지거나 다른 모양으로 그려집니다. 멀티 윈도처럼 창마다 크기가 다를 때도 실제 창을 반영한 Configuration은 Activity Context에 있습니다. Activity가 아닌 Context에서 startActivity를 하려면 들어갈 기존 태스크가 없으므로 FLAG_ACTIVITY_NEW_TASK가 필요합니다. API 31부터는 StrictMode의 detectIncorrectContextUse()가 시각적이지 않은 Context로 WindowManager 같은 UI 서비스를 얻는 코드를 잡아 줍니다.<\/p>","f":"<ul>\n<li><strong>Toast나 시스템 서비스에도 Activity Context가 필요합니까?<\/strong> Toast, ConnectivityManager처럼 창이나 테마와 무관한 일은 Application Context로 충분합니다. LayoutInflater, WindowManager, 창 크기 계산처럼 화면에 묶인 일만 Activity Context가 필요합니다.<\/li>\n<li><strong>ContextThemeWrapper는 언제 직접 씁니까?<\/strong> 화면 일부에 다른 테마를 입혀 inflate할 때 ContextThemeWrapper(context, themeResId)로 감쌉니다. 언어처럼 Configuration을 바꾼 Context가 필요하면 createConfigurationContext를 씁니다.<\/li>\n<li><strong>ViewModel에서 Context가 필요하면 어떻게 합니까?<\/strong> ViewModel은 Activity보다 오래 살므로 Activity Context를 받으면 구성 변경 때 누수가 납니다. 문자열 리소스는 UI 계층에서 풀고, 꼭 필요하면 @ApplicationContext를 받은 Repository나 래퍼를 주입합니다.<\/li>\n<\/ul>"},{"no":90,"t":"태스크와 백 스택, launchMode와 Intent 플래그는 어떻게 동작합니까? 알림이나 딥링크로 들어올 때 백 스택은 어떻게 구성합니까?","a":"<p>태스크는 사용자가 한 작업 흐름에서 거친 Activity를 쌓아 둔 백 스택이고, launchMode와 Intent 플래그는 새 Activity를 어느 태스크에 넣을지와 기존 인스턴스를 재사용할지를 정합니다. 알림이나 딥링크로 상세 화면에 바로 들어올 때는 뒤로 가기가 앱 밖으로 나가 버리지 않도록 상위 화면을 미리 쌓은 합성 백 스택을 만드는 것이 공식 권장입니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>launchMode<\/th>\n<th>동작<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>standard<\/td>\n<td>기본값, 시작한 태스크에 매번 새 인스턴스를 만듦<\/td>\n<\/tr>\n<tr>\n<td>singleTop<\/td>\n<td>같은 Activity가 현재 태스크 맨 위에 있을 때만 onNewIntent로 재사용, 아니면 새 인스턴스<\/td>\n<\/tr>\n<tr>\n<td>singleTask<\/td>\n<td>기존 인스턴스가 있으면 onNewIntent로 전달하고 그 위 Activity를 모두 제거, 없으면 같은 affinity의 기존 태스크에 넣고 그런 태스크가 없을 때만 새 태스크의 루트로 생성(같은 앱의 Activity는 기본으로 affinity가 같아 보통 현재 태스크 위에 쌓임)<\/td>\n<\/tr>\n<tr>\n<td>singleInstance<\/td>\n<td>singleTask와 같지만 그 태스크에는 이 Activity 하나만 있고, 여기서 시작한 Activity는 다른 태스크로 감<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Intent 플래그는 manifest의 launchMode를 덮어씁니다. FLAG_ACTIVITY_NEW_TASK는 새 태스크에서 시작하되 그 Activity의 태스크가 이미 있으면 그 태스크를 앞으로 가져와 onNewIntent로 전달하고, FLAG_ACTIVITY_SINGLE_TOP은 singleTop과 같습니다. FLAG_ACTIVITY_CLEAR_TOP은 대상이 현재 태스크에 있으면 그 위의 Activity를 모두 제거하고 onNewIntent로 전달하는데, 대상의 launchMode가 standard면 대상도 제거되고 새 인스턴스가 만들어집니다. CLEAR_TOP은 NEW_TASK와 함께 써서 다른 태스크에 있는 기존 화면을 찾아 맨 위로 올릴 때 주로 씁니다. 재사용된 인스턴스는 onCreate가 아니라 onNewIntent로 새 Intent를 받고 getIntent()는 예전 Intent를 계속 돌려주므로, onNewIntent에서 바로 처리하거나 setIntent로 바꿉니다.<\/p>\n<p>알림으로 일반 화면에 들어올 때는 manifest의 parentActivityName으로 화면 계층을 정하고, TaskStackBuilder의 addNextIntentWithParentStack()으로 부모 화면까지 쌓은 뒤 getPendingIntent()로 PendingIntent를 만듭니다. 새 태스크가 메인 화면 위에 상세 화면이 놓인 구조로 만들어져 뒤로 가기가 앱의 상위 화면으로 갑니다. 알림에서만 여는 특수 화면은 백 스택이 필요 없으므로 taskAffinity를 빈 문자열로, excludeFromRecents를 true로 두고 FLAG_ACTIVITY_NEW_TASK와 FLAG_ACTIVITY_CLEAR_TASK로 엽니다.<\/p>\n<p>Navigation은 딥링크 백 스택을 직접 만들어 줍니다. 명시적 딥링크(알림이나 위젯의 PendingIntent)로 들어오면 태스크의 백 스택을 지우고 딥링크 목적지로 바꾸며, 중첩 그래프마다 시작 목적지도 쌓아 진입점에서 들어온 것처럼 뒤로 갈 수 있게 합니다. 암시적 딥링크는 FLAG_ACTIVITY_NEW_TASK가 있으면 같은 방식으로 백 스택을 다시 만들고, 없으면 딥링크를 연 이전 앱의 태스크에 남아 뒤로 가기는 이전 앱으로, 위로 가기는 앱의 상위 목적지로 갑니다. 그래프를 코드로 만드는 Navigation Compose에는 공식 문서가 TaskStackBuilder로 딥링크 PendingIntent를 만들라고 권합니다. 공식 문서는 Navigation을 쓸 때 launchMode를 standard로 두라고 강하게 권하는데, singleTop처럼 인스턴스를 재사용하면 딥링크가 자동 처리되지 않아 onNewIntent에서 navController.handleDeepLink(intent)를 직접 불러야 하기 때문입니다. Navigation 3는 앱이 백 스택 리스트를 직접 가지므로 필요한 키를 미리 쌓으면 되고, 이는 3절의 Navigation 문항에서 다룹니다.<\/p>\n<p>targetSdk 31 이상 앱은 intent filter가 있는 activity, service, receiver에 android:exported를 명시해야 하고, 없으면 Android 12 이상 기기에 설치되지 않습니다. 딥링크를 받는 Activity는 exported=\"true\"이므로 들어오는 파라미터를 외부 입력으로 보고 검증하며, 이는 6절의 컴포넌트 보안 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>// 알림 탭 → 장소 상세, 뒤로 가기는 메인 화면(manifest의 parentActivityName)으로\nval detailIntent = Intent(context, PlaceDetailActivity::class.java)\n    .putExtra(EXTRA_PLACE_ID, placeId)\nval pendingIntent = TaskStackBuilder.create(context).run {\n    addNextIntentWithParentStack(detailIntent)       // 부모 화면까지 합성 백 스택으로 쌓음\n    getPendingIntent(notificationId, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>화면 중복을 막으려고 singleTask를 쓰면 무엇이 문제입니까?<\/strong> 다시 시작할 때 그 위의 Activity가 모두 제거되어 사용자가 보던 화면이 사라지고, 백그라운드 태스크에 있던 인스턴스라면 그 태스크의 백 스택이 통째로 앞으로 와서 뒤로 가기 결과를 예측하기 어려워집니다. 중복 방지가 목적이면 singleTop이나 FLAG_ACTIVITY_CLEAR_TOP으로 충분한 경우가 많습니다.<\/li>\n<li><strong>알림 여러 개가 각자 다른 장소를 열어야 하면?<\/strong> PendingIntent는 extras만 다르면 같은 것으로 취급되므로 알림마다 requestCode나 data URI를 다르게 줍니다. 위 코드가 requestCode에 notificationId를 넣은 이유이고, 자세한 규칙은 이 절의 PendingIntent 문항에서 다룹니다.<\/li>\n<li><strong>앱이 실행 중일 때 딥링크가 오면 어떻게 처리합니까?<\/strong> standard launchMode와 Navigation이면 새 Activity가 딥링크를 처리하고, singleTop으로 재사용하는 단일 Activity 구조라면 onNewIntent에서 handleDeepLink를 부르거나 Navigation 3의 백 스택 리스트를 직접 바꿉니다. 로그인이 필요한 화면이면 조건부 내비게이션으로 로그인 화면을 거치게 합니다.<\/li>\n<\/ul>"},{"no":91,"t":"PendingIntent는 무엇이고, FLAG_IMMUTABLE과 FLAG_MUTABLE을 명시하게 된 이유는 무엇입니까?","a":"<p>PendingIntent는 내 앱이 만든 Intent와 실행할 동작을 시스템이 토큰으로 보관해 두고, 토큰을 받은 다른 앱이나 시스템이 나중에 내 앱의 권한과 신원으로 그 동작을 실행하게 하는 장치입니다. 알림 탭, AlarmManager, 위젯, 지오펜스와 위치 업데이트 콜백이 이 경로를 씁니다. 받은 쪽이 Intent의 빈 필드를 채울 수 있느냐가 가변성이고, targetSdk 31 이상 앱은 모든 PendingIntent에 FLAG_IMMUTABLE과 FLAG_MUTABLE 중 하나를 지정해야 합니다.<\/p>\n<p>가변 PendingIntent는 받은 앱이 fillIn 규칙에 따라 Intent의 비어 있는 필드를 채울 수 있습니다. 기본 Intent에 컴포넌트가 없으면 악성 앱이 대상을 바꿔 내 앱의 export되지 않은 컴포넌트에 접근할 수 있습니다. Android 11까지는 FLAG_IMMUTABLE을 주지 않으면 가변으로 간주되어 이런 실수가 쉬웠습니다. 그래서 targetSdk 31부터는 둘 중 하나를 지정하지 않으면 IllegalArgumentException이 나고 lint가 UnspecifiedImmutableFlag로 경고합니다. FLAG_IMMUTABLE은 API 23, FLAG_MUTABLE은 API 31에 추가되었습니다. targetSdk 34부터는 컴포넌트나 패키지가 없는 가변 PendingIntent를 만들면 예외가 납니다.<\/p>\n<p>기본은 FLAG_IMMUTABLE입니다. 가변이 필요한 경우는 시스템이 Intent를 채워야 할 때로, 공식 문서는 알림의 직접 답장, Android Auto의 CarAppExtender, 버블, PendingIntent로 받는 위치 업데이트, 반복 횟수를 EXTRA_ALARM_COUNT로 넣는 AlarmManager를 듭니다. 지오펜싱 문서도 Android 12 이상에서 지오펜스용 PendingIntent는 가변이어야 한다고 적습니다. 가변으로 만들 때는 명시적 Intent로 컴포넌트를 지정해 어떤 경로로 호출되든 내 컴포넌트로만 오게 합니다.<\/p>\n<p>두 PendingIntent가 같은지는 Intent.filterEquals가 보는 action, data, type, 컴포넌트, 카테고리와 requestCode로 판단하고 extras는 보지 않습니다. 알림 여러 개를 extras만 다르게 만들면 같은 토큰을 받아 모든 알림이 같은 장소를 엽니다. 여러 개가 동시에 살아 있어야 하면 requestCode를 알림 ID처럼 다르게 주거나 data URI에 ID를 넣습니다. FLAG_UPDATE_CURRENT는 기존 토큰을 유지하고 extras만 새 값으로 바꾸므로 이전 PendingIntent를 이미 받은 쪽도 새 extras로 실행하게 되고, FLAG_CANCEL_CURRENT는 기존 토큰을 취소하고 새로 만들어 새 데이터를 받은 쪽만 실행할 수 있게 합니다. 만든 앱은 FLAG_IMMUTABLE이어도 FLAG_UPDATE_CURRENT로 자기 PendingIntent를 갱신할 수 있습니다.<\/p>\n<pre class=\"kotlin\"><code>// 알림마다 다른 장소를 열어야 하므로 requestCode를 알림 ID로 구분\nfun placePendingIntent(context: Context, notificationId: Int, placeId: String): PendingIntent {\n    val intent = Intent(context, PlaceDetailActivity::class.java)   // 명시적 Intent\n        .putExtra(EXTRA_PLACE_ID, placeId)                          // extras는 동일성 판단에서 빠짐\n    return PendingIntent.getActivity(\n        context, notificationId, intent,\n        PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT,\n    )\n}<\/code><\/pre>","f":"<ul>\n<li><strong>사용자가 앱을 강제 종료하면 예약해 둔 PendingIntent는 어떻게 됩니까?<\/strong> Android 15에서는 강제 종료로 앱이 stopped 상태가 되면 모든 pending intent가 취소되고 위젯도 비활성화됩니다. 사용자 동작으로 stopped 상태를 벗어나면 ACTION_BOOT_COMPLETED가 전달되므로, 그 시점에 알람과 지오펜스를 다시 등록합니다.<\/li>\n<li><strong>PendingIntent로 백그라운드에서 Activity를 띄울 수 있습니까?<\/strong> targetSdk 35 앱은 PendingIntent를 만든 쪽이 기본으로 백그라운드 Activity 시작을 허용하지 않도록 바뀌었고, targetSdk 37에서는 이 제한이 IntentSender까지 넓어져 MODE_BACKGROUND_ACTIVITY_START_ALLOW_IF_VISIBLE 같은 세분화된 옵션으로 옮겨야 합니다. 사용자에게 알릴 일은 알림으로 처리합니다.<\/li>\n<li><strong>PendingIntent extras에 커스텀 Parcelable을 넣어도 됩니까?<\/strong> AlarmManager처럼 시스템이 extras를 고치는 경로에서는 시스템이 모르는 커스텀 Parcelable이 벗겨져 받는 쪽이 크래시 날 수 있다고 공식 문서가 경고합니다. ID 같은 기본 타입만 넣고 데이터는 받은 뒤 다시 읽습니다.<\/li>\n<\/ul>"},{"no":92,"t":"앱 프로세스는 어떻게 시작됩니까? Zygote, Application.onCreate, ContentProvider 초기화 순서와 콜드 스타트 영향은?","a":"<p>프로세스가 없는 상태에서 앱을 열면 시스템이 Zygote를 fork해 새 프로세스를 만들고, 그 프로세스가 Application 객체와 ContentProvider를 만든 뒤 Application.onCreate, 첫 Activity 순으로 진행합니다. 매니페스트에 등록된 ContentProvider의 onCreate는 Application.onCreate보다 먼저 메인 스레드에서 불리므로, 라이브러리가 자동 초기화용으로 넣은 Provider와 Application.onCreate의 초기화 코드가 모두 콜드 스타트의 첫 프레임을 늦춥니다.<\/p>\n<p>Zygote는 부팅 때 공통 프레임워크 코드와 리소스를 미리 로드해 둔 프로세스입니다. 새 앱 프로세스는 Zygote를 fork해 만들고, 자식은 Zygote의 메모리를 copy-on-write로 물려받아 읽기만 하는 동안 물리 페이지를 공유하다가 수정한 페이지만 복사합니다. 그래서 런타임 초기화와 공통 클래스 로딩을 건너뛰고 메모리도 아낍니다. 공식 문서의 콜드 스타트 단계는 시스템이 앱을 로드하고 빈 시작 창을 띄운 뒤 프로세스를 만들고, 앱 프로세스가 앱 객체 생성, 메인 스레드 시작, 메인 Activity 생성, UI 초기화, 첫 그리기를 하는 순서입니다. 첫 그리기가 끝나야 시스템이 시작 창을 앱 화면으로 바꿉니다.<\/p>\n<p>프로세스 안의 초기화 순서는 bindApplication 처리에서 정해집니다. 새 프로세스의 ActivityThread가 attachApplication으로 system_server에 자신을 알리면 system_server가 bindApplication을 보내고, 메인 스레드의 handleBindApplication이 Application 객체를 만들어 attachBaseContext를 부르고, installContentProviders로 모든 ContentProvider.onCreate를 부른 뒤 Application.onCreate를 실행합니다. Application.onCreate 레퍼런스는 이 메서드가 콘텐츠 프로바이더를 제외한 어떤 컴포넌트보다 먼저 불리고, 여기서 쓴 시간이 프로세스의 첫 Activity, 서비스, 리시버 시작에 그대로 더해지므로 지연 초기화를 쓰라고 적습니다. 화면을 열지 않는 시작도 같습니다. 브로드캐스트, 서비스, WorkManager 작업 때문에 프로세스가 뜰 때도 Provider와 Application.onCreate가 모두 실행되므로, 백그라운드 시작마다 화면용 초기화가 돌지 않게 합니다.<\/p>\n<p>라이브러리마다 자기 ContentProvider로 자동 초기화하면 Provider 생성 비용이 쌓이고 실행 순서도 정해지지 않습니다. App Startup(최신 안정 1.2.0)은 하나의 InitializationProvider 안에서 Initializer의 create()와 dependencies()로 초기화와 순서를 정의하게 합니다. 시작에 필요 없는 컴포넌트는 매니페스트에서 그 meta-data를 tools:node=\"remove\"로 빼고 AppInitializer.getInstance(context).initializeComponent()로 처음 쓸 때 초기화합니다. 병합된 매니페스트에서 provider 항목을 보면 시작 때 무엇이 실행되는지 확인할 수 있습니다. 분석, 광고, 원격 설정처럼 첫 화면에 필요 없는 SDK는 첫 프레임 뒤나 처음 쓰는 시점으로 미루고, Hilt라면 Lazy나 Provider로 주입해 생성을 늦춥니다. 측정과 기준은 6절의 앱 시작 시간 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>class AnalyticsInitializer : Initializer&lt;Analytics&gt; {\n    override fun create(context: Context): Analytics = Analytics.init(context)  // 메인 스레드에서 실행\n    override fun dependencies(): List&lt;Class&lt;out Initializer&lt;*&gt;&gt;&gt; =\n        listOf(WorkManagerInitializer::class.java)                               // 먼저 초기화할 것\n}\n\n// 시작 때 필요 없으면 manifest에서 meta-data를 tools:node=&quot;remove&quot;로 빼고 처음 쓸 때 초기화\nval analytics = AppInitializer.getInstance(context)\n    .initializeComponent(AnalyticsInitializer::class.java)<\/code><\/pre>","f":"<ul>\n<li><strong>초기화를 백그라운드 스레드로 넘기면 해결됩니까?<\/strong> 메인 스레드는 비지만 첫 화면이 그 결과를 기다리면 시작 시간은 그대로이고, 메인 스레드 전용 API를 쓰는 SDK라면 경쟁 조건이 생깁니다. 첫 화면에 필요한 것만 남기고 나머지는 처음 쓰는 시점으로 미루는 것이 먼저입니다.<\/li>\n<li><strong>프로세스가 왜 시작되었는지는 어떻게 압니까?<\/strong> Android 15의 ApplicationStartInfo가 프로세스 시작 이유, cold, warm, hot 시작 유형, 단계별 시각을 주고, Android 16에서 추가된 getStartComponent()로 시작을 일으킨 컴포넌트 유형도 알 수 있습니다.<\/li>\n<li><strong>ContentProvider.onCreate에서 DB를 열면 왜 안 됩니까?<\/strong> ContentProvider 레퍼런스는 이 메서드가 앱 시작 때 메인 스레드에서 불리므로 DB 열기, 업그레이드 같은 무거운 초기화를 실제로 쓰일 때까지 미루라고 적습니다. 디스크가 가득 찬 것 같은 DB 오류가 앱 시작 자체를 막는 일도 피할 수 있습니다.<\/li>\n<\/ul>"},{"no":93,"t":"시스템은 메모리가 부족할 때 어떤 프로세스부터 종료하고, 앱은 무엇을 해야 합니까?","a":"<p>시스템은 프로세스를 중요도로 나누고 덜 중요한 쪽부터 종료합니다. 공식 문서의 순서는 사용자가 지금 쓰는 포그라운드 프로세스, 보이지만 포커스가 없는 Activity나 포그라운드 서비스를 가진 가시 프로세스, startService로 시작한 서비스를 가진 서비스 프로세스, 지금 필요 없는 캐시 프로세스이고, 메모리가 부족하면 캐시 프로세스부터 종료합니다. 앱은 언제든 종료될 수 있다고 보고 상태를 저장하고, 백그라운드에서 메모리를 줄이며, 계속해야 하는 일은 시스템에 중요도를 알리는 API로 실행합니다.<\/p>\n<p>포그라운드 프로세스는 상호작용 중인 Activity, 실행 중인 onReceive, 콜백을 실행 중인 Service를 가진 프로세스로 최후에만 종료됩니다. 서비스 프로세스는 오래 실행되면(문서 예시 30분 이상) 캐시 목록으로 강등될 수 있습니다. 캐시 프로세스는 onStop된 Activity만 가진 프로세스로 언제든 종료될 수 있고, Android 13부터는 활성 상태가 되기 전까지 실행 시간을 거의 받지 못할 수 있습니다. 프로세스의 등급은 그 안에서 가장 중요한 컴포넌트로 정해지고, 다른 프로세스가 BIND_AUTO_CREATE로 바인딩하거나 ContentProvider를 쓰면 적어도 그 프로세스만큼 올라갑니다.<\/p>\n<p>회수는 단계적으로 일어납니다. 여유 메모리가 낮은 임계값 아래로 떨어지면 kswapd가 clean 페이지를 버리고 dirty 페이지를 zRAM으로 옮겨 압축합니다. 그래도 부족하면 onTrimMemory로 앱에 알리고, 그다음 low-memory killer가 점수가 높은 프로세스, 즉 백그라운드 앱부터 종료합니다. in-kernel LMK 드라이버는 커널 4.12에서 업스트림에서 빠졌고 지금은 사용자 공간의 lmkd가 이 일을 합니다. Android 10 이상은 커널 PSI로 메모리 압박을 감지하는 모드를 지원하고 ro.lmk.use_psi 기본값이 true입니다. PSI는 메모리 부족 때문에 작업이 지연된 시간을 재므로 오탐이 많던 vmpressure보다 정확합니다. 공식 문서는 제조사가 LMK 동작을 바꿀 수 있다고도 적습니다.<\/p>\n<p>앱이 할 일은 세 가지입니다. 첫째, 상태를 저장하고 복원합니다(이 절의 프로세스 종료 문항). 둘째, 사용자가 인지하는 작업은 포그라운드 서비스로, 나중에라도 끝내야 하는 작업은 WorkManager로 실행합니다. 셋째, 백그라운드에서 메모리를 줄입니다. API 34부터 앱은 TRIM_MEMORY_RUNNING 계열, MODERATE, COMPLETE 단계를 받지 않고 이 상수들과 onLowMemory는 API 35에서 deprecated되었습니다. 남은 TRIM_MEMORY_UI_HIDDEN에서 화면용 큰 할당을, TRIM_MEMORY_BACKGROUND에서 다시 만들기 쉬운 캐시를 놓습니다. 공식 문서도 캐시 상태에서 메모리를 적게 쓸수록 종료되지 않고 빨리 재개될 가능성이 커진다고 적습니다. 앱 힙 한도를 넘어 나는 OutOfMemoryError는 시스템 메모리 부족에 따른 종료와 다른 문제이며 6절의 OOM 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>// 최근 종료 사유 확인(API 30 이상)\nval am = context.getSystemService(ActivityManager::class.java)\nam.getHistoricalProcessExitReasons(context.packageName, 0, 5).forEach { info -&gt;\n    // REASON_LOW_MEMORY는 isLowMemoryKillReportSupported()가 true인 기기에서만 보고됨\n    Log.i(&quot;Exit&quot;, &quot;reason=${info.reason} importance=${info.importance} desc=${info.description}&quot;)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>우리 앱이 메모리 때문에 죽었는지는 어떻게 압니까?<\/strong> API 30에 추가된 ApplicationExitInfo로 종료 사유를 봅니다. REASON_LOW_MEMORY를 보고하지 않는 기기에서는 같은 상황이 REASON_SIGNALED와 SIGKILL로 나오므로 ActivityManager.isLowMemoryKillReportSupported()로 먼저 확인합니다.<\/li>\n<li><strong>Android 17에서는 메모리와 관련해 무엇이 바뀌었습니까?<\/strong> 기기 총 RAM을 기준으로 한 앱 메모리 한도가 생겼고, 여기에 걸리면 종료 사유가 REASON_OTHER, 설명에 MemoryLimiter:AnonSwap이 들어갑니다. ProfilingTrigger.TRIGGER_TYPE_ANOMALY로 한도에 닿았을 때 heap dump를 받을 수 있습니다.<\/li>\n<li><strong>메모리 사용량이 스토어 노출에도 영향을 줍니까?<\/strong> Android vitals의 core vitals에 memory usage와 bitmap memory usage가 들어갔고, 기준(예: RAM 8 GB 등급에서 포그라운드 2.25 GB, 백그라운드 1.50 GB)을 넘는 앱은 2027년 2월부터 스토어 노출에 영향을 받을 수 있습니다.<\/li>\n<\/ul>"},{"no":94,"t":"Intent나 Bundle에 큰 데이터를 넣으면 왜 TransactionTooLargeException이 납니까? Parcelable과 Serializable은 어떻게 다릅니까?","a":"<p>Intent와 Bundle은 Parcel로 직렬화되어 Binder 트랜잭션으로 시스템을 거쳐 전달되는데, Binder 트랜잭션 버퍼는 현재 1MB로 고정되어 있고 프로세스에서 진행 중인 모든 트랜잭션이 함께 쓰기 때문입니다. 그래서 데이터 하나가 1MB보다 작아도 동시에 오가는 트랜잭션이 많으면 실패합니다. 화면 사이에는 ID처럼 작은 값만 넘기고 데이터는 받는 쪽이 Repository에서 다시 읽으며, Intent와 Bundle에 넣는 객체는 Binder 전달용으로 만든 Parcelable로 구현합니다.<\/p>\n<p>같은 앱 안의 화면 이동이라도 startActivity는 시스템 서비스를 거치므로 extras 전체가 Binder로 넘어갑니다. onSaveInstanceState의 Bundle, Fragment arguments, SavedStateHandle과 rememberSaveable 값도 화면이 멈출 때 같은 경로로 시스템에 넘어갑니다. targetSdk 24 이상 앱은 이 경로에서 난 TransactionTooLargeException이 RuntimeException으로 다시 던져지므로, 저장된 상태에 목록 데이터를 넣으면 화면이 멈추는 시점에 크래시가 납니다. 스택 트레이스가 데이터를 넣은 코드가 아니라 저장 시점을 가리켜 원인을 찾기 어렵습니다. 저장된 상태에 넣을 크기 기준은 이 절의 구성 변경 문항에서 다뤘습니다. 버퍼는 libbinder가 1MB에서 두 페이지를 뺀 크기로 매핑하고, oneway 호출이 쓸 수 있는 공간은 커널이 그 절반으로 제한합니다.<\/p>\n<p>Serializable은 Java 표준 마커 인터페이스로, ObjectOutputStream이 리플렉션으로 필드와 클래스 정보를 읽어 씁니다. 구현은 쉽지만 Parcelable보다 느리고 결과가 크며, 클래스가 바뀌면 이전 데이터를 읽지 못하기 쉽습니다. 신뢰할 수 없는 입력을 역직렬화하면 원격 코드 실행으로 이어지는 취약점이 반복되어 외부 데이터에는 쓰지 않습니다. Parcelable은 writeToParcel과 CREATOR로 쓰고 읽는 순서를 직접 정해 리플렉션이 없고, Kotlin에서는 kotlin-parcelize 플러그인의 @Parcelize가 이 코드를 만들어 줍니다. 다만 Parcel 문서는 Parcel이 고성능 IPC 전송용이라 구현이 바뀌면 예전 데이터를 읽지 못할 수 있으므로 디스크나 네트워크 같은 영구 저장에 넣지 말라고 적습니다. 저장과 네트워크에는 kotlinx.serialization 같은 직렬화 형식을 씁니다(1절의 JSON 파싱 문항).<\/p>\n<p>읽는 쪽 API도 바뀌었습니다. Intent.getParcelableExtra(String)은 API 33에서 deprecated되었고 타입을 함께 넘기는 getParcelableExtra(String, Class)를 씁니다. minSdk가 그보다 낮으면 androidx.core의 IntentCompat.getParcelableExtra로 같은 코드를 씁니다.<\/p>\n<pre class=\"kotlin\"><code>@Parcelize\ndata class PlaceArgs(val placeId: String, val from: String) : Parcelable  // 목록이 아니라 키만 담는다\n\n// 보내는 쪽\ncontext.startActivity(\n    Intent(context, PlaceDetailActivity::class.java).putExtra(EXTRA_ARGS, PlaceArgs(place.id, &quot;search&quot;))\n)\n// 받는 쪽: getParcelableExtra(String)은 API 33에서 deprecated, 하위 버전까지는 IntentCompat\nval args = IntentCompat.getParcelableExtra(intent, EXTRA_ARGS, PlaceArgs::class.java)<\/code><\/pre>","f":"<ul>\n<li><strong>화면 사이에 큰 데이터를 꼭 넘겨야 하면 어떻게 합니까?<\/strong> 같은 프로세스라면 데이터는 Repository나 캐시에 두고 키만 넘기거나, 두 화면이 같은 부모 범위 ViewModel을 씁니다. 다른 앱에 넘길 때는 파일로 쓴 뒤 FileProvider의 content URI와 읽기 권한을 넘기고, Binder 서비스가 큰 데이터를 주고받아야 하면 파일 디스크립터나 SharedMemory를 씁니다.<\/li>\n<li><strong>어떤 값이 저장된 상태를 키우는지 어떻게 찾습니까?<\/strong> 디버그 빌드에서 저장되는 Bundle을 Parcel.obtain()으로 만든 Parcel에 writeBundle로 써 보고 dataSize()로 키별 크기를 기록합니다. Fragment arguments, 백 스택에 있는 Fragment의 저장 상태, SavedStateHandle, rememberSaveable 순으로 의심합니다.<\/li>\n<li><strong>AIDL 호출에서 이 예외가 나면 요청은 처리된 것입니까?<\/strong> 알 수 없습니다. API 문서는 요청을 보내다 실패했는지 응답을 돌려주다 실패했는지 구분할 수 없으므로 부분 실패로 가정하라고 적습니다. 다시 호출해도 안전하게 만들고 큰 결과는 나눠 받습니다.<\/li>\n<\/ul>"},{"no":95,"t":"메인 스레드의 Looper, Handler, MessageQueue는 어떻게 동작합니까?","a":"<p>메인 스레드는 Looper가 MessageQueue에서 메시지를 하나씩 꺼내 실행하는 루프입니다. Handler는 특정 Looper의 큐에 Message나 Runnable을 넣어 그 스레드에서 처리하게 하는 창구이고, 생명주기 콜백, 입력 이벤트, 화면 그리기, Dispatchers.Main의 코루틴 재개가 모두 이 Looper 위에서 한 번에 하나씩 실행됩니다. 그래서 메시지 하나가 오래 걸리면 뒤에 있는 입력과 프레임이 모두 밀립니다.<\/p>\n<p>스레드마다 Looper는 하나입니다. Looper.prepare()가 현재 스레드에 Looper와 MessageQueue를 만들고 loop()가 메시지를 꺼내 대상 Handler의 dispatchMessage를 부르며, 메인 스레드의 Looper는 프레임워크가 앱 프로세스를 시작할 때 준비해 둡니다. 큐는 메시지를 실행할 시각 순서로 내줍니다. post(r)는 지연이 0인 메시지이고, postDelayed와 sendMessageDelayed는 SystemClock.uptimeMillis()에 지연을 더한 시각에 실행됩니다. uptime은 기기가 deep sleep에 있는 동안 흐르지 않으므로 그 시간만큼 실행이 더 늦어집니다. 꺼낼 메시지가 없거나 다음 메시지 시각이 아직이면 Looper는 네이티브 Looper의 epoll_wait로 잠들고, 새 메시지가 들어오거나 입력 채널 같은 파일 디스크립터에 이벤트가 오면 깨어납니다(10절의 이벤트 루프 문항). 잠들기 직전에는 MessageQueue.IdleHandler의 queueIdle()이 불리므로 첫 화면 뒤로 미뤄도 되는 가벼운 작업을 둘 수 있는데, 이 작업도 메인 스레드에서 돌아 짧아야 합니다.<\/p>\n<p>화면 갱신이 일반 메시지에 밀리지 않게 하는 장치가 동기화 배리어입니다. View.invalidate()나 requestLayout()이 불리면 ViewRootImpl이 큐에 동기화 배리어를 넣고 Choreographer에 다음 프레임의 traversal 콜백을 등록합니다. 배리어가 있는 동안 일반 메시지는 멈추고 비동기로 표시된 메시지만 처리되는데, Choreographer가 VSYNC 신호를 받아 보내는 프레임 메시지가 비동기 메시지라서 다음 프레임이 큐에 쌓인 일반 메시지보다 먼저 실행됩니다. 배리어를 넣는 API는 프레임워크 내부용이고, 앱은 Message.setAsynchronous(API 22)나 Handler.createAsync(API 28)로 배리어를 받지 않는 메시지를 만들 수 있습니다.<\/p>\n<p>배리어도 이미 실행 중인 메시지는 끊지 못합니다. 메인 스레드에서 디스크 읽기나 큰 JSON 파싱이 100ms 걸리면 그동안 프레임 메시지가 실행되지 못해 여러 프레임을 놓치고, 입력 이벤트에 5초 안에 응답하지 못하면 input dispatching timed out ANR이 납니다. 그래서 메인 스레드에는 화면 갱신과 짧은 상태 변경만 두고 I/O와 계산은 다른 디스패처로 옮깁니다. targetSdk 37 앱은 lock-free MessageQueue 구현을 받으므로, MessageQueue의 private 필드를 리플렉션으로 읽던 모니터링 코드나 라이브러리는 깨질 수 있습니다.<\/p>\n<p>Handler 누수는 큐가 참조를 들고 있어서 생깁니다. 큐의 Message는 대상 Handler를, Runnable 람다와 내부 클래스 Handler는 바깥 Activity를 참조하므로, postDelayed로 넣은 작업이 남아 있는 동안 파괴된 Activity가 GC되지 않습니다. 화면이 멈출 때 removeCallbacks나 removeCallbacksAndMessages(null)로 지우고, 새 코드에서는 생명주기에 맞춰 취소되는 코루틴의 delay로 바꿉니다. Handler의 인자 없는 생성자는 Looper를 암묵적으로 골라 작업 유실이나 크래시를 낼 수 있다는 이유로 deprecated되었으므로 Looper를 명시합니다. 누수를 찾는 방법은 6절의 메모리 누수 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: binding 초기화는 생략\nclass MapActivity : AppCompatActivity() {\n    private val handler = Handler(Looper.getMainLooper())   // Looper를 명시한다\n    private val hideBanner = Runnable { binding.banner.isVisible = false }\n\n    override fun onStart() { super.onStart(); handler.postDelayed(hideBanner, 3_000) }\n    override fun onStop() { handler.removeCallbacks(hideBanner); super.onStop() }  // 큐에 남은 참조 제거\n}<\/code><\/pre>","f":"<ul>\n<li><strong>loop()는 무한 루프인데 왜 CPU를 다 쓰지 않고 ANR도 아닙니까?<\/strong> 할 일이 없으면 epoll_wait에서 잠들어 CPU를 쓰지 않습니다. ANR은 루프가 도는 것과 무관하게 입력 이벤트 처리 같은 특정 작업이 기준 시간 안에 끝나지 않을 때 납니다.<\/li>\n<li><strong>Dispatchers.Main과 Main.immediate는 Handler와 어떤 관계입니까?<\/strong> Dispatchers.Main은 메인 Looper의 큐에 작업을 넣으므로 이미 메인 스레드에서 불러도 큐 뒤로 갑니다. Main.immediate는 이미 메인 스레드에 있으면 재디스패치 없이 바로 실행하며, 자세한 비교는 2절의 Dispatchers 문항에서 다룹니다.<\/li>\n<li><strong>백그라운드 스레드에 Looper가 필요하면 어떻게 합니까?<\/strong> HandlerThread로 Looper를 가진 스레드를 만들어 Looper를 받는 콜백 API에 넘기고, 다 쓰면 quitSafely()로 끝냅니다. Looper가 필요 없는 일반 백그라운드 작업에는 코루틴 디스패처를 씁니다.<\/li>\n<\/ul>"},{"no":96,"t":"화면 한 프레임은 어떻게 그려지고, 프레임이 늦으면 무슨 일이 생깁니까?","a":"<p>디스플레이의 VSYNC 신호에 맞춰 메인 스레드의 Choreographer가 입력 처리, 애니메이션, 측정과 배치와 그리기 기록을 차례로 실행하고, RenderThread가 기록된 그리기 명령을 GPU로 보내 버퍼를 완성하면 SurfaceFlinger가 다른 창과 합성해 화면에 내보냅니다. 이 과정이 주사율이 정한 시간 안에 끝나지 않으면 그 VSYNC에는 새 프레임이 없어 이전 화면이 한 번 더 보이고, 사용자는 이것을 버벅임으로 느낍니다.<\/p>\n<p>VSYNC가 오면 Choreographer.doFrame이 입력, 애니메이션, inset 애니메이션, traversal, commit 순서로 콜백을 실행합니다(AOSP Choreographer 소스 기준). 입력이 먼저라서 이번 프레임에 터치 결과가 반영되고, 애니메이션이 값을 바꾼 뒤 traversal에서 ViewRootImpl이 measure, layout, draw를 진행합니다(프레임 메시지가 큐에서 우선되는 원리는 이 절의 Looper 문항). 하드웨어 가속에서 이 draw는 픽셀을 칠하지 않고 View마다 RenderNode에 그리기 명령을 기록하는 단계이고, 기록이 끝나면 RenderThread가 그 내용을 GPU 명령으로 바꿔 보내는 동안 메인 스레드는 다음 메시지를 처리합니다. 완성된 버퍼는 SurfaceFlinger가 상태 바, 내비게이션 바 같은 다른 창의 버퍼와 합성해 디스플레이로 보냅니다. 그래서 프레임 시간은 메인 스레드 구간과 RenderThread 구간을 함께 봐야 하고, 메인 스레드가 빨라도 큰 비트맵을 GPU에 올리거나 화면을 여러 겹 칠하면 RenderThread 구간이 길어집니다.<\/p>\n<p>프레임 예산은 1초를 주사율로 나눈 값으로 60Hz는 16.7ms, 90Hz는 11.1ms, 120Hz는 8.3ms입니다. 60Hz에서 맞던 작업도 120Hz 기기에서는 넘칠 수 있습니다. 마감을 놓치면 이전 프레임이 다시 보여 스크롤과 애니메이션이 끊기고, 터치에 대한 화면 반응도 그만큼 늦어집니다. 여러 프레임을 연달아 놓치면 멈춘 것처럼 보이며, Android vitals는 700ms를 넘는 프레임을 frozen frame으로 셉니다. 측정 방법과 vitals 기준은 6절의 화면 버벅임 문항에서 다룹니다.<\/p>\n<p>View 시스템에서 흔한 비용은 레이아웃 중첩과 overdraw입니다. 측정과 배치는 보통 한 번에 끝나지만 RelativeLayout은 자식 위치를 정하려고 측정과 배치를 두 번 하고, 가로 LinearLayout도 두 번 돌 수 있습니다. 공식 문서는 이를 double taxation이라 부르며 계층이 깊을수록 비용이 커진다고 적고, 중첩을 줄이는 ConstraintLayout을 권합니다. overdraw는 한 프레임에 같은 픽셀을 여러 번 칠하는 것으로, 창 배경, 루트 배경, 카드 배경이 겹치면 보이지 않는 칠하기에 GPU 시간을 씁니다. 개발자 옵션의 Debug GPU overdraw로 겹친 영역을 찾고 가려지는 배경을 지웁니다.<\/p>\n<p>Compose도 같은 파이프라인 위에서 돕니다. 리컴포지션은 Choreographer의 프레임 콜백에 맞춰 실행되고, 레이아웃과 드로잉 단계는 AndroidComposeView가 View 시스템의 측정, 배치, 그리기 안에서 수행해 같은 RenderNode와 RenderThread 경로로 그려집니다. 컴포지션, 레이아웃, 드로잉 세 단계가 같은 프레임 예산을 나눠 쓰는 셈입니다. 자식을 한 번만 측정하는 Compose 규칙 덕분에 중첩으로 측정이 불어나는 문제는 줄지만, 넓은 범위의 리컴포지션은 그 자체로 예산을 씁니다(3절의 Compose 단계 문항).<\/p>","f":"<ul>\n<li><strong>120Hz 기기에서만 버벅이면 무엇을 봅니까?<\/strong> 예산이 8.3ms로 줄어 60Hz에서 남던 여유가 사라진 경우입니다. 트레이스에서 메인 스레드와 RenderThread 중 어느 쪽이 넘는지 보고, 프레임마다 반복되는 할당, 측정, 큰 비트맵 처리를 줄입니다.<\/li>\n<li><strong>invalidate를 한 프레임에 여러 번 부르면 여러 번 그립니까?<\/strong> 아닙니다. ViewRootImpl은 traversal이 이미 예약되어 있으면 다시 예약하지 않으므로 다음 VSYNC에서 측정, 배치, 그리기가 한 번 돕니다. requestLayout은 그리기만 다시 하는 invalidate보다 측정과 배치까지 다시 해 비용이 크므로 크기나 위치가 바뀔 때만 부릅니다.<\/li>\n<li><strong>SurfaceView로 그리는 지도도 이 예산을 따릅니까?<\/strong> SurfaceView는 별도 Surface를 SurfaceFlinger가 직접 합성하므로 View 계층의 그리기와 분리되지만, 그 Surface에 그리는 렌더링 스레드도 VSYNC 주기 안에 프레임을 내야 합니다. 둘의 비교는 7절의 SurfaceView와 TextureView 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":97,"t":"Service에는 어떤 종류가 있고, Android 14 이후 포그라운드 서비스 요구 사항은 무엇입니까?","a":"<p>Service는 화면 없이 작업을 이어 가는 컴포넌트로, startService로 시작해 스스로 멈출 때까지 도는 started 서비스, bindService로 연결한 클라이언트가 있는 동안 살아 있는 bound 서비스, 알림으로 실행 중임을 알리는 포그라운드 서비스가 있습니다. targetSdk 34 앱의 포그라운드 서비스는 manifest에 foregroundServiceType을 하나 이상 선언하고 FOREGROUND_SERVICE_LOCATION 같은 타입별 권한을 가져야 하며, 타입마다 요구되는 런타임 권한 같은 전제 조건을 startForeground() 시점에 검사받습니다. 포그라운드 서비스는 사용자가 알고 있어야 하는 작업에만 쓰고, 나머지는 WorkManager로 넘기는 것이 기준입니다.<\/p>\n<p>started 서비스는 onStartCommand가 불린 뒤 stopSelf나 stopService 전까지 돌고, 반환값(START_STICKY 등)으로 프로세스가 죽은 뒤 다시 만들지를 정합니다. bound 서비스는 onBind가 돌려준 IBinder로 클라이언트가 메서드를 호출하고, startService로 시작하지 않았다면 마지막 클라이언트가 unbind할 때 파괴됩니다. 같은 프로세스면 Binder 객체를 일반 객체처럼 호출하고, 다른 프로세스면 AIDL이나 Messenger로 IPC를 합니다. Android 8.0부터 targetSdk 26 이상 앱은 백그라운드 상태에서 백그라운드 서비스를 시작할 수 없어 startForegroundService()가 생겼고, 이렇게 시작한 서비스가 5초 안에 startForeground()를 부르지 않으면 시스템이 서비스를 멈추고 ANR을 냅니다.<\/p>\n<p>Android 14 요구 사항은 세 가지입니다. 첫째, 타입이 없으면 startForeground()에서 MissingForegroundServiceTypeException이 나고, manifest에 없는 타입을 넘기면 IllegalArgumentException이 납니다. 타입은 location, mediaPlayback, dataSync, connectedDevice, shortService처럼 용도별로 나뉘고 Android 15에서 mediaProcessing이 추가되었습니다. 둘째, 타입별 FOREGROUND_SERVICE_ 권한은 normal 권한이라 설치할 때 허용되지만 선언하지 않으면 SecurityException이 납니다. 셋째, location 타입이라면 위치 권한처럼 타입별 전제 조건을 startForeground() 때 확인하므로 런타임 권한 요청과 허용이 서비스 시작보
