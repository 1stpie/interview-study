tlin\"><code>android {\n    androidResources {\n        localeFilters += listOf(&quot;ko&quot;, &quot;en&quot;)             // 지원 언어 외 리소스 제외\n    }\n    buildTypes {\n        release {\n            isMinifyEnabled = true                      // R8 축소, 최적화, 난독화\n            isShrinkResources = true                    // 코드 축소 뒤 참조가 사라진 리소스 제거\n            ndk { debugSymbolLevel = &quot;SYMBOL_TABLE&quot; }   // 제거한 심볼은 번들에 따로 넣는다\n        }\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>App Bundle을 쓰면 APK 크기 분석은 의미가 없습니까?<\/strong> 아닙니다. 사용자가 받는 것은 기기별 split APK이므로 bundletool로 대표 기기 구성의 APK 세트를 만들어 크기를 재고 이전 버전과 비교합니다.<\/li>\n<li><strong>앱 크기를 줄이면 무엇이 좋아집니까?<\/strong> 다운로드와 업데이트 부담이 줄고 저장 공간이 부족한 기기에서 설치와 업데이트가 덜 실패합니다. R8로 코드가 줄면 공식 문서가 적듯 메타데이터와 런타임 메모리도 함께 줄어 시작 시간에도 도움이 됩니다.<\/li>\n<li><strong>동적 기능 모듈과 멀티 모듈은 무엇이 다릅니까?<\/strong> 멀티 모듈은 빌드와 코드 구조의 분리이고 결과는 하나의 앱으로 설치됩니다. 동적 기능 모듈은 배포 단위까지 나눠 설치 시점을 바꾸는 것이라 기능 모듈이 base를 의존하고 base는 기능 코드를 직접 참조하지 못합니다(4절의 멀티 모듈 문항).<\/li>\n<\/ul>"},{"no":120,"t":"기기에 토큰 같은 비밀은 어떻게 보호합니까? EncryptedSharedPreferences는 지금도 권장됩니까?","a":"<p>권장되지 않습니다. androidx.security:security-crypto는 1.1.0-alpha07(2025-04-09)에서 모든 API를 deprecated로 바꿨고 EncryptedSharedPreferences도 1.1.0에서 deprecated되었으며, 대안으로 플랫폼 API와 Android Keystore 직접 사용을 적습니다. 지금은 Keystore 안에서 만든 키로 토큰을 암호화해 저장하거나 DataStore 1.3.0에 추가된 Tink 기반 datastore-tink를 쓰고, 그 파일은 백업에서 빼며, 서버용 비밀은 애초에 앱에 넣지 않습니다.<\/p>\n<p>Android Keystore의 키 자료는 앱 프로세스로 들어오지 않고 TEE나 Secure Element 같은 보안 하드웨어에 묶일 수 있어서, 앱은 키를 꺼내지 못하고 암호화와 복호화 연산만 요청합니다. 키 원본이 디스크나 메모리 덤프로 새지 않는다는 뜻입니다. 실제 보안 수준은 KeyInfo의 SecurityLevelEnum이 TRUSTED_ENVIRONMENT인지 STRONGBOX인지로 확인합니다. StrongBox는 API 28 이상 기기에 있을 수 있고 자체 CPU, 보안 저장소, 진성 난수 생성기를 갖췄지만, 공식 문서는 느리고 동시 작업이 적어 대부분의 앱에는 필요 없다고 적습니다. 쓴다면 FEATURE_STRONGBOX_KEYSTORE로 확인하고 setIsStrongBoxBacked(true)로 요청하되, StrongBoxUnavailableException이 나면 일반 Keystore 키로 물러섭니다. 결제 승인 같은 고위험 동작은 키 사용에 사용자 인증을 요구하도록 묶을 수 있습니다.<\/p>\n<p>토큰은 AES-GCM 키로 암호화하고 IV와 암호문을 함께 DataStore나 파일에 저장합니다. Keystore 키는 다른 기기로 옮겨지지 않으므로 암호화한 파일이 복원되면 복호화할 수 없습니다. 공식 문서도 EncryptedSharedPreferences 파일을 Auto Backup에서 빼라고 경고합니다. targetSdk 31 이상 앱이 Android 12 이상 기기에서 쓰는 dataExtractionRules에는 cloud-backup과 device-transfer를 따로 적어 둘 다에서 빼고, Android 11 이하 기기용 fullBackupContent 규칙도 함께 둡니다. 일부 제조사 기기에서는 allowBackup=\"false\"로도 기기 간 전송이 막히지 않는다고 문서에 적혀 있으므로 제외 규칙을 명시하는 편이 확실합니다. 복원 뒤 복호화에 실패하면 저장 값을 지우고 다시 로그인하게 하는 경로도 둡니다. 이미 EncryptedSharedPreferences를 쓰고 있다면 deprecated가 곧 삭제는 아니므로 급히 걷어 내기보다, 한 번 읽어 새 저장소로 옮기고 이전 파일을 지우는 마이그레이션을 한 버전에 넣습니다. Android 17은 targetSdk 37 비시스템 앱의 Keystore 키 수를 앱당 50,000개로 제한하므로 항목마다 키를 만들지 않고 용도별 키 몇 개를 씁니다.<\/p>\n<p>앱에 넣은 문자열은 디컴파일, 메모리 관찰, 트래픽 가로채기로 결국 꺼낼 수 있습니다. 결제 비밀 키나 서드파티 서버용 키는 서버에만 두고 앱은 우리 서버를 거쳐 호출하며, BuildConfig나 리소스, NDK 코드에 넣어도 빌드 결과물에 들어 있기는 마찬가지입니다. 지도 SDK 키처럼 앱에 넣을 수밖에 없는 키는 노출을 전제로 서비스 콘솔에서 패키지 이름과 서명 인증서 지문으로 제한하고 사용량 한도를 겁니다. Play App Signing을 쓰면 등록할 지문은 업로드 키가 아니라 Play가 관리하는 앱 서명 키의 것입니다. 위협 모델은 기기 상태로 나눕니다. 정상 기기에서는 다른 앱이 내 앱 저장소를 읽을 수 없고 Keystore가 키 유출을 막습니다. 루팅된 기기에서는 공격자가 앱 프로세스를 후킹해 그 키로 복호화를 요청할 수 있으므로 키를 꺼낼 수 없다는 것까지만 믿고, 짧은 액세스 토큰 수명, 리프레시 토큰 회전과 재사용 감지(9절의 모바일 인증 문항), 서버의 Play Integrity 판정(이 절의 앱 변조 문항)으로 피해를 줄입니다.<\/p>\n<pre class=\"kotlin\"><code>// Keystore 안에서 만든 AES 키로 토큰을 암호화한다. 키 원본은 앱 프로세스로 나오지 않는다\nfun secretKey(alias: String = &quot;auth_tokens&quot;): SecretKey {\n    val ks = KeyStore.getInstance(&quot;AndroidKeyStore&quot;).apply { load(null) }\n    (ks.getKey(alias, null) as? SecretKey)?.let { return it }\n    val spec = KeyGenParameterSpec.Builder(alias, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n        .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n        .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n        .build()\n    return KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, &quot;AndroidKeyStore&quot;)\n        .apply { init(spec) }.generateKey()\n}\nfun encrypt(plain: ByteArray): Pair&lt;ByteArray, ByteArray&gt; {\n    val cipher = Cipher.getInstance(&quot;AES/GCM/NoPadding&quot;).apply { init(Cipher.ENCRYPT_MODE, secretKey()) }\n    return cipher.iv to cipher.doFinal(plain)   // IV는 시스템이 만든 값을 암호문과 함께 저장\n}<\/code><\/pre>","f":"<ul>\n<li><strong>앱 전용 저장소는 다른 앱이 못 읽는데 왜 또 암호화합니까?<\/strong> 정상 기기에서는 다른 앱이 못 읽지만 루팅 기기나 백업으로 빠져나간 파일에서는 평문이 그대로 드러납니다. 암호화해 두면 파일만 가져가서는 쓸 수 없고, 키가 Keystore에 묶여 있어 다른 기기에서는 복호화할 수 없습니다.<\/li>\n<li><strong>datastore-tink와 Keystore 직접 사용은 어떻게 고릅니까?<\/strong> 여러 값을 묶어 저장하면서 암호 형식과 프리미티브 선택을 Tink에 맡기려면 datastore-tink, 토큰 몇 개라면 Keystore AES-GCM으로 충분합니다. 어느 쪽이든 키는 Keystore에 두고 백업 제외 규칙을 함께 둡니다.<\/li>\n<li><strong>Credential Manager를 쓰면 토큰 저장 문제가 사라집니까?<\/strong> 아닙니다. Credential Manager는 passkey, Sign in with Google, 비밀번호 같은 로그인 수단을 다루는 권장 API이고, 로그인 뒤 받은 우리 서비스의 토큰을 저장하는 문제는 그대로 남습니다. passkey를 쓰면 앱이나 비밀번호 관리자가 비밀번호를 다룰 일이 줄어듭니다.<\/li>\n<\/ul>"},{"no":121,"t":"Network Security Config와 인증서 고정으로 통신 보안을 어떻게 강화하고, 운영 위험은 무엇입니까?","a":"<p>Network Security Config는 코드 수정 없이 XML로 cleartext 허용 여부, 믿을 CA, 도메인별 예외, 디버그 빌드 전용 CA, 인증서 고정, Certificate Transparency를 선언하는 방법입니다. 기본은 cleartext를 막고 시스템 CA만 믿는 설정을 유지하고, 디버깅 프록시는 debug-overrides로만 허용합니다. 인증서 고정은 공식 문서가 Android 앱에 권장하지 않으므로, 한다면 예비 키를 포함한 여러 핀과 짧은 만료를 두고 키 교체 절차부터 만듭니다.<\/p>\n<p>cleartext는 targetSdk 28 이상 앱에서 기본으로 막혀 있고, 꼭 필요한 도메인만 domain-config의 cleartextTrafficPermitted로 엽니다. Android 17 문서는 manifest의 usesCleartextTraffic을 앞으로 deprecated할 계획이라며 Network Security Config로 옮기라고 적습니다. 모든 앱은 시스템 CA를 믿고 사용자가 설치한 CA는 targetSdk 23 이하 앱만 기본으로 믿으므로, 사내 프록시나 디버깅 도구의 CA는 debug-overrides의 trust-anchors에 둡니다. debug-overrides는 android:debuggable이 true일 때만 적용되고 스토어는 debuggable 앱을 받지 않으므로, 조건문 코드로 검증을 끄는 방식보다 안전합니다. targetSdk 35 앱은 TLS 1.0과 1.1을 쓸 수 없습니다. 설정은 상속되어 domain-config에 없는 값은 상위 domain-config나 base-config에서 가져옵니다.<\/p>\n<p>Certificate Transparency는 CA가 발급한 인증서가 공개 로그에 기록됐는지 확인해 잘못 발급된 인증서를 걸러 냅니다. Android 16(API 36)부터 지원하는데 Android 16에서는 기본으로 꺼져 있어 certificateTransparency enabled=\"true\"로 켜고, Android 17에서는 targetSdk 37 앱에 기본으로 켜지며, Android 15 이하는 지원하지 않습니다. 사용자 CA나 앱에 넣은 인증서 같은 사용자 지정 trust anchor를 쓰는 연결은 공개 로그로 검증할 수 없어 기본으로 CT를 하지 않으므로, 사내 인증서를 쓰는 도메인은 이 점을 감안합니다. 다만 enabled=\"true\"를 명시하면 이런 연결에도 검증을 강제하므로, 아래 예제처럼 base-config에서 켜면 Android 16 이상 기기의 디버그 빌드에서 debug-overrides로 믿게 한 디버깅 프록시를 거치는 연결이 실패할 수 있습니다.<\/p>\n<p>인증서 고정은 인증서 체인에 미리 넣어 둔 공개키(SubjectPublicKeyInfo 해시) 중 하나가 있어야만 연결을 허용합니다. 사용자 CA나 잘못 발급된 인증서를 이용한 중간자를 한 층 더 막지만 운영 위험이 큽니다. 서버 키를 정기 교체하거나 CA를 바꾸거나 키 유출로 급히 바꿀 때 새 키를 모르는 구버전 앱은 모두 통신이 끊기고, 업데이트를 받기 전까지 앱이 사실상 동작하지 않습니다. 그래서 공식 문서는 고정을 권장하지 않고, 꼭 해야 한다면 직접 통제하는 키를 포함한 여러 예비 핀과 짧은 만료를 두라고 합니다. pin-set의 expiration이 지나면 고정을 하지 않으므로 업데이트하지 않은 앱의 장애는 막지만, 그 뒤로는 고정이 우회될 수 있다는 점도 문서에 적혀 있습니다. 잎 인증서는 자주 바뀌므로 고정 대상은 서버 쪽이 통제하는 키나 중간 CA 키로 하고, 예비 키를 넣은 앱 버전이 충분히 퍼진 뒤에 서버 키를 바꾸는 교체 순서와 고정 실패로 난 TLS 오류를 non-fatal로 집계하는 모니터링을 먼저 갖춥니다. 고정도 후킹으로 우회될 수 있으므로 루팅 기기에 대한 방어가 아니라 네트워크 경로 공격에 대한 한 층으로 봅니다. 설정 파일은 manifest의 android:networkSecurityConfig로 연결합니다.<\/p>\n<pre class=\"xml\"><code>&lt;network-security-config&gt;\n    &lt;base-config cleartextTrafficPermitted=&quot;false&quot;&gt;\n        &lt;certificateTransparency enabled=&quot;true&quot; /&gt;   &lt;!-- Android 16은 opt-in, 17은 targetSdk 37에서 기본 --&gt;\n    &lt;/base-config&gt;\n    &lt;domain-config&gt;\n        &lt;domain includeSubdomains=&quot;true&quot;&gt;api.example.com&lt;/domain&gt;\n        &lt;pin-set expiration=&quot;2027-06-30&quot;&gt;\n            &lt;pin digest=&quot;SHA-256&quot;&gt;현재 키의 SPKI SHA-256 해시(Base64)&lt;/pin&gt;\n            &lt;pin digest=&quot;SHA-256&quot;&gt;예비 키의 SPKI SHA-256 해시(Base64)&lt;/pin&gt;\n        &lt;/pin-set&gt;\n    &lt;/domain-config&gt;\n    &lt;debug-overrides&gt;\n        &lt;trust-anchors&gt;&lt;certificates src=&quot;user&quot; /&gt;&lt;/trust-anchors&gt;\n    &lt;/debug-overrides&gt;\n&lt;/network-security-config&gt;<\/code><\/pre>","f":"<ul>\n<li><strong>고정한 키가 유출되거나 CA가 갑자기 바뀌면 어떻게 대응합니까?<\/strong> 예비 핀이 있으면 서버를 예비 키로 바꾸고 다음 앱 버전에서 새 예비 키를 더합니다. 예비 핀이 없으면 구버전 앱은 업데이트 전까지 복구할 길이 없고, 강제 업데이트 안내마저 그 통신에 기대고 있다면 보낼 수도 없습니다. 공식 문서가 직접 통제하는 키를 포함한 여러 예비 핀을 요구하는 이유입니다.<\/li>\n<li><strong>OkHttp의 CertificatePinner와 Network Security Config 중 무엇을 씁니까?<\/strong> Network Security Config는 선언으로 앱 전체 연결에 적용되고 만료를 지원하며, OkHttp도 플랫폼 TrustManager를 거치므로 그 설정을 따릅니다. CertificatePinner는 클라이언트마다 코드로 설정해 핀을 동적으로 바꾸는 구조를 만들 수 있지만, 그 핀을 받아 오는 통신의 신뢰를 따로 설계해야 합니다. 어느 쪽이든 OkHttp 문서의 경고처럼 서버의 TLS 관리자와 합의한 뒤에만 고정합니다.<\/li>\n<li><strong>고정하지 않으면 중간자 공격에 무방비입니까?<\/strong> 아닙니다. 시스템 CA만 믿는 기본 설정에서 중간자는 사용자 CA 설치나 CA의 잘못된 발급이 있어야 성공하고, targetSdk 24 이상 앱은 사용자 CA를 기본으로 믿지 않으며, 잘못된 발급은 CT가 켜진 Android 16 이상 기기에서 거릅니다(9절의 인증서 검증 문항). CT 검증이 없는 Android 15 이하 기기도 있으므로, 남은 위험이 큰 기능은 고정보다 서버 측 이상 탐지 같은 다른 층을 함께 검토합니다.<\/li>\n<\/ul>"},{"no":122,"t":"앱 변조와 리버스 엔지니어링에는 어떻게 대응합니까?","a":"<p>APK는 디컴파일과 동적 후킹으로 결국 분석되므로 클라이언트는 신뢰할 수 없다는 전제에서 시작합니다. 난독화는 분석 비용을 올릴 뿐이라, 결제 검증, 권한, 가격, 포인트처럼 조작되면 안 되는 판단은 서버가 하고, 앱과 기기가 정상인지는 Play Integrity API의 판정을 서버에서 확인해 위험도에 따라 단계적으로 대응합니다. 루팅 탐지와 앱 안의 서명 검사는 우회되는 보조 신호로만 씁니다.<\/p>\n<p>R8은 이름을 짧게 바꾸고 쓰지 않는 코드를 지워 정적 분석을 번거롭게 하지만 주목적은 크기와 성능입니다(이 절의 R8 문항). 상용 도구로 문자열과 제어 흐름을 더 숨겨도 Frida 같은 동적 후킹과 디버거로 실행 중 값을 보면 우회됩니다. 그래서 난독화는 시간을 버는 층으로 보고, 앱에 비밀을 넣지 않는 설계(이 절의 토큰 보호 문항)와 서버 판단을 기본으로 둡니다.<\/p>\n<p>Play Integrity API는 SafetyNet Attestation을 대체했고(SafetyNet은 2025-01-31부터 모든 호출이 실패), 기본 판정으로 accountDetails, appIntegrity, deviceIntegrity를 줍니다. 요청은 두 가지입니다. standard 요청은 몇 초 걸리는 준비를 미리 해 두면 평균 수백 ms에 응답해 사용자 동작이나 서버 요청마다 확인할 수 있고, 요청 내용의 다이제스트를 requestHash에 넣어 판정을 그 요청에 묶으며, 리플레이 방어는 Google Play가 맡습니다. classic 요청은 몇 초가 걸리고 데이터와 배터리를 더 쓰므로 가장 민감한 동작에 가끔 쓰고, 서버가 만든 nonce로 리플레이를 막습니다. 토큰은 우리 서버로 보내 서버가 Google 서버로 복호화하고 검증합니다. 앱 안에서 판정하면 그 판정 코드가 후킹되기 때문입니다. 서버는 requestHash나 nonce가 맞는지, appRecognitionVerdict가 Play가 아는 변조되지 않은 서명이라는 PLAY_RECOGNIZED인지, 필요하면 appLicensingVerdict가 LICENSED인지 먼저 보고 그다음 기기 판정을 봅니다. 기기 라벨은 MEETS_BASIC_INTEGRITY, MEETS_DEVICE_INTEGRITY, MEETS_STRONG_INTEGRITY 순으로 신뢰가 높고, STRONG은 Android 13 이상에서 하드웨어 기반 신호와 최근 보안 패치를 요구합니다. 공식 문서는 판정을 캐시해 재사용하지 말고(좋은 기기의 판정을 다른 환경에서 재사용하는 공격 때문), 높은 등급만 허용하기보다 등급별로 대응하며, 서버가 허용과 거부 두 가지만 돌려주지 말라고 권합니다.<\/p>\n<p>루팅 탐지는 su 바이너리나 테스트 키 빌드 같은 흔적을 보는 방식이라 은닉 도구로 쉽게 우회되고, 커스텀 ROM을 쓰는 정상 사용자를 막는 오탐도 냅니다. 앱이 실행 중 자기 서명 인증서를 비교하는 검사도 그 비교 코드를 패치하면 사라지므로, 재패키징 판단은 서버가 appIntegrity 판정으로 합니다. 대응은 위험도에 맞춥니다. 경로 탐색이나 장소 검색은 판정과 관계없이 쓰게 두고, 포인트 적립, 결제, 계정 변경처럼 악용 가치가 큰 서버 요청에서만 판정을 요구하며, 낮은 등급이면 차단보다 추가 인증이나 한도 축소로 응답합니다. 판정을 우회한 요청도 걸러지도록 서버의 사용량 한도와 이상 패턴 탐지를 함께 두고, Play Integrity API 장애 때 서버가 어떻게 동작할지도 미리 정합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: standard 요청은 미리 준비하고, 민감한 요청마다 그 요청 내용에 묶은 토큰을 받는다\nclass IntegrityTokenSource(context: Context, cloudProjectNumber: Long) {\n    private val provider = CompletableDeferred&lt;StandardIntegrityTokenProvider&gt;()\n    init {\n        IntegrityManagerFactory.createStandard(context).prepareIntegrityToken(\n            PrepareIntegrityTokenRequest.builder().setCloudProjectNumber(cloudProjectNumber).build()\n        ).addOnSuccessListener { provider.complete(it) }        // 실패 처리와 재준비는 생략\n    }\n    suspend fun tokenFor(requestBody: ByteArray): String {\n        val request = StandardIntegrityTokenRequest.builder()\n            .setRequestHash(sha256Base64(requestBody)).build()  // 요청 내용의 다이제스트\n        return provider.await().request(request).await().token() // 서버가 Google 서버로 복호화하고 검증\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Integrity 토큰을 받은 뒤 캐시해 두고 여러 요청에 쓰면 안 됩니까?<\/strong> 안 됩니다. 공식 문서가 판정 캐시를 프록시 공격 위험으로 들어 금지하고, standard 요청은 지연이 짧아 필요한 요청마다 받으면 됩니다. requestHash에 요청 내용을 넣어야 다른 요청에 옮겨 쓸 수 없습니다.<\/li>\n<li><strong>루팅 기기 사용자를 모두 막아야 합니까?<\/strong> 기능의 위험도에 따라 다릅니다. 길 안내처럼 악용 가치가 낮은 기능까지 막으면 정상 사용자만 잃습니다. 금전 가치가 있는 요청에서만 판정을 요구하고, 등급이 낮으면 추가 인증이나 한도로 대응합니다.<\/li>\n<li><strong>requestHash나 nonce에 개인정보를 넣어도 됩니까?<\/strong> 넣지 않습니다. 공식 문서는 이 필드가 앱과 Google에 평문으로 보인다며 암호화하거나 해시해서 넘기라고 적습니다.<\/li>\n<\/ul>"},{"no":123,"t":"Android 컴포넌트와 WebView에서 생기는 보안 문제는 무엇이고 어떻게 막습니까?","a":"<p>컴포넌트 보안의 핵심은 외부에서 부를 수 있는 진입점을 최소로 두고, 그 진입점으로 들어온 Intent, 딥링크, PendingIntent를 모두 신뢰할 수 없는 입력으로 다루는 것입니다. WebView는 JavaScript와 네이티브를 잇는 브리지가 가장 큰 공격 면이므로 신뢰하는 origin의 콘텐츠만 싣고, addJavascriptInterface 대신 origin을 제한하는 addWebMessageListener를 쓰고, file:// 접근을 끕니다. 로그와 크래시 보고에는 토큰, 위치, 개인정보를 남기지 않습니다.<\/p>\n<p>targetSdk 31 이상 앱은 intent filter가 있는 Activity, Service, Receiver에 android:exported를 명시해야 하므로, 외부에서 열 필요가 없는 컴포넌트는 false로 두고 열어야 하는 것은 입력을 검증하거나 signature 수준 권한으로 보호합니다. targetSdk 34부터 암시적 intent는 exported 컴포넌트에만 전달되고, 런타임에 등록하는 리시버는 RECEIVER_EXPORTED나 RECEIVER_NOT_EXPORTED를 지정해야 합니다. 자주 나는 취약점은 intent redirection입니다. exported Activity가 extras로 받은 Intent를 그대로 startActivity에 넘기면, 공격자가 그 Activity를 거쳐 내 앱의 export되지 않은 컴포넌트를 열거나 URI 권한을 얻습니다. 받은 Intent를 다시 실행하지 않는 것이 원칙이고, 꼭 필요하면 대상 컴포넌트가 내 앱의 허용 목록에 있는지 확인하고 URI 권한 플래그를 지운 뒤 실행합니다. 이런 실행은 Android 12(API 31)부터 있는 StrictMode의 detectUnsafeIntentLaunch()로 찾을 수 있고, Android 16은 intent redirection에 대한 기본 보호를 적용하며 Android 16 SDK로 컴파일한 앱은 Intent.removeLaunchSecurityProtection()으로 해제할 수 있습니다. 받는 쪽 앱이 manifest의 android:intentMatchingFlags=\"enforceIntentFilter\"로 opt-in하면 명시적 intent도 intent filter와 맞아야 받습니다. PendingIntent는 기본을 FLAG_IMMUTABLE로 두고 가변이 필요할 때도 명시적 Intent로 만듭니다(5절의 PendingIntent 문항). 딥링크 파라미터도 외부 입력입니다. 커스텀 스킴은 다른 앱도 같은 스킴을 등록할 수 있으므로 소유를 검증하는 App Links를 쓰고, 경로와 ID 형식을 허용 목록으로 검사하며, 파라미터로 온 URL을 WebView에 그대로 싣거나 파일 경로에 쓰지 않습니다. 결제나 계정 변경 화면은 딥링크로 바로 열려도 로그인과 재인증을 거치게 하고, 백 스택 구성은 5절의 태스크와 백 스택 문항을 따릅니다.<\/p>\n<p>WebView의 addJavascriptInterface는 넣은 객체를 iframe을 포함한 모든 프레임에 노출하고 호출한 프레임의 origin을 확인할 방법이 없어서, 신뢰하는 페이지에 악성 프레임이 끼어들면 그대로 네이티브 메서드를 부릅니다. androidx.webkit의 WebViewCompat.addWebMessageListener는 allowedOriginRules에 맞는 프레임에만 객체를 넣고 리스너가 보낸 쪽 origin과 메인 프레임 여부를 받으므로 이쪽을 씁니다. 외부 링크는 scheme과 host를 허용 목록으로 검사해 목록 밖은 기본 브라우저로 엽니다. JavaScript는 기본으로 꺼져 있으니 필요한 WebView에서만 켭니다. 파일 접근은 targetSdk 30 이상에서 setAllowFileAccess 기본값이 false이고, setAllowFileAccessFromFileURLs와 setAllowUniversalAccessFromFileURLs는 API 30에서 deprecated되었으므로, 앱 안의 파일과 리소스는 WebViewAssetLoader로 https 주소처럼 싣습니다. 민감한 데이터를 다룬 뒤에는 캐시를 지우고 서버는 no-store 헤더를 줍니다.<\/p>\n<p>로그는 Logcat, 버그 리포트, 크래시 보고로 밖에 나갑니다. 토큰, 정확한 위치, 전화번호, 검색어 같은 값은 로그와 custom key에 넣지 않고, 디버그 로그는 릴리스에서 빠지도록 로깅 계층을 한곳에 두며, OkHttp 로깅은 Authorization 값을 가립니다(이 절의 OkHttp 문항). 결제처럼 화면 자체가 민감하면 FLAG_SECURE를 겁니다. Android 17에서 targetSdk 37 앱은 setContentCaptureEnabled(false)로 Content Capture를 끌 수 없어 FLAG_SECURE를 써야 합니다.<\/p>\n<pre class=\"kotlin\"><code>// 허용한 origin의 프레임에만 브리지 객체를 넣고, 보낸 쪽 origin을 다시 확인한다\nif (WebViewFeature.isFeatureSupported(WebViewFeature.WEB_MESSAGE_LISTENER)) {\n    WebViewCompat.addWebMessageListener(webView, &quot;appBridge&quot;, setOf(&quot;https://event.example.com&quot;)) {\n            _, message, sourceOrigin, isMainFrame, _ -&gt;\n        if (isMainFrame &amp;&amp; sourceOrigin.toString() == &quot;https://event.example.com&quot;) {\n            handleBridgeMessage(message.data)      // 받은 데이터도 형식을 검증한 뒤 쓴다\n        }\n    }\n}\nwebView.settings.allowFileAccess = false            // targetSdk 30 이상은 기본값이지만 명시해 둔다<\/code><\/pre>","f":"<ul>\n<li><strong>Android 16의 intent redirection 기본 보호가 있으면 앱은 할 일이 없습니까?<\/strong> 있습니다. Android 16 미만 기기에는 이 보호가 없으므로, 받은 Intent를 다시 실행하지 않는 원칙과 StrictMode의 detectUnsafeIntentLaunch() 검사를 그대로 유지합니다.<\/li>\n<li><strong>WebView에서 연 페이지가 앱의 로그인 상태를 써야 하면 어떻게 넘깁니까?<\/strong> URL 쿼리에 토큰을 넣지 않습니다. 쿼리는 서버 로그, 방문 기록, Referer로 새므로 허용한 origin에만 열린 메시지 채널로 짧은 수명의 일회용 값을 넘기고, 페이지는 그 값을 서버에서 세션으로 바꿉니다.<\/li>\n<li><strong>다른 앱에 파일을 공유할 때는 무엇을 챙깁니까?<\/strong> FileProvider로 content URI를 만들어 필요한 URI에만 일시 권한을 주고 file:// URI는 쓰지 않습니다. Android 18부터 ACTION_SEND, ACTION_SEND_MULTIPLE, ACTION_IMAGE_CAPTURE의 URI 권한 자동 부여가 중단될 예정이므로, StrictMode의 detectImplicitUriPermissionGrant()로 미리 찾아 권한을 명시적으로 줍니다.<\/li>\n<\/ul>"},{"no":124,"t":"Android 앱의 CI/CD는 어떻게 구성하고, 사용자가 많은 앱의 배포 위험은 어떻게 줄입니까?","a":"<p>CI는 PR마다 빌드, 정적 분석, 단위 테스트, 스크린샷 테스트를 돌려 회귀를 머지 전에 막고, 릴리스 파이프라인은 서명, 버전 코드, Baseline Profile 생성과 성능 측정, Play 테스트 트랙 업로드를 자동화합니다. 사용자가 많은 앱의 배포 위험은 테스트 트랙과 단계적 출시로 노출 범위를 작게 시작하고, 미리 정한 지표로 확대나 중단을 결정하며, 앱 업데이트 없이 문제 기능을 끌 수 있는 서버 측 기능 플래그로 줄입니다.<\/p>\n<p>PR 단계는 빠르고 결정적이어야 합니다. 변경된 모듈 기준으로 빌드와 단위 테스트를 돌리고, Android Lint와 detekt 같은 정적 분석으로 코드 규칙과 위험한 API 사용을 잡습니다. UI는 Roborazzi나 Paparazzi 같은 JVM 기반 스크린샷 테스트로 기준 이미지와 비교해 디자인 회귀를 잡고, 기기가 필요한 UI 테스트와 LeakCanary 누수 검사(이 절의 메모리 누수 문항)는 Gradle Managed Devices나 기기 팜에서 야간에 돌립니다. 빌드 시간은 Gradle 빌드 캐시와 구성 캐시로 줄이고(4절의 Gradle 빌드 문항), 앱 크기와 의존성 변화도 PR에 남깁니다(이 절의 앱 크기 문항).<\/p>\n<p>릴리스 파이프라인의 서명은 Play App Signing으로 나눕니다. 배포용 앱 서명 키는 Google이 관리하고 팀은 업로드 키로만 서명하므로, 업로드 키를 잃거나 유출돼도 Play Console에서 재설정을 요청해 계속 업데이트할 수 있습니다. Play App Signing을 쓰지 않는 앱은 서명 키를 잃으면 업데이트를 낼 수 없습니다. 업로드 키스토어와 비밀번호는 저장소나 Gradle 파일에 두지 않고 CI의 비밀 저장소에 둡니다. 버전 코드는 업로드마다 커져야 하므로 CI 빌드 번호에서 만들고 버전 이름은 릴리스 태그에서 가져와, 사람이 손으로 올리다 충돌하는 일을 없앱니다. 빌드는 Play Developer API로 내부 테스트 트랙에 올리고 QA를 마치면 다음 트랙으로 승격합니다. 내부 앱 공유는 Baseline Profile을 지원하지 않으므로 성능 확인은 내부 테스트 트랙 빌드로 합니다. 릴리스 브랜치마다 Baseline Profile을 다시 생성해 파일 차이를 리뷰하고, Macrobenchmark로 콜드 스타트와 핵심 스크롤의 중앙값과 백분위를 이전 릴리스와 비교합니다(이 절의 Baseline Profile 문항). 프로필 생성은 Gradle Managed Device에서 해도 되지만 측정은 실기기에서 하고, 잡음이 크므로 한 번의 수치보다 반복 측정의 추세로 판단합니다.<\/p>\n<p>출시는 작은 비율의 단계적 출시로 시작합니다. 단계적 출시는 첫 출시가 아닌 업데이트에만 쓸 수 있고 비율이 자동으로 늘지 않으며, 중단하면 새 사용자는 받지 않지만 이미 받은 사용자는 그 버전에 남습니다. 확대와 중단 기준은 출시 전에 정해 둡니다. 크래시율과 ANR율을 이전 버전과 비교하고(vitals의 나쁜 동작 기준은 전체 크래시 1.09%, ANR 0.47%), 길 안내 시작 성공률이나 검색 오류율 같은 핵심 지표와 VOC 급증을 함께 봅니다. 중단한 뒤의 수정은 버전 코드를 올린 새 빌드로 내야 하므로 그 사이를 메울 수단이 필요합니다. 새 기능은 서버 측 기능 플래그 뒤에 두어 문제가 생기면 앱 업데이트 없이 끄고(4절의 기능 플래그 문항), 서버 API는 구버전 앱이 계속 동작하도록 하위 호환을 지키며, 치명적인 결함이 있는 버전에는 Play 인앱 업데이트로 업데이트를 강하게 안내합니다.<\/p>\n<pre class=\"kotlin\"><code>// versionCode는 CI 빌드 번호로 자동 증가시키고, 로컬 빌드는 1로 둔다\nval ciBuildNumber = providers.environmentVariable(&quot;CI_BUILD_NUMBER&quot;).map { it.toInt() }.orElse(1)\nandroid {\n    defaultConfig {\n        versionCode = ciBuildNumber.get()\n        versionName = providers.environmentVariable(&quot;RELEASE_TAG&quot;).orElse(&quot;dev&quot;).get()\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>2주 주기처럼 잦은 릴리스에서 회귀 테스트는 어떻게 맞춥니까?<\/strong> 2주 주기라면 릴리스 브랜치를 정해진 날 자르고, 자동 회귀 테스트를 통과한 빌드만 QA 트랙에 올리며, 수동 QA는 새 기능과 자동화하기 어려운 시나리오에 집중합니다.<\/li>\n<li><strong>단계적 출시에서 문제를 늦게 발견하는 경우는 언제입니까?<\/strong> 비율이 작으면 특정 기종이나 지역에서만 나는 문제가 표본에 적게 잡히고, 사용 빈도가 낮은 기능의 문제는 며칠이 지나야 드러납니다. 기기별, 기능별로 나눠 보고 비율을 올리기 전에 충분한 시간을 둡니다.<\/li>\n<li><strong>서명 키가 유출되면 어떻게 합니까?<\/strong> 업로드 키라면 Play Console에서 업로드 키 재설정을 요청하고, 앱 서명 키는 Play App Signing의 key upgrade로 바꿀 수 있습니다. 앱 서명 키를 Google이 관리하게 두는 것 자체가 이 위험을 줄입니다.<\/li>\n<\/ul>"}]},{"no":7,"title":"위치와 모빌리티","qs":[{"no":125,"t":"Android에서 위치는 어떻게 얻습니까? FusedLocationProviderClient와 LocationManager는 무엇이 다릅니까?","a":"<p>Google Play 서비스가 있는 기기에서는 FusedLocationProviderClient가 표준입니다. Fused Location Provider(이하 FLP)는 GPS, Wi-Fi, 셀 기지국, 센서 신호를 합쳐 앱이 정한 정확도와 간격에 맞는 위치 기술을 고르고 배터리 사용을 조절합니다. LocationManager는 플랫폼 API라 GPS나 네트워크 같은 프로바이더를 앱이 직접 고르고, 프로바이더 선택과 전력 관리를 앱이 더 많이 맡아야 하므로 Google Play 서비스가 없는 환경의 대안으로 둡니다.<\/p>\n<p>요청의 성격은 Priority로 정합니다. 상수는 PRIORITY_HIGH_ACCURACY(100), PRIORITY_BALANCED_POWER_ACCURACY(102), PRIORITY_LOW_POWER(104), PRIORITY_PASSIVE(105)입니다. 공식 가이드는 HIGH_ACCURACY는 GPS를 쓸 가능성이 높고, BALANCED는 약 100m인 블록 수준으로 Wi-Fi와 셀을 주로 쓰며, LOW_POWER는 약 10km인 도시 수준이라고 설명합니다. PASSIVE는 다른 클라이언트를 위해 계산된 위치만 받고 자기 요청으로는 위치를 계산하지 않습니다. 요청 객체는 LocationRequest.Builder(priority, intervalMillis)로 만듭니다. play-services-location 21.0.0부터 Builder가 권장 방식이 되고 LocationRequest.create() 같은 예전 생성 방식은 deprecated되었습니다. 기본값은 setPriority가 BALANCED, setMinUpdateIntervalMillis가 interval의 절반(21.4.0부터), setMinUpdateDistanceMeters와 setMaxUpdateDelayMillis가 0이고, setWaitForAccurateLocation은 true라서 HIGH_ACCURACY 요청에서 초기 저정확도 위치 전달을 잠시 늦춥니다.<\/p>\n<p>한 번만 필요한 위치는 getCurrentLocation, 계속 필요한 위치는 requestLocationUpdates로 받습니다. lastLocation(getLastLocation())은 캐시를 읽기만 해서 싸고 빠르지만 나이가 제각각입니다. 기기 위치를 끄면 캐시가 지워지고, 위치를 한 번도 기록하지 않은 기기이거나 Google Play 서비스가 재시작된 뒤 위치를 요청한 클라이언트가 없으면 null을 돌려줍니다. getCurrentLocation은 충분히 최근인 캐시가 있으면 그것을, 없으면 새로 계산한 위치를 돌려주고, 제한 시간 안에 얻지 못하면 null을 줍니다. 허용할 캐시 나이는 CurrentLocationRequest.Builder의 setMaxUpdateAgeMillis로 정하며, 기본값은 10초이지만 바뀔 수 있다고 문서에 적혀 있습니다. 공식 가이드는 새 위치가 필요할 때 requestLocationUpdates를 직접 켜고 끄는 것보다 getCurrentLocation이 안전하다고 하고, setIntervalMillis는 첫 위치가 오는 속도를 정하지 않으므로 화면에 들어오자마자 위치가 필요하면 getCurrentLocation을 함께 씁니다.<\/p>\n<p>LocationManager는 GPS_PROVIDER, NETWORK_PROVIDER, PASSIVE_PROVIDER 같은 프로바이더를 지정해 요청하고, API 31부터는 기기에 있으면 여러 프로바이더 입력을 합치는 FUSED_PROVIDER도 지정할 수 있습니다. Google Play 서비스가 없는 기기까지 지원해야 한다면 위치 소스를 인터페이스로 감싸 FLP 구현과 LocationManager 구현을 두고, GoogleApiAvailability로 서비스 사용 가능 여부를 확인해 고릅니다. 이렇게 감싸 두면 테스트에서 기록된 주행 로그를 내보내는 가짜 구현으로 바꾸기도 쉽습니다.<\/p>\n<pre class=\"kotlin\"><code>// 한 번만 필요한 현재 위치. await(cts)는 kotlinx-coroutines-play-services의 실험 API\n@OptIn(ExperimentalCoroutinesApi::class)\n@RequiresPermission(anyOf = [ACCESS_COARSE_LOCATION, ACCESS_FINE_LOCATION])\nsuspend fun FusedLocationProviderClient.freshLocation(): Location? {\n    val request = CurrentLocationRequest.Builder()\n        .setPriority(Priority.PRIORITY_HIGH_ACCURACY)\n        .setMaxUpdateAgeMillis(MAX_CACHE_AGE_MS)          // 이보다 오래된 캐시는 쓰지 않음\n        .build()\n    val cts = CancellationTokenSource()\n    return getCurrentLocation(request, cts.token).await(cts)  // 코루틴 취소가 요청 취소로 이어짐\n}\n\n// 계속 받는 위치는 Builder로 요청을 만든다\nval guidanceRequest = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, GUIDANCE_INTERVAL_MS)\n    .build()<\/code><\/pre>","f":"<ul>\n<li><strong>lastLocation이 null이 아니면 바로 써도 됩니까?<\/strong> 나이와 정확도를 먼저 확인합니다. 문서는 반환 위치가 임의의 나이일 수 있다고 적으므로 elapsedRealtimeNanos를 SystemClock.elapsedRealtimeNanos()와 비교하고 accuracy도 보고, 기준을 넘으면 getCurrentLocation으로 새로 받습니다.<\/li>\n<li><strong>PRIORITY_PASSIVE는 언제 씁니까?<\/strong> 다른 앱이 계산한 위치만 받아 전력 영향이 거의 없을 때 씁니다. 공식 문서도 새 위치를 수동적으로 알고 싶다면 getLastLocation을 반복 호출하지 말고 PASSIVE 요청을 등록하라고 합니다. 언제 올지 보장이 없으므로 주행 안내처럼 주기가 중요한 기능에는 쓰지 않습니다.<\/li>\n<li><strong>대략적 위치 권한만 있으면 FLP는 어떻게 동작합니까?<\/strong> FLP 레퍼런스는 COARSE만 가진 클라이언트에는 정확한 위치를 숨긴 위치를 주고 업데이트 빈도도 제한한다고 적습니다. 권한 흐름은 이 절의 위치 권한 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":126,"t":"위치 권한은 어떤 흐름으로 요청하고, Android 버전별로 무엇이 다릅니까?","a":"<p>사용자가 위치가 필요한 기능을 누른 순간에 ACCESS_COARSE_LOCATION과 ACCESS_FINE_LOCATION을 한 요청으로 묻고, 백그라운드 위치는 포그라운드 권한을 받은 뒤 그것이 꼭 필요한 기능에서만 따로 요청합니다. Android 12부터는 FINE을 요청해도 사용자가 대략적 위치만 허용할 수 있으므로, 대략적 위치만 있을 때 앱이 어디까지 동작할지를 미리 정해 두는 것이 설계의 핵심입니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>버전<\/th>\n<th>바뀐 점<\/th>\n<th>앱이 할 일<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Android 10 (API 29)<\/td>\n<td>백그라운드 위치가 ACCESS_BACKGROUND_LOCATION으로 분리, 대화상자에 항상 허용 옵션<\/td>\n<td>백그라운드 권한을 선언하고 따로 요청<\/td>\n<\/tr>\n<tr>\n<td>Android 11 (API 30)<\/td>\n<td>이번만 허용 옵션 추가, 항상 허용은 설정 화면에서만, targetSdk 30 이상이 포그라운드와 백그라운드를 함께 요청하면 둘 다 거부<\/td>\n<td>단계적으로 요청하고 설정 화면의 항목 이름을 안내<\/td>\n<\/tr>\n<tr>\n<td>Android 12 (API 31)<\/td>\n<td>정밀 위치와 대략적 위치 중 선택, FINE만 요청하면 일부 릴리스에서 요청 무시<\/td>\n<td>두 권한을 한 요청에 넣고 대략적 위치일 때의 동작을 정의<\/td>\n<\/tr>\n<tr>\n<td>Android 17 (API 37) 타깃<\/td>\n<td>세션 단위 위치 기능만 있는 앱은 Play 정책상 위치 버튼 사용<\/td>\n<td>일회성 위치 기능에 위치 버튼 검토<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>FINE만 요청하면 Android 12의 일부 릴리스에서 요청이 무시되고, targetSdk 31 이상이면 Logcat에 \"ACCESS_FINE_LOCATION must be requested with ACCESS_COARSE_LOCATION.\"이 찍힙니다. 대략적 위치는 약 3제곱킬로미터, 정밀 위치는 보통 약 50m 이내의 정확도입니다. 대략적 위치만 허용되면 지도는 그 지역을 중심으로 보여 주고 주변 검색은 지역 단위로 동작시키되, 회전 지점과 차로를 맞춰야 하는 주행 안내는 시작할 때 정밀 위치가 필요한 이유를 설명하고 두 권한을 다시 함께 요청해 정밀 위치로 올려 달라고 합니다. 이미 대략적 위치를 허용한 사용자에게는 시스템이 정밀 위치로 올리는 다른 대화상자를 보여 줍니다. 사용자가 대화상자나 설정에서 정밀 위치를 대략적 위치로 내리면 시스템이 앱 프로세스를 재시작하므로, 권한 상태는 저장해 두지 말고 쓸 때마다 확인합니다.<\/p>\n<p>권한과 별개로 기기 위치 서비스가 꺼져 있을 수 있습니다. SettingsClient.checkLocationSettings에 쓸 LocationRequest를 넣어 확인하고, 실패가 ResolvableApiException이면 설정을 바꾸는 시스템 대화상자를 띄웁니다. 공식 가이드 예제는 startResolutionForResult와 onActivityResult를 쓰지만, Activity Result API에서는 예외의 resolution이 주는 PendingIntent를 IntentSenderRequest.Builder로 감싸 StartIntentSenderForResult 계약으로 띄웁니다. 백그라운드 위치는 Play 정책상 앱의 핵심 기능에 필요할 때만 허용되고, Play Console 권한 선언 양식, 동영상, 눈에 띄는 앱 내 고지, 개인정보처리방침을 갖춰야 합니다. 설명 화면과 영구 거부 뒤 설정 안내 같은 일반적인 런타임 권한 설계는 5절의 런타임 권한 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>val launcher = rememberLauncherForActivityResult(\n    ActivityResultContracts.RequestMultiplePermissions()\n) { granted -&gt;\n    when {\n        granted[ACCESS_FINE_LOCATION] == true -&gt; viewModel.startGuidance()\n        granted[ACCESS_COARSE_LOCATION] == true -&gt; viewModel.showApproximateMode()  // 안내 대신 지역 단위 기능\n        else -&gt; viewModel.showLocationDenied()\n    }\n}\n// 안내 시작 버튼을 눌렀을 때 두 권한을 한 요청으로 묻는다\nButton(onClick = { launcher.launch(arrayOf(ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION)) }) {\n    Text(&quot;안내 시작&quot;)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>백그라운드 위치 권한은 어떤 화면에서 요청합니까?<\/strong> targetSdk 30 이상에서 shouldShowRequestPermissionRationale()이 true면 기능에 백그라운드 위치가 필요한 이유, 설정 화면의 항목 이름, 거절하는 선택지를 담은 설명 화면을 먼저 보여 줍니다. 항목 이름은 getBackgroundPermissionOptionLabel()로 기기 언어에 맞게 얻고, 사용자가 거절해도 앱의 나머지 기능은 그대로 쓰게 합니다.<\/li>\n<li><strong>Android 17의 위치 버튼은 내비게이션 앱에도 필요합니까?<\/strong> 정책 조건은 Android 17 이상을 타깃하면서 세션 단위 위치가 필요한 기능만 있는 앱입니다. 주행 안내처럼 계속 위치가 필요한 기능이 있으면 이 조건에 해당하지 않지만, Play 정책은 일회성 위치 요청에 위치 버튼을 쓰는 것을 최소 범위 원칙의 예로 들므로 내 주변 검색 같은 기능에는 검토할 만합니다. 위치 버튼 Jetpack 라이브러리는 아직 실험 단계입니다.<\/li>\n<li><strong>권한이 있는데도 위치가 오지 않으면 무엇을 봅니까?<\/strong> 기기 위치 서비스가 꺼졌는지, 대략적 위치만 허용되어 빈도가 제한되는지, 앱이 백그라운드인데 백그라운드 권한도 포그라운드 서비스도 없는지 차례로 봅니다. FLP 레퍼런스는 포그라운드 권한만 가진 앱은 백그라운드에서 위치를 받지 못한다고 적습니다.<\/li>\n<\/ul>"},{"no":127,"t":"화면이 꺼져도 주행 안내를 이어 가려면 어떤 구조로 만듭니까?","a":"<p>사용자가 안내 시작을 누른 순간, 앱이 보이는 상태에서 foregroundServiceType이 location인 포그라운드 서비스를 시작하고 위치 수집과 안내 계산은 그 서비스가 맡습니다. 위치 권한 문서도 포그라운드 서비스가 실행 중이면 사용자가 홈 버튼을 누르거나 화면을 꺼도 포그라운드 위치로 본다고 적습니다. 화면과 서비스는 같은 싱글턴 Repository의 StateFlow를 보고, 화면은 보이는 동안만 그 상태를 그립니다.<\/p>\n<p>위치를 쓰는 포그라운드 서비스는 Android 10(API 29) 이상에서 매니페스트에 foregroundServiceType=\"location\"을 선언해야 하고, targetSdk 34 이상이면 FOREGROUND_SERVICE_LOCATION 권한도 선언하며 startForeground를 부르는 시점에 위치 서비스가 켜져 있고 ACCESS_COARSE_LOCATION이나 ACCESS_FINE_LOCATION이 허용되어 있어야 합니다. 위치 권한은 while-in-use 제한 대상이라 ACCESS_BACKGROUND_LOCATION이 없으면 백그라운드에서 위치 포그라운드 서비스를 만들 수 없고, targetSdk 34 이상은 생성 시점에 SecurityException이 납니다. 높은 우선순위 FCM처럼 백그라운드 시작 제한의 예외에 해당해도 이 제한은 따로 적용되며, 예외는 알림이나 위젯 상호작용, 시스템 컴포넌트가 시작한 경우 같은 몇 가지뿐입니다. 그래서 Activity가 보이는 동안 startForegroundService로 시작하고, 5초 안에 startForeground를 호출해야 ANR이 나지 않습니다. 버전 분기는 androidx.core 1.12.0에 추가된 ServiceCompat.startForeground가 처리합니다. 백그라운드에서 시작되어 위치 접근이 막히면 Logcat에 \"Foreground service started from background can not have location/camera/microphone access\"가 찍히므로 테스트에서 이 메시지를 확인합니다. 타입 선언과 시작 제한 같은 포그라운드 서비스 일반 요구 사항은 5절의 Service 문항에서 다룹니다.<\/p>\n<p>알림은 필수입니다. Android 13부터 POST_NOTIFICATIONS가 없어도 포그라운드 서비스는 시작되지만, 사용자가 알림을 거부하면 서비스 알림이 알림 창에는 보이지 않고 Task Manager에만 나타납니다. 그래서 안내를 시작할 때 알림 권한도 함께 받습니다. 알림에는 다음 회전, 남은 거리, 도착 예정 시각, 안내 종료 버튼을 넣어 같은 ID로 갱신하고, setOnlyAlertOnce로 갱신할 때마다 소리가 나지 않게 합니다. 이 알림을 Live Update로 승격하는 방법은 이 절의 Live Updates 문항, 차량 화면의 안내 알림은 이 절의 Android Auto 문항에서 다룹니다.<\/p>\n<p>종료 조건은 도착, 사용자의 종료(앱 화면이나 알림 버튼), 위치 서비스가 꺼지는 것처럼 안내를 이어 갈 수 없는 상태입니다. 이때 위치 업데이트를 해제하고 ServiceCompat.stopForeground(this, STOP_FOREGROUND_REMOVE)와 stopSelf로 끝냅니다. Play 정책도 위치 포그라운드 서비스는 앱 안 사용자 동작의 연장으로 시작하고 그 용도가 끝나면 바로 종료해야 한다고 적습니다. 프로세스 종료에 대비해 목적지, 경로 옵션, 진행 구간 같은 안내 세션을 시작할 때와 주요 지점마다 Room이나 DataStore에 저장하고, 사용자가 앱을 다시 열면 남은 세션을 보고 이어서 안내할지 물은 뒤 현재 위치에서 경로를 다시 받습니다. 프로세스가 죽으면 위치 업데이트와 알림도 함께 사라지고, 백그라운드에서 위치 포그라운드 서비스를 다시 만드는 것은 while-in-use 제한에 걸리기 때문입니다. 사용자가 Task Manager에서 앱을 직접 멈춘 경우는 5절의 Service 문항처럼 ApplicationExitInfo로 구분해 다시 묻지 않습니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 안내 시작 버튼에서 startForegroundService로 시작한다\n@AndroidEntryPoint\nclass GuidanceService : LifecycleService() {\n    @Inject lateinit var guidance: GuidanceRepository     // 화면과 같은 싱글턴\n\n    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n        super.onStartCommand(intent, flags, startId)\n        ServiceCompat.startForeground(\n            this, NOTIFICATION_ID, buildGuidanceNotification(),    // 알림은 서비스가 만든다\n            ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION,   // 매니페스트 타입과 같아야 함\n        )\n        guidance.startIfIdle(lifecycleScope)                // 위치 수집과 안내 계산, 중복 시작 방지\n        return START_NOT_STICKY                             // 복구는 저장한 세션으로\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>절전 모드에서 화면이 꺼지면 위치가 끊기지 않습니까?<\/strong> 절전 모드에서 위치 기능이 어떻게 동작할지는 PowerManager.getLocationPowerSaveMode()(API 28)로 확인합니다. 절전 모드에서 화면이 꺼지면 LOCATION_MODE_GPS_DISABLED_WHEN_SCREEN_OFF는 GPS 프로바이더를, LOCATION_MODE_ALL_DISABLED_WHEN_SCREEN_OFF는 모든 위치 프로바이더를 끄고 LOCATION_MODE_THROTTLE_REQUESTS_WHEN_SCREEN_OFF는 위치 요청을 제한하므로, 안내를 시작할 때 이 세 값이면 사용자에게 알립니다. 위치 권한 문서는 LOCATION_MODE_FOREGROUND_ONLY라면 화면이 꺼져도 포그라운드 서비스는 위치를 계속 받는다고 적습니다.<\/li>\n<li><strong>START_STICKY로 두면 시스템이 알아서 이어 주지 않습니까?<\/strong> 재시작은 앱이 보이지 않을 때 일어나고, 서비스 타입 문서는 ACCESS_BACKGROUND_LOCATION이 없으면 백그라운드에서 위치 포그라운드 서비스를 만들 수 없다고 적습니다. 경로와 안내 상태도 메모리에서 사라졌으므로, 사용자가 앱을 열 때 저장된 세션으로 이어 가는 쪽이 동작을 예측하기 쉽습니다.<\/li>\n<li><strong>checkSelfPermission이 GRANTED면 백그라운드에서도 위치 서비스를 시작해도 됩니까?<\/strong> 안 됩니다. 공식 문서는 while-in-use 권한은 앱이 백그라운드에 있어도 checkSelfPermission이 PERMISSION_GRANTED를 돌려준다고 적습니다. 그 값은 사용 중일 때 허용되었다는 뜻이라 백그라운드 시작 가능 여부를 판단하는 근거가 되지 않습니다.<\/li>\n<\/ul>"},{"no":128,"t":"백그라운드 위치가 필요해 보이는 기능(도착 알림, 주차 위치 저장)은 어떻게 설계합니까?","a":"<p>먼저 백그라운드 위치 없이 되는지 따집니다. 사용자가 시작한 주행 안내 중이라면 위치 포그라운드 서비스가 돌고 있어 포그라운드 위치로 충분하므로, 도착 감지와 안내 종료 시점의 위치 저장은 그 안에서 처리합니다. 앱이 꺼져 있을 때도 반응해야 하는 기능만 지오펜싱과 ACCESS_BACKGROUND_LOCATION을 검토합니다. 지오펜싱도 targetSdk 29 이상이면 ACCESS_FINE_LOCATION과 ACCESS_BACKGROUND_LOCATION이 필요해서 권한을 피하는 수단이 아니고, Play는 백그라운드 위치를 앱의 핵심 기능에 필요할 때만 허용합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>기능<\/th>\n<th>백그라운드 위치 없이<\/th>\n<th>백그라운드 위치가 필요한 경우<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>도착 알림<\/td>\n<td>안내 중이면 서비스가 경로상 남은 거리로 판단<\/td>\n<td>안내 없이 저장한 장소에 도착할 때 알림(지오펜스)<\/td>\n<\/tr>\n<tr>\n<td>주차 위치 저장<\/td>\n<td>안내가 끝나거나 Android Auto 연결이 끊길 때 직전까지 받은 마지막 위치 저장<\/td>\n<td>안내 없이 운전한 뒤 자동 저장(활동 인식과 위치)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>제약도 알고 설계해야 합니다. Android 8.0부터 백그라운드 앱은 targetSdk와 무관하게 시간당 몇 번만 위치를 받고, 포그라운드 앱이나 포그라운드 서비스를 실행 중인 앱만 이전 빈도를 유지합니다. 지오펜스는 앱당 100개(다중 사용자 기기는 사용자당 100개)까지이고 반경은 최소 100~150m가 권장됩니다. 지오펜싱 문서는 알림 지연이 보통 2분 미만이고, 백그라운드 위치 제한이 걸리면 평균 2~3분, 기기가 오래 멈춰 있었다면 최대 6분까지 늘 수 있다고 적습니다. 대부분의 기기에서 지오펜스 서비스는 네트워크 위치만 쓰므로 Wi-Fi가 꺼져 있으면 알림이 오지 않을 수 있고, 재부팅, 재설치, 앱 데이터 삭제, GEOFENCE_NOT_AVAILABLE 알림 뒤에는 앱이 다시 등록해야 합니다.<\/p>\n<p>안내 없이 운전한 경우까지 주차 위치를 자동 저장하려면 활동 인식 전환 API로 IN_VEHICLE 종료를 감지할 수 있습니다(Android 10부터 ACTIVITY_RECOGNITION 런타임 권한 필요). 하지만 이 이벤트는 백그라운드에서 포그라운드 서비스를 시작할 수 있는 예외일 뿐이고, while-in-use 권한이 필요한 서비스는 그 예외에 해당해도 백그라운드에서 만들 수 없으므로 위치를 얻으려면 결국 백그라운드 위치 권한이 필요합니다. Play 정책도 턴바이턴 안내를 포그라운드 위치로 할 수 있는 기능의 예로 들되, 경로를 수동적으로 기록하거나 운전 시작과 종료를 감시하는 것처럼 사용자가 앱 밖에 있을 때 동작하는 기능이 있으면 해당하지 않는다고 적습니다. 그래서 자동 저장이 핵심 기능인지를 기획과 먼저 정합니다.<\/p>\n<p>핵심 기능이라고 판단하면 절차를 지킵니다. 포그라운드 권한을 먼저 받고, 해당 기능을 켤 때 눈에 띄는 앱 내 고지를 보여 준 뒤 설정 화면으로 안내합니다. 고지는 앱의 일반 사용 흐름 안에 있어야 하고, \"위치\"라는 말, 앱을 닫았거나 사용하지 않을 때도 수집한다는 표현, 백그라운드 위치를 쓰는 기능 목록을 담아야 하며, 개인정보처리방침에만 두면 안 됩니다. Play Console 권한 선언 양식은 한 번에 한 기능만 평가하고, 동영상은 30초 이하가 권장됩니다. 위치 포그라운드 서비스라도 쓰임이 백그라운드 위치와 같다면 같은 요건을 적용받습니다. Android 10 이상에서는 권한을 받은 뒤 처음 백그라운드에서 위치에 접근할 때 시스템이 항상 허용 상태를 알리는 알림을 보내므로, 배터리 영향과 끄는 방법을 앱 안에서 미리 설명해 둡니다.<\/p>","f":"<ul>\n<li><strong>지오펜스 알림이 늦거나 오지 않으면 무엇을 봅니까?<\/strong> 반경이 너무 작은지, Wi-Fi와 Wi-Fi 스캔이 모두 꺼졌는지, 지오펜스 안에서 데이터 연결이 불안정한지, 재부팅 등으로 등록이 사라졌는지 봅니다. Geofence.Builder의 setNotificationResponsiveness 값을 크게 잡으면 전력은 줄지만 지연이 늘어납니다.<\/li>\n<li><strong>활동 인식 이벤트를 받았을 때 위치 포그라운드 서비스를 띄우면 되지 않습니까?<\/strong> 백그라운드 시작 제한의 예외에 해당해도 while-in-use 권한이 필요한 서비스는 백그라운드에서 만들 수 없다고 문서가 적습니다. targetSdk 34 이상이면 ACCESS_BACKGROUND_LOCATION 없이 만들 때 SecurityException이 납니다.<\/li>\n<li><strong>안내 중 도착은 어떻게 판단합니까?<\/strong> 목적지 반경 안에 들어온 한 번의 위치로 끝내지 않고, 경로상 남은 거리, 속도, 정차 여부를 함께 보고 몇 번 연속으로 조건이 맞을 때 도착으로 처리합니다. GPS 오차로 반경 경계를 오가면 도착과 해제가 반복되기 때문입니다.<\/li>\n<\/ul>"},{"no":129,"t":"위치 업데이트 주기와 정확도는 상황에 따라 어떻게 조절합니까?","a":"<p>상황마다 LocationRequest를 바꿔 다시 등록합니다. 안내 중 주행은 PRIORITY_HIGH_ACCURACY와 짧은 간격, 안내 없이 지도만 볼 때는 BALANCED와 긴 간격, 앱이 백그라운드이고 안내가 없으면 요청 자체를 해제합니다. 간격과 거리의 구체 수치는 기기와 경로에서 실측해 정하고, 공식 문서는 대부분의 고빈도 앱은 1초 간격이면 충분하다고 적습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>상황<\/th>\n<th>Priority<\/th>\n<th>간격과 거리<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>안내 중 주행<\/td>\n<td>HIGH_ACCURACY<\/td>\n<td>짧은 간격, 최소 거리 0<\/td>\n<td>회전 지점 안내와 이탈 판단에 지연이 없어야 함<\/td>\n<\/tr>\n<tr>\n<td>도보 안내<\/td>\n<td>HIGH_ACCURACY<\/td>\n<td>주행보다 긴 간격, 최소 거리 지정<\/td>\n<td>속도가 느려 한 번에 움직이는 거리가 짧음<\/td>\n<\/tr>\n<tr>\n<td>지도 탐색(안내 없음)<\/td>\n<td>BALANCED<\/td>\n<td>긴 간격<\/td>\n<td>내 위치 표시 정도만 필요<\/td>\n<\/tr>\n<tr>\n<td>주행 기록처럼 지연이 괜찮은 기능<\/td>\n<td>HIGH_ACCURACY<\/td>\n<td>배치 전달 허용<\/td>\n<td>기기를 깨우는 횟수를 줄임<\/td>\n<\/tr>\n<tr>\n<td>백그라운드이고 안내 없음<\/td>\n<td>요청 해제<\/td>\n<td>없음<\/td>\n<td>백그라운드 위치를 쓰지 않음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>조절 수단은 LocationRequest.Builder의 옵션입니다. setIntervalMillis는 원하는 간격일 뿐이라 배터리 최적화나 수신 환경에 따라 더 빠르거나 느리게 오고, 아예 오지 않을 수도 있습니다. setMinUpdateIntervalMillis는 이보다 빨리 받지 않는 하한으로 21.4.0부터 기본값이 interval의 절반이고, setMinUpdateDistanceMeters를 주면 그만큼 움직이지 않은 업데이트를 받지 않아 정차 중 콜백이 줄어듭니다. setMaxUpdateDelayMillis를 interval의 2배 이상으로 주면 기기가 위치를 모아 한 번에 전달할 수 있고, 모인 위치는 flushLocations로 즉시 받을 수 있습니다. 같은 콜백으로 requestLocationUpdates를 다시 부르면 이전 요청이 새 요청으로 바뀝니다. 위치를 Flow로 감쌌다면 모드가 바뀔 때 이전 Flow를 취소하고 새 요청으로 다시 등록하는 편이 단순하며, 이 방식은 이 절의 위치 콜백 Flow 문항에서 다룹니다. 공식 가이드는 업데이트마다 네트워크 요청 같은 긴 작업을 한다면 최소 간격을 늘려 쓰지 못할 업데이트를 받지 않게 하라고 권합니다.<\/p>\n<p>받는 빈도와 화면을 갱신하는 빈도는 따로 둡니다. 위치는 초 단위로 와도 차량 아이콘과 카메라는 두 위치 사이를 보간해 프레임마다 부드럽게 움직이고, 배치로 여러 위치가 오면 안내 로직은 전부 처리하되 화면은 마지막 위치만 씁니다. 화면이 꺼져 있으면 지도 렌더링은 멈추고 안내 계산만 이어 가며, 알림은 표시할 문구가 바뀔 때만 갱신합니다.<\/p>\n<p>측정은 배터리와 정확도를 함께 봅니다. Android vitals의 excessive partial wake lock 계산에서 FLP와 LocationManager 위치 콜백 때 시스템이 잡는 짧은 wake lock은 제외됩니다. 그렇다고 GPS를 켜 두는 전력 비용이 사라지는 것은 아니므로 같은 경로를 같은 기기로 주행하며 모드별 소모를 비교하고, 도구(Power Profiler, PowerMetric, 시스템 트레이스)는 6절의 배터리 문항을 따릅니다. 정확도는 accuracy 분포, 맵 매칭 실패율, 잘못된 재탐색 비율 같은 안내 품질 지표로 보고, 간격을 바꾼 버전을 단계적으로 배포해 두 지표를 함께 확인합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 상황별 요청. 수치는 상수로 두고 실측으로 정한다\nfun requestFor(mode: TrackingMode): LocationRequest? = when (mode) {\n    TrackingMode.DRIVING -&gt; LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, DRIVE_INTERVAL_MS)\n        .build()\n    TrackingMode.WALKING -&gt; LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, WALK_INTERVAL_MS)\n        .setMinUpdateDistanceMeters(WALK_MIN_DISTANCE_M)\n        .build()\n    TrackingMode.BROWSING -&gt; LocationRequest.Builder(Priority.PRIORITY_BALANCED_POWER_ACCURACY, BROWSE_INTERVAL_MS)\n        .build()\n    TrackingMode.TRIP_LOG -&gt; LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, LOG_INTERVAL_MS)\n        .setMaxUpdateDelayMillis(LOG_BATCH_DELAY_MS)           // interval의 2배 이상이면 배치 전달 가능\n        .build()\n    TrackingMode.IDLE -&gt; null                                  // 요청 해제\n}<\/code><\/pre>","f":"<ul>\n<li><strong>간격을 줄이면 정확도도 좋아집니까?<\/strong> 아닙니다. 간격은 얼마나 자주 받느냐이고, 한 위치의 정확도는 Priority와 신호 환경이 정합니다. 간격만 줄이면 오차가 같은 위치를 더 자주 받아 화면이 더 자주 흔들릴 수 있습니다.<\/li>\n<li><strong>배치로 받은 위치는 무엇을 주의합니까?<\/strong> FLP 레퍼런스는 배치를 허용한 요청은 배치 안에서는 시간순이지만 배치끼리는 순서가 뒤바뀔 수 있다고 적습니다. 그래서 elapsedRealtimeNanos로 정렬하고, 실시간 안내에는 배치를 쓰지 않습니다.<\/li>\n<li><strong>정차 중에 업데이트를 줄이면 출발을 늦게 알지 않습니까?<\/strong> setMinUpdateDistanceMeters는 지정한 거리만큼 움직이면 다시 업데이트를 보내므로 출발은 그 거리만큼 늦게 감지됩니다. 주차처럼 길게 멈추면 간격을 늘리고, 신호 대기처럼 곧 출발하는 정차에서는 간격은 그대로 두고 화면 갱신만 줄입니다.<\/li>\n<\/ul>"},{"no":130,"t":"GPS가 튀거나 끊기는 곳(터널, 고가도로, 빌딩 숲)에서 앱은 무엇을 할 수 있습니까?","a":"<p>받은 위치를 그대로 그리지 않고 걸러 내고, 도로망에 맞추고, 신호가 없으면 센서와 직전 이동으로 위치를 추정해 안내를 멈추지 않는 것이 앱이 할 일입니다. 상용 엔진의 세부 알고리즘은 공개 자료가 적으므로 아래는 개념 수준의 설명입니다.<\/p>\n<p>첫 단계는 거르기입니다. Location의 accuracy는 68% 신뢰 수준의 수평 오차 반경이라 hasAccuracy()가 true일 때만 의미가 있고, 기준보다 큰 위치는 안내 판단에 쓰지 않습니다. 직전 위치와의 거리를 시간 차로 나눈 속도가 물리적으로 불가능하면 빌딩 숲의 반사 신호로 튄 값으로 보고 버립니다. 시간 차는 getTime()이 아니라 단조 증가하는 elapsedRealtimeNanos로 계산해야 기기 시각이 바뀌어도 순서가 틀어지지 않습니다.<\/p>\n<p>둘째는 맵 매칭입니다. 위치를 가장 가까운 도로에 붙이는 것만으로는 부족하고, 진행 방향, 직전에 매칭한 도로와의 연결성, 속도를 함께 봐서 연결되지 않은 옆 도로로 건너뛰지 않게 합니다. 고가도로와 그 아래 도로는 위경도가 거의 같아 위치만으로는 구분이 어렵기 때문에, 진입로를 지날 때의 진행 방향과 직전 도로의 연결성, 기압 센서로 본 높이 변화를 단서로 씁니다.<\/p>\n<p>셋째는 신호가 끊긴 구간의 추측 항법입니다. 마지막으로 믿을 만했던 위치에서 속도와 진행 방향(가속도, 자이로 센서)으로 이동을 적분하되, 터널 안 도로 형상에 맞춰 경로 선 위로 전진시키면 오차가 덜 쌓입니다. 칼만 필터는 운동 모델로 예측한 위치와 측정 위치를 각자의 불확실성에 따라 섞는 방법이라, 신호가 약할 때는 예측을 믿고 신호가 돌아오면 측정 쪽으로 서서히 보정할 수 있습니다. 화면에서는 안내를 멈추지 않고 추정 위치로 차량 아이콘을 계속 움직이며, 터널 출구 직후의 분기 같은 다음 안내도 예정대로 냅니다. 정확도가 낮은 구간에서는 경로 이탈 판단을 보류하고, onLocationAvailability가 false로 오면 추정 모드로 넘어가되 이 값은 문서상 최선의 추정일 뿐이라 단독 근거로 쓰지 않습니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 정확도와 물리적으로 불가능한 이동으로 이상치를 거른다\nfun isPlausible(prev: Location?, cur: Location): Boolean {\n    if (!cur.hasAccuracy() || cur.accuracy &gt; MAX_ACCURACY_M) return false\n    if (prev == null) return true\n    val dtSec = (cur.elapsedRealtimeNanos - prev.elapsedRealtimeNanos) / 1e9\n    if (dtSec &lt;= 0) return false                              // 시간이 거꾸로 간 위치\n    val impliedSpeed = prev.distanceTo(cur) / dtSec           // m/s\n    return impliedSpeed &lt;= MAX_PLAUSIBLE_SPEED_MPS\n}<\/code><\/pre>","f":"<ul>\n<li><strong>칼만 필터를 쓰면 무엇이 나빠질 수 있습니까?<\/strong> 예측을 믿는 만큼 실제 방향 전환을 늦게 따라가므로, 교차로에서 차량 아이콘이 잠깐 직진하는 지연이 생깁니다. 측정 잡음과 운동 모델의 잡음 값을 실제 주행 로그로 맞춰야 합니다.<\/li>\n<li><strong>이런 로직은 어떻게 재현하고 테스트합니까?<\/strong> 현장에서 위치와 센서 값을 기록해 재생하는 테스트를 만듭니다. 기기 통합 테스트에서는 FLP의 setMockMode와 setMockLocation을 쓰는데, ACCESS_MOCK_LOCATION 권한과 개발자 옵션의 모의 위치 앱 지정이 필요하고 모든 FLP 클라이언트에 영향을 주므로 끝나면 반드시 끕니다.<\/li>\n<li><strong>지하철처럼 GPS가 아예 없는 곳은 어떻게 합니까?<\/strong> Android에서는 OS의 주기적 Wi-Fi 스캔 결과를 서버에서 미리 받은 역사 Wi-Fi 정보와 맞춰 지하 구간 위치를 추정할 수 있습니다. 위치 소스가 달라질 뿐 거르고 보정하는 구조는 같습니다.<\/li>\n<li><strong>서버와 클라이언트는 역할을 어떻게 나눕니까?<\/strong> 지연과 데이터 크기로 나눕니다. 거르기, 맵 매칭, 추측 항법은 터널처럼 네트워크도 끊기는 곳에서 바로 동작해야 하므로 클라이언트가 맡고, 쌓인 궤적의 정밀 매칭, 교통 정보 추정, 지도 데이터 갱신은 서버가 맡습니다. 서버 쪽 예로 OSRM의 Match 서비스는 노이즈가 있는 GPS 궤적을 도로망에 맞춥니다.<\/li>\n<\/ul>"},{"no":131,"t":"위치 콜백을 Flow로 감싸 화면과 서비스에서 함께 쓰려면 어떻게 만듭니까?","a":"<p>callbackFlow 안에서 requestLocationUpdates로 등록하고 awaitClose에서 removeLocationUpdates로 해제하는 Cold Flow를 만들고, Repository가 앱 스코프에서 shareIn으로 공유해 FLP 등록을 하나만 유지합니다. 화면과 안내 서비스는 이 SharedFlow를 수집하고, SharingStarted.WhileSubscribed라서 아무도 수집하지 않으면 위치 요청이 해제됩니다. callbackFlow의 일반 원리(trySend, awaitClose, 버퍼 정책)는 2절의 콜백을 Flow로 바꾸는 문항에서 다루고, 여기서는 위치에 특화된 지점만 다룹니다.<\/p>\n<p>첫째는 Looper입니다. requestLocationUpdates(request, callback, looper)에 null을 넘기면 호출한 스레드의 Looper를 쓰고, 그 스레드에 Looper가 없으면 IllegalStateException이 납니다. callbackFlow 블록은 수집하는 코루틴의 디스패처에서 실행되므로 Dispatchers.Default에서 수집하면 이 문제가 생깁니다. Looper.getMainLooper()를 명시하거나 Executor를 받는 오버로드를 쓰고, 콜백에서는 trySend만 합니다. 맵 매칭 같은 무거운 처리는 locationBatches 뒤에 map으로 붙이고 그 뒤에 flowOn(Dispatchers.Default)을 둡니다. flowOn은 자신보다 위의 연산자만 옮기고 하류는 그대로 두는데, callbackFlow 블록도 위쪽이라 등록도 Default 스레드에서 일어나므로 이때도 Looper 명시가 필요합니다. 둘째는 권한과 실패입니다. 권한이 없으면 등록이 SecurityException으로 실패하고, 블록 안 예외나 close(exception)은 Flow를 그 예외로 끝냅니다. 2절에서 본 것처럼 공유 업스트림의 예외는 공유 코루틴을 끝내고 스코프로 전달되므로 catch를 shareIn 앞에 두고, 요청을 갈아 끼우는 구조라면 flatMapLatest 안쪽에 두어 한 번 실패한 뒤에도 모드 변경을 계속 받게 합니다.<\/p>\n<p>셋째는 배치와 초기 값입니다. onLocationResult로 오는 LocationResult는 비어 있지 않고 locations는 오래된 것부터 중복 없이 정렬되어 있으므로, 리스트 하나를 한 원소로 보내고 정책은 수집하는 쪽이 고르게 합니다. 안내 로직은 모든 위치를 처리하고, 화면은 마지막 위치만 쓰고 conflate합니다. 등록 직후에는 과거에 캐시된 위치가 먼저 올 수 있어 시간을 확인합니다. 신호 상태는 onLocationAvailability로 따로 내보낼 수 있습니다.<\/p>\n<p>공유 설정은 수명에 맞춥니다. 화면 수집은 생명주기에 따라 멈추고 안내 서비스의 수집은 계속되므로, 화면이 꺼져도 안내 중에는 업스트림이 유지되고 안내가 끝나고 화면도 없으면 구독자가 0이 되어 stopTimeout 뒤 등록이 해제됩니다. Eagerly로 공유하면 이 해제가 일어나지 않습니다. replay = 1로 새 구독자에게 마지막 위치를 바로 주되, replayExpirationMillis를 짧게 잡아 오래 멈췄다 돌아온 화면에 낡은 위치를 보여 주지 않습니다. 정확도 요구가 다른 구독자가 있으면 가장 높은 요구로 모드를 정하고 flatMapLatest로 요청을 갈아 끼웁니다.<\/p>\n<pre class=\"kotlin\"><code>@RequiresPermission(anyOf = [ACCESS_COARSE_LOCATION, ACCESS_FINE_LOCATION])\nfun FusedLocationProviderClient.locationBatches(request: LocationRequest): Flow&lt;List&lt;Location&gt;&gt; =\n    callbackFlow {\n        val callback = object : LocationCallback() {\n            override fun onLocationResult(result: LocationResult) {\n                trySend(result.locations)                     // 비어 있지 않음, 오래된 것부터\n            }\n        }\n        requestLocationUpdates(request, callback, Looper.getMainLooper())  // Looper 없는 스레드 대비\n            .addOnFailureListener { close(it) }\n        awaitClose { removeLocationUpdates(callback) }\n    }<\/code><\/pre>\n<pre class=\"kotlin\"><code>// 개념 코드: 앱 스코프 싱글턴 Repository 안. mode는 안내 서비스가 DRIVING으로 바꾼다\n@OptIn(ExperimentalCoroutinesApi::class)                      // flatMapLatest\n@SuppressLint(&quot;MissingPermission&quot;)                             // 권한 확인은 모드를 바꾸는 쪽에서\nval updates: SharedFlow&lt;LocationUpdate&gt; = mode\n    .flatMapLatest { m -&gt;\n        val request = requestFor(m) ?: return@flatMapLatest emptyFlow&lt;LocationUpdate&gt;()\n        client.locationBatches(request)\n            .map&lt;List&lt;Location&gt;, LocationUpdate&gt; { LocationUpdate.Fix(it) }\n            .catch { emit(LocationUpdate.Failed(it)) }        // 안쪽에서 처리해 모드 구독과 공유 코루틴을 살려 둔다\n    }\n    .shareIn(appScope, SharingStarted.WhileSubscribed(STOP_TIMEOUT_MS, REPLAY_EXPIRATION_MS), replay = 1)<\/code><\/pre>","f":"<ul>\n<li><strong>화면이 꺼진 동안 위치 수집은 누가 유지합니까?<\/strong> 안내 서비스입니다. 화면은 repeatOnLifecycle이나 collectAsStateWithLifecycle로 STARTED 아래에서 수집을 멈추고, 서비스는 자기 lifecycleScope에서 계속 수집합니다. 안내가 없으면 구독자가 0이 되어 등록이 해제되므로 앱이 백그라운드에서 위치를 계속 요청하는 일이 생기지 않습니다.<\/li>\n<li><strong>같은 callbackFlow를 화면마다 수집하면 무엇이 문제입니까?<\/strong> Cold라서 수집자마다 FLP 등록과 콜백이 하나씩 생깁니다. 콜백 처리, 맵 매칭, 상태 갱신이 수집자 수만큼 반복되고 화면마다 요청 조건이 달라 관리가 흩어지므로 Repository에서 한 번만 등록합니다.<\/li>\n<li><strong>이 구조는 어떻게 테스트합니까?<\/strong> FusedLocationProviderClient를 위치 소스 인터페이스 뒤에 두고, 테스트에서는 기록한 주행 로그를 내보내는 가짜 구현을 주입합니다. StateFlow와 SharedFlow 테스트 방법은 2절의 코루틴 테스트 문항과 같습니다.<\/li>\n<\/ul>"},{"no":132,"t":"경로 이탈은 어떻게 감지하고, 재탐색 요청은 언제 보냅니까?","a":"<p>현재 위치를 경로 선에 투영해 가장 가까운 구간까지의 거리를 구하고, 거리와 진행 방향이 함께 벗어나거나 맵 매칭으로 붙은 도로가 경로 밖인 상태가 몇 번 연속되거나 일정 시간 이어질 때만 이탈로 확정합니다. 임계값은 위치 정확도에 따라 넓히고, 재탐색은 확정한 순간 한 번만 보내되 요청은 늘 하나만 두어 응답 전에 다시 이탈이 확정되면 이전 요청을 취소하고 새로 보냅니다. 실제 서비스의 임계값과 판단 규칙은 공개 자료가 없어 개념 수준으로 설명합니다.<\/p>\n<p>거리는 경로 폴리라인의 각 선분에 수선을 내려 점과 선분 사이 거리로 구합니다. 매번 전체 경로를 훑지 않고 직전에 매칭한 구간 번호에서 진행 방향 쪽 몇 구간만 탐색하면 계산이 가볍고, 순환 도로처럼 경로가 자기 자신과 가까이 지나는 곳에서 엉뚱한 구간에 붙는 일도 줄어듭니다. Google 지도 SDK를 쓴다면 android-maps-utils의 PolyUtil에 허용 거리(미터) 안에 있는지 보는 isLocationOnPath, 몇 번째 구간 근처인지 돌려주는 locationIndexOnPath, 점과 선분 사이 거리를 구하는 distanceToLine이 있습니다. 투영한 지점은 남은 거리 계산과 지나온 구간 표시에도 그대로 씁니다.<\/p>\n<p>진행 방향은 갈라지는 도로로 빠진 것을 확인하고 GPS가 옆 도로로 튄 순간을 거르는 데 씁니다. Location의 bearing은 기기 방향이 아니라 이동 방향이라 경로 구간의 방향과 비교할 수 있지만, 저속에서는 흔들리므로 일정 속도 이상일 때만 씁니다. 평행한 측도나 고가도로 바로 아래에 같은 방향으로 난 도로는 경로와 거리가 가깝고 방향도 같아 이 두 조건으로는 가려지지 않으므로, 맵 매칭이 직전 도로와의 연결성으로 붙인 도로가 경로에 속하는지를 따로 봅니다(이 절의 GPS 튐 문항). 순간 튐을 무시하려면 이탈 조건이 연속으로 맞아야 확정하고, 임계값은 기본 거리에 accuracy를 더해 정확도가 나쁠수록 넓힙니다. 터널처럼 정확도가 낮거나 추정 위치로 달리는 구간에서는 판단을 보류합니다.<\/p>\n<p>재탐색 요청에는 현재 위치, 진행 방향, 속도, 목적지와 경유지, 경로 옵션을 담습니다. 진행 방향이 없으면 서버가 반대 차선 쪽에서 경로를 시작할 수 있습니다. 요청은 한 번에 하나만 보내고, 응답 전에 다시 이탈이 확정되면 이전 요청을 취소하고 새로 보내며, 재탐색 사이에 최소 간격을 둡니다. 응답을 기다리는 동안 기존 경로는 흐리게 남기고 \"경로 재탐색 중\" 상태를 보여 줍니다. Live Update 문서도 도착 예정 시각을 계산하는 동안 빈 상태 대신 \"Rerouting...\" 같은 진행 문구를 보여 주라고 권하고, Car App Library는 재탐색 중에 navigationEnded 대신 Trip.Builder.setLoading(true)를 쓰게 합니다. 오프라인이면 기존 경로 안내와 복귀 판단을 이어 가며 오프라인 상태를 알리고, 연결이 돌아오면 재시도합니다. 타임아웃과 백오프는 9절의 타임아웃과 재시도 문항과 같은 원칙입니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 거리와 방향이 함께 벗어나거나 맵 매칭한 도로가 경로 밖인 상태가 연속될 때만 이탈로 확정\nclass DeviationDetector {\n    private var offCount = 0\n\n    fun onFix(fix: MatchedFix): Boolean {                      // true면 재탐색 요청\n        val threshold = BASE_THRESHOLD_M + ACCURACY_FACTOR * fix.accuracyM\n        val trustBearing = fix.speedMps &gt;= MIN_SPEED_FOR_BEARING_MPS  // 저속에서는 방향이 흔들림\n        val headingOff = !trustBearing || fix.headingDiffDeg &gt; MAX_HEADING_DIFF_DEG  // 못 믿으면 거리로만 판단\n        val off = !fix.onRouteRoad || (fix.distanceToRouteM &gt; threshold &amp;&amp; headingOff)  // 평행 도로는 맵 매칭으로\n        offCount = if (off) offCount + 1 else 0\n        return offCount == REQUIRED_CONSECUTIVE                // 확정 순간 한 번만\n    }\n\n    fun reset() { offCount = 0 }                               // 새 경로를 받으면 초기화\n}<\/code><\/pre>","f":"<ul>\n<li><strong>이탈 판단을 빠르게 할수록 좋지 않습니까?<\/strong> 빠르면 순간 튐에도 재탐색이 잦아져 안내가 흔들리고 서버 요청이 늘고, 늦으면 잘못된 안내가 길어집니다. 주행 로그에서 잘못된 재탐색 비율과 실제 이탈부터 새 경로 안내까지의 시간을 함께 재서 임계값을 정합니다.<\/li>\n<li><strong>응답이 오기 전에 원래 경로로 돌아오면 어떻게 합니까?<\/strong> 복귀가 확정되면 진행 중인 요청을 취소하고 기존 경로 안내를 이어 갑니다. 이미 도착한 응답도 복귀 뒤라면 적용하지 않도록 요청마다 식별자를 두고 현재 상태와 맞는지 확인합니다.<\/li>\n<li><strong>서버가 이탈을 판단하게 하면 안 됩니까?<\/strong> 위치를 계속 서버로 보내야 하고 네트워크 지연과 끊김에 판단이 묶입니다. 이탈 판단은 경로 선과 기기 안의 맵 매칭 결과로 끝나는 계산이라 클라이언트가 하고, 서버는 새 경로 계산과 교통 정보 반영을 맡습니다.<\/li>\n<\/ul>"},{"no":133,"t":"지도 위에 수천 개의 마커를 그려야 할 때 성능 문제는 어떻게 풉니까?","a":"<p>한 번에 지도에 올리는 객체 수를 줄이는 것이 핵심입니다. 화면 영역과 줌 레벨에 맞는 데이터만 요청하고, 줌 레벨별로 클러스터링해 실제로 그리는 마커 수를 제한하고, 마커 아이콘 비트맵은 종류별로 만들어 재사용하며, 지도가 움직이는 동안에는 요청과 재계산을 미루고 이전 요청을 취소합니다. 요청 제어와 캐시까지 포함한 화면 전체 설계는 11절의 주변 장소 표시 설계 문항에서 다룹니다.<\/p>\n<p>비용은 마커 하나하나가 지도 SDK 객체라는 데서 나옵니다. 마커마다 아이콘 비트맵이 GPU로 올라가고, 터치 판정과 정보 창 대상이 되며, 지도 SDK의 마커 추가와 제거는 보통 메인 스레드에서 해야 합니다. 수천 개를 한꺼번에 지우고 다시 추가하면 그동안 메인 스레드가 막혀 지도를 움직일 때 프레임이 밀리고, 마커마다 글자를 그려 넣은 비트맵을 따로 만들면 메모리도 빠르게 늘어납니다.<\/p>\n<p>그래서 단계마다 줄입니다. 요청은 보이는 영역에 여유를 더한 범위나 공간 인덱스의 셀 단위로 보내 지도를 조금 옮겨도 겹치는 셀은 캐시에서 씁니다(8절의 공간 인덱스 문항). 넓은 지역을 축소해서 볼 때는 개별 점 대신 서버가 셀별 개수로 묶어 보내고, 가까이 확대했을 때만 개별 장소를 받습니다. 클라이언트 클러스터링은 격자 방식이 가장 싸고, 거리 기반 방식은 결과가 자연스럽지만 비용이 더 듭니다. Google 지도 SDK라면 android-maps-utils의 ClusterManager가 클러스터 계산을 맡는 Algorithm과 그리기를 맡는 ClusterRenderer를 나눠 바꿔 끼울 수 있게 해 주고, 카메라 이동이 끝났을 때 다시 계산합니다. 계산은 Dispatchers.Default에서 하고, 메인 스레드에는 이전 결과와 ID로 비교한 추가, 삭제, 변경분만 반영합니다.<\/p>\n<p>아이콘은 장소 종류와 선택 상태 조합별로 한 번만 만들어 캐시하고 모든 마커가 공유합니다. 지도 SDK가 데이터 레이어처럼 점 묶음을 한 번에 그리는 기능을 제공한다면 개별 마커 객체 대신 그쪽이 낫습니다. 측정은 지도를 계속 움직이는 시나리오에서 FrameTimingMetric과 Perfetto로 프레임을 보고, 메모리 프로파일러로 비트맵 수를 확인합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 카메라가 멈춘 뒤에만 요청하고, 새 영역이 오면 이전 작업은 취소\n@OptIn(FlowPreview::class, ExperimentalCoroutinesApi::class)\nval clusters: StateFlow&lt;List&lt;ClusterUi&gt;&gt; = cameraIdle               // 이동이 끝날 때의 영역과 줌\n    .debounce(CAMERA_SETTLE_MS)\n    .distinctUntilChanged { old, new -&gt; old.sameCellsAndZoom(new) } // 같은 셀과 줌이면 다시 하지 않음\n    .mapLatest { viewport -&gt;\n        val places = repository.places(viewport.cellIds())          // 셀 단위 캐시를 먼저 본다\n        withContext(Dispatchers.Default) { clusterer.cluster(places, viewport.zoom) }\n    }\n    .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())<\/code><\/pre>","f":"<ul>\n<li><strong>클러스터링은 서버와 클라이언트 중 어디서 합니까?<\/strong> 데이터 양으로 나눕니다. 전국을 보는 축소 상태에서 모든 점을 내려받는 것은 전송과 계산 모두 낭비라 서버가 묶습니다. 확대해서 화면 안 장소 수가 적을 때는 이미 받은 데이터로 클라이언트가 묶고, 줌이 바뀌면 카메라가 멈춘 뒤 다시 계산합니다.<\/li>\n<li><strong>줌을 바꿀 때 클러스터가 깜빡이면 어떻게 합니까?<\/strong> 새 결과가 준비될 때까지 이전 클러스터를 유지하고, 클러스터에 안정적인 ID를 붙여 바뀐 것만 갱신합니다. 전체를 지우고 다시 그리는 방식이 깜빡임의 흔한 원인입니다.<\/li>\n<li><strong>마커 탭은 어떻게 판정합니까?<\/strong> 지도 SDK 마커는 SDK가 판정합니다. 데이터 레이어나 직접 그린 점이라면 메모리에 Quadtree를 두고 탭한 지점 주변만 찾습니다(8절의 공간 인덱스 문항).<\/li>\n<\/ul>"},{"no":134,"t":"경로 선 데이터는 어떻게 전송하고 그립니까?","a":"<p>좌표 열은 Encoded Polyline처럼 정밀도를 정하고 이전 점과의 차이만 저장하는 문자열로 압축해 보내고, 그릴 때는 줌 레벨에 맞게 단순화한 선을 씁니다. 주행 중에는 현재 위치를 경로에 투영한 지점에서 선을 나눠 지나온 구간과 남은 구간을 다르게 그리고, 경로가 바뀌면 새 선을 다 준비한 뒤 한 번에 바꿔 깜빡이지 않게 합니다.<\/p>\n<p>Google Encoded Polyline Algorithm Format은 위도와 경도에 1e5를 곱해 반올림(소수 5자리)하는 손실 압축입니다. 첫 점을 뺀 나머지 점은 이전 점과의 차이만 저장하고, 각 값은 1비트 왼쪽으로 시프트해 음수면 반전한 뒤 5비트 청크로 나눠 역순으로 놓습니다. 뒤에 청크가 더 있으면 0x20과 OR하고 63을 더해 ASCII 문자로 바꿉니다. 도로 위 좌표는 이웃한 점끼리 가까워 차이 값이 작으므로 점 하나가 몇 글자로 줄어들고, 실수 배열 JSON보다 전송량과 파싱 비용이 함께 줄어듭니다. 자릿수를 줄이면 문자열은 더 짧아지지만 오차가 커지므로 정밀도는 안내에 필요한 수준에 맞춰 서버와 합의합니다. 안내 지점과 교통 정보 구간은 좌표를 다시 보내지 않고 좌표 배열의 인덱스 범위로 보내면 경로가 같고 교통만 바뀔 때 좌표를 다시 받지 않아도 됩니다. android-maps-utils의 PolyUtil은 encoded path의 decode와 encode를 제공합니다.<\/p>\n<p>단순화는 Douglas-Peucker 알고리즘을 씁니다. 양 끝점을 잇는 선에서 가장 먼 점이 허용 거리보다 멀면 남기고 그 점을 기준으로 나눠 재귀하는 방식이라, 허용 거리 안의 꼭짓점이 사라집니다. PolyUtil.simplify는 허용 거리를 미터로 받고 시간 복잡도를 O(n^2)로 적고 있으므로, 경로를 받을 때 백그라운드에서 줌 구간별로 한 번씩 만들어 두고 그릴 때는 고르기만 합니다. 축소한 화면에서는 한 픽셀이 덮는 거리가 길어 허용 거리를 크게 잡아도 화면상 모양이 같고, 확대할수록 허용 거리를 줄여 원본에 가깝게 그립니다. 단순화한 선은 그리기 전용이고, 경로 이탈 판단과 맵 매칭은 원본 좌표로 합니다.<\/p>\n<p>지나온 구간은 이 절의 경로 이탈 문항에서 구한 투영 지점과 구간 번호로 나눕니다. 위치가 올 때마다 선 전체를 다시 만들지 않고 나누는 지점만 옮기며, 지도 SDK가 선 하나에 구간별 스타일을 지원하면 그 구간 경계만 바꿉니다. 재탐색으로 경로가 바뀔 때는 기존 선을 지우고 새 선을 그리는 순서로 하면 그 사이 프레임에 선이 사라져 깜빡이므로, 새 선을 먼저 올린 뒤 같은 갱신에서 이전 선을 지우거나 기존 선 객체의 좌표만 바꿉니다. 경로 ID가 같으면 갱신을 건너뛰고, Compose에서는 AndroidView의 update에서 이전 경로와 다를 때만 반영합니다(3절의 지도 SDK 문항).<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 줌 구간별 단순화는 경로를 받을 때 백그라운드에서 한 번만 계산\nclass RouteShapes(private val full: List&lt;LatLng&gt;) {\n    private val byBand: Map&lt;ZoomBand, List&lt;LatLng&gt;&gt; = ZoomBand.entries.associateWith { band -&gt;\n        if (band.toleranceM &gt; 0) PolyUtil.simplify(full, band.toleranceM) else full  // 0이면 원본\n    }\n\n    fun forZoom(zoom: Float): List&lt;LatLng&gt; = byBand.getValue(ZoomBand.of(zoom))\n\n    // 지나온 구간과 남은 구간은 원본에서 투영 지점으로 나눈다(segment는 투영된 구간 번호)\n    fun split(segment: Int, projected: LatLng): Pair&lt;List&lt;LatLng&gt;, List&lt;LatLng&gt;&gt; =\n        (full.subList(0, segment + 1) + projected) to\n            (listOf(projected) + full.subList(segment + 1, full.size))\n}<\/code><\/pre>","f":"<ul>\n<li><strong>gzip으로 압축하면 Encoded Polyline이 필요 없지 않습니까?<\/strong> gzip은 전송량만 줄이고 받은 뒤의 파싱 비용과 메모리는 그대로입니다. Encoded Polyline은 정밀도를 정하고 차이만 담아 원본 크기와 파싱 비용 자체를 줄이므로 둘은 함께 씁니다. 실제 이득은 응답 크기와 파싱 시간을 재서 확인합니다.<\/li>\n<li><strong>단순화한 선으로 이탈 판단을 하면 어떻게 됩니까?<\/strong> 단순화는 허용 거리 안의 꼭짓점을 지우므로 선이 실제 도로에서 최대 허용 거리만큼 벗어납니다. 굽은 도로에서 정상 주행을 이탈로 판단할 수 있어 판단은 원본 좌표로 합니다.<\/li>\n<li><strong>교통 정보 색은 어떻게 그립니까?<\/strong> 원본 좌표의 인덱스 범위와 혼잡도를 받아 구간별 스타일을 입힙니다. 경로는 그대로이고 교통만 바뀌면 스타일만 갱신하고 좌표는 다시 받지 않습니다.<\/li>\n<\/ul>"},{"no":135,"t":"Android Auto와 Android Automotive OS는 어떻게 다르고, Car App Library로 내비게이션 앱을 만들 때 구조와 제약은 무엇입니까?","a":"<p>Android Auto는 폰에서 도는 앱을 차량 화면에 투사하는 방식이고, Android Automotive OS(이하 AAOS)는 차량 헤드유닛이 Android로 돌아 앱이 차량에 설치되어 실행되는 방식입니다. Car App Library(androidx.car.app)는 두 환경 모두를 위한 템플릿 라이브러리로, 앱이 템플릿 모델을 넘기면 호스트가 운전자 주의 분산 기준과 차량 화면, 입력 방식에 맞는 화면으로 바꿔 그립니다. 내비게이션 앱은 지도만 Surface에 직접 그리고, 안내 문구와 도착 예정 시각은 템플릿 컴포넌트에 넣습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>Android Auto<\/th>\n<th>AAOS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>앱이 실행되는 곳<\/td>\n<td>폰(차량 화면에 투사)<\/td>\n<td>차량 헤드유닛<\/td>\n<\/tr>\n<tr>\n<td>호스트<\/td>\n<td>폰의 Android Auto<\/td>\n<td>시스템 앱인 Templates Host(Android 10 이상 차량)<\/td>\n<\/tr>\n<tr>\n<td>아티팩트<\/td>\n<td>androidx.car.app:app-projected<\/td>\n<td>androidx.car.app:app-automotive<\/td>\n<\/tr>\n<tr>\n<td>CarConnection 연결 유형<\/td>\n<td>CONNECTION_TYPE_PROJECTION<\/td>\n<td>CONNECTION_TYPE_NATIVE<\/td>\n<\/tr>\n<tr>\n<td>새 앱과 업데이트의 Play target API(2026-08-31부터)<\/td>\n<td>폰 앱 기준 API 36 이상<\/td>\n<td>API 35 이상<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>구조는 CarAppService, Session, Screen 세 층입니다. CarAppService는 intent filter에 androidx.car.app.category.NAVIGATION 카테고리를 선언하고 createHostValidator로 호스트를 검증한 뒤 onCreateSession으로 연결마다 Session을 만들고, Session은 onCreateScreen으로 첫 Screen을 정하며, Screen은 onGetTemplate으로 템플릿을 돌려주고 invalidate()로 갱신을 요청합니다. 내비게이션 앱은 androidx.car.app.NAVIGATION_TEMPLATES 권한으로 NavigationTemplate과 MapWithContentTemplate을 쓰고, deprecated된 MapTemplate, PlaceListNavigationTemplate, RoutePreviewNavigationTemplate은 MapWithContentTemplate으로 옮깁니다. 2026-10-07 기준 최신 stable은 1.7.0입니다. 지도는 androidx.car.app.ACCESS_SURFACE 권한을 선언하고 AppManager.setSurfaceCallback으로 등록한 SurfaceCallback의 onSurfaceAvailable()에서 받은 Surface에 그리며, onSurfaceDestroyed()에서 렌더링을 멈춥니다. onVisibleAreaChanged와 onStableAreaChanged가 알려 주는 가려지지 않는 영역 안에 차량과 경로를 두고, CarContext.isDarkMode에 맞춰 야간 지도를 그립니다. 폰과 차량에서 같은 지도 엔진을 쓰려면 렌더러가 View가 아닌 임의의 Surface에 그릴 수 있어야 하며, 이 점은 이 절의 SurfaceView 문항과 이어집니다.<\/p>\n<p>안내 상태는 NavigationManager로 호스트에 알립니다. 안내를 시작할 때 navigationStarted, 도착하거나 취소할 때 navigationEnded를 부르고, 재탐색 중에는 navigationEnded 대신 Trip.Builder.setLoading(true)를 씁니다. updateTrip으로 넘긴 정보는 차량에 따라 클러스터와 HUD에 쓰일 수 있고, 다른 앱이 안내를 시작해 호스트가 NavigationManagerCallback.onStopNavigation을 부르면 클러스터의 다음 회전 정보, 내비게이션 알림, 음성 안내를 멈춰야 합니다. Car App API Level 6부터는 FEATURE_CLUSTER를 선언해 지원 차량의 클러스터 디스플레이에 NavigationTemplate으로 지도 타일을 그릴 수 있습니다. 호스트는 Session마다 CarContext를 따로 만들므로 메인 화면과 클러스터 Session은 공유 싱글턴 같은 통로로 상태를 나눠야 하고, 폰 화면과 안내 서비스가 보는 Repository를 그대로 쓰면 됩니다.<\/p>\n<p>제약은 템플릿 흐름과 품질 기준에서 옵니다. 호스트는 한 작업에서 템플릿을 최대 5개까지만 허용하고 마지막은 NavigationTemplate 같은 정해진 종류여야 하며, 한도를 넘기면 오류를 보여 준 뒤 앱을 닫습니다. 같은 종류에 주요 내용이 같은 갱신은 한도에 세지 않고 NavigationTemplate에 도달하면 한도가 초기화되며, 목록 항목 수는 차량마다 달라 ConstraintManager.getContentLimit으로 확인합니다. 품질 기준은 턴바이턴 안내 제공(NF-1), 템플릿 surface에는 지도만 그리기(NF-2), 다른 앱이 안내 중이면 알림과 음성, 클러스터 정보를 내지 않기(NF-5), 주행을 흉내 내는 test drive 모드(NF-7) 등을 요구합니다. AAOS 내비게이션 앱은 CarAppActivity에 APP_MAPS 카테고리, geo scheme의 androidx.car.app.action.NAVIGATE intent filter, distractionOptimized meta-data를 추가로 선언합니다.<\/p>","f":"<ul>\n<li><strong>차량 화면에 안내 알림은 어떻게 띄웁니까?<\/strong> 알림을 setOngoing으로 진행 중 표시하고 카테고리를 CATEGORY_NAVIGATION으로 두며 CarAppExtender로 확장합니다. 차량 화면 하단 레일 위젯에 표시되고, 중요도를 IMPORTANCE_HIGH로 두면 헤드업 알림으로도 뜹니다. 차량 화면에 경로 안내 정보가 표시되는 동안에는 헤드업 알림이 억제됩니다.<\/li>\n<li><strong>템플릿 한도는 설계에 어떤 영향을 줍니까?<\/strong> 장소 검색에서 경로 미리보기, 안내 시작까지의 흐름을 얕게 설계해야 합니다. 같은 템플릿의 내용 갱신은 한도에 세지 않으므로 화면을 새로 쌓기보다 Screen.invalidate로 갱신하고, Screen 하나가 템플릿 종류 하나를 돌려주게 구성합니다.<\/li>\n<li><strong>차량 없이 어떻게 테스트합니까?<\/strong> Android Auto는 Desktop Head Unit으로, AAOS는 에뮬레이터로 시험합니다. 클러스터는 DHU의 보조 클러스터 디스플레이 설정이나 API 30 이상 AAOS 시스템 이미지로 확인하고, 품질 기준의 test drive 모드가 있으면 실제 주행 없이 안내 흐름을 반복해 볼 수 있습니다.<\/li>\n<\/ul>"},{"no":136,"t":"Android 16의 Live Updates(진행 상태 알림)는 무엇이고, 내비게이션 앱은 어떻게 쓸 수 있습니까?","a":"<p>Live Update는 사용자가 시작했고 지금 진행 중이며 시간에 민감한 활동을 시스템이 승격해 알림 창 맨 위, 잠금 화면, 상태 표시줄 칩에 눈에 띄게 보여 주는 알림입니다. 승격된 카드는 기본으로 펼쳐져 있고 접을 수 없습니다. Android 16(API 36)에 추가된 Notification.ProgressStyle이 차량 호출, 배달, 내비게이션처럼 출발과 도착이 있는 여정을 위한 템플릿이고, Live Update 문서도 진행 중인 내비게이션을 적합한 사례로 듭니다. 내비게이션 앱은 이미 띄우고 있는 포그라운드 서비스 알림을 승격 조건에 맞게 만들어 다음 회전과 남은 거리를 보여 주면 됩니다.<\/p>\n<p>승격 조건은 다음과 같습니다. 스타일이 Standard, BigTextStyle, CallStyle, ProgressStyle, MetricStyle 중 하나이고, 매니페스트에 런타임 권한이 아닌 POST_PROMOTED_NOTIFICATIONS를 선언하고, EXTRA_REQUEST_PROMOTED_ONGOING이나 NotificationCompat.Builder의 setRequestPromotedOngoing으로 승격을 요청하고, ongoing이며 contentTitle이 있어야 합니다. 반대로 RemoteViews로 만든 customContentView, 그룹 요약 알림, setColorized(true), IMPORTANCE_MIN 채널은 쓰면 안 됩니다. POST_PROMOTED_NOTIFICATIONS는 Android 16 QPR2의 API 36.1에 추가되었고 POST_NOTIFICATIONS에 더해 필요합니다. 승격 여부는 Notification.FLAG_PROMOTED_ONGOING으로, 앱 쪽 조건 충족 여부는 hasPromotableCharacteristics()로, 사용자가 설정에서 허용했는지는 NotificationManager.canPostPromotedNotifications()로 확인하고, 설정 화면은 Settings.ACTION_MANAGE_APP_PROMOTED_NOTIFICATIONS로 엽니다. 문서는 제조사가 추가 기준을 둘 수 있다고 적습니다.<\/p>\n<p>내비게이션에 맞추면 제목에 다음 회전 안내, 본문에 도착 예정 시각과 남은 거리를 넣고, ProgressStyle의 진행 값은 지나온 거리, Segment는 경로 구간별 혼잡도 색, Point는 경유지, 트래커 아이콘은 차량 아이콘으로 둡니다. 문서도 구간 색으로 교통 상태를 나타내고 교통 변화에 맞춰 색과 문구를 갱신하라고 권합니다. 상태 표시줄 칩에는 setShortCriticalText로 짧은 핵심 정보(7자 이내 권장, 표시 보장 없음)를 넣거나 setWhen에 도착 예정 시각을 넣어 남은 시간을 보여 줍니다. 경로를 다시 계산하는 동안에는 빈 칸 대신 재탐색 중이라는 문구를 보여 주고, 안내 종료 액션을 둡니다. 사용자가 알림을 닫으면 setDeleteIntent로 감지해 그 뒤로는 같은 ID로 갱신을 보내지 않습니다. 닫힌 알림에 갱신을 보내는 것이 곧 다시 띄우는 것이기 때문입니다. 승격만 내려 일반 알림이 되었다면 일반 알림으로 계속 갱신합니다.<\/p>\n<p>포그라운드 서비스와의 관계는 알림 하나로 정리합니다. 문서의 승격 조건에 포그라운드 서비스 알림을 제외하는 항목은 없으므로, startForeground에 넘긴 알림을 승격 조건에 맞게 만들고 같은 ID로 갱신하면 알림이 둘로 늘지 않습니다. 하위 버전은 androidx.core 1.17.0에 추가된 NotificationCompat.ProgressStyle과 setRequestPromotedOngoing으로 대응하는데, NotificationCompat.ProgressStyle은 SDK 36 미만에서 기본 알림 스타일로 대체되므로 진행 막대가 없어도 제목, 본문, 액션만으로 뜻이 통하게 만듭니다. iOS의 Live Activities와 Dynamic Island처럼 진행 상황을 보여 주는 경험을 Android에서 만들 때 쓰는 API가 ProgressStyle과 Live Update입니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 서비스 알림을 Live Update 조건에 맞춰 만든다(androidx.core 1.17.0 이상)\nval style = NotificationCompat.ProgressStyle()\n    .setStyledByProgress(false)\n    .setProgress(state.traveledM)                                    // 지나온 거리(구간 길이 합 기준)\n    .setProgressTrackerIcon(IconCompat.createWithResource(context, R.drawable.ic_vehicle))\n    .setProgressSegments(state.traffic.map { Segment(it.lengthM).setColor(it.color) })  // 혼잡도 색\nval notification = NotificationCompat.Builder(context, GUIDANCE_CHANNEL_ID)   // IMPORTANCE_MIN 채널 금지\n    .setSmallIcon(R.drawable.ic_navigation)\n    .setContentTitle(state.nextTurnText)                             // contentTitle 필수\n    .setContentText(state.etaText)\n    .setShortCriticalText(state.chipText)                            // 상태 표시줄 칩, 7자 이내 권장\n    .setOngoing(true)\n    .setRequestPromotedOngoing(true)                                 // 승격 요청\n    .setStyle(style)\n    .build()<\/code><\/pre>","f":"<ul>\n<li><strong>Live Update로 보내면 안 되는 알림은 무엇입니까?<\/strong> 문서는 광고, 프로모션, 채팅 메시지, 경보, 다가오는 일정, 앱 기능 바로가기를 부적합 사례로 듭니다. 택배 추적처럼 계속 지켜볼 필요가 없는 활동도 맞지 않다고 적으므로, 내비게이션 앱이라도 주변 추천이나 혼잡 경보는 일반 알림으로 보냅니다.<\/li>\n<li><strong>사용자가 Live Update를 꺼 두면 어떻게 됩니까?<\/strong> canPostPromotedNotifications()가 false가 되고 알림은 일반 알림으로 보입니다. 안내 기능에는 지장이 없으므로 설정 화면 안내는 한 번만 하고, 승격 조건을 확인하는 디버깅에는 사용자 설정을 고려하지 않는 hasPromotableCharacteristics()를 씁니다.<\/li>\n<li><strong>ProgressStyle의 진행 값은 무엇을 기준으로 잡습니까?<\/strong> 진행 값은 구간 길이 합과 같은 단위라서, 경로 전체 길이를 구간 길이의 합으로 두고 지나온 거리를 진행 값으로 넣으면 재탐색으로 경로가 바뀌어도 구간만 새로 넣으면 됩니다. 남은 시간처럼 줄어드는 값은 칩과 본문 문구로 보여 줍니다.<\/li>\n<\/ul>"},{"no":137,"t":"지도처럼 OpenGL로 그리는 화면에는 SurfaceView와 TextureView 중 무엇을 쓰고, 둘은 어떻게 다릅니까?","a":"<p>기본은 SurfaceView입니다. SurfaceView의 Surface는 SurfaceFlinger가 앱 UI와 따로, 기기가 지원하면 하드웨어 오버레이로 합성해 추가 GPU 복사가 없으므로 효율과 전력에 유리하고, AOSP 그래픽 문서도 API 24 이상에서는 TextureView 대신 SurfaceView를 쓰라고 권합니다. TextureView는 View 계층 안의 일반 View라 반투명, 회전, 클리핑이 자유롭지만, 내용을 내부적으로 복사해 GPU로 View 계층에 합성하므로 비용이 더 들고, 새 버퍼가 오면 View를 무효화해 다음 View 그리기에서 반영하므로 표시가 앱 UI의 프레임 처리에 묶입니다. Compose에서는 AndroidView로 직접 감싸기보다 Compose Foundation 1.6.0에 추가된 AndroidExternalSurface(SurfaceView 기반)와 AndroidEmbeddedExternalSurface(TextureView 기반)를 먼저 씁니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>SurfaceView<\/th>\n<th>TextureView<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>합성<\/td>\n<td>별도 레이어를 SurfaceFlinger가 합성, 가능하면 하드웨어 오버레이<\/td>\n<td>UI 툴킷이 GPU로 View 계층에 합성, 보이는 픽셀이 두 번 합성됨<\/td>\n<\/tr>\n<tr>\n<td>View alpha<\/td>\n<td>Android 14부터 지원<\/td>\n<td>지원<\/td>\n<\/tr>\n<tr>\n<td>회전, 클리핑<\/td>\n<td>지원하지 않음<\/td>\n<td>지원<\/td>\n<\/tr>\n<tr>\n<td>HDR<\/td>\n<td>전체 지원<\/td>\n<td>제한적(Android 13 이상)<\/td>\n<\/tr>\n<tr>\n<td>DRM 콘텐츠<\/td>\n<td>가능<\/td>\n<td>불가<\/td>\n<\/tr>\n<tr>\n<td>전제 조건<\/td>\n<td>창이 보일 때 Surface가 생기고 숨으면 파괴됨<\/td>\n<td>하드웨어 가속 창에서만 그려짐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>TextureView를 고르던 예전 이유는 대부분 사라졌습니다. SurfaceView 레퍼런스는 Android 7.0부터 창 위치가 다른 View와 동기적으로 갱신되어 옮기거나 확대해도 아티팩트가 생기지 않는다고 적고, 투명도도 Android 14부터 지원합니다. SurfaceView의 Surface는 기본으로 창 뒤에 놓이고 창에 구멍을 뚫어 보이게 하므로 지도 위 검색창과 버튼은 View 계층이 그 위에 합성하는데, 레퍼런스는 이때 Surface가 바뀔 때마다 알파 블렌딩 합성이 일어나 성능에 영향이 있을 수 있다고 적으므로 오버레이는 필요한 것만 둡니다.<\/p>\n<p>어려운 부분은 Surface 생명주기입니다. SurfaceHolder.Callback은 SurfaceView의 창을 돌리는 스레드(보통 메인 스레드)에서 불리고, 렌더 스레드는 surfaceCreated와 surfaceDestroyed 사이에서만 Surface를 만져야 합니다. surfaceDestroyed는 Surface가 사라지기 직전에 불리므로 반환하기 전에 렌더 스레드가 그리기를 멈추고 EGL Surface를 정리하도록 동기화합니다. AOSP 문서는 Activity와 Surface 생명주기를 별개의 상태 기계로 설명하는데, 뒤로 가기에서는 onPause 다음 surfaceDestroyed가 오지만 전원 버튼으로 화면을 끄면 onPause만 오고 Surface가 살아 있어 렌더링이 계속될 수 있습니다. 그래서 화면이 보이지 않으면 프레임 콜백을 멈추고 주행 안내 계산은 서비스가 이어 갑니다. Car App Library의 SurfaceCallback도 onSurfaceAvailable과 onSurfaceDestroyed로 같은 모양이라, 지도 렌더러를 Surface 붙이기, 크기 변경, 떼기 세 동작으로 추상화해 두면 폰과 차량 화면에서 같은 엔진을 쓸 수 있습니다.<\/p>\n<p>AndroidExternalSurface는 onInit 안의 onSurface 콜백으로 Surface와 크기를 주고, Surface가 파괴되면 onDestroyed를 부른 뒤 onSurface 코루틴을 취소합니다. API 문서는 AndroidEmbeddedExternalSurface가 GPU 합성이라 전력과 메모리 대역폭을 더 쓸 수 있다며 가능하면 AndroidExternalSurface를 쓰라고 하고, 다른 위젯 사이에 끼우거나 graphicsLayer 효과에 참여해야 할 때를 Embedded가 쓸모 있는 경우로 듭니다. 지도 SDK의 MapView처럼 내부 Surface를 SDK가 정하는 경우는 3절의 지도 SDK 문항처럼 AndroidView로 넣습니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 지도 렌더러를 SurfaceView 기반 Surface에 붙인다\nAndroidExternalSurface(modifier = Modifier.fillMaxSize()) {\n    onSurface { surface, width, height -&gt;\n        val renderer = MapRenderer(surface, width, height)   // 별도 렌더 스레드에서 EGL 준비\n        surface.onChanged { w, h -&gt; renderer.resize(w, h) }\n        surface.onDestroyed { renderer.stopAndRelease() }    // 반환 전에 렌더링을 멈춘다\n        renderer.start()\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>TextureView를 써야 하는 경우는 언제입니까?<\/strong> 지도를 둥근 카드 안에 잘라 넣거나 회전하는 전환 애니메이션에 쓰거나, 다른 UI 사이에 끼워야 할 때입니다. 회전과 클리핑은 SurfaceView가 지원하지 않기 때문입니다. 반투명만 필요하다면 Android 14 이상에서는 SurfaceView로도 됩니다.<\/li>\n<li><strong>TextureView에서 GL로 그리면 어떤 문제가 생길 수 있습니까?<\/strong> AOSP 문서는 GLES로 TextureView에 그리면 BufferQueue의 생산자와 소비자가 같은 스레드에 있게 되어 버퍼 교환이 멈추거나 실패할 수 있다고 설명합니다. 이를 막으려고 BufferQueue는 새 버퍼가 들어오면 이전에 가져간 버퍼 내용을 버리고 버퍼 수를 제한하므로, 앱은 UI 스레드가 아닌 별도 렌더 스레드에서 그리고 오래된 프레임이 버려질 수 있다는 전제로 만듭니다.<\/li>\n<li><strong>발열이나 저사양 기기에서 프레임이 떨어지면 무엇을 할 수 있습니까?<\/strong> Surface 해상도를 화면보다 낮게 잡아 그리고 늘려 표시하는 방법이 있습니다. AndroidExternalSurface의 surfaceSize나 SurfaceHolder.setFixedSize로 지정하며, 지도 글자가 흐려지지 않는 선에서 기기 등급별로 정합니다.<\/li>\n<\/ul>"}]},{"no":8,"title":"자료구조와 알고리즘","qs":[{"no":138,"t":"HashMap은 어떻게 동작하고, 충돌이 많을 때와 Java 8 이후 무엇이 바뀌었습니까? equals와 hashCode 계약을 어기면 어떻게 됩니까?","a":"<p>HashMap은 키의 hashCode로 버킷 배열의 칸을 정하고, 같은 칸에 들어온 항목은 노드로 이어 두는 체이닝 방식입니다. 해시가 고르게 퍼지면 get과 put이 평균 O(1)이지만, 키가 한 버킷에 몰리면 그 버킷을 equals로 하나씩 비교해야 해서 최악 O(n)이 됩니다. Java 8(JEP 180)부터는 몰린 버킷을 레드블랙 트리로 바꿔 최악을 O(log n)으로 낮춥니다.<\/p>\n<p>OpenJDK 소스 기준으로 기본 용량은 16, load factor는 0.75이고, 원소 수가 용량의 75%를 넘으면 테이블을 두 배로 키웁니다. 노드가 8개 이상인 버킷에 원소를 더하면 그 버킷을 트리로 바꾸는데(TREEIFY_THRESHOLD = 8), 테이블 용량이 64보다 작으면 트리 대신 테이블을 먼저 키우고, resize로 나뉜 버킷이 6개 이하가 되면 다시 리스트로 돌립니다. 트리 노드는 일반 노드의 약 두 배 크기라 정말 몰릴 때만 씁니다. O(log n)에도 조건이 있습니다. 키의 해시가 서로 다르거나 키가 Comparable이어야 해서, 해시가 같고 비교할 수도 없는 키가 쏟아지면 트리 안에서도 순차 탐색에 가까워집니다. 버킷 위치는 hash &amp; (n - 1)로 구하는데 하위 비트만 쓰면 충돌이 늘기 때문에, hashCode의 상위 16비트를 하위 16비트에 XOR해 섞은 값을 씁니다.<\/p>\n<p>계약은 equals가 true인 두 객체는 hashCode도 같아야 한다는 것입니다. 반대는 성립하지 않아도 되고 그것이 충돌입니다. equals만 재정의하면 논리적으로 같은 두 객체가 다른 버킷으로 가서 HashSet에 중복으로 들어가고 contains가 false를 돌려줍니다. 실무에서 더 흔한 것은 키를 넣은 뒤 hashCode에 쓰이는 필드를 바꾸는 실수입니다. HashMap은 넣을 때 계산한 해시를 노드에 저장해 두므로 바뀐 키로는 찾지 못하고, 원래 항목은 꺼낼 수 없는 채로 남아 누수가 됩니다. Kotlin data class는 주 생성자 프로퍼티로만 equals와 hashCode를 만들고 배열 프로퍼티는 참조로 비교하므로, 키로 쓰는 클래스는 val만 둔 불변 타입으로 만듭니다. data class의 함정은 1절의 data class 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>data class GridCell(var x: Int, var y: Int)   // var라 키로 쓰면 위험\n\nval visited = hashSetOf(GridCell(1, 2))\nval cell = visited.first()\ncell.x = 3                                     // 넣은 뒤 hashCode가 바뀜\nprintln(cell in visited)                       // false: 저장된 해시와 달라 못 찾음\nprintln(visited.size)                          // 1: 원래 항목은 꺼낼 수 없이 남음<\/code><\/pre>","f":"<ul>\n<li><strong>원소 수를 미리 알면 무엇을 합니까?<\/strong> 예상 개수를 0.75로 나눈 값보다 큰 용량으로 만들어 resize를 없앱니다. 0.75는 공간 낭비와 충돌 확률 사이의 절충값이고, 소스 주석은 무작위 해시에서 버킷당 노드 수가 평균 약 0.5인 포아송 분포를 따라 길이 8인 버킷은 거의 생기지 않는다고 설명합니다.<\/li>\n<li><strong>String을 키로 쓰면 해시 충돌 공격에도 버팁니까?<\/strong> String은 Comparable이라 같은 해시를 내는 키가 한 버킷에 몰려도 트리 버킷에서 O(log n)이 유지됩니다. 비교할 수 없는 커스텀 키는 이 보장이 없으므로, 외부 입력을 그대로 키로 받는 곳에서는 키 타입까지 봅니다.<\/li>\n<li><strong>equals에는 어떤 조건이 더 있습니까?<\/strong> 반사성, 대칭성, 추이성, 일관성, null과 비교하면 false입니다. 상속 관계에서는 대칭성이 깨지기 쉬워 상속 대신 합성을 권합니다.<\/li>\n<\/ul>"},{"no":139,"t":"Android의 ArrayMap과 SparseArray는 HashMap과 무엇이 다르고 언제 씁니까?","a":"<p>둘 다 속도가 아니라 메모리를 아끼려고 만든 컨테이너입니다. HashMap은 항목마다 노드 객체를 만들고 Int 키를 Integer로 박싱합니다. ArrayMap은 해시 코드를 담은 int 배열과 키, 값을 담은 Object 배열에 매핑을 저장해 항목별 객체가 없고, SparseArray는 int 키 자체를 정렬된 배열에 담아 박싱과 항목 객체를 모두 없앱니다. 대신 조회가 이진 탐색이라 O(log n)이고 추가와 삭제는 배열 원소를 밀어야 해서, 공식 문서도 일반적으로 HashMap보다 느리고 항목이 수백 개까지인 컨테이너에서는 그 차이가 50% 미만이라고 적습니다.<\/p>\n<p>그래서 기준은 크기와 개수입니다. 항목이 수백 개를 넘지 않는 작은 맵이 많이 만들어지고 메모리와 GC 부담이 문제인 곳, 예를 들어 목록 항목마다 붙는 속성 맵이나 int ID로 찾는 화면 상태에 씁니다. 문서는 항목이 많은 자료구조용이 아니라고 적으므로 큰 맵이나 삽입과 삭제가 잦은 맵은 HashMap이 맞습니다. 둘 다 스레드 안전하지 않습니다. 삭제 동작도 다릅니다. ArrayMap은 항목을 지우면 배열을 줄이고, SparseArray는 바로 압축하지 않고 deleted로 표시해 두었다가 배열을 키우거나 크기나 값을 조회할 때 한꺼번에 정리합니다. 값이 기본형이면 SparseIntArray, SparseBooleanArray, SparseLongArray를, 키가 Long이면 LongSparseArray를 씁니다. 플랫폼 버전과 무관하게 같은 구현을 쓰려면 androidx.collection의 ArrayMap과 SparseArrayCompat을 씁니다.<\/p>\n<p>충돌 처리 방식으로 보면 Java HashMap은 체이닝이고, ArrayMap은 해시 코드를 쓰지만 버킷 배열이 아니라 정렬 배열을 이진 탐색하며, SparseArray는 해시를 쓰지 않습니다. 노드 없이 배열 안 다른 칸을 탐사하는 오픈 어드레싱은 캐시에 유리하지만 차오를수록 클러스터링으로 느려지고 삭제에 묘비 표시가 필요합니다. Android에서는 androidx.collection 1.4.0에서 추가된 ScatterMap이 매핑을 노드가 아니라 배열에 직접 저장하는 flat 해시 테이블이고, IntObjectMap, IntIntMap 같은 기본형 맵과 IntList도 함께 들어왔습니다. 평균 O(1) 조회를 박싱 없이 원할 때는 이쪽이 선택지입니다.<\/p>","f":"<ul>\n<li><strong>SparseArray의 삽입 비용은?<\/strong> 정렬을 유지하려고 뒤쪽 원소를 밀어야 해서 O(n)입니다. 키가 기존 키보다 모두 크면 끝에 붙기만 하므로, 문서도 이 경우를 최적화한 append를 따로 둡니다.<\/li>\n<li><strong>순회 순서는 어떻게 됩니까?<\/strong> SparseArray는 keyAt(i)를 인덱스 순으로 돌면 키 오름차순이 보장됩니다. ArrayMap은 해시 코드 순서라 삽입 순서가 아니므로, 삽입 순서가 필요하면 LinkedHashMap을 씁니다.<\/li>\n<li><strong>Lint가 HashMap 대신 SparseArray를 권하면 그대로 바꿉니까?<\/strong> 크기와 연산 패턴을 보고 정합니다. 수백 개를 넘거나 삽입과 삭제가 잦으면 HashMap이 낫고, 작은 맵이 많아 메모리가 문제일 때 바꿉니다.<\/li>\n<\/ul>"},{"no":140,"t":"ArrayList와 LinkedList는 실제로 어떻게 다르고, 캐시 지역성은 왜 중요합니까?","a":"<p>중간 삽입이 잦다는 이유만으로 LinkedList를 고르지 않습니다. LinkedList 삽입이 O(1)이라는 말은 넣을 위치의 노드를 이미 쥐고 있을 때 이야기이고, 인덱스로 위치를 찾는 O(n) 순회가 먼저 듭니다. ArrayList의 중간 삽입도 O(n)이지만 뒤쪽 원소를 System.arraycopy로 한 번에 미는 연속 메모리 복사라, 실제로는 LinkedList보다 빠른 경우가 많습니다. Kotlin의 mutableListOf()도 JVM에서는 ArrayList입니다.<\/p>\n<p>차이를 만드는 것은 캐시 지역성입니다. CPU는 메모리를 바이트 단위가 아니라 캐시 라인 단위로 읽고, 순차 접근을 감지하면 다음 라인을 미리 가져옵니다. 연속 배열은 한 번 읽을 때 이웃 원소가 함께 들어오지만, LinkedList는 노드가 힙 곳곳에 흩어져 있어 next를 따라갈 때마다 새 메모리 접근과 캐시 미스가 납니다. 노드마다 객체 헤더와 prev, next 참조가 붙어 메모리를 더 쓰고 GC가 훑을 객체도 늘어납니다. 같은 O(n) 순회인데도 속도 차이가 큰 이유입니다. JVM과 ART에서는 한 단계가 더 있습니다. <code>ArrayList&lt;Int&gt;<\/code>는 Integer 객체를 가리키는 참조 배열이라 참조는 연속이어도 값은 흩어질 수 있습니다. 좌표나 거리처럼 기본형을 많이 다루면 IntArray, DoubleArray가 진짜 연속 메모리입니다. 박싱과 할당 비용은 8절의 상수 비용 문항에서 다룹니다.<\/p>\n<p>LinkedList가 이기는 경우는 ListIterator로 위치를 잡은 채 삽입과 삭제를 반복할 때 정도이고, 양 끝 작업이 목적이면 원형 배열인 ArrayDeque가 더 낫습니다. 판단은 실제 크기와 연산 패턴으로 측정해서 하고, Android에서는 Jetpack Microbenchmark로 잽니다. 숫자 없이 복잡도 표만으로 자료구조를 바꾸자는 리뷰는 측정을 요청합니다.<\/p>","f":"<ul>\n<li><strong>목록 화면의 데이터를 LinkedList로 들고 있으면 무엇이 문제입니까?<\/strong> RecyclerView 어댑터나 LazyColumn은 position으로 항목을 꺼내는데, LinkedList의 get(i)는 가까운 쪽 끝에서부터 노드를 하나씩 따라가는 O(n)이라 스크롤 전체가 O(n²)이 됩니다. 인덱스로 도는 Compose ui-util의 fastForEach도 임의 접근이 효율적이지 않을 수 있는 컬렉션에는 오히려 느려질 수 있으니, 직접 만들어 임의 접근이 보장된 목록에만 쓰라고 KDoc에 적혀 있습니다.<\/li>\n<li><strong>ArrayDeque는 왜 LinkedList보다 빠릅니까?<\/strong> 원형 배열이라 양 끝 삽입과 삭제가 분할상환 O(1)이고 노드 객체를 만들지 않습니다. 스택과 큐 모두 이것으로 씁니다.<\/li>\n<li><strong>ArrayList의 add가 분할상환 O(1)인 이유는?<\/strong> 가득 차면 일정량이 아니라 배수로 키워서, n개를 넣는 동안 복사 총량이 O(n)에 머뭅니다. 크기를 미리 알면 ArrayList(n)으로 재할당을 없앱니다.<\/li>\n<\/ul>"},{"no":141,"t":"LRU 캐시는 어떻게 구현하고, Android 이미지 캐시에는 어떻게 쓰입니까?","a":"<p>해시맵과 이중 연결 리스트를 함께 씁니다. 해시맵은 키로 노드를 O(1)에 찾고, 리스트는 사용 순서를 유지합니다. 접근하면 노드를 가장 최근 쪽 끝으로 옮기고, 용량을 넘으면 가장 오래된 쪽 끝의 노드를 지우며 해시맵에서도 뺍니다. 이중 연결이어야 중간 노드를 앞 노드 탐색 없이 O(1)에 떼어 낼 수 있습니다.<\/p>\n<p>Java에서는 LinkedHashMap이 이 구조 그대로입니다. accessOrder를 true로 만들면 get할 때마다 항목이 끝으로 이동하고, removeEldestEntry를 재정의하면 넣을 때 가장 오래된 항목을 지울 수 있습니다. 실무에서는 직접 만들지 않고 android.util.LruCache나 androidx.collection.LruCache를 씁니다. android.util.LruCache는 내부에 accessOrder가 true인 LinkedHashMap을 두고, put 뒤 trimToSize에서 가장 오래된 항목부터 지웁니다. sizeOf를 재정의하면 항목 수가 아니라 바이트 같은 단위로 용량을 잡을 수 있고, 문서상 스레드 안전하며, entryRemoved로 밀려난 항목을 정리합니다.<\/p>\n<p>이미지 캐시라면 sizeOf가 Bitmap의 바이트 수를 돌려주고, 전체 용량은 앱 힙 한도와 화면에 동시에 보이는 이미지 양을 기준으로 정한 뒤 측정으로 조정합니다. onTrimMemory 신호를 받으면 trimToSize나 evictAll로 줄입니다. 다만 지금은 Coil이나 Glide 같은 이미지 로딩 라이브러리가 메모리 캐시와 디스크 캐시, 표시 크기 디코딩까지 해 주므로 비트맵 LRU를 직접 운영할 일은 드뭅니다. 직접 만드는 경우는 지도 타일이나 경로 계산 결과처럼 라이브러리가 모르는 데이터이고, 라이브러리 쪽 세부는 6절의 이미지 로딩 라이브러리 문항에서 다룹니다. LRU의 약점은 한 번 훑고 지나가는 스캔이 자주 쓰는 항목을 밀어낸다는 점입니다. 지도를 빠르게 멀리 끌면 한 번 보고 말 타일이 자주 보는 동네 타일을 밀어내는 식이라, 서버 쪽 Caffeine 같은 라이브러리는 빈도까지 보는 W-TinyLFU를 씁니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: LinkedHashMap으로 만드는 LRU\nclass LruMap&lt;K, V&gt;(private val maxEntries: Int) :\n    LinkedHashMap&lt;K, V&gt;(16, 0.75f, true) {                 // accessOrder = true\n    override fun removeEldestEntry(eldest: MutableMap.MutableEntry&lt;K, V&gt;?) =\n        size &gt; maxEntries\n}\n\n// 실무: android.util.LruCache를 바이트 기준으로\nval tileCache = object : LruCache&lt;TileKey, Bitmap&gt;(maxBytes) {\n    override fun sizeOf(key: TileKey, value: Bitmap) = value.allocationByteCount\n}<\/code><\/pre>","f":"<ul>\n<li><strong>단일 연결 리스트로는 왜 안 됩니까?<\/strong> 노드를 떼려면 앞 노드를 알아야 해서 O(n) 탐색이 생깁니다.<\/li>\n<li><strong>sizeOf가 돌려주는 값이 나중에 바뀌면?<\/strong> LruCache 문서는 캐시에 있는 동안 항목 크기가 바뀌면 안 된다고 적습니다. 바뀌어도 바로 예외가 나지는 않고 용량 계산이 조용히 어긋나며, 합계가 음수가 되거나 항목이 모두 빠졌는데 합계가 0이 아닐 때에야 trimToSize가 IllegalStateException을 던집니다. 그래서 크기가 변하는 객체는 넣기 전에 크기를 고정하거나, 캐시에서 뺀 뒤 바꿔서 다시 넣습니다.<\/li>\n<li><strong>SoftReference로 캐시를 만들면 안 됩니까?<\/strong> Android의 SoftReference 문서가 캐시에 쓰지 말라고 적습니다. 런타임은 어떤 참조를 지우고 남길지 판단할 정보가 없어서, 크기를 정한 LruCache가 낫습니다.<\/li>\n<\/ul>"},{"no":142,"t":"힙과 우선순위 큐는 어디에 씁니까? Top-K와 최단 경로를 예로 설명해 보세요.","a":"<p>힙은 최솟값이나 최댓값 하나를 O(1)에 보고, 넣기와 꺼내기를 O(log n)에 하는 완전 이진 트리이며 배열로 표현합니다. 전체를 정렬할 필요 없이 지금 가장 작은 것이나 가장 큰 것만 계속 필요할 때 씁니다. JVM에서는 java.util.PriorityQueue가 이진 힙이고 Kotlin도 이것을 그대로 씁니다.<\/p>\n<p>Top-K는 크기 K짜리 힙 하나로 풉니다. 응답 시간 상위 100건처럼 가장 큰 K개를 뽑으려면 최소 힙을 유지하면서, 다 찼을 때 새 값이 힙의 최솟값보다 클 때만 최솟값을 빼고 넣습니다. 지금까지 뽑힌 K개 중 가장 작은 값이 탈락 기준이라 그것을 O(1)로 봐야 하기 때문입니다. 시간 O(N log K), 메모리 O(K)라 건수가 많아도 스트림으로 읽으며 처리할 수 있고, 전체 정렬은 O(N log N)에 메모리 N이 듭니다. 반대로 현재 위치에서 가까운 장소 K개처럼 가장 작은 K개는 최대 힙을 씁니다. 데이터가 여러 서버에 나뉘어 있으면 서버마다 K개를 구한 뒤 모아서 다시 고릅니다.<\/p>\n<p>최단 경로에서는 다익스트라가 우선순위 큐로 아직 확정되지 않은 정점 중 거리가 가장 짧은 정점을 꺼냅니다. PriorityQueue에는 키 감소 연산이 없으므로 거리가 줄 때마다 새 항목을 넣고, 꺼낸 거리가 이미 기록된 거리보다 크면 버리는 지연 삭제를 씁니다. 그래도 O((V + E) log V)가 유지됩니다. A*의 열린 목록, 정렬된 파일 여러 개를 합치는 k-way 병합, 마감이 가장 이른 작업부터 꺼내는 타이머 큐도 같은 구조입니다.<\/p>\n<p>주의할 점은 PriorityQueue를 순회하거나 toString으로 찍으면 정렬 순서가 아니라는 것입니다. 힙은 부모가 자식보다 작거나 같다는 것만 보장하므로, 정렬된 결과는 poll을 반복하거나 따로 정렬해서 얻습니다. 스레드 안전하지 않아 여러 스레드가 함께 쓰면 PriorityBlockingQueue를 씁니다.<\/p>\n<pre class=\"kotlin\"><code>// 가까운 장소 K개: 크기 K의 최대 힙을 유지(맨 위가 지금까지 가장 먼 후보)\nfun nearestK(places: List&lt;Place&gt;, k: Int, distanceTo: (Place) -&gt; Double): List&lt;Place&gt; {\n    val heap = PriorityQueue&lt;Pair&lt;Place, Double&gt;&gt;(k + 1, compareByDescending { it.second })\n    for (p in places) {\n        heap.add(p to distanceTo(p))          // 거리는 한 번만 계산해 함께 보관\n        if (heap.size &gt; k) heap.poll()        // 가장 먼 후보를 버림\n    }\n    return heap.sortedBy { it.second }.map { it.first }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>배열로 힙을 만드는 heapify가 O(n log n)이 아니라 O(n)인 이유는?<\/strong> 노드 대부분이 아래쪽에 있고 그 노드들은 내려갈 높이가 짧아서, 높이 합을 계산하면 O(n)입니다.<\/li>\n<li><strong>우선순위가 같은 항목은 어떤 순서로 나옵니까?<\/strong> 힙은 안정적이지 않아 순서가 보장되지 않습니다. 먼저 들어온 것을 먼저 꺼내야 하면 넣은 순번을 두 번째 비교 키로 둡니다.<\/li>\n<li><strong>정확한 순위가 아니라 p99 같은 백분위만 필요하면?<\/strong> HDR Histogram이나 t-digest 같은 요약 구조로 메모리를 더 줄입니다. Quickselect는 평균 O(N)이지만 전체를 메모리에 올려야 해서 스트림 처리에는 맞지 않습니다.<\/li>\n<\/ul>"},{"no":143,"t":"최단 경로는 BFS, 다익스트라, A*를 어떻게 고르고, 실제 지도 서비스는 왜 전처리 기법을 씁니까?","a":"<p>간선에 가중치가 없으면 BFS, 음수가 없는 가중치면 다익스트라, 목적지까지 남은 비용의 하한을 추정할 수 있으면 A*입니다. 음수 간선이 있으면 벨만 포드를 씁니다. 실제 도로망은 대륙 규모 그래프라 요청마다 다익스트라나 A*를 돌리면 탐색 범위가 너무 넓어서, 도로망을 미리 가공해 두고 질의 때 탐색할 정점 수를 줄이는 전처리 기법을 씁니다. 대표가 Contraction Hierarchies와 Customizable Route Planning이고, 둘을 가르는 기준은 교통 정보처럼 가중치가 바뀔 때 다시 계산하는 비용입니다.<\/p>\n<p>BFS는 거리 1, 2, 3 순서로 층을 넓혀 가므로 처음 도착한 순간이 최단 거리이고 O(V + E)입니다. DFS는 먼저 도착한 경로가 짧다는 보장이 없어 최단 경로에 쓰지 않습니다. 다익스트라는 확정되지 않은 정점 중 거리가 가장 짧은 정점은 더 짧아질 수 없다는 탐욕적 가정 위에 있어, 모든 간선이 음수가 아니면 맞지만 음수 간선이 있으면 이미 확정한 값이 틀릴 수 있습니다. A*는 다익스트라의 우선순위에 남은 비용 추정치 h를 더해 목적지 쪽을 먼저 탐색하고, h가 실제 남은 비용보다 크지 않으면 최단 경로를 보장합니다. 비용이 소요 시간이면 직선 거리를 그대로 더하지 않고 도로망의 최고 속도로 나눈 값을 h로 써야 하한이 유지됩니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>방법<\/th>\n<th>전처리<\/th>\n<th>질의<\/th>\n<th>가중치가 바뀔 때<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>다익스트라, A*<\/td>\n<td>없음<\/td>\n<td>탐색 범위가 가장 넓음<\/td>\n<td>바로 반영<\/td>\n<\/tr>\n<tr>\n<td>ALT(랜드마크 기반 A*)<\/td>\n<td>랜드마크까지 거리를 미리 계산<\/td>\n<td>더 정확한 하한으로 탐색이 줄어듦<\/td>\n<td>CH보다 유연<\/td>\n<\/tr>\n<tr>\n<td>Contraction Hierarchies<\/td>\n<td>덜 중요한 정점부터 축약하며 지름길 간선 추가<\/td>\n<td>중요도가 높은 쪽으로만 가는 양방향 탐색이라 가장 빠름<\/td>\n<td>축약을 다시 해야 해 느림<\/td>\n<\/tr>\n<tr>\n<td>CRP, Multi-Level Dijkstra<\/td>\n<td>그래프를 여러 단계의 셀로 분할하고 셀 안 비용을 계산<\/td>\n<td>빠름, 대규모 거리 행렬은 CH가 유리<\/td>\n<td>셀 비용 계산 단계만 다시 함<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>CH는 덜 중요한 교차로부터 하나씩 축약하면서 그 교차로를 지나는 최단 경로를 지름길 간선으로 대신 넣어 둡니다. 질의 때는 출발지와 목적지 양쪽에서 중요도가 높은 쪽으로만 탐색해 만나므로 탐색 공간이 작습니다. 대신 가중치가 바뀌면 축약을 다시 해야 해서, GraphHopper 문서도 CH 기반 speed mode는 미리 정한 차량 프로필만 쓸 수 있고 랜드마크 기반 hybrid mode가 요청별 변경이나 교통 데이터 통합에 더 유연하다고 적습니다. CRP는 그래프 분할은 한 번만 하고 셀 안 비용을 계산하는 단계를 따로 두어, 새 비용 함수를 몇 초 안에 반영하고 회전 비용도 지원한다고 발표되었습니다. OSRM도 CH와 Multi-Level Dijkstra 두 전처리 파이프라인을 제공하면서 대규모 거리 행렬 같은 특수한 경우가 아니면 MLD를 기본으로 권합니다. 실시간 교통과 좌회전 금지 같은 회전 제한을 함께 반영해야 하는 내비게이션에서는 이 트레이드오프가 엔진 선택의 핵심입니다.<\/p>\n<p>클라이언트 입장에서 경로 탐색은 서버 몫입니다. 앱은 출발지, 목적지, 경유지, 경로 옵션을 보내고 경로 선과 안내 지점을 받아 그리며, 주행 중 경로를 벗어나면 재탐색을 요청합니다. 이탈 판단과 재탐색 시점은 7절의 경로 이탈 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>다익스트라를 구현할 때 자주 틀리는 곳은?<\/strong> 지연 삭제 없이 낡은 항목을 다시 처리하는 것, BFS처럼 큐에 넣을 때 확정해 버려 나중에 오는 더 짧은 경로를 놓치는 것, 거리 초깃값 Int.MAX_VALUE에 가중치를 더해 오버플로가 나는 것입니다.<\/li>\n<li><strong>A*의 휴리스틱이 실제보다 크게 추정하면?<\/strong> 탐색은 줄지만 최단 경로 보장이 깨집니다. 삼각 부등식을 만족하는 일관된 휴리스틱이면 한 번 확정한 정점을 다시 열 필요도 없습니다.<\/li>\n<li><strong>양방향 탐색은 왜 빠릅니까?<\/strong> 반지름 r인 원 하나 대신 반지름 r/2인 원 두 개를 탐색하는 셈이라 2차원 도로망에서는 면적으로 따져 절반이 됩니다. CH 질의도 양방향 탐색 위에서 동작합니다.<\/li>\n<li><strong>음수 간선은 언제 생깁니까?<\/strong> 소요 시간이나 거리 비용에는 없고, 할인이나 보상을 비용에 섞을 때 생깁니다. 그때는 모든 간선을 V-1번 완화하는 벨만 포드(O(VE))를 쓰고, V번째에도 줄어들면 음수 사이클입니다.<\/li>\n<\/ul>"},{"no":144,"t":"검색어 자동완성에는 어떤 자료구조를 쓰고, 클라이언트와 서버는 역할을 어떻게 나눕니까?","a":"<p>자료구조의 기본은 트라이입니다. 문자 하나가 간선 하나라서 접두사 길이 L에 대해 O(L)로 해당 노드에 도달하고, 그 아래가 모두 후보입니다. 실제 서비스는 입력마다 하위 트리를 다 훑을 수 없으므로 노드마다 인기 상위 k개를 미리 저장해 바로 돌려줍니다. 역할은 데이터가 어디 있느냐로 나눕니다. 전체 장소 데이터와 인기도, 현재 위치 가중치가 필요한 후보 생성과 순위는 서버가 맡고, 클라이언트는 최근 검색어와 즐겨찾기처럼 기기에 있는 작은 데이터의 매칭, 입력 제어, 결과 캐시, 표시를 맡습니다.<\/p>\n<p>트라이는 노드가 많아 메모리를 많이 씁니다. 자식이 하나뿐인 경로를 합친 radix tree로 줄이거나, 공통 접미사까지 공유하는 FST 같은 압축 구조를 씁니다. 기기 안 데이터는 대개 작아서 정렬된 배열에서 이진 탐색으로 접두사 범위를 찾는 편이 단순하고 가볍고, 최근 검색어 수십 개는 선형 검색으로도 충분합니다.<\/p>\n<p>한국어 검색에는 두 가지가 더 필요합니다. 첫째는 초성 검색입니다. 완성형 한글 음절은 유니코드 표준 3.12절의 산식으로 초성, 중성, 종성 인덱스를 계산해 분해할 수 있으므로, 장소명의 초성 문자열을 따로 색인해 \"ㄱㄴㅇ\"으로 \"강남역\"을 찾게 합니다. 둘째는 입력 중인 조합 글자입니다. \"가나\"를 치는 동안 입력값은 \"ㄱ\", \"가\", \"간\", \"가나\"로 바뀌므로, 음절 단위로 접두사를 비교하면 \"간\"일 때 \"가나다\"를 놓쳐 후보가 사라졌다가 다시 나타납니다. 마지막 음절을 자모로 분해해 비교하면 이 문제를 막습니다.<\/p>\n<p>클라이언트의 입력 제어는 디바운스로 요청 수를 줄이고, 입력이 바뀌면 이전 요청을 취소해 늦게 온 옛 응답이 최신 결과를 덮어쓰지 않게 하며, 접두사별 결과를 작은 LRU에 캐시해 지웠다가 다시 친 입력은 바로 보여 주는 것입니다. Flow 조합은 2절의 검색어 자동완성 문항, 화면 전체 설계는 11절의 장소 검색 화면 설계 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>// 완성형 한글 음절을 초성, 중성, 종성 인덱스로 분해(유니코드 3.12절 산식)\nfun decompose(c: Char): Triple&lt;Int, Int, Int&gt;? {\n    val s = c - &#39;가&#39;                            // SIndex\n    if (s !in 0 until 11172) return null            // SCount = 19 * 21 * 28\n    return Triple(s / 588, (s % 588) / 28, s % 28)  // NCount = 588, TCount = 28\n}\n\nprivate const val CHOSEONG = &quot;ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ&quot;\n\nfun choseongOf(text: String): String =\n    text.map { ch -&gt; decompose(ch)?.let { CHOSEONG[it.first] } ?: ch }.joinToString(&quot;&quot;)<\/code><\/pre>","f":"<ul>\n<li><strong>트라이의 자식 노드는 배열과 HashMap 중 무엇으로 둡니까?<\/strong> 알파벳처럼 문자 집합이 작으면 배열이 빠르고, 한글이나 유니코드 전체면 HashMap이나 정렬된 자식 배열이 메모리를 아낍니다.<\/li>\n<li><strong>오타가 있는 입력은 어떻게 다룹니까?<\/strong> 사전 단어와의 편집 거리를 쓰되 전체와 비교하면 비싸므로, BK 트리나 n-gram 색인으로 후보를 좁힌 뒤 계산합니다. 편집 거리는 8절의 동적 계획법 문항에서 다룹니다.<\/li>\n<li><strong>기기 결과와 서버 결과는 어떻게 합칩니까?<\/strong> 기기 결과를 먼저 보여 주고 서버 결과가 오면 ID로 중복을 없애 합칩니다. 순위 기준을 한곳에서 정해야 결과가 도착할 때마다 순서가 뒤집히지 않습니다.<\/li>\n<\/ul>"},{"no":145,"t":"내 주변 장소 검색에는 어떤 공간 인덱스를 씁니까? Geohash, Quadtree, R-tree, S2, H3를 비교해 보세요.","a":"<p>위도와 경도 컬럼에 인덱스를 따로 걸면 한 축의 범위만 좁혀져 비효율적이라, 2차원을 다루는 공간 인덱스가 필요합니다. 방식은 두 갈래입니다. Geohash, S2, H3는 지구 표면을 셀로 나눠 셀 ID라는 1차원 키를 만들고 이를 일반 B-트리나 키 값 저장소에 넣습니다. Quadtree와 R-tree는 공간 자체를 트리로 나눕니다. 어느 쪽이든 인덱스는 후보를 좁히는 데까지만 쓰고, 마지막에 실제 거리를 계산해 반경 밖을 거르고 정렬합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>방식<\/th>\n<th>나누는 방법<\/th>\n<th>강점<\/th>\n<th>주의할 점<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Geohash<\/td>\n<td>위도, 경도 비트를 번갈아 섞은 Z-order 격자를 base32 문자열로 표현<\/td>\n<td>문자열 접두사 검색으로 기존 인덱스를 그대로 씀<\/td>\n<td>공통 접두사가 길면 가깝지만 역은 성립하지 않음, 180도 자오선과 적도, 극 근처에서 끊김<\/td>\n<\/tr>\n<tr>\n<td>Quadtree<\/td>\n<td>점이 많은 칸만 4등분<\/td>\n<td>밀도 차이에 적응, 메모리 안 화면 검색과 클러스터링에 적합<\/td>\n<td>점이 몰리면 깊어지고 갱신 때 분할과 병합이 필요<\/td>\n<\/tr>\n<tr>\n<td>R-tree<\/td>\n<td>객체를 감싸는 사각형을 계층으로 묶음<\/td>\n<td>점뿐 아니라 도로 같은 선, 행정 구역 같은 면 질의<\/td>\n<td>사각형이 많이 겹치면 여러 가지를 따라가야 해 느려짐<\/td>\n<\/tr>\n<tr>\n<td>S2<\/td>\n<td>정육면체 6면을 구에 투영하고 셀을 4개로 재귀 분할, 레벨 0~30<\/td>\n<td>위경도 격자처럼 극으로 갈수록 셀이 좁아지는 문제가 적고, 임의 영역을 여러 레벨 셀로 덮기 쉬움<\/td>\n<td>같은 레벨이라도 위치에 따라 셀 면적이 2배 남짓까지 차이 남<\/td>\n<\/tr>\n<tr>\n<td>H3<\/td>\n<td>정이십면체 위 육각 격자, 해상도 0~15, 한 단계마다 면적 1/7<\/td>\n<td>이웃 6개가 모두 변을 맞대 반경과 이동 흐름 분석에 유리<\/td>\n<td>자식 7개가 부모를 근사적으로만 덮고, 해상도마다 오각형이 12개<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>셀 방식의 질의는 반경에 맞는 셀 크기를 고르고, 내 위치가 속한 셀과 이웃 셀을 조회하거나 원을 덮는 셀 목록을 계산해 후보를 가져온 뒤 거리로 거르는 순서입니다. Geohash 길이별 오차는 5자리 약 ±2.4km, 6자리 약 ±0.61km, 7자리 약 ±76m입니다. S2와 H3의 셀 ID는 64비트 정수라 저장과 비교가 싸고, S2는 Hilbert 곡선 순서로 번호를 매겨 가까운 셀의 ID가 가깝게 모입니다. 실제 거리는 하버사인 공식이나 Android의 Location.distanceBetween으로 계산하고, 짧은 거리라면 경도 차이에 cos(위도)를 곱하는 평면 근사로도 충분합니다.<\/p>\n<p>지도 앱 클라이언트에서는 두 군데에 쓰입니다. 하나는 요청 단위입니다. 지도에 보이는 영역을 셀 ID 묶음으로 바꿔 셀 단위로 요청하고 캐시하면, 지도를 조금 옮겨도 겹치는 셀은 다시 받지 않습니다. 다른 하나는 화면 안 처리입니다. 받아 온 마커 중 화면 영역이나 탭한 지점 근처를 찾는 일은 메모리 안 Quadtree가 맞고, 줌 레벨에 따라 마커를 묶는 클러스터링도 같은 격자와 트리 생각입니다. 마커 클러스터링은 7절의 마커 성능 문항, 요청 제어와 캐시는 11절의 주변 장소 표시 설계 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>Geohash로 내 셀과 이웃 8칸만 조회하면 충분합니까?<\/strong> 셀이 반경보다 충분히 클 때만 맞습니다. 반경이 셀보다 크면 원이 3×3 블록 밖으로 나가므로 원을 덮는 셀 목록을 계산하고, S2는 S2RegionCoverer가 영역을 여러 레벨의 셀로 덮어 줍니다.<\/li>\n<li><strong>위도에 따라 경도 1도의 거리가 다른 문제는?<\/strong> 위도가 높을수록 경도 1도가 짧아지므로, 반경으로 사각형 범위를 만들 때 경도 폭은 cos(위도)로 나눠 넓힙니다.<\/li>\n<li><strong>H3의 육각형은 무엇이 좋습니까?<\/strong> 사각 격자는 모서리만 맞닿은 대각선 이웃이 있어 거리가 두 종류지만, 육각형은 이웃이 모두 변을 맞대고 있어 중심 셀에서 k칸 이내를 구하는 반경 질의와 이동 흐름 분석이 깔끔합니다. 해상도마다 있는 오각형 12개만 예외로 처리합니다.<\/li>\n<\/ul>"},{"no":146,"t":"DiffUtil은 어떤 알고리즘으로 바뀐 항목을 찾고, 비용은 얼마입니까?","a":"<p>DiffUtil은 Eugene W. Myers의 차분 알고리즘으로 이전 목록을 새 목록으로 바꾸는 최소 삽입과 삭제를 구하고, Myers 알고리즘은 이동을 다루지 않으므로 결과에 두 번째 패스를 돌려 이동한 항목을 찾습니다. 문서가 밝힌 비용은 공간 O(N), 기대 시간 O(N + D²)이며 D는 편집 스크립트의 길이입니다. 이동 감지를 켜면 추가된 항목 수와 삭제된 항목 수의 곱에 비례하는 시간이 더 듭니다. 바뀐 곳이 적으면 빠르고 많이 바뀌거나 순서가 크게 섞이면 무거워지므로, 큰 목록은 백그라운드 스레드에서 계산합니다.<\/p>\n<p>원리는 편집 그래프의 최단 경로입니다. 이전 목록을 가로축, 새 목록을 세로축에 놓으면 오른쪽 한 칸은 삭제, 아래 한 칸은 삽입으로 비용이 1이고, 두 항목이 같은 칸은 대각선으로 비용 없이 지납니다. 왼쪽 위에서 오른쪽 아래까지의 최단 경로가 최소 편집이고, 그 경로의 대각선만 모으면 최장 공통 부분 수열입니다. Myers는 편집 수를 0, 1, 2로 늘려 가며 대각선마다 가장 멀리 간 지점만 기억하고 비용 없는 대각선은 끝까지 따라갑니다. 그래서 1986년 논문 기준으로 두 목록 길이의 합을 N이라 할 때 최악 O(ND), 확률 모델에서 기대 O(N + D²)이고, 두 목록이 비슷할수록 일찍 끝납니다. n×m 표를 모두 채우는 편집 거리 계산(8절의 동적 계획법 문항)과 달리 차이의 크기에 비례해 일하는 셈이고, git diff의 기본 알고리즘도 Myers입니다.<\/p>\n<p>DiffUtil에서 같은 항목인지는 areItemsTheSame이 정하고, 그렇게 짝지은 항목만 areContentsTheSame으로 내용을 비교해 다르면 변경으로 내보내며 getChangePayload로 부분 갱신 정보를 붙입니다. 내용만 바뀐 항목은 D를 늘리지 않습니다. 실행 시간은 변경 수와 비교 함수 비용에 크게 좌우되는데, 문서가 Nexus 5X, Android M에서 잰 수치로 항목 1,000개 중 200개가 바뀌면 평균 27.07ms, 이동 감지 없이 13.54ms라 60Hz 한 프레임인 16.7ms를 넘길 수 있습니다. 그래서 ListAdapter와 AsyncListDiffer는 백그라운드에서 계산하고 메인 스레드에서 적용하며, 계산 중에 새 리스트가 오면 앞선 결과는 버립니다. 둘은 이동 감지를 켠 calculateDiff(callback)을 부르고 끄는 설정이 없으므로, 두 목록이 작성 시각처럼 같은 기준으로 정렬되어 항목이 움직일 일이 없다면 DiffUtil.Callback을 구현해 DiffUtil.calculateDiff(callback, false)를 백그라운드에서 직접 부르고, 결과는 메인 스레드에서 dispatchUpdatesTo로 적용합니다.<\/p>\n<p>실무에서 깨지는
