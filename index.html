  <script type="application/json" id="study-data">{"android":{"title":"Android 면접 질문과 답안","label":"Android 185","intro":"<p>작성 2026-11-16. Android 기술 면접 대비용이다. 시니어 기준으로 결론, 원리, 트레이드오프, 실무에서 깨지는 지점 순서로 답했다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>절<\/th>\n<th>번호<\/th>\n<th>문항 수<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Kotlin 언어<\/td>\n<td>1~18<\/td>\n<td>18<\/td>\n<\/tr>\n<tr>\n<td>2. Coroutines와 Flow<\/td>\n<td>19~42<\/td>\n<td>24<\/td>\n<\/tr>\n<tr>\n<td>3. Jetpack Compose<\/td>\n<td>43~66<\/td>\n<td>24<\/td>\n<\/tr>\n<tr>\n<td>4. 아키텍처<\/td>\n<td>67~85<\/td>\n<td>19<\/td>\n<\/tr>\n<tr>\n<td>5. Android 플랫폼<\/td>\n<td>86~106<\/td>\n<td>21<\/td>\n<\/tr>\n<tr>\n<td>6. 성능, 안정성, 보안, 배포<\/td>\n<td>107~124<\/td>\n<td>18<\/td>\n<\/tr>\n<tr>\n<td>7. 위치와 모빌리티<\/td>\n<td>125~137<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>8. 자료구조와 알고리즘<\/td>\n<td>138~150<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>9. 네트워크<\/td>\n<td>151~164<\/td>\n<td>14<\/td>\n<\/tr>\n<tr>\n<td>10. 운영체제와 동시성<\/td>\n<td>165~177<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>11. 설계 문제<\/td>\n<td>178~185<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>합계<\/td>\n<td><\/td>\n<td>185<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>1~4절은 Kotlin, Coroutines, Compose, 아키텍처다.<\/li>\n<li>5~7절은 기기와 OS 호환성, 시작 속도, 렌더링, 메모리, 네트워크, ANR과 크래시, CI/CD, A/B 테스트, 위치와 백그라운드 위치, 앱 보안을 다룬다.<\/li>\n<li>8~10절 CS는 CS 200문항에서 모바일과 지도 서비스에 닿는 문항을 골라 다듬었다. 범위 전체는 위쪽 전환 버튼의 CS 200문항을 본다.<\/li>\n<li>11절은 시니어 면접에서 나오는 설계 문제다.<\/li>\n<\/ul>\n<p>연습 방법: 답변 첫 문단(결론)을 30초 안에 말하고, 원리 하나와 트레이드오프 하나를 붙인다. 꼬리 질문까지 답하면 시니어 답변으로 들린다. 질문만 보고 답을 말해 본 뒤 답을 펼쳐 확인하는 식으로 써도 된다.<\/p>\n<p>버전, 기본값, 동작 변경은 2026-11-16에 공식 문서와 릴리스 노트로 확인했다. 코드는 컴파일하지 않은 짧은 예시라 실제 프로젝트에서는 API 시그니처를 다시 확인한다.<\/p>\n<p><strong>2026년 11월 기준 버전<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kotlin<\/td>\n<td>2.4.21(2026-10-08). 2.4.0에서 context parameters, explicit backing fields가 Stable<\/td>\n<\/tr>\n<tr>\n<td>kotlinx.coroutines<\/td>\n<td>1.11.0(2026-05-08)<\/td>\n<\/tr>\n<tr>\n<td>Jetpack Compose<\/td>\n<td>BOM 2026.09.00, Compose 1.12.1, Material 3 1.4.0. Compose 1.12부터 compileSdk 37과 AGP 9.1.1 이상 필요<\/td>\n<\/tr>\n<tr>\n<td>Lifecycle<\/td>\n<td>2.11.0<\/td>\n<\/tr>\n<tr>\n<td>Navigation<\/td>\n<td>Navigation 3 1.2.1(1.0.0 안정판 2025-11-19). Navigation 2.10.2는 유지 관리 모드<\/td>\n<\/tr>\n<tr>\n<td>Room<\/td>\n<td>Room 3.0.3(KSP 전용, 3.0.0 안정판 2026-07-01). Room 2.8.5는 유지 관리 모드<\/td>\n<\/tr>\n<tr>\n<td>빌드<\/td>\n<td>AGP 9.5.1(9.0부터 내장 Kotlin과 새 DSL 기본), Gradle 9.9.1, KSP 2.3.14<\/td>\n<\/tr>\n<tr>\n<td>Android<\/td>\n<td>Android 17(API 37, 2026-06-16 출시), Android 16(API 36, 2025-06-10 출시)<\/td>\n<\/tr>\n<tr>\n<td>Google Play<\/td>\n<td>2026-08-31부터 새 앱과 업데이트는 API 36 이상을 target<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","sections":[{"no":1,"title":"Kotlin 언어","qs":[{"no":1,"t":"Kotlin의 null 안전성은 어떻게 보장되고, Java 코드와 섞이면 어디서 깨집니까?","a":"<p>Kotlin은 String과 String?를 다른 타입으로 나눠, nullable 값은 안전 호출(?.), 엘비스 연산자(?:), null 검사 뒤의 스마트 캐스트를 거쳐야만 쓰게 합니다. 이 보장은 컴파일러가 nullability를 아는 Kotlin 코드 안에서만 성립합니다. Java와의 경계, <code>!!<\/code>와 lateinit, 생성자를 거치지 않는 리플렉션 라이브러리에서 깨집니다.<\/p>\n<p>가장 흔한 구멍은 플랫폼 타입입니다. nullability 정보가 없는 Java 메서드의 반환 타입은 <code>String!<\/code>로 보이고, 컴파일러는 이를 nullable로도 non-null로도 쓰게 두면서 검사하지 않습니다. <code>val name = user.getName()<\/code>으로 받아 <code>name.length<\/code>를 부르면 Java가 null을 돌려준 순간 NPE가 나고, 그 값이 여러 함수를 거쳐 퍼진 뒤라면 원인을 찾기 어렵습니다. 그래서 경계에서는 <code>val name: String?<\/code>처럼 타입을 명시해 받습니다. non-null로 명시하면 컴파일러가 대입 지점에 검사를 넣어 실패가 경계에서 바로 드러납니다. Java 쪽에 nullability 어노테이션이 있으면 플랫폼 타입 대신 실제 Kotlin 타입이 됩니다. Kotlin은 JetBrains, JSpecify, androidx.annotation 같은 어노테이션을 인식하고, 이 셋은 기본 설정에서 불일치를 컴파일 오류로 보고합니다.<\/p>\n<p>스마트 캐스트는 검사와 사용 사이에 값이 바뀌지 않는다고 컴파일러가 증명할 수 있을 때만 됩니다. 클래스의 var 프로퍼티나 다른 모듈의 프로퍼티는 안 되므로 지역 val로 받아 씁니다. <code>!!<\/code>는 null이 아니라는 주장을 런타임으로 미루고, lateinit은 초기화 전에 읽으면 UninitializedPropertyAccessException을 던집니다. 둘 다 컴파일러의 보장을 개발자의 약속으로 바꾸는 것이라 리뷰에서 근거를 묻습니다. 반대 방향으로 Java가 Kotlin public 함수의 non-null 파라미터에 null을 넘기면 컴파일러가 넣은 진입 검사에서 바로 실패합니다.<\/p>\n<pre class=\"kotlin\"><code>// Java: public String getName() { ... }  어노테이션 없음\nval a = user.getName()            // String!: 검사 없이 통과\na.length                          // Java가 null을 돌려주면 여기서 NPE\n\nval b: String = user.getName()    // 대입 지점에서 바로 실패\nval c: String? = user.getName()   // null 가능성을 타입으로 받는다\nval len = c?.length ?: 0<\/code><\/pre>","f":"<ul>\n<li><strong>lateinit은 언제 쓰고 언제 피합니까?<\/strong> 생명주기상 반드시 먼저 대입되는 값, 예를 들어 Hilt의 필드 주입이나 onCreate에서 만드는 객체에 씁니다. 없을 수 있는 상태가 정상이라면 nullable이 맞고, isInitialized 검사가 여기저기 생기면 설계를 바꿀 신호입니다.<\/li>\n<li><strong>@NullMarked는 무엇입니까?<\/strong> JSpecify 어노테이션으로, 붙인 패키지나 클래스 안의 타입을 기본 non-null로 봅니다. Java 코드마다 @NonNull을 달지 않고 nullable인 곳에만 @Nullable을 붙이면 됩니다.<\/li>\n<li><strong>Gson으로 파싱한 객체의 non-null 프로퍼티가 null이 되는 이유는?<\/strong> Gson이 생성자를 거치지 않고 객체를 만들어 Kotlin 컴파일러가 넣은 검사를 피하기 때문입니다. 1절의 JSON 파싱 라이브러리 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":2,"t":"val은 불변입니까? 읽기 전용 컬렉션과 불변 컬렉션은 어떻게 다르고, kotlinx.collections.immutable은 언제 씁니까?","a":"<p>아닙니다. val은 참조를 다시 대입하지 못하게 할 뿐이고 가리키는 객체가 바뀌지 않는다는 보장은 없습니다. 컬렉션도 같아서 Kotlin의 List는 불변이 아니라 수정 메서드가 없는 읽기 전용 인터페이스입니다.<\/p>\n<p><code>val list = mutableListOf(1)<\/code>의 내용은 바뀌고, 커스텀 getter가 있는 val은 읽을 때마다 다른 값을 돌려줄 수도 있습니다. List 참조 뒤의 실제 객체도 ArrayList일 수 있습니다. 같은 객체를 MutableList로 들고 있는 다른 코드가 바꾸면 내 List도 바뀌고, <code>as MutableList<\/code>로 캐스팅해 바꿀 수도 있습니다. Java에는 읽기 전용 개념이 없어 Java 코드에 넘긴 List에는 그대로 add가 불립니다. 그래서 바깥에서 받은 컬렉션을 상태로 저장하거나 내부 컬렉션을 밖으로 내보낼 때는 toList()로 방어적 복사를 해서 서로 끊습니다.<\/p>\n<p>진짜 불변이 필요하면 kotlinx.collections.immutable을 씁니다. ImmutableList는 내용이 바뀌지 않는다는 것을 타입으로 약속하고, PersistentList의 add 같은 연산은 원본을 그대로 두고 새 컬렉션을 돌려주되 바뀐 부분만 새로 만들고 나머지는 구조 공유합니다. 여러 스레드가 같은 상태를 읽거나, 상태를 조금씩 바꾸면서 이전 버전을 보존해야 할 때 맞습니다.<\/p>\n<p>Compose와는 이렇게 연결됩니다. 컴파일러는 List를 불안정 타입으로 보고, Kotlin 2.0.20부터 기본인 strong skipping에서는 불안정 파라미터를 인스턴스 동일성(===)으로 비교하므로 내용이 같아도 새 리스트 인스턴스를 넘기면 리컴포지션됩니다. Android 공식 문서는 ViewModel에서 변환 결과를 캐시해 같은 인스턴스를 유지하는 방법을 먼저 권하고, ImmutableList로 바꾸면 매 리컴포지션마다 원소 단위 equals 비교를 하게 되어 큰 컬렉션이나 Lazy 레이아웃에서는 오히려 비쌀 수 있다고 주의합니다. 자세한 내용은 3절에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>class Cart {\n    private val _items = mutableListOf&lt;Item&gt;()\n    val items: List&lt;Item&gt; get() = _items          // 읽기 전용 뷰: 내부 변경이 그대로 보인다\n    fun snapshot(): List&lt;Item&gt; = _items.toList()  // 방어적 복사\n}\n\nval shared: List&lt;Int&gt; = arrayListOf(1, 2)\n(shared as MutableList&lt;Int&gt;).add(3)               // 컴파일되고 실제로 바뀐다\n\nval v1 = persistentListOf(1, 2)\nval v2 = v1.add(3)                                // v1은 그대로, v2는 새 버전<\/code><\/pre>","f":"<ul>\n<li><strong>listOf()가 돌려준 리스트를 캐스팅해서 바꾸면?<\/strong> 내부 구현에 따라 UnsupportedOperationException이 나거나 실제로 바뀝니다. 어느 쪽이든 계약으로 기대하면 안 됩니다.<\/li>\n<li><strong>StateFlow에 MutableList를 담고 add한 뒤 다시 넣으면?<\/strong> 같은 인스턴스라 StateFlow가 이전 값과 equals로 같다고 보고 내보내지 않아 화면이 갱신되지 않습니다. 항상 새 리스트를 만들어 넣습니다.<\/li>\n<li><strong>구조 공유는 무엇입니까?<\/strong> 새 버전이 바뀐 경로의 노드만 새로 만들고 나머지 노드는 이전 버전과 함께 씁니다. 전체를 복사하지 않고도 이전 버전이 그대로 남습니다.<\/li>\n<\/ul>"},{"no":3,"t":"data class를 쓸 때 놓치기 쉬운 점은 무엇입니까?","a":"<p>컴파일러가 equals, hashCode, toString, copy, componentN을 주 생성자에 선언한 프로퍼티로만 만든다는 점이 출발점입니다. 본문에 선언한 프로퍼티는 비교와 출력에서 빠지므로 그 값이 달라도 equals가 true입니다. 여기에 copy와 검증의 관계, 해시 컬렉션 키, 상속 제약을 알아야 합니다.<\/p>\n<p>copy는 주 생성자를 그대로 부르는 함수라서 init 블록의 require 검증은 copy에서도 실행됩니다. 건너뛰는 것은 생성자를 private으로 막고 팩토리 함수에 둔 검증입니다. 생성된 copy는 생성자가 private이어도 공개되어 팩토리를 거치지 않고 잘못된 값을 만들 수 있습니다. Kotlin은 2.0.20에서 이런 copy 호출에 경고를 내는 것으로 copy 가시성을 생성자에 맞추는 단계적 전환을 시작했고, @ConsistentCopyVisibility를 붙이면 copy가 생성자와 같은 가시성을 갖습니다. 불변식은 init에 두거나 이 어노테이션을 붙입니다. copy는 얕은 복사라 MutableList 같은 프로퍼티는 원본과 복사본이 같은 객체를 공유한다는 점도 함께 봅니다.<\/p>\n<p>hashCode는 프로퍼티 값으로 계산되므로, var 프로퍼티를 가진 객체를 HashSet이나 HashMap 키로 넣은 뒤 값을 바꾸면 다른 버킷을 찾게 되어 contains와 remove가 실패합니다. 키로 쓰는 data class는 val만 둡니다. 배열 프로퍼티는 equals가 참조로 비교하므로 contentEquals로 직접 재정의해야 합니다.<\/p>\n<p>data class는 abstract, open, sealed, inner가 될 수 없어 다른 클래스가 상속할 수 없습니다. 공통 타입이 필요하면 sealed interface를 구현합니다. 데이터가 없는 경우는 data object로 둡니다. toString이 클래스 이름을 돌려주고 같은 타입끼리 equals가 true라서 sealed 계층의 Loading 같은 상태에 맞습니다. 마지막으로 toString은 주 생성자 프로퍼티를 모두 출력하므로, 토큰이나 개인정보를 담은 data class가 로그와 크래시 리포트에 그대로 남지 않게 toString을 재정의하거나 그 값을 별도 타입으로 감쌉니다.<\/p>\n<pre class=\"kotlin\"><code>data class PositiveInt private constructor(val value: Int) {\n    companion object {\n        fun of(v: Int): PositiveInt? = if (v &gt; 0) PositiveInt(v) else null\n    }\n}\nval bad = PositiveInt.of(1)?.copy(value = -1)  // 팩토리 검증 우회(2.0.20에서 경고 시작)\n\n@ConsistentCopyVisibility                      // copy도 private이 된다\ndata class Email private constructor(val value: String) {\n    init { require(&quot;@&quot; in value) }             // init 검증은 copy에서도 실행된다\n}<\/code><\/pre>","f":"<ul>\n<li><strong>이름 기반 구조 분해는 왜 나왔습니까?<\/strong> componentN은 위치 기반이라 주 생성자 프로퍼티 순서를 바꾸면 타입이 같은 변수끼리 값이 조용히 뒤바뀝니다. Kotlin 2.3.20에서 프로퍼티 이름으로 구조 분해하는 기능이 Experimental로 나왔습니다.<\/li>\n<li><strong>Compose에서 data class 상태는 안정 타입입니까?<\/strong> Compose 컴파일러가 적용된 모듈에서 val과 원시 타입이나 String만 가진 단순한 data class는 안정으로 추론되어 equals로 비교됩니다. List 같은 컬렉션 프로퍼티가 있으면 불안정이 되어 인스턴스 동일성으로 비교됩니다.<\/li>\n<li><strong>equals를 직접 재정의해야 하는 경우는?<\/strong> 배열 프로퍼티, 비교에서 빼야 하는 캐시 값, ID만으로 같음을 판단하는 엔티티입니다. 다만 ID 기준 equals는 UI 상태 비교에서 내용 변경을 놓치게 하므로 UI 모델에는 쓰지 않습니다.<\/li>\n<\/ul>"},{"no":4,"t":"sealed class, sealed interface, enum class는 각각 언제 씁니까?","a":"<p>셋 다 경우의 수가 닫힌 타입을 표현해 when의 완전성 검사를 받는 도구입니다. 경우마다 인스턴스가 하나이고 모든 경우가 같은 모양의 데이터를 가지면 enum class, 경우마다 다른 데이터를 가지면 sealed 계층입니다. sealed 계층에서는 공통 생성자 인자나 상태가 필요할 때만 sealed class를 쓰고, 그 밖에는 sealed interface를 기본으로 합니다.<\/p>\n<p>enum은 고정된 인스턴스 집합이라 name, ordinal, entries를 기본으로 얻고 설정값, 정렬 옵션, 서버와 주고받는 코드 값에 맞습니다. 대신 상수마다 다른 필드를 가질 수 없습니다. sealed 계층은 하위 타입을 같은 모듈과 같은 패키지 안으로 제한해 컴파일러가 하위 타입 전체를 압니다. 하위 타입은 data class, data object, 일반 class 무엇이든 될 수 있어 Success는 결과를, Error는 원인을 갖는 식으로 모양이 다릅니다. sealed interface는 한 클래스가 여러 인터페이스를 구현할 수 있으므로 한 타입이 여러 닫힌 계층에 동시에 속할 수 있고, enum class도 sealed interface를 구현할 수 있습니다.<\/p>\n<p>when을 sealed 타입에 쓸 때는 else를 두지 않는 것이 핵심입니다. else가 있으면 나중에 하위 타입을 추가해도 컴파일러가 처리 누락을 알려 주지 않고 조용히 else로 흘러갑니다. else가 없으면 새 상태를 추가하는 순간 처리하지 않은 when이 모두 컴파일 오류가 되어 고칠 곳의 목록이 됩니다. 그래서 UI 상태(Loading, Content, Error)와 Repository의 결과 타입을 sealed로 모델링하고 else 없이 분기합니다.<\/p>\n<p>최근 버전은 이 방식을 더 편하게 합니다. Kotlin 2.2.0에서 Stable이 된 guard 조건은 <code>is Error if state.retryable -&gt;<\/code>처럼 분기에 조건을 붙여도 완전성 검사를 유지하고, 2.3.0에서 Stable이 된 data-flow 기반 완전성 검사는 앞의 if에서 return으로 걸러 낸 경우를 when이 다시 요구하지 않아 불필요한 else를 지울 수 있습니다.<\/p>\n<pre class=\"kotlin\"><code>sealed interface UiState {\n    data object Loading : UiState\n    data class Content(val places: List&lt;Place&gt;) : UiState\n    data class Error(val cause: Throwable, val retryable: Boolean) : UiState\n}\n\nfun render(state: UiState) = when (state) {\n    UiState.Loading -&gt; showLoading()\n    is UiState.Content -&gt; showPlaces(state.places)\n    is UiState.Error if state.retryable -&gt; showRetry()  // guard 조건(2.2.0 Stable)\n    is UiState.Error -&gt; showFatal(state.cause)\n    // else를 두지 않는다: 새 상태를 추가하면 여기서 컴파일 오류\n}<\/code><\/pre>","f":"<ul>\n<li><strong>enum의 values() 대신 entries를 쓰는 이유는?<\/strong> values()는 호출할 때마다 배열을 새로 복사해 돌려주고, entries는 미리 만든 불변 리스트를 돌려줍니다.<\/li>\n<li><strong>라이브러리 공개 API의 sealed 타입에 하위 타입을 추가하면?<\/strong> 사용하는 쪽의 else 없는 when이 컴파일되지 않습니다. 공개 API에서는 소스 호환성을 깨는 변경으로 보고 버전 정책에 맞춰 냅니다.<\/li>\n<li><strong>sealed class가 꼭 필요한 경우는?<\/strong> 모든 하위 타입이 공유하는 생성자 인자, protected 상태, 공통 구현이 있을 때입니다. 그 밖에는 다중 구현이 되는 sealed interface가 유연합니다.<\/li>\n<\/ul>"},{"no":5,"t":"inline, noinline, crossinline, reified는 각각 무엇을 해결합니까?","a":"<p>inline은 고차 함수의 본문과 넘겨받은 람다를 호출 지점에 복사해 람다 객체 할당과 간접 호출을 없앱니다. 복사된다는 성질 덕분에 람다 안의 return이 바깥 함수를 빠져나가는 non-local return과, 런타임에 타입 인자를 쓰는 reified가 가능해집니다. noinline과 crossinline은 이 복사를 람다 파라미터별로 조정하는 장치입니다.<\/p>\n<p>JVM에서 람다는 객체라서 바깥 변수를 캡처하면 호출마다 새 객체가 생기고 호출도 한 단계 간접적입니다. inline 함수에 넘긴 람다는 객체가 되지 않고 호출 지점 코드로 펼쳐지므로 forEach 안의 return이 바깥 함수의 return이 됩니다. Kotlin 2.2.0부터는 람다 안의 break와 continue도 Stable인데, 대상은 inline 함수 호출을 감싼 바깥 for, while 루프라서 바깥 루프 없이 forEach만 break로 끊을 수는 없습니다. 람다를 필드에 저장하거나 inline이 아닌 함수에 넘겨야 하면 펼칠 수 없으므로 그 파라미터에 noinline을 붙여 일반 함수 객체로 남깁니다. 람다를 저장하지는 않지만 다른 실행 맥락, 예를 들어 Handler.post에 넘기는 람다나 객체 식 안에서 불러야 하면 crossinline을 붙입니다. 인라인은 유지하되 non-local return을 금지해, 바깥 함수가 이미 끝난 뒤 return이 실행되는 상황을 막습니다.<\/p>\n<p>reified는 JVM 제네릭의 타입 소거를 우회합니다. inline 함수는 호출 지점마다 실제 타입이 정해진 채로 복사되므로 본문에서 <code>T::class<\/code>나 <code>is T<\/code>를 쓸 수 있습니다. <code>by viewModels&lt;SearchViewModel&gt;()<\/code>이 ViewModel 클래스를 따로 넘기지 않아도 되는 것이 이 덕분입니다.<\/p>\n<p>대가도 분명합니다. 본문이 호출 지점마다 복사되므로 큰 함수를 inline하면 바이트코드와 앱 크기가 커지고, 함수형 파라미터가 없는 함수는 이득이 거의 없어 컴파일러가 경고합니다. 또 public inline 함수는 본문이 호출하는 모듈에 복사되므로 private이나 internal 선언을 쓸 수 없습니다. 허용하면 라이브러리 내부를 바꿨을 때 이미 컴파일된 호출 쪽이 사라진 멤버를 부르게 되어 바이너리 호환성이 깨집니다. 꼭 필요하면 @PublishedApi internal로 공개 범위에 포함됨을 밝힙니다.<\/p>\n<pre class=\"kotlin\"><code>inline fun load(onDone: () -&gt; Unit, noinline onError: (Throwable) -&gt; Unit) {\n    errorHandler = onError            // 필드에 저장하므로 noinline\n    onDone()\n}\n\ninline fun runOnMain(handler: Handler, crossinline action: () -&gt; Unit) {\n    handler.post { action() }         // 다른 람다 안에서 부르므로 crossinline\n}\n\ninline fun &lt;reified T : Parcelable&gt; Bundle.parcelableCompat(key: String): T? =\n    BundleCompat.getParcelable(this, key, T::class.java)  // reified로 Class를 얻는다<\/code><\/pre>","f":"<ul>\n<li><strong>non-local return이 inline 람다에서만 되는 이유는?<\/strong> 람다가 호출 지점에 복사되어야 람다 안의 return이 바깥 함수의 return으로 의미를 갖기 때문입니다. 객체로 남는 람다는 바깥 함수가 끝난 뒤에 실행될 수 있습니다.<\/li>\n<li><strong>reified의 제약은?<\/strong> inline 함수에서만 쓸 수 있고 본문이 호출 지점마다 복사됩니다. 호출 쪽에서도 타입이 구체적이어야 해서, reified가 아닌 다른 제네릭 함수의 T를 그대로 넘길 수는 없습니다.<\/li>\n<li><strong>표준 컬렉션 연산도 inline입니까?<\/strong> map, filter, forEach는 inline이라 람다 비용은 없습니다. 대신 단계마다 중간 리스트를 만들며, 이 차이는 1절의 Collection과 Sequence 문항에서 다룹니다.<\/li>\n<li><strong>inline 함수에 넘긴 람다 안에서 suspend 함수를 부를 수 있습니까?<\/strong> 펼쳐진 람다는 호출한 함수의 일부가 되므로 바깥이 suspend 함수이면 부를 수 있습니다. forEach 안에서 delay를 부를 수 있는 이유입니다.<\/li>\n<\/ul>"},{"no":6,"t":"value class는 무엇을 해결하고, 언제 박싱됩니까?","a":"<p>value class는 UserId, Meters처럼 같은 원시 타입을 의미별로 나누는 타입 안전 래퍼를 할당 비용 없이 만듭니다. 컴파일 타임에는 별도 타입이라 미터를 받는 자리에 초를 넣으면 컴파일 오류가 나고, 런타임에는 감싼 값 하나로 컴파일되어 객체가 생기지 않습니다. 단, 제네릭이나 인터페이스 타입처럼 래퍼 자신이 아닌 타입으로 쓰이면 박싱되고, Int 같은 원시 타입을 감쌌다면 nullable로 쓸 때도 박싱됩니다.<\/p>\n<p>JVM에서는 @JvmInline을 붙여 선언하고 주 생성자에 프로퍼티를 하나만 둡니다. init 블록, 메서드, 인터페이스 구현은 가능하지만 정체성이 없어 ===를 쓸 수 없습니다. 공식 문서의 규칙은 다른 타입으로 쓰일 때마다 박싱한다는 것이고, <code>Meters?<\/code>, <code>List&lt;Meters&gt;<\/code>, 제네릭 함수의 T, 구현한 인터페이스 타입의 변수가 대표적입니다. 그래서 거리 값이 많은 리스트를 <code>List&lt;Meters&gt;<\/code>로 들면 원소마다 래퍼 객체가 생겨 일반 클래스와 비용이 같아집니다. 대량 데이터는 IntArray 같은 원시 배열로 들고 도메인 경계에서만 value class로 감쌉니다.<\/p>\n<p>Java와 섞일 때는 이름 맹글링을 알아야 합니다. <code>fun compute(x: UInt)<\/code>와 <code>fun compute(x: Int)<\/code>는 JVM에서 같은 시그니처가 되므로 컴파일러가 value class를 받는 함수 이름 뒤에 해시를 붙입니다. 그래서 Java에서는 그 함수를 원래 이름으로 부를 수 없고, Java에서 불러야 하면 @JvmName으로 이름을 직접 정합니다.<\/p>\n<p>쓸 곳은 같은 원시 타입이 여러 의미로 섞이는 도메인 값입니다. 내비게이션 앱이라면 거리와 시간, 위도와 경도, 미터와 킬로미터처럼 모두 Int나 Double인 값을 바꿔 넣는 버그가 테스트로는 잘 잡히지 않는데, 타입으로 나누면 컴파일 단계에서 막힙니다.<\/p>\n<pre class=\"kotlin\"><code>@JvmInline\nvalue class Meters(val value: Int) {\n    init { require(value &gt;= 0) }\n}\n\nfun etaSeconds(distance: Meters, speedMps: Int): Int =   // JVM 이름: etaSeconds-&lt;해시&gt;\n    distance.value / speedMps\n\nval d = Meters(500)      // int 하나로 표현\nval n: Meters? = d       // 박싱: nullable\nval list = listOf(d)     // 박싱: 제네릭<\/code><\/pre>","f":"<ul>\n<li><strong>typealias와는 무엇이 다릅니까?<\/strong> typealias는 이름만 붙인 같은 타입이라 <code>typealias Meters = Int<\/code>면 아무 Int나 넣어도 컴파일됩니다. 타입 안전성이 목적이면 value class입니다.<\/li>\n<li><strong>value class가 박싱되는 예는?<\/strong> <code>List&lt;UserId&gt;<\/code>에 담거나 인터페이스 타입 변수에 넣을 때입니다. nullable은 감싼 타입에 따라 달라서, Long을 감싼 UserId라면 <code>UserId?<\/code>가 박싱되고 String을 감쌌다면 박싱 없이 String으로 표현됩니다. 박싱된 값을 다시 UserId 타입으로 받으면 언박싱됩니다.<\/li>\n<li><strong>Kotlin의 ==와 ===는?<\/strong> ==는 equals 비교, ===는 참조 비교입니다. value class는 정체성이 없어 ===를 쓸 수 없고 ==로만 비교합니다.<\/li>\n<\/ul>"},{"no":7,"t":"확장 함수는 어떻게 컴파일되고, 왜 다형성이 없습니까?","a":"<p>확장 함수는 수신 객체를 첫 번째 파라미터로 받는 정적 메서드로 컴파일됩니다. StringExt.kt에 둔 <code>fun String.toSlug()<\/code>는 StringExtKt 클래스의 static 메서드 <code>toSlug(String receiver)<\/code>가 되고, <code>\"a\".toSlug()<\/code> 호출은 그 정적 메서드 호출로 바뀝니다. 클래스를 고치는 것이 아니라 바깥에 함수를 둔 것이므로, 어떤 함수를 부를지는 컴파일 타임에 변수의 선언 타입으로 정해집니다.<\/p>\n<p>그래서 다형성이 없습니다. <code>fun Shape.name()<\/code>과 <code>fun Circle.name()<\/code>이 있을 때 <code>val s: Shape = Circle()<\/code>의 <code>s.name()<\/code>은 Shape 쪽 확장을 부릅니다. 가상 디스패치는 실행 시점 객체의 클래스에서 메서드를 찾는 것인데, 확장 함수는 클래스의 멤버가 아니라서 그 대상이 아닙니다. 같은 이유로 시그니처가 같은 멤버 함수가 있으면 멤버가 항상 이기고 확장은 무시되며 컴파일러는 경고만 합니다. 확장 함수 본문은 바깥 함수와 같은 권한이라 private과 protected 멤버에 접근할 수 없습니다. 확장 프로퍼티도 클래스에 필드를 추가하지 못해 backing field가 없고, getter로 계산하는 값만 정의할 수 있습니다.<\/p>\n<p>남용하면 발견성이 떨어집니다. 자동 완성 목록에 확장이 멤버와 섞여 나오므로 String이나 Context 같은 공용 타입에 도메인 확장을 붙이면 모든 호출 지점의 후보가 오염되고, 선언 위치를 찾기 어려워 같은 일을 하는 확장이 모듈마다 따로 생기기도 합니다. 기준은 세 가지입니다. 수신 타입과 개념이 맞는지 봅니다(Context.dpToPx는 자연스럽지만 String.toUserProfile은 파싱 책임을 숨깁니다). 상태가 필요하면 확장이 아니라 클래스로 만듭니다. 공개 범위는 private이나 internal로 좁혀 쓰는 파일 가까이에 둡니다.<\/p>\n<pre class=\"kotlin\"><code>open class Shape\nclass Circle : Shape()\n\nfun Shape.name() = &quot;shape&quot;\nfun Circle.name() = &quot;circle&quot;\n\nval s: Shape = Circle()\ns.name()        // &quot;shape&quot;: 선언 타입 Shape로 컴파일 타임에 결정\n\n// 컴파일 결과(개념 코드): public static String name(Shape receiver) { return &quot;shape&quot;; }<\/code><\/pre>","f":"<ul>\n<li><strong>클래스 안에 선언한 확장은 다형성이 있습니까?<\/strong> 멤버로 선언한 확장은 그 클래스, 즉 디스패치 수신 객체에 대해서는 가상으로 동작하지만 확장 수신 객체에 대해서는 여전히 정적으로 정해집니다.<\/li>\n<li><strong>nullable 수신 타입 확장은 어떻게 가능합니까?<\/strong> 정적 함수의 첫 인자일 뿐이라 null을 받을 수 있습니다. <code>CharSequence?.isNullOrEmpty()<\/code>가 그 예이고 본문에서 this의 null 여부를 검사합니다.<\/li>\n<li><strong>Java에서는 어떻게 부릅니까?<\/strong> 파일 이름 뒤에 Kt가 붙은 클래스의 static 메서드로 부르고 수신 객체를 첫 인자로 넘깁니다. @file:JvmName으로 그 클래스 이름을 바꿀 수 있습니다.<\/li>\n<\/ul>"},{"no":8,"t":"let, run, with, apply, also는 어떤 기준으로 고르고, 남용하면 어떤 문제를 만듭니까?","a":"<p>두 축으로 고릅니다. 람다 안에서 수신 객체를 this로 볼지 it으로 볼지, 그리고 결과로 수신 객체를 돌려받을지 람다의 마지막 식 값을 돌려받을지입니다. 객체를 설정하고 그 객체를 그대로 쓰면 apply, 로그나 검증 같은 부수 작업을 끼워 넣으면 also, 값을 다른 결과로 바꾸면 let이나 run을 씁니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>함수<\/th>\n<th>수신 객체 참조<\/th>\n<th>반환값<\/th>\n<th>주된 용도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>let<\/td>\n<td>it<\/td>\n<td>람다 결과<\/td>\n<td>null이 아닐 때만 변환, 지역 범위 제한<\/td>\n<\/tr>\n<tr>\n<td>run<\/td>\n<td>this<\/td>\n<td>람다 결과<\/td>\n<td>객체 멤버로 값 계산<\/td>\n<\/tr>\n<tr>\n<td>with<\/td>\n<td>this<\/td>\n<td>람다 결과<\/td>\n<td>확장이 아님, 한 객체에 여러 호출<\/td>\n<\/tr>\n<tr>\n<td>apply<\/td>\n<td>this<\/td>\n<td>수신 객체<\/td>\n<td>객체 설정, 빌더<\/td>\n<\/tr>\n<tr>\n<td>also<\/td>\n<td>it<\/td>\n<td>수신 객체<\/td>\n<td>로그, 검증, 다른 곳에 추가<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>?.let은 nullable 값을 null이 아닐 때만 처리하는 관용구입니다. 클래스의 var 프로퍼티는 검사와 사용 사이에 바뀔 수 있어 스마트 캐스트가 안 되는데, ?.let은 읽은 시점의 값을 it으로 고정하므로 안전합니다. 다만 <code>x?.let { ... } ?: run { ... }<\/code>를 if-else 대신 쓰면 함정이 있습니다. let의 람다가 null을 돌려주면 x가 null이 아니어도 엘비스 오른쪽이 실행됩니다. 두 갈래가 모두 의미 있으면 지역 val과 if로 씁니다.<\/p>\n<p>남용 문제는 가독성과 this 혼동입니다. apply 안에 with나 run을 겹치면 this가 가리키는 객체가 바뀌고, 수신 객체의 멤버가 바깥 클래스의 멤버를 가립니다. 예를 들어 Fragment에서 <code>requireView().apply { tag = id }<\/code>라고 쓰면 id는 Fragment의 값이 아니라 View의 id로 해석됩니다. 기준은 한 단계까지만 쓰기, 람다가 몇 줄을 넘으면 it에 이름 붙이기, 지역 변수로 풀었을 때 더 읽기 쉬우면 지역 변수 쓰기입니다. 다섯 함수 모두 inline이라 성능 차이는 없으므로 고르는 기준은 읽는 사람입니다.<\/p>\n<pre class=\"kotlin\"><code>// 함정: user가 있어도 캐시에 없으면 load()도 실행된다\nuser?.let { cache[it.id] } ?: run { load() }\n\n// 두 갈래라면 지역 val과 if\nval u = user\nif (u != null) show(u) else load()\n\nval intent = Intent(context, DetailActivity::class.java).apply {\n    putExtra(&quot;placeId&quot;, placeId)                 // 객체 설정은 apply\n}.also { Log.d(TAG, &quot;open detail $placeId&quot;) }   // 부수 작업은 also<\/code><\/pre>","f":"<ul>\n<li><strong>apply와 also는 둘 다 수신 객체를 돌려주는데 어떻게 고릅니까?<\/strong> 블록이 그 객체를 설정하면 apply, 객체를 건드리지 않는 부수 작업이면 also입니다. it으로 받는 also는 이 블록이 객체를 바꾸지 않는다는 신호가 됩니다.<\/li>\n<li><strong>with와 run의 차이는?<\/strong> 결과는 같고 with는 확장 함수가 아니라 수신 객체를 인자로 받습니다. nullable 수신 객체에는 ?.run을 쓸 수 있어 run이 낫습니다.<\/li>\n<li><strong>takeIf는 언제 씁니까?<\/strong> 조건을 만족하면 그 객체를, 아니면 null을 돌려줍니다. <code>query.takeIf { it.isNotBlank() }?.let(::search)<\/code>처럼 조건부 체인에 쓰되, 조건이 길면 if가 더 읽기 쉽습니다.<\/li>\n<\/ul>"},{"no":9,"t":"제네릭의 out, in, 스타 프로젝션은 무엇을 해결합니까?","a":"<p>변성은 <code>List&lt;Cat&gt;<\/code>을 <code>List&lt;Animal&gt;<\/code> 자리에 넣어도 되는지를 타입 시스템이 판단하게 하는 장치입니다. 제네릭 타입은 기본이 무공변이라 <code>MutableList&lt;Cat&gt;<\/code>은 <code>MutableList&lt;Animal&gt;<\/code>의 하위 타입이 아닙니다. 값을 꺼내기만 하는 생산자는 out으로 공변을, 넣기만 하는 소비자는 in으로 반공변을 선언해 안전한 대입만 허용합니다.<\/p>\n<p>무공변이 기본인 이유는 가변 컬렉션 때문입니다. <code>MutableList&lt;Cat&gt;<\/code>을 <code>MutableList&lt;Animal&gt;<\/code>로 볼 수 있으면 그 참조로 Dog를 넣을 수 있고, 원래 Cat 리스트를 읽는 쪽에서 ClassCastException이 납니다. Java 배열은 공변이라 이 문제는 런타임 ArrayStoreException으로 나타납니다. Kotlin은 선언 지점 변성을 지원해서, 읽기 전용 <code>List&lt;out E&gt;<\/code>는 E를 반환 위치에만 쓰므로 <code>List&lt;Cat&gt;<\/code>을 <code>List&lt;Animal&gt;<\/code>에 대입할 수 있고, <code>Comparable&lt;in T&gt;<\/code>는 T를 파라미터 위치에만 쓰므로 <code>Comparable&lt;Animal&gt;<\/code>을 <code>Comparable&lt;Cat&gt;<\/code> 자리에 쓸 수 있습니다. 선언을 바꿀 수 없는 타입은 <code>fun copy(from: Array&lt;out Any&gt;, to: Array&lt;Any&gt;)<\/code>처럼 사용 지점 변성으로 그 자리에서만 제한합니다. Java의 <code>? extends<\/code>, <code>? super<\/code>와 같은 역할이고, 생산자는 extends, 소비자는 super라는 PECS 규칙과 대응합니다.<\/p>\n<p>스타 프로젝션 <code>List&lt;*&gt;<\/code>는 타입 인자를 모르거나 상관없을 때 씁니다. 꺼낸 값은 상한 타입(보통 Any?)으로만 읽을 수 있고, <code>MutableList&lt;*&gt;<\/code>에는 값을 넣을 수 없습니다. 런타임에는 타입 소거로 <code>List&lt;String&gt;<\/code>과 <code>List&lt;Int&gt;<\/code>가 같은 클래스라서 <code>is List&lt;String&gt;<\/code>은 검사할 수 없고 <code>is List&lt;*&gt;<\/code>만 가능합니다. 실제 타입이 꼭 필요하면 inline 함수의 reified 타입 파라미터로 호출 지점의 타입을 받습니다.<\/p>\n<p>Android에서 자주 만나는 곳은 Java 경계입니다. Kotlin은 파라미터의 <code>Set&lt;Plugin&gt;<\/code>처럼 원소 타입이 final이 아닌 공변 타입을 Java 시그니처에서 <code>Set&lt;? extends Plugin&gt;<\/code>으로 내보냅니다. Dagger와 Hilt는 Java 시그니처를 보고 바인딩을 찾으므로, 멀티바인딩한 Set을 생성자에서 받을 때 바인딩을 찾지 못하는 오류가 나고 @JvmSuppressWildcards를 붙여 해결합니다.<\/p>\n<pre class=\"kotlin\"><code>interface Source&lt;out T&gt; { fun next(): T }        // 생산자: T는 반환 위치에만\ninterface Sink&lt;in T&gt; { fun put(value: T) }       // 소비자: T는 파라미터 위치에만\n\nfun use(cats: Source&lt;Cat&gt;, animalSink: Sink&lt;Animal&gt;) {\n    val animals: Source&lt;Animal&gt; = cats           // out이라 허용\n    val catSink: Sink&lt;Cat&gt; = animalSink          // in이라 허용\n}\n\nclass PluginRunner @Inject constructor(\n    private val plugins: Set&lt;@JvmSuppressWildcards Plugin&gt;,  // Java 와일드카드 제거\n)<\/code><\/pre>","f":"<ul>\n<li><strong><code>List&lt;*&gt;<\/code>와 <code>List&lt;Any?&gt;<\/code>는 무엇이 다릅니까?<\/strong> <code>List&lt;Any?&gt;<\/code>는 아무 원소나 담는 구체 타입이고, <code>List&lt;*&gt;<\/code>는 어떤 특정 타입의 리스트인데 그 타입을 모른다는 뜻입니다. <code>MutableList&lt;Any?&gt;<\/code>에는 아무 값이나 넣을 수 있지만 <code>MutableList&lt;*&gt;<\/code>에는 넣을 수 없습니다.<\/li>\n<li><strong>out으로 선언했는데 파라미터에 T를 받아야 하면?<\/strong> List.contains처럼 값을 저장하지 않는 경우 @UnsafeVariance로 검사를 끕니다. 값을 저장한다면 무공변으로 두는 것이 맞습니다.<\/li>\n<li><strong>reified의 제약은?<\/strong> inline 함수에서만 쓸 수 있고 본문이 호출 지점마다 복사됩니다. 클래스의 타입 파라미터에는 쓸 수 없습니다.<\/li>\n<\/ul>"},{"no":10,"t":"by lazy와 lateinit은 어떻게 다르고, 위임 프로퍼티는 어떻게 동작합니까?","a":"<p>by lazy는 처음 읽을 때 한 번 계산해 캐시하는 val이고, lateinit은 선언할 때 비워 두고 나중에 바깥에서 대입하는 var입니다. lazy는 초기화 시점을 프로퍼티가 스스로 정하고, lateinit은 초기화 책임이 DI나 생명주기 콜백 같은 바깥에 있습니다. lazy는 위임 프로퍼티라는 일반 기능의 한 사례이고, lateinit은 컴파일러가 직접 지원하는 수식어입니다.<\/p>\n<p>lazy의 기본 모드는 SYNCHRONIZED로, 여러 스레드가 동시에 읽어도 초기화 블록이 한 번만 실행되도록 잠금을 겁니다. PUBLICATION은 여러 스레드가 동시에 계산할 수 있지만 처음 저장된 값만 쓰이고, NONE은 동기화가 없어 메인 스레드에서만 쓰는 값의 비용을 아낍니다. 초기화 블록이 예외를 던지면 값이 저장되지 않아 다음 접근 때 다시 실행됩니다. lateinit은 non-null 참조 타입의 var에만 쓸 수 있어 Int 같은 원시 타입에는 못 쓰고, 초기화 전에 읽으면 UninitializedPropertyAccessException이 납니다. <code>::prop.isInitialized<\/code>로 확인할 수 있지만 이 검사가 자주 필요하면 nullable이 더 정직한 모델입니다.<\/p>\n<p>위임 프로퍼티 <code>var x by d<\/code>는 컴파일러가 숨은 필드에 d를 저장하고, x를 읽을 때 <code>d.getValue(this, property)<\/code>, 쓸 때 <code>d.setValue(this, property, value)<\/code>를 부르는 코드로 바꿉니다. operator getValue와 setValue만 있으면 어떤 객체든 위임 대상이 됩니다. <code>by viewModels()<\/code>는 Lazy를 돌려줘 첫 접근 때 ViewModelProvider에서 ViewModel을 찾고, Delegates.observable은 setValue에서 콜백을 부르며, SavedStateHandle을 감싸면 프로세스 종료 뒤에도 복원되는 프로퍼티가 됩니다. Lifecycle에는 @Serializable 값을 SavedStateHandle에 저장하는 공식 위임 saved가 있어 실무에서는 그것을 쓰고, 아래 코드는 같은 원리를 직접 구현한 개념 코드입니다.<\/p>\n<p>Fragment에서 <code>val button by lazy { requireView().findViewById&lt;Button&gt;(R.id.ok) }<\/code>는 버그입니다. Fragment 인스턴스는 백스택에 있는 동안 살아 있지만 View는 onDestroyView에서 버려지고 다시 만들어집니다. lazy는 처음 만든 View를 계속 붙잡아 누수가 생기고, 돌아온 화면에서 새 View가 아니라 버려진 View를 갱신합니다. View 참조는 onViewCreated에서 잡고 onDestroyView에서 null로 놓습니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 공식 saved 위임과 같은 원리를 직접 구현\nclass SearchViewModel(handle: SavedStateHandle) : ViewModel() {\n    var query: String by handle.stateOf(&quot;&quot;)  // 프로세스 종료 뒤에도 복원\n}\n\nfun &lt;T&gt; SavedStateHandle.stateOf(default: T) = object : ReadWriteProperty&lt;Any?, T&gt; {\n    override fun getValue(thisRef: Any?, property: KProperty&lt;*&gt;): T =\n        get&lt;T&gt;(property.name) ?: default\n    override fun setValue(thisRef: Any?, property: KProperty&lt;*&gt;, value: T) =\n        set(property.name, value)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>lazy가 누수를 만들 수 있습니까?<\/strong> 초기화 블록 람다는 초기화 뒤 놓아 주지만 계산된 값은 프로퍼티 주인과 같이 삽니다. Fragment의 View처럼 주인보다 짧게 살아야 할 객체를 담으면 누수입니다.<\/li>\n<li><strong>lateinit과 nullable 중 무엇을 고릅니까?<\/strong> Hilt 필드 주입이나 onCreate 대입처럼 생명주기상 반드시 먼저 대입되면 lateinit, 값이 없는 상태가 정상적으로 존재하면 nullable입니다.<\/li>\n<li><strong>by viewModels()를 Fragment가 붙기 전에 쓰면?<\/strong> 선언만으로는 문제없지만 Lazy라서 값에 처음 접근하는 시점에 ViewModelStore가 필요합니다. Fragment가 Activity에 붙기 전에 접근하면 예외가 나므로 onCreate 이후에 씁니다.<\/li>\n<\/ul>"},{"no":11,"t":"object, companion object, const val, @JvmStatic, @JvmField는 어떻게 다르고 언제 초기화됩니까?","a":"<p>object 선언은 클래스와 그 유일한 인스턴스를 함께 만드는 싱글턴이고, companion object는 바깥 클래스에 붙은 실제 객체입니다. Kotlin 문서 기준으로 object 선언은 처음 접근할 때 지연 초기화되고, companion object는 바깥 클래스가 로드될 때 Java의 static 초기화와 같은 시점에 초기화됩니다. 둘 다 JVM의 클래스 초기화 규칙을 따르므로 별도 동기화 없이 스레드 안전하게 한 번만 만들어집니다.<\/p>\n<p>JVM에서 object는 static INSTANCE 필드를 가진 클래스가 되고, 그 필드는 static 초기화 블록에서 채워집니다. companion은 바깥 클래스의 static 필드 Companion에 담긴 인스턴스이고 멤버 함수는 그 인스턴스의 메서드입니다. 그래서 Java에서는 <code>Config.Companion.load()<\/code>로 부르게 되고, @JvmStatic을 붙이면 바깥 클래스에 static 메서드가 추가되어 <code>Config.load()<\/code>가 됩니다. 프로퍼티는 기본으로 getter를 거치는데, @JvmField를 붙이면 getter 없이 public static 필드로 노출됩니다.<\/p>\n<p>const val은 컴파일 타임 상수라서 원시 타입과 String만 되고, 최상위나 object, companion 안에만 선언할 수 있습니다. 값이 사용하는 쪽 바이트코드에 직접 복사되어 접근 비용이 없고 어노테이션 인자로 쓸 수 있습니다. 대신 라이브러리의 const 값을 바꾸면 사용하는 모듈을 다시 컴파일해야 새 값이 반영됩니다.<\/p>\n<p>object에 가변 상태를 두면 문제 두 가지가 생깁니다. 테스트에서는 같은 프로세스의 테스트끼리 상태를 공유해 실행 순서에 따라 결과가 달라지고, 직접 참조하므로 가짜 구현으로 바꿀 수 없습니다. 운영에서는 프로세스 종료 뒤 시스템이 Activity 스택과 저장된 상태를 복원해도 object는 초기값으로 다시 만들어지므로, object에 들고 있던 로그인 사용자나 선택한 경로가 비어 화면과 어긋납니다. 공유 상태는 Hilt의 @Singleton으로 주입하고, 복원이 필요한 값은 SavedStateHandle이나 디스크에 둡니다.<\/p>\n<pre class=\"kotlin\"><code>class Config {\n    companion object {\n        const val TIMEOUT_MS = 10_000L          // Java: Config.TIMEOUT_MS, 값이 호출 쪽에 복사\n        @JvmField val DEFAULT = Config()         // Java: Config.DEFAULT, getter 없음\n        val cache = Cache()                      // Java: Config.Companion.getCache()\n        @JvmStatic fun load(): Config = DEFAULT  // Java: Config.load()\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>companion에 무거운 초기화를 두면?<\/strong> 바깥 클래스를 처음 쓰는 순간 함께 실행되므로, 앱 시작 경로에서 그 클래스를 건드리기만 해도 비용이 생깁니다. 지연이 필요하면 by lazy나 별도 object로 옮깁니다.<\/li>\n<li><strong>object 대신 DI 싱글턴을 쓰는 이유는?<\/strong> 교체 가능성과 드러난 의존성입니다. Hilt의 @Singleton은 테스트에서 다른 구현으로 바꿀 수 있고 생성자에 의존성이 보이지만, object는 어디서나 접근할 수 있어 숨은 의존성이 됩니다.<\/li>\n<li><strong>object에 Context를 저장하면?<\/strong> 프로세스 내내 사는 객체가 Activity를 붙잡아 누수가 납니다. 꼭 필요하면 applicationContext만 둡니다.<\/li>\n<\/ul>"},{"no":12,"t":"Java와 Kotlin이 섞인 코드베이스에서 interop 문제는 어떻게 다룹니까?","a":"<p>원칙은 호출 방향마다 경계를 관리하는 것입니다. Java가 Kotlin을 부를 때는 기본 인자, 프로퍼티, companion, 최상위 함수처럼 Kotlin에만 있는 모양과 checked 예외를 선언하지 않는 점이 Java에서 어떻게 보이는지를 어노테이션으로 맞춥니다. Kotlin이 Java를 부를 때는 플랫폼 타입이 생기지 않게 Java 쪽에 nullability 어노테이션을 붙입니다.<\/p>\n<p>Java 호출자를 위한 도구는 다음과 같습니다. 기본 인자는 Java에 없으므로 @JvmOverloads로 오버로드를 만듭니다. 다만 커스텀 View 생성자에 @JvmOverloads와 defStyleAttr 기본값 0을 쓰면, Button이나 TextView처럼 두 인자 생성자가 기본 스타일 속성을 넘기는 위젯을 상속할 때 그 값이 0으로 덮여 테마 스타일이 빠집니다. @JvmName은 Java에서 부를 이름을 바꾸거나, <code>List&lt;String&gt;<\/code>과 <code>List&lt;Int&gt;<\/code>를 받는 두 함수가 타입 소거로 같은 시그니처가 되는 충돌을 풀 때 씁니다. Kotlin 함수는 throws를 선언하지 않으므로 Java에서 IOException을 catch하려면 @Throws(IOException::class)를 붙여야 합니다. 프로퍼티는 getName과 setName으로, is로 시작하는 프로퍼티는 isEnabled와 setEnabled로 보입니다.<\/p>\n<p>람다 쪽도 방향을 봐야 합니다. Java 인터페이스를 받는 자리에는 Kotlin 람다를 바로 넘길 수 있지만, Kotlin 인터페이스는 fun interface로 선언해야 람다로 구현할 수 있습니다. Java 호출자에게 콜백을 <code>(String) -&gt; Unit<\/code> 같은 함수 타입으로 노출하면 Java에서는 Function1을 구현하고 Unit.INSTANCE를 반환해야 하므로 fun interface가 낫습니다. 인터페이스 기본 구현은 Kotlin 2.2.0부터 -jvm-default 기본값이 enable이라 JVM default 메서드로 컴파일되어, Java 구현 클래스가 기본 구현이 있는 메서드까지 구현할 필요가 없습니다.<\/p>\n<p>점진 전환은 Java 코드에 nullability 어노테이션을 먼저 붙여 경계를 단단하게 하고, 새 코드는 Kotlin으로 쓰고, 기존 코드는 테스트 코드, 그리고 다른 코드에 의존하지 않는 데이터 모델과 유틸리티부터 변환해 위로 올라가는 순서가 무난합니다. 변환한 클래스를 여전히 Java가 부르면 위 어노테이션으로 호출 코드를 그대로 둡니다. 자동 변환 결과에 남은 <code>!!<\/code>와 플랫폼 타입은 사람이 정리하고, 변환 커밋과 로직 변경 커밋을 나눠 리뷰와 git 이력을 지킵니다.<\/p>\n<pre class=\"kotlin\"><code>class RouteClient {\n    @JvmOverloads                                // Java: search(q), search(q, limit), search(q, limit, sort)\n    fun search(query: String, limit: Int = 20, sort: Sort = Sort.DISTANCE) { }\n\n    @Throws(IOException::class)                  // Java에서 catch (IOException e) 가능\n    fun download(id: String): ByteArray = TODO()\n}\n\nfun interface OnRouteListener {                  // Java와 Kotlin 모두 람다로 구현\n    fun onRoute(route: Route)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Java에서 Kotlin의 internal은 어떻게 보입니까?<\/strong> JVM에는 internal이 없어 public으로 컴파일되고 이름이 맹글링됩니다. Java에서 부를 수는 있으므로 접근 제어 경계로 기대하면 안 됩니다.<\/li>\n<li><strong>Java가 Kotlin 함수에 null을 넘기면?<\/strong> public 함수의 non-null 파라미터에는 컴파일러가 진입 검사를 넣어 그 자리에서 NPE가 납니다. 잘못된 값이 경계에서 바로 드러나는 셈입니다.<\/li>\n<li><strong>어떤 파일부터 변환합니까?<\/strong> 상태 위주의 데이터 모델, 테스트 코드, 확장 함수로 바꿀 유틸리티 클래스가 먼저입니다. Android 공식 도입 가이드가 이 셋을 시작점으로 들고, 팀이 익숙해지면 Fragment, Activity, ViewModel 같은 큰 구성 요소로 넓히라고 합니다. 안정적이고 거의 바뀌지 않는 Java 코드는 경계 어노테이션만 붙이고 두는 것도 선택지입니다.<\/li>\n<\/ul>"},{"no":13,"t":"Collection 연산과 Sequence는 어떻게 다르고, Sequence가 오히려 느린 경우는 언제입니까?","a":"<p>Collection 연산은 즉시 평가라 map, filter 단계마다 전체 원소를 처리해 중간 리스트를 만들고 다음 단계로 넘깁니다. Sequence는 지연 평가라 toList, first, sum 같은 종단 연산이 불릴 때 원소 하나씩 모든 단계를 통과시키고 중간 리스트를 만들지 않습니다. 그래서 원소가 많고 단계가 길거나 first, take처럼 일찍 끝낼 수 있는 연산에서 Sequence가 유리하고, 작은 컬렉션과 짧은 체인에서는 Collection이 더 빠릅니다.<\/p>\n<p>Sequence가 느려지는 이유는 비용 구조가 다르기 때문입니다. Collection의 map, filter는 inline 함수라 람다가 객체가 되지 않고 단순한 루프로 펼쳐집니다. Sequence 연산은 inline이 아니어서 단계마다 람다 객체와 Iterator 래퍼가 생기고, 원소마다 여러 겹의 hasNext와 next 호출을 거칩니다. 원소가 적고 단계가 두세 개면 중간 리스트를 아끼는 이득보다 이 오버헤드가 큽니다. 또 sorted, sortedBy 같은 상태 연산은 전체 원소를 모아야 다음 단계로 넘길 수 있어 그 지점에서 지연 평가의 이점이 사라집니다. <code>Sequence&lt;Int&gt;<\/code>는 원소를 박싱하므로 숫자 대량 처리에는 IntArray와 루프가 낫습니다.<\/p>\n<p>Java Stream과 비교하면 같은 지연 파이프라인 개념입니다. 차이는 Stream은 한 번만 소비할 수 있고 parallel()과 IntStream 같은 원시 타입 특화가 있는 반면, Sequence는 순차 처리만 하고 원본에 따라 여러 번 순회할 수 있으며 Kotlin Multiplatform 공통 코드에서도 쓸 수 있다는 점입니다. 어느 쪽이 빠른지는 감이 아니라 실제 데이터 크기로 Jetpack Microbenchmark를 돌려 판단합니다.<\/p>\n<pre class=\"kotlin\"><code>val names = places              // 원소가 많은 리스트\n    .asSequence()\n    .filter { it.isOpen }\n    .map { it.name }\n    .take(20)                   // 20개를 찾으면 나머지 원소는 처리하지 않는다\n    .toList()\n\nval doubled = listOf(3, 1, 2)   // 작은 컬렉션은 Collection 연산이 빠르다\n    .map { it * 2 }\n    .filter { it &gt; 2 }<\/code><\/pre>","f":"<ul>\n<li><strong>Sequence가 항상 빠릅니까?<\/strong> 아닙니다. 원소마다 단계를 거치는 오버헤드가 있어 작은 컬렉션에서는 Collection 연산이 빠릅니다.<\/li>\n<li><strong>연산 순서도 성능에 영향을 줍니까?<\/strong> 줍니다. filter를 map보다 앞에 두면 버릴 원소를 변환하지 않습니다. Collection이든 Sequence든 같은 원칙입니다.<\/li>\n<li><strong>Flow와 Sequence는 어떤 관계입니까?<\/strong> 둘 다 종단 연산 전에는 아무 일도 하지 않는 Cold 스트림이지만, Sequence는 동기이고 Flow는 suspend로 비동기 값을 다룹니다. sequence 빌더의 yield와 flow 빌더의 emit이 닮은 이유입니다.<\/li>\n<\/ul>"},{"no":14,"t":"Kotlin 2.0의 K2 컴파일러로 올릴 때 무엇이 바뀌고, 무엇을 확인합니까?","a":"<p>K2는 Kotlin 컴파일러의 프런트엔드, 즉 의미 분석, 호출 해석, 타입 추론 부분을 새로 쓴 것으로, Kotlin 2.0.0에서 모든 타깃에 Stable이 되며 기본으로 켜졌습니다. 문법은 거의 그대로지만 스마트 캐스트 범위와 일부 오류 판정이 바뀌고, 빌드에서는 Compose 컴파일러 설정과 어노테이션 처리기를 함께 옮겨야 합니다. 2.4.0에서 K1으로 돌아가는 -language-version=1.9 지원이 빠졌으므로 지금은 미룰 수 없는 전환입니다.<\/p>\n<p>코드에서 체감하는 변화는 스마트 캐스트 확대입니다. 타입 검사 결과를 if 밖의 지역 변수에 담아도 그 정보가 if 블록 안까지 전달되고, <code>||<\/code>로 묶은 타입 검사는 공통 상위 타입으로 캐스트되며, inline 함수의 람다 안에서도 스마트 캐스트가 유지됩니다. 반대로 새로 오류가 되는 코드도 있습니다. 공식 마이그레이션 가이드는 backing field가 있는 open val을 즉시 초기화하지 않으면 오류가 되는 것, 같은 이름의 Kotlin 프로퍼티와 Java 필드가 상속 관계에 있으면 하위 클래스 쪽으로 일관되게 해석하는 것, Java 원시 배열의 TYPE_USE nullability 어노테이션을 반영해 null 검사 없이 쓰면 컴파일이 실패하는 것을 대표 변경으로 듭니다.<\/p>\n<p>빌드에서 확인할 것은 세 가지입니다. 첫째, Compose 컴파일러는 2.0.0부터 Kotlin 저장소에 들어와 org.jetbrains.kotlin.plugin.compose 플러그인으로 적용하고 버전은 Kotlin 버전을 따릅니다. 2.0.20부터는 strong skipping이 기본이라 리컴포지션 동작이 달라질 수 있어 화면 회귀 테스트를 합니다. 둘째, KAPT는 2.1.20부터 K2 kapt가 기본이지만 AGP 9.0의 내장 Kotlin과 kotlin-kapt 플러그인이 호환되지 않으므로 KSP로 옮기는 것이 정답입니다. KSP도 KSP1이 제거되어 KSP2를 써야 하고, Room 3.0은 KSP만 지원합니다. 셋째, 2.2.0부터 Gradle의 kotlinOptions {}가 오류이므로 compilerOptions {}로 바꿉니다.<\/p>\n<p>컴파일 속도는 공식 가이드가 Anki-Android의 클린 빌드가 57.7초(1.9.23)에서 29.7초(2.0.0)로 줄었다고 적었지만 프로젝트마다 다릅니다. 같은 조건에서 전환 전후 빌드 시간을 재서 판단하고, 경고를 먼저 정리한 뒤 Parcelize, Serialization, 사용하는 어노테이션 처리기의 호환을 확인하고 모듈 단위로 CI를 돌립니다.<\/p>\n<pre class=\"kotlin\"><code>// K2: 조건을 지역 변수로 뽑아도 스마트 캐스트가 유지된다\nval isCat = animal is Cat\nif (isCat) animal.purr()\n\n// 모듈 build.gradle.kts\nplugins {\n    id(&quot;com.android.application&quot;)\n    id(&quot;org.jetbrains.kotlin.plugin.compose&quot;)   // Compose 컴파일러, 버전은 Kotlin과 같다\n    id(&quot;com.google.devtools.ksp&quot;)               // kapt 대신 KSP\n}\n// AGP 9.0부터는 내장 Kotlin이라 org.jetbrains.kotlin.android를 함께 적용하면 구성 오류<\/code><\/pre>","f":"<ul>\n<li><strong>K2로 올린 뒤 Compose 화면 일부가 갱신되지 않습니다. 원인은?<\/strong> 2.0.20부터 strong skipping이 기본이라 불안정 파라미터도 인스턴스가 같으면 건너뛰고, 람다는 캡처 값을 키로 자동 remember됩니다. 가변 객체를 제자리에서 고치고 부모의 리컴포지션에 기대던 코드는 자식이 건너뛰어져 갱신되지 않으므로, 상태를 새 인스턴스나 Compose 상태로 바꿉니다.<\/li>\n<li><strong>KAPT를 당장 걷어낼 수 없으면?<\/strong> AGP 9.0 문서는 KSP로 옮기거나 같은 AGP 버전의 com.android.legacy-kapt 플러그인으로 바꾸라고 안내합니다. legacy-kapt는 이행용으로 두고 처리기별로 KSP로 옮깁니다.<\/li>\n<li><strong>K2에서 막히면 K1으로 되돌릴 수 있습니까?<\/strong> 2.4.0 이전의 2.x에서는 languageVersion을 1.9로 두어 K1으로 잠시 되돌릴 수 있었지만, 2.4.0부터는 -language-version=1.9를 지원하지 않아 되돌릴 수 없습니다. K2에서 나는 오류를 고치는 방향만 남았습니다.<\/li>\n<\/ul>"},{"no":15,"t":"최근 Kotlin(2.1 이후)에서 실무에 바로 쓸 만한 언어 기능은 무엇입니까?","a":"<p>바로 쓸 것은 Stable이 된 기능으로 한정합니다. Android 코드에서 효과가 큰 것은 2.2.0의 when guard 조건과 2.4.0의 explicit backing fields이고, 표준 라이브러리에서는 Base64와 HexFormat(2.2.0), kotlin.time.Instant와 Clock(2.3.0), Uuid(2.4.0)가 Stable이라 외부 의존성을 줄일 수 있습니다. Experimental 기능은 컴파일러 옵션으로 켜야 하고 문법과 의미가 바뀔 수 있으므로 제품 코드에는 넣지 않습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>기능<\/th>\n<th>상태<\/th>\n<th>쓰임<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>when guard 조건<\/td>\n<td>2.2.0 Stable<\/td>\n<td>분기에 조건을 붙여도 완전성 검사 유지<\/td>\n<\/tr>\n<tr>\n<td>non-local break, continue<\/td>\n<td>2.2.0 Stable<\/td>\n<td>inline 람다 안에서 그 호출을 감싼 for, while 루프 제어<\/td>\n<\/tr>\n<tr>\n<td>multi-dollar 문자열 보간<\/td>\n<td>2.2.0 Stable<\/td>\n<td>$ 기호가 많은 문자열 리터럴<\/td>\n<\/tr>\n<tr>\n<td>nested type aliases<\/td>\n<td>2.3.0 Stable<\/td>\n<td>클래스 안에 typealias 선언<\/td>\n<\/tr>\n<tr>\n<td>data-flow 기반 when 완전성 검사<\/td>\n<td>2.3.0 Stable<\/td>\n<td>앞에서 걸러 낸 경우를 when이 다시 요구하지 않음<\/td>\n<\/tr>\n<tr>\n<td>explicit backing fields<\/td>\n<td>2.4.0 Stable<\/td>\n<td>비공개 가변 필드와 공개 읽기 타입을 프로퍼티 하나로<\/td>\n<\/tr>\n<tr>\n<td>context parameters<\/td>\n<td>2.4.0 Stable<\/td>\n<td>로거, 트랜잭션 같은 문맥을 암묵 인자로 전달<\/td>\n<\/tr>\n<tr>\n<td>context-sensitive resolution<\/td>\n<td>2.2.0 Preview, 2.3.0에도 Experimental<\/td>\n<td>기대 타입이 정해지면 타입 이름 생략<\/td>\n<\/tr>\n<tr>\n<td>name-based destructuring<\/td>\n<td>2.3.20 Experimental<\/td>\n<td>프로퍼티 이름으로 구조 분해<\/td>\n<\/tr>\n<tr>\n<td>unused return value checker<\/td>\n<td>2.3.0 Experimental<\/td>\n<td>반환값을 버린 호출 경고<\/td>\n<\/tr>\n<tr>\n<td>collection literals<\/td>\n<td>2.4.0 Experimental<\/td>\n<td>컬렉션 리터럴 문법<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>explicit backing fields가 Android에서 가장 체감됩니다. ViewModel마다 private _uiState와 공개 uiState 쌍을 두던 관례를 프로퍼티 하나로 줄이고, 클래스 안에서는 MutableStateFlow로 스마트 캐스트되어 바로 갱신할 수 있습니다. guard 조건은 sealed 상태 분기에서 중첩 if를 없애면서 완전성 검사를 지킵니다. context parameters는 로거나 트랜잭션 같은 횡단 관심사를 함수 시그니처의 context로 받는 기능입니다. 2.3.20부터 예전 실험 기능인 context receivers가 지원되지 않으므로 그것을 쓰던 코드는 옮겨야 하고, 2.4.0 기준 명시적 context arguments는 아직 Experimental입니다.<\/p>\n<p>도입할 때는 툴체인도 봅니다. Compose 컴파일러 버전이 Kotlin 버전을 따르므로 Kotlin을 올리면 Compose 컴파일러도 함께 바뀌고, AGP 9.0은 KGP 2.2.10에 런타임 의존해 더 낮은 KGP를 2.2.10으로 올립니다. Kotlin 버전은 버전 카탈로그 한 곳에서 관리하고, 새 기능을 쓰는 곳이 라이브러리 모듈이면 그 모듈을 쓰는 쪽의 Kotlin 버전도 확인합니다.<\/p>\n<pre class=\"kotlin\"><code>class SearchViewModel : ViewModel() {\n    // 이전 관례: private val _uiState = MutableStateFlow(...)와 공개 uiState 쌍\n    val uiState: StateFlow&lt;SearchUiState&gt;\n        field = MutableStateFlow(SearchUiState())   // explicit backing field(2.4.0 Stable)\n\n    fun onQueryChange(q: String) {\n        uiState.update { it.copy(query = q) }       // 클래스 안에서는 MutableStateFlow로 스마트 캐스트\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Experimental 기능을 제품 코드에 쓰면 어떤 위험이 있습니까?<\/strong> 다음 버전에서 문법이나 의미가 바뀌거나 사라질 수 있어 업그레이드 때 대량 수정이 생깁니다. 실험 기능이던 context receivers가 Revoked로 정리되고 context parameters로 대체된 것이 그 예입니다.<\/li>\n<li><strong>Uuid는 바로 써도 됩니까?<\/strong> 2.4.0에서 Uuid API는 Stable이지만 V4와 V7 생성 함수는 아직 Experimental입니다. 파싱과 표현은 그대로 쓰고 생성 함수에는 opt-in이 필요하다는 점을 압니다.<\/li>\n<li><strong>rich errors는 언제 쓸 수 있습니까?<\/strong> 언어 기능 페이지 기준 아직 설계 탐색 단계라 도입 버전이 없습니다. 지금은 sealed 결과 타입으로 실패를 표현하며, 기준은 1절의 실패 표현 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":16,"t":"Kotlin에서 실패는 어떻게 표현합니까? 예외, Result와 runCatching, sealed 결과 타입은 어떤 기준으로 고릅니까?","a":"<p>기준은 실패가 프로그래밍 오류인지, 호출자가 처리해야 하는 예상 가능한 실패인지입니다. 잘못된 인자나 깨진 불변식 같은 프로그래밍 오류는 require, check, error로 예외를 던져 바로 드러내고, 네트워크 끊김이나 검증 실패처럼 정상 흐름의 일부인 실패는 반환 타입에 드러냅니다. 실패 종류에 따라 화면이 달라져야 하면 sealed 결과 타입, 성공과 실패만 구분하면 되는 좁은 범위에서는 Result, 값이 없다는 것 자체가 의미면 null을 씁니다.<\/p>\n<p>Kotlin에 checked 예외가 없는 이유는 Java에서 빈 catch로 예외를 삼키는 습관과 throws 선언이 계층을 따라 번지는 부작용이 컸고, 람다와 고차 함수와도 잘 맞지 않았기 때문입니다. 대신 컴파일러가 처리를 강제하지 않으므로 예상 가능한 실패는 타입으로 표현해야 호출자가 잊지 않습니다. 예외는 생성할 때 스택 트레이스를 채우는 비용도 있어 흐름 제어에 쓰지 않습니다.<\/p>\n<p>runCatching은 편하지만 내부가 Throwable을 잡는 try-catch라서 두 가지를 함께 삼킵니다. 하나는 CancellationException입니다. 코루틴 취소는 이 예외로 전파되므로 suspend 호출을 runCatching으로 감싸면 취소가 실패 값으로 바뀌고, 취소된 코루틴이 다음 코드를 계속 실행해 구조화된 동시성이 깨집니다(2절). 공식 문서도 CancellationException은 잡지 않거나, 잡았다면 다시 던지라고 적습니다. 다른 하나는 OutOfMemoryError 같은 Error로, 복구할 수 없는 상태를 정상 실패처럼 처리하게 됩니다. 그래서 suspend 코드에서는 IOException처럼 구체 타입만 잡습니다.<\/p>\n<p>계층 경계에서 변환하는 것이 핵심입니다. Data 계층은 Retrofit의 HttpException과 IOException을 잡아 도메인 실패 타입으로 바꾸고, UI 계층은 그 타입을 화면 상태와 메시지로 바꿉니다. 라이브러리 예외 타입이 ViewModel까지 올라오면 UI가 Data 계층 구현에 묶입니다.<\/p>\n<pre class=\"kotlin\"><code>sealed interface SearchResult {\n    data class Success(val places: List&lt;Place&gt;) : SearchResult\n    data object NetworkError : SearchResult\n    data class ServerError(val code: Int) : SearchResult\n}\n\nsuspend fun search(q: String): SearchResult = try {\n    SearchResult.Success(api.search(q).toDomain())\n} catch (e: IOException) {\n    SearchResult.NetworkError\n} catch (e: HttpException) {\n    SearchResult.ServerError(e.code())\n}   // CancellationException은 잡지 않으므로 취소는 그대로 전파된다<\/code><\/pre>","f":"<ul>\n<li><strong>Result를 모든 계층에 쓰면?<\/strong> 실패 종류가 Throwable 하나로 뭉개져 UI가 is 검사로 예외 타입을 다시 추측하게 됩니다. 도메인 실패는 sealed 타입으로 나누는 편이 명확합니다.<\/li>\n<li><strong>CoroutineExceptionHandler가 async의 예외를 받습니까?<\/strong> 받지 않습니다. 핸들러는 루트 코루틴의 처리되지 않은 예외에만 불리고, async의 예외는 await하는 쪽에서 처리합니다.<\/li>\n<li><strong>Java에서 호출될 함수는 어떻게 합니까?<\/strong> @Throws로 checked 예외를 선언해야 Java 호출자가 catch할 수 있습니다.<\/li>\n<\/ul>"},{"no":17,"t":"서버 JSON 파싱에 kotlinx.serialization, Moshi, Gson은 어떻게 다르고, Gson이 Kotlin에서 위험한 이유는 무엇입니까?","a":"<p>새 Kotlin 프로젝트라면 kotlinx.serialization이 기본 선택이고, 이미 Moshi를 쓰고 있다면 코드 생성 방식의 Moshi도 안전합니다. Gson은 Kotlin 타입 시스템을 모르는 리플렉션 라이브러리라서 non-null 프로퍼티에 null을 넣고 기본값을 무시할 수 있어 Kotlin 모델에는 권하지 않습니다.<\/p>\n<p>Gson은 리플렉션으로 필드를 찾아 값을 넣고, 인자 없는 생성자가 없으면 Unsafe 할당으로 생성자를 아예 거치지 않고 객체를 만듭니다. 그러면 생성자 안의 기본값 대입과 init 검증이 실행되지 않아, JSON에 필드가 없으면 <code>val name: String<\/code>이 null이 되고 <code>= emptyList()<\/code> 같은 기본값도 무시됩니다. 모든 프로퍼티에 기본값을 주면 인자 없는 생성자가 생겨 기본값은 살지만, JSON에 null이 명시되면 여전히 non-null 필드에 null이 들어갑니다. 오류는 파싱 시점이 아니라 그 값을 쓰는 화면에서 NPE로 터져 원인을 찾기 어렵습니다. 필드 이름에 의존하므로 R8 keep 규칙이나 @SerializedName도 필요하고, AGP 9.0부터 strictFullModeForKeepRules 기본값이 true라 <code>-keep class A<\/code>가 기본 생성자 유지를 뜻하지 않아 규칙을 다시 점검해야 합니다.<\/p>\n<p>kotlinx.serialization은 컴파일러 플러그인이 @Serializable 클래스의 직렬화 코드를 컴파일 타임에 만들고 생성자를 거쳐 객체를 만듭니다. 리플렉션이 없어 R8 부담이 적고, 필드가 없으면 선언한 기본값을 쓰며, 기본값도 없는 필수 필드가 빠지면 파싱 시점에 예외를 던져 문제를 경계에서 드러냅니다. Kotlin Multiplatform 공통 코드에서도 씁니다. Moshi는 @JsonClass(generateAdapter = true)로 어댑터를 생성하는 방식이 Kotlin의 nullability와 기본값을 지킵니다.<\/p>\n<p>하위 호환에서는 기본 동작을 알아야 합니다. kotlinx.serialization의 Json은 기본으로 모르는 키를 만나면 오류를 냅니다. 서버가 필드를 추가하는 순간 구버전 앱이 파싱에 실패하므로 <code>Json { ignoreUnknownKeys = true }<\/code>를 켭니다. 반대로 서버가 필드를 뺄 수 있으면 기본값을 주고, null을 보낼 수 있으면 그 필드를 nullable로 두거나 coerceInputValues를 켠 상태에서 기본값을 줍니다. 앱은 업데이트하지 않은 사용자가 오래 남으므로, API는 필드 추가만 하고 삭제와 타입 변경은 버전을 나누는 원칙을 서버와 맞춥니다.<\/p>\n<pre class=\"kotlin\"><code>@Serializable\ndata class PlaceDto(\n    val id: String,                       // 없으면 파싱 시점에 예외\n    val name: String,\n    val tags: List&lt;String&gt; = emptyList(), // 없으면 기본값\n    val rating: Double? = null,           // 서버가 뺄 수 있는 필드\n)\n\nval json = Json { ignoreUnknownKeys = true }  // 기본값은 모르는 키에서 오류\nval place = json.decodeFromString&lt;PlaceDto&gt;(body)<\/code><\/pre>","f":"<ul>\n<li><strong>서버가 non-null로 약속한 필드에 null을 보내면 라이브러리마다 어떻게 됩니까?<\/strong> Gson은 그대로 null을 넣고, kotlinx.serialization과 Moshi 코드 생성은 파싱 시점에 예외를 냅니다. kotlinx.serialization은 coerceInputValues를 켜면 기본값이 있는 non-null 필드의 null을 기본값으로 바꿉니다.<\/li>\n<li><strong>enum 필드에 서버가 새 값을 보내면?<\/strong> kotlinx.serialization 기본 설정에서는 파싱이 실패합니다. coerceInputValues와 기본값을 두거나, 문자열로 받아 매핑 함수에서 UNKNOWN 같은 대체 값으로 바꿉니다.<\/li>\n<li><strong>DTO와 도메인 모델을 나누는 이유는?<\/strong> 서버 스키마 변화가 도메인과 UI로 번지지 않게 하고 직렬화 어노테이션을 Data 계층에 가두기 위해서입니다. null과 기본값 정책을 매핑 함수 한곳에 모읍니다.<\/li>\n<\/ul>"},{"no":18,"t":"Kotlin Multiplatform은 무엇이고, Android 팀이 도입을 검토할 때 기준은 무엇입니까?","a":"<p>KMP는 같은 Kotlin 코드를 Android, iOS, 데스크톱, 서버 등 여러 타깃으로 컴파일해 공유하는 기술이고, Kotlin 구성 요소 안정성 표에서 1.9.20부터 Stable입니다. 검토할 때는 비즈니스 로직과 Data 계층만 공유하고 UI는 플랫폼별로 두는 방식과, Compose Multiplatform으로 UI까지 공유하는 방식을 나눠 봐야 합니다. Kotlin 문서의 지원 플랫폼 표에서 Compose Multiplatform은 Android, iOS, 데스크톱이 Stable입니다.<\/p>\n<p>공통 코드는 commonMain에 두고, 플랫폼 API가 필요한 곳은 expect 선언과 플랫폼별 actual 구현으로 연결합니다. 실무에서는 expect와 actual을 넓게 쓰기보다 commonMain에 인터페이스를 두고 플랫폼 구현을 DI로 넣는 편이 테스트와 교체가 쉽습니다. Jetpack도 KMP 지원이 넓어져 Lifecycle의 ViewModel(2.8.0)과 SavedStateHandle(2.9.0), Room(2.7.0부터, Room 3.0은 JS와 WasmJS까지), DataStore(1.1.0), Navigation 3의 KMP 딥 링크 API(1.2.0)를 공통 코드에서 쓸 수 있습니다.<\/p>\n<p>도입 기준은 기술보다 조직 비용입니다. 첫째, 두 앱이 같은 로직을 실제로 중복 구현하고 있고 그 차이가 플랫폼 간 동작 불일치로 이어지는지 봅니다. 검색 결과 정렬, 요금 계산, 입력 검증 같은 순수 로직이 후보이고, 위치 수집, 지도 렌더링, 백그라운드 실행처럼 플랫폼 차이가 큰 영역은 공유 대상에서 뺍니다. 둘째, iOS 팀이 Kotlin 코드를 읽고 디버깅하며 공유 모듈의 리뷰와 소유를 함께 맡을 수 있는지입니다. Swift에서 보이는 API 모양도 비용인데, Swift export는 2.4.0에서 Alpha가 되어 suspend 함수를 Swift async로, Flow를 AsyncSequence로 내보내는 단계입니다. 셋째, 빌드 비용입니다. Kotlin/Native 컴파일이 CI 시간을 늘리고 iOS 앱 빌드에는 macOS 환경이 필요하며, AGP 9.0부터 KMP 라이브러리의 Android 타깃은 com.android.kotlin.multiplatform.library 플러그인을 써야 합니다.<\/p>\n<p>도입은 점진적으로 합니다. 의존성이 적은 모델과 검증 로직으로 공유 모듈 하나를 만들어 iOS 앱에 프레임워크로 붙이고, 빌드 시간과 iOS 팀의 피드백을 본 뒤 Data 계층으로 넓힙니다. UI 공유는 로직 공유가 안정된 다음 일부 화면부터 검토합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드\n// commonMain: 단순한 플랫폼 값은 expect/actual, 교체와 테스트가 필요한 것은 인터페이스\nexpect fun platformName(): String\n\ninterface LocationSource {\n    fun locations(): Flow&lt;GeoPoint&gt;\n}\n\n// androidMain\nactual fun platformName(): String = &quot;Android ${Build.VERSION.SDK_INT}&quot;\n\n// iosMain\nactual fun platformName(): String = UIDevice.currentDevice.systemName()<\/code><\/pre>","f":"<ul>\n<li><strong>expect/actual과 인터페이스 주입은 각각 언제 씁니까?<\/strong> 플랫폼 값 하나나 작은 함수는 expect/actual, 여러 구현을 갈아 끼우거나 테스트 대역이 필요하면 commonMain 인터페이스와 DI입니다. kotlin.time.Instant(2.3.0 Stable)와 Uuid(2.4.0 Stable)가 표준 라이브러리에 들어와 예전에 expect/actual로 만들던 코드도 줄었습니다.<\/li>\n<li><strong>Android 팀만 공유 모듈을 고치면 생기는 일은?<\/strong> 공유 모듈 변경이 iOS 빌드를 깨도 Android CI에서는 드러나지 않습니다. CI에 iOS 타깃 컴파일과 테스트를 넣고 iOS 개발자를 리뷰어로 둡니다.<\/li>\n<li><strong>Compose Multiplatform으로 iOS 화면까지 공유하면 무엇을 따져야 합니까?<\/strong> iOS 기본 컴포넌트와 같은 모양과 동작이 필요한 화면인지, iOS 팀이 Compose를 익힐 수 있는지입니다. 화면 구현을 한 번으로 줄이는 이득과 이 비용을 화면 단위로 비교합니다.<\/li>\n<\/ul>"}]},{"no":2,"title":"Coroutines와 Flow","qs":[{"no":19,"t":"suspend 함수는 컴파일되면 어떻게 바뀌고, 코루틴이 스레드를 막지 않는다는 말은 정확히 무슨 뜻입니까?","a":"<p>컴파일러는 suspend 함수를 continuation-passing style, 줄여서 CPS로 변환합니다. 마지막 파라미터로 Continuation을 하나 더 받고 반환형이 Any?인 일반 함수가 되며, 본문은 중단 지점마다 구간이 나뉜 상태 머신이 됩니다. \"스레드를 막지 않는다\"는 말은 중단하는 동안 COROUTINE_SUSPENDED를 반환하고 호출 스택을 빠져나가 스레드를 돌려준다는 뜻이지, suspend 함수 안의 코드가 저절로 논블로킹이 된다는 뜻은 아닙니다.<\/p>\n<p><code>suspend fun getUser(id: String): User<\/code>는 <code>fun getUser(id: String, completion: Continuation&lt;User&gt;): Any?<\/code> 모양이 됩니다. 반환형이 Any?인 이유는 실제 결과인 User와 중단했다는 표지 값 COROUTINE_SUSPENDED 중 하나를 돌려줘야 하기 때문입니다. 컴파일러는 Continuation 구현 클래스를 만들어 중단 지점을 넘어 살아야 하는 지역 변수를 그 객체의 필드에 저장하고, 다음에 이어 갈 위치를 정수 필드 label에 기록합니다. 콜백이 resumeWith로 결과를 넘기면 Dispatcher가 코루틴을 다시 스레드에 올리고, 상태 머신은 label을 보고 다음 구간부터 실행합니다. 중단 동안에는 스레드 스택이 남지 않고 필요한 상태만 힙 객체로 남기 때문에, 스레드 몇 개 위에 코루틴 수만 개를 띄울 수 있습니다.<\/p>\n<p>중단은 suspendCancellableCoroutine 같은 기본 함수가 실제로 COROUTINE_SUSPENDED를 반환할 때만 일어납니다. suspend 키워드는 \"중단할 수도 있다\"는 표시일 뿐이라, suspend 함수 안에서 Thread.sleep, 동기 파일 읽기, OkHttp의 execute() 같은 블로킹 호출을 하면 그 스레드는 그대로 막힙니다. Main에서 부르면 프레임 드롭과 ANR로 이어집니다. 그래서 Android 코루틴 권장 사항은 suspend 함수를 main-safe하게 만들고, 블로킹 작업을 하는 클래스가 스스로 withContext로 실행을 옮기라고 합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: suspend fun loadProfile(id: String): Profile 이 바뀐 모양\nfun loadProfile(id: String, cont: Continuation&lt;Profile&gt;): Any? {\n    val sm = cont as? LoadProfileStateMachine ?: LoadProfileStateMachine(cont)\n    when (sm.label) {\n        0 -&gt; {\n            sm.id = id                  // 중단 뒤에도 쓸 지역 변수를 필드로 옮김\n            sm.label = 1\n            val user = fetchUser(id, sm)\n            if (user === COROUTINE_SUSPENDED) return COROUTINE_SUSPENDED\n        }\n        1 -&gt; { /* 재개: sm.result에서 fetchUser 결과를 꺼내 이어서 실행 */ }\n    }\n    // ...\n}<\/code><\/pre>","f":"<ul>\n<li><strong>suspend 함수 안에서 블로킹 호출을 하면 어떻게 됩니까?<\/strong> 그 스레드가 그대로 막힙니다. Main에서는 ANR로, Default에서는 코어 수만큼밖에 없는 계산 스레드를 묶어 다른 작업을 밀리게 합니다. withContext(Dispatchers.IO)로 옮기거나 Retrofit, Room처럼 suspend API를 주는 라이브러리를 씁니다.<\/li>\n<li><strong>같은 코루틴이 중단 전후로 다른 스레드에서 실행될 수 있습니까?<\/strong> 스레드가 여러 개인 Dispatcher라면 그렇습니다. 그래서 ThreadLocal이나 스레드 소유권을 전제로 하는 ReentrantLock에 기대는 코드는 코루틴 안에서 위험합니다.<\/li>\n<li><strong>suspendCoroutine과 suspendCancellableCoroutine은 무엇이 다릅니까?<\/strong> 후자만 취소에 반응합니다. kotlinx.coroutines의 suspend 함수는 모두 취소에 협력하도록 만들어져 있어 중단할 때 취소를 확인하고, suspendCoroutine으로 만든 함수는 취소에 반응하지 않습니다.<\/li>\n<\/ul>"},{"no":20,"t":"구조화된 동시성이란 무엇이고, Android에서 어떤 버그를 막아 줍니까?","a":"<p>코루틴은 반드시 CoroutineScope 안에서 시작하고, 새 코루틴의 Job은 부모 Job의 자식이 되어 Job 트리를 이룹니다. 부모는 자식이 모두 끝나야 완료되고, 부모가 취소되면 자식이 모두 취소되며, 자식이 CancellationException이 아닌 예외로 실패하면 기본적으로 부모와 형제도 취소됩니다. 작업 수명이 스코프 수명에 묶이므로 화면이 사라진 뒤에도 도는 작업, 아무도 모르게 사라지는 예외, 시작해 놓고 잊힌 작업이 구조적으로 생기지 않습니다.<\/p>\n<p>Android에서 막아 주는 버그는 세 가지로 정리됩니다. 첫째, 누수와 사라진 화면 갱신입니다. viewModelScope는 ViewModel이 clear될 때 취소되므로 사용자가 화면을 떠나면 진행 중이던 요청과 그 자식 코루틴이 함께 취소됩니다. 콜백 방식에서는 취소를 일일이 챙기지 않으면 끝난 화면의 View를 건드려 크래시나 누수가 납니다. 둘째, 병렬 작업의 부분 실패입니다. coroutineScope 안에서 async 두 개로 요청하다 하나가 실패하면 나머지가 자동으로 취소되고 예외가 호출자에게 다시 던져지므로, 결과 절반으로 화면을 그리는 상태가 생기지 않습니다. 셋째, 예외 유실입니다. launch의 실패는 트리를 따라 위로 전파되고 끝까지 처리되지 않으면 크래시로 드러나므로 조용히 사라지지 않습니다. 다만 supervisor나 루트 아래에서 시작한 async의 예외는 await해야 드러납니다.<\/p>\n<pre class=\"kotlin\"><code>suspend fun loadHome(): Home = coroutineScope {\n    val banners = async { api.banners() }\n    val favorites = async { repo.favorites() }   // 실패하면 banners도 취소되고\n    Home(banners.await(), favorites.await())     // 예외는 호출자에게 다시 던져짐\n}<\/code><\/pre>\n<p>깨지는 지점은 트리 밖에 루트 코루틴을 만드는 코드입니다. GlobalScope.launch나 함수 안에서 즉석으로 만든 CoroutineScope(Job())은 화면을 떠나도 취소되지 않고, 테스트에서 기다릴 수 없으며, 예외는 처리 경로가 없어 크래시로 갑니다. launch(Job())처럼 빌더에 Job을 넘기는 것도 같은 문제라서 kotlinx.coroutines 1.11.0은 이 사용을 deprecated로 표시하는 lint를 추가했습니다. 화면보다 오래 살아야 하는 작업은 GlobalScope 대신 앱 수준 스코프를 주입받아 씁니다.<\/p>","f":"<ul>\n<li><strong>취소된 뒤에도 꼭 끝내야 하는 저장 작업은 어떻게 합니까?<\/strong> 화면 스코프가 아니라 주입한 앱 수준 스코프에서 실행하고, 프로세스 종료 뒤에도 보장해야 하면 WorkManager로 넘깁니다.<\/li>\n<li><strong>자식 하나의 실패가 형제를 취소하지 않게 하려면?<\/strong> SupervisorJob이나 supervisorScope를 씁니다. viewModelScope도 SupervisorJob을 씁니다. 다만 supervisor 아래에서 launch가 실패하면 예외를 받아 줄 곳이 없어 CoroutineExceptionHandler가 없으면 크래시가 납니다.<\/li>\n<li><strong>lifecycleScope에서 시작한 작업과 viewModelScope에서 시작한 작업은 무엇이 다릅니까?<\/strong> lifecycleScope는 Lifecycle이 DESTROYED가 될 때 취소되므로 회전 같은 구성 변경에서 작업이 끊깁니다. Android 권장 사항대로 비즈니스 로직은 구성 변경을 넘어 살아남는 viewModelScope에서 시작합니다.<\/li>\n<\/ul>"},{"no":21,"t":"CoroutineContext는 무엇으로 이루어지고, 자식 코루틴은 무엇을 물려받습니까?","a":"<p>CoroutineContext는 키로 찾는 Element들의 집합이고, Kotlin 명세는 이를 CoroutineContext.Key에서 Element로 가는 인덱스 집합이라고 설명합니다. 주로 쓰는 Element는 Job, CoroutineDispatcher, CoroutineName, CoroutineExceptionHandler이며, + 연산으로 합치면 같은 키는 오른쪽 값이 덮어씁니다. 자식 코루틴은 부모 스코프의 컨텍스트를 물려받고 빌더에 넘긴 Element로 일부를 덮어쓰지만, Job만은 물려받지 않고 새로 만들어 부모 Job의 자식으로 붙입니다.<\/p>\n<p>새 코루틴의 컨텍스트는 \"스코프의 컨텍스트 + 빌더 인자\"에 새 Job을 더한 것입니다. 그래서 launch(Dispatchers.IO + CoroutineName(\"sync\"))처럼 Dispatcher나 이름은 바꿔도 부모 자식 관계는 유지됩니다. 스코프와 인자 어디에도 Dispatcher가 없으면 Dispatchers.Default가 쓰입니다. Dispatcher는 컨텍스트 안에서 ContinuationInterceptor 키로 저장되며, kotlinx.coroutines 1.11.0은 CoroutineDispatcher를 컨텍스트 키로 쓰는 것을 deprecated로 하고 ContinuationInterceptor를 쓰게 했습니다.<\/p>\n<p>흔한 실수는 launch(SupervisorJob()) { }나 launch(Job()) { }입니다. \"이 작업 하나는 실패해도 형제를 죽이지 않게\" 하려는 의도지만, 넘긴 Job이 새 코루틴의 유일한 부모가 되어 스코프와의 관계가 끊깁니다. 스코프를 취소해도 이 코루틴은 취소되지 않고, 스코프는 이 코루틴을 기다리지 않으며, 실패는 넘긴 SupervisorJob에서 처리 경로를 잃어 크래시로 갑니다. kotlinx.coroutines 1.11.0은 빌더에 Job을 넘기는 사용을 deprecated로 표시하는 lint를 추가했고, launch와 async의 Job 인자 오버로드 문서에도 구조화된 동시성을 깨므로 피하라는 경고가 붙어 있습니다. 형제 격리가 목적이면 supervisorScope나 SupervisorJob으로 만든 스코프 자체를 쓰고, 취소를 무시하는 것이 목적이면 withContext(NonCancellable)를 씁니다.<\/p>\n<pre class=\"kotlin\"><code>val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)\n\nscope.launch(Dispatchers.IO + CoroutineName(&quot;sync&quot;)) {\n    // Dispatcher와 이름은 바뀌고, Job은 scope Job의 자식으로 새로 만들어짐\n    val interceptor = coroutineContext[ContinuationInterceptor]\n}\n\nscope.launch(SupervisorJob()) { /* 잘못: scope와의 부모 자식 관계가 끊김 */ }<\/code><\/pre>","f":"<ul>\n<li><strong>CoroutineExceptionHandler를 자식 launch에 넣으면 동작합니까?<\/strong> 동작하지 않습니다. 일반 Job 아래의 자식은 예외를 부모에게 넘기므로 자식 컨텍스트의 핸들러는 쓰이지 않습니다. 루트 코루틴이나 supervisor 바로 아래 자식에 둘 때만 의미가 있습니다.<\/li>\n<li><strong>withContext(NonCancellable)와 launch(NonCancellable)는 무엇이 다릅니까?<\/strong> withContext는 현재 코루틴 안에서 블록만 취소되지 않게 실행하고 구조를 유지합니다. launch나 async에 넘기면 부모 자식 관계가 끊긴다고 공식 문서가 경고합니다.<\/li>\n<li><strong>ThreadLocal 값을 코루틴과 함께 옮기려면?<\/strong> ThreadLocal의 asContextElement()로 만든 ThreadContextElement를 컨텍스트에 넣으면, 코루틴이 어느 스레드에서 재개되든 그 스레드에 값을 설정하고 중단할 때 되돌립니다.<\/li>\n<\/ul>"},{"no":22,"t":"Dispatchers.Main, Main.immediate, Default, IO, Unconfined는 어떻게 다르고, limitedParallelism은 언제 씁니까?","a":"<p>Dispatcher는 코루틴을 어느 스레드에서 실행할지 정합니다. Main은 UI 스레드 하나, Default는 CPU 계산용 공유 풀, IO는 블로킹 I/O용으로 Default와 스레드를 공유하면서 한도가 더 큰 풀, Unconfined는 특정 스레드에 묶이지 않는 특수 용도입니다. limitedParallelism(n)은 새 스레드 풀을 만들지 않고 기존 Dispatcher 위에 동시 실행 수만 n으로 제한한 뷰를 만들 때 씁니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Dispatcher<\/th>\n<th>스레드<\/th>\n<th>쓰는 곳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Main<\/td>\n<td>Android 메인 스레드 하나<\/td>\n<td>UI 갱신, 가벼운 상태 변경<\/td>\n<\/tr>\n<tr>\n<td>Main.immediate<\/td>\n<td>Main과 같고, 이미 메인 스레드면 재디스패치 없이 바로 실행<\/td>\n<td>viewModelScope, lifecycleScope의 기본<\/td>\n<\/tr>\n<tr>\n<td>Default<\/td>\n<td>공유 풀, 최대 스레드 수는 CPU 코어 수(최소 2개)<\/td>\n<td>정렬, JSON 파싱, 목록 diff 같은 계산<\/td>\n<\/tr>\n<tr>\n<td>IO<\/td>\n<td>Default와 스레드 공유, 병렬 한도 기본값은 64와 코어 수 중 큰 값<\/td>\n<td>파일, DB, 블로킹 네트워크 호출<\/td>\n<\/tr>\n<tr>\n<td>Unconfined<\/td>\n<td>첫 중단 전까지 호출한 스레드, 재개는 중단 함수가 재개시킨 스레드<\/td>\n<td>일반 코드에는 쓰지 않음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>IO와 Default는 스레드를 공유하므로 Default 위에서 withContext(Dispatchers.IO)를 불러도 대개 실제 스레드 전환이 일어나지 않습니다. viewModelScope가 Main.immediate를 쓰는 이유는 클릭 처리처럼 이미 메인 스레드에서 호출된 경우 Handler 큐에 다시 넣지 않고 바로 실행하기 위해서입니다. 상태를 Loading으로 바꾸는 코드가 다음 메시지까지 밀리지 않고 즉시 반영되고, 실행 순서도 뒤바뀌지 않습니다.<\/p>\n<p>limitedParallelism은 kotlinx.coroutines 1.9.0에서 Stable이 되었습니다. 디스크 캐시 쓰기를 한 번에 하나로 묶거나, 동시 호출에 약한 SDK를 두 개까지만 부르는 식으로 특정 자원의 동시 실행 수를 제한합니다. 원래 Dispatcher의 스레드를 재사용하므로 따로 닫을 필요가 없고, Dispatchers.IO의 뷰는 IO 병렬 한도에 묶이지 않습니다. 다만 limitedParallelism(1)은 Mutex가 아닙니다. 동시에 실행되는 스레드 수만 제한하므로 중단 지점을 사이에 둔 여러 단계 작업은 다른 코루틴과 섞일 수 있습니다.<\/p>\n<p>실무 규칙은 Android 코루틴 권장 사항 그대로입니다. suspend 함수는 main-safe하게 만들고, 블로킹 작업을 하는 클래스가 스스로 withContext로 실행을 옮기며, Dispatcher는 하드코딩하지 않고 주입받아 테스트에서 TestDispatcher로 바꿉니다.<\/p>\n<pre class=\"kotlin\"><code>class TileCacheRepository(\n    ioDispatcher: CoroutineDispatcher,             // 주입: 테스트에서 TestDispatcher로 교체\n) {\n    private val diskWriter = ioDispatcher.limitedParallelism(1)   // 파일 쓰기는 한 번에 하나\n\n    suspend fun save(tile: Tile) = withContext(diskWriter) {      // 호출자는 Main에서 불러도 됨\n        fileFor(tile.key).writeBytes(tile.bytes)\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>IO의 스레드 한도가 Default보다 큰 이유는?<\/strong> 블로킹 작업은 대부분 기다리는 시간이라 코어 수보다 많은 스레드가 있어야 처리량이 나오기 때문입니다.<\/li>\n<li><strong>Default에서 블로킹 I/O를 하면?<\/strong> 코어 수만큼밖에 없는 계산 스레드가 묶여 다른 계산 작업이 밀립니다.<\/li>\n<li><strong>Unconfined는 언제 씁니까?<\/strong> 거의 쓰지 않습니다. 재개 스레드가 중단 함수에 따라 달라지므로 UI 갱신이나 공유 데이터 접근에 쓰면 안 되고, 공식 문서도 일반 코드에는 쓰지 말라고 합니다. 첫 중단 전까지만 바로 실행하고 싶으면 CoroutineStart.UNDISPATCHED를 씁니다.<\/li>\n<\/ul>"},{"no":23,"t":"launch, async, withContext는 어떻게 다르고, async를 잘못 쓰는 흔한 패턴은 무엇입니까?","a":"<p>launch는 결과 없이 Job을 돌려주는 새 코루틴, async는 결과를 Deferred로 돌려주는 새 코루틴입니다. withContext는 작업을 따로 띄우는 것이 아니라 블록을 다른 컨텍스트에서 실행하고, 끝날 때까지 호출자를 중단시킨 뒤 결과를 돌려주는 suspend 함수입니다. 한 작업의 실행 스레드만 바꾸려면 withContext, 여러 작업을 동시에 돌려 결과를 모으려면 coroutineScope 안의 async 여러 개, 결과가 필요 없는 독립 작업은 launch를 씁니다.<\/p>\n<p>병렬 분해는 coroutineScope 안에서 async를 모두 시작한 다음에 await합니다. 하나가 실패하면 나머지 형제 코루틴이 취소되고 coroutineScope가 그 예외를 호출자에게 다시 던지므로 실패 처리를 한 곳에서 할 수 있습니다. 개수가 가변이면 map { async { } } 뒤에 awaitAll()을 씁니다.<\/p>\n<p>흔한 잘못은 세 가지입니다. 첫째, async { }.await()를 바로 부르는 패턴입니다. 동시성이 전혀 없고, withContext와 같은 일을 Deferred와 별도 코루틴을 만들어 더 비싸게 합니다. 두 작업을 각각 async { }.await()로 쓰면 병렬처럼 보여도 순차 실행입니다. 둘째, 스코프 밖에서 async를 띄우고 await하지 않는 패턴입니다. viewModelScope처럼 SupervisorJob을 가진 스코프나 루트에서 시작한 async가 실패하면 예외는 Deferred 안에만 남아 아무도 모르게 묻힙니다. 반대로 일반 Job 아래의 async는 await 전이라도 실패하는 순간 부모를 취소하므로, await를 try/catch로 감싸도 부모 취소는 막지 못합니다. 셋째, CoroutineStart.LAZY로 만들고 시작하지 않는 패턴입니다. LAZY 코루틴은 start, await, join 전에는 실행되지 않고, 시작도 취소도 하지 않으면 완료되지 않아 감싼 coroutineScope가 끝나지 않습니다. 필요할 때 시작하는 것이 목적이면 by lazy { scope.async { } }로 만드는 쪽이 의도가 분명하다고 공식 문서도 권합니다.<\/p>\n<pre class=\"kotlin\"><code>// 순차: 실행 스레드만 바꾼다\nval user = withContext(ioDispatcher) { api.user(id) }\n\n// 병렬: 모두 시작한 뒤 기다린다\nval (route, traffic) = coroutineScope {\n    val r = async { routeApi.search(request) }\n    val t = async { trafficApi.current(request.area) }\n    r.await() to t.await()\n}\n\n// 피할 것: 동시성이 없고 withContext보다 비싸다\nval slow = async(ioDispatcher) { api.user(id) }.await()<\/code><\/pre>","f":"<ul>\n<li><strong>await 앞에 try/catch를 두면 async의 실패가 부모로 가는 것을 막을 수 있습니까?<\/strong> 일반 Job 아래에서는 막지 못합니다. async가 실패하는 순간 부모가 취소되므로, 실패를 지역적으로 다루려면 async 블록 안에서 잡거나 supervisorScope 안에서 async를 쓰고 await에서 잡습니다.<\/li>\n<li><strong>withContext도 새 코루틴을 만듭니까?<\/strong> coroutineScope처럼 범위가 정해진 자식 코루틴을 만들지만 호출자가 결과를 기다리므로 순차 실행입니다. 현재와 같은 Dispatcher를 넘기면 추가 디스패치 없이 그 자리에서 실행됩니다.<\/li>\n<li><strong>launch가 돌려주는 Job은 어디에 씁니까?<\/strong> cancel로 취소하고 join으로 완료를 기다립니다. 새 요청이 오면 이전 요청을 취소해야 할 때 Job을 보관했다가 cancel할 수 있지만, Flow라면 flatMapLatest나 collectLatest가 같은 일을 해 줍니다.<\/li>\n<\/ul>"},{"no":24,"t":"코루틴 취소는 어떻게 동작하고, 취소되지 않는 코루틴은 왜 생깁니까?","a":"<p>취소는 협력적입니다. Job.cancel()은 Job을 취소 상태로 바꿀 뿐이고, 코루틴은 다음 중단 지점이나 명시적인 확인에서 CancellationException을 던지며 끝납니다. 그래서 중단 지점 없이 도는 CPU 루프, 스레드를 막는 블로킹 호출, suspendCoroutine으로 만들어 취소를 확인하지 않는 suspend 함수는 취소해도 계속 돕니다.<\/p>\n<p>delay, withContext, Channel의 receive 같은 kotlinx.coroutines의 suspend 함수는 중단할 때 취소를 확인합니다. 긴 계산 루프에는 ensureActive()나 yield()를 넣습니다. ensureActive는 취소되었으면 CancellationException을 던지고, yield는 스레드를 다른 코루틴에 양보하면서 취소도 확인합니다. 조건문으로 빠져나와야 하면 isActive를 봅니다. 블로킹 I/O는 withContext(Dispatchers.IO)로 옮겨도 그 호출 자체가 취소로 멈추지는 않습니다. JVM에서 Thread.sleep이나 BlockingQueue.take처럼 인터럽트에 반응하는 블로킹 코드는 runInterruptible로 감싸면 취소될 때 스레드를 인터럽트하고, 인터럽트를 모르는 API는 소켓을 닫는 식의 취소 수단을 invokeOnCancellation에 연결합니다.<\/p>\n<p>정리 코드에도 함정이 있습니다. 취소된 코루틴의 finally에서 suspend 함수를 부르면 이미 취소 상태라 바로 CancellationException이 납니다. 정리에 suspend 호출이 꼭 필요하면 withContext(NonCancellable) { }로 감싸고, NonCancellable은 launch나 async가 아니라 withContext에만 넘깁니다.<\/p>\n<p>시간 제한은 withTimeout과 withTimeoutOrNull로 겁니다. withTimeout은 시간이 지나면 블록을 취소하고 TimeoutCancellationException을 던지며, withTimeoutOrNull은 null을 돌려줍니다. TimeoutCancellationException은 CancellationException의 하위 타입이라 launch 안에서 잡지 않으면 오류가 아니라 취소로 처리되어 부모는 정상 완료됩니다. 타임아웃을 실패로 다뤄야 하면 withTimeoutOrNull의 결과를 검사합니다. 취소가 협력적이므로 블록 안이 Thread.sleep이면 시간이 지나도 끝까지 실행된다는 점도 같습니다.<\/p>\n<pre class=\"kotlin\"><code>class ImportProcessor(\n    private val defaultDispatcher: CoroutineDispatcher,\n    private val ioDispatcher: CoroutineDispatcher,\n) {\n    suspend fun decodeAll(files: List&lt;File&gt;) = withContext(defaultDispatcher) {\n        files.map { ensureActive(); decode(it) }          // CPU 루프에서 취소 확인\n    }\n\n    suspend fun next(queue: BlockingQueue&lt;Task&gt;): Task =\n        runInterruptible(ioDispatcher) { queue.take() }    // 취소되면 스레드를 인터럽트\n}<\/code><\/pre>","f":"<ul>\n<li><strong>finally에서 suspend 함수가 바로 실패하는 이유는?<\/strong> 코루틴이 이미 취소 상태라 취소에 협력하는 suspend 함수가 즉시 CancellationException을 던지기 때문입니다. withContext(NonCancellable)로 감싸 짧은 정리만 합니다.<\/li>\n<li><strong>취소된 코루틴이 이미 준비된 값을 받는 경우는 어떻게 됩니까?<\/strong> 중단된 코루틴은 값이 준비되어 있어도 취소되었으면 그 값이 아니라 CancellationException으로 재개하며, 공식 문서는 이를 prompt cancellation이라고 부릅니다. 그래서 콜백이 resume으로 넘긴 파일 핸들 같은 자원은 호출한 쪽에 닿지 못하고 사라질 수 있으므로 <code>resume(resource) { cause, resourceToClose, context -&gt; resourceToClose.close() }<\/code>처럼 resume의 onCancellation 람다에서 닫습니다. suspendCancellableCoroutine 호출 전이나 블록 안에서 연 자원은 invokeOnCancellation에서 닫습니다.<\/li>\n<li><strong>suspendCoroutine으로 만든 함수를 취소에 반응하게 하려면?<\/strong> suspendCancellableCoroutine으로 바꾸고 invokeOnCancellation에서 원래 요청을 취소합니다.<\/li>\n<\/ul>"},{"no":25,"t":"CancellationException을 잡아 버리면 어떤 일이 생깁니까? runCatching과 catch (e: Exception)의 함정은 무엇입니까?","a":"<p>취소 신호가 사라져 취소된 코루틴이 계속 진행합니다. 이미 떠난 화면의 상태를 갱신하고, 루프가 끝나지 않고, 재시도 로직이 취소를 실패로 오인해 요청을 다시 보냅니다. JVM에서 CancellationException은 IllegalStateException의 하위 타입이라 catch (e: Exception), catch (e: IllegalStateException), catch (e: Throwable)에 모두 걸리고, 내부에서 Throwable을 잡아 Result로 감싸는 runCatching도 같은 문제를 만듭니다.<\/p>\n<p>공식 문서의 경고는 두 곳에 있습니다. kotlinlang 취소 문서는 CancellationException을 잡으면 취소 전파가 깨질 수 있으니 꼭 잡아야 하면 다시 던지라고 하고, Android 코루틴 권장 사항은 CancellationException을 소비하지 말고 Exception이나 Throwable 대신 IOException 같은 구체 타입을 잡으라고 합니다. runCatching은 Throwable을 잡으므로 이 경고에 그대로 걸리고, OutOfMemoryError 같은 Error까지 Result로 바꿔 프로그래밍 오류를 숨기는 문제도 있습니다.<\/p>\n<p>안전하게 처리하는 순서는 이렇습니다. 먼저 예상 가능한 실패의 구체 타입만 잡습니다. 넓게 잡아야 한다면 CancellationException을 먼저 다시 던집니다. 그리고 CancellationException이 항상 내 코루틴의 취소를 뜻하지는 않는다는 점을 구분합니다. 이미 취소된 Deferred를 await하거나 안쪽의 withTimeout이 시간을 넘기면, 내 코루틴은 살아 있는데도 CancellationException이 올라옵니다. kotlinx.coroutines 문서는 isActive나 ensureActive로 \"내가 취소된 것인지, 다른 작업의 실패인지\"를 가르라고 하고, 권장 패턴으로 catch 블록에서 CancellationException이면 ensureActive()를 부르는 코드를 보여 줍니다.<\/p>\n<p>Flow 안에서는 try/catch보다 catch 연산자가 안전합니다. catch 연산자는 업스트림 예외만 잡고 Flow를 취소하려고 던진 예외는 잡지 않기 때문입니다.<\/p>\n<pre class=\"kotlin\"><code>// runCatching 대신: 취소는 통과시키고 Error는 잡지 않는다\nsuspend inline fun &lt;T&gt; suspendRunCatching(block: () -&gt; T): Result&lt;T&gt; =\n    try {\n        Result.success(block())\n    } catch (e: Exception) {\n        if (e is CancellationException) currentCoroutineContext().ensureActive()\n        Result.failure(e)              // 내 코루틴이 살아 있으면 실패로 다룸\n    }\n\n// 피할 것: 취소된 뒤 delay가 매번 바로 예외를 던져 루프가 헛돈다\nwhile (true) { try { poll(); delay(5_000) } catch (e: Exception) { log(e) } }<\/code><\/pre>","f":"<ul>\n<li><strong>Flow의 catch 연산자도 CancellationException을 삼킵니까?<\/strong> 수집 코루틴 자신이 취소되어 생긴 예외는 잡지 않고 그대로 다시 던집니다. 다만 수집 코루틴이 살아 있는데 업스트림이 던진 CancellationException, 예를 들어 업스트림 안에서 withTimeout이 던진 TimeoutCancellationException은 catch에 잡히고, predicate를 주지 않은 retry는 그 예외로도 재시도합니다. 그래서 catch와 retry에서도 IOException 같은 구체 타입만 골라 처리합니다.<\/li>\n<li><strong>withTimeout의 TimeoutCancellationException은 잡아도 됩니까?<\/strong> 됩니다. 내 코루틴의 취소가 아니라 블록의 시간 초과이므로 잡아서 실패로 바꾸는 것이 맞고, ensureActive 패턴이 이 둘을 구분해 줍니다.<\/li>\n<li><strong>catch (e: Exception)을 쓰지 않으면 예상 못 한 예외는 어떻게 합니까?<\/strong> 계층 경계에서 구체 타입을 도메인 오류로 바꾸고, 나머지는 위로 올려 크래시 리포트에 드러나게 합니다. 모르는 예외를 삼키고 화면에 일반 오류만 보여 주면 원인을 찾을 수 없습니다.<\/li>\n<\/ul>"},{"no":26,"t":"launch와 async의 예외 전파는 어떻게 다르고, CoroutineExceptionHandler는 언제 동작합니까?","a":"<p>launch는 실패하면 예외를 즉시 부모로 전파합니다. async는 예외를 Deferred에 담아 두었다가 await에서 다시 던지지만, 일반 Job을 가진 부모 아래라면 실패하는 순간 부모를 취소하는 일도 함께 일어납니다. 끝까지 전파할 곳이 없는 예외, 즉 루트 launch나 supervisor 바로 아래 launch의 예외만 CoroutineExceptionHandler로 가고, 핸들러가 없으면 JVM에서는 현재 스레드의 uncaught exception handler로 넘어가 Android 앱이 크래시합니다.<\/p>\n<p>전파 규칙은 이렇습니다. 자식이 CancellationException이 아닌 예외로 실패하면 그 예외로 부모를 취소하고, 부모는 다른 자식을 취소한 뒤 모든 자식이 끝나면 예외를 처리하거나 위로 올립니다. 이 동작은 바꿀 수 없습니다. 여러 자식이 실패하면 첫 예외가 처리되고 나머지는 suppressed로 붙습니다. 부모가 SupervisorJob이거나 Job이 없는 루트라면 async의 예외는 Deferred로만 전달되므로, await하지 않으면 그대로 묻힙니다.<\/p>\n<p>CoroutineExceptionHandler는 처리되지 않은 예외의 마지막 처리기입니다. 루트 코루틴이나 supervisor 바로 아래 자식의 컨텍스트에 있을 때만 호출되고, 일반 Job 아래 자식의 컨텍스트에 둔 핸들러는 쓰이지 않으며, async에는 효과가 없습니다. CancellationException은 모든 핸들러에서 무시됩니다. 핸들러가 불릴 때는 코루틴이 이미 예외로 끝난 뒤라 복구할 수 없으므로 로그, 크래시 리포트, 오류 안내에만 씁니다. coroutineScope 안의 launch에 핸들러를 붙여도 coroutineScope의 실패를 막지 못한다는 점은 공식 문서에 함정으로 적혀 있습니다.<\/p>\n<p>Android에서는 viewModelScope.launch { repository.load() }에서 IOException이 나면 SupervisorJob 덕분에 형제 작업은 살아남지만, 예외를 받아 줄 곳이 없어 앱이 크래시합니다. 예상 가능한 예외는 launch 블록 안에서 잡아 UI 상태로 바꾸고, 핸들러는 놓친 예외를 기록하는 최후 방어선으로만 둡니다.<\/p>\n<pre class=\"kotlin\"><code>val handler = CoroutineExceptionHandler { _, e -&gt; crashReporter.log(e) }\nval appScope = CoroutineScope(SupervisorJob() + Dispatchers.Default + handler)\n\nappScope.launch { sync() }          // 실패하면 handler 호출, 형제는 유지\nappScope.async { sync() }           // handler 호출 안 됨: await하는 쪽 책임\n\nsuspend fun broken() = coroutineScope {\n    launch(handler) { error(&quot;x&quot;) }  // handler 무시: 실패가 coroutineScope로 전파\n}<\/code><\/pre>","f":"<ul>\n<li><strong>여러 자식이 동시에 실패하면 어떤 예외가 보입니까?<\/strong> 첫 예외가 처리되고 나머지는 그 예외의 suppressed로 붙습니다. 크래시 리포트에서 suppressed까지 봐야 원인을 놓치지 않습니다.<\/li>\n<li><strong>핸들러에서 재시도할 수 있습니까?<\/strong> 핸들러가 불릴 때는 코루틴이 이미 끝났으므로 그 코루틴을 이어 갈 수 없습니다. 재시도는 코루틴 안의 try/catch나 Flow의 retry에서 합니다.<\/li>\n<li><strong>ViewModel 전체에 핸들러를 걸고 싶으면?<\/strong> Lifecycle 2.8.0부터 CoroutineScope를 받는 ViewModel 생성자로 viewModelScope를 바꿀 수 있어 핸들러를 넣은 스코프를 주입할 수 있습니다. 그래도 예상 가능한 실패는 각 작업에서 처리합니다.<\/li>\n<\/ul>"},{"no":27,"t":"Job과 SupervisorJob, coroutineScope와 supervisorScope는 언제 씁니까? viewModelScope에서 작업 하나가 실패하면 다른 작업은 어떻게 됩니까?","a":"<p>차이는 실패가 전파되는 방향입니다. 일반 Job은 자식의 실패를 부모와 형제에게 전파하고, SupervisorJob은 자식의 실패나 취소를 부모와 다른 자식에게 전파하지 않습니다. 부모가 취소되면 자식이 취소되는 아래 방향은 둘이 같습니다. viewModelScope는 SupervisorJob을 쓰므로 viewModelScope.launch로 시작한 작업 하나가 실패해도 다른 작업은 계속 돌지만, 그 예외는 받아 줄 곳이 없어 CoroutineExceptionHandler가 없으면 앱이 크래시합니다.<\/p>\n<p>고르는 기준은 \"하나가 실패하면 나머지 결과가 의미 있는가\"입니다. 화면을 그리려면 세 API 결과가 모두 필요하다면 coroutineScope를 씁니다. 하나가 실패하면 나머지가 취소되고 예외가 호출자에게 다시 던져져 한 곳에서 처리됩니다. 지도 타일 여러 장을 미리 받거나 분석 이벤트를 여러 건 보내는 것처럼 서로 독립인 작업은 supervisorScope를 씁니다. 하나가 실패해도 나머지는 계속 돌지만 각 자식이 자기 예외를 처리해야 합니다. supervisorScope는 핸들러를 설치하지 않으므로 그 안에서 launch가 실패하면 처리되지 않은 예외가 되어 크래시할 수 있습니다. 그래서 launch 안에서 잡거나, async로 받아 await에서 하나씩 처리합니다. 함수 안의 일시적인 범위에는 coroutineScope와 supervisorScope 함수를 쓰고, 앱 수준 스코프처럼 오래 사는 스코프 객체를 만들 때는 SupervisorJob을 넣은 CoroutineScope를 씁니다.<\/p>\n<p>깨지는 지점은 supervisor 효과가 직계 자식에게만 적용된다는 점입니다. viewModelScope.launch 안에서 다시 launch 두 개를 띄우면 그 둘은 바깥 launch의 일반 Job 아래에 있으므로, 하나가 실패하면 다른 하나도 취소되고 바깥 launch도 실패합니다. 바깥 launch가 viewModelScope의 직계 자식이라 다른 최상위 작업으로 번지지 않을 뿐이고, 바깥 launch의 실패는 여전히 처리되지 않은 예외입니다. 격리하려고 launch(SupervisorJob())을 쓰는 코드는 구조화된 동시성을 끊으므로 쓰지 않습니다.<\/p>\n<pre class=\"kotlin\"><code>viewModelScope.launch {\n    val home = try {\n        coroutineScope {                        // 모두 필요: 하나 실패하면 전체 실패\n            val a = async { api.banners() }\n            val b = async { api.favorites() }\n            Home(a.await(), b.await())\n        }\n    } catch (e: IOException) { null }\n    _uiState.update { it.copy(home = home) }\n}\nviewModelScope.launch {                         // 서로 독립인 프리패치\n    supervisorScope {\n        tiles.forEach { launch { try { prefetch(it) } catch (e: IOException) { log(e) } } }\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>supervisorScope 안의 async 하나가 실패하면?<\/strong> 다른 자식은 계속 돌고, 예외는 그 Deferred의 await에서만 던져집니다.<\/li>\n<li><strong>supervisorScope 블록 자체가 예외를 던지면?<\/strong> 블록이 실패하면 스코프와 모든 자식이 취소되고 예외가 호출자에게 다시 던져집니다. supervisor가 격리하는 것은 자식의 실패뿐입니다.<\/li>\n<li><strong>각 launch에 CoroutineExceptionHandler를 붙여 viewModelScope의 크래시를 막으면 됩니까?<\/strong> supervisor의 직계 자식이라 핸들러가 호출되기는 하지만, 실패를 로그로 흘려보낼 뿐 화면은 실패를 모릅니다. 예상 가능한 실패는 try/catch로 UI 상태에 반영하고 핸들러는 최후 방어선으로만 둡니다.<\/li>\n<\/ul>"},{"no":28,"t":"viewModelScope, lifecycleScope, rememberCoroutineScope, 앱 수명 스코프는 각각 언제 취소되고 어디에 씁니까?","a":"<p>스코프는 작업이 필요한 기간에 맞춰 고릅니다. viewModelScope는 ViewModel이 clear될 때, lifecycleScope는 Lifecycle이 DESTROYED가 될 때, rememberCoroutineScope는 그 호출 지점이 컴포지션에서 빠질 때 취소되고, 앱 수명 스코프는 직접 취소하지 않는 한 프로세스와 함께 끝납니다. 화면을 벗어나도 끝나야 하는 작업은 주입한 앱 스코프에서 실행하고, 프로세스가 종료된 뒤에도 보장해야 하는 작업은 WorkManager로 넘깁니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>스코프<\/th>\n<th>취소 시점<\/th>\n<th>쓰는 곳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>viewModelScope<\/td>\n<td>ViewModel이 clear될 때, 구성 변경에서는 유지<\/td>\n<td>화면 데이터 로딩, 사용자 액션의 비즈니스 로직<\/td>\n<\/tr>\n<tr>\n<td>lifecycleScope<\/td>\n<td>Lifecycle이 DESTROYED가 될 때, 회전에서도 취소<\/td>\n<td>View 관련 UI 작업, repeatOnLifecycle로 Flow 수집 시작<\/td>\n<\/tr>\n<tr>\n<td>viewLifecycleOwner.lifecycleScope<\/td>\n<td>Fragment의 View가 파괴될 때<\/td>\n<td>Fragment에서 View를 다루는 작업<\/td>\n<\/tr>\n<tr>\n<td>rememberCoroutineScope<\/td>\n<td>호출 지점이 컴포지션에서 빠질 때<\/td>\n<td>클릭 콜백에서 시작하는 애니메이션, 스낵바<\/td>\n<\/tr>\n<tr>\n<td>앱 수명 스코프<\/td>\n<td>프로세스가 끝날 때<\/td>\n<td>화면을 떠나도 끝내야 하는 짧은 작업<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>앱 스코프는 SupervisorJob과 Dispatchers.Default로 만든 CoroutineScope 하나를 Application이나 DI 싱글턴으로 두고 qualifier를 붙여 주입합니다. Android 코루틴 권장 사항도 GlobalScope 대신 외부 CoroutineScope를 주입하라고 하며, 사용자가 화면을 떠나도 북마크 저장은 끝나야 하는 예를 듭니다. 주입하면 테스트에서 TestScope로 바꿀 수 있고, 공통 Dispatcher와 핸들러를 한곳에서 정할 수 있습니다.<\/p>\n<p>앱 스코프도 프로세스가 종료되면 함께 사라집니다. 업로드, 동기화처럼 앱 재시작이나 기기 재부팅 뒤에도 실행을 보장해야 하는 작업은 WorkManager에 맡깁니다. 그리고 앱 스코프 작업에 Activity, Fragment, View, 화면 ViewModel을 잡으면 안 됩니다. 람다가 캡처한 화면 객체는 작업이 끝날 때까지 해제되지 않아 누수가 됩니다. 필요한 값만 복사해 넘기고, 결과는 Repository가 Flow로 노출해 화면이 다시 구독하게 합니다.<\/p>\n<pre class=\"kotlin\"><code>@Qualifier @Retention(AnnotationRetention.BINARY) annotation class ApplicationScope\n\n@Module @InstallIn(SingletonComponent::class)\nobject CoroutineScopeModule {\n    @Provides @Singleton @ApplicationScope\n    fun appScope(): CoroutineScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)\n}\n\nclass FavoriteRepository @Inject constructor(\n    private val dao: FavoriteDao,\n    @ApplicationScope private val appScope: CoroutineScope,\n) {\n    // 화면을 떠나 호출자가 취소돼도 저장은 끝까지 진행\n    suspend fun add(place: Place) = appScope.launch { dao.insert(place) }.join()\n}<\/code><\/pre>","f":"<ul>\n<li><strong>앱 스코프에서 시작한 작업은 호출자가 취소되면 어떻게 됩니까?<\/strong> 호출자는 join에서 CancellationException을 받고 바로 끝나지만, appScope에서 시작한 작업은 계속 진행됩니다. 화면이 결과를 꼭 받아야 하면 Repository의 Flow를 다시 구독해 받습니다.<\/li>\n<li><strong>rememberCoroutineScope와 LaunchedEffect는 어떻게 다릅니까?<\/strong> LaunchedEffect는 컴포지션에 들어올 때 시작하고 키가 바뀌면 다시 시작하는 사이드 이펙트이고, rememberCoroutineScope는 클릭 콜백처럼 컴포저블 밖의 이벤트에서 코루틴을 시작할 때 씁니다. 둘 다 컴포지션에서 빠지면 취소됩니다.<\/li>\n<li><strong>ViewModel 테스트에서 viewModelScope는 어떻게 다룹니까?<\/strong> Dispatchers.setMain으로 Main을 TestDispatcher로 바꾸거나, Lifecycle 2.8.0에 추가된 CoroutineScope를 받는 ViewModel 생성자로 테스트 스코프를 넘깁니다.<\/li>\n<\/ul>"},{"no":29,"t":"콜백 기반 API를 suspend 함수와 Flow로 바꾸는 방법은 무엇입니까?","a":"<p>결과가 한 번 오는 콜백은 suspendCancellableCoroutine으로 suspend 함수로 바꾸고, invokeOnCancellation에서 원래 요청을 취소하거나 리스너를 해제합니다. 여러 번 오는 콜백은 callbackFlow로 Flow로 바꾸고, 콜백에서는 trySend로 값을 보내며, 블록 마지막의 awaitClose에서 리스너를 해제합니다.<\/p>\n<p>한 번 오는 콜백에 suspendCoroutine 대신 suspendCancellableCoroutine을 쓰는 이유는 취소입니다. 코루틴이 취소되면 suspendCancellableCoroutine은 CancellationException을 던지고 invokeOnCancellation을 호출하므로, 화면을 떠났을 때 다운로드나 SDK 요청 같은 원래 작업도 멈출 수 있습니다. continuation은 한 번만 재개할 수 있으므로 콜백이 여러 번 오는 API는 callbackFlow로 다룹니다. 공식 문서는 취소 처리기가 콜백과 동시에 불릴 수 있으니 register와 unregister가 스레드 안전해야 한다고 적습니다.<\/p>\n<p>callbackFlow에서는 콜백이 suspend 함수가 아니어서 send를 부를 수 없으므로 trySend를 쓰고, 버퍼가 차서 실패하면 결과를 확인해 로그를 남깁니다. awaitClose는 수집자가 취소되거나 close가 불릴 때까지 블록을 붙잡아 두고, 끝날 때 리스너를 해제합니다. awaitClose를 빠뜨리면 블록이 끝나는 순간 채널이 닫히지 않았다는 이유로 IllegalStateException이 나고, awaitClose는 있는데 해제를 빠뜨리면 수집이 끝나도 리스너가 남아 콜백이 계속 오고 리스너가 잡은 객체가 누수됩니다. 오류는 close(exception)으로 채널을 닫아 수집 쪽 collect에서 던지게 합니다.<\/p>\n<p>버퍼 정책도 정해야 합니다. callbackFlow의 채널은 기본 용량이 64이고, 가득 차면 trySend가 실패합니다. 연결 상태나 설정값처럼 최신 값만 의미 있는 콜백은 conflate()를 붙이고, 하나도 잃으면 안 되는 이벤트는 buffer로 용량을 넉넉히 잡습니다. Channel.UNLIMITED는 소비가 멈추면 메모리가 계속 늘어납니다. channelFlow도 채널을 쓰는 Cold Flow라는 점은 같지만, 블록 안에서 launch로 여러 코루틴을 띄워 동시에 send하고 블록과 자식이 끝나면 완료되는 용도입니다. callbackFlow는 리스너 해제를 빠뜨리지 않도록 awaitClose를 강제한 버전입니다.<\/p>\n<pre class=\"kotlin\"><code>suspend fun Downloader.await(url: String): File = suspendCancellableCoroutine { cont -&gt;\n    val task = start(url, object : DownloadCallback {\n        override fun onSuccess(file: File) = cont.resume(file)\n        override fun onError(e: Throwable) = cont.resumeWithException(e)\n    })\n    cont.invokeOnCancellation { task.cancel() }          // 코루틴 취소를 요청 취소로 연결\n}\n\nfun ConnectionMonitor.states(): Flow&lt;ConnectionState&gt; = callbackFlow {\n    val listener = ConnectionListener { state -&gt; trySend(state) }   // 콜백은 suspend가 아님\n    register(listener)\n    awaitClose { unregister(listener) }                   // 빠뜨리면 IllegalStateException\n}.conflate()                                               // 상태라 최신 값만 필요<\/code><\/pre>","f":"<ul>\n<li><strong>메인 스레드 콜백에서 trySendBlocking을 쓰면?<\/strong> 버퍼가 차면 메인 스레드를 막습니다. 메인 스레드 콜백에서는 trySend와 버퍼 정책으로 처리합니다.<\/li>\n<li><strong>같은 리스너를 여러 화면이 쓰면?<\/strong> callbackFlow는 Cold라 수집자마다 리스너가 하나씩 등록됩니다. 하나만 등록하려면 shareIn으로 공유합니다.<\/li>\n<li><strong>suspendCancellableCoroutine에서 취소 뒤에 콜백이 도착하면?<\/strong> 이미 취소된 continuation은 재개되지 않으므로 값이 버려집니다. 그 값이 닫아야 하는 자원이면 resume에 onCancellation 람다를 넘겨 그 안에서 닫습니다.<\/li>\n<\/ul>"},{"no":30,"t":"Cold Flow와 Hot Flow는 어떻게 다르고, Flow의 실행 모델은 어떻습니까?","a":"<p>Cold Flow는 collect할 때마다 블록이 처음부터 새로 실행되고, 수집자가 없으면 아무 일도 하지 않습니다. Hot Flow는 수집자와 상관없이 존재하면서 값을 내보내고 여러 수집자가 같은 흐름을 나눠 받으며, StateFlow와 SharedFlow가 여기에 속합니다. 기본 실행 모델은 순차적이어서 생산과 소비가 같은 코루틴에서 번갈아 실행되고, emit은 하류 처리가 끝나야 반환합니다.<\/p>\n<p>map, filter, onEach 같은 중간 연산자는 Flow를 감싼 새 Flow를 돌려줄 뿐 아무것도 실행하지 않습니다. collect, first, toList, launchIn 같은 종단 연산자가 실행을 시작합니다. emit은 suspend 함수이고 사실상 수집 람다를 직접 호출하므로, 수집이 느리면 생산도 그만큼 기다리는 자연스러운 배압이 생깁니다. 별도 코루틴과 채널이 생기는 것은 buffer, conflate, Dispatcher가 바뀌는 flowOn, flatMapMerge, channelFlow처럼 동시성을 넣는 연산자를 쓸 때뿐입니다. 수집 코루틴이 취소되면 업스트림도 함께 취소되고, take(3)은 세 개를 받은 뒤 업스트림을 취소합니다.<\/p>\n<p>실무에서 깨지는 지점은 같은 Cold Flow를 여러 곳에서 수집할 때입니다. Repository가 flow { emit(api.nearby()) }나 Room 쿼리 Flow를 노출하고 지도 화면과 하단 시트가 각각 collect하면 요청이 두 번 나가고 DB 관찰도 두 번 등록됩니다. ViewModel에서 stateIn이나 shareIn으로 Hot하게 바꿔 업스트림을 하나만 돌리면 해결됩니다. Hot Flow에는 다른 함정이 있습니다. StateFlow와 SharedFlow는 완료되지 않으므로 collect 다음 줄은 실행되지 않고, 생산 쪽에서 난 예외는 구독자에게 전달되지 않습니다.<\/p>\n<pre class=\"kotlin\"><code>val nearby: Flow&lt;List&lt;Place&gt;&gt; = flow {\n    emit(api.nearby())              // collect할 때마다 실행된다\n}\n\n// 두 화면이 각각 collect하면 요청도 두 번 나간다\n// ViewModel에서 하나로 공유한다\nval nearbyState: StateFlow&lt;List&lt;Place&gt;&gt; = nearby\n    .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())<\/code><\/pre>","f":"<ul>\n<li><strong>StateFlow를 collect한 다음 줄은 실행됩니까?<\/strong> 실행되지 않습니다. StateFlow는 완료되지 않아 collect가 정상 반환하지 않으므로, 여러 Flow를 수집하려면 각각 launch합니다.<\/li>\n<li><strong>Room이 돌려주는 Flow는 Cold입니까?<\/strong> Cold입니다. 수집할 때마다 테이블 관찰이 등록되고 변경이 생기면 쿼리를 다시 실행해 내보내므로, 같은 쿼리를 여러 곳에서 수집하면 관찰과 쿼리도 그만큼 늘어납니다.<\/li>\n<li><strong>Hot Flow를 수집하는 쪽이 취소되면 생산도 멈춥니까?<\/strong> 그 수집자만 빠질 뿐 생산은 계속됩니다. 생산을 멈추려면 값을 만드는 코루틴이나 스코프를 취소하거나, shareIn과 stateIn에 WhileSubscribed를 써서 구독자가 없을 때 업스트림을 멈추게 합니다.<\/li>\n<\/ul>"},{"no":31,"t":"StateFlow, SharedFlow, LiveData는 어떻게 다릅니까?","a":"<p>StateFlow는 초기값이 반드시 있고 최신 값 하나를 보관하는 상태 홀더로, equals로 같은 값이면 다시 내보내지 않습니다. SharedFlow는 기본적으로 값을 보관하지 않는 방송형 스트림이고, replay와 버퍼를 설정해 새 구독자에게 다시 보낼 개수와 느린 구독자를 다루는 방식을 정합니다. LiveData는 Android에 묶인 생명주기 인식 홀더로, observe만 하면 STOPPED에서 전달을 멈춰 주지만 메인 스레드 중심이고 연산자가 적습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>StateFlow<\/th>\n<th>SharedFlow<\/th>\n<th>LiveData<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>초기값<\/td>\n<td>필수<\/td>\n<td>없음<\/td>\n<td>없어도 됨<\/td>\n<\/tr>\n<tr>\n<td>보관하는 값<\/td>\n<td>최신 값 하나<\/td>\n<td>replay 개수만큼<\/td>\n<td>최신 값 하나<\/td>\n<\/tr>\n<tr>\n<td>같은 값을 다시 넣으면<\/td>\n<td>equals로 걸러 내보내지 않음<\/td>\n<td>그대로 내보냄<\/td>\n<td>그대로 알림<\/td>\n<\/tr>\n<tr>\n<td>느린 수집자<\/td>\n<td>중간 값을 건너뛰고 최신 값만 받음<\/td>\n<td>버퍼와 onBufferOverflow로 정함<\/td>\n<td>최신 값만 전달<\/td>\n<\/tr>\n<tr>\n<td>생명주기<\/td>\n<td>수집 쪽에서 repeatOnLifecycle 필요<\/td>\n<td>같음<\/td>\n<td>observe가 STOPPED에서 자동 중단<\/td>\n<\/tr>\n<tr>\n<td>의존성<\/td>\n<td>kotlinx.coroutines<\/td>\n<td>kotlinx.coroutines<\/td>\n<td>Android Lifecycle, 메인 스레드<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>StateFlow는 MutableStateFlow에 초기값을 넣어 만들고 value를 스레드 안전하게 읽고 씁니다. 값은 Any.equals로 비교해 conflate되므로 화면 상태처럼 \"지금 값\"이 중요한 곳에 맞습니다. SharedFlow는 MutableSharedFlow(replay, extraBufferCapacity, onBufferOverflow)로 만들고 기본값은 차례로 0, 0, SUSPEND입니다. replay는 새 구독자에게 다시 보낼 개수이고, extraBufferCapacity는 replay 외에 더 두는 버퍼로 공간이 남아 있는 동안 emit이 중단되지 않으며, onBufferOverflow는 버퍼가 찼을 때 SUSPEND, DROP_OLDEST, DROP_LATEST 중에서 고릅니다. 구독자가 없으면 버퍼를 쓰지 않고 replay만큼만 저장하므로 replay가 0이면 그 값은 버려집니다. LiveData는 setValue를 메인 스레드에서만 부를 수 있고, 백그라운드에서는 postValue를 쓰는데 메인 스레드가 처리하기 전에 여러 번 부르면 마지막 값만 전달됩니다.<\/p>\n<p>같은 객체를 고쳐서 다시 넣는 버그는 StateFlow에서 자주 납니다. MutableList나 var 프로퍼티를 가진 객체를 넣어 두고 내부를 고친 뒤 같은 인스턴스를 다시 대입하면 equals가 true라서 수집자에게 아무것도 가지 않습니다. Android UI 계층 가이드도 UI 상태를 불변으로 정의하고, 불변 객체가 특정 시점의 앱 상태를 보장한다는 점을 그 이점으로 듭니다. data class와 읽기 전용 컬렉션을 쓰고, copy로 새 인스턴스를 만들어 update로 넣습니다. LiveData는 setValue 때마다 알리지만, 같은 리스트 인스턴스를 ListAdapter.submitList에 다시 넘기면 무시되어 화면이 바뀌지 않는 같은 종류의 버그가 납니다.<\/p>\n<pre class=\"kotlin\"><code>data class MapUiState(val markers: List&lt;Marker&gt; = emptyList())\n\nprivate val _state = MutableStateFlow(MapUiState())\nval state: StateFlow&lt;MapUiState&gt; = _state.asStateFlow()\n\n// 버그: 같은 리스트를 고쳐 다시 넣으면 equals가 true라 방출되지 않음\n// (_state.value.markers as MutableList).add(m); _state.value = _state.value\n\n// 새 인스턴스를 원자적으로 넣는다\nfun addMarker(m: Marker) = _state.update { it.copy(markers = it.markers + m) }<\/code><\/pre>","f":"<ul>\n<li><strong>SharedFlow로 StateFlow와 같은 동작을 만들 수 있습니까?<\/strong> StateFlow 문서는 replay = 1, onBufferOverflow = DROP_OLDEST로 만든 SharedFlow에 distinctUntilChanged를 붙인 것과 같다고 설명합니다. 초기값을 빼거나 replay를 늘리는 식으로 동작을 바꿔야 할 때 SharedFlow를 씁니다.<\/li>\n<li><strong>기존 LiveData 코드는 한 번에 바꿔야 합니까?<\/strong> 그럴 필요는 없습니다. asLiveData와 asFlow로 경계를 잇고 새 코드와 데이터 계층부터 Flow로 옮깁니다. 데이터 계층에 LiveData를 두면 Android 의존이 아래 계층으로 퍼지고 연산자도 부족합니다.<\/li>\n<li><strong>여러 코루틴이 value = value + 1로 갱신하면?<\/strong> 읽기와 쓰기 사이에 다른 갱신이 끼어 손실됩니다. 공식 문서대로 이전 값에 기반한 갱신은 update를 씁니다.<\/li>\n<\/ul>"},{"no":32,"t":"stateIn과 shareIn의 SharingStarted.Eagerly, Lazily, WhileSubscribed(5000)는 무엇을 기준으로 고릅니까?","a":"<p>업스트림의 수명을 무엇에 맞출지로 고릅니다. Eagerly는 즉시 시작해 스코프가 끝날 때까지, Lazily는 첫 구독자가 생길 때 시작해 스코프가 끝날 때까지 업스트림을 돌리고, WhileSubscribed는 구독자가 있는 동안만 돌립니다. 화면이 보이는 동안만 업스트림이 돌면 되는 화면 상태에는 WhileSubscribed(5000)이 기본 선택이고, 화면이 백 스택에 있거나 다른 탭에 가려져 있어도 사용자가 돌아올 수 있는 동안 유지해야 하면 Lazily, 화면과 무관하게 바로 필요한 앱 수준 데이터에는 Eagerly를 씁니다.<\/p>\n<p>WhileSubscribed는 stopTimeoutMillis와 replayExpirationMillis를 받고, 기본값은 0과 Long.MAX_VALUE입니다. stopTimeout은 마지막 구독자가 사라진 뒤 업스트림을 멈추기까지 기다리는 시간입니다. 회전 같은 구성 변경에서는 이전 Activity의 수집이 끝나고 새 Activity가 다시 수집하기까지 잠깐 구독자가 0이 됩니다. stopTimeout이 0이면 그 사이 업스트림이 멈췄다가 다시 시작해 네트워크 요청이나 DB 쿼리가 다시 나갑니다. Android 문서는 WhileSubscribed(5000)을 UI가 사라진 뒤 5초 동안 구독을 유지해 구성 변경을 넘기는 설정으로 설명하고, 홈 화면으로 나가 오래 머물면 5초 뒤 업스트림이 멈춰 자원을 아낍니다. replayExpiration은 업스트림이 멈춘 뒤 replay 캐시를 비우기까지의 시간이고, stateIn이라면 값이 initialValue로 되돌아갑니다. 기본값은 영원히 유지라서 오래 백그라운드에 있다 돌아와도 마지막 값을 먼저 보여 줍니다. 실시간 교통 정보처럼 오래된 값을 보여 주면 안 되는 화면은 replayExpiration을 짧게 잡아 로딩 상태로 되돌립니다.<\/p>\n<p>Eagerly가 화면 상태에 맞지 않는 이유는 낭비입니다. 위치 업데이트나 DB 관찰을 viewModelScope에서 Eagerly로 공유하면 화면이 백그라운드로 가도 ViewModel이 clear될 때까지 업스트림이 계속 돌아 배터리와 데이터를 씁니다. 위치라면 백그라운드 위치 접근 문제로도 이어집니다. Lazily도 한 번 시작하면 멈추지 않습니다. Eagerly는 로그인 상태나 설정값처럼 앱 스코프에서 항상 필요한 데이터에 씁니다. 그리고 업스트림의 예외는 공유 코루틴을 끝내고 그 스코프로 전달되므로, viewModelScope라면 크래시로 이어질 수 있어 catch나 retry를 stateIn 앞에 둡니다.<\/p>\n<pre class=\"kotlin\"><code>val uiState: StateFlow&lt;FavoritesUiState&gt; = repository.observeFavorites()\n    .map&lt;List&lt;Place&gt;, FavoritesUiState&gt; { FavoritesUiState.Ready(it) }\n    .catch { emit(FavoritesUiState.Error) }        // 업스트림 예외는 stateIn 앞에서 처리\n    .stateIn(\n        scope = viewModelScope,\n        started = SharingStarted.WhileSubscribed(stopTimeoutMillis = 5_000),\n        initialValue = FavoritesUiState.Loading,\n    )<\/code><\/pre>","f":"<ul>\n<li><strong>WhileSubscribed로 만든 StateFlow를 테스트할 때 주의할 점은?<\/strong> 수집자가 없으면 업스트림이 시작되지 않아 value가 초기값에 머뭅니다. Android 문서대로 backgroundScope에서 수집 코루틴을 하나 띄운 뒤 value를 검사합니다.<\/li>\n<li><strong>stateIn을 함수 안에서 호출하면 어떻게 됩니까?<\/strong> 호출할 때마다 새 공유 코루틴과 새 StateFlow가 만들어져 공유 효과가 없고 코루틴만 쌓입니다. ViewModel 프로퍼티로 한 번만 만듭니다.<\/li>\n<li><strong>shareIn의 replay는 어떻게 정합니까?<\/strong> 새 구독자가 마지막 값부터 받아야 하는 상태성 데이터는 1, 지난 값을 다시 받으면 안 되는 흐름은 0입니다. 상태라면 대개 stateIn이 더 맞습니다.<\/li>\n<\/ul>"},{"no":33,"t":"Activity, Fragment, Compose에서 Flow를 안전하게 수집하는 방법은 무엇이고, lifecycleScope.launch { flow.collect { } }는 왜 문제입니까?","a":"<p>lifecycleScope는 DESTROYED에서야 취소되므로 그 안에서 바로 collect하면 화면이 백그라운드로 가서 STOPPED가 되어도 수집이 계속됩니다. 그동안 업스트림의 위치, 센서, DB 관찰이 계속 돌아 배터리와 데이터를 쓰고, 보이지 않는 View를 갱신하거나 STOPPED 이후에 Fragment 트랜잭션을 실행해 크래시가 날 수 있습니다. View 시스템에서는 repeatOnLifecycle(STARTED)나 flowWithLifecycle로, Compose에서는 collectAsStateWithLifecycle로 수집합니다.<\/p>\n<p>repeatOnLifecycle(STARTED)는 생명주기가 STARTED 이상이 될 때마다 블록을 새 코루틴으로 시작하고 STOPPED가 되면 취소하며, 다시 STARTED가 되면 블록을 처음부터 다시 실행합니다. Lifecycle 2.4.0에서 flowWithLifecycle과 함께 추가되었습니다. 여러 Flow를 수집하면 블록 안에서 각각 launch하고, Flow 하나만 수집하면 flowWithLifecycle이 간단합니다. repeatOnLifecycle은 Lifecycle이 DESTROYED가 될 때까지 반환하지 않는 suspend 함수라서, 그 뒤에 쓴 코드는 화면이 파괴될 때 실행된다는 점
