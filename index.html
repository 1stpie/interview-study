그라운드 복귀, 로컬 쓰기, 다른 기기의 변경을 알리는 FCM 데이터 메시지, 그리고 놓친 신호를 메우는 조건부 주기 작업입니다(6절의 배터리 문항). 푸시는 늦거나 빠질 수 있으므로 변경이 있다는 신호로만 쓰고 데이터는 변경 조회 API로 받습니다(9절의 실시간 정보 문항).<\/p>\n<pre class=\"text\"><code>// 개념 API: 경로와 필드 이름은 예시\nGET /favorites/changes?cursor=c41   → 200 { changes: [...], nextCursor: &quot;c42&quot; }  // 추가, 수정, 삭제 표시가 섞여 옴\n                                    → 410  // 커서가 너무 오래됨, 전체 목록으로 다시 맞춤\nPUT /favorites/{clientId}           ← { placeId, name, sortKey, baseVersion }\n                                    → 200 { version } 또는 409 { current }<\/code><\/pre>\n<p>핵심 결정은 네 가지입니다. 첫째, 증분 동기화를 하려면 서버가 삭제 표시를 일정 기간 보관해야 하므로, 보관 기간을 넘긴 커서는 서버가 거부하고 클라이언트는 전체 목록을 받아 로컬과 다시 맞춥니다. 이때도 대기 중인 로컬 변경은 보존합니다. 항목이 적다면 처음부터 전체 목록과 ETag 비교로 시작하는 것도 단순하고 좋은 선택입니다. 둘째, 두 기기가 같은 장소를 따로 추가하면 ID가 다른 행 두 개가 생기므로, 서버는 사용자와 장소 ID 조합에 유일 제약을 두고 나중 요청을 기존 항목에 합치며, 클라이언트는 응답으로 받은 서버 항목으로 로컬 행을 바꿉니다. 셋째, 순서를 정수 인덱스로 두면 항목 하나를 옮길 때 뒤쪽 항목이 모두 바뀌어 두 기기의 정렬이 쉽게 충돌하므로, 두 항목 사이 값을 주는 분수 인덱스로 옮긴 항목 하나만 바꿉니다. 넷째, 필드끼리 독립적이면 필드 단위로 병합하고, 같은 필드를 함께 고쳤을 때는 기기 시계가 아니라 서버 버전과 서버 시각으로 정합니다(4절의 오프라인 쓰기 문항). 로그인 전에 만든 즐겨찾기는 로그인할 때 계정으로 올리면서 장소 ID 기준으로 합치고, 로그아웃 때는 아직 올리지 않은 항목이 있는지부터 확인합니다.<\/p>\n<p>측정과 운영은 한 기기에서 쓴 변경이 다른 기기에 보이기까지의 지연, 오래 대기 상태로 남은 항목 비율, 동기화 실패율과 원인(네트워크, 4xx, 5xx), 충돌 응답 비율, 전체 다시 맞추기 발생률을 봅니다. 지연은 서버가 쓰기를 받은 시각과 다른 기기가 반영한 시각으로 잽니다. 대기 항목이 오래 남는 기기는 standby bucket이나 제조사 배터리 정책으로 작업이 밀린 경우가 많아, WorkInfo.getStopReason()으로 중지 이유를 함께 모읍니다.<\/p>","f":"<ul>\n<li><strong>앱 업데이트 직후 많은 기기가 한꺼번에 전체 다시 맞추기를 하면?<\/strong> 동기화 형식을 바꾸는 업데이트는 단계적 출시로 나눠 내보내고, 클라이언트는 첫 동기화를 무작위 지연 뒤에 시작하며, 서버가 503과 Retry-After를 주면 그 시각까지 기다립니다. 같은 사용자의 여러 기기가 같은 푸시로 동시에 깨어나는 것도 지터로 흩습니다.<\/li>\n<li><strong>두 기기가 모두 오프라인에서 같은 항목의 이름을 바꾸면?<\/strong> 먼저 올린 쪽이 반영되고, 나중 쪽은 보낸 버전이 낡아 409를 받습니다. 나중 기기는 최신 값을 받아 필드 단위로 다시 합치고, 같은 필드라면 서버에 나중에 도착한 쓰기를 남깁니다.<\/li>\n<li><strong>서버가 몇 시간 동안 장애면?<\/strong> 로컬 우선이라 사용자는 계속 추가하고 지울 수 있고 화면에는 동기화 대기만 표시됩니다. WorkManager 백오프로 재시도하되 횟수와 기한에 상한을 두고, 백오프 정책은 LINEAR와 EXPONENTIAL 두 가지로 간격만 늘리므로 복구 직후의 몰림은 서버의 503과 Retry-After, 작업을 다시 넣을 때 더하는 무작위 초기 지연으로 흩습니다. 서버의 멱등 키 보관 기간은 클라이언트가 다시 보낼 수 있는 기간보다 길게 잡습니다(9절의 타임아웃과 재시도 문항).<\/li>\n<\/ul>"},{"no":181,"t":"지도 화면에 주변 장소(주유소, 충전소)를 보여 주는 기능을 설계해 보세요. 지도 이동과 줌에 따른 요청 제어와 캐시까지 포함해 주세요.","a":"<p>먼저 범위를 확인하겠습니다. 가격이나 충전기 사용 가능 여부처럼 자주 바뀌는 정보도 함께 보여야 하고, 얼마나 최신이어야 합니까? 브랜드나 충전 방식 필터가 있습니까? 넓게 축소한 화면에서도 장소를 하나씩 보여야 합니까? 답이 없으면 도심에서는 한 화면에 수천 개가 보일 수 있고 가격과 충전기 상태를 함께 보여 준다고 가정하겠습니다. 결론은 지도가 멈춘 영역을 셀 단위 키로 바꿔 셀마다 요청하고 캐시하며, 위치와 이름 같은 정적 정보와 가격, 충전기 상태 같은 실시간 정보를 다른 요청과 다른 만료 시간으로 나누는 구조입니다.<\/p>\n<p>구조는 세 단계입니다. 첫째, 요청 시점입니다. 제스처 중 매 프레임 오는 카메라 값은 지도 SDK에 두고, 이동이 끝났을 때의 영역과 줌만 ViewModel로 올립니다(3절의 지도 SDK 문항). 둘째, 요청 단위입니다. 그 영역을 줌에 맞는 크기의 셀(지도 타일이나 S2 셀 같은 격자) 묶음으로 덮고, 캐시에 없거나 만료된 셀만 요청합니다. 지도를 조금 옮기면 대부분의 셀이 겹치므로 새로 받는 것은 가장자리 셀뿐입니다(8절의 공간 인덱스 문항). 셋째, 그리기입니다. 받은 장소는 메모리 안 공간 인덱스로 화면 영역만 골라 마커로 그리고, 줌이 낮으면 클러스터로 묶습니다(7절의 마커 성능 문항).<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 멈춘 지도 영역을 셀 묶음으로 바꾸고 셀 단위 캐시를 구독한다\n@OptIn(FlowPreview::class, ExperimentalCoroutinesApi::class)\nval places: StateFlow&lt;List&lt;Place&gt;&gt; = cameraIdle             // 이동이 끝났을 때만 오는 영역과 줌\n    .debounce(200)                                          // 예시 값, 측정으로 정함\n    .map { cam -&gt; cellsCovering(cam.bounds, cellLevelFor(cam.zoom)) }\n    .distinctUntilChanged()                                 // 같은 셀 묶음이면 무시\n    .flatMapLatest { cells -&gt; repository.observePlaces(cells) }  // 캐시 먼저, 빠진 셀만 요청\n    .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())<\/code><\/pre>\n<p>요청 제어의 핵심 결정은 취소 범위입니다. 화면 쪽은 새 영역이 오면 flatMapLatest로 구독만 갈아타고, 실제 셀 요청은 Repository가 앱 범위 스코프에서 셀 키마다 하나만 실행해 같은 셀을 원하는 다른 호출이 그 결과를 함께 기다리게 합니다. 이미 보낸 셀 요청은 끝까지 받아 캐시를 채웁니다. 응답이 작고 사용자가 곧 되돌아올 가능성이 크기 때문입니다. 아직 시작하지 않은 셀만 영역에서 벗어나면 취소합니다.<\/p>\n<p>캐시는 데이터 성격으로 나눕니다. 위치, 이름, 브랜드 같은 정적 정보는 셀 단위 GET으로 받아 HTTP 캐시와 CDN에 두고 max-age가 지나면 ETag로 재검증합니다(9절의 HTTP 캐시 문항). 가격과 충전기 상태는 화면에 보이는 장소 ID만 묶어 짧은 만료로 따로 받습니다. 둘을 한 응답에 섞으면 실시간 정보 때문에 정적 정보까지 자주 다시 받게 됩니다. 메모리 캐시는 셀 키 기준 LRU로 상한을 두고, 브랜드처럼 받은 데이터에서 거를 수 있는 필터는 클라이언트에서 걸러 필터를 바꿀 때마다 요청하지 않습니다. 줌이 낮아지면 셀을 크게 바꿔 화면을 덮는 셀 수를 일정하게 유지하고, 서버는 장소 대신 셀별 개수를 돌려주는 집계 응답으로 바꿉니다. 넓은 지역의 장소를 하나씩 받으면 응답과 마커 모두 감당할 수 없습니다.<\/p>\n<p>측정과 운영은 지도가 멈춘 뒤 마커가 보일 때까지의 시간(P50, P95), 카메라 이동 한 번당 요청 수, 셀 캐시 적중률, 응답 크기, 화면에 그린 마커 수와 그때의 프레임 시간을 봅니다(6절의 화면 버벅임 문항). 셀 크기, 한 번에 묶는 셀 수, 디바운스 시간은 원격 설정으로 두어 서버 부하에 맞춰 배포 없이 조절합니다.<\/p>","f":"<ul>\n<li><strong>연휴에 고속도로 주변으로 요청이 몰리면?<\/strong> 정적 정보는 셀 단위 GET이라 대부분 CDN에서 끝나고 실시간 정보만 원본 서버로 갑니다. 실시간 정보는 만료 시각에 지터를 더해 여러 기기가 같은 순간에 다시 요청하지 않게 하고, 서버가 Retry-After를 주면 마지막 값을 받은 시각과 함께 보여 줍니다.<\/li>\n<li><strong>사용자가 지도를 계속 빠르게 움직이면?<\/strong> 이동 중에는 요청하지 않고 멈춘 뒤에만 보냅니다. 멈출 때마다 새로 드러난 가장자리 셀만 받고 영역을 벗어난 대기 요청은 취소하므로, 요청 수는 움직인 횟수가 아니라 새로 드러난 면적만큼 늘어납니다.<\/li>\n<li><strong>오프라인이거나 터널에 들어가면?<\/strong> 캐시에 있는 셀은 받은 시각과 함께 보여 주고, 가격과 충전기 상태처럼 오래되면 틀리는 정보는 기준 시각을 표시하거나 숨깁니다. 캐시가 없는 셀은 빈 영역으로 두고 네트워크가 돌아오면 그 셀만 다시 요청합니다.<\/li>\n<\/ul>"},{"no":182,"t":"홈 화면 첫 표시를 빠르게 하려면 데이터 로딩을 어떻게 설계합니까?","a":"<p>먼저 범위를 확인하겠습니다. 홈에는 최근 목적지와 즐겨찾기, 서버가 정하는 배너와 추천, 교통이나 날씨 같은 실시간 정보, 지도 중 어디까지 있습니까? 사용자가 홈을 쓸 수 있게 된 시점을 무엇으로 봅니까? 답이 없으면 네 가지가 모두 있고, 최근 목적지와 홈 구성이 보이면 쓸 수 있는 상태로 보겠습니다. 결론은 홈 데이터를 기기 데이터, 서버 구성, 실시간 정보로 나눠 앞의 것일수록 먼저 그리고, 네트워크를 기다리지 않고 마지막으로 저장한 값으로 첫 화면을 그린 뒤 뒤에서 갱신하는 구조입니다.<\/p>\n<p>구조는 데이터 종류마다 경로가 다릅니다. 최근 목적지와 즐겨찾기는 Room이 SSOT라 ViewModel이 Flow를 구독하는 즉시 나옵니다(4절의 Repository 문항). 섹션 순서, 배너, 추천 같은 홈 구성은 서버 응답을 디스크에 저장해 두고, 시작할 때 저장값으로 먼저 그린 뒤 새 응답이 오면 바꿉니다. 처음 설치해 저장값이 없으면 앱에 넣어 둔 기본 구성을 씁니다(4절의 서버 주도 UI 문항). 교통이나 날씨처럼 오래되면 의미가 없는 정보는 저장값을 쓰지 않고 자리만 잡아 둔 채 받는 대로 채웁니다. ViewModel은 세 흐름을 combine해 화면 상태 하나로 만들고, 네트워크 요청은 순서대로가 아니라 동시에 시작합니다. combine은 모든 흐름이 첫 값을 낸 뒤에야 내보내므로, 실시간 흐름은 Loading을 곧바로 내보내게 해야 화면 전체가 실시간 정보를 기다리지 않습니다(2절의 combine 문항). 서버에는 홈에 필요한 데이터를 한 번에 주는 BFF를 두되, 느린 섹션 하나가 전체 응답을 붙잡지 않도록 섹션별 타임아웃과 부분 응답을 허용합니다(9절의 모바일 네트워크 문항).<\/p>\n<p>핵심 결정은 세 가지입니다. 첫째, 저장값을 먼저 보여 주면 빠르지만 끝난 이벤트 배너가 잠깐 보일 수 있으므로, 응답에 섹션별 만료 시각을 담아 만료된 항목은 저장값이어도 그리지 않습니다. 둘째, 새 데이터가 들어오며 화면이 밀리지 않게 섹션마다 높이를 미리 잡고 LazyColumn 항목에 안정적인 key를 줍니다. 누르려던 자리가 밀리면 사용자가 엉뚱한 것을 누릅니다. 셋째, 첫 프레임 전에 할 일을 줄입니다. Application.onCreate의 초기화를 덜어 내고 지도나 광고 같은 무거운 SDK는 첫 프레임 뒤에 초기화하며, 홈 진입 흐름을 Baseline Profile 생성 테스트에 넣습니다(6절의 앱 시작 시간 문항). WorkManager 주기 작업으로 홈 구성을 미리 받아 두는 방법도 있지만, 데이터와 배터리를 쓰는 만큼 다음 실행에서 실제로 쓰이는 비율을 보고 정합니다.<\/p>\n<p>측정과 운영은 TTID와 TTFD로 합니다. TTFD는 최근 목적지와 홈 구성이 저장값이든 새 응답이든 다 그려졌을 때 ReportDrawnWhen으로 보고하고 실시간 정보는 기다리지 않습니다. 실시간 정보까지 기다리면 TTFD가 앱이 아니라 서버 지연을 재게 됩니다. 개발 중에는 Macrobenchmark의 StartupTimingMetric으로 변경마다 비교하고, 현장에서는 Android vitals의 느린 시작 비율(콜드 5초, 웜 2초, 핫 1초 이상)과 Android 15부터 쓸 수 있는 ApplicationStartInfo의 단계별 시각을 봅니다. 섹션마다 저장값으로 그렸는지 새 응답으로 그렸는지와 그린 시각을 남기면 어느 섹션이 첫 화면을 늦추는지 바로 보입니다.<\/p>","f":"<ul>\n<li><strong>홈 API가 장애로 응답하지 않으면?<\/strong> 저장된 구성으로 그린 화면을 그대로 두고, 섹션별 타임아웃이 지나면 실시간 섹션만 숨기거나 다시 시도 버튼으로 바꿉니다. 화면 전체를 오류로 바꾸지 않고, 재시도는 지수 백오프와 지터로 해 장애가 풀리는 순간 요청이 몰리지 않게 합니다.<\/li>\n<li><strong>오프라인에서 콜드 스타트하면?<\/strong> 기기 데이터와 저장된 구성만으로 TTFD 조건이 채워지므로 홈은 평소처럼 완성되고, 실시간 섹션만 오프라인 표시를 합니다. 저장된 구성도 없는 첫 실행이면 앱에 넣어 둔 기본 구성으로 그립니다.<\/li>\n<li><strong>로그인 상태를 확인하느라 첫 화면이 늦어지면?<\/strong> 세션은 DataStore의 첫 값을 읽기 전까지 Unknown으로 두고(4절의 앱 전역 상태 문항), 로그인 여부와 상관없는 섹션의 틀은 먼저 그립니다. 스플래시를 붙잡는 조건에는 이런 가벼운 로컬 읽기만 둡니다(6절의 앱 시작 시간 문항).<\/li>\n<\/ul>"},{"no":183,"t":"사용자가 많은 앱에 새 기능을 안전하게 배포하는 체계를 설계해 보세요.","a":"<p>먼저 범위를 확인하겠습니다. 배포 주기와 코드 동결 방식은 어떻게 됩니까? 새 기능이 서버 API나 DB 스키마 변경을 함께 요구합니까? 문제가 났을 때 영향을 어디까지 허용하고, 얼마 안에 막아야 합니까? 답이 없으면 2주 단위 정기 릴리스 주기를 가정하겠습니다. 결론은 앱 배포와 기능 노출을 분리하는 것입니다. 코드는 꺼진 플래그 뒤에 넣어 정기 배포로 내보내고, 노출은 원격 플래그로 사용자 비율을 늘리며, 단계마다 미리 정한 지표로 진행과 중단을 판단합니다.<\/p>\n<p>구조는 다섯 겹입니다. 첫째, 머지 전 검증입니다. PR마다 정적 분석, 단위 테스트, 스크린샷 테스트를 돌리고, 미완성 기능은 꺼진 플래그 뒤에 두어 주 브랜치를 늘 배포할 수 있는 상태로 유지합니다. 둘째, 릴리스 빌드 검증입니다. R8을 켠 릴리스 설정 빌드로 회귀 테스트와 Macrobenchmark 성능 비교를 합니다(6절의 CI/CD 문항). 셋째, Play 테스트 트랙과 사내 사용자에게 먼저 배포해 실제 기기에서 씁니다. 넷째, 프로덕션 단계적 출시입니다. 작은 비율부터 시작해 지표가 기준 안이면 비율을 올립니다. Play Console의 단계적 출시 비율은 자동으로 오르지 않으므로 누가 어떤 기준으로 올릴지 정해 둡니다. 다섯째, 기능 노출입니다. 앱이 모든 사용자에게 퍼진 뒤에도 새 기능은 원격 플래그로 따로 비율을 올리고, 결함이 보이면 kill switch로 끕니다(4절의 기능 플래그 문항).<\/p>\n<p>핵심 결정은 되돌리는 수단을 미리 정하는 것입니다. 앱은 서버처럼 이전 버전으로 되돌릴 수 없습니다. 단계적 출시를 중단하면 새 사용자에게는 더 나가지 않지만 이미 받은 사용자는 그 버전에 남고, Android는 설치된 것보다 versionCode가 낮은 APK의 설치를 막습니다. 모든 사용자에게 출시한 버전도 중단하면 이전 버전이 새 사용자와 아직 업데이트하지 않은 사용자에게 다시 제공되지만, 이미 업데이트한 사용자에게는 효과가 없습니다. 그래서 이미 받은 사용자에게 듣는 대책은 원격 플래그와 versionCode를 올린 수정 빌드뿐입니다. 플래그로 되돌릴 수 없는 변경도 있습니다. DB 마이그레이션은 플래그를 꺼도 이미 바뀐 스키마가 그대로이므로, 새 컬럼 추가처럼 이전 코드 경로와 함께 살 수 있는 변경만 먼저 내보내고 지우는 변경은 다음 릴리스로 미룹니다. 서버 API도 서버가 새 필드를 먼저 추가하고, 구버전 앱이 충분히 줄어든 뒤 옛 필드를 지우는 순서를 지킵니다. 강제 업데이트는 보안 결함이나 호환이 깨진 경우에만 인앱 업데이트의 즉시 업데이트 흐름으로 씁니다.<\/p>\n<p>측정과 운영은 단계마다 진행과 중단 기준을 문서로 정해 두는 데서 시작합니다. 새 버전만 걸러 크래시율, ANR, 시작 시간, 검색 성공과 안내 시작 성공 같은 핵심 흐름 지표를 같은 기간의 이전 버전과 비교하고, 기기와 OS별로 묶어 특정 기기에서만 튀는지 봅니다. Play는 나쁜 동작 기준을 판정할 때 보통 최근 28일 데이터를 보므로, 그 전체 값에서는 일부 사용자에게만 나간 새 버전의 변화가 묻힙니다. 출시 판단은 Play Console 출시 대시보드와 vitals의 앱 버전별 분류로 새 버전을 이전 버전과 비교하고, 반영이 빠른 버전별 자체 지표를 함께 봅니다. vitals 전체 값은 나쁜 동작 기준(전체 user-perceived crash rate 1.09%, user-perceived ANR rate 0.47%)을 넘지 않는지 보는 데 씁니다(이 절의 감시 체계 문항). 중단한 뒤 원인이 새 기능이면 플래그를 끄고 출시를 재개하고, 코드 결함이면 수정 빌드를 다시 단계적으로 냅니다.<\/p>","f":"<ul>\n<li><strong>크래시가 앱 시작 직후에 나서 원격 플래그를 받기도 전에 죽으면?<\/strong> kill switch가 닿지 않습니다. 그래서 앱이 시작 중 연속 크래시를 스스로 세어 기준을 넘으면, 최근 켜진 플래그를 끄고 원격 설정부터 받는 안전 모드로 시작하게 합니다. 이 판단 경로는 어떤 플래그 뒤에도 두지 않습니다.<\/li>\n<li><strong>오프라인 사용자에게는 kill switch가 어떻게 닿습니까?<\/strong> 다음에 원격 설정을 받을 때까지는 마지막 값을 씁니다. 위험이 큰 기능은 마지막 값에도 유효 기간을 둬, 오래 갱신되지 않으면 앱 기본값인 꺼짐으로 돌아가게 합니다.<\/li>\n<li><strong>특정 제조사 기기에서만 크래시가 튀면?<\/strong> 전체 출시를 멈추기 전에 영향 범위부터 봅니다. 그 기기 사용자만 원격 플래그 조건으로 새 기능을 끄고 나머지는 출시를 이어 가며, 우회 코드는 범위를 좁히고 근거를 남깁니다(5절의 호환성 문항).<\/li>\n<\/ul>"},{"no":184,"t":"앱 성능과 안정성이 나빠지는 것을 막는 감시 체계를 설계해 보세요.","a":"<p>먼저 범위를 확인하겠습니다. 지킬 대상이 크래시와 ANR까지입니까, 시작 시간, 프레임, 배터리, 메모리까지입니까? 회귀를 머지 전에 막는 일과 출시 뒤에 빨리 찾는 일 중 어디까지 맡습니까? 경보를 받아 대응할 담당은 정해져 있습니까? 답이 없으면 모두 포함한다고 가정하겠습니다. 결론은 지표마다 기준값과 담당을 정하고, 개발 중에는 고정된 조건의 벤치마크로 회귀를 막고, 출시 뒤에는 버전별 현장 지표를 이전 버전과 비교해 경보를 내는 두 고리를 만드는 것입니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>지표<\/th>\n<th>개발 중<\/th>\n<th>현장<\/th>\n<th>Play 기준과 정의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>크래시<\/td>\n<td>R8을 켠 빌드의 UI 테스트<\/td>\n<td>vitals, 크래시 수집 도구, ApplicationExitInfo<\/td>\n<td>나쁜 동작 기준: user-perceived crash rate 전체 1.09%, 기기별 8%<\/td>\n<\/tr>\n<tr>\n<td>ANR<\/td>\n<td>StrictMode<\/td>\n<td>vitals, ApplicationExitInfo<\/td>\n<td>나쁜 동작 기준: user-perceived ANR rate 전체 0.47%, 기기별 8%<\/td>\n<\/tr>\n<tr>\n<td>시작<\/td>\n<td>Macrobenchmark StartupTimingMetric<\/td>\n<td>vitals, ApplicationStartInfo<\/td>\n<td>느린 시작: 콜드 5초, 웜 2초, 핫 1초 이상<\/td>\n<\/tr>\n<tr>\n<td>프레임<\/td>\n<td>Macrobenchmark FrameTimingMetric<\/td>\n<td>JankStats, vitals<\/td>\n<td>excessive slow frames: 16ms를 넘은 프레임이 50%를 넘는 일일 세션의 비율<\/td>\n<\/tr>\n<tr>\n<td>배터리<\/td>\n<td>Power Profiler, PowerMetric<\/td>\n<td>vitals excessive partial wake locks<\/td>\n<td>노출 영향: 24시간 중 2시간 이상 보유한 세션이 28일간 5% 초과<\/td>\n<\/tr>\n<tr>\n<td>메모리<\/td>\n<td>LeakCanary, 힙 덤프<\/td>\n<td>vitals memory usage, ProfilingManager<\/td>\n<td>RAM 등급과 앱 상태별 기준, 넘으면 2027년 2월부터 노출 영향 가능<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>구조는 두 고리입니다. 개발 고리는 PR과 야간 빌드에서 같은 실기기, 같은 컴파일 모드로 Macrobenchmark를 여러 번 돌려 중앙값과 백분위를 기준선과 비교하고, 앱 크기도 함께 기록해 기준을 넘으면 PR에 표시하거나 릴리스를 막습니다(6절의 CI/CD 문항). 디버그 빌드에는 StrictMode와 LeakCanary를 켜 메인 스레드 I/O와 누수를 개발 중에 잡습니다. 현장 고리는 크래시 수집 도구와 Android vitals에 앱이 직접 모으는 지표를 더합니다. 다음 실행 때 ApplicationExitInfo로 직전 종료 사유를, Android 15부터는 ApplicationStartInfo로 시작 유형과 단계별 시각을 모으고, JankStats로 화면별 버벅임을, OkHttp EventListener로 요청 단계별 시간을 모읍니다. 재현이 어려운 문제는 Android 15의 ProfilingManager로 현장 기기에서 힙 덤프나 트레이스를 받고, Android 16부터는 콜드 스타트나 ANR 같은 트리거에 시스템이 트레이스를 시작하고 멈추는 system-triggered profiling도 씁니다.<\/p>\n<p>핵심 결정은 세 가지입니다. 첫째, 경보는 절대값보다 이전 버전 대비 변화로 겁니다. 크래시율은 사용자 구성과 시기에 따라 움직이므로 같은 기간의 이전 버전과 비교하고, 새로 생긴 크래시 묶음은 영향 사용자 수와 핵심 흐름 여부로 우선순위를 정합니다(6절의 크래시 문항). 둘째, vitals와 자체 지표의 값을 섞어 비교하지 않습니다. vitals는 일일 활성 사용자 기준이고 Crashlytics는 세션 기준이라 값이 다르므로, 새 버전은 각 도구 안에서 이전 버전과 비교하고 vitals 전체 값은 Play가 최근 28일 데이터로 판정하는 스토어 기준을 넘지 않는지 보는 데 씁니다. 셋째, 수집에도 비용이 있습니다. 프레임과 네트워크 지표는 기기에서 집계해 묶어 보내고, 트레이스 같은 무거운 수집은 일부 사용자만 표본으로 받으며, 위치와 검색어 같은 개인정보는 남기지 않습니다.<\/p>\n<p>측정과 운영은 지표마다 담당 팀과 대응 문서를 정하고, 단계적 출시의 진행과 중단 판단에 같은 지표를 쓰는 것입니다(이 절의 배포 체계 문항). 기준을 넘은 회귀는 다음 릴리스 전에 고칠 일로 등록하고, 같은 원인이 반복되면 lint 규칙이나 벤치마크 시나리오로 만들어 다시 생기지 않게 막습니다. 경보가 너무 잦으면 무시되므로, 경보마다 실제 조치로 이어졌는지 보고 기준을 조정합니다.<\/p>","f":"<ul>\n<li><strong>벤치마크 결과가 실행마다 흔들려 CI가 자꾸 실패하면?<\/strong> 같은 실기기를 쓰고 배터리와 온도 상태를 맞추며, 반복 횟수를 늘려 중앙값과 백분위로 비교합니다. 한 번의 차이로 막지 않고 여러 실행에서 같은 방향으로 나빠질 때 막으며, 기준선은 주 브랜치의 최근 결과로 갱신합니다.<\/li>\n<li><strong>새 버전 크래시가 늘었는데 vitals는 조용하면?<\/strong> vitals 전체 값은 모든 버전 사용자를 합쳐 계산하므로 일부에게만 나간 새 버전의 변화가 묻힙니다. vitals를 앱 버전별로 나눠 보거나 출시 대시보드로 이전 버전과 비교하고, 버전별 자체 지표도 나빠졌으면 단계적 출시를 멈춘 뒤 원인을 봅니다.<\/li>\n<li><strong>장애 때 오류 로그가 폭증해 수집 자체가 트래픽을 키우면?<\/strong> 같은 오류는 기기에서 묶어 횟수만 보내고, 기기별 전송 상한과 표본 비율을 원격 설정으로 낮출 수 있게 합니다. 오프라인일 때는 상한까지만 쌓고 오래된 것부터 버립니다.<\/li>\n<\/ul>"},{"no":185,"t":"View 기반 대형 앱을 Compose로 옮기는 계획을 세워 보세요.","a":"<p>먼저 범위를 확인하겠습니다. 옮기는 목적이 개발 속도입니까, 디자인 일관성입니까, View 유지 관리 모드 대응입니까? 아직 Java로 된 화면은 얼마나 됩니까? 지도와 주행 안내처럼 성능에 민감한 화면은 어디입니까? 답이 없으면 화면이 많고 여러 팀이 기능 개발을 계속하는 앱으로 가정하겠습니다. 결론은 전면 재작성 없이 새 화면은 Compose로 만들고 기존 화면은 기능 변경이 생길 때 화면 단위로 옮기되, 빌드 조건, 디자인 시스템, 측정 기준을 먼저 갖추고 단계마다 완료 기준을 두는 점진 계획입니다.<\/p>\n<p>계획은 네 단계입니다. 준비 단계에서는 빌드 조건을 맞춥니다. Compose 컴파일러 Gradle 플러그인은 Kotlin 2.0 이상에서만 쓸 수 있고, Compose 1.12부터 compileSdk 37과 AGP 9.1.1 이상이 필요하며, compose-foundation 1.10부터 기본 minSdk가 23입니다(3절의 최근 변화 문항). 컴포저블은 Kotlin으로만 쓰므로 Java 화면은 UI를 옮기면서 Kotlin이 됩니다. 기존 Java ViewModel이 내보내는 LiveData는 observeAsState로 받아 그대로 쓸 수 있어 상태와 로직을 먼저 바꿀 필요는 없고, StateFlow와 코루틴으로 상태를 내보낼 화면만 함께 Kotlin으로 옮깁니다(1절의 Java와 Kotlin interop 문항). 같은 단계에서 디자인 토큰과 공통 컴포넌트를 Compose로 만들고, 스크린샷 테스트와 핵심 화면의 Macrobenchmark 기준선을 잡습니다. 시범 단계에서는 변경이 잦고 위험이 낮은 화면 한두 개를 옮겨 상태 호이스팅과 이펙트 사용 규칙을 리뷰 기준으로 굳힙니다. 확산 단계에서는 Fragment 안에 ComposeView를 넣어 화면 단위로 옮기고, Compose 버전이 없는 지도 같은 View는 AndroidView로 감쌉니다(3절의 점진 전환 문항). 화면 하나의 완료 기준은 기능 동등성, 접근성, 다크 모드, 프로세스 종료 뒤 복원, 성능 비교 통과로 정합니다. 마무리 단계에서 Compose 화면이 대부분이 되면 Fragment 기반 내비게이션을 단일 Activity와 Navigation 3 같은 Compose 내비게이션으로 바꾸고, 쓰지 않는 XML과 테마, ViewBinding 설정을 지웁니다.<\/p>\n<p>핵심 결정은 순서와 공존 비용입니다. 변경이 잦은 화면, 새로 만드는 화면, 공통 컴포넌트가 많은 화면을 먼저 옮기고, 안정적으로 돌며 바뀌지 않는 화면은 마지막에 둡니다. 지도와 주행 안내 화면은 위험이 크므로 지도 View는 그대로 둔 채 그 위의 UI만 옮기고, 신구 화면을 기능 플래그로 바꿔 끼워 지표를 비교한 뒤 옛 화면을 지웁니다(4절의 레거시 앱 전환 문항). 공존하는 동안은 두 UI 체계와 두 테마를 함께 유지하고 APK 크기도 늘어나므로, 전환 전담 팀에 몰아주기보다 기능 팀이 자기 화면을 옮기고 플랫폼 담당이 공통 컴포넌트와 리뷰를 맡아 공존 기간을 줄입니다. Google이 2026-05-19 View 컴포넌트를 유지 관리 모드로 두고 Fragments, RecyclerView, ViewPager 같은 View 기반 라이브러리는 중요한 버그만 고친다고 밝혔으므로, 새 View 코드는 더 만들지 않는 것을 원칙으로 둡니다.<\/p>\n<p>측정과 운영은 진척과 품질을 따로 봅니다. 진척은 Compose로 옮긴 화면 비율과 남은 XML 레이아웃 수로, 품질은 화면별 시작 시간과 스크롤 프레임을 전환 전후 Macrobenchmark로 비교하고 현장에서는 JankStats와 크래시율로 봅니다. 비교는 R8을 켠 릴리스 빌드에 Baseline Profile을 적용한 조건에서 해야 공정하므로, 옮긴 화면의 흐름은 Baseline Profile 생성 테스트에도 추가합니다(3절의 Compose 성능 문항). APK 크기와 빌드 시간도 CI에서 단계마다 기록해 공존 비용이 커지는지 봅니다.<\/p>","f":"<ul>\n<li><strong>옮긴 화면이 이전보다 느리면 어떻게 합니까?<\/strong> 플래그로 옛 화면에 돌려놓고 원인을 찾습니다. 먼저 릴리스 빌드와 Baseline Profile 조건에서 쟀는지 확인하고, Layout Inspector의 리컴포지션 횟수와 컴파일러 보고서로 범위를 좁힙니다(3절의 Compose 성능 문항).<\/li>\n<li><strong>일정이 밀려 중간에 멈춰야 하면?<\/strong> 단계마다 배포할 수 있는 상태라 어디서 멈춰도 앱은 동작합니다. 다만 공존 비용은 계속 들므로, 멈추더라도 새 화면은 Compose로 만든다는 원칙과 공통 컴포넌트 정비는 유지합니다.<\/li>\n<li><strong>Compose 버전을 올렸더니 목록 스크롤 성능이 달라지면?<\/strong> BOM으로 버전을 묶어 한 번에 올리고, 올릴 때마다 스크린샷 테스트와 Macrobenchmark를 다시 돌립니다. lazy prefetch의 pausable composition이 Compose 1.10에서 기본으로 켜졌다가 1.10.6에서 안정성 문제로 기본 꺼짐으로 바뀐 것처럼 성능 동작도 버전마다 달라집니다(3절의 최근 변화 문항).<\/li>\n<\/ul>"}]}]},"cs":{"title":"CS 면접 예상 질문 200 (시니어 답변)","label":"CS 200","intro":"<p>작성 2026-11-11. 특정 공고에 맞추지 않은 일반 CS 범위다. 답변은 결론, 원리, 트레이드오프, 실무에서 깨지는 지점이나 측정 방법 순서로 썼다. 꼬리 질문은 면접관이 이어서 물을 만한 것과 짧은 답이다.<\/p>\n<p>Android 프레임워크 문항은 Android 185문항에서 다루고, React, Flutter, AI 에이전트 문항은 이 범위가 아니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>절<\/th>\n<th>번호<\/th>\n<th>문항 수<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. 자료구조<\/td>\n<td>1~28<\/td>\n<td>28<\/td>\n<\/tr>\n<tr>\n<td>2. 알고리즘<\/td>\n<td>29~53<\/td>\n<td>25<\/td>\n<\/tr>\n<tr>\n<td>3. 운영체제<\/td>\n<td>54~87<\/td>\n<td>34<\/td>\n<\/tr>\n<tr>\n<td>4. 컴퓨터 구조<\/td>\n<td>88~97<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>5. 네트워크<\/td>\n<td>98~131<\/td>\n<td>34<\/td>\n<\/tr>\n<tr>\n<td>6. 데이터베이스<\/td>\n<td>132~159<\/td>\n<td>28<\/td>\n<\/tr>\n<tr>\n<td>7. 언어 런타임과 동시성<\/td>\n<td>160~177<\/td>\n<td>18<\/td>\n<\/tr>\n<tr>\n<td>8. 보안<\/td>\n<td>178~190<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>9. 소프트웨어 설계<\/td>\n<td>191~200<\/td>\n<td>10<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>연습 방법: 답을 통째로 외우지 말고, 첫 문장(결론)을 말한 뒤 원리 하나와 트레이드오프 하나를 붙이는 연습을 한다. 꼬리 질문까지 버티면 시니어 답변으로 들린다.<\/p>","sections":[{"no":1,"title":"자료구조","qs":[{"no":1,"t":"중간 삽입이 잦다는 이유로 ArrayList를 LinkedList로 바꾸자는 PR이 올라왔습니다. 어떻게 판단하겠습니까?","a":"<p>대부분 바꾸지 않습니다. LinkedList 삽입이 O(1)이라는 말은 삽입할 노드를 이미 쥐고 있을 때 이야기이고, 인덱스로 위치를 찾는 O(n) 순회가 먼저 듭니다. 노드가 힙 곳곳에 흩어져 있어 순회마다 캐시 미스가 나고, 원소마다 객체 헤더와 prev, next 참조가 붙어 메모리를 몇 배 쓰며 GC 대상도 늘어납니다.<\/p>\n<p>ArrayList의 중간 삽입은 뒤쪽 원소를 System.arraycopy로 한 번에 미는 연속 메모리 복사라서, 원소가 수만 개여도 실제로는 LinkedList보다 빠른 경우가 많습니다.<\/p>\n<p>LinkedList가 이기는 경우는 ListIterator로 위치를 잡은 채 삽입과 삭제를 반복할 때 정도이고, 양 끝 작업이 목적이면 ArrayDeque가 더 낫습니다. PR에는 실제 크기와 연산 패턴으로 JMH 벤치마크를 붙여 달라고 요청하고, 숫자가 없으면 ArrayList를 유지합니다.<\/p>","f":"<ul>\n<li><strong>캐시 지역성이 왜 그렇게 큰 차이를 만드나요?<\/strong> CPU는 메모리를 64바이트 캐시 라인 단위로 읽어서, 연속 배열은 한 번 읽을 때 이웃 원소가 함께 들어옵니다. 포인터를 따라가는 구조는 원소마다 메모리 접근이 새로 일어납니다.<\/li>\n<li><strong>Kotlin mutableListOf()의 실제 구현은?<\/strong> JVM에서는 java.util.ArrayList입니다.<\/li>\n<\/ul>"},{"no":2,"t":"동적 배열의 add가 \"분할상환 O(1)\"이라는 말은 무슨 뜻이고, 왜 용량을 일정량이 아니라 배수로 늘립니까?","a":"<p>어떤 add 한 번은 O(n)이 걸릴 수 있지만, n번 연산 전체의 비용을 n으로 나누면 O(1)이라는 뜻입니다. 배열이 가득 차면 더 큰 배열을 만들어 복사하는데, 용량을 두 배씩 늘리면 n개를 넣는 동안 복사 총량이 n + n/2 + n/4 + ... 로 2n을 넘지 않습니다.<\/p>\n<p>반대로 10칸씩 늘리면 복사 총량이 n²/20 수준이 되어 전체가 O(n²)로 무너집니다. 그래서 배수 증가가 핵심입니다. Java ArrayList는 old + (old &gt;&gt; 1), 약 1.5배로 늘립니다. 2배보다 남는 공간이 적고, 할당기 관점에서 예전에 해제한 블록을 다시 쓸 여지가 생긴다는 설명이 붙습니다.<\/p>\n<p>실무에서는 크기를 미리 알면 ArrayList(n)처럼 초기 용량을 지정해 재할당을 없앱니다. 또 분할상환은 평균이 낮다는 뜻이지 한 번의 최악이 작다는 뜻이 아니라서, 프레임 예산이 16ms인 UI 경로에서 큰 리스트를 키우면 특정 프레임만 튈 수 있습니다.<\/p>","f":"<ul>\n<li><strong>평균 시간복잡도와 분할상환은 어떻게 다른가요?<\/strong> 평균은 입력 분포에 대한 기댓값이고, 분할상환은 확률 없이 어떤 연산 순서든 최악 총합을 연산 수로 나눈 값입니다.<\/li>\n<li><strong>원소를 지우면 배열이 줄어드나요?<\/strong> ArrayList는 자동으로 줄지 않습니다. trimToSize를 직접 불러야 합니다.<\/li>\n<\/ul>"},{"no":3,"t":"HashMap의 get은 평균 O(1)인데 최악은 어떻게 되며, Java 8 이후 무엇이 바뀌었습니까?","a":"<p>최악은 모든 키가 한 버킷에 몰릴 때로, 그 버킷을 순차 비교하니 O(n)입니다. 해시 함수가 나쁘거나, 공격자가 같은 해시를 내는 키를 대량으로 보내는 HashDoS가 대표 원인입니다.<\/p>\n<p>Java 8부터는 한 버킷의 노드가 8개를 넘고 테이블 크기가 64 이상이면 연결 리스트를 레드블랙 트리로 바꿔 최악을 O(log n)으로 낮춥니다. 테이블이 64보다 작으면 트리 대신 테이블을 키우고, 노드가 6개 이하로 줄면 다시 리스트로 돌립니다. 키가 Comparable이면 트리 정렬이 깔끔해집니다.<\/p>\n<p>또 테이블 크기가 2의 거듭제곱이라 인덱스를 hash &amp; (n-1)로 구하는데, 하위 비트만 쓰면 충돌이 늘어서 hashCode의 상위 16비트를 하위 비트에 XOR해 섞습니다.<\/p>","f":"<ul>\n<li><strong>load factor 0.75는 무엇인가요?<\/strong> 원소 수가 용량의 75%를 넘으면 두 배로 키운다는 기준입니다. 공간 낭비와 충돌 확률 사이 절충값입니다.<\/li>\n<li><strong>키 객체의 필드를 넣은 뒤에 바꾸면?<\/strong> hashCode가 달라져 다른 버킷을 찾으므로 get이 null을 돌려주고, 원래 항목은 꺼낼 수 없는 채로 남아 누수가 됩니다.<\/li>\n<\/ul>"},{"no":4,"t":"equals와 hashCode의 계약은 무엇이고, equals만 재정의하면 어떤 버그가 납니까?","a":"<p>equals가 true인 두 객체는 hashCode가 같아야 합니다. 반대는 성립하지 않아도 됩니다(충돌 허용). equals만 재정의하면 논리적으로 같은 두 객체가 서로 다른 해시값을 가져 다른 버킷에 들어가고, HashSet에 중복으로 저장되거나 contains가 false를 돌려줍니다.<\/p>\n<p>Kotlin data class는 둘을 자동 생성하지만 주 생성자에 선언한 프로퍼티만 포함합니다. 본문에 선언한 프로퍼티는 비교에서 빠집니다. 배열 프로퍼티는 참조 비교라서 내용이 같아도 다르다고 판단하니 contentEquals와 contentHashCode로 직접 써야 합니다.<\/p>\n<p>해시 키로 쓰는 객체는 불변으로 두는 것이 원칙입니다. var 프로퍼티를 가진 data class를 Set에 넣고 값을 바꾸면 3번과 같은 누수가 생깁니다.<\/p>","f":"<ul>\n<li><strong>좋은 hashCode의 조건은?<\/strong> 같은 객체는 항상 같은 값, 값이 고르게 퍼짐, 계산이 빠름입니다.<\/li>\n<li><strong>equals의 다른 조건은?<\/strong> 반사성, 대칭성, 추이성, 일관성, null과 비교하면 false입니다. 상속 관계에서 대칭성이 깨지기 쉬워 합성을 권합니다.<\/li>\n<\/ul>"},{"no":5,"t":"해시 충돌 해결에서 체이닝과 오픈 어드레싱은 각각 언제 유리합니까? Android의 SparseArray는 어디에 속합니까?","a":"<p>체이닝은 버킷마다 리스트나 트리를 달아 충돌 원소를 모읍니다. 삭제가 단순하고 load factor가 높아도 성능이 완만하게 떨어지지만, 노드 할당과 포인터 추적 때문에 캐시에 불리합니다. Java HashMap이 체이닝입니다.<\/p>\n<p>오픈 어드레싱은 배열 안의 다른 칸을 탐사(선형, 이차, 이중 해싱)해 넣습니다. 노드 객체가 없어 메모리가 적고 캐시에 유리하지만, 차오를수록 클러스터링으로 급격히 느려지고 삭제에는 묘비(tombstone) 표시가 필요합니다. Python dict, Rust의 SwissTable 계열이 여기에 속합니다.<\/p>\n<p>SparseArray와 ArrayMap은 해시 테이블이 아니라 정렬된 배열과 이진 탐색입니다. 조회가 O(log n)이지만 int 키의 오토박싱과 Entry 객체가 없어 메모리가 적습니다. 원소가 수백 개 이하일 때 유리하고, 수천 개 이상이거나 삽입이 잦으면 HashMap이 낫습니다.<\/p>","f":"<ul>\n<li><strong>선형 탐사의 클러스터링은?<\/strong> 충돌 원소가 연속 칸에 뭉쳐 그 근처로 오는 키마다 긴 탐사를 하게 되는 현상입니다.<\/li>\n<li><strong>SparseArray에서 삽입 비용은?<\/strong> 정렬을 유지하려고 배열을 밀어야 해서 O(n)입니다. 삭제는 표시만 해 두고 나중에 한꺼번에 압축합니다.<\/li>\n<\/ul>"},{"no":6,"t":"Java의 Stack 클래스를 쓰지 말라고 하는 이유와 대안은 무엇입니까?","a":"<p>Stack은 Vector를 상속해서 모든 메서드가 synchronized라 단일 스레드에서도 락 비용을 냅니다. 또 상속 때문에 get(i), add(i, x) 같은 리스트 연산이 그대로 열려 있어 스택이라는 추상이 깨집니다. 상속을 잘못 쓴 대표 사례로 자주 언급됩니다.<\/p>\n<p>대안은 ArrayDeque입니다. 원형 배열로 양 끝 삽입과 삭제가 분할상환 O(1)이고, 노드 객체가 없어 LinkedList보다 빠릅니다. 스택(push, pop)과 큐(offer, poll) 모두 이것으로 씁니다. null은 넣을 수 없습니다. Kotlin에도 kotlin.collections.ArrayDeque가 있습니다.<\/p>\n<p>여러 스레드가 함께 쓰면 ConcurrentLinkedDeque나 생산자, 소비자 구조에 맞는 BlockingQueue를 고릅니다.<\/p>","f":"<ul>\n<li><strong>원형 배열에서 인덱스는 어떻게 계산하나요?<\/strong> (head + i) % capacity이고, 용량이 2의 거듭제곱이면 &amp; (capacity - 1)로 나눗셈을 없앱니다.<\/li>\n<li><strong>스택 두 개로 큐를 만들면?<\/strong> 넣기는 입력 스택, 빼기는 출력 스택에서 하고, 출력 스택이 비었을 때만 옮깁니다. 원소마다 한 번만 옮기므로 분할상환 O(1)입니다.<\/li>\n<\/ul>"},{"no":7,"t":"배열의 각 원소마다 오른쪽에서 처음 나오는 더 큰 값을 구하라고 하면, O(n²)보다 빠르게 어떻게 풉니까?","a":"<p>단조 스택으로 O(n)에 풉니다. 아직 답을 못 찾은 인덱스를 스택에 쌓는데, 스택 안의 값은 위로 갈수록 작아지는 상태를 유지합니다. 새 원소가 스택 top의 값보다 크면, 그 top의 답이 새 원소이므로 꺼내면서 답을 기록하고, 더 이상 크지 않을 때까지 반복한 뒤 새 인덱스를 넣습니다.<\/p>\n<p>원소마다 push와 pop이 한 번씩만 일어나므로 전체 O(n)입니다. 같은 틀로 주식 가격이 떨어지지 않은 기간, 일일 온도, 히스토그램에서 가장 큰 직사각형 문제를 풉니다.<\/p>\n<p>면접에서는 이중 루프 풀이를 먼저 말하고, \"각 원소가 스택에 한 번 들어가고 한 번 나온다\"는 근거로 O(n)을 증명하면 좋습니다.<\/p>","f":"<ul>\n<li><strong>히스토그램 최대 직사각형은 어떻게 푸나요?<\/strong> 높이가 증가하는 인덱스를 스택에 두고, 낮은 막대를 만나면 꺼내면서 그 막대를 높이로 하는 넓이를 계산합니다.<\/li>\n<li><strong>답이 없는 원소는?<\/strong> 끝까지 스택에 남은 인덱스로, -1 같은 기본값을 줍니다.<\/li>\n<\/ul>"},{"no":8,"t":"로그 1억 건에서 응답 시간 상위 100건을 메모리를 아끼며 뽑으려면 어떻게 합니까?","a":"<p>크기 100짜리 최소 힙을 유지합니다. 힙이 100개 미만이면 넣고, 다 찼으면 새 값이 힙의 최솟값보다 클 때만 최솟값을 빼고 넣습니다. 시간 O(N log K), 메모리 O(K)라서 1억 건을 스트림으로 읽으며 처리할 수 있습니다. 전체 정렬은 O(N log N)에 메모리 N이 들어 비효율적입니다.<\/p>\n<p>최대 힙이 아니라 최소 힙인 이유는, 지금까지 뽑힌 100개 중 가장 작은 값이 탈락 기준이라 그것을 O(1)로 봐야 하기 때문입니다.<\/p>\n<p>로그가 여러 서버에 나뉘어 있으면 서버마다 상위 100건을 구한 뒤 모아서 다시 상위 100건을 고릅니다. 정확한 순위가 아니라 p99 같은 백분위만 필요하면 HDR Histogram이나 t-digest 같은 요약 구조로 메모리를 훨씬 더 줄입니다. Quickselect는 평균 O(N)이지만 전체를 메모리에 올려야 해서 이 문제에는 맞지 않습니다.<\/p>","f":"<ul>\n<li><strong>배열로 힙을 만드는 heapify가 O(n log n)이 아니라 O(n)인 이유는?<\/strong> 노드 대부분이 아래쪽에 있고 그 노드들은 내려갈 높이가 짧아서, 높이 합을 계산하면 O(n)입니다.<\/li>\n<li><strong>힙을 배열로 표현할 때 자식 인덱스는?<\/strong> 0부터 시작하면 2i+1, 2i+2이고 부모는 (i-1)/2입니다.<\/li>\n<\/ul>"},{"no":9,"t":"이진 탐색 트리가 O(n)으로 나빠지는 경우는 언제이고, AVL 트리와 레드블랙 트리는 어떻게 다릅니까?","a":"<p>정렬된 순서로 키를 넣으면 한쪽으로만 자라 연결 리스트가 되고 탐색이 O(n)이 됩니다. 균형 트리는 회전으로 높이를 O(log n)으로 유지합니다.<\/p>\n<p>AVL은 모든 노드에서 좌우 높이 차를 1 이하로 엄격하게 지켜 높이가 더 낮고 조회가 빠르지만, 삽입과 삭제 때 회전이 더 자주 일어납니다. 레드블랙은 색 규칙으로 가장 긴 경로가 가장 짧은 경로의 2배를 넘지 않게만 보장해 균형은 느슨하지만 갱신 비용이 적습니다. 그래서 범용 구현은 레드블랙을 많이 씁니다. Java TreeMap, HashMap의 트리 버킷, 리눅스 커널의 여러 자료구조가 레드블랙 트리입니다.<\/p>\n<p>조회가 압도적으로 많고 갱신이 드문 사전 같은 용도면 AVL도 좋은 선택입니다.<\/p>","f":"<ul>\n<li><strong>TreeMap은 언제 HashMap 대신 쓰나요?<\/strong> 정렬 순회, floorKey, ceilingKey, subMap 같은 범위 조회가 필요할 때입니다. 대신 연산이 O(log n)입니다.<\/li>\n<li><strong>레드블랙 규칙은?<\/strong> 루트와 리프(NIL)는 검정, 빨강 노드의 자식은 검정, 어느 노드에서든 리프까지 검정 노드 수가 같습니다.<\/li>\n<\/ul>"},{"no":10,"t":"DB 인덱스는 왜 이진 트리가 아니라 B+트리를 씁니까?","a":"<p>디스크와 SSD는 바이트가 아니라 페이지 단위로 읽기 때문입니다. 이진 트리는 노드 하나에 키 하나라 1억 건이면 높이가 약 27이고, 노드마다 다른 페이지일 수 있어 I/O가 그만큼 일어납니다. B+트리는 노드 하나를 페이지 하나로 잡아 수백 개 키를 담으므로(팬아웃이 큼) 높이가 3~4 수준이고, 위쪽 노드는 보통 메모리에 캐시되어 실제 I/O는 한두 번입니다.<\/p>\n<p>B+트리는 데이터를 리프에만 두고 내부 노드에는 키만 둬서 팬아웃이 B-트리보다 더 크고, 리프끼리 연결 리스트로 이어져 범위 조회와 정렬 순서 스캔이 빠릅니다. 해시 인덱스는 등호 조회는 빠르지만 범위 조건에 쓸 수 없습니다.<\/p>\n<p>쓰기가 아주 많은 시스템은 LSM 트리(RocksDB, Cassandra)를 씁니다. 쓰기를 메모리에 모았다가 순차로 내려 빠르지만, 읽을 때 여러 레벨을 확인해야 하고 컴팩션 비용이 있습니다.<\/p>","f":"<ul>\n<li><strong>LSM 트리는 읽기 비용을 어떻게 줄이나요?<\/strong> 레벨마다 블룸 필터를 둬서 키가 없는 파일은 읽지 않습니다.<\/li>\n<li><strong>모바일 SQLite도 같나요?<\/strong> SQLite도 테이블과 인덱스를 B-트리 계열로 저장합니다. 그래서 인덱스 설계 원리가 서버 DB와 같습니다.<\/li>\n<\/ul>"},{"no":11,"t":"검색창 자동완성(접두사로 후보 찾기)에 알맞은 자료구조와 실제 설계는?","a":"<p>기본은 트라이입니다. 문자 하나가 간선 하나라서 접두사 길이 L에 대해 O(L)로 해당 노드에 도달하고, 그 아래가 모두 후보입니다. 실제 서비스에서는 입력마다 하위 트리를 다 훑을 수 없으니 노드마다 인기 상위 k개를 미리 저장해 바로 돌려줍니다.<\/p>\n<p>트라이는 메모리를 많이 씁니다. 자식이 하나뿐인 경로를 합친 압축 트라이(radix tree)로 줄이거나, 후보가 수만 개 수준이면 정렬된 배열에서 이진 탐색으로 접두사 범위를 찾는 방법이 더 단순하고 가볍습니다.<\/p>\n<p>서버 규모의 자동완성은 검색 엔진의 전용 기능을 쓰고, 클라이언트는 입력 디바운스, 이전 요청 취소, 결과 캐시를 함께 설계해야 체감 속도가 납니다. 한글은 초성 검색을 위해 초성 문자열을 따로 색인합니다.<\/p>","f":"<ul>\n<li><strong>한글 초성은 어떻게 뽑나요?<\/strong> 완성형 한글은 (코드 - 0xAC00) / 588이 초성 인덱스입니다(중성 21 × 종성 28 = 588).<\/li>\n<li><strong>자식 노드를 배열로 둘지 HashMap으로 둘지?<\/strong> 알파벳처럼 작은 문자 집합이면 배열이 빠르고, 한글이나 유니코드 전체면 HashMap이 메모리를 아낍니다.<\/li>\n<\/ul>"},{"no":12,"t":"그래프를 인접 행렬과 인접 리스트로 표현할 때 기준은 무엇입니까?","a":"<p>간선 수가 정점 수의 제곱에 가까운 밀집 그래프면 인접 행렬, 대부분의 실세계 그래프처럼 희소하면 인접 리스트입니다. 행렬은 메모리 O(V²)에 간선 존재 확인이 O(1)이고, 리스트는 메모리 O(V+E)에 한 정점의 이웃 순회가 이웃 수만큼만 듭니다.<\/p>\n<p>정점이 백만 개인 SNS 친구 관계를 행렬로 두면 10¹²칸이 필요해 불가능합니다. 반대로 정점이 수백 개이고 모든 쌍 최단 경로(플로이드 워셜)를 구한다면 행렬이 자연스럽습니다.<\/p>\n<p>희소하지만 간선 존재 확인도 잦으면 이웃을 HashSet으로 두는 절충을 씁니다.<\/p>","f":"<ul>\n<li><strong>BFS의 시간복잡도는 표현에 따라 어떻게 달라지나요?<\/strong> 리스트는 O(V+E), 행렬은 정점마다 한 줄을 다 봐야 해서 O(V²)입니다.<\/li>\n<li><strong>가중치는 어디에 두나요?<\/strong> 행렬은 칸 값, 리스트는 (이웃, 가중치) 쌍으로 둡니다.<\/li>\n<\/ul>"},{"no":13,"t":"유니온 파인드는 무엇이고 어디에 씁니까? 빠르게 만드는 두 가지 기법은?","a":"<p>원소들을 서로소 집합으로 나누고, 두 집합을 합치기(union)와 두 원소가 같은 집합인지 확인(find)을 빠르게 하는 구조입니다. 각 원소가 부모를 가리키고, 루트가 같으면 같은 집합입니다.<\/p>\n<p>경로 압축(find 중에 지나간 노드를 루트에 바로 연결)과 랭크나 크기 기준 합치기(작은 트리를 큰 트리 밑에 붙임)를 함께 쓰면 연산당 거의 상수 시간(역 아커만 함수)이 됩니다.<\/p>\n<p>쓰임은 크루스칼 최소 신장 트리, 무방향 그래프의 사이클 탐지, 네트워크 연결 여부, 이미지에서 연결된 영역 묶기입니다. 대신 집합을 다시 쪼개는 연산은 지원하기 어렵습니다.<\/p>","f":"<ul>\n<li><strong>방향 그래프의 사이클도 유니온 파인드로 찾나요?<\/strong> 아닙니다. DFS의 방문 상태(방문 중, 완료) 확인이나 위상 정렬을 씁니다.<\/li>\n<li><strong>경로 압축만 쓰면?<\/strong> 실무에선 충분히 빠르지만 이론적 보장은 둘을 같이 쓸 때 가장 좋습니다.<\/li>\n<\/ul>"},{"no":14,"t":"get과 put이 모두 O(1)인 LRU 캐시는 어떻게 구현합니까?","a":"<p>해시맵과 이중 연결 리스트를 함께 씁니다. 해시맵은 키로 노드를 O(1)에 찾고, 리스트는 사용 순서를 유지합니다. 접근할 때 노드를 리스트 맨 앞으로 옮기고, 용량을 넘으면 맨 뒤 노드를 지우며 해시맵에서도 뺍니다. 이중 연결이어야 중간 노드를 O(1)에 떼어낼 수 있습니다.<\/p>\n<p>Java에서는 LinkedHashMap(accessOrder = true)에 removeEldestEntry를 재정의하면 바로 됩니다. Android의 LruCache가 이 방식이고, sizeOf를 재정의해 개수가 아니라 바이트 기준으로 용량을 잡을 수 있습니다. 비트맵 캐시라면 비트맵 바이트 수를 반환합니다.<\/p>\n<p>LRU의 약점은 한 번 훑고 지나가는 스캔이 자주 쓰는 항목을 밀어낸다는 점입니다. 그래서 Caffeine 같은 라이브러리는 빈도까지 보는 W-TinyLFU 정책을 씁니다. 여러 스레드가 쓰면 동기화가 필요하고, 락 경쟁이 심하면 세그먼트로 나눕니다.<\/p>","f":"<ul>\n<li><strong>이미지 메모리 캐시 크기는 어떻게 정하나요?<\/strong> 앱 최대 힙의 일정 비율(Android 문서 예시는 1/8)로 잡고, onTrimMemory 신호에 맞춰 비웁니다.<\/li>\n<li><strong>단일 연결 리스트로는 왜 안 되나요?<\/strong> 노드를 떼려면 앞 노드가 필요해서 O(n) 탐색이 생깁니다.<\/li>\n<\/ul>"},{"no":15,"t":"블룸 필터는 어떤 보장을 하고, 어디에 쓰며, 한계는 무엇입니까?","a":"<p>비트 배열과 해시 함수 k개로 \"원소가 집합에 있는가\"를 매우 적은 메모리로 답합니다. 넣을 때 k개 위치를 1로 켜고, 확인할 때 k개가 모두 1이면 \"있을 수도 있음\", 하나라도 0이면 \"확실히 없음\"입니다. 거짓 양성은 있고 거짓 음성은 없습니다.<\/p>\n<p>그래서 비싼 조회 앞의 거름망으로 씁니다. LSM 트리 DB가 파일을 읽기 전에 키가 없는 파일을 거르고, 크롤러가 방문한 URL을 거르고, 악성 URL 목록을 로컬에서 먼저 확인합니다. \"아마 있음\"일 때만 진짜 저장소를 확인합니다.<\/p>\n<p>한계는 삭제가 안 된다는 점(한 비트를 여러 원소가 공유)과, 원소가 예상보다 많아지면 오탐률이 급격히 오른다는 점입니다. 삭제가 필요하면 카운팅 블룸 필터, 크기를 모르면 확장형 블룸 필터를 씁니다.<\/p>","f":"<ul>\n<li><strong>오탐률은 어떻게 조절하나요?<\/strong> 비트 수 m을 늘리고, 해시 수는 (m/n) ln 2 근처가 최적입니다.<\/li>\n<li><strong>해시 k개를 실제로 다 만드나요?<\/strong> 보통 해시 두 개를 h1 + i × h2로 조합해 k개를 만듭니다.<\/li>\n<\/ul>"},{"no":16,"t":"Kotlin의 List는 불변입니까?","a":"<p>아닙니다. List는 \"읽기 전용 인터페이스\"일 뿐입니다. 실제 객체는 ArrayList일 수 있어서, 같은 객체를 MutableList로 가진 다른 코드가 바꾸면 내 List도 바뀌고, 캐스팅으로 변경할 수도 있습니다. 즉 이 참조로는 못 바꾼다는 뜻이지, 아무도 못 바꾼다는 보장이 아닙니다.<\/p>\n<p>진짜 불변이 필요하면 방어적 복사(toList())를 하거나 kotlinx.collections.immutable의 영속 자료구조를 씁니다. 영속 자료구조는 수정할 때 전체를 복사하지 않고 바뀐 경로만 새로 만들고 나머지는 공유(구조 공유)해서 불변이면서도 수정 비용이 O(log n) 수준입니다.<\/p>\n<p>이 차이는 동시성과 UI 상태 비교에서 중요합니다. 상태 객체가 내부에서 몰래 바뀌면 다른 스레드에서 깨진 값을 보거나, 변경 감지가 일어나지 않습니다. 예를 들어 Compose 컴파일러는 List 타입 파라미터를 안정적이라고 확신하지 못해 불필요한 재구성이 생길 수 있습니다.<\/p>","f":"<ul>\n<li><strong>listOf()가 돌려주는 객체를 바꾸면?<\/strong> 내부 구현에 따라 UnsupportedOperationException이 나거나 바뀝니다. 계약으로 기대하면 안 됩니다.<\/li>\n<li><strong>구조 공유의 대표 구조는?<\/strong> HAMT(해시 배열 매핑 트라이)와 영속 벡터입니다.<\/li>\n<\/ul>"},{"no":17,"t":"링 버퍼(원형 버퍼)는 어디에 쓰고, 단일 생산자 단일 소비자에서 락 없이 만들 수 있는 이유는?","a":"<p>고정 크기 배열에 쓰기 위치와 읽기 위치 두 인덱스를 두고, 끝에 닿으면 처음으로 돌아가는 큐입니다. 할당이 없고 메모리가 고정이라 오디오 샘플, 센서 데이터, 최근 로그 N줄 보관, 네트워크 수신 버퍼처럼 계속 흘러들어오는 데이터에 씁니다. 가득 차면 덮어쓸지 막을지를 정책으로 정합니다.<\/p>\n<p>생산자 하나와 소비자 하나라면 쓰기 인덱스는 생산자만, 읽기 인덱스는 소비자만 바꿉니다. 각자 상대 인덱스를 읽기만 하므로 락 없이 동작하고, 대신 인덱스 갱신이 상대 스레드에 보이도록 메모리 가시성(volatile, release와 acquire)을 보장해야 합니다. 이 원리를 극단까지 쓴 것이 LMAX Disruptor입니다.<\/p>\n<p>생산자나 소비자가 여럿이 되면 같은 인덱스를 경쟁하므로 CAS나 락이 필요합니다.<\/p>","f":"<ul>\n<li><strong>가득 참과 비어 있음은 어떻게 구분하나요?<\/strong> 한 칸을 비워 두거나, 개수를 따로 세거나, 계속 증가하는 인덱스를 쓰고 차이로 판단합니다.<\/li>\n<li><strong>용량을 2의 거듭제곱으로 잡는 이유는?<\/strong> 나머지 연산을 비트 AND로 바꿔 빠르게 하려고입니다.<\/li>\n<\/ul>"},{"no":18,"t":"스킵 리스트는 무엇이고, 왜 균형 트리 대신 쓰는 곳이 있습니까?","a":"<p>정렬된 연결 리스트 위에 원소 일부를 건너뛰는 상위 층을 여러 개 쌓은 구조입니다. 위층에서 크게 건너뛰다가 아래층으로 내려가며 찾아서 평균 O(log n)입니다. 원소가 몇 층까지 올라갈지는 동전 던지기처럼 확률로 정합니다.<\/p>\n<p>장점은 회전 같은 복잡한 재균형이 없어 구현이 단순하고, 수정이 국소적이라 동시성 제어가 쉽다는 점입니다. 그래서 Java의 ConcurrentSkipListMap이 락 없는 정렬 맵으로 쓰고, Redis의 Sorted Set이 범위 조회와 순위 조회를 위해 씁니다.<\/p>\n<p>단점은 확률적 보장이라 최악이 O(n)이고, 포인터가 많아 메모리를 더 쓰며 캐시 효율이 트리 배열보다 떨어진다는 점입니다.<\/p>","f":"<ul>\n<li><strong>Redis Sorted Set은 스킵 리스트만 쓰나요?<\/strong> 점수 순서는 스킵 리스트, 멤버로 점수 찾기는 해시 테이블을 함께 씁니다. 작을 때는 압축된 리스트 형태를 씁니다.<\/li>\n<li><strong>층을 올릴 확률은?<\/strong> 보통 1/2이나 1/4입니다.<\/li>\n<\/ul>"},{"no":19,"t":"Java와 Kotlin의 String이 불변인 이유는 무엇이고, 반복문에서 문자열을 += 로 이어 붙이면 왜 느립니까?","a":"<p>불변이라서 얻는 것이 많습니다. 여러 곳이 같은 문자열을 안전하게 공유할 수 있고(문자열 풀), 스레드 간 동기화가 필요 없고, hashCode를 한 번 계산해 캐시할 수 있어 HashMap 키로 좋고, 파일 경로나 URL처럼 보안 검사 뒤에 값이 바뀌는 공격을 막습니다.<\/p>\n<p>대신 += 를 반복하면 매번 새 문자열을 만들고 기존 내용을 복사합니다. n번 붙이면 복사 총량이 1 + 2 + ... + n이라 O(n²)이고 임시 객체가 GC 부담이 됩니다. 컴파일러는 한 식 안의 연결은 최적화하지만, 반복문을 넘나드는 연결은 최적화하지 못합니다.<\/p>\n<p>반복 연결에는 StringBuilder나 Kotlin의 buildString, joinToString을 씁니다. 로그처럼 실제로 출력하지 않을 수도 있는 문자열은 람다로 늦게 만들어 비용 자체를 피합니다.<\/p>","f":"<ul>\n<li><strong>StringBuilder와 StringBuffer 차이는?<\/strong> StringBuffer는 메서드가 synchronized입니다. 지역 변수로 쓰면 StringBuilder가 맞습니다.<\/li>\n<li><strong>substring은 원본을 공유하나요?<\/strong> Java 7u6 이후에는 복사합니다. 예전에는 공유해서 작은 부분 문자열이 큰 원본을 붙잡는 누수가 있었습니다.<\/li>\n<\/ul>"},{"no":20,"t":"문자열의 length가 사용자가 보는 글자 수와 다른 이유는 무엇이고, 입력 글자 수 제한은 어떻게 구현해야 합니까?","a":"<p>Java와 Kotlin의 String은 UTF-16 코드 유닛 배열이고 length는 코드 유닛 수입니다. 기본 다국어 평면 밖의 문자, 예를 들어 대부분의 이모지는 서로게이트 쌍이라 2로 셉니다. 여기에 피부색 조정자나 ZWJ로 여러 코드 포인트를 묶는 이모지, 결합 문자까지 있어 사람이 보는 한 글자(grapheme cluster)가 length 2~10 이상이 되기도 합니다.<\/p>\n<p>그래서 \"20자 제한\"은 무엇을 세는지부터 정해야 합니다. 화면 글자 수라면 BreakIterator 같은 글자 경계 분석으로 셉니다. 서버 DB 컬럼 제한이라면 저장 인코딩 기준 바이트나 코드 포인트를 셉니다. 클라이언트와 서버가 다른 기준으로 세면 앱에서는 통과한 입력이 서버에서 거절됩니다.<\/p>\n<p>자르기도 같은 문제가 있어서 substring으로 아무 데나 자르면 서로게이트 쌍이 쪼개져 깨진 문자가 됩니다. 저장 쪽에서는 MySQL의 utf8이 3바이트까지라 이모지가 안 들어가므로 utf8mb4를 써야 합니다.<\/p>","f":"<ul>\n<li><strong>UTF-8과 UTF-16은 언제 유리한가요?<\/strong> 영문 위주면 UTF-8이 작고, 한글은 UTF-8에서 3바이트, UTF-16에서 2바이트입니다. 네트워크와 파일은 사실상 UTF-8이 표준입니다.<\/li>\n<li><strong>codePointCount와 grapheme 수의 차이는?<\/strong> 코드 포인트는 유니코드 번호 단위이고, 결합 이모지 하나는 코드 포인트 여러 개입니다.<\/li>\n<\/ul>"},{"no":21,"t":"캐시 서버를 3대에서 4대로 늘렸더니 캐시 적중률이 바닥으로 떨어졌습니다. 왜 그렇고, 어떻게 설계해야 합니까?","a":"<p>hash(key) % N으로 서버를 고르면 N이 바뀌는 순간 거의 모든 키의 담당 서버가 바뀌기 때문입니다. 3에서 4로 바꾸면 키의 약 3/4이 다른 서버로 가서 사실상 캐시를 비운 것과 같고, 그 요청이 한꺼번에 DB로 몰립니다.<\/p>\n<p>일관된 해싱(consistent hashing)을 씁니다. 서버와 키를 같은 해시 원(링) 위에 놓고, 키는 시계 방향으로 처음 만나는 서버에 둡니다. 서버를 추가하면 새 서버와 이전 서버 사이 구간의 키만 옮겨지므로 평균 1/N만 이동합니다.<\/p>\n<p>서버가 적으면 링 위에 고르게 퍼지지 않아 쏠림이 생기므로, 서버마다 가상 노드를 수백 개씩 두어 분포를 고르게 하고 성능이 다른 서버는 가상 노드 수로 가중치를 줍니다. Rendezvous 해싱도 같은 목적의 다른 방법입니다.<\/p>","f":"<ul>\n<li><strong>증설 순간 DB가 몰리는 것은 어떻게 막나요?<\/strong> 미리 데우기, 요청 합치기(같은 키는 한 번만 DB 조회), 점진 투입을 씁니다.<\/li>\n<li><strong>어디에 또 쓰나요?<\/strong> 분산 DB의 파티션 배치(Cassandra, DynamoDB 계열)와 로드 밸런서의 세션 고정입니다.<\/li>\n<\/ul>"},{"no":22,"t":"배열의 구간 합을 자주 묻는데 값도 자주 바뀝니다. 어떤 자료구조를 씁니까?","a":"<p>값이 안 바뀌면 누적 합 배열로 구간 합을 O(1)에 답합니다. 하지만 값 하나가 바뀌면 누적 합 뒤쪽을 전부 고쳐야 해서 O(n)입니다.<\/p>\n<p>조회와 갱신이 둘 다 잦으면 펜윅 트리(Binary Indexed Tree)나 세그먼트 트리로 둘 다 O(log n)에 처리합니다. 펜윅 트리는 배열 하나와 짧은 코드로 합처럼 역연산이 있는 연산에 적합하고, 세그먼트 트리는 구간 최솟값, 최댓값처럼 역연산이 없는 연산과 구간 전체 갱신(lazy propagation)까지 다룹니다.<\/p>\n<p>실무에서 직접 짤 일은 드물지만, \"읽기와 쓰기 비율에 따라 미리 계산할지, 요청 때 계산할지를 고르는 문제\"라는 점이 핵심입니다. DB의 집계 테이블이나 캐시 설계도 같은 판단입니다.<\/p>","f":"<ul>\n<li><strong>펜윅 트리에서 i &amp; -i는 무엇인가요?<\/strong> i의 가장 낮은 1비트로, 그 칸이 담당하는 구간 길이입니다.<\/li>\n<li><strong>2차원 구간 합은?<\/strong> 2차원 누적 합에 포함 배제를 쓰고, 갱신이 있으면 2차원 펜윅 트리를 씁니다.<\/li>\n<\/ul>"},{"no":23,"t":"시간복잡도가 같은 두 코드의 실제 속도가 몇 배 차이 나는 이유는 무엇입니까?","a":"<p>Big-O는 n이 커질 때의 증가율만 보고 상수와 하드웨어 효과를 지우기 때문입니다. 실제 속도는 메모리 접근 패턴(캐시 적중률), 분기 예측 실패, 객체 할당과 GC, 가상 호출, 박싱 같은 상수에 크게 좌우됩니다. 같은 O(n) 순회라도 연속 배열과 연결 리스트는 몇 배 차이가 납니다.<\/p>\n<p>n이 작을 때는 복잡도가 더 나쁜 알고리즘이 이기기도 합니다. 그래서 TimSort나 introsort는 작은 구간에서 삽입 정렬로 바꾸고, 원소가 적을 때 ArrayMap이 HashMap보다 낫습니다.<\/p>\n<p>그래서 성능 판단은 복잡도로 후보를 좁히고, 실제 데이터 크기로 벤치마크해서 정합니다. JVM은 JIT 워밍업과 죽은 코드 제거 때문에 단순 반복 시간 측정이 틀리기 쉬워 JMH를 쓰고, Android에서는 Jetpack Benchmark를 씁니다.<\/p>","f":"<ul>\n<li><strong>분기 예측이 어떻게 성능을 바꾸나요?<\/strong> CPU가 분기 방향을 미리 추측해 실행하다가 틀리면 파이프라인을 비웁니다. 데이터가 정렬되어 있으면 추측이 잘 맞습니다.<\/li>\n<li><strong>마이크로 벤치마크의 함정은?<\/strong> 워밍업 부족, 결과를 안 써서 코드가 제거됨, 상수 접기, GC가 측정 중에 끼어드는 것입니다.<\/li>\n<\/ul>"},{"no":24,"t":"재귀로 짠 DFS가 실서비스 데이터에서 StackOverflowError를 냈습니다. 원인과 해결은?","a":"<p>호출 하나마다 스택 프레임(지역 변수, 반환 주소)이 쌓이는데, 스레드 스택 크기는 고정이라 재귀 깊이가 데이터 크기에 비례하면 넘칩니다. 테스트 데이터는 얕고 실데이터는 한 줄로 긴 트리나 그래프였을 가능성이 큽니다.<\/p>\n<p>해결은 명시적 스택을 쓰는 반복문으로 바꾸는 것입니다. 스택이 힙에 있어 깊이 제한이 사실상 메모리만큼 늘어납니다. 꼬리 재귀 형태라면 Kotlin의 tailrec으로 컴파일러가 반복문으로 바꿔 줍니다. JVM 자체는 꼬리 호출 최적화를 하지 않습니다.<\/p>\n<p>스레드를 직접 만들 때 스택 크기를 키우는 방법도 있지만 근본 해결은 아닙니다. 리뷰 기준으로는 \"입력 크기에 비례하는 재귀는 상한이 보장될 때만\"을 둡니다.<\/p>","f":"<ul>\n<li><strong>tailrec이 적용되지 않는 경우는?<\/strong> 재귀 호출 뒤에 다른 연산이 남아 있으면(예: n * f(n-1)) 꼬리 위치가 아니라 적용되지 않습니다.<\/li>\n<li><strong>재귀 DFS와 반복 DFS의 방문 순서가 다를 수 있나요?<\/strong> 스택에 이웃을 넣는 순서에 따라 달라집니다. 같게 하려면 역순으로 넣습니다.<\/li>\n<\/ul>"},{"no":25,"t":"비트 연산을 실무에서 어디에 씁니까?","a":"<p>가장 흔한 곳은 플래그 묶음입니다. 여러 boolean을 int 하나에 넣어 OR로 켜고, AND로 확인하고, AND NOT으로 끕니다. Android Intent 플래그, 뷰 상태 플래그, 파일 권한(rwx)이 이 방식입니다. Kotlin과 Java에서 타입 안전하게 쓰려면 EnumSet을 쓰는데 내부가 비트 벡터라 빠릅니다.<\/p>\n<p>계산 기법으로는 x &amp; (x-1) == 0으로 2의 거듭제곱 판별, x &amp; -x로 가장 낮은 1비트 구하기, 2의 거듭제곱 크기에서 % 대신 &amp; 쓰기, 비트 수 세기(Integer.bitCount)가 있습니다. 알고리즘에서는 원소 20개 이하 집합을 비트마스크로 표현하는 DP(외판원 문제)에 씁니다.<\/p>\n<p>주의할 점은 가독성입니다. 이름 붙은 상수와 함수로 감싸고, 부호 있는 시프트(&gt;&gt;)와 부호 없는 시프트(&gt;&gt;&gt;)를 구분해야 합니다.<\/p>","f":"<ul>\n<li><strong>XOR로 두 변수를 바꾸는 기법을 쓰나요?<\/strong> 쓰지 않습니다. 같은 변수일 때 0이 되는 함정이 있고, 컴파일러가 임시 변수 방식을 더 잘 최적화합니다.<\/li>\n<li><strong>배열에서 한 번만 나오는 수 찾기는?<\/strong> 모두 XOR하면 짝수 번 나온 수는 사라집니다.<\/li>\n<\/ul>"},{"no":26,"t":"Kotlin에서 mutableMapOf, HashMap, TreeMap의 순회 순서는 어떻게 다르고, 왜 문제가 됩니까?","a":"<p>mutableMapOf는 LinkedHashMap이라 넣은 순서대로 순회합니다. HashMap은 순서를 보장하지 않고 리사이즈나 JDK 버전에 따라 바뀔 수 있습니다. TreeMap은 키 정렬 순서입니다.<\/p>\n<p>문제는 HashMap 순회 순서에 우연히 기대는 코드입니다. 지금은 같은 순서로 나와서 테스트가 통과하다가, 원소 수가 늘어 리사이즈되거나 런타임이 바뀌면 화면 정렬, JSON 직렬화 결과, 서명용 문자열이 달라집니다. 특히 요청 서명이나 캐시 키를 맵 순회로 만들면 서버와 결과가 달라지는 버그가 됩니다.<\/p>\n<p>순서가 의미 있으면 타입으로 드러냅니다. 넣은 순서면 LinkedHashMap, 정렬이면 TreeMap이나 sortedBy를 명시합니다.<\/p>","f":"<ul>\n<li><strong>LinkedHashMap의 비용은?<\/strong> 엔트리마다 이중 연결 포인터가 붙어 메모리가 조금 더 듭니다.<\/li>\n<li><strong>HashSet의 순서는?<\/strong> 내부가 HashMap이라 같은 문제가 있습니다. setOf()는 LinkedHashSet입니다.<\/li>\n<\/ul>"},{"no":27,"t":"0부터 약 40억 사이 정수 1억 개 중 중복이 있는지 메모리 100MB 안에서 확인하려면?","a":"<p>기본 도구는 비트셋이고, 범위를 나눠서 씁니다. 값 하나를 비트 하나로 표시하고, 볼 때 비트가 이미 켜져 있으면 중복입니다. <code>HashSet&lt;Int&gt;<\/code>는 원소마다 박싱 객체와 엔트리 객체가 붙어 수십 바이트씩 들기 때문에 1억 개면 GB 단위가 되어 처음부터 탈락입니다.<\/p>\n<p>범위가 약 40억(2³²)이면 비트셋 전체가 512MB라 100MB에 안 들어갑니다. 그래서 상위 3비트로 범위를 8개로 나눕니다. 한 구간은 2²⁹비트, 64MB라 메모리에 들어갑니다. 입력을 8번 읽으면서 매번 한 구간에 속한 수만 비트셋에 표시하거나, 한 번 읽어 구간별 임시 파일 8개로 나눈 뒤 하나씩 확인합니다. 같은 값은 반드시 같은 구간에 들어가므로 구간끼리는 비교할 필요가 없습니다. 값 범위가 1억 이하라면 비트셋 12.5MB 하나로 끝납니다.<\/p>\n<p>정확도를 조금 포기해도 되면 블룸 필터로 더 줄일 수 있고, 이때는 \"중복 같음\"만 다시 정확히 확인합니다.<\/p>","f":"<ul>\n<li><strong>정렬 후 이웃 비교는?<\/strong> 외부 정렬을 쓰면 메모리 제한 안에서 되지만 O(N log N)이고 디스크 I/O가 큽니다.<\/li>\n<li><strong>Java BitSet의 내부는?<\/strong> long 배열입니다.<\/li>\n<\/ul>"},{"no":28,"t":"\"최근 본 상품 20개\"를 중복 없이 최신 순으로 보여 주는 기능의 자료구조는?","a":"<p>접근 순서를 유지하는 LinkedHashMap이나 LinkedHashSet입니다. 이미 본 상품을 다시 보면 지우고 다시 넣어 맨 뒤(최신)로 보내고, 크기가 20을 넘으면 가장 오래된 첫 원소를 지웁니다. 모든 연산이 O(1)이고, 사실상 용량 20짜리 LRU 캐시와 같은 구조입니다.<\/p>\n<p>배열로 하면 중복 확인과 중간 삭제가 O(n)이지만, n이 20이면 실제 차이는 없습니다. 그래서 면접에서는 \"n이 작아 리스트로도 충분하지만 규모가 커지면 해시와 연결 리스트 조합\"이라고 둘 다 말하는 편이 시니어답습니다.<\/p>\n<p>실제 기능에서는 자료구조보다 저장 위치가 더 중요합니다. 기기 간 동기화가 필요하면 서버에 두고, 로컬이면 앱 재시작 후에도 남도록 DB나 파일에 저장하고 동시 수정을 막습니다.<\/p>","f":"<ul>\n<li><strong>여러 기기에서 본 기록을 합치면?<\/strong> 타임스탬프 기준으로 병합하고 같은 상품은 최신 시각만 남깁니다.<\/li>\n<li><strong>LinkedHashSet에서 다시 넣으면 순서가 바뀌나요?<\/strong> 아니요. 이미 있으면 순서가 유지되므로 지우고 다시 넣어야 합니다.<\/li>\n<\/ul>"}]},{"no":2,"title":"알고리즘","qs":[{"no":29,"t":"여러 기준으로 정렬할 때 안정 정렬이 왜 중요하고, Java와 Kotlin의 기본 정렬은 안정적입니까?","a":"<p>안정 정렬은 키가 같은 원소들의 원래 순서를 유지합니다. 시간 순으로 정렬된 주문 목록을 상태별로 다시 정렬했을 때 같은 상태 안에서 시간 순서가 유지되어야 한다면 안정성이 필요합니다. 그래서 다중 키 정렬을 \"두 번째 키로 정렬한 뒤 첫 번째 키로 안정 정렬\"로 할 수도 있습니다.<\/p>\n<p>Java의 객체 정렬(Collections.sort, Arrays.sort(Object[]))은 TimSort라 안정적이고, 기본형 배열 정렬은 Dual-Pivot Quicksort라 불안정하지만 기본형은 같은 값끼리 구분할 수 없으니 상관없습니다. Kotlin의 sortedBy, sortedWith도 JVM에서는 이 구현을 써서 안정적입니다.<\/p>\n<p>실무에서는 두 번 정렬보다 compareBy({ it.status }, { it.time })처럼 비교자 하나로 우선순위를 드러내는 편이 읽기 쉽고 빠릅니다. 안정 정렬은 병합, 삽입, TimSort, 계수 정렬이고, 퀵, 힙, 선택 정렬은 불안정합니다.<\/p>","f":"<ul>\n<li><strong>비교자가 일관되지 않으면?<\/strong> TimSort가 \"Comparison method violates its general contract!\" 예외를 던질 수 있습니다. 예를 들어 비교 중에 값이 바뀌거나, a &lt; b이고 b &lt; a를 동시에 돌려줄 때입니다.<\/li>\n<li><strong>비교 기반 정렬의 하한이 O(n log n)인 이유는?<\/strong> 가능한 순서가 n!개이고 비교 한 번은 경우를 둘로만 나누므로, log₂(n!) = Θ(n log n)번 비교가 필요합니다.<\/li>\n<\/ul>"},{"no":30,"t":"퀵 정렬이 최악 O(n²)이 되는 경우와, 실제 라이브러리는 이를 어떻게 피합니까?","a":"<p>피벗이 매번 최솟값이나 최댓값이 되어 분할이 n-1 대 0으로 갈라질 때입니다. 첫 원소나 마지막 원소를 피벗으로 쓰면서 이미 정렬된 입력을 받는 경우, 같은 값이 아주 많은 입력을 두 갈래로만 나누는 경우가 대표적입니다.<\/p>\n<p>대응은 여러 겹입니다. 피벗을 무작위로 고르거나 세 값의 중앙값으로 고르고, 같은 값이 많으면 작음, 같음, 큼 세 갈래로 나눕니다. C++ std::sort 같은 introsort는 재귀 깊이가 약 2 log n을 넘으면 힙 정렬로 바꿔 최악을 O(n log n)으로 막고, 작은 구간은 삽입 정렬로 처리합니다.<\/p>\n<p>그런데도 퀵 정렬을 쓰는 이유는 제자리 정렬이고 순차 접근이라 캐시 효율이 좋아 평균적으로 가장 빠르기 때문입니다. 외부 입력을 정렬하는 서버라면 의도적으로 최악을 만드는 입력 공격도 고려해 무작위 피벗을 씁니다.<\/p>","f":"<ul>\n<li><strong>퀵 정렬의 공간 복잡도는?<\/strong> 재귀 스택이 평균 O(log n)이고, 작은 쪽을 먼저 재귀하고 큰 쪽은 반복문으로 처리하면 최악도 O(log n)입니다.<\/li>\n<li><strong>Dual-Pivot의 장점은?<\/strong> 피벗 두 개로 세 구간을 만들어 비교와 메모리 접근 수를 줄입니다.<\/li>\n<\/ul>"},{"no":31,"t":"병합 정렬은 메모리를 더 쓰는데도 언제 퀵 정렬보다 낫습니까?","a":"<p>최악에도 O(n log n)이 보장되어야 할 때, 안정 정렬이 필요할 때, 데이터에 순차로만 접근할 수 있을 때입니다. 연결 리스트는 임의 접근이 느려 퀵 정렬이 불리하지만 병합 정렬은 포인터만 바꿔 추가 메모리 없이 정렬합니다. 메모리에 다 안 들어가는 데이터를 디스크에서 정렬하는 외부 정렬도 병합 정렬이 기본입니다.<\/p>\n<p>구간을 나눠 독립적으로 정렬하므로 병렬화도 쉽습니다. 단점은 배열에서 O(n) 보조 메모리가 필요하다는 점입니다.<\/p>\n<p>그래서 객체 정렬처럼 안정성이 중요한 곳은 병합 기반 TimSort를, 기본형 배열처럼 안정성이 무의미한 곳은 퀵 정렬 계열을 쓰는 것이 라이브러리들의 선택입니다.<\/p>","f":"<ul>\n<li><strong>연결 리스트에서 중간은 어떻게 찾나요?<\/strong> 한 칸씩 가는 포인터와 두 칸씩 가는 포인터를 함께 움직여, 빠른 쪽이 끝에 닿을 때 느린 쪽이 중간입니다.<\/li>\n<li><strong>배열의 역순 쌍 개수를 세려면?<\/strong> 병합 과정에서 오른쪽 원소가 먼저 내려갈 때 남은 왼쪽 원소 수만큼 더하면 O(n log n)입니다.<\/li>\n<\/ul>"},{"no":32,"t":"TimSort가 실제 데이터에서 빠른 이유는 무엇입니까?","a":"<p>실제 데이터에는 이미 정렬된 구간이 많다는 점을 활용하기 때문입니다. TimSort는 배열을 훑으며 오름차순이나 내림차순으로 이어진 구간(run)을 찾고, 내림차순이면 뒤집고, 너무 짧으면 이진 삽입 정렬로 최소 길이까지 늘린 다음, 이 구간들을 스택에 쌓아 크기 균형 규칙에 따라 병합합니다.<\/p>\n<p>병합 중 한쪽이 연속으로 이기면 갤로핑 모드로 들어가 지수 탐색으로 한꺼번에 건너뜁니다. 그래서 이미 정렬된 입력은 O(n), 일부만 섞인 입력도 매우 빠르고, 최악은 O(n log n)이며 안정적입니다.<\/p>\n<p>Python의 기본 정렬과 Java의 객체 정렬이 TimSort입니다. 목록 끝에 새 항목 몇 개를 붙이고 다시 정렬하는 일이 잦은 앱 코드에서 특히 유리합니다.<\/p>","f":"<ul>\n<li><strong>최소 run 길이는?<\/strong> 보통 32~64 사이로, 병합 횟수가 균형 잡히도록 배열 크기에 따라 정합니다.<\/li>\n<li><strong>작은 구간에 삽입 정렬을 쓰는 이유는?<\/strong> 원소가 적으면 비교와 이동이 적고 캐시에 다 들어가 상수가 작습니다.<\/li>\n<\/ul>"},{"no":33,"t":"10GB 로그 파일을 메모리 1GB로 정렬하려면 어떻게 합니까?","a":"<p>외부 병합 정렬을 씁니다. 첫 단계에서 1GB씩 읽어 메모리에서 정렬한 뒤 파일로 써서 정렬된 조각 10개를 만듭니다. 두 번째 단계에서 10개 파일의 앞부분을 버퍼로 읽고, 최소 힙으로 가장 작은 원소를 골라 결과 파일에 쓰는 k-way 병합을 합니다. 버퍼가 비면 그 파일에서 더 읽습니다.<\/p>\n<p>디스크 입장에서는 전체를 두 번 읽고 두 번 쓰는 순차 I/O라 임의 접근보다 훨씬 빠르고, 비교 비용은 O(N log k)입니다. 조각 수가 너무 많아 버퍼를 나눠 주기 어려우면 여러 단계로 병합합니다.<\/p>\n<p>GNU sort 명령이 이 방식으로 동작하고, 분산 환경에서는 MapReduce의 셔플 단계가 같은 원리입니다. 실무에서는 정렬이 정말 필요한지부터 확인합니다. 상위 N개나 집계만 필요하면 힙이나 해시 집계로 한 번에 끝납니다.<\/p>","f":"<ul>\n<li><strong>버퍼 크기는 어떻게 정하나요?<\/strong> 크게 잡을수록 디스크 탐색이 줄지만 동시에 열 수 있는 조각 수가 줄어 병합 단계가 늘어납니다.<\/li>\n<li><strong>첫 단계 조각을 더 길게 만드는 방법은?<\/strong> 교체 선택(replacement selection)을 쓰면 평균적으로 메모리의 2배 길이 조각이 나옵니다.<\/li>\n<\/ul>"},{"no":34,"t":"이분 탐색을 적용할 수 있는 조건을 정확히 말해 보세요. 구현에서 자주 틀리는 곳은?","a":"<p>조건은 \"정렬\"이라기보다 \"단조성\"입니다. 어떤 조건 f(x)가 한 지점 이후로 계속 참(거짓, 거짓, ..., 참, 참)이면 그 경계를 이분 탐색으로 찾을 수 있습니다. 그래서 배열 탐색뿐 아니라 \"D일 안에 배송하는 최소 트럭 용량\"처럼 답 자체를 이분 탐색하는 매개 변수 탐색(parametric search)이 됩니다. 용량이 크면 항상 가능하다는 단조성이 있기 때문입니다.<\/p>\n<p>자주 틀리는 곳은 세 가지입니다. mid = (lo + hi) / 2가 int 범위를 넘는 오버플로라 lo + (hi - lo) / 2나 (lo + hi) &gt;&gt;&gt; 1을 씁니다. lo &lt; hi와 lo &lt;= hi, hi = mid와 hi = mid - 1의 조합이 어긋나 무한 루프가 납니다. 같은 값이 여러 개일 때 첫 위치(lower bound)인지 마지막 다음 위치(upper bound)인지 정의하지 않습니다.<\/p>\n<p>저는 \"불변식: lo는 항상 거짓, hi는 항상 참\"처럼 루프 불변식을 먼저 정하고 짜는 방식을 씁니다. 그러면 경계 실수가 크게 줄어듭니다.<\/p>","f":"<ul>\n<li><strong>오버플로 버그가 유명해진 계기는?<\/strong> 2006년 Java 표준 라이브러리의 binarySearch에서 이 버그가 발견되어 고쳐졌습니다.<\/li>\n<li><strong>Arrays.binarySearch는 값이 없으면?<\/strong> -(삽입 위치) - 1을 돌려줍니다. 음수면 없다는 뜻이고 삽입 위치도 알 수 있습니다.<\/li>\n<\/ul>"},{"no":35,"t":"가중치 없는 그래프의 최단 경로와 양수 가중치 그래프의 최단 경로에 각각 어떤 알고리즘을 쓰고, 왜 DFS는 안 됩니까?","a":"<p>가중치가 없으면 BFS입니다. BFS는 시작점에서 거리 1, 2, 3 순서로 층을 넓혀 가므로 어떤 정점에 처음 도착한 순간이 최단 거리입니다. O(V+E)입니다. 양수 가중치면 다익스트라, 가중치가 0과 1뿐이면 덱을 쓰는 0-1 BFS, 음수가 있으면 벨만 포드입니다.<\/p>\n<p>DFS는 한 경로를 끝까지 파고들어 먼저 도착한 경로가 짧다는 보장이 없습니다. 모든 경로를 다 보면 구할 수는 있지만 지수 시간이 됩니다.<\/p>\n<p>메모리 면에서 BFS는 한 층의 너비만큼, DFS는 깊이만큼 씁니다. 시작과 끝을 둘 다 알면 양쪽에서 BFS를 해서 만나는 양방향 BFS로 탐색 공간을 크게 줄일 수 있습니다.<\/p>","f":"<ul>\n<li><strong>DFS가 더 맞는 문제는?<\/strong> 경로 존재 여부, 모든 경로 나열, 사이클 탐지, 위상 정렬, 연결 요소 찾기입니다.<\/li>\n<li><strong>BFS에서 방문 표시는 언제 하나요?<\/strong> 큐에 넣을 때 해야 합니다. 꺼낼 때 하면 같은 정점이 큐에 여러 번 들어가 시간과 메모리가 늘어납니다.<\/li>\n<\/ul>"},{"no":36,"t":"다익스트라는 왜 음수 간선에서 동작하지 않습니까? 구현 시 주의점과 실제 지도 서비스의 방식은?","a":"<p>다익스트라는 \"아직 확정되지 않은 정점 중 거리가 가장 짧은 정점은 더 짧아질 수 없으니 확정한다\"는 탐욕적 가정 위에 있습니다. 모든 간선이 양수면 다른 경로를 돌아오면 길어질 뿐이라 맞지만, 음수 간선이 있으면 나중에 돌아오는 경로가 더 짧을 수 있어 이미 확정한 값이 틀립니다. 음수 간선이 있으면 모든 간선을 V-1번 완화하는 벨만 포드(O(VE))를 쓰고, V번째에도 줄어들면 음수 사이클입니다.<\/p>\n<p>구현은 우선순위 큐로 O((V+E) log V)입니다. Java PriorityQueue는 키 감소 연산이 없으니 갱신될 때마다 새로 넣고, 꺼낸 거리가 저장된 거리보다 크면 버리는 지연 삭제를 씁니다.<\/p>\n<p>지도 서비스는 정점이 수천만 개라 그대로 쓰지 않습니다. 목적지까지 직선 거리를 휴리스틱으로 쓰는 A*로 탐색 방향을 좁히고, Contraction Hierarchies처럼 도로망을 미리 계층화해 두는 사전 계산으로 응답을 밀리초 단위로 만듭니다. 실시간 교통 정보는 가중치를 바꾸므로 사전 계산을 다시 하는 비용과의 절충이 핵심입니다.<\/p>","f":"<ul>\n<li><strong>모든 쌍 최단 거리는?<\/strong> 플로이드 워셜로 O(V³)이고, 정점이 수백 개 이하일 때 씁니다.<\/li>\n<li><em><em>A<\/em> 휴리스틱의 조건은?<\/em>* 실제 남은 거리보다 크게 추정하지 않아야(admissible) 최단 경로를 보장합니다.<\/li>\n<\/ul>"},{"no":37,"t":"멀티 모듈 프로젝트에서 빌드 순서를 정하고 순환 의존을 찾으려면 어떤 알고리즘을 씁니까?","a":"<p>모듈을 정점, 의존 관계를 간선으로 둔 방향 그래프에서 위상 정렬을 합니다. Kahn 알고리즘은 들어오는 간선이 없는 정점을 큐에 넣고, 하나씩 꺼내면서 그 정점에서 나가는 간선을 지워 새로 진입 차수가 0이 된 정점을 큐에 넣습니다. 모든 정점을 꺼내지 못하고 끝나면 사이클이 있다는 뜻입니다. O(V+E)입니다.<\/p>\n<p>같은 단계에서 큐에 함께 있는 모듈끼리는 서로 의존하지 않으므로 병렬로 빌드할 수 있습니다. Gradle의 태스크 그래프, 패키지 관리자의 설치 순서, 스프레드시트 수식 재계산이 같은 원리입니다.<\/p>\n<p>순환 의존은 빌드만의 문제가 아니라 설계 문제라서, 찾은 뒤에는 공통 부분을 하위 모듈로 빼거나 인터페이스를 하위 모듈에 두고 구현을 상위에 두는 의존성 역전으로 끊습니다.<\/p>","f":"<ul>\n<li><strong>사이클에 속한 모듈을 정확히 찾으려면?<\/strong> DFS 중 \"방문 중\" 상태인 정점을 다시 만나면 그 사이 경로가 사이클입니다. 모든 사이클 묶음은 강한 연결 요소(Tarjan) 알고리즘으로 찾습니다.<\/li>\n<li><strong>위상 순서가 하나뿐인 조건은?<\/strong> 매 단계 진입 차수 0인 정점이 정확히 하나일 때입니다.<\/li>\n<\/ul>"},{"no":38,"t":"최소 신장 트리를 구하는 크루스칼과 프림은 어떻게 다르고, 언제 무엇을 씁니까?","a":"<p>둘 다 모든 정점을 최소 비용으로 잇는 트리를 탐욕적으로 만듭니다. 크루스칼은 간선을 가중치 순으로 정렬한 뒤 사이클을 만들지 않는 간선만 추가하고, 사이클 확인에 유니온 파인드를 씁니다. O(E log E)라 간선이 적은 희소 그래프에 맞습니다.<\/p>\n<p>프림은 한 정점에서 시작해 현재 트리와 바깥을 잇는 가장 싼 간선을 우선순위 큐로 골라 트리를 키웁니다. O(E log V)이고, 간선이 많은 밀집 그래프에서는 배열 버전이 O(V²)로 더 낫습니다.<\/p>\n<p>탐욕이 맞는 이유는 컷 속성 때문입니다. 정점을 두 묶음으로 나눴을 때 두 묶음을 잇는 가장 싼 간선은 반드시 어떤 최소 신장 트리에 포함됩니다. 쓰임은 네트워크 배선 최소화와, 가장 긴 간선 몇 개를 끊어 묶음을 나누는 클러스터링입니다.<\/p>","f":"<ul>\n<li><strong>최단 경로 트리와 최소 신장 트리는 같은가요?<\/strong> 아닙니다. 최단 경로 트리는 한 출발점에서 각 정점까지 거리를, 최소 신장 트리는 간선 합 전체를 최소화합니다.<\/li>\n<li><strong>최소 신장 트리가 유일한 조건은?<\/strong> 간선 가중치가 모두 다르면 유일합니다.<\/li>\n<\/ul>"},{"no":39,"t":"동적 계획법을 처음 듣는 사람에게 설명하고, 메모이제이션과 타뷸레이션 중 무엇을 고를지 말해 보세요.","a":"<p>큰 문제를 작은 문제로 나눴을 때 같은 작은 문제가 반복해서 나오면, 한 번 푼 답을 저장해 두고 다시 쓰는 방법입니다. 쓸 수 있는 조건은 두 가지로, 같은 하위 문제가 반복되고(중복 하위 문제), 하위 문제의 최적 답을 모으면 전체 최적 답이 된다는 것(최적 부분 구조)입니다. 피보나치를 단순 재귀로 풀면 f(n-2)를 여러 번 다시 계산해 지수 시간이지만, 저장하면 O(n)입니다.<\/p>\n<p>메모이제이션은 재귀 그대로 두고 결과를 캐시하는 위에서 아래 방식이라 점화식을 그대로 옮기기 쉽고 필요한 하위 문제만 계산합니다. 대신 재귀 깊이 제한과 호출 비용이 있습니다. 타뷸레이션은 작은 문제부터 표를 채우는 아래에서 위 방식이라 스택 문제가 없고 빠르며, 이전 몇 행만 남겨 메모리를 줄이기 쉽습니다.<\/p>\n<p>저는 먼저 상태 정의와 점화식을 말로 세우고, 상태 공간이 듬성듬성하면 메모이제이션, 다 채워야 하면 타뷸레이션을 고릅니다. 면접에서도 \"상태가 무엇이고, 전이가 무엇이고, 초기값이 무엇인지\"를 먼저 말하면 구조가 분명해집니다.<\/p>","f":"<ul>\n<li><strong>대표 문제는?<\/strong> 계단 오르기, 최장 증가 부분 수열, 최장 공통 부분 수열, 편집 거리, 배낭 문제입니다.<\/li>\n<li><strong>DP의 시간복잡도는 어떻게 계산하나요?<\/strong> 상태 수 × 상태 하나의 전이 비용입니다.<\/li>\n<\/ul>"},{"no":40,"t":"분할 정복과 동적 계획법의 차이는 무엇입니까?","a":"<p>둘 다 문제를 작은 문제로 나누지만, 나눈 작은 문제들이 서로 겹치느냐가 다릅니다. 분할 정복은 하위 문제가 서로 독립이라 결과를 저장할 이유가 없습니다. 병합 정렬은 왼쪽 절반과 오른쪽 절반을 따로 정렬하고 합칠 뿐 같은 구간을 두 번 정렬하지 않습니다.<\/p>\n<p>동적 계획법은 같은 하위 문제가 여러 번 나오므로 저장해서 재사용하는 것이 핵심입니다. 피보나치에서 f(5)를 구하려면 f(4)와 f(3)이 필요하고 f(4)도 f(3)을 다시 부릅니다.<\/p>\n<p>정리하면 분할 정복의 대표는 병합 정렬, 퀵 정렬, 이진 탐색이고, 동적 계획법의 대표는 최단 경로, 배낭, 편집 거리입니다. 분할 정복에 메모이제이션을 붙였는데 캐시 적중이 거의 없다면 애초에 하위 문제가 겹치지 않는 문제라는 신호입니다.<\/p>","f":"<ul>\n<li><strong>분할 정복의 세 단계는?<\/strong> 분할, 정복(재귀로 풀기), 결합입니다.<\/li>\n<li><strong>분할 정복 시간은 무엇으로 계산하나요?<\/strong> 마스터 정리로 계산합니다(49번).<\/li>\n<\/ul>"},{"no":41,"t":"탐욕 알고리즘이 최적해를 보장하는 조건은 무엇이고, 실패하는 반례를 들어 보세요.","a":"<p>각 단계의 최선 선택이 전체 최적해의 일부가 된다는 탐욕 선택 속성과, 남은 문제의 최적해가 전체 최적해를 이룬다는 최적 부분 구조가 있어야 합니다. 이 둘을 증명하지 못하면 탐욕은 그럴듯한 오답이 되기 쉽습니다.<\/p>\n<p>반례로 동전 종류가 1, 3, 4원일 때 6원을 거슬러 주면, 탐욕은 4+1+1로 3개지만 최적은 3+3으로 2개입니다. 우리나라 동전 10, 50, 100, 500원은 큰 동전이 작은 동전의 조합으로 대체되는 구조라 탐욕이 맞습니다.<\/p>\n<p>탐욕이 맞는 예는 끝나는 시각 순으로 고르는 회의실 배정, 허프만 부호, 다익스트라, 최소 신장 트리입니다. 증명은 보통 \"최적해에 탐욕 선택이 없다면 바꿔 넣어도 나빠지지 않는다\"는 교환 논증으로 합니다. 면접에서는 탐욕을 떠올리면 반례부터 찾아보는 태도를 보여 주는 것이 좋습니다.<\/p>","f":"<ul>\n<li><strong>회의실 배정을 시작 시각 순으로 고르면?<\/strong> 아주 이른 시각에 시작해 하루 종일 걸리는 회의 하나가 다른 회의를 모두 막는 반례가 있습니다.<\/li>\n<li><strong>탐욕이 틀릴 때 대안은?<\/strong> 동적 계획법이나 완전 탐색입니다.<\/li>\n<\/ul>"},{"no":42,"t":"두 문자열의 편집 거리를 구하는 방법과, 이것이 diff 도구나 목록 갱신과 어떻게 연결되는지 설명해 보세요.","a":"<p>dp[i][j]를 첫 문자열 앞 i글자를 둘째 문자열 앞 j글자로 바꾸는 최소 편집 수로 정의합니다. 두 글자가 같으면 dp[i-1][j-1], 다르면 1 + min(삽입, 삭제, 교체에 해당하는 세 칸)입니다. 시간 O(nm)이고, 이전 행만 있으면 되므로 메모리는 O(min(n, m))으로 줄일 수 있습니다. 최장 공통 부분 수열도 같은 표 구조입니다.<\/p>\n<p>diff 도구는 \"두 줄 목록의 최장 공통 부분 수열을 찾고 나머지를 삽입과 삭제로 표시하는\" 문제를 풉니다. 입력이 크면 O(nm) 표는 너무 크므로, 차이 개수 D에 비례하는 Myers 알고리즘(O(ND))을 씁니다. git diff의 기본 알고리즘이고, Android의 DiffUtil도 Myers 방식으로 목록 사이의 최소 변경을 계산해 바뀐 항목만 갱신합니다.<\/p>\n<p>그래서 목록이 크고 차이가 많으면 계산이 무거워져 메인 스레드에서 돌리면 프레임이 끊깁니다. 백그라운드에서 계산하는 AsyncListDiffer나 ListAdapter를 씁니다.<\/p>","f":"<ul>\n<li><strong>편집 경로까지 복원하려면?<\/strong> 전체 표를 남기고 거꾸로 따라가거나, 메모리를 아끼려면 Hirschberg 알고리즘을 씁니다.<\/li>\n<li><strong>검색어 오타 교정에는?<\/strong> 사전 단어와의 편집 거리를 쓰되, 전체 비교는 비싸서 BK 트리나 n-gram 색인으로 후보를 좁힙니다.<\/li>\n<\/ul>"},{"no":43,"t":"0/1 배낭 문제는 어떻게 풀고, 왜 다항 시간이라고 하지 않습니까?","a":"<p>dp[w]를 무게 w 이하로 얻는 최대 가치로 두고, 물건마다 w를 큰 값부터 작은 값으로 내려가며 dp[w] = max(dp[w], dp[w - 무게] + 가치)로 갱신합니다. 시간 O(nW), 메모리 O(W)입니다. 큰 쪽부터 도는 이유는 같은 물건을 두 번 쓰지 않기 위해서입니다. 작은 쪽부터 돌면 물건을 무한히 쓸 수 있는 무한 배낭 문제가 됩니다.<\/p>\n<p>O(nW)는 다항처럼 보이지만 W는 입력의 크기가 아니라 값입니다. W를 표현하는 비트 수가 b면 W는 2ᵇ라서 입력 크기에 대해 지수 시간이고, 이를 의사 다항 시간이라고 합니다. 0/1 배낭은 NP-hard입니다.<\/p>\n<p>물건을 쪼갤 수 있으면 가치 대비 무게 비율 순으로 담는 탐욕으로 풀립니다. 실무에서 W가 너무 크면 가치 기준 DP, 근사 알고리즘, 정수 계획 솔버를 씁니다.<\/p>","f":"<ul>\n<li><strong>선택한 물건 목록까지 알려면?<\/strong> 2차원 표를 남기고 마지막 칸에서 거꾸로 따라갑니다.<\/li>\n<li><strong>물건이 아주 많고 W가 작으면?<\/strong> 그대로 O(nW)라 충분히 빠릅니다.<\/li>\n<\/ul>"},{"no":44,"t":"투 포인터와 슬라이딩 윈도우는 어떤 조건에서 쓸 수 있고, 언제 깨집니까?","a":"<p>포인터를 한 방향으로만 움직여도 답을 놓치지 않는다는 단조성이 있을 때 씁니다. 정렬된 배열에서 합이 X인 쌍을 찾을 때 양 끝에서 시작해 합이 크면 오른쪽을, 작으면 왼쪽을 옮기면 O(n)입니다. 양수 배열에서 합이 S 이상인 가장 짧은 연속 구간은 오른쪽을 늘리다 조건을 만족하면 왼쪽을 줄이는 윈도우로 O(n)입니다.<\/p>\n<p>음수가 섞이면 윈도우를 늘린다고 합이 커진다는 단조성이 깨져 이 방식이 틀립니다. 그때는 누적 합과 해시맵(합이 K인 부분 배열 개수)이나 다른 방법을 씁니다.<\/p>\n<p>실무에서는 최근 1분 요청 수 같은 슬라이딩 윈도우 집계, 프레임 시간의 이동 평균에 같은 생각을 씁니다.<\/p>","f":"<ul>\n<li><strong>중복 문자 없는 가장 긴 부분 문자열은?<\/strong> 윈도우와 문자별 마지막 위치 맵으로 O(n)에 풉니다.<\/li>\n<li><strong>크기 k 윈도우의 최댓값을 모두 구하려면?<\/strong> 값이 감소하는 인덱스를 담은 단조 덱으로 O(n)입니다.<\/li>\n<\/ul>"},{"no":45,"t":"백트래킹은 완전 탐색과 무엇이 다르고, 성능을 어떻게 끌어올립니까?","a":"<p>백트래킹은 완전 탐색을 상태 공간 트리의 DFS로 하면서, 더 진행해도 답이 될 수 없는 가지를 일찍 잘라내는 방법입니다. 선택하고, 재귀로 들어가고, 돌아와서 선택을 되돌리는 구조라 상태 복원을 정확히 하는 것이 구현의 핵심입니다. N-Queen, 스도쿠, 순열과 조합, 부분집합 합이 대표 문제입니다.<\/p>\n<p>최악은 여전히 지수 시간이지만 실제 성능은 가지치기에 달려 있습니다. 제약이 강한 변수부터 정하기, 남은 값으로 목표에 도달할 수 있는지 미리 확인하기, 중복 상태를 건너뛰기가 효과가 큽니다. 최적화 문제에서는 지금까지 찾은 최선보다 나아질 수 없는 가지를 자르는 분기 한정법을 씁니다.<\/p>\n<p>같은 상태가 반복해서 나타나면 결과를 저장해 동적 계획법으로 바꿀 수 있는지도 봅니다.<\/p>","f":"<ul>\n<li><strong>중복 원소가 있는 배열의 순열에서 중복 결과를 없애려면?<\/strong> 정렬한 뒤 같은 깊이에서 직전과 같은 값이고 직전 값을 쓰지 않았다면 건너뜁니다.<\/li>\n<li><strong>N-Queen 충돌 확인을 O(1)로 하려면?<\/strong> 열, 두 대각선(r+c, r-c) 사용 여부를 배열로 둡니다.<\/li>\n<\/ul>"},{"no":46,"t":"문자열에서 패턴을 찾는 단순 방법과 KMP의 차이는 무엇이고, 금칙어 수천 개를 걸러야 하면 어떻게 합니까?","a":"<p>단순 방법은 위치마다 패턴을 처음부터 비교해 최악 O(nm)입니다. KMP는 패턴에서 \"접두사이면서 접미사인 가장 긴 길이\" 표(실패 함수)를 미리 만들어, 불일치가 나면 이미 맞춘 부분을 버리지 않고 표가 알려 주는 위치부터 이어서 비교합니다. 본문 포인터가 뒤로 가지 않아 O(n+m)입니다.<\/p>\n<p>라빈 카프는 롤링 해시로 윈도우 해시를 O(1)에 갱신하며 비교하고, 해시가 같을 때만 실제 문자열을 비교합니다. 여러 패턴이나 표절 검사에 씁니다.<\/p>\n<p>금칙어 수천 개는 패턴마다 검색하면 느리므로 아호 코라식을 씁니다. 금칙어 전체로 트라이를 만들고 KMP의 실패 링크를 트라이에 붙여, 본문을 한 번 훑으며 모든 금칙어를 O(n + 매칭 수)에 찾습니다. 실제 서비스에서는 띄어쓰기나 특수문자를 끼운 우회 입력을 정규화하는 전처리가 더 어렵습니다. 참고로 언어 기본 indexOf는 짧은 패턴에서 단순 방식이 상수가 작아 충분히 빠릅니다.<\/p>","f":"<ul>\n<li><strong>롤링 해시 충돌은 어떻게 다루나요?<\/strong> 모듈러를 두 개 쓰거나, 해시가 같으면 실제 비교로 확인합니다.<\/li>\n<li><strong>실패 함수 계산 복잡도는?<\/strong> 패턴 길이에 대해 O(m)입니다.<\/li>\n<\/ul>"},{"no":47,"t":"정렬되지 않은 배열에서 합이 K인 두 수를 찾는 방법들을 비교해 보세요.","a":"<p>세 가지가 있습니다. 이중 반복문은 O(n²)에 메모리 O(1)입니다. 정렬한 뒤 투 포인터는 O(n log n)에 제자리 정렬이면 추가 메모리가 거의 없지만, 원래 인덱스를 잃습니다. 해시셋에 지나온 값을 넣으면서 K - x가 있는지 보면 O(n)에 메모리 O(n)입니다.<\/p>\n<p>무엇을 고를지는 제약으로 정합니다. 원래 인덱스가 필요하면 해시나 (값, 인덱스) 쌍 정렬, 메모리가 빠듯하면 정렬, 데이터가 스트림으로 들어오면 해시, 이미 정렬되어 있으면 투 포인터입니다. 같은 값을 두 번 쓰면 안 되는지, 답이 여러 개면 모두 필요한지도 확인합니다.<\/p>\n<p>세 수의 합은 정렬 후 하나를 고정하고 나머지를 투 포인터로 찾아 O(n²)입니다. 면접에서는 바로 코드를 쓰기보다 이런 제약을 먼저 묻는 것이 시니어다운 접근입니다.<\/p>","f":"<ul>\n<li><strong>배열이 메모리에 안 들어가면?<\/strong> 값 범위로 파일을 나누되 x와 K - x가 들어갈 구간 쌍을 함께 보거나, 외부 정렬 뒤 투 포인터를 씁니다.<\/li>\n<li><strong>해시 방식에서 같은 원소를 두 번 쓰지 않으려면?<\/strong> 확인을 먼저 하고 넣는 순서로 지나온 값과만 비교합니다.<\/li>\n<\/ul>"},{"no":48,"t":"P, NP, NP-완전을 설명하고, 실무에서 NP-hard 문제를 만나면 어떻게 합니까?","a":"<p>P는 다항 시간에 풀 수 있는 문제, NP는 답이 주어지면 다항 시간에 맞는지 검증할 수 있는 문제입니다. NP-완전은 NP에 속하면서 모든 NP 문제를 다항 시간에 변환해 올 수 있는 가장 어려운 문제들이고, 하나라도 다항 시간에 풀면 NP 전체가 풀립니다. NP-hard는 NP-완전만큼 어렵지만 NP에 속하지 않을 수도 있는 문제입니다. SAT, 외판원 문제의 결정형, 그래프 색칠, 0/1 배낭이 예입니다.<\/p>\n<p>실무에서 배달 경로 최적화나 일정 배치처럼 NP-hard를 만나면 정확한 최적해를 포기하는 것부터 받아들입니다. 입력이 작으면 비트마스크 DP나 가지치기 완전 탐색, 일정 비율 이내를 보장하는 근사 알고리즘, 탐욕과 지역 탐색, 시뮬레이티드 어닐링 같은 휴리스틱, 문제 제약을 좁혀 쉬운 특수 경우로 만들기, OR-Tools나 정수 계획, SAT 솔버 활용이 선택지입니다.<\/p>\n<p>판단 기준은 최적해와의 차이가 비즈니스에 얼마나 중요한지, 응답 시간 제한이 얼마인지입니다.<\/p>","f":"<ul>\n<li><strong>P = NP라면 무엇이 문제가 되나요?<\/strong> 현재 공개키 암호가 기대는 문제들도 효율적으로 풀릴 가능성이 생깁니다.<\/li>\n<li><strong>외판원 문제 비트마스크 DP 복잡도는?<\/strong> O(n² 2ⁿ)이라 n이 20 안팎까지 현실적입니다.<\/li>\n<\/ul>"},{"no":49,"t":"재귀 알고리즘의 시간복잡도는 어떻게 계산합니까? 병합 정렬과 이진 탐색으로 설명해 보세요.","a":"<p>점화식 T(n) = aT(n/b) + f(n)으로 세우고 마스터 정리를 씁니다. a는 하위 문제 수, n/b는 하위 문제 크기, f(n)은 나누고 합치는 비용입니다. 직관적으로는 재귀 트리를 그려 층마다 비용을 더합니다. 잎 쪽 비용 n^(log_b a)와 f(n) 중 큰 쪽이 전체를 지배하고, 같으면 log n이 곱해집니다.<\/p>\n<p>병합 정렬은 T(n) = 2T(n/2) + n입니다. 층마다 합치는 비용이 n이고 층이 log n개라 O(n log n)입니다. 이진 탐색은 T(n) = T(n/2) + 1이라 O(log n)입니다. 카라츠바 곱셈은 3T(n/2) + n이라 O(n^log₂3), 약 n^1.58입니다.<\/p>\n<p>마스터 정리는 크기가 일정 비율로 줄 때만 적용됩니다. T(n) = T(n-1) + n처럼 하나씩 줄면 O(n²)으로 직접 풀어야 하고, 퀵 정렬 최악이 이 형태입니다.<\/p>","f":"<ul>\n<li><strong>피보나치 단순 재귀는?<\/strong> T(n) = T(n-1) + T(n-2) + 1이라 약 O(1.618ⁿ)입니다.<\/li>\n<li><strong>공간 복잡도는?<\/strong> 재귀 깊이 × 프레임 크기에 추가 할당을 더합니다. 병합 정렬은 O(n), 이진 탐색 재귀는 O(log n)입니다.<\/li>\n<\/ul>"},{"no":50,"t":"손실 압축과 무손실 압축의 원리를 설명하고, PNG, JPEG, WebP를 언제 쓰는지 말해 보세요.","a":"<p>무손실 압축은 원본을 비트 하나 틀리지 않고 복원합니다. 반복되는 패턴을 \"앞의 어디서 몇 글자\"로 바꾸는 LZ77 계열과, 자주 나오는 기호에 짧은 부호를 주는 허프만 부호를 조합한 것이 DEFLATE로, zip, gzip, PNG가 씁니다. 손실 압축은 사람이 덜 민감한 정보를 버립니다. JPEG은 색을 밝기와 색차로 나눠 색차 해상도를 낮추고, 8×8 블록을 DCT로 주파수로 바꾼 뒤 고주파를 거칠게 양자화합니다. 손실은 이 양자화에서 생깁니다.<\/p>\n<p>PNG는 무손실에 알파 채널로 투명을 지원해 아이콘, 로고, 스크린샷, 글자가 많은 이미지에 맞고 사진에는 용량이 큽니다. JPEG은 사진에 맞지만 투명을 지원하지 않고, 다시 저장할 때마다 양자화가 반복되어 화질이 떨어집니다. WebP는 손실과 무손실, 투명을 모두 지원해 같은 화질에 더 작고, AVIF는 그보다 더 효율적이지만 인코딩이 무겁습니다.<\/p>\n<p>모바일 앱에서는 아이콘은 벡터, 사진은 WebP나 AVIF, 서버 응답 텍스트는 gzip이나 Brotli를 씁니다. 이미 압축된 이미지를 다시 gzip해도 거의 줄지 않습니다.<\/p>","f":"<ul>\n<li><strong>허프만 부호가 접두사 부호여야 하는 이유는?<\/strong> 어떤 부호도 다른 부호의 앞부분이 아니어야 구분자 없이 바로 해석됩니다.<\/li>\n<li><strong>압축률과 속도는 어떻게 고르나요?<\/strong> 정적 리소스는 빌드 때 최고 압축으로 한 번, 동적 응답은 빠른 압축 수준을 씁니다.<\/li>\n<\/ul>"},{"no":51,"t":"배열을 섞는 셔플 알고리즘을 직접 짜면 흔히 어떤 편향이 생기고, 올바른 방법은?","a":"<p>올바른 방법은 Fisher-Yates입니다. 뒤에서부터 i번째 원소를 0부터 i 사이에서 무작위로 고른 원소와 바꿉니다. O(n)이고 모든 순열이 정확히 같은 확률로 나옵니다. Collections.shuffle과 Kotlin shuffled가 이 방식입니다.<\/p>\n<p>흔한 실수는 매번 0부터 n-1 전체에서 바꿀 위치를 고르는 것입니다. 경우의 수가 nⁿ인데 순열은 n!개라 nⁿ이 n!로 나눠떨어지지 않아 어떤 순열은 더 자주 나옵니다. sortedBy { Random.nextDouble() }도 정렬 알고리즘에 따라 편향이 생기고, 비교 결과가 매번 바뀌면 비교자 계약 위반이 됩니다.<\/p>\n<p>끝을 모르는 스트림에서 k개를 고르게 뽑으려면 저수지 샘플링을 씁니다. 처음 k개를 담고, i번째 원소는 k/i 확률로 담긴 것 중 하나와 바꿉니다. 경품 추첨처럼 결과를 예측할 수 없어야 하면 일반 Random이 아니라 SecureRandom을 씁니다.<\/p>","f":"<ul>\n<li><strong>저수지 샘플링이 균등한 이유는?<\/strong> 각 원소가 마지막까지 남을 확률을 곱해 보면 모두 k/n이 됩니다.<\/li>\n<li><strong>셔플 결과를 테스트하려면?<\/strong> 작은 배열을 많이 섞어 각 순열 빈도를 세고 카이제곱 검정으로 균등성을 봅니다.<\/li>\n<\/ul>"},{"no":52,"t":"API 요청 수를 제한하는 레이트 리밋 알고리즘을 비교하고, 클라이언트에서 같은 문제를 어떻게 다룹니까?","a":"<p>고정 윈도우는 1분 단위 카운터라 단순하지만 경계 직전과 직후에 몰리면 순간적으로 두 배가 들어옵니다. 슬라이딩 윈도우 로그는 요청 시각을 모두 저장해 정확하지만 메모리가 듭니다. 슬라이딩 윈도우 카운터는 이전 윈도우와 현재 윈도우 카운터를 비율로 섞어 근사합니다. 토큰 버킷은 일정 속도로 토큰이 차고 요청마다 하나씩 쓰는 방식으로, 짧은 버스트는 허용하면서 평균 속도를 제한해 가장 널리 쓰입니다. 리키 버킷은 처리 속도를 일정하게 고정합니다.<\/p>\n<p>서버가 여러 대면 카운터를 Redis에 두고 원자 연산이나 Lua 스크립트로 갱신합니다. 제한에 걸리면 429와 Retry-After를 돌려줍니다.<\/p>\n<p>클라이언트에서는 검색창처럼 입력이 멈춘 뒤 한 번 보내는 디바운스, 스크롤 이벤트처럼 일정 간격에 한 번만 처리하는 스로틀, 결제 버튼처럼 처리 중 재클릭을 막는 중복 방지로 서버 부하와 중복 요청을 줄입니다. 429를 받으면 Retry-After를 지키고 지수 백오프로 재시도합니다.<\/p>","f":"<ul>\n<li><strong>토큰 버킷에 타이머가 필요한가요?<\/strong> 필요 없습니다. 마지막 갱신 시각과 지금 시각의 차이로 채워질 토큰 수를 요청 때 계산합니다.<\/li>\n<li><strong>디바운스와 스로틀을 하나씩 예로 들면?<\/strong> 디바운스는 검색어 자동완성, 스로틀은 스크롤 위치에 따른 로그 전송입니다.<\/li>\n<\/ul>"},{"no":53,"t":"\"내 주변 1km 안의 매장\"을 빠르게 찾으려면 어떤 알고리즘과 인덱스를 씁니까?","a":"<p>위도와 경도 컬럼에 각각 인덱스를 걸면 한 축의 범위만 좁혀져 비효율적입니다. 2차원 공간을 위한 인덱스가 필요합니다.<\/p>\n<p>지오해시는 위도와 경도 비트를 번갈아 섞어 2차원을 Z 모양 곡선의 1차원 문자열로 바꿉니다. 접두사가 같으면 같은 칸이라 일반 B+트리 인덱스로 접두사 검색을 할 수 있습니다. 칸 경계 바로 옆 매장을 놓치지 않으려면 주변 8칸을 함께 조회합니다. 쿼드트리는 공간을 4등분하되 매장이 많은 곳만 더 깊게 나눠 밀도 차이에 강합니다. R-트리는 객체를 감싸는 사각형을 계층으로 묶어 PostGIS와 SQLite R*Tree 모듈이 씁니다. 구글 S2와 우버 H3(육각형 격자)도 같은 목적입니다.<\/p>\n<p>어느 방식이든 인덱스로 후보를 좁힌 뒤 하버사인 공식으로 실제 거리를 계산해 1km 밖을 거르고 정렬합니다. 지도 앱의 마커 클러스터링도 같은 격자나 쿼드트리 생각으로 화면 확대 수준에 맞게 묶습니다.<\/p>","f":"<ul>\n<li><strong>지오해시의 약점은?<\/strong> Z 곡선이 꺾이는 곳에서 가까운 두 점의 문자열이 크게 다를 수 있어 이웃 칸 조회가 필수입니다.<\/li>\n<li><strong>위도에 따라 경도 1도의 거리가 다른 문제는?<\/strong> 위도가 높을수록 경도 1도가 짧아지므로 사각형 범위를 계산할 때 cos(위도)로 보정합니다.<\/li>\n<\/ul>"}]},{"no":3,"title":"운영체제","qs":[{"no":54,"t":"프로세스와 스레드의 차이를 메모리 관점에서 설명하고, 한 스레드의 크래시가 다른 스레드에 어떤 영향을 주는지 말해 보세요.","a":"<p>프로세스는 독립된 가상 주소 공간과 파일 디스크립터 같은 자원을 가진 자원 할당 단위이고, 스레드는 프로세스 안의 실행 흐름입니다. 스레드는 자기 스택과 레지스터(프로그램 카운터 포함)만 따로 갖고, 코드, 데이터, 힙, 열린 파일은 같은 프로세스의 다른 스레드와 공유합니다.<\/p>\n<p>그래서 스레드는 만들고 전환하는 비용이 싸고 공유 메모리로 쉽게 데이터를 주고받지만, 그 대가로 동기화가 필요하고 격리가 없습니다. 네이티브 코드의 잘못된 메모리 접근은 프로세스 전체를 죽입니다. 처리되지 않은 Java 예외는 일반 JVM에서는 그 스레드만 끝나고 스택 트레이스가 찍히지만, Android는 기본 예외 처리기가 프로세스를 종료시킵니다. 백그라운드 스레드 예외 하나로 앱 전체가 크래시 나는 이유입니다.<\/p>\n<p>격리가 필요하면 프로세스를 나눕니다. 크롬이 탭과 사이트별로 프로세스를 나누고, WebView 렌더러가 별도 프로세스에서 도는 것이 그런 선택입니다.<\/p>","f":"<ul>\n<li><strong>스레드가 공유하지 않는 것은?<\/strong> 스택, 레지스터, 스레드 로컬 저장소입니다.<\/li>\n<li><strong>다른 스레드의 예외를 메인 스레드에서 잡을 수 있나요?<\/strong> 자동으로 전파되지 않습니다. UncaughtExceptionHandler를 두거나, 코루틴처럼 구조화된 동시성으로 부모에게 전파되게 설계합니다.<\/li>\n<\/ul>"},{"no":55,"t":"앱 일부를 별도 프로세스로 나누면 무엇을 얻고 무엇을 잃습니까?","a":"<p>얻는 것은 장애 격리, 보안 샌드박스, 별도 메모리 한도입니다. 무거운 렌더러나 신뢰할 수 없는 콘텐츠를 다루는 부분이 죽어도 본체는 살아 있습니다.<\/p>\n<p>잃는 것이 더 자주 문제입니다. 프로세스마다 런타임과 라이브러리가 따로 올라가 메모리가 늘고, Android에서는 Application.onCreate가 프로세스마다 다시 실행되어 초기화가 중복됩니다. 싱글턴과 static 변수가 프로세스마다 따로 존재해 \"같은 객체\"라고 믿은 상태가 갈라지고, SharedPreferences처럼 멀티 프로세스를 보장하지 않는 저장소는 값이 어긋납니다. 프로세스 간 통신은 직렬화와 IPC 비용이 듭니다.<\/p>\n<p>그래서 기본은 단일 프로세스와 스레드이고, 격리가 꼭 필요한 부분만 나눕니다. 나눌 때는 Application 초기화를 프로세스 이름으로 분기하고, 공유 데이터는 ContentProvider나 Binder 서비스처럼 프로세스 경계를 고려한 통로로만 주고받습니다.<\/p>","f":"<ul>\n<li><strong>크롬이 사이트별로 프로세스를 나누는 보안상 이유는?<\/strong> Spectre 같은 사이드 채널 공격으로 같은 프로세스 메모리를 읽는 것을 막기 위해서입니다(Site Isolation).<\/li>\n<li><strong>현재 프로세스 이름은 어떻게 확인하나요?<\/strong> API 28 이상은 Application.getProcessName()을 씁니다.<\/li>\n<\/ul>"},{"no":56,"t":"컨텍스트 스위칭의 비용은 정확히 무엇이고, 프로세스 전환과 스레드 전환은 왜 비용이 다릅니까?","a":"<p>직접 비용은 커널 진입, 현재 레지스터와 프로그램 카운터를 저장하고 다음 작업의 것을 복원하는 일, 스케줄러 실행으로 마이크로초 단위입니다. 더 큰 것은 간접 비용입니다. 새 작업이 쓰는 데이터와 주소 변환이 CPU 캐시와 TLB에 없어서 한동안 캐시 미스가 이어집니다.<\/p>\n<p>프로세스 전환은 주소 공간이 바뀌므로 페이지 테이블을 바꾸고 TLB 항목이 쓸모없어집니다. ASID나 PCID로 프로세스별 항목을 구분해 비우지 않게 완화합니다. 스레드 전환은 같은 주소 공간이라 이 비용이 없어 상대적으로 쌉니다.<\/p>\n<p>그래서 요청마다 스레드를 두고 블로킹 I/O로 기다리는 모델은 동시 연결이 수만 개가 되면 전환과 스택 메모리 비용으로 무너지고, 이벤트 루프나 코루틴처럼 커널 개입 없이 사용자 공간에서 전환하는 방식이 나왔습니다. 측정은 리눅스에서 vmstat의 cs 값이나 perf, Android에서는 Perfetto로 스레드가 실행 중인지 대기 중인지 봅니다.<\/p>","f":"<ul>\n<li><strong>코루틴 전환이 싼 이유는?<\/strong> 커널을 거치지 않고, 저장할 상태가 지역 변수 몇 개를 담은 객체뿐이기 때문입니다.<\/li>\n<li><strong>스레드를 너무 많이 만들면?<\/strong> 스레드마다 스택 메모리가 들고, 스케줄링 비용과 락 경쟁이 늘어 처리량이 오히려 떨어집니다.<\/li>\n<\/ul>"},{"no":57,"t":"프로세스 상태 전이를 설명하고, 좀비 프로세스와 고아 프로세스는 무엇입니까?","a":"<p>생성, 준비, 실행, 대기, 종료 다섯 상태가 기본입니다. 준비 상태는 CPU만 주면 실행할 수 있는 상태이고, 대기 상태는 I/O 완료 같은 이벤트를 기다리는 상태입니다. 스케줄러가 고르면 준비에서 실행으로, 타임 슬라이스를 다 쓰면 실행에서 준비로, I/O를 요청하면 실행에서 대기로, I/O가 끝나면 대기에서 준비로 갑니다. 이 정보를 PCB(프로세스 ID, 상태, 레지스터, 페이지 테이블, 열린 파일, 스케줄링 정보)에 저장합니다.<\/p>\n<p>좀비는 이미 종료했지만 부모가 종료 상태를 거둬 가지(wait) 않아 프로세스 테이블 항목만 남은 상태입니다. 쌓이면 PID가 고갈되니 부모가 wait을 부르거나 SIGCHLD를 처리해야 합니다. 고아는 부모가 먼저 죽은 프로세스로, init(또는 지정된 프로세스)이 입양해 대신 거둬 줍니다.<\/p>\n<p>Android의 ANR은 이 관점에서 메인 스레드가 오래 대기 상태(락, I/O, Binder 호출)이거나 실행 중이어도 너무 바빠 입력 이벤트를 5초 안에 처리하지 못한 상황입니다.<\/p>","f":"<ul>\n<li><strong>준비 상태 프로세스가 많다는 것은?<\/strong> CPU가 부족하다는 뜻으로, 리눅스 load average에 반영됩니다.<\/li>\n<li><strong>ANR 원인을 어떻게 찾나요?<\/strong> ANR 시점 스레드 덤프에서 메인 스레드의 상태와 무엇을 기다리는지 봅니다.<\/li>\n<\/ul>"},{"no":58,"t":"CPU 스케줄링 알고리즘을 비교하고, 모바일 OS는 무엇을 더 고려합니까?","a":"<p>스케줄링은 처리량, 응답 시간, 공정성이 서로 부딪히는 문제입니다. FCFS는 단순하지만 긴 작업 뒤에 짧은 작업이 줄 서는 호위 효과가 있습니다. SJF는 평균 대기 시간이 최소지만 실행 시간을 미리 알아야 하고 긴 작업이 굶습니다. 라운드 로빈은 타임 슬라이스로 돌아가며 실행해 응답성이 좋지만, 슬라이스가 너무 짧으면 전환 비용이, 너무 길면 FCFS와 같아집니다. MLFQ는 CPU를 오래 쓰는 작업은 낮은 큐로 내리고 I/O 위주 작업은 높은 큐에 두어 대화형 작업을 우대합니다.<\/p>\n<p>리눅스는 오랫동안 CFS(가상 실행 시간이 가장 적은 작업 먼저, 레드블랙 트리로 관리)를 썼고, 6.6 커널부터 EEVDF로 바뀌었습니다.<\/p>\n<p>모바일은 에너지가 추가 목표입니다. 성능 코어와 효율 코어가 섞인 이종 코어 구조라 작업을 어느 코어에 둘지 전력까지 계산하고, Android는 전경 앱과 백그라운드 앱을 cgroup으로 나눠 CPU 몫을 다르게 주며 UI 스레드와 렌더 스레드에 높은 우선순위를 줍니다. 앱 개발자는 백그라운드 작업 스레드의 우선순위를 낮춰 UI와 경쟁하지 않게 합니다.<\/p>","f":"<ul>\n<li><strong>선점형과 비선점형의 차이는?<\/strong> 선점형은 OS가 실행 중인 작업을 강제로 멈추고 다른 작업을 실행할 수 있습니다. 현대 범용 OS는 선점형입니다.<\/li>\n<li><strong>응답성과 처리량이 부딪히는 예는?<\/strong> 슬라이스를 짧게 하면 반응은 빨라지지만 전환이 늘어 전체 처리량이 줄어듭니다.<\/li>\n<\/ul>"},{"no":59,"t":"기아와 우선순위 역전은 무엇이고, 각각 어떻게 해결합니까?","a":"<p>기아는 우선순위가 낮은 작업이 계속 밀려 실행되지 못하는 상태입니다. 기다린 시간만큼 우선순위를 올리는 에이징으로 해결합니다.<\/p>\n<p>우선순위 역전은 낮은 우선순위 작업 L이 락을 쥐고 있고, 높은 작업 H가 그 락을 기다리는 동안, 중간 작업 M이 L을 선점해 결과적으로 H가 M보다 늦게 실행되는 현상입니다. 1997년 화성 탐사선 Pathfinder가 이 문제로 반복 재부팅된 사례가 유명합니다. 락을 쥔 작업에 기다리는 작업 중 가장 높은 우선순위를 임시로 물려주는 우선순위 상속으로 해결합니다.<\/p>\n<p>앱에서도 같은 일이 생깁니다. 메인 스레드가 낮은 우선순위 백그라운드 스레드가 쥔 락을 기다리면, 백그라운드 스레드가 CPU를 잘 못 받아 UI가 끊깁니다. 그래서 메인 스레드와 백그라운드 스레드가 같은 락을 공유하지 않게 설계하고, 결과는 메시지나 상태 흐름으로 넘깁니다. Android의 Binder도 호출자 우선순위를 처리 스레드에 반영하는 장치가 있습니다.<\/p>","f":"<ul>\n<li><strong>우선순위 상한 프로토콜은?<\/strong> 락마다 그 락을 쓸 수 있는 가장 높은 우선순위를 정해 두고, 락을 잡는 순간 그 우선순위로 올리는 방식입니다.<\/li>\n<li><strong>공정 락으로 기아를 막으면 비용은?<\/strong> 순서를 지키느라 전환이 늘어 처리량이 떨어집니다.<\/li>\n<\/ul>"},{"no":60,"t":"동시성과 병렬성을 구분해 설명해 보세요.","a":"<p>동시성은 여러 작업이 겹치는 시간 동안 함께 진행되는 구조이고, 병렬성은 실제로 같은 순간 여러 코어에서 실행되는 것입니다. 코어 하나에서 두 작업을 번갈아 실행하면 동시성은 있지만 병렬성은 없습니다. 동시성은 설계의 성질이고 병렬성은 실행의 성질이라고 정리합니다.<\/p>\n<p>I/O를 기다리는 시간이 대부분인 일은 동시성만으로도 큰 이득이 있습니다. 네트워크 응답을 기다리는 동안 다른 요청을 진행하면 코어 하나로도 처리량이 올라갑니다. 계산이 대부분인 일은 병렬성이 있어야 빨라집니다. Kotlin 코루틴은 동시성 도구이고, Dispatchers.Default처럼 여러 스레드를 가진 디스패처에 올리면 병렬로도 실행됩니다.<\/p>\n<p>병렬화의 상한은 암달의 법칙으로 설명합니다. 전체 중 직렬 부분이 10%면 코어를 무한히 늘려도 최대 10배입니다. 그래서 병렬화 전에 직렬 구간과 공유 자원 경쟁부터 줄입니다.<\/p>","f":"<ul>\n<li><strong>코어가 하나여도 동시성 버그가 생기나요?<\/strong> 생깁니다. 선점으로 작업이 아무 지점에서나 바뀌어 실행 순서가 섞이기 때문입니다.<\/li>\n<li><strong>병렬 처리가 오히려 느려지는 경우는?<\/strong> 작업이 너무 잘아 분배 비용이 크거나, 공유 자원 경쟁과 false sharing이 있을 때입니다.<\/li>\n<\/ul>"},{"no":61,"t":"경쟁 상태(race condition)를 예로 설명하고, 임계 구역 문제의 해결 조건을 말해 보세요.","a":"<p>여러 실행 흐름이 공유 데이터에 접근하고, 결과가 실행 순서에 따라 달라지는 상황입니다. count++는 읽기, 더하기, 쓰기 세 단계라 두 스레드가 같은 값을 읽고 각자 1을 더해 쓰면 한 번이 사라집니다. \"없으면 넣기\"처럼 확인과 행동 사이에 다른 스레드가 끼어드는 확인 후 행동(check-then-act) 패턴도 흔한 원인입니다.<\/p>\n<p>임계 구역 해결책은 세 조건을 만족해야 합니다. 한 번에 하나만 들어가는 상호 배제, 아무도 없으면 들어가려는 쪽이 들어갈 수 있는 진행, 무한히 기다리지 않는 한정 대기입니다.<\/p>\n<p>실무 해결책은 락만이 아닙니다. 원자 연산(AtomicInteger, ConcurrentHashMap.compute), 불변 객체, 공유하지 않기(한 스레드에만 두기, 단일 스레드 디스패처나 액터로 직렬화)가 더 단순하고 안전한 경우가 많습니다. 경쟁 상태는 재현이 어려워 코드 리뷰에서 \"이 값은 어느 스레드가 바꾸는가\"를 묻는 습관이 가장 효과적입니다.<\/p>","f":"<ul>\n<li><strong>data race와 race condition의 차이는?<\/strong> data race는 동기화 없이 같은 메모리에 동시에 접근하고 그중 하나가 쓰기인 메모리 모델 차원의 문제이고, race condition은 순서에 따라 논리 결과가 달라지는 더 넓은 개념입니다. 모든 접근을 동기화해도 race condition은 남을 수 있습니다.<\/li>\n<li><strong>재현은 어떻게 하나요?<\/strong> 반복 스트레스 테스트, 스레드 수를 늘린 테스트, 네이티브 코드에는 ThreadSanitizer를 씁니다.<\/li>\n<\/ul>"},{"no":62,"t":"뮤텍스, 세마포어, 모니터의 차이는 무엇이고 각각 어디에 씁니까?","a":"<p>뮤텍스는 한 번에 하나만 들어가게 하는 락이고 소유권이 있어 잠근 스레드가 풀어야 합니다. 세마포어는 카운터를 가진 동기화 도구로, 동시에 N개까지 허용합니다. 소유권이 없어 다른 스레드가 신호를 보낼 수 있으므로 \"작업 완료 알림\" 같은 신호 용도로도 씁니다. 모니터는 락과 조건 변수를 언어 차원에서 묶은 것으로 Java의 synchronized와 wait, notify가 모니터입니다.<\/p>\n<p>쓰임으로 보면 공유 상태 보호는 뮤텍스, DB 커넥션 수나 동시 다운로드 수 제한은 세마포어, 조건이 만족될 때까지 기다리는 생산자 소비자는 모니터의 조건 변수입니다.<\/p>\n<p>코루틴에서는 kotlinx.coroutines.sync의 Mutex와 Semaphore를 씁니다. 기다리는 동안 스레드를 막지 않고 suspend합니다. 예를 들어 이미지 다운로드를 동시에 4개로 제한하려면 Semaphore(4)의 withPermit으로 감쌉니다.<\/p>","f":"<ul>\n<li><strong>재진입 락이란?<\/strong> 이미 락을 가진 스레드가 다시 획득할 수 있는 락입니다. synchronized와 ReentrantLock은 재진입되지만 Kotlin Mutex는 재진입되지 않아 같은 코루틴이 두 번 잠그면 교착 상태가 됩니다.<\/li>\n<li><strong>이진 세마포어와 뮤텍스는 같은가요?<\/strong> 값의 범위는 같지만 소유권이 없어서, 잠그지 않은 스레드가 풀 수 있다는 점이 다릅니다.<\/li>\n<\/ul>"},{"no":63,"t":"스핀락은 언제 쓰고, 언제 쓰면 안 됩니까?","a":"<p>스핀락은 락을 얻을 때까지 잠들지 않고 계속 확인합니다. 잠들고 깨어나는 컨텍스트 스위칭이 없으므로, 임계 구역이 매우 짧고 다른 코어에서 락이 곧 풀릴 것이 확실할 때 유리합니다. 커널의 인터럽트 처리처럼 잠들 수 없는 문맥에서도 씁니다.<\/p>\n<p>반대로 코어가 하나이거나, 락을 오래 잡거나, 락을 쥔 스레드가 선점당하면 CPU를 헛돌며 낭비합니다. 모바일에서는 배터리 낭비로 바로 이어집니다.<\/p>\n<p>그래서 실제 락 구현 대부분은 적응형입니다. 잠깐 스핀하다가 안 되면 잠듭니다. 리눅스 futex는 경쟁이 없으면 사용자 공간 원자 연산만으로 끝내고 경쟁이 있을 때만 커널로 가며, JVM의 락도 비슷하게 동작합니다. 애플리케이션 코드에서 while 반복으로 직접 스핀하는 코드는 리뷰에서 막습니다.<\/p>","f":"<ul>\n<li><strong>인터럽트 핸들러에서 뮤텍스를 못 쓰는 이유는?<\/strong> 뮤텍스는 기다릴 때 잠드는데 인터럽트 문맥은 잠들 수 없기 때문입니다.<\/li>\n<li><strong>CAS 반복 루프도 스핀인가요?<\/strong> 형태는 비슷하지만 락을 기다리는 것이 아니라 갱신 충돌 시 재시도하는 것이고, 경쟁이 심하면 같은 낭비가 생깁니다.<\/li>\n<\/ul>"},{"no":64,"t":"교착 상태의 네 가지 조건을 말하고, 실무에서 가장 흔하게 쓰는 예방법은 무엇입니까?","a":"<p>상호 배제, 점유 대기(자원을 쥔 채 다른 자원을 기다림), 비선점(남이 쥔 자원을 빼앗을 수 없음), 순환 대기 네 조건이 모두 성립해야 교착 상태가 됩니다. 하나만 깨면 예방됩니다.<\/p>\n<p>실무에서 가장 흔한 방법은 락 획득 순서를 전역으로 정해 순환 대기를 깨는 것입니다. 계좌 이체에서 출금 계좌부터 잠그면 A→B, B→A 이체가 동시에 일어날 때 교착되므로, 계좌 ID가 작은 쪽부터 잠그도록 규칙을 둡니다. 그 밖에 tryLock에 시간 제한을 두고 실패하면 쥔 락을 놓고 다시 시도하기, 락 범위 줄이기, 락을 쥔 채 외부 콜백이나 I/O 호출하지 않기, 락을 하나로 합치기, 공유 대신 메시지 전달로 바꾸기를 씁니다.<\/p>\n<p>진단은 스레드 덤프에서 서로를 기다리는 순환을 찾습니다. Android ANR 리포트의 스레드 덤프에서 메인 스레드가 어떤 락을 기다리고 그 락을 누가 쥐고 있는지 따라가면 대부분 원인이 보입니다.<\/p>","f":"<ul>\n<li><strong>락을 쥔 채 콜백을 부르면 왜 위험한가요?<\/strong> 콜백이 어떤 락을 잡을지 호출자가 알 수 없어 순서 규칙이 깨지기 때문입니다.<\/li>\n<li><strong>DB에서 교착 상태가 나면?<\/strong> DB가 감지해 한 트랜잭션을 롤백하므로, 애플리케이션은 그 오류를 받아 재시도해야 합니다.<\/li>\n<\/ul>"},{"no":65,"t":"교착 상태 회피와 탐지는 예방과 어떻게 다르며, 범용 OS는 실제로 어떻게 대처합니까?","a":"<p>대처는 네 가지입니다. 예방은 네 조건 중 하나를 구조적으로 없앱니다. 회피는 자원을 줄 때마다 앞으로도 모두가 끝날 수 있는 안전 상태인지 확인하고, 아니면 주지 않습니다. 은행원 알고리즘이 대표인데 각 프로세스가 앞으로 필요한 최대 자원량을 미리 알아야 해서 현실에서는 거의 쓰지 않습니다. 탐지와 회복은 일단 허용하고 자원 할당 그래프에서 사이클을 찾아 프로세스를 종료하거나 롤백합니다. 마지막은 무시입니다.<\/p>\n<p>범용 OS는 비용과 드문 발생 빈도 때문에 대부분 무시하고(타조 알고리즘), 애플리케이션 락의 교착은 애플리케이션 책임으로 둡니다. 반면 DB는 탐지와 회복을 씁니다. 트랜잭션 대기 그래프를 보고 사이클이 생기면 비용이 적은 트랜잭션을 희생시켜 롤백합니다.<\/p>\n<p>그래서 애플리케이션 개발자에게 현실적인 선택은 예방(락 순서, 시간 제한)과 DB 교착 오류에 대한 재시도입니다.<\/p>","f":"<ul>\n<li><strong>안전 상태란?<\/strong> 자원을 어떤 순서로 나눠 주면 모든 프로세스가 끝날 수 있는 순서가 하나 이상 존재하는 상태입니다.<\/li>\n<li><strong>재시도할 때 주의할 점은?<\/strong> 트랜잭션 전체를 처음부터 다시 하고, 무한 재시도를 막고, 지터를 둬 같은 충돌이 반복되지 않게 합니다.<\/li>\n<\/ul>"},{"no":66,"t":"생산자 소비자 문제를 조건 변수로 구현할 때 대기 조건을 if가 아니라 while로 확인해야 하는 이유는?","a":"<p>깨어났을 때 조건이 여전히 참이라는 보장이 없기 때문입니다. 첫째, OS나 런타임은 신호 없이 스레드를 깨울 수 있습니다(가짜 깨어남). 둘째, 신호를 받고 락을 다시 얻기까지 사이에 다른 소비자가 먼저 들어와 항목을 가져갈 수 있습니다. 그래서 while로 조건을 다시 확인하고, 여전히 비어 있으면 다시 기다립니다.<\/p>\n<p>생산자와 소비자가 같은 조건 변수를 기다리는 구조에서 notify 하나만 보내면 생산자가 생산자를 깨워 아무도 진행하지 못할 수 있습니다. 조건 변수를 \"비어 있지 않음\"과 \"가득 차지 않음\"으로 나누거나 notifyAll을 씁니다.<\/p>\n<p>실무에서는 직접 짜기보다 BlockingQueue나 코루틴 Channel을 씁니다. Channel은 버퍼 크기와 넘칠 때 정책(대기, 가장 오래된 것 버림, 최신 값만 유지)을 고를 수 있어, 생산이 소비보다 빠를 때 어떻게 할지를 명시적으로 설계하게 해 줍니다.<\/p>","f":"<ul>\n<li><strong>synchronized 밖에서 wait()를 부르면?<\/strong> IllegalMonitorStateException이 납니다. 조건 확인과 대기를 원자적으로 하기 위해 락이 필요합니다.<\/li>\n<li><strong>배압(backpressure)이란?<\/strong> 소비자가 따라가지 못할 때 생산자 속도를 늦추거나 데이터를 버리는 등 흐름을 조절하는 장치입니다.<\/li>\n<\/ul>"},{"no":67,"t":"교착 상태, 라이브락, 기아는 어떻게 다릅니까?","a":"<p>교착 상태는 서로가 쥔 자원을 기다리며 아무도 진행하지 못하는 상태로, 스레드들이 잠들어 CPU 사용량이 0에 가깝습니다. 라이브락은 서로 양보하거나 재시도하느라 상태는 계속 바뀌지만 아무도 진행하지 못하는 상태로, CPU는 계속 씁니다. 좁은 복도에서 두 사람이 같은 방향으로 계속 비켜 주는 상황이고, tryLock 실패 후 둘이 똑같은 간격으로 재시도할 때 생깁니다. 기아는 시스템 전체는 진행하지만 특정 스레드만 계속 밀리는 상태입니다.<\/p>\n<p>라이브락은 재시도 간격에 무작위성을 넣어 해결합니다. 이더넷 충돌 후 무작위 백오프와 네트워크 재시도에 지터를 넣는 것이 같은 이유입니다. 기아는 공정 락이나 에이징으로 해결하지만 처리량이 줄어드는 대가가 있습니다.<\/p>\n<p>모니터링에서는 CPU 사용량으로 둘을 구분하는 단서를 얻습니다. 요청이 멈췄는데 CPU가 놀면 교착 상태, CPU가 바쁜데 진척이 없으면 라이브락이나 무한 재시도를 의심합니다.<\/p>","f":"<ul>\n<li><strong>공정 락이 느린 이유는?<\/strong> 락을 막 푼 스레드가 바로 다시 잡지 못하고 기다리던 스레드에게 넘겨야 해서 전환이 늘어납니다.<\/li>\n<li><strong>재시도 지터가 없으면?<\/strong> 실패한 클라이언트들이 같은 시각에 재시도해 부하가 주기적으로 몰립니다.<\/li>\n<\/ul>"},{"no":68,"t":"가상 메모리가 무엇이고 왜 필요한지, 모바일 환경에서는 어떻게 다른지 설명해 보세요.","a":"<p>프로세스마다 독립된 가상 주소 공간을 주고, MMU가 페이지 테이블을 보고 가상 주소를 실제 물리 주소로 바꾸는 기법입니다. 메모리는 페이지(보통 4KB) 단위로 관리합니다.<\/p>\n<p>얻는 것은 네 가지입니다. 다른 프로세스 메모리에 접근할 수 없는 격리와, 코드 페이지를 읽기 전용으로 두는 보호. 실제로 쓰는 페이지만 물리 메모리에 올리는 요구 페이징으로 실제 RAM보다 큰 주소 공간 사용. 공유 라이브러리처럼 같은 물리 페이지를 여러 프로세스가 함께 쓰는 공유. 파일을 메모리처럼 다루는 매핑입니다. RAM이 부족하면 덜 쓰는 페이지를 디스크로 내보냅니다.<\/p>\n<p>모바일은 플래시 수명과 속도 때문에 보통 디스크 스왑 대신 RAM 일부를 압축 공간으로 쓰는 zRAM을 쓰고, 그래도 부족하면 백그라운드 프로세스를 종료합니다. 그래서 앱은 언제든 종료될 수 있다고 보고 상태를 저장하고 복원해야 합니다. 또 Android 15부터 16KB 페이지 기기를 지원해서, 네이티브 라이브러리를 16KB 정렬로 빌드하지 않으면 그런 기기에서 설치나 실행이 실패할 수 있습니다.<\/p>","f":"<ul>\n<li><strong>페이지가 크면 장단점은?<\/strong> 페이지 테이블이 작아지고 TLB 하나가 덮는 범위가 넓어져 빨라지지만, 내부 단편화로 메모리가 더 듭니다.<\/li>\n<li><strong>32비트 프로세스의 주소 공간은?<\/strong> 4GB이고, 그중 일부는 커널 영역이라 실제로 쓸 수 있는 공간은 더 작습니다.<\/li>\n<\/ul>"},{"no":69,"t":"페이지 폴트가 났을 때 OS는 무엇을 합니까? minor와 major 페이지 폴트의 차이는?","a":"<p>CPU가 접근한 가상 주소의 페이지 테이블 항목이 유효하지 않으면 트랩이 걸려 커널의 페이지 폴트 처리기가 실행됩니다. 먼저 접근이 합법인지(할당된 영역인지, 권한이 맞는지) 봅니다. 아니면 프로세스에 SIGSEGV를 보내 죽입니다. 합법이면 물리 프레임을 확보하고(없으면 다른 페이지를 내보냄) 내용을 채운 뒤 페이지 테이블을 갱신하고, 멈췄던 명령을 다시 실행합니다.<\/p>\n<p>내용을 디스크(파일이나 스왑)에서 읽어야 하면 major 폴트로 밀리초 단위가 걸립니다. 이미 페이지 캐시에 있거나, 0으로 채우기만 하면 되거나, Copy-on-Write 복사만 하면 되면 minor 폴트로 마이크로초 단위입니다.<\/p>\n<p>앱 시작 시간에 직결됩니다. 콜드 스타트 때 코드와 리소스 페이지가 아직 메모리에 없어 major 폴트가 몰리기 때문입니다. 시작 경로 코드를 한곳에 모으고 미리 컴파일하는 Baseline Profile이 효과가 있는 이유 중 하나입니다.<\/p>","f":"<ul>\n<li><strong>메인 스레드에서 mmap한 파일을 읽는 것이 위험한 이유는?<\/strong> 함수 호출처럼 보이지만 페이지 폴트로 숨은 디스크 I/O가 생겨 프레임이 끊길 수 있습니다.<\/li>\n<li><strong>페이지 폴트 수는 어떻게 보나요?<\/strong> <code>/proc/&lt;pid&gt;/stat<\/code>의 minflt, majflt 값이나 perf, Perfetto로 봅니다.<\/li>\n<\/ul>"},{"no":70,"t":"페이지 테이블은 왜 여러 단계이고, TLB는 어떤 문제를 해결합니까?","a":"<p>64비트 주소 공간 전체를 한 단계 페이지 테이블로 만들면 프로세스마다 거대한 표가 필요합니다. 그래서 주소를 여러 조각으로 나눠 트리처럼 찾는 다단계 페이지 테이블을 쓰고, 실제로 쓰는 영역의 하위 표만 만듭니다. x86-64와 ARM64는 보통 4단계입니다.<\/p>\n<p>대가로 주소 변환 한 번에 메모리를 여러 번 읽어야 합니다. 이것을 TLB라는 변환 결과 캐시가 해결합니다. 대부분의 접근이 TLB에서 끝나서 실제 비용이 거의 없고, 미스가 날 때만 표를 따라갑니다.<\/p>\n<p>TLB가 덮는 범위가 성능을 좌우하기 때문에, 큰 힙을 쓰는 DB나 JVM은 2MB 같은 큰 페이지(huge page)를 써서 TLB 미스를 줄입니다. 16KB 페이지가 4KB보다 빠른 이유 중 하나도 같은 TLB 항목 수로 4배 넓은 메모리를 덮기 때문입니다.<\/p>","f":"<ul>\n<li><strong>TLB shootdown이란?<\/strong> 멀티코어에서 페이지 매핑이 바뀌면 다른 코어 TLB의 낡은 항목을 지우라고 인터럽트를 보내는 일로, 비용이 큽니다.<\/li>\n<li><strong>컨텍스트 스위칭 때 TLB는?<\/strong> ASID로 프로세스를 구분하면 비우지 않고 유지할 수 있습니다.<\/li>\n<\/ul>"},{"no":71,"t":"페이지 교체 알고리즘을 비교하고, 실제 OS는 무엇을 씁니까?","a":"<p>OPT는 앞으로 가장 오래 쓰지 않을 페이지를 내보내는 최적 알고리즘이지만 미래를 알아야 해서 비교 기준으로만 씁니다. FIFO는 단순하지만 프레임을 늘렸는데 폴트가 늘어나는 벨레이디 이상이 생깁니다. LRU는 가장 오래 안 쓴 페이지를 내보내 성능이 좋지만, 접근마다 시각을 기록하는 정확한 구현은 하드웨어 비용이 커서 쓰지 않습니다.<\/p>\n<p>그래서 근사합니다. Clock(두 번째 기회) 알고리즘은 하드웨어가 접근할 때 켜 주는 참조 비트를 쓰고, 시계 바늘이 돌면서 비트가 1이면 0으로 끄고 넘어가고 0이면 내보냅니다. 수정된 페이지는 디스크에 써야 해서 비용이 두 배라 깨끗한 페이지를 먼저 내보내는 변형도 씁니다.<\/p>\n<p>리눅스는 활성과 비활성 두 리스트로 나눠 한 번만 쓰인 페이지가 자주 쓰는 페이지를 밀어내지 않게 하고, 최근 커널은 여러 세대로 나눈 LRU(MGLRU)를 씁니다. 애플리케이션 캐시를 설계할 때도 스캔 오염 문제와 근사 비용이라는 같은 고민이 반복됩니다.<\/p>","f":"<ul>\n<li><strong>벨레이디 이상은 왜 LRU에서 생기지 않나요?<\/strong> LRU는 스택 알고리즘이라 프레임 n개일 때 담는 페이지 집합이 n+1개일 때 집합에 항상 포함되기 때문입니다.<\/li>\n<li><strong>수정 비트는 왜 필요한가요?<\/strong> 바뀌지 않은 페이지는 디스크에 다시 쓸 필요 없이 버리면 되기 때문입니다.<\/li>\n<\/ul>"},{"no":72,"t":"스래싱은 무엇이고, 모바일 기기에서는 어떤 모습으로 나타납니까?","a":"<p>실행 중인 프로세스들의 워킹 셋(최근 자주 쓰는 페이지 묶음) 합이 물리 메모리를 넘어서, 페이지를 내보내자마자 다시 필요해지는 일이 반복되는 상태입니다. 시간 대부분을 페이지 교체에 쓰고 실제 일은 거의 못 해 CPU 이용률이 급락합니다. 예전 OS는 CPU가 논다고 보고 프로세스를 더 올려 상황을 악화시켰습니다.<\/p>\n<p>해결은 각 프로세스의 워킹 셋을 보장하는 워킹 셋 모델, 페이지 폴트 빈도를 보고 프레임 수를 조절하는 방식, 동시에 돌리는 프로세스 수 줄이기입니다.<\/p>\n<p>모바일에서는 메모리가 빠듯해지면 zRAM 압축과 해제, 버려진 파일 페이지를 다시 읽는 일이 늘어 기기 전체가 버벅입니다. Android의 lmkd는 메모리 압력 지표(PSI)를 보고 이 상태가 되기 전에 덜 중요한 프로세스를 종료합니다. 앱은 onTrimMemory 신호에 캐시를 비우고 큰 비트맵을 줄여 협조합니다. 앱이 메모리를 적게 쓰면 다른 앱이 덜 종료되어 기기 전체 경험이 좋아집니다.<\/p>","f":"<ul>\n<li><strong>워킹 셋은 어떻게 추정하나요?<\/strong> 최근 일정 시간 동안 참조된 페이지 집합으로 봅니다.<\/li>\n<li><strong>앱 메모리를 줄이는 가장 효과 큰 방법은?<\/strong> 보통 이미지입니다. 화면 크기에 맞게 줄여 디코딩하고, 필요 없는 캐시를 비웁니다.<\/li>\n<\/ul>"},{"no":73,"t":"페이징과 세그멘테이션의 차이, 내부 단편화와 외부 단편화를 설명해 보세요.","a":"<p>세그멘테이션은 코드, 데이터, 스택처럼 논리 단위로 크기가 다른 영역을 나눕니다. 의미 단위라 보호 설정이 자연스럽지만, 크기가 제각각이라 할당과 해제를 반복하면 빈 공간이 조각나 총량은 충분한데 큰 요청이 못 들어가는 외부 단편화가 생깁니다. 페이징은 고정 크기로 나눠 외부 단편화가 없고, 대신 마지막 페이지에 남는 공간인 내부 단편화가 생깁니다. 현대 OS는 페이징 중심이고 x86-64에서 세그멘테이션은 사실상 평평하게 씁니다.<\/p>\n<p>단편화 문제는 힙 할당기에서도 같습니다. malloc 계열은 크기별 풀을 두어 외부 단편화를 줄이고(jemalloc, slab), GC 런타임은 살아 있는 객체를 한쪽으로 모으는 압축이나 복사 수집으로 해결합니다.<\/p>\n<p>Android의 ART가 복사 방식 GC를 쓰는 것도 같은 이유입니다. 예전 런타임에서는 남은 메모리 총량은 충분한데 큰 비트맵 할당이 실패하는 문제가 있었고, 압축으로 연속 공간을 만들어 이를 줄였습니다.<\/p>","f":"<ul>\n<li><strong>압축 GC의 비용은?<\/strong> 객체를 옮기고 그 객체를 가리키는 참조를 모두 고쳐야 합니다.<\/li>\n<li><strong>내부 단편화 예시는?<\/strong> 4KB 페이지에 100바이트만 쓰면 나머지가 낭비되고, 할당기가 13바이트 요청에 16바이트를 주는 것도 같습니다.<\/li>\n<\/ul>"},{"no":74,"t":"프로세스의 메모리 영역을 설명하고, 스택 할당과 힙 할당의 비용 차이는 어디서 옵니까?","a":"<p>코드 영역은 실행 명령으로 읽기 전용이고 프로세스 간 공유할 수 있습니다. 데이터 영역은 초기값이 있는 전역 변수와 static 변수, BSS는 0으로 초기화되는 전역 변수입니다. 힙은 실행 중 동적으로 할당하는 영역이고, 스택은 스레드마다 하나씩 있으며 함수 호출마다 지역 변수와 반환 주소를 담은 프레임이 쌓입니다.<\/p>\n<p>스택 할당은 스택 포인터를 옮기기만 하면 되고 함수가 끝나면 자동으로 사라져 매우 쌉니다. 대신 크기가 제한되고 함수보다 오래 살 수 없습니다. 힙 할당은 할당기가 빈 공간을 찾고, GC 언어에서는 나중에 수집 비용까지 듭니다.<\/p>\n<p>JVM에서 객체는 원칙적으로 힙에 있고 지역 기본형과 참조는 스택에 있습니다. JIT는 탈출 분석으로 메서드 밖으로 나가지 않는 객체를 힙에 만들지 않고 필드를 지역 변수로 풀어 할당 자체를 없애기도 합니다. 실무에서 그리기나 스크롤처럼 매 프레임 호출되는 경로에서 객체 생성을 피하라는 이유가 이 힙 할당과 GC 비용입니다.<\/p>","f":"<ul>\n<li><strong>스레드마다 스택이 있는 이유는?<\/strong> 각 스레드가 독립적인 호출 흐름을 갖기 때문입니다.<\/li>\n<li><strong>스택 크기를 넘으면?<\/strong> 스택 오버플로로 Java에서는 StackOverflowError, 네이티브에서는 세그멘테이션 폴트입니다.<\/li>\n<\/ul>"},{"no":75,"t":"Copy-on-Write와 fork의 관계를 설명하고, Android Zygote가 이것을 어떻게 활용하는지 말해 보세요.","a":"<p>fork는 부모 프로세스를 복제하지만 메모리를 즉시 복사하지 않습니다. 부모와 자식이 같은 물리 페이지를 공유하되 읽기 전용으로 표시해 두고, 어느 한쪽이 쓰려고 하면 그 페이지만 복사합니다. 이것이 Copy-on-Write입니다. 그래서 fork는 빠르고, 쓰지 않는 페이지는 계속 공유되어 메모리를 아낍니다.<\/p>\n<p>Android의 Zygote는 부팅 때 런타임을 띄우고 공통 프레임워크 클래스와 리소스를 미리 로드해 둔 프로세스입니다. 앱을 시작할 때 Zygote를 fork해서 앱 프로세스를 만들기 때문에 런타임 초기화를 건너뛰어 시작이 빠르고, 공통 클래스와 리소스 페이지는 모든 앱이 물리적으로 공유합니다.<\/p>\n<p>함정도 있습니다. fork는 호출한 스레드 하나만 복제하므로, 다른 스레드가 쥐고 있던 락은 자식에서 영원히 풀리지 않습니다. 그래서 Zygote는 fork 전에 다른 스레드를 정리합니다. Redis의 백그라운드 스냅샷도 fork와 COW를 쓰는데, 스냅샷 중 쓰기가 많으면 복사가 늘어 메모리가 최대 두 배까지 늘 수 있습니다.<\/p>","f":"<ul>\n<li><strong>공유 페이지가 깨지는 원인은?<\/strong> 참조 카운트나 GC 표시 비트처럼 객체에 쓰는 작업이 생기면 읽기만 하던 페이지도 복사됩니다.<\/li>\n<li><strong>posix_spawn은 왜 쓰나요?<\/strong> fork 직후 exec할 거라면 복제 자체를 건너뛰어 더 가볍고 안전합니다.<\/li>\n<\/ul>"},{"no":76,"t":"시스템 콜은 왜 비싸고, 이를 줄이는 방법은 무엇입니까?","a":"<p>CPU는 사용자 모드와 커널 모드로 권한을 나눕니다. 사용자 모드에서는 하드웨어나 다른 프로세스 메모리에 직접 접근할 수 없어서, 파일, 네트워크, 프로세스 생성 같은 일은 시스템 콜로 커널에 요청합니다. 트랩 명령으로 모드를 바꾸고, 커널이 인자를 검증하고 일을 한 뒤 돌아옵니다. 모드 전환과 그에 따른 캐시, TLB 영향 때문에 일반 함수 호출보다 훨씬 비쌉니다.<\/p>\n<p>줄이는 방법은 모아서 부르는 것입니다. 1바이트씩 read하면 바이트마다 시스템 콜이 일어나므로 BufferedInputStream처럼 큰 블록으로 읽고, 여러 버퍼를 한 번에 쓰는 writev를 쓰고, 시각 조회처럼 자주 부르는 일부 호출은 커널 진입 없이 처리하는 vDSO를 씁니다.<\/p>\n<p>앱에서는 메인 스레드의 디스크와 네트워크 접근을 StrictMode로 잡고, 작은 쓰기를 반복하는 코드는 묶어서 쓰게 바꿉니다. 실제로 어떤 시스템 콜이 몇 번 불리는지는 strace나 Perfetto로 확인합니다.<\/p>","f":"<ul>\n<li><strong>작은 write를 반복하면 왜 느린가요?<\/strong> 호출마다 커널 진입 비용이 들고, 저장 장치에도 작은 쓰기가 많이 생깁니다.<\/li>\n<li><strong>사용자 모드에서 특권 명령을 실행하면?<\/strong> CPU가 예외를 일으키고 커널이 프로세스를 종료합니다.<\/li>\n<\/ul>"},{"no":77,"t":"인터럽트와 폴링은 각각 언제 유리하고, 트랩은 인터럽트와 어떻게 다릅니까?","a":"<p>폴링은 CPU가 장치 상태를 주기적으로 확인합니다. 단순하고, 이벤트가 매우 잦으면 효율적이지만, 드물면 대부분의 확인이 헛수고입니다. 인터럽트는 장치가 일이 생겼을 때 신호를 보내 CPU가 하던 일을 저장하고 처리기를 실행합니다. 드문 이벤트에 효율적이지만 이벤트가 너무 잦으면 처리기 실행만 하다가 일을 못 하는 상태가 됩니다. 그래서 고속 네트워크 카드는 인터럽트로 깨운 뒤 폴링으로 몰아서 처리하는 혼합 방식을 씁니다.<\/p>\n<p>하드웨어 인터럽트는 외부 장치에서 비동기로 오고, 트랩은 실행 중인 명령이 일으키는 동기 이벤트입니다. 시스템 콜, 0으로 나누기, 페이지 폴트가 트랩입니다.<\/p>\n<p>인터럽트 처리기는 짧게 만들고 무거운 일은 나중으로 미룹니다. 앱 개발에서도 같은 원칙이 통합니다. 이벤트 콜백에서는 상태만 기록하고 무거운 처리는 다른 스레드로 넘기며, 서버 상태를 주기적으로 묻는 폴링과 서버가 알려 주는 푸시 중 이벤트 빈도에 맞는 것을 고릅니다.<\/p>","f":"<ul>\n<li><strong>DMA는 무엇인가요?<\/strong> 장치가 CPU를 거치지 않고 메모리에 직접 데이터를 옮기고, 끝나면 인터럽트로 알리는 방식입니다.<\/li>\n<li><strong>인터럽트 처리기를 짧게 하는 이유는?<\/strong> 처리 중 다른 인터럽트가 막히거나 지연되기 때문입니다.<\/li>\n<\/ul>"},{"no":78,"t":"프로세스 간 통신 방법을 비교하고, Android가 Binder를 만든 이유를 설명해 보세요.","a":"<p>파이프는 단방향 바이트 흐름으로 부모와 자식 사이에 쓰고, 이름 있는 파이프는 관계없는 프로세스끼리도 씁니다. 메시지 큐는 메시지 단위로 주고받습니다. 공유 메모리는 복사가 없어 가장 빠르지만 동기화를 직접 해야 합니다. 소켓은 네트워크로 확장할 수 있고, 같은 기기 안에서는 유닉스 도메인 소켓을 씁니다.<\/p>\n<p>Binder는 커널 드라이버 기반 RPC입니다. 받는 쪽 버퍼를 커널과 공유 매핑해 데이터 복사가 한 번이고, 커널이 호출자의 UID와 PID를 붙여 주므로 받는 쪽이 권한 검사를 믿을 수 있습니다. 객체 참조를 넘기고, 상대 프로세스가 죽으면 알림(linkToDeath)을 받을 수 있으며, 메서드 호출처럼 쓰는 동기 모델입니다. 앱이 시스템 서비스를 부르는 거의 모든 호출이 Binder를 거칩니다.<\/p>\n<p>한도는 프로세스당 트랜잭션 버퍼가 약 1MB라 Intent나 Bundle에 큰 데이터를 넣으면 TransactionTooLargeException이 납니다. 큰 데이터는 ID만 넘기거나 공유 메모리, 파일 디스크립터로 넘깁니다.<\/p>","f":"<ul>\n<li><strong>메인 스레드에서 Binder 동기 호출을 하면?<\/strong> 상대 프로세스가 느리면 그동안 메인 스레드가 막혀 ANR이 날 수 있습니다.<\/li>\n<li><strong>공유 메모리가 가장 빠른 이유는?<\/strong> 커널을 거친 복사 없이 같은 물리 페이지를 양쪽이 직접 읽고 쓰기 때문입니다.<\/li>\n<\/ul>"},{"no":79,"t":"동기와 비동기, 블로킹과 논블로킹은 어떻게 다릅니까?","a":"<p>두 축이 다릅니다. 블로킹과 논블로킹은 호출한 함수가 결과가 준비될 때까지 제어를 돌려주지 않느냐, 바로 돌려주느냐입니다. 동기와 비동기는 작업 완료를 누가 챙기느냐로, 호출자가 직접 결과를 받거나 확인하면 동기, 완료를 콜백이나 이벤트로 통지받으면 비동기입니다.<\/p>\n<p>조합하면 일반 read는 동기 블로킹, 논블로킹 소켓에 계속 read를 시도하는 것은 동기 논블로킹, 콜백이나 CompletableFuture, io_uring 완료 통지는 비동기 논블로킹입니다. 비동기 블로킹은 분류마다 정의가 다른데, select 같은 I/O 멀티플렉싱을 넣기도 하고, 비동기 API를 불러 놓고 Future.get이나 runBlocking으로 결과를 기다리는 안티 패턴을 예로 들기도 합니다.<\/p>\n<p>Kotlin의 suspend 함수는 코드는 동기처럼 위에서 아래로 읽히지만 기다리는 동안 스레드를 막지 않습니다. 그래서 코루틴 안에서 Thread.sleep이나 블로킹 I/O를 그대로 부르면 그 장점이 사라지고 디스패처 스레드를 묶어 버립니다.<\/p>","f":"<ul>\n<li><strong>delay와 Thread.sleep의 차이는?<\/strong> delay는 suspend로 스레드를 돌려주고, sleep은 스레드를 붙잡습니다.<\/li>\n<li><strong>블로킹 라이브러리를 코루틴에서 써야 하면?<\/strong> withContext(Dispatchers.IO)로 감싸 블로킹을 감당할 스레드에서 실행합니다.<\/li>\n<\/ul>"},{"no":80,"t":"select, poll, epoll의 차이는 무엇이고, 이벤트 루프는 어떻게 동작합니까?","a":"<p>모두 스레드 하나로 여러 파일 디스크립터 중 준비된 것을 기다리는 I/O 멀티플렉싱입니다. select는 감시할 집합을 호출마다 커널로 복사하고, 보통 1024개 제한이 있으며, 돌아오면 전체를 훑어 준비된 것을 찾아야 해 O(n)입니다. poll은 개수 제한만 없앴습니다. epoll은 감시 목록을 커널에 한 번 등록해 두고 준비된 것만 돌려주어 준비된 수에 비례하는 비용이라 연결이 수만 개여도 효율적입니다. BSD와 macOS는 kqueue를 씁니다.<\/p>\n<p>이벤트 루프는 이 위에서 \"준비된 이벤트를 기다리고, 꺼내서 처리하고, 다시 기다리는\" 반복입니다. Netty, Node.js, nginx가 이 구조입니다. Android의 Looper와 MessageQueue도 메시지가 없으면 네이티브 레벨에서 epoll로 잠들고, 메시지나 감시하는 디스크립터 이벤트가 오면 깨어납니다.<\/p>\n<p>핵심 규칙은 이벤트 루프 스레드를 막지 않는 것입니다. 처리 하나가 오래 걸리면 뒤의 모든 이벤트가 멈춥니다. Android 메인 스레드가 바로 이벤트 루프라서, 거기서 디스크나 네트워크를 쓰면 화면이 멈추고 ANR이 납니다.<\/p>","f":"<ul>\n<li><strong>엣지 트리거와 레벨 트리거의 차이는?<\/strong> 레벨은 준비된 상태인 동안 계속 알리고, 엣지는 상태가 바뀌는 순간 한 번만 알려서 엣지는 남은 데이터를 끝까지 읽어야 합니다.<\/li>\n<li><strong>C10K 문제란?<\/strong> 연결 1만 개를 동시에 처리하는 문제로, 연결당 스레드 모델의 한계를 드러내 이벤트 기반 서버가 퍼진 계기입니다.<\/li>\n<\/ul>"},{"no":81,"t":"inode는 무엇이고, 하드 링크와 심볼릭 링크는 어떻게 다릅니까?","a":"<p>inode는 파일의 메타데이터, 즉 크기, 권한, 소유자, 시각, 데이터 블록 위치를 담은 구조입니다. 파일 이름은 inode에 없고 디렉터리 항목이 \"이름에서 inode 번호로\" 연결합니다.<\/p>\n<p>하드 링크는 같은 inode를 가리키는 또 하나의 이름입니다. 원본과 구분이 없고, 링크 수가 0이 되고 파일을 연 프로세스도 없을 때 실제로 지워집니다. 같은 파일 시스템 안에서만 만들 수 있고 디렉터리에는 쓸 수 없습니다. 심볼릭 링크는 대상 경로 문자열을 담은 별도 파일이라, 원본을 지우면 끊기지만 파일 시스템을 넘어 만들 수 있습니다.<\/p>\n<p>실무에서 두 가지를 설명해 줍니다. 로그 파일을 지웠는데 디스크가 비지 않는 이유는 그 파일을 연 프로세스가 아직 inode를 쥐고 있어서입니다. rename이 원자적인 이유는 데이터는 그대로 두고 디렉터리 항목만 바꾸기 때문이고, 이것이 안전한 파일 교체의 기초가 됩니다(82번).<\/p>","f":"<ul>\n<li><strong>df와 du 결과가 다른 이유는?<\/strong> 지워졌지만 열려 있는 파일은 du에 안 보이고 df에는 사용량으로 남습니다.<\/li>\n<li><strong>inode가 고갈되면?<\/strong> 디스크 공간이 남아도 새 파일을 만들 수 없습니다. 아주 작은 파일이 대량으로 생길 때 납니다.<\/li>\n<\/ul>"},{"no":82,"t":"write가 성공했는데 전원이 꺼진 뒤 데이터가 사라질 수 있는 이유와, 파일을 안전하게 갱신하는 방법은?","a":"<p>write는 보통 커널의 페이지 캐시에 쓰고 바로 성공을 돌려줍니다. 실제 디스크 기록은 나중에 커널이 몰아서 합니다. 그 사이 전원이 꺼지면 사라집니다. 내구성이 필요하면 fsync로 디스크 기록을 기다리고, 새로 만든 파일이라면 디렉터리 항목도 fsync해야 합니다.<\/p>\n<p>쓰는 도중 앱이 죽어 파일이 반쯤 쓰인 상태가 되는 문제도 있습니다. 표준 패턴은 임시 파일에 전체를 쓰고 fsync한 다음, rename으로 원래 파일을 교체하는 것입니다. rename은 원자적이라 어느 시점에 죽어도 옛 파일 아니면 새 파일이 남습니다. Android의 AtomicFile이 이 방식이고, DataStore도 원자적 쓰기를 보장합니다. SQLite는 저널이나 WAL로 같은 문제를 풉니다.<\/p>\n<p>반면 SharedPreferences의 apply()는 비동기로 쓰지만 특정 생명주기 시점에 남은 쓰기를 기다리느라 메인 스레드를 막아 ANR의 원인이 되기도 합니다. fsync는 비싸므로 매번 부르지 말고, 중요한 데이터만 묶어서 씁니다.<\/p>","f":"<ul>\n<li><strong>플래시 저장소에서 fsync가 느린 이유는?<\/strong> 장치 내부 캐시를 비우는 명령과 플래시 변환 계층의 작업이 함께 일어나기 때문입니다.<\/li>\n<li><strong>commit()과 apply()의 차이는?<\/strong> commit은 호출한 스레드에서 디스크 기록까지 기다리고 결과를 돌려주며, apply는 메모리에 즉시 반영하고 디스크 기록은 나중에 합니다.<\/li>\n<\/ul>"},{"no":83,"t":"mmap은 무엇이고, read로 읽는 것과 비교해 언제 유리합니까?","a":"<p>파일을 프로세스 주소 공간에 매핑해 메모리처럼 접근하게 합니다. 접근하는 순간 페이지 폴트로 필요한 부분만 읽어 오고, 페이지 캐시를 그대로 공유하므로 read처럼 커널 버퍼에서 사용자 버퍼로 복사하는 단계가 없습니다. 같은 파일을 여러 프로세스가 매핑하면 물리 페이지도 공유합니다.<\/p>\n<p>큰 파일을 무작위로 접근할 때, 여러 프로세스가 같은 데이터를 읽을 때 유리합니다. 공유 라이브러리 로딩, LMDB 같은 DB, 키-값 저장소 MMKV, Android의 리소스와 코드 파일 로딩이 mmap을 씁니다.<\/p>\n<p>단점은 I/O 오류가 예외가 아니라 SIGBUS 시그널로 온다는 점, 평범한 메모리 접근처럼 보이는 곳에서 숨은 디스크 I/O가 생겨 메인 스레드를 멈출 수 있다는 점, 32비트 주소 공간에서는 큰 파일을 다 매핑할 수 없다는 점, 쓴 내용의 내구성을 위해 msync가 필요하다는 점입니다. 작은 파일을 처음부터 끝까지 한 번 읽는다면 read가 더 단순하고 충분히 빠릅니다.<\/p>","f":"<ul>\n<li><strong>MAP_PRIVATE와 MAP_SHARED의 차이는?<\/strong> PRIVATE는 쓰면 Copy-on-Write로 내 복사본만 바뀌고, SHARED는 파일과 다른 프로세스에 반영됩니다.<\/li>\n<li><strong>mmap한 파일을 다른 프로세스가 잘라내면?<\/strong> 잘린 영역에 접근할 때 SIGBUS가 납니다.<\/li>\n<\/ul>"},{"no":84,"t":"시스템 메모리가 부족할 때 리눅스와 Android는 어떻게 대응하고, 앱 개발자는 무엇을 해야 합니까?","a":"<p>리눅스는 메모리를 실제보다 많이 약속(오버커밋)했다가, 정말 부족해지면 OOM killer가 사용량과 조정값으로 점수
