다 먼저여야 합니다. shortService는 권한과 전제 조건이 없는 대신 3분 정도만 돌고, 시간 안에 끝나지 않으면 Service.onTimeout()이 불리며 그 뒤에도 멈추지 않으면 ANR이 납니다.<\/p>\n<p>시작 시점 제한도 있습니다. targetSdk 31 이상 앱이 백그라운드에서 포그라운드 서비스를 시작하면 ForegroundServiceStartNotAllowedException이 납니다. 예외는 보이는 상태에서 넘어간 직후, high priority FCM 수신, 알림이나 위젯 상호작용, 정확한 알람, 지오펜스와 활동 인식 전환 이벤트, BOOT_COMPLETED 수신, 배터리 최적화 해제 등입니다. 다만 BOOT_COMPLETED 리시버에서도 dataSync, camera, mediaPlayback, phoneCall, mediaProjection, microphone 타입은 시작할 수 없습니다(Android 15 동작 변경 문서는 targetSdk 35, 백그라운드 시작 제한 문서는 Android 14 이상 타깃 기준). targetSdk 34 이상 앱은 백그라운드에서 camera, location, microphone 타입을 만들면 SecurityException이 나며, 위치 서비스의 세부 규칙은 7절의 주행 안내 문항에서 다룹니다.<\/p>\n<p>실행 중 제약은 시간 한도와 알림입니다. Android 15부터 targetSdk 35 앱의 dataSync 서비스는 24시간 동안 합계 6시간까지 돌 수 있고, 한도에 닿으면 Service.onTimeout(int, int)가 불리며 몇 초 안에 stopSelf()를 부르지 않으면 RemoteServiceException이 납니다. 한도는 같은 타입의 서비스 전체가 함께 쓰고 사용자가 앱을 포그라운드로 가져오면 초기화되며, 소진한 뒤 다시 시작하면 ForegroundServiceStartNotAllowedException이 납니다. mediaProcessing 타입도 같은 6시간 한도를 dataSync와 따로 계산합니다. 알림은 필수지만 사용자가 통제합니다. Android 13 이상에서 사용자가 알림 권한을 거부하면 포그라운드 서비스 알림은 알림 창에 보이지 않고 Task Manager에만 나타나고, Android 14부터는 setOngoing(true)로 만든 알림도 사용자가 닫을 수 있습니다(잠금 상태와 모두 지우기에서는 닫히지 않고, 통화와 미디어 알림 등은 해당하지 않음).<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: dataSync 타입 FGS의 시작과 targetSdk 35 시간 한도 처리\n// Android 14 이상에서 사용자가 시작한 업로드는 공식 문서대로 UIDT 작업, 늦어도 되는 업로드는 WorkManager로\n// manifest: android:foregroundServiceType=&quot;dataSync&quot;, FOREGROUND_SERVICE와 FOREGROUND_SERVICE_DATA_SYNC 권한\nclass TripUploadService : Service() {\n    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n        ServiceCompat.startForeground(\n            this, NOTIFICATION_ID, buildProgressNotification(),\n            ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC,   // manifest에 선언한 타입만 넘긴다\n        )\n        startUpload()\n        return START_NOT_STICKY\n    }\n    override fun onTimeout(startId: Int, fgsType: Int) { stopSelf() }  // targetSdk 35의 시간 한도\n    override fun onBind(intent: Intent?): IBinder? = null\n}<\/code><\/pre>","f":"<ul>\n<li><strong>포그라운드 서비스면 프로세스가 종료되지 않습니까?<\/strong> 프로세스 중요도가 가시 프로세스로 올라 회수 순위가 뒤로 밀릴 뿐 보장은 아닙니다. Android 13부터 사용자가 알림 창의 Task Manager에서 멈추면 서비스만이 아니라 앱 프로세스 전체가 콜백 없이 종료되고 타입에 따라 시간 한도도 있으므로, 진행 상태를 저장해 이어 할 수 있게 만들고 다음 시작 때 ApplicationExitInfo의 REASON_USER_REQUESTED로 사용자가 멈춘 것인지 확인합니다.<\/li>\n<li><strong>startForeground()를 언제 불러야 합니까?<\/strong> startForegroundService()로 시작했다면 5초 안에 불러야 하므로 onStartCommand에서 무거운 준비보다 먼저 부릅니다. 전제 조건인 런타임 권한이 없으면 SecurityException이 나므로 서비스를 시작하기 전에 화면에서 권한을 확인합니다.<\/li>\n<li><strong>화면과 서비스는 상태를 어떻게 주고받습니까?<\/strong> 같은 프로세스라면 서비스와 화면이 같은 Repository의 StateFlow를 구독하는 구조가 단순하고, 서비스 객체에 직접 접근해야 할 때만 bind합니다. 주행 안내 구조는 7절의 주행 안내 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":98,"t":"백그라운드 작업은 WorkManager, 포그라운드 서비스, AlarmManager, JobScheduler 중 무엇으로 합니까?","a":"<p>기준은 언제 실행되어야 하는지와 사용자가 그 작업을 인지하는지입니다. 늦어져도 되지만 앱이 종료되거나 기기가 재부팅되어도 끝까지 보장해야 하는 작업은 WorkManager, 사용자가 시작하고 진행을 지켜보는 작업은 포그라운드 서비스, 정해진 시각에 사용자에게 알려야 하는 일은 AlarmManager입니다. JobScheduler는 플랫폼의 작업 예약 API로 WorkManager가 내부에서 쓰므로, 직접 쓰는 경우는 user-initiated data transfer 작업처럼 JobScheduler에만 있는 기능 정도입니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>작업 성격<\/th>\n<th>도구<\/th>\n<th>예<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>늦어도 되지만 보장해야 함<\/td>\n<td>WorkManager<\/td>\n<td>즐겨찾기 동기화, 로그 업로드<\/td>\n<\/tr>\n<tr>\n<td>지금 바로 시작할 짧은 작업<\/td>\n<td>WorkManager expedited work<\/td>\n<td>사용자가 누른 공유나 신고 전송<\/td>\n<\/tr>\n<tr>\n<td>사용자가 시작해 진행을 지켜봄<\/td>\n<td>포그라운드 서비스<\/td>\n<td>주행 안내, 음악 재생<\/td>\n<\/tr>\n<tr>\n<td>사용자가 시작한 긴 데이터 전송<\/td>\n<td>JobScheduler의 UIDT 작업<\/td>\n<td>큰 파일 내려받기<\/td>\n<\/tr>\n<tr>\n<td>정해진 시각의 알림<\/td>\n<td>AlarmManager<\/td>\n<td>출발 시각 알림<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>WorkManager는 작업을 자체 DB에 저장해 프로세스 종료와 재부팅 뒤에도 이어 실행하고, 네트워크 연결이나 충전 같은 제약 조건이 맞을 때만 돌립니다. Worker가 Result.retry()를 돌려주면 백오프 정책에 따라 다시 시도하며, 기본은 EXPONENTIAL에 30초이고 지연은 10초보다 짧게 줄 수 없습니다. 주기 작업의 최소 간격은 JobScheduler와 같은 15분입니다. 같은 작업이 여러 번 예약되지 않게 enqueueUniqueWork로 이름을 붙입니다. expedited work는 WorkManager 2.7.0에 들어온 즉시 실행 작업으로, quota가 standby bucket과 프로세스 중요도로 정해지고 앱이 포그라운드에 있는 동안에는 적용되지 않습니다. quota가 바닥났을 때 동작은 OutOfQuotaPolicy로 정하고, Android 12 미만에서는 포그라운드 서비스로 실행될 수 있어 getForegroundInfo()를 구현하지 않으면 런타임에 크래시가 날 수 있습니다.<\/p>\n<p>포그라운드 서비스는 이 절의 Service 문항에서 다룬 조건대로 사용자가 인지하는 작업을 앱이 보이는 동안 시작해야 하고 타입별 시간 한도를 받습니다. 앱을 살려 두거나 서버를 주기적으로 확인하려고 쓰는 것은 맞지 않습니다. user-initiated data transfer 작업은 Android 14(API 34)에 들어온 JobScheduler 작업으로, RUN_USER_INITIATED_JOBS 권한과 setUserInitiated(true)가 필요하고 앱이 보일 때 예약해야 하며, 알림과 함께 바로 시작해 시스템 상황이 허락하는 만큼 오래 돌 수 있습니다. 공식 문서는 짧고 중단되어도 되는 전송은 WorkManager를 계속 쓰라고 권합니다.<\/p>\n<p>AlarmManager는 대부분 부정확한 알람으로 충분하고, 정확한 알람은 시각이 곧 기능인 경우에만 씁니다. targetSdk 31 이상 앱이 setExact(), setExactAndAllowWhileIdle(), setAlarmClock()을 쓰려면 SCHEDULE_EXACT_ALARM 특별 앱 접근이 필요하고, Android 14 기기에 targetSdk 33 이상으로 새로 설치한 앱은 이 권한이 기본으로 거부됩니다. 그래서 canScheduleExactAlarms()로 확인하고, 필요하면 ACTION_REQUEST_SCHEDULE_EXACT_ALARM으로 설정 화면을 엽니다. USE_EXACT_ALARM은 자동 허용되지만 달력과 알람 시계 앱용으로 Play 정책 심사 대상입니다. 알람은 기기를 재부팅하면 지워지므로 BOOT_COMPLETED에서 다시 등록합니다.<\/p>\n<p>Android 16부터는 standby bucket에 따라 일반 작업과 expedited 작업의 실행 quota가 조정되고, 앱이 보일 때 시작해 앱이 안 보인 뒤에도 이어지는 작업과 포그라운드 서비스와 동시에 실행되는 작업도 quota를 따릅니다. 이 변경은 WorkManager, JobScheduler, DownloadManager 작업에 적용되며, 중지 이유는 WorkInfo.getStopReason()이나 JobParameters.getStopReason()으로 확인합니다.<\/p>\n<pre class=\"kotlin\"><code>val request = OneTimeWorkRequestBuilder&lt;FavoriteSyncWorker&gt;()\n    .setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build())\n    .setBackoffCriteria(BackoffPolicy.EXPONENTIAL, 30, TimeUnit.SECONDS)  // 기본값과 같음, 최소 10초\n    .build()\nWorkManager.getInstance(context).enqueueUniqueWork(\n    &quot;favorite-sync&quot;, ExistingWorkPolicy.KEEP, request,  // 이미 대기 중이거나 실행 중이면 새로 넣지 않음\n)<\/code><\/pre>","f":"<ul>\n<li><strong>재시도가 끝없이 반복되지 않게 하려면?<\/strong> Worker의 runAttemptCount로 시도 횟수를 보고 정한 횟수를 넘으면 Result.failure()로 끝내고 사용자에게 알립니다. 검증 실패처럼 다시 해도 소용없는 오류는 바로 failure로 처리합니다(4절의 오프라인 쓰기 문항).<\/li>\n<li><strong>정확한 알람 권한이 거부되어 있으면 어떻게 합니까?<\/strong> canScheduleExactAlarms()가 false면 setWindow 같은 부정확한 알람으로 대체하고, 기능에 꼭 필요할 때만 설정 화면으로 안내합니다. 사용자가 허용하면 ACTION_SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED 브로드캐스트가 오므로 그때 정확한 알람을 다시 예약합니다.<\/li>\n<li><strong>예약한 작업이 왜 안 도는지는 어떻게 봅니까?<\/strong> 실행 도중 멈춰 다시 대기 중인 작업(runAttemptCount가 0보다 크고 ENQUEUED)은 WorkInfo.getStopReason()으로 중지 이유를 보고, Android 16에서는 JobScheduler#getPendingJobReasons(int)로 대기 중인 이유를 볼 수 있습니다. bucket과 Doze 영향은 이 절의 Doze 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":99,"t":"Doze와 App Standby bucket은 백그라운드 작업에 어떤 영향을 주고, 제조사별 배터리 최적화는 어떻게 대응합니까?","a":"<p>Doze는 충전기에 연결되지 않은 기기가 화면이 꺼진 채 한동안 움직이지 않을 때 기기 전체에 걸리는 절전 상태이고, App Standby bucket은 앱별 사용 빈도에 따라 그 앱의 작업, 알람, 네트워크 실행 빈도를 제한하는 등급입니다. Doze와 App Standby는 Android 6.0 이상의 모든 앱에 targetSdk와 무관하게 적용되고 bucket은 Android 9부터이므로, 백그라운드 작업은 언제든 늦어질 수 있다고 전제하고 설계합니다. 제조사는 bucket 배정 기준을 따로 정할 수 있어, 특정 기종 VOC는 그 기종에서 재현하고 사용자 안내와 구조 변경을 함께 합니다.<\/p>\n<p>Doze 중에는 네트워크 접근이 중단되고 wake lock이 무시되며, setExact()와 setWindow()를 포함한 일반 알람이 다음 유지 관리 창으로 미뤄지고 Wi-Fi 스캔, sync adapter, JobScheduler가 실행되지 않습니다. WorkManager도 JobScheduler 위에서 돌기 때문에 함께 멈춥니다. 시스템은 주기적으로 잠깐 Doze를 빠져나와 미뤄 둔 작업과 알람, 네트워크를 처리하게 하는데, 시간이 지날수록 이 창을 드물게 엽니다. Doze 중에도 울려야 하는 알람은 setAndAllowWhileIdle()이나 setExactAndAllowWhileIdle()을 쓰는데 빈도 제한이 있어, Doze 문서는 앱당 9분에 한 번보다 자주 울릴 수 없다고 적고 전원 관리 한도 문서는 화면이 꺼지고 Doze가 활성일 때 시간당 7회로 적습니다. setAlarmClock() 알람은 Doze 중에도 울리고 시스템이 그 직전에 Doze를 빠져나옵니다. 사용자가 바로 봐야 하는 알림은 Doze 문서대로 FCM의 RemoteNotification 메시지로 보내고, 첫 메시지에 필요한 정보를 담아 추가 네트워크 요청이 없게 합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>bucket<\/th>\n<th>일반 작업<\/th>\n<th>expedited 작업(24시간)<\/th>\n<th>알람<\/th>\n<th>네트워크 접근<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Active<\/td>\n<td>60분 중 20분<\/td>\n<td>30분<\/td>\n<td>제한 없음<\/td>\n<td>허용<\/td>\n<\/tr>\n<tr>\n<td>Working set<\/td>\n<td>4시간 중 10분<\/td>\n<td>15분<\/td>\n<td>시간당 10회<\/td>\n<td>허용<\/td>\n<\/tr>\n<tr>\n<td>Frequent<\/td>\n<td>12시간 중 10분<\/td>\n<td>10분<\/td>\n<td>시간당 2회<\/td>\n<td>허용<\/td>\n<\/tr>\n<tr>\n<td>Rare<\/td>\n<td>24시간 중 10분<\/td>\n<td>10분<\/td>\n<td>시간당 1회<\/td>\n<td>비활성<\/td>\n<\/tr>\n<tr>\n<td>Restricted<\/td>\n<td>하루 1회 10분<\/td>\n<td>5분<\/td>\n<td>하루 1회<\/td>\n<td>비활성<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Active 행의 일반 작업과 expedited 작업 한도는 Android 16부터 적용된 값이고, 그 전에는 Active bucket의 작업에 실행 한도가 없었습니다. bucket 제한은 배터리 전원일 때만 적용되지만 Restricted는 충전 중에도 적용됩니다. Restricted bucket은 Android 12에 추가되었고, 앱을 쓰지 않은 날 수 기준이 Android 12와 12L은 45일, Android 13부터 8일입니다. 활성 위젯이 있는 앱, ACCESS_BACKGROUND_LOCATION이나 USE_EXACT_ALARM을 받은 앱 등은 restricted bucket 진입에서 면제됩니다. 공식 문서는 제조사마다 bucket 배정 알고리즘이 다를 수 있으니 특정 bucket에 들어가려 하지 말고 어느 bucket에서도 동작하게 만들라고 적습니다.<\/p>\n<p>배터리 최적화 예외는 정책으로 제한됩니다. 예외 목록에 든 앱은 App Standby bucket 기반 제한에서 빠지고 Doze 중에도 네트워크와 partial wake lock을 쓸 수 있지만, 일반 알람은 여전히 유지 관리 창으로 미뤄집니다. 대부분의 앱은 ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS로 설정 화면을 열어 주는 데서 그치고, ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS로 바로 예외를 요청하는 것은 허용 사례에 해당하는 앱만 씁니다. Google Play 정책은 앱의 핵심 기능이 손상되는 경우가 아니면 이 직접 요청을 금지하고, FCM으로 해결되는 채팅 앱은 허용 사례가 아니라고 문서가 적습니다.<\/p>\n<p>제조사별 배터리 관리로 생기는 VOC는 세 단계로 대응합니다. 먼저 VOC와 크래시 도구에서 기기 모델과 OS 버전으로 묶고, 같은 기종에서 Doze 강제 진입, bucket 변경, 배터리 설정 조합으로 재현합니다. 종료 원인은 ApplicationExitInfo로 보고, 강제 종료로 stopped 상태였는지는 Android 15의 ApplicationStartInfo.wasForceStopped()로 확인합니다. Android 15부터 stopped 상태가 되면 pending intent가 모두 취소되므로, 사용자 동작으로 벗어날 때 오는 ACTION_BOOT_COMPLETED와 앱 시작 시점에 알람과 지오펜스를 다시 등록합니다. 다음으로 기능이 배터리 설정의 영향을 받는다면 그 기능을 켤 때 이유와 함께 설정 화면을 안내합니다. 마지막으로 구조를 바꿉니다. 클라이언트 폴링은 서버 푸시로, 사용자가 시작한 작업은 보이는 동안 시작한 포그라운드 서비스로, 늦어도 되는 작업은 제약 조건을 단 WorkManager로 옮깁니다.<\/p>\n<pre class=\"kotlin\"><code>// 진단용: VOC 로그에 전원 관리 상태를 함께 남긴다\nfun powerSnapshot(context: Context): Map&lt;String, Any&gt; {\n    val power = context.getSystemService(PowerManager::class.java)\n    val state = mutableMapOf&lt;String, Any&gt;(\n        &quot;ignoringBatteryOpt&quot; to power.isIgnoringBatteryOptimizations(context.packageName),\n        &quot;deviceIdle&quot; to power.isDeviceIdleMode,\n    )\n    if (Build.VERSION.SDK_INT &gt;= Build.VERSION_CODES.P) {\n        state[&quot;standbyBucket&quot;] = context.getSystemService(UsageStatsManager::class.java).appStandbyBucket\n    }\n    return state\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Doze와 bucket 동작은 어떻게 재현합니까?<\/strong> 문서대로 adb shell dumpsys battery unplug로 충전을 끊은 상태로 만들고 adb shell dumpsys deviceidle force-idle로 Doze에 넣은 뒤 알람과 작업, 네트워크가 어떻게 미뤄지는지 봅니다. bucket은 adb shell am set-standby-bucket으로 바꾸고 am get-standby-bucket으로 확인합니다.<\/li>\n<li><strong>배터리 최적화 예외를 받으면 문제가 모두 풀립니까?<\/strong> 아닙니다. 예외 앱은 bucket 기반 제한에서 빠지고 Doze 중에도 네트워크와 partial wake lock을 쓸 수 있지만, 일반 알람은 그대로 유지 관리 창으로 미뤄집니다. 제조사 자체 배터리 관리는 이 예외와 별개로 동작할 수 있어 재현 기기 확인이 여전히 필요합니다.<\/li>\n<li><strong>사용자가 앱을 멈춘 것과 시스템이 종료한 것은 어떻게 구분합니까?<\/strong> Task Manager의 중지는 앱 프로세스 전체를 콜백 없이 종료하고 ApplicationExitInfo에 REASON_USER_REQUESTED로 남습니다. 메모리 부족 종료는 REASON_LOW_MEMORY로 남되 이를 보고하지 않는 기기도 있으므로 isLowMemoryKillReportSupported()를 함께 봅니다(이 절의 메모리 부족 문항).<\/li>\n<\/ul>"},{"no":100,"t":"BroadcastReceiver에는 어떤 제약이 있고, 런타임 등록할 때 무엇을 지정해야 합니까?","a":"<p>BroadcastReceiver는 시스템이나 다른 앱이 보낸 Intent를 받는 컴포넌트이고, 버전이 올라갈수록 백그라운드에서 받을 수 있는 범위가 좁아졌습니다. targetSdk 26 이상 앱은 자기 앱을 지정하지 않은 암시적 브로드캐스트를 manifest로 받을 수 없어 BOOT_COMPLETED 같은 예외 목록만 manifest에 두고, 나머지는 앱이 실행 중일 때 코드로 등록합니다. targetSdk 34 이상 앱이 코드로 등록할 때는 다른 앱의 브로드캐스트를 받을지를 RECEIVER_EXPORTED나 RECEIVER_NOT_EXPORTED로 반드시 지정해야 합니다. onReceive는 메인 스레드에서 짧게 끝내고, 앱 내부 통신에는 브로드캐스트 대신 Flow를 씁니다.<\/p>\n<p>manifest 제한은 Android 8.0의 백그라운드 실행 제한에서 왔습니다. 브로드캐스트 하나에 manifest로 등록한 앱이 많으면 이벤트마다 그 앱들이 한꺼번에 깨어나 자원을 쓰기 때문입니다. 예외 목록에는 ACTION_BOOT_COMPLETED, ACTION_LOCKED_BOOT_COMPLETED, ACTION_TIMEZONE_CHANGED, ACTION_LOCALE_CHANGED 등이 있고, 공식 문서는 이들도 가능하면 등록하지 말라고 적습니다. 그 전에 Android 7.0은 targetSdk 24 이상 앱이 CONNECTIVITY_ACTION을 manifest로 받지 못하게 했으므로, 네트워크 상태는 브로드캐스트 대신 ConnectivityManager의 registerDefaultNetworkCallback으로 받습니다. Android 14부터는 앱이 캐시 상태에 있는 동안 ACTION_SCREEN_ON처럼 덜 중요한 시스템 브로드캐스트를 미뤘다가 앱이 활성 상태가 되면 전달하므로, 코드로 등록한 리시버라도 백그라운드에서 즉시 받는다고 가정하지 않습니다.<\/p>\n<p>런타임 등록은 등록한 Context가 살아 있는 동안만 유효하므로 onStart와 onStop, 또는 Compose의 DisposableEffect처럼 짝이 맞는 지점에서 등록하고 해제합니다. 플래그는 다른 앱이 보낸 브로드캐스트를 받아야 하면 RECEIVER_EXPORTED, 내 앱과 시스템이 보낸 것만 받으면 RECEIVER_NOT_EXPORTED입니다. 시스템 브로드캐스트만 받는 리시버는 targetSdk 34의 의무 지정에서 빠지지만, 의도를 드러내도록 지정해 두는 편이 낫습니다. 하위 버전까지 같은 코드로 쓰려면 androidx.core 1.9.0에 추가된 ContextCompat.registerReceiver(context, receiver, filter, flags)를 씁니다. exported 리시버는 어떤 앱이든 악의적인 브로드캐스트를 보낼 수 있으므로 권한을 지정하고 받은 값을 검증하며, 액션 이름은 전역 이름 공간이라 내 패키지 이름으로 시작하게 짓습니다.<\/p>\n<p>onReceive는 메인 스레드에서 실행되고, 반환한 뒤에는 시스템이 프로세스를 종료할 수 있습니다. 그래서 onReceive 안에서 스레드를 띄워 오래 일하면 도중에 프로세스가 죽을 수 있습니다. 조금 더 시간이 필요하면 goAsync()로 받은 PendingResult를 백그라운드로 넘기고 끝나면 finish()를 부르는데, 공식 문서는 이때도 10초 안에 끝내기를 기대한다고 적습니다. 그보다 긴 작업은 WorkManager나 JobScheduler로 예약합니다. 리시버에서 Activity를 바로 띄우지 말고 알림을 보여 줍니다.<\/p>\n<p>앱 안의 컴포넌트끼리 알릴 때 sendBroadcast나 LocalBroadcastManager를 쓰지 않습니다. LocalBroadcastManager는 앱 전체 이벤트 버스라 어떤 컴포넌트든 다른 컴포넌트의 이벤트를 들을 수 있어 계층을 무너뜨리고, 같은 프로세스 안에서도 Intent를 써야 한다는 이유로 1.1.0에서 deprecated되었습니다. 대신 Repository가 StateFlow나 SharedFlow로 상태와 이벤트를 노출하고 필요한 쪽이 구독합니다.<\/p>\n<pre class=\"kotlin\"><code>@Composable\nfun PowerSaveModeEffect(onChanged: (Boolean) -&gt; Unit) {\n    val context = LocalContext.current\n    val latest by rememberUpdatedState(onChanged)\n    DisposableEffect(context) {\n        val receiver = object : BroadcastReceiver() {\n            override fun onReceive(c: Context, i: Intent) =\n                latest(c.getSystemService(PowerManager::class.java).isPowerSaveMode)\n        }\n        ContextCompat.registerReceiver(context, receiver,\n            IntentFilter(PowerManager.ACTION_POWER_SAVE_MODE_CHANGED),\n            ContextCompat.RECEIVER_NOT_EXPORTED)               // 다른 앱의 브로드캐스트는 받지 않음\n        onDispose { context.unregisterReceiver(receiver) }     // 컴포지션을 떠나면 해제\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>BOOT_COMPLETED 리시버에서는 무엇을 합니까?<\/strong> 재부팅하면 지워지는 알람과 지오펜스를 다시 등록하는 정도로 짧게 끝냅니다. targetSdk에 따라 이 리시버에서 dataSync 같은 일부 타입의 포그라운드 서비스를 시작할 수 없으므로(이 절의 Service 문항), 긴 작업은 WorkManager로 넘깁니다.<\/li>\n<li><strong>goAsync()로 받은 작업이 10초 안에 끝나지 않으면 어떻게 합니까?<\/strong> PendingResult를 들고 기다리지 말고, 작업을 WorkManager에 예약한 뒤 바로 finish()를 부릅니다. 리시버는 이벤트를 받아 넘기는 역할만 하게 둡니다.<\/li>\n<li><strong>exported 리시버로 다른 앱의 브로드캐스트를 받을 때 무엇을 확인합니까?<\/strong> 보낼 수 있는 앱을 권한으로 제한하고, extras는 외부 입력으로 보고 타입과 범위를 검증합니다. 받은 값으로 내부 Activity를 띄우거나 Intent를 그대로 다시 보내면 intent redirection 취약점이 되므로 6절의 컴포넌트 보안 문항을 따릅니다.<\/li>\n<\/ul>"},{"no":101,"t":"런타임 권한 요청은 어떻게 설계합니까?","a":"<p>권한은 그 기능을 쓰려는 순간에 맥락과 함께 요청하고, 결과는 Activity Result API의 RequestPermission 계약으로 받으며, 거부되어도 그 기능만 빠지고 나머지는 계속 쓸 수 있게 설계합니다. 허용 여부는 저장해 두지 않고 권한이 필요한 API를 부르기 직전에 매번 확인합니다. 사용자는 설정에서 언제든 권한을 회수할 수 있고 시스템이 자동으로 초기화하기도 하기 때문입니다.<\/p>\n<p>공식 흐름은 이렇습니다. ContextCompat.checkSelfPermission()이 PERMISSION_DENIED이면 shouldShowRequestPermissionRationale()을 부르고, true이면 왜 필요한지 설명하는 화면을 먼저 보여 준 뒤 요청합니다. 요청은 registerForActivityResult(ActivityResultContracts.RequestPermission())으로 받은 launcher의 launch()로 하고, 공식 문서는 요청 코드를 시스템이 관리해 주는 이 계약 방식을 권장합니다. 결과를 기다리는 동안 프로세스와 Activity가 다시 만들어질 수 있으므로 콜백은 Activity가 만들어질 때마다 조건 없이 등록하고, Compose에서는 rememberLauncherForActivityResult를 씁니다. 앱을 처음 열자마자 여러 권한을 한꺼번에 묻지 말고, 도착 알림을 켤 때 알림 권한을 묻는 것처럼 사용자가 이유를 바로 알 수 있는 시점에 묻습니다. Android 13 이상 기기에 새로 설치한 앱은 알림이 기본으로 꺼져 있으므로 알림 권한도 같은 흐름으로 요청합니다.<\/p>\n<p>shouldShowRequestPermissionRationale()은 설명 화면을 보여 줄지만 알려 줄 뿐이라 한계가 있습니다. AOSP 구현은 USER_FIXED나 정책으로 고정된 권한이면 false, 한 번 거부해 USER_SET이 붙은 권한이면 true를 돌려주므로, 처음 요청하기 전과 영구 거부된 뒤에 모두 false여서 이 값만으로는 두 상태를 구분할 수 없습니다. targetSdk 30 이상 앱의 ACCESS_BACKGROUND_LOCATION은 요청할 때마다 설명하게 하려고, 아직 허용되지 않았고 고정 플래그도 없으면 거부한 적이 없어도 true를 돌려주는 예외가 있습니다. 공식 문서 기준으로 사용자가 같은 권한을 설치 기간 동안 두 번 거부하면 영구 거부로 간주되어, 다시 요청해도 시스템 대화상자가 뜨지 않습니다. 시스템은 한 번 거부한 권한에 USER_SET, 두 번 거부한 권한에 USER_FIXED 플래그를 남기며, 테스트할 때 adb shell dumpsys package로 확인하고 pm clear-permission-flags로 되돌립니다. 앱 코드에서는 요청 직후 콜백에서 거부되었는데 rationale이 false이면 영구 거부로 보고 Settings.ACTION_APPLICATION_DETAILS_SETTINGS로 앱 정보 화면을 안내합니다. 다만 사용자가 고르지 않고 대화상자를 닫아 요청이 중단되어도 콜백은 거부로 오고 첫 요청이었다면 rationale도 false이므로, 안내 화면에 다시 요청하는 버튼도 남깁니다. 설정에서 돌아오면 ON_RESUME에서 다시 확인합니다.<\/p>\n<p>권한은 앱 밖에서 바뀝니다. 설정에서 런타임 권한을 회수하면 실행 중인 앱 프로세스가 종료되고 ApplicationExitInfo에 REASON_PERMISSION_CHANGE(API 30)로 남으므로, 사용자가 돌아오면 프로세스 종료 뒤 복원 경로를 탑니다(이 절의 구성 변경 문항). targetSdk 30 이상 앱을 몇 달 쓰지 않으면 hibernation 상태가 되어 런타임 권한이 초기화되고, 앱을 다시 써도 권한은 자동으로 돌아오지 않습니다. 공식 문서도 권한이 사용자 동작 없이 자동으로 거부되거나 허용될 수 있으니 기능을 쓸 때마다 확인하라고 적습니다. 허용 여부를 SharedPreferences에 저장해 그 값을 믿으면 이런 경우에 권한 없이 API를 불러 SecurityException이 납니다. Android 12의 대략적 위치처럼 일부만 허용되는 권한도 있어 결과를 허용과 거부 두 가지로만 보지 않으며, 위치 권한의 흐름은 7절의 위치 권한 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: enum class PermissionOutcome { Granted, ShowRationale, GoToSettings }는 생략\n@Composable\nfun rememberPermissionRequest(permission: String, onResult: (PermissionOutcome) -&gt; Unit): () -&gt; Unit {\n    val activity = LocalActivity.current\n    val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { granted -&gt;\n        val rationale = activity != null &amp;&amp;\n            ActivityCompat.shouldShowRequestPermissionRationale(activity, permission)\n        onResult(when {\n            granted -&gt; PermissionOutcome.Granted\n            rationale -&gt; PermissionOutcome.ShowRationale   // 거부됐지만 다시 물을 수 있음: 설명 화면과 함께 다시 요청\n            else -&gt; PermissionOutcome.GoToSettings         // 영구 거부이거나 첫 요청이 중단됨: 설정 안내와 재요청 버튼\n        })\n    }\n    return { launcher.launch(permission) }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>권한이 없을 때 기능 진입 자체를 막아야 합니까?<\/strong> 막지 않습니다. 위치 권한이 없으면 지도는 기본 위치로 보여 주고 출발지를 직접 고르게 하는 식으로 그 기능만 빼고, 권한이 필요한 버튼을 누를 때 다시 이유를 설명합니다.<\/li>\n<li><strong>설명 화면은 매번 보여 줍니까?<\/strong> rationale이 true일 때 보여 주는데, 보통은 사용자가 한 번 거부한 뒤이고 targetSdk 30 이상 앱의 백그라운드 위치는 거부 전에도 true일 수 있습니다. 처음 요청 때는 시스템 대화상자 전에 화면 맥락으로 이유가 드러나게 하고, 별도 설명 화면을 매번 띄워 요청을 늦추지 않습니다.<\/li>\n<li><strong>권한 여러 개가 함께 필요한 기능은 어떻게 요청합니까?<\/strong> RequestMultiplePermissions 계약으로 한 번에 요청하고 결과 Map을 권한별로 처리합니다. 다만 서로 관련 없는 권한을 묶지 않고, 위치처럼 요청 순서가 정해진 권한은 7절의 위치 권한 문항의 흐름을 따릅니다.<\/li>\n<\/ul>"},{"no":102,"t":"SharedPreferences, DataStore, Room, 파일은 어떻게 고릅니까? SharedPreferences의 apply는 왜 ANR을 낼 수 있습니까?","a":"<p>데이터의 모양과 크기로 고릅니다. 설정이나 플래그 같은 작은 키 값은 Preferences DataStore, 스키마를 정한 작은 객체는 Proto DataStore, 검색, 정렬, 부분 갱신, 관계가 필요한 구조화된 데이터는 Room, 이미지나 지도 타일처럼 큰 바이너리는 파일에 둡니다. SharedPreferences는 기존 코드에만 남기고 새 저장소는 DataStore로 만듭니다. apply()는 디스크 쓰기를 비동기로 미루지만, 프레임워크가 Activity나 Service가 시작하거나 멈추기 전에 밀린 쓰기가 끝나기를 메인 스레드에서 기다리기 때문에 그 시점에 ANR이 날 수 있습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>저장소<\/th>\n<th>맞는 데이터<\/th>\n<th>읽기와 쓰기<\/th>\n<th>주의점<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SharedPreferences<\/td>\n<td>기존 코드의 작은 키 값<\/td>\n<td>동기 API, apply는 비동기 쓰기<\/td>\n<td>생명주기 전환 때 쓰기 대기, 첫 로딩 대기<\/td>\n<\/tr>\n<tr>\n<td>Preferences DataStore<\/td>\n<td>설정, 플래그<\/td>\n<td>Flow로 읽기, suspend로 쓰기<\/td>\n<td>파일당 인스턴스 하나<\/td>\n<\/tr>\n<tr>\n<td>Proto DataStore<\/td>\n<td>스키마가 있는 작은 객체<\/td>\n<td>같음, 타입 안전<\/td>\n<td>부분 갱신과 참조 무결성 없음<\/td>\n<\/tr>\n<tr>\n<td>Room<\/td>\n<td>목록, 검색, 관계 데이터<\/td>\n<td>Flow 관찰, suspend 쓰기<\/td>\n<td>스키마 버전과 마이그레이션<\/td>\n<\/tr>\n<tr>\n<td>파일<\/td>\n<td>이미지, 타일, 내려받은 데이터<\/td>\n<td>스트림<\/td>\n<td>캐시와 영구 데이터 위치 구분<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>apply()는 메모리의 SharedPreferences에 바로 반영하고 디스크 쓰기를 비동기로 시작하며, 실패는 알려 주지 않습니다. 레퍼런스 문서는 프레임워크가 Activity나 Service가 시작하거나 멈추는 상태 전환 전에 진행 중인 apply() 쓰기를 끝내도록 보장하고, 이 대기가 메인 스레드를 막아 ANR의 흔한 원인이 된다고 경고합니다. AOSP 소스를 보면 apply()가 쓰기 작업을 QueuedWork에 넣고, ActivityThread가 Activity를 멈출 때와 Service의 시작 명령과 종료를 처리할 때 메인 스레드에서 QueuedWork.waitToFinish()로 그 작업을 기다립니다. 큰 값을 자주 쓸수록 대기가 길어집니다. commit()은 동기로 디스크에 쓰고 성공 여부를 돌려주므로 메인 스레드에서 부르면 그 자체가 메인 스레드 디스크 I/O입니다. SharedPreferences는 처음 만들 때 파일 전체를 백그라운드에서 읽는데, 다 읽기 전에 값을 꺼내면 읽기가 끝날 때까지 호출한 스레드가 기다립니다.<\/p>\n<p>DataStore는 코루틴과 Flow로 데이터를 비동기, 일관되게, 트랜잭션으로 저장합니다. 읽기는 data Flow로 받고, 쓰기는 updateData나 Preferences의 edit로 하며, updateData는 현재 값을 받아 원자적인 읽기, 수정, 쓰기로 갱신합니다. 같은 파일에 인스턴스가 둘 이상이면 읽고 쓸 때 IllegalStateException이 나므로 파일 최상위의 preferencesDataStore 위임이나 DI 싱글턴으로 하나만 두고, <code>DataStore&lt;T&gt;<\/code>의 T는 불변 타입이어야 합니다. 여러 프로세스가 같은 파일을 쓰면 DataStore 1.1.0부터 지원하는 다중 프로세스 구현을 쓰고, 같은 파일에 단일 프로세스용과 섞어 쓰지 않습니다. 공식 문서는 큰 데이터, 부분 갱신, 참조 무결성이 필요하면 Room을 쓰라고 적습니다. 민감한 값은 DataStore 1.3.0에 추가된 datastore-tink로 암호화할 수 있고, 키 관리는 6절의 비밀 보호 문항에서 다룹니다.<\/p>\n<p>Room은 SQL을 컴파일 시점에 검증하고 쿼리 결과를 Flow로 관찰하게 해 주므로 최근 검색어, 즐겨찾기, 캐시한 장소 목록처럼 조회 조건과 갱신이 있는 데이터에 맞습니다. 주의점은 이 절의 Room 문항에서 다룹니다. 큰 바이너리는 DB에 넣지 않고 파일로 저장한 뒤 경로만 DB에 둡니다. 다시 받을 수 있는 데이터는 cacheDir에 두는데, 시스템이 공간이 필요하면 오래된 파일부터 지울 수 있습니다. 지워지면 안 되는 데이터는 filesDir에 둡니다.<\/p>\n<p>SharedPreferences에서 옮길 때는 preferencesDataStore의 produceMigrations에 SharedPreferencesMigration(context, 이름)을 넣습니다. 마이그레이션은 데이터에 접근하기 전에 실행되어 기존 키를 옮기고, 옮긴 뒤 SharedPreferences가 비면 지우려고 시도합니다. 실패하면 다시 실행될 수 있으므로 별도 마이그레이션 코드를 쓸 때는 여러 번 돌아도 결과가 같게 만들고, 이전이 끝나면 옛 파일에 접근하는 코드가 남지 않게 Repository 하나로 경로를 모읍니다.<\/p>\n<pre class=\"kotlin\"><code>// 파일 최상위에 한 번만 선언해 같은 파일에 인스턴스가 하나만 생기게 한다\nval Context.settingsStore by preferencesDataStore(\n    name = &quot;settings&quot;,\n    produceMigrations = { context -&gt; listOf(SharedPreferencesMigration(context, &quot;legacy_prefs&quot;)) },\n)\nprivate val AVOID_TOLLS = booleanPreferencesKey(&quot;avoid_tolls&quot;)\n\nclass SettingsRepository(private val context: Context) {\n    val avoidTolls: Flow&lt;Boolean&gt; = context.settingsStore.data.map { it[AVOID_TOLLS] ?: false }\n    suspend fun setAvoidTolls(value: Boolean) {\n        context.settingsStore.edit { it[AVOID_TOLLS] = value }   // 원자적 갱신, I/O는 DataStore 스코프에서\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>apply 때문에 나는 ANR을 당장 줄이려면?<\/strong> 큰 값과 잦은 쓰기를 SharedPreferences에서 빼고, 여러 값을 모아 한 번에 apply하며, 메인 스레드에서 commit을 부르는 코드를 없앱니다. 근본 해결은 생명주기 전환이 디스크 쓰기를 기다리지 않는 DataStore로 옮기는 것입니다(6절의 ANR 문항).<\/li>\n<li><strong>SharedPreferences를 여러 프로세스에서 써도 됩니까?<\/strong> MODE_MULTI_PROCESS는 일부 Android 버전에서 안정적으로 동작하지 않고 동시 수정을 맞추는 방법도 없다는 이유로 API 23에서 deprecated되었습니다. 여러 프로세스가 같은 설정을 써야 하면 DataStore의 다중 프로세스 지원을 씁니다(4절의 앱 전역 상태 문항).<\/li>\n<li><strong>DataStore 파일이 손상되면 어떻게 됩니까?<\/strong> 직렬화기가 데이터를 읽지 못하면 CorruptionException이 나고, preferencesDataStore의 corruptionHandler에 ReplaceFileCorruptionHandler를 주면 정한 기본값으로 파일을 바꿔 계속 쓸 수 있습니다. 잃어도 되는 설정인지 먼저 판단하고 씁니다.<\/li>\n<\/ul>"},{"no":103,"t":"Room을 쓸 때 마이그레이션, 트랜잭션, Flow 쿼리에서 무엇을 주의하고, Room 3.0에서는 무엇이 바뀌었습니까?","a":"<p>마이그레이션은 사용자가 여러 버전을 건너뛰어 업데이트해도 모든 경로가 이어지게 만들고 내보낸 스키마로 테스트하며, 데이터를 지우는 fallback은 다시 받을 수 있는 캐시에만 씁니다. 여러 쓰기는 트랜잭션으로 묶고, Flow 쿼리는 참조한 테이블이 바뀔 때마다 다시 조회된다는 점을 전제로 씁니다. Room 3.0은 androidx.room3라는 새 패키지의 메이저 버전으로 KSP와 Kotlin 코드 생성만 지원하고 SQLiteDriver가 필수이며, Room 2.x는 유지 관리 모드에 들어갔습니다.<\/p>\n<p>마이그레이션부터 보면, version을 올릴 때마다 기존 버전에서 새 버전으로 가는 경로가 있어야 하고 경로가 없으면 DB를 열 때 IllegalStateException이 납니다. 업데이트를 건너뛴 사용자는 1에서 바로 3으로 오므로 1→2와 2→3 경로가 모두 있어야 합니다. 컬럼 추가처럼 단순한 변경은 AutoMigration(from, to)으로 Room이 만들고, 테이블이나 컬럼의 이름 변경과 삭제처럼 모호한 변경은 AutoMigrationSpec에 @RenameColumn, @DeleteColumn 같은 어노테이션을 붙여 알려 줍니다. 테이블을 둘로 나누는 것처럼 Room이 판단할 수 없는 변경은 Migration 클래스에 SQL을 직접 쓰고, 같은 버전에 둘 다 있으면 수동 마이그레이션이 쓰입니다. AutoMigration은 내보낸 스키마 JSON에 의존하므로 Room Gradle 플러그인의 schemaDirectory로 위치를 정하고 버전 관리에 넣습니다. 테스트는 MigrationTestHelper로 옛 버전 DB를 만들어 SQL로 데이터를 넣고 마이그레이션을 실행해 스키마와 데이터를 검증하며, 처음 버전부터 모든 마이그레이션을 차례로 도는 테스트도 둡니다. fallbackToDestructiveMigration은 경로가 없을 때 테이블을 다시 만들어 사용자 데이터를 영구 삭제하므로 서버에서 다시 받을 수 있는 캐시 DB에만 쓰고, 범위를 좁히려면 fallbackToDestructiveMigrationFrom이나 fallbackToDestructiveMigrationOnDowngrade를 씁니다. 즐겨찾기처럼 사용자가 만든 데이터와 캐시를 다른 DB로 나누면 캐시만 지우는 선택이 가능해집니다.<\/p>\n<p>트랜잭션은 일관성과 속도 둘 다를 위해 씁니다. 묶지 않으면 문장마다 자기 트랜잭션이 되어 디스크 동기화가 반복되고, 중간에 실패하면 반쯤 바뀐 상태가 남습니다. DAO 함수에 @Transaction을 붙이거나, Room 2.x는 withTransaction, Room 3.0은 withWriteTransaction으로 묶습니다. @Relation으로 부모와 자식을 함께 읽는 쿼리는 Room이 두 번 조회하므로 공식 문서대로 @Transaction을 붙여 전체를 원자적으로 실행합니다. Room 2.x의 기본 저널 모드는 저메모리 기기가 아니면 WAL이라 읽기와 쓰기가 동시에 되지만, 쓰기는 DB 전체에서 한 번에 하나이므로 긴 쓰기 트랜잭션은 다른 쓰기를 기다리게 합니다. Room은 UI를 막지 않도록 메인 스레드 DB 접근을 지원하지 않습니다. 조회 조건, 정렬, 조인에 쓰는 컬럼에는 @Entity의 indices로 인덱스를 두되 쓰기 비용이 늘므로 EXPLAIN QUERY PLAN으로 실제 쿼리를 확인합니다.<\/p>\n<p>Flow를 돌려주는 DAO 쿼리는 참조한 테이블이 바뀔 때마다 다시 읽어 새 값을 내보냅니다. 감시 단위가 행이 아니라 테이블이라 상관없는 행이 바뀌어도 같은 결과가 다시 나오므로, 화면이 같은 값을 다시 처리하지 않게 distinctUntilChanged()를 붙이고 잦은 쓰기는 트랜잭션으로 묶어 알림 횟수를 줄입니다. 수집이 이어지는 동안에는 쓰기마다 재조회 비용이 드므로 화면이 보일 때만 수집합니다(2절의 Flow 수집 문항).<\/p>\n<p>Room 3.0.0은 2026-07-01에 안정판이 나왔고 최신 안정 버전은 3.0.3입니다. KSP 전용 처리기로 Kotlin 코드만 만들어 KAPT와 Java 어노테이션 처리는 쓸 수 없지만 KSP가 Java 소스도 처리하므로 Java로 선언한 Entity와 DAO의 코드도 생성되고, SupportSQLite API가 빠져 SQLiteDriver가 필수이며 기존 코드 호환은 room3-sqlite-wrapper가 맡습니다. DAO 함수는 Flow 같은 반응형 타입을 돌려주지 않으면 suspend여야 하고, LiveData, RxJava, Guava, Paging 연동은 별도 아티팩트로 옮겨졌습니다. 2026-03 Room 3.0 발표 글은 Room 2.x가 유지 관리 모드에 들어가 Room 3가 안정화될 때까지 패치 릴리스를 받는다고 적었고, 2.x의 최신 안정 버전은 2.8.5입니다. 옮길지는 기존 코드 모양으로 판단합니다. 새 모듈이나 Kotlin Multiplatform 공유가 목표면 Room 3.0으로 시작하고, 기존 앱에 KAPT, 블로킹 DAO, LiveData나 RxJava 반환, Cursor 직접 사용이 많다면 Room 2.x 안에서 KSP와 suspend DAO로 먼저 정리합니다. 공식 문서는 Room 사용을 한 모듈에 모아 그 모듈에만 KSP를 적용하는 구조를 권하고, 옮긴 뒤에는 기존 사용자 DB가 그대로 열리는지 마이그레이션 테스트로 확인합니다.<\/p>\n<pre class=\"kotlin\"><code>@Database(\n    entities = [FavoriteEntity::class, RecentSearchEntity::class],\n    version = 4,\n    autoMigrations = [\n        AutoMigration(from = 2, to = 3),                                       // 컬럼 추가\n        AutoMigration(from = 3, to = 4, spec = AppDatabase.RenameMemo::class), // 이름 변경은 spec으로\n    ],\n)   // 1 → 2는 수동 Migration을 addMigrations로 등록, 스키마 JSON을 내보내야 AutoMigration이 동작\nabstract class AppDatabase : RoomDatabase() {\n    @RenameColumn(tableName = &quot;favorite&quot;, fromColumnName = &quot;memo&quot;, toColumnName = &quot;note&quot;)\n    class RenameMemo : AutoMigrationSpec\n    abstract fun favoriteDao(): FavoriteDao\n}<\/code><\/pre>","f":"<ul>\n<li><strong>마이그레이션이 잘못되면 사용자에게 무슨 일이 생깁니까?<\/strong> 경로가 없거나 마이그레이션 뒤 스키마가 기대와 다르면 DB를 여는 시점에 예외가 나서, 앱을 열 때마다 같은 자리에서 죽을 수 있습니다. 마이그레이션 테스트를 CI에 넣고, 단계적 출시 초반에는 DB를 여는 경로의 크래시를 따로 지켜봅니다.<\/li>\n<li><strong>결과가 바뀌지 않았는데 Flow 쿼리가 계속 값을 내보내면?<\/strong> 테이블 단위 감시라 다른 행의 변경에도 다시 조회되기 때문입니다. distinctUntilChanged로 같은 결과를 거르고, 자주 바뀌는 열을 화면 데이터와 다른 테이블로 나누거나 쓰기를 묶습니다.<\/li>\n<li><strong>Room 2.x와 3.0을 한 앱에 같이 둘 수 있습니까?<\/strong> 패키지와 Maven 그룹이 달라 같이 둘 수 있고, 새 패키지를 택한 이유도 Room 2.x에 의존하는 WorkManager 같은 라이브러리와 충돌하지 않게 하려는 것입니다. 다만 같은 DB 파일을 두 버전으로 함께 열지는 않습니다.<\/li>\n<\/ul>"},{"no":104,"t":"Android 15부터 17까지 targetSdk를 올릴 때 대응해야 하는 주요 동작 변경은 무엇입니까?","a":"<p>동작 변경은 targetSdk를 올려야 적용되는 것과, 그 OS에서 실행되는 모든 앱에 targetSdk와 무관하게 적용되는 것으로 나눠 봅니다. 큰 줄기는 targetSdk 35의 edge-to-edge 강제와 포그라운드 서비스 시간 한도, targetSdk 36의 predictive back 기본화와 큰 화면 방향 고정 무시, targetSdk 37의 로컬 네트워크 권한, 리플렉션 제한, 백그라운드 실행 제한 강화입니다. Google Play는 2026-08-31부터 새 앱과 업데이트에 API 36 이상 타깃을 요구하므로, 지금 업데이트를 내는 앱은 targetSdk 36 변경까지 대응이 끝나 있어야 합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>버전<\/th>\n<th>적용 범위<\/th>\n<th>주요 변경<\/th>\n<th>대응<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Android 15<\/td>\n<td>targetSdk 35<\/td>\n<td>edge-to-edge 기본, setStatusBarColor 효과 없음, screenWidthDp가 시스템 바를 빼지 않음<\/td>\n<td>inset 처리, 창 크기 기반 분기<\/td>\n<\/tr>\n<tr>\n<td>Android 15<\/td>\n<td>targetSdk 35<\/td>\n<td>dataSync 서비스 24시간 중 6시간 한도, BOOT_COMPLETED에서 일부 타입 시작 불가(Android 15 동작 변경 문서 기준)<\/td>\n<td>onTimeout 처리, WorkManager나 UIDT로 이전<\/td>\n<\/tr>\n<tr>\n<td>Android 15<\/td>\n<td>targetSdk 35<\/td>\n<td>TLS 1.0과 1.1 금지, PendingIntent 생성자가 기본으로 백그라운드 Activity 시작을 막음<\/td>\n<td>서버 TLS 점검, 알림으로 대체<\/td>\n<\/tr>\n<tr>\n<td>Android 15<\/td>\n<td>모든 앱<\/td>\n<td>강제 종료로 stopped 상태가 되면 pending intent 취소, 위젯 비활성화<\/td>\n<td>다시 시작될 때 알람과 지오펜스 재등록<\/td>\n<\/tr>\n<tr>\n<td>Android 16<\/td>\n<td>targetSdk 36<\/td>\n<td>edge-to-edge opt-out 비활성, predictive back 기본(onBackPressed 호출 안 됨, KEYCODE_BACK 전달 안 됨)<\/td>\n<td>OnBackPressedCallback(Compose는 BackHandler나 PredictiveBackHandler)으로 이전<\/td>\n<\/tr>\n<tr>\n<td>Android 16<\/td>\n<td>targetSdk 36<\/td>\n<td>sw600dp 이상에서 방향, 크기 조절, 화면비 제한 무시<\/td>\n<td>어떤 창 크기든 받는 적응형 레이아웃<\/td>\n<\/tr>\n<tr>\n<td>Android 16<\/td>\n<td>모든 앱<\/td>\n<td>Intent redirection 기본 보호, standby bucket별 작업 quota 조정, 4KB 정렬 앱의 16KB 호환 모드<\/td>\n<td>Intent 전달 경로 점검, 작업 중지 이유 확인<\/td>\n<\/tr>\n<tr>\n<td>Android 17<\/td>\n<td>targetSdk 37<\/td>\n<td>큰 화면 opt-out 제거, lock-free MessageQueue, static final 필드를 리플렉션으로 바꾸면 예외, 백그라운드 Activity 시작 제한이 IntentSender까지<\/td>\n<td>리플렉션 의존 코드 제거, IntentSender 옵션 변경<\/td>\n<\/tr>\n<tr>\n<td>Android 17<\/td>\n<td>targetSdk 37<\/td>\n<td>로컬 네트워크 통신에 ACCESS_LOCAL_NETWORK 권한, certificate transparency 기본, TLS 연결에 ECH 사용, System.load 대상 파일 read-only<\/td>\n<td>권한 요청 흐름, 인증서와 네이티브 로딩 점검<\/td>\n<\/tr>\n<tr>\n<td>Android 17<\/td>\n<td>targetSdk 37<\/td>\n<td>백그라운드 오디오 재생과 오디오 포커스에 포그라운드 서비스 필요, 표준 형식 SMS OTP는 수신 3시간 뒤에야 읽힘<\/td>\n<td>음성 안내를 서비스 안에서 실행, OTP를 SMS Retriever나 WebOTP 형식으로<\/td>\n<\/tr>\n<tr>\n<td>Android 17<\/td>\n<td>모든 앱<\/td>\n<td>기기 총 RAM 기반 앱 메모리 한도<\/td>\n<td>백그라운드 메모리 측정<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>화면 변경의 세부 대응은 3절의 edge-to-edge 문항과 큰 화면 문항, 포그라운드 서비스는 이 절의 Service 문항, Intent redirection은 6절의 컴포넌트 보안 문항에서 다룹니다. predictive back은 아직 옮기지 못했다면 manifest에서 android:enableOnBackInvokedCallback을 false로 두어 임시로 opt-out할 수 있지만, onBackPressed를 재정의한 코드를 OnBackPressedDispatcher에 등록하는 콜백으로 바꾸는 것이 근본 대응입니다. Activity 1.12.0부터 OnBackPressed API는 NavigationEvent API 위에서 다시 구현되었습니다. Android 17에서는 키보드나 색상 모드 같은 일부 구성 변경에서 Activity를 기본으로 재시작하지 않으므로(이 절의 구성 변경 문항), 그 변경을 재생성에 기대어 처리하던 화면도 확인합니다.<\/p>\n<p>Play 일정도 함께 봅니다. 새 앱과 업데이트는 2025-08-31부터 API 35, 2026-08-31부터 API 36 이상을 타깃해야 하고, Wear OS와 Android Automotive OS는 API 35, Android TV와 Android XR은 API 34 이상입니다. 기존 앱은 API 35 이상을 타깃해야 타깃보다 높은 Android 버전 기기의 신규 사용자에게 계속 제공되며, 2026년 요구의 연장 신청 기한은 2026-11-01로 이미 지났습니다. 16KB 페이지도 따로 챙깁니다. Android 15부터 16KB 페이지 기기가 지원되어 NDK 라이브러리를 직접이나 SDK로 쓰는 앱은 다시 빌드해야 하고, Kotlin과 Java 코드만 쓰는 앱은 이미 지원됩니다. 2026-11-04 갱신된 공식 문서는 API 35 이상을 타깃하는 앱이 Google Play의 64비트 기기에서 16KB를 지원해야 하고, 2027-02-01부터는 지원하지 않는 업데이트를 출시할 수 없다고 적습니다. NDK r28 이상은 기본으로 16KB 정렬로 컴파일합니다.<\/p>\n<p>대응 순서는 이렇게 잡습니다. 먼저 compileSdk를 올려 deprecated 경고와 lint를 정리하며, API 37로 컴파일하려면 AGP 9.1.1 이상이 필요합니다. 다음으로 모든 앱에 적용되는 변경을 새 OS 기기에서 확인합니다. 이 변경은 targetSdk를 올리지 않아도 이미 사용자에게 적용되고 있기 때문입니다. targetSdk에 묶인 변경은 호환성 프레임워크로 하나씩 켜서 시험합니다. debuggable 빌드에서는 개발자 옵션의 App Compatibility Changes나 adb shell am compat enable, disable로 변경 하나만 켜고 끌 수 있으므로, 화면 깨짐, 뒤로 가기, 백그라운드 실행, 네트워크와 보안 순으로 영향을 나눠 고칩니다. 마지막으로 내부 테스트 트랙과 단계적 출시에서 크래시와 ANR을 보며 배포합니다(6절의 CI/CD 문항).<\/p>","f":"<ul>\n<li><strong>opt-out 속성으로 시간을 벌어도 됩니까?<\/strong> 잠시는 됩니다. 다만 edge-to-edge opt-out은 targetSdk 36 앱이 Android 16 기기에서 돌 때 비활성화되고, 큰 화면 opt-out은 targetSdk 37에서 쓸 수 없으며, enableOnBackInvokedCallback=\"false\"도 이전 전까지의 임시 방편입니다. opt-out을 넣을 때 지울 시점을 함께 정합니다.<\/li>\n<li><strong>타깃을 올리지 않고 버티면 어떻게 됩니까?<\/strong> 2026-08-31부터는 API 36 미만을 타깃한 업데이트를 낼 수 없어 버그 수정도 배포하지 못합니다. 이미 출시된 버전도 API 35 미만을 타깃하면 타깃보다 높은 OS 기기의 신규 사용자에게 제공되지 않으므로, 타깃 상향을 해마다 하는 정기 작업으로 계획합니다.<\/li>\n<li><strong>변경 항목이 많을 때 영향받는 코드는 어떻게 찾습니까?<\/strong> 동작 변경 문서의 항목마다 앱에서 쓰는 API를 검색과 lint로 찾고, 호환성 프레임워크로 그 변경만 켠 상태에서 핵심 흐름 UI 테스트를 돌립니다. 결과를 항목별 체크리스트로 남겨 다음 버전에도 다시 씁니다.<\/li>\n<\/ul>"},{"no":105,"t":"다양한 기기와 OS 버전의 호환성 문제는 어떻게 찾고 대응합니까?","a":"<p>호환성 문제는 API 레벨 차이, 제조사 커스터마이징, 기기 사양 차이에서 옵니다. API 차이는 SDK_INT 분기와 Jetpack의 Compat API로 코드에서 막고, 제조사와 기기 차이는 크래시, ANR, VOC를 기기 모델과 OS 버전으로 묶어 찾은 뒤 재현 기기에서 확인합니다. 배포는 단계적 출시로 위험을 줄이고, 특정 기기 우회 코드는 조건을 좁히고 근거를 남겨 나중에 지울 수 있게 합니다.<\/p>\n<p>API 레벨은 Build.VERSION.SDK_INT 분기와 @RequiresApi로 다루고, minSdk보다 높은 API 호출은 lint의 NewApi 검사로 잡습니다. 분기를 직접 쓰기 전에 ContextCompat.registerReceiver, ServiceCompat.startForeground, IntentCompat.getParcelableExtra, WindowInsetsCompat처럼 버전 차이를 감춘 Jetpack Compat API가 있는지 먼저 찾습니다. Android 16 QPR2부터는 36.1 같은 minor SDK 버전이 생겼습니다. 36.1에 추가된 POST_PROMOTED_NOTIFICATIONS처럼 minor 릴리스의 API는 SDK_INT만으로 구분할 수 없어 Android 16부터 있는 Build.VERSION.SDK_INT_FULL과 VERSION_CODES_FULL로 판별합니다.<\/p>\n<p>제조사 차이는 배터리 정책, 설정과 권한 화면, WebView에서 자주 나옵니다. 배터리 정책은 이 절의 Doze 문항에서 다뤘습니다. 특정 설정 화면을 여는 Intent는 기기에 따라 받을 Activity가 없을 수 있으므로 ActivityNotFoundException을 처리하고 일반 설정 화면으로 대체합니다. WebView는 OS와 따로 업데이트되는 패키지라 같은 OS 버전에서도 동작이 다를 수 있으므로, WebViewCompat.getCurrentWebViewPackage()로 패키지와 버전을 로그에 남기고 androidx.webkit의 WebViewFeature.isFeatureSupported()로 기능 지원을 확인한 뒤 씁니다. 화면 크기와 폴더블 대응은 3절의 큰 화면 문항에서 다룹니다.<\/p>\n<p>찾는 방법은 지표를 기기와 OS로 쪼개 보는 것입니다. Android vitals는 user-perceived crash rate 전체 1.09%, user-perceived ANR rate 전체 0.47%에 더해 기기별 기준을 각각 8%로 두므로, 한 기종에 몰린 문제도 스토어 노출에 영향을 줄 수 있습니다. vitals는 일일 활성 사용자 기준이라 세션 기준인 Crashlytics와 값이 다를 수 있습니다. 크래시 도구에서 기기 모델, OS 버전, 앱 버전, WebView 버전으로 묶어 특정 조합에 몰리는지 보고, 그 조합을 사내 재현 기기나 Firebase Test Lab 같은 원격 실기기에서 재현합니다. 새 OS의 동작 변경은 호환성 프레임워크로 하나씩 켜서 확인합니다(이 절의 targetSdk 문항).<\/p>\n<p>대응은 배포와 코드 두 쪽에서 합니다. 단계적 출시로 일부 사용자에게 먼저 배포하고 크래시와 ANR이 기준을 넘으면 멈춥니다(6절의 CI/CD 문항). 특정 기기 우회 코드는 조건을 제조사, 모델, SDK_INT 범위로 좁히고, 이유와 재현 조건, 이슈 링크를 주석으로 남기며, 원격 설정으로 끌 수 있게 합니다. 우회 조건은 한곳에 모아 코드 곳곳에 흩어지지 않게 하고, 해당 기기 비율이 줄거나 원인이 고쳐지면 지웁니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 기기별 우회와 버전 판별을 한곳에 모은다\nobject DeviceQuirks {\n    // 이슈 링크와 재현 조건: 특정 모델의 Android 14에서 지도 Surface 전환 시 검은 화면\n    val useTextureViewForMap: Boolean\n        get() = Build.MANUFACTURER.equals(&quot;examplevendor&quot;, ignoreCase = true) &amp;&amp;\n            Build.MODEL in setOf(&quot;EX-100&quot;, &quot;EX-200&quot;) &amp;&amp;\n            Build.VERSION.SDK_INT == Build.VERSION_CODES.UPSIDE_DOWN_CAKE &amp;&amp;\n            RemoteFlags.isEnabled(&quot;quirk_texture_view_map&quot;)             // 원격으로 끌 수 있게\n\n    // minor SDK(36.1)에 추가된 API: SDK_INT_FULL은 Android 16부터 있으므로 먼저 SDK_INT를 본다\n    val supportsPromotedNotifications: Boolean\n        get() = Build.VERSION.SDK_INT &gt;= Build.VERSION_CODES.BAKLAVA &amp;&amp;\n            Build.VERSION.SDK_INT_FULL &gt;= Build.VERSION_CODES_FULL.BAKLAVA_1\n}<\/code><\/pre>","f":"<ul>\n<li><strong>특정 기기에서만 나는 크래시는 어떻게 우선순위를 정합니까?<\/strong> 그 기기의 사용자 수와 영향받는 흐름이 핵심 기능인지를 봅니다. vitals는 크래시와 ANR 모두 기기별 기준 8%를 따로 두므로, 전체 비율이 낮아도 한 기종의 문제가 스토어 노출에 영향을 줄 수 있다는 점을 함께 따집니다(6절의 크래시 문항).<\/li>\n<li><strong>WebView 화면이 특정 기기에서만 깨지면 무엇을 봅니까?<\/strong> 로그에 남긴 WebView 패키지와 버전으로 문제가 OS 버전이 아니라 WebView 버전에 몰리는지 봅니다. WebView 패키지가 업데이트되면 WebView를 로드한 앱 프로세스가 종료된다는 점도 재현 조건에 넣습니다.<\/li>\n<li><strong>재현 기기는 어떻게 고릅니까?<\/strong> 사용자 점유율이 높은 기종, 제조사별 대표 기종, 지원하는 가장 낮은 OS 버전, 메모리가 적은 기기를 섞습니다. 기기를 다 갖출 수 없으므로 VOC와 크래시가 몰리는 기종을 주기적으로 반영해 목록을 바꿉니다.<\/li>\n<li><strong>minSdk는 어떻게 정합니까?<\/strong> 사용자 분포와 라이브러리 요구를 함께 봅니다. Lifecycle 2.10.0, compose-foundation 1.10.0-alpha01, Room 2.8.0, Dagger 2.60의 Hilt는 minSdk 23을, WorkManager 2.12.0은 24를 요구하고, 낮은 버전 사용자가 줄면 minSdk를 올려 분기 코드와 테스트 범위를 줄입니다. 올리면 그 미만 기기에는 새 업데이트가 가지 않으므로 해당 사용자 비율과 핵심 기능 이용 여부를 먼저 봅니다.<\/li>\n<\/ul>"},{"no":106,"t":"RecyclerView는 어떻게 뷰를 재사용하고, ListAdapter와 DiffUtil, payload는 무엇을 해결합니까?","a":"<p>RecyclerView는 화면 밖으로 나간 항목의 View를 ViewHolder 단위로 보관했다가 새로 들어오는 항목에 다시 묶어 씁니다. 그래서 inflate 같은 생성 비용은 처음 몇 개에만 들고, 스크롤 중에는 onBindViewHolder의 비용이 성능을 정합니다. ListAdapter는 새 목록과 이전 목록의 차이를 백그라운드 스레드에서 DiffUtil로 계산해 바뀐 항목만 갱신하고, payload는 바뀐 항목 안에서도 바뀐 부분만 다시 그리게 합니다. 2026-05-19 Compose First 발표에서 RecyclerView는 중요한 버그 수정만 받는 라이브러리로 분류되었으므로 새 목록은 LazyColumn으로 만들고(3절의 LazyColumn 문항), 이 내용은 기존 화면을 유지보수할 때 씁니다.<\/p>\n<p>Recycler는 정해진 순서로 ViewHolder를 찾습니다(androidx 소스 기준). 레이아웃 중에 잠깐 떼어 낸 scrap은 같은 위치에 그대로 다시 붙고, 방금 화면 밖으로 나간 항목을 위치 기준으로 보관하는 view cache는 다시 bind하지 않고 씁니다. view cache의 기본 크기는 2개이고 setItemViewCacheSize로 바꿉니다. 여기서 못 찾으면 RecycledViewPool에서 viewType이 같은 ViewHolder를 꺼내 onBindViewHolder로 다시 묶는데, 풀은 타입별로 기본 5개까지 보관합니다. 풀도 비어 있을 때만 onCreateViewHolder가 불립니다. stable id를 켜면 위치로 찾지 못했을 때 ID로 scrap과 cache를 한 번 더 찾습니다.<\/p>\n<p>onBindViewHolder는 스크롤하는 동안 항목마다 불리므로 객체 할당, 문자열 포맷, 날짜 계산, 정렬을 하지 않고 ViewModel이 미리 만든 UI 모델을 View에 넣기만 합니다. 클릭 리스너는 onCreateViewHolder에서 한 번 달고, 위치가 필요하면 getBindingAdapterPosition()으로 얻습니다. 이미지는 표시 크기로 요청하고, 재활용된 ViewHolder에 이전 항목의 이미지가 늦게 그려지지 않게 이미지 로더의 요청 취소를 씁니다.<\/p>\n<p>notifyDataSetChanged()는 무엇이 바뀌었는지 알리지 않아 RecyclerView가 보이는 View를 모두 다시 bind하고 다시 배치하게 만들고, stable id가 없으면 항목 애니메이션도 만들 수 없습니다. ListAdapter에 submitList로 새 목록을 넘기면 AsyncListDiffer가 백그라운드 스레드에서 차이를 계산하고, 결과를 notifyItemInserted 같은 세부 이벤트로 적용합니다. DiffUtil.ItemCallback의 areItemsTheSame은 ID로 같은 항목인지, areContentsTheSame은 내용이 같은지 판단합니다. submitList에 이전과 같은 리스트 인스턴스를 넘기면 아무 일도 일어나지 않으므로, 목록을 고친 뒤에는 새 리스트를 만들어 넘깁니다. DiffUtil이 쓰는 알고리즘과 비용은 8절의 DiffUtil 문항에서 다룹니다.<\/p>\n<p>payload는 내용이 바뀐 항목을 부분만 갱신하는 장치입니다. 기본으로는 바뀐 항목의 onBindViewHolder 전체가 다시 불리고, 기본 ItemAnimator가 바뀌기 전과 후의 ViewHolder 두 개로 교차 페이드를 해 깜빡여 보일 수 있습니다. getChangePayload에서 바뀐 부분을 담은 값을 돌려주면 onBindViewHolder(holder, position, payloads)로 전달되어 즐겨찾기 아이콘처럼 그 부분만 갱신하고, payload가 있으면 DefaultItemAnimator가 같은 ViewHolder를 재사용해 교차 페이드도 생기지 않습니다. payloads가 비어 있으면 반드시 전체 bind를 해야 하고, 화면에 붙어 있지 않은 View로 가는 payload는 버려질 수 있으므로 payload만으로 상태를 만들지 않습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>RecyclerView<\/th>\n<th>LazyColumn<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ViewHolder의 View 재사용과 rebind<\/td>\n<td>항목 컴포지션 재사용과 리컴포지션<\/td>\n<\/tr>\n<tr>\n<td>viewType<\/td>\n<td>contentType<\/td>\n<\/tr>\n<tr>\n<td>stable id<\/td>\n<td>key<\/td>\n<\/tr>\n<tr>\n<td>DiffUtil과 payload로 바뀐 부분만 갱신<\/td>\n<td>key로 정체성 유지, 입력이 같은 항목은 리컴포지션 건너뜀<\/td>\n<\/tr>\n<tr>\n<td>setInitialPrefetchItemCount와 prefetch<\/td>\n<td>LazyLayoutCacheWindow<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre class=\"kotlin\"><code>// 개념 코드: PlaceUi, PlaceViewHolder, FavoriteChanged(payload 표시용 object)는 생략\nclass PlaceAdapter : ListAdapter&lt;PlaceUi, PlaceViewHolder&gt;(Diff) {\n    object Diff : DiffUtil.ItemCallback&lt;PlaceUi&gt;() {\n        override fun areItemsTheSame(oldItem: PlaceUi, newItem: PlaceUi) = oldItem.id == newItem.id\n        override fun areContentsTheSame(oldItem: PlaceUi, newItem: PlaceUi) = oldItem == newItem\n        override fun getChangePayload(oldItem: PlaceUi, newItem: PlaceUi): Any? =\n            if (oldItem.copy(isFavorite = newItem.isFavorite) == newItem) FavoriteChanged else null\n    }\n    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) = PlaceViewHolder.create(parent)\n    override fun onBindViewHolder(holder: PlaceViewHolder, position: Int) = holder.bind(getItem(position))\n    override fun onBindViewHolder(holder: PlaceViewHolder, position: Int, payloads: MutableList&lt;Any&gt;) {\n        if (FavoriteChanged in payloads) holder.bindFavorite(getItem(position).isFavorite)\n        else super.onBindViewHolder(holder, position, payloads)   // payload가 없으면 전체 bind\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>스크롤 중 버벅이면 무엇부터 봅니까?<\/strong> 트레이스에서 onCreateViewHolder가 스크롤 중에도 계속 불리는지와 onBindViewHolder가 무거운지를 나눠 봅니다. 풀은 viewType별로 나뉘므로 타입을 지나치게 잘게 나누면 재사용이 줄어 inflate가 늘어납니다.<\/li>\n<li><strong>ListAdapter를 쓰는데 항목이 갱신되지 않으면?<\/strong> 같은 리스트 인스턴스를 고쳐 다시 넘겼거나, 항목 객체를 직접 수정해 이전 리스트와 새 리스트가 같은 객체를 가리키는 경우입니다. 둘 다 차이가 없다고 판단되므로 불변 data class와 copy로 새 객체와 새 리스트를 만듭니다.<\/li>\n<li><strong>stable id와 DiffUtil은 함께 써야 합니까?<\/strong> ListAdapter는 DiffUtil이 항목의 정체성을 판단하므로 stable id가 필수는 아닙니다. stable id는 notifyDataSetChanged를 써야 하는 어댑터에서 RecyclerView가 구조 변경을 추정해 View를 유지하고 애니메이션하게 할 때 의미가 큽니다.<\/li>\n<li><strong>목록 구조에 따라 더 하는 설정은 무엇입니까?<\/strong> 어댑터 내용이 RecyclerView 크기에 영향을 주지 않으면 setHasFixedSize(true)로 항목이 바뀔 때마다 전체 레이아웃을 무효화하지 않게 합니다. 세로 목록 안에 가로 RecyclerView가 여러 줄 있으면 안쪽 RecyclerView들이 setRecycledViewPool로 같은 풀을 써서 줄마다 ViewHolder를 새로 만들지 않게 하고, 안쪽 LinearLayoutManager의 setInitialPrefetchItemCount에 한 줄에 처음 보이는 항목 수를 줍니다. 기본값은 2개라 한 줄에 4개가 보이면 4를 주어, 줄이 화면에 들어오기 전에 4개를 미리 만들고 묶게 합니다.<\/li>\n<\/ul>"}]},{"no":6,"title":"성능, 안정성, 보안, 배포","qs":[{"no":107,"t":"앱 시작 시간은 어떻게 측정하고 줄입니까?","a":"<p>시작 시간은 콜드 스타트를 기준으로 TTID와 TTFD 두 지표로 봅니다. 현장 값은 Android vitals와 ApplicationStartInfo로, 개발 중 값은 Macrobenchmark의 StartupTimingMetric으로 재고, 줄일 때는 Application.onCreate와 ContentProvider에 몰린 초기화를 덜어 내고, 첫 화면을 캐시로 먼저 그리고, Baseline Profile로 첫 실행의 코드 실행 비용을 줄입니다.<\/p>\n<p>시작은 세 가지로 나뉩니다. 콜드 스타트는 프로세스가 없어서 프로세스 생성, Application 생성, 첫 Activity 생성과 첫 그리기를 모두 하는 경우입니다. 웜 스타트는 프로세스는 남아 있지만 Activity를 onCreate부터 다시 만드는 경우이고, 시스템이 앱을 메모리에서 내보낸 뒤 저장된 상태로 다시 여는 경우도 공식 문서는 웜 스타트로 분류합니다. 핫 스타트는 Activity가 메모리에 남아 있어 앞으로 가져오기만 하는 경우입니다. 콜드 스타트를 줄이면 나머지도 함께 좋아지므로 콜드 스타트를 기준으로 최적화합니다. TTID는 첫 프레임이 그려질 때까지의 시간으로 프레임워크가 자동으로 보고하고, Logcat의 ActivityManager Displayed 줄로 볼 수 있습니다. TTFD는 네트워크나 디스크에서 읽는 주요 콘텐츠까지 보여 앱을 쓸 수 있게 된 시간이라 앱이 reportFullyDrawn()으로 알려야 하고, Compose에서는 ReportDrawnWhen이나 ReportDrawnAfter를 씁니다. Play Console은 TTID 기준으로 콜드 5초, 웜 2초, 핫 1초 이상을 느린 시작으로 셉니다.<\/p>\n<p>개발 중에는 Macrobenchmark에서 StartupMode.COLD로 여러 번 실행해 timeToInitialDisplayMs와 timeToFullDisplayMs의 중앙값을 비교하고, 에뮬레이터가 아닌 실기기에서 잽니다. 어디가 느린지는 Perfetto 트레이스의 Android App Startups 구간 안에서 bindApplication, Activity 생성, 첫 컴포지션 중 무엇이 긴지 봅니다. 현장에서는 vitals의 시작 시간 분포를 보고, Android 15부터는 ApplicationStartInfo로 이번 시작이 콜드, 웜, 핫 중 무엇이었는지, 프로세스가 무엇 때문에 시작되었는지, 단계별 시각을 앱이 직접 모을 수 있습니다. Android 16은 시작을 일으킨 컴포넌트 유형을 알려 주는 getStartComponent()를 더했습니다.<\/p>\n<p>줄이는 방법에는 순서가 있습니다. 라이브러리마다 ContentProvider로 자동 초기화하면 Application.onCreate보다 먼저, 정해지지 않은 순서로 실행되므로 App Startup의 Initializer로 모으고, 첫 화면에 필요 없는 SDK는 자동 초기화를 끈 뒤(tools:node=\"remove\") 실제로 쓸 때 초기화합니다(5절의 프로세스 시작 문항). Application.onCreate에서는 디스크 I/O, 큰 객체 그래프 생성, 네트워크 호출을 하지 않습니다. 첫 화면은 마지막으로 저장한 데이터를 먼저 그리고 새 데이터는 뒤에서 받아 갱신합니다. Android 12부터 시스템 스플래시가 자동으로 뜨므로 별도 스플래시 Activity를 두지 않고 Splash Screen API를 쓰며, setKeepOnScreenCondition은 매 프레임 전에 평가되므로 가벼운 로컬 설정 읽기 정도에만 씁니다. ApplicationStartInfo로 브로드캐스트나 Job 때문에 시작된 프로세스임을 알면 UI용 라이브러리 초기화를 건너뛸 수도 있습니다.<\/p>\n<pre class=\"kotlin\"><code>@Composable\nfun HomeRoute(viewModel: HomeViewModel = hiltViewModel()) {\n    val state by viewModel.uiState.collectAsStateWithLifecycle()\n    // 캐시든 서버 응답이든 첫 내용이 다 그려지면 TTFD를 보고한다\n    ReportDrawnWhen { !state.isLoading }\n    HomeScreen(state)\n}<\/code><\/pre>","f":"<ul>\n<li><strong>TTID만 좋으면 되지 않습니까?<\/strong> 빈 화면을 빨리 띄우고 내용을 늦게 채우면 TTID는 좋아 보여도 사용자는 기다립니다. TTFD를 함께 보고 둘 사이 간격을 줄입니다. ART도 TTID와 TTFD 데이터를 이후 시작 코드의 사전 컴파일 최적화에 쓰므로 reportFullyDrawn은 실제로 쓸 수 있게 된 시점에 부릅니다.<\/li>\n<li><strong>스플래시를 길게 보여 주면 느린 시작을 가릴 수 있습니까?<\/strong> 가릴 수 없습니다. 스플래시는 첫 프레임이 그려지면 사라지는 창이라, 조건으로 붙잡은 시간만큼 사용자가 앱을 쓰는 시점이 늦어집니다. 별도 스플래시 Activity는 Android 12 이상에서 스플래시를 두 번 보이게 하고 시작 지연도 늘리므로 Splash Screen API로 옮깁니다.<\/li>\n<li><strong>최근 장소가 하나도 없는 신규 사용자는 TTFD를 언제 보고합니까?<\/strong> 조건을 데이터 유무가 아니라 로딩 완료로 둡니다. 빈 목록도 다 그려진 상태이므로, 목록이 비어 있지 않을 때로 조건을 걸면 신규 사용자에게서 보고가 빠지고 측정값이 왜곡됩니다.<\/li>\n<\/ul>"},{"no":108,"t":"Baseline Profile과 Startup Profile은 무엇이고, 왜 빨라지며, 어떻게 만들고 검증합니까?","a":"<p>Baseline Profile은 시작과 핵심 사용자 흐름에서 쓰는 클래스와 메서드 목록을 앱과 함께 배포해, 설치할 때 ART가 그 부분을 미리 AOT 컴파일하게 하는 파일입니다. Startup Profile은 그중 시작 경로만 담은 부분집합으로, 기기가 아니라 빌드 때 R8이 DEX 배치를 바꾸는 데 씁니다. 공식 문서는 Baseline Profile로 첫 실행부터 코드 실행이 약 30% 빨라지고, Startup Profile을 더하면 Baseline Profile만 쓸 때보다 시작이 보통 15~30% 빨라진다고 적습니다.<\/p>\n<p>빨라지는 이유는 ART의 컴파일 방식에 있습니다. 프로필이 없으면 앱 코드는 인터프리터로 돌다가 자주 쓰는 부분이 JIT로 메모리에서 컴파일되고, 기기가 쉴 때 백그라운드에서 사용 기록을 바탕으로 AOT 컴파일됩니다(10절의 JVM과 ART 문항). 그래서 설치나 업데이트 직후의 첫 실행이 가장 느립니다. Google Play는 실제 사용자 실행 기록을 모은 클라우드 프로필도 배포하지만, 업데이트 뒤 몇 시간에서 며칠이 지나야 퍼지고, Android 9(API 28) 이상에서만 쓰이며, 사용자가 충분히 많은 앱에서만 잘 작동합니다. Baseline Profile은 이 공백을 메웁니다. AGP가 규칙을 바이너리 파일(assets/dexopt/baseline.prof)로 넣고 Play가 APK와 함께 내려보내면, 설치 중 ART가 목록의 메서드를 AOT 컴파일합니다. Android 7~8.1에서는 앱에 넣은 profileinstaller 라이브러리가 첫 실행 때 프로필을 설치합니다. Startup Profile은 시작에 필요한 코드가 주 DEX 파일에 모이도록 배치를 바꿉니다. R8이 켜져 있어야 하고(isMinifyEnabled = true), DEX 레이아웃 최적화는 AGP 8.3부터 기본 활성이며, Baseline Profile과 달리 라이브러리가 기여할 수 없습니다.<\/p>\n<p>만들 때는 Macrobenchmark 모듈에 BaselineProfileRule로 시작, 검색, 목록 스크롤 같은 핵심 흐름을 실행하는 생성 테스트를 쓰고, androidx.baselineprofile Gradle 플러그인의 generateBaselineProfile 작업으로 돌립니다. 시작에 꼭 필요한 흐름만 includeInStartupProfile = true로 표시하면 Startup Profile도 함께 나옵니다. 생성용 빌드는 난독화와 최적화를 끈 변형이어야 규칙이 원래 메서드 이름과 맞고, 릴리스 빌드는 R8을 켜 두면 R8이 규칙을 난독화된 이름에 맞게 바꿔 적용합니다. 플러그인이 이 설정을 알아서 맞춰 줍니다. 생성은 루팅 기기, Android 13 이상 기기, aosp 시스템 이미지의 Gradle Managed Device에서 할 수 있어 CI에 넣기 좋습니다.<\/p>\n<p>검증은 같은 Macrobenchmark를 CompilationMode만 바꿔 비교합니다. None()은 프로필 없는 새 설치라 대개 최악의 경우이고, Partial(BaselineProfileMode.Require)는 Baseline Profile을 적용한 새 설치입니다. Full()은 전체 컴파일이라 실제 사용자 상태와는 다르지만 JIT 잡음을 없앤 기준으로 씁니다. Require 모드는 대상 앱에 프로필이나 profileinstaller가 없으면 예외를 던지므로 프로필이 빠진 빌드를 잡아 냅니다. 결과는 중앙값과 백분위로 비교하고, 실기기에서 잽니다.<\/p>\n<pre class=\"kotlin\"><code>@RunWith(AndroidJUnit4::class)\nclass ColdStartupBenchmark {\n    @get:Rule val rule = MacrobenchmarkRule()\n    @Test fun none() = startup(CompilationMode.None())          // 프로필 없는 새 설치\n    @Test fun baseline() = startup(CompilationMode.Partial(BaselineProfileMode.Require))\n\n    private fun startup(mode: CompilationMode) = rule.measureRepeated(\n        packageName = &quot;com.example.app&quot;,\n        metrics = listOf(StartupTimingMetric()),\n        compilationMode = mode,\n        iterations = 10,\n        startupMode = StartupMode.COLD,\n        setupBlock = { pressHome() },\n    ) { startActivityAndWait() }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Play가 아닌 경로로 설치하면 효과가 있습니까?<\/strong> Play 밖의 배포 경로는 설치 때 프로필을 쓰지 않을 수 있어서, 백그라운드 dexopt가 돌 때까지 효과가 늦게 나타납니다. Play 내부 앱 공유도 Baseline Profile을 지원하지 않고 내부 테스트 트랙은 지원하므로, 성능 확인용 빌드는 내부 테스트 트랙으로 배포합니다.<\/li>\n<li><strong>모든 코드를 프로필에 넣으면 더 빠르지 않습니까?<\/strong> 그렇지 않습니다. Android 5~6의 전체 AOT 방식은 설치 시간, RAM과 저장 공간을 늘리고 디스크에서 코드를 읽는 시간도 늘려 콜드 스타트를 오히려 늦출 수 있었습니다. 프로필은 자주 쓰는 경로만 담고, 컴파일된 baseline.prof가 1.5MB보다 작아야 ART가 기기에서 씁니다.<\/li>\n<li><strong>프로필은 언제 다시 만듭니까?<\/strong> 코드 경로가 바뀌면 규칙이 실제 실행 경로와 어긋나므로 릴리스마다 CI에서 다시 생성하고, 생성된 파일의 차이를 리뷰하며, CompilationMode 비교 벤치마크로 효과가 줄지 않았는지 확인합니다(이 절의 CI/CD 문항).<\/li>\n<\/ul>"},{"no":109,"t":"R8은 무엇을 하고, full mode에서 자주 생기는 문제와 keep 규칙은 어떻게 관리합니까?","a":"<p>R8은 릴리스 빌드에서 쓰지 않는 코드와 리소스를 지우고, 인라이닝과 클래스 병합 같은 최적화를 하고, 이름을 짧게 바꾸는 난독화까지 한 뒤 DEX를 만드는 컴파일러입니다. AGP 8.0부터 full mode가 기본이라 리플렉션과 직렬화처럼 런타임에 이름으로 코드를 찾는 곳이 가장 자주 깨집니다. 그래서 keep 규칙은 필요한 곳만 좁게 쓰고, 라이브러리는 자기 규칙을 consumer 규칙으로 함께 배포하며, 릴리스와 같은 R8 설정의 빌드로 QA합니다.<\/p>\n<p>full mode는 코드가 리플렉션을 쓰지 않는다고 더 강하게 가정합니다. R8 문서에 따르면 -keepattributes를 적어도 Signature 같은 속성과 어노테이션은 keep 규칙에 걸린 클래스와 멤버에만 남고, 리플렉션으로만 생성하는 클래스는 직접 keep해야 하며, 한 번도 생성되지 않는다고 판단한 타입의 인스턴스는 null로 바뀔 수 있습니다. 그래서 Gson의 TypeToken처럼 제네릭 시그니처를 리플렉션으로 읽는 코드, 예전 규칙을 쓰는 Retrofit 인터페이스 프록시, suspend 함수의 제네릭 시그니처, Class.forName으로 찾는 구현 클래스가 디버그에서는 멀쩡하다가 릴리스에서만 실패합니다. AGP 9.0에서는 android.r8.strictFullModeForKeepRules 기본값이 true가 되어 -keep class A가 기본 생성자 유지를 뜻하지 않으므로, 리플렉션으로 생성하는 클래스는 생성자까지 적어야 합니다. 리플렉션이 없는 kotlinx.serialization이나 Moshi 코드 생성으로 바꾸면 규칙 자체가 줄어듭니다(1절의 JSON 파싱 문항).<\/p>\n<p>규칙 관리 원칙은 셋입니다. 첫째, 패키지 전체를 keep하는 넓은 규칙은 그 범위의 최적화를 통째로 막으므로 클래스나 멤버 단위로 좁히고, 규칙마다 이유를 주석으로 남깁니다. 둘째, 라이브러리 모듈은 consumerProguardFiles로 자기 규칙을 AAR에 넣어 앱이 내부 사정을 몰라도 되게 합니다. AGP 9.0은 consumer 규칙에 -dontoptimize 같은 전역 옵션이 있으면 라이브러리 게시를 실패시킵니다. 셋째, 기본 규칙 파일은 proguard-android-optimize.txt를 씁니다. AGP 9.0부터 getDefaultProguardFile은 이 파일만 지원합니다. AGP 9.3부터는 optimization { enable = true } 블록과 <code>src/&lt;variant&gt;/keepRules<\/code>의 .keep 파일을 쓰는 새 DSL도 생겼고, 기존 isMinifyEnabled와 isShrinkResources 방식도 계속 지원됩니다.<\/p>\n<p>난독화된 스택 트레이스는 빌드마다 나오는 mapping 파일로 되돌리므로 릴리스마다 보관하고 Play Console과 크래시 수집 도구에 올립니다. QA는 R8을 켠 빌드로 합니다. 테스트용 빌드 타입을 두더라도 R8 설정은 릴리스와 같게 하고, 그 빌드에서 주요 흐름 UI 테스트와 직렬화 왕복 테스트를 돌립니다. Play는 DEX 코드가 10MB를 넘는 앱에 최적화, 난독화, 축소 비율 25% 이상을 기준으로 두고, 이 기준에 못 미치는 앱은 2027년 2월부터 스토어 노출에 영향을 받을 수 있습니다. 문제가 난다고 R8을 끄는 것은 답이 아닙니다.<\/p>\n<pre><code># 리플렉션으로만 생성하는 구현체: AGP 9.0부터는 생성자도 적어야 남는다\n-keep class com.example.map.layer.TrafficLayerFactory { &lt;init&gt;(); }\n\n# Gson DTO: @SerializedName이 JSON 키를 정하므로 필드는 남기되 이름은 바뀌어도 된다\n-keepclassmembers,allowobfuscation class * {\n    @com.google.gson.annotations.SerializedName &lt;fields&gt;;\n}<\/code><\/pre>","f":"<ul>\n<li><strong>릴리스에서만 나는 문제가 R8 때문인지 어떻게 좁힙니까?<\/strong> R8 설정만 다른 두 빌드로 재현 여부를 비교하고, mapping 파일에서 문제 클래스가 남았는지, 이름이 바뀌었는지 확인합니다. mapping에 아예 없으면 축소로 지워진 것이고, 이름이 바뀌었다면 이름으로 찾는 코드가 원인입니다.<\/li>\n<li><strong>난독화된 스택 트레이스의 줄 번호는 어떻게 지킵니까?<\/strong> R8 8.2부터 원래 소스 파일 이름을 mapping에 남기고, API 26 이상을 대상으로 하면 -keepattributes LineNumberTable 없이도 줄 정보를 남깁니다. AGP 8.6부터는 모든 minSdk에서 파일 이름과 줄 번호를 되돌릴 수 있고, AGP 8.12부터 Android Studio Logcat이 자동으로 되돌려 보여 줍니다.<\/li>\n<li><strong>라이브러리를 올렸더니 릴리스에서만 이상하게 동작하면?<\/strong> 라이브러리의 consumer 규칙이 바뀌었거나 새 리플렉션 경로가 생긴 경우가 많고, R8 최적화와 라이브러리의 상호작용 결함일 수도 있습니다. kotlinx.coroutines 1.11.0이 R8 최적화 때문에 shareIn과 stateIn 코루틴이 GC될 수 있던 문제를 고친 사례처럼, 릴리스 노트를 확인하고 R8을 켠 빌드로 회귀 테스트를 돌립니다.<\/li>\n<\/ul>"},{"no":110,"t":"화면 버벅임은 어떻게 측정하고 원인을 찾습니까?","a":"<p>버벅임은 프레임이 화면 주사율이 정한 시간 안에 완성되지 못해 생기므로, 먼저 어느 화면의 어떤 동작에서 얼마나 많은 프레임이 늦는지 숫자로 고정합니다. 현장은 JankStats와 Android vitals로, 개발 중에는 Macrobenchmark의 FrameTimingMetric으로 재고, 원인은 Perfetto 시스템 트레이스에서 늦은 프레임의 메인 스레드와 RenderThread가 각각 무엇을 했는지 보고 찾습니다. 고친 뒤에는 같은 기기, 같은 빌드 조건, 같은 시나리오로 다시 잽니다.<\/p>\n<p>프레임 예산은 주사율로 정해집니다. 1초를 주사율로 나누면 60Hz는 16.7ms, 90Hz는 11.1ms, 120Hz는 8.3ms이고, 이 안에 메인 스레드가 입력 처리, 애니메이션, 측정, 배치, 그리기 기록을 끝내고 RenderThread가 GPU 명령을 보내야 합니다(5절의 프레임 문항). Android vitals는 16ms를 넘은 프레임이 50%를 넘는 일일 세션의 비율을 excessive slow frames로, 700ms를 넘은 프레임이 0.1%를 넘는 일일 세션의 비율을 excessive frozen frames로 셉니다. 사용자가 느끼는 버벅임은 평균이 아니라 느린 쪽 꼬리에 있으므로 P90, P99 같은 백분위로 봅니다.<\/p>\n<p>도구는 목적에 따라 나눕니다. JankStats는 API 24 이상에서 FrameMetrics API 위에서 동작하고, 늦은 프레임과 그때의 UI 상태(어느 화면인지, 스크롤 중인지)를 함께 기록해 현장 수집에 맞습니다. Macrobenchmark의 FrameTimingMetric은 스크롤 같은 시나리오를 자동으로 반복하며 frameDurationCpuMs(메인 스레드와 RenderThread에서 프레임을 만드는 데 쓴 CPU 시간)와 frameOverrunMs(마감을 넘긴 시간, Android 12 이상)를 백분위로 내므로 변경 전후 비교와 회귀 감시에 씁니다. Perfetto에서는 Android 12 이상이면 FrameTimeline의 Expected Timeline과 Actual Timeline을 비교해 마감을 놓친 프레임을 바로 찾고, 그 시간대의 메인 스레드에서 측정, 배치, 리컴포지션, 디스크 읽기, 락 대기 중 무엇이 길었는지, RenderThread가 오래 걸렸는지 봅니다. 스레드 상태가 Runnable로 오래 남아 있으면 CPU를 받지 못한 것이고, Sleeping이면 락이나 Binder 응답을 기다린 것인지 확인합니다. androidx.tracing으로 앱 구간에 이름을 붙이면 트레이스에서 바로 보입니다.<\/p>\n<p>흔한 원인은 메인 스레드의 디스크와 DB 읽기, 원본 크기 비트맵 디코딩, 넓은 범위의 과도한 리컴포지션, 깊게 중첩된 레이아웃의 반복 측정, 짧은 시간에 객체를 많이 만들어 생기는 GC, 첫 실행의 JIT입니다. Compose 화면이라면 Layout Inspector의 리컴포지션 횟수와 컴파일러 보고서로 범위를 좁힙니다(3절의 Compose 성능 문제 문항). 측정은 R8을 켠 릴리스 빌드에 Baseline Profile을 적용하고, 주사율과 배터리 상태를 맞춘 실기기에서 합니다. Macrobenchmark도 에뮬레이터나 배터리가 부족한 기기에서는 결과를 믿을 수 없다며 오류를 냅니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 현장에서 버벅인 프레임을 화면 상태와 함께 모은다\nval holder = PerformanceMetricsState.getHolderForHierarchy(binding.root)\nholder.state?.putState(&quot;screen&quot;, &quot;search_result&quot;)\n\njankStats = JankStats.createAndTrack(window) { frame -&gt;\n    // FrameData는 프레임마다 재사용되므로 보관할 값은 복사해서 넘긴다\n    if (frame.isJank) jankRecorder.record(frame.frameDurationUiNanos, frame.states.toList())\n}\n// onResume에서 jankStats.isTrackingEnabled = true, onPause에서 false<\/code><\/pre>","f":"<ul>\n<li><strong>JankStats와 vitals의 수치가 다르면 무엇을 믿습니까?<\/strong> 기준이 다릅니다. vitals는 16ms 고정 기준으로 세션 단위 비율을 세고, JankStats는 기본으로 현재 주사율 기준 프레임 시간의 두 배를 넘으면 버벅임으로 보며 jankHeuristicMultiplier로 조정합니다. vitals는 스토어 기준을 지키는 지표로, JankStats는 화면별 원인을 찾는 지표로 씁니다.<\/li>\n<li><strong>JankStats 콜백에서 서버로 바로 보내도 됩니까?<\/strong> 안 됩니다. 콜백은 프레임마다 불리고 Android 7 이상에서는 FrameMetrics용 스레드에서 실행되므로 빨리 반환해야 합니다. 메모리에서 집계했다가 묶어서 보냅니다.<\/li>\n<li><strong>목록 첫 스크롤만 버벅이면 무엇을 의심합니까?<\/strong> 아직 컴파일되지 않은 코드의 JIT, 처음 만드는 항목의 컴포지션이나 inflate, 캐시가 빈 이미지 디코딩입니다. 스크롤 흐름을 Baseline Profile 생성 테스트에 넣고, 같은 시나리오를 CompilationMode.None()과 Baseline Profile 적용 상태로 비교해 확인합니다.<\/li>\n<\/ul>"},{"no":111,"t":"메모리 누수는 왜 생기고 어떻게 찾습니까?","a":"<p>GC는 GC 루트에서 참조로 닿을 수 있는 객체를 회수하지 않으므로, 더는 쓰지 않는데 더 오래 사는 객체가 여전히 참조하는 객체가 누수입니다. Android에서는 싱글턴, 등록한 리스너, 끝나지 않는 코루틴, Handler 메시지처럼 화면보다 오래 사는 것이 Activity, View, Context를 붙잡는 형태가 대부분입니다. 개발 중에는 LeakCanary로 잡고 Android Studio 힙 덤프로 참조 경로를 확인하며, 고칠 때는 등록과 해제를 같은 생명주기 쌍에 둡니다.<\/p>\n<p>Activity 하나가 새면 그 View 계층과 리소스, Compose라면 컴포지션 트리와 상태까지 함께 남아서 작은 참조 하나가 큰 메모리가 됩니다. 흔한 경로는 다섯 가지입니다. 첫째, 싱글턴이나 앱 범위 객체가 Activity Context나 View를 필드로 받는 경우로, 오래 사는 객체에는 Application Context만 넘깁니다(5절의 Context 문항). ViewModel이 Activity나 View를 들고 있으면 구성 변경 뒤에도 이전 Activity가 남는 것도 같은 문제입니다. 둘째, 위치, 센서, 지도 SDK 콜백처럼 등록하고 해제하지 않은 리스너입니다. 등록받은 쪽이 리스너를 강하게 잡으므로 onStart와 onStop처럼 짝을 맞춰 해제하고, Compose에서는 DisposableEffect의 onDispose에서 해제합니다. 셋째, GlobalScope나 앱 범위 스코프에서 시작한 코루틴이 화면 객체를 캡처한 경우로, 화면 작업은 viewModelScope나 lifecycleScope에서 하고 callbackFlow는 awaitClose에서 콜백을 해제합니다(2절의 콜백 기반 API 문항). 넷째, postDelayed로 넘긴 람다나 익명 클래스가 Activity를 캡처하면 메시지가 실행될 때까지 메인 Looper의 MessageQueue가 Activity를 붙잡습니다(5절의 Looper와 Handler 문항). 다섯째, Fragment는 백 스택에 들어갈 때 View만 파괴되므로 binding 필드가 이전 View 계층을 붙잡습니다. onDestroyView에서 binding을 null로 지웁니다(5절의 Fragment 생명주기 문항).<\/p>\n<p>LeakCanary는 디버그 빌드에만 넣는 라이브러리로, 생명주기에 연결해 파괴된 Activity, Fragment, Fragment의 View, clear된 ViewModel을 ObjectWatcher의 약한 참조로 감시합니다. 5초를 기다리고 GC를 실행한 뒤에도 약한 참조가 비지 않으면 retained로 보고, 그 수가 기본 임계값(앱이 보이면 5개, 보이지 않으면 1개)에 이르면 힙 덤프를 떠서 Shark로 분석합니다. 결과는 GC 루트부터 그 객체까지의 참조 경로인 leak trace이고, 같은 원인은 서명으로 묶으며 서드파티의 알려진 버그로 생긴 누수는 Library Leak으로 따로 분류합니다. 읽을 때는 경로에서 끊겨야 할 참조 하나를 찾습니다. UI 테스트에는 leakcanary-android-instrumentation의 DetectLeaksAfterTestSuccess 규칙이나 LeakAssertions.assertNoLeaks()를 넣어 누수를 테스트 실패로 만들고 CI에서 회귀를 막습니다.<\/p>\n<p>Android Studio 프로파일러에서는 힙 덤프를 떠서 Show activity/fragment leaks 필터로 파괴됐는데 남은 Activity와 Fragment를 거르고, 직접 찾을 때는 Retained Size가 큰 객체부터 References 탭으로 누가 잡고 있는지 따라갑니다. 공식 문서는 화면 회전을 여러 번 반복하거나 홈으로 갔다가 돌아오는 동작을 누수를 드러내는 방법으로 들고, Compose 화면에서는 Context를 캡처한 람다나 상태 홀더, onDispose에서 정리하지 않은 리스너를 보라고 적습니다.<\/p>\n<pre class=\"kotlin\"><code>class GuidanceActivity : ComponentActivity() {\n    private val handler = Handler(Looper.getMainLooper())\n    fun remindWithHandler() {\n        // 람다가 Activity를 캡처한 채 메인 Looper의 MessageQueue에 30초 동안 남는다\n        handler.postDelayed({ showRerouteHint() }, 30_000)\n    }\n    fun remindWithLifecycle() {\n        // 생명주기 스코프의 delay는 Activity가 파괴되면 함께 취소된다\n        lifecycleScope.launch { delay(30_000); showRerouteHint() }\n    }\n    override fun onDestroy() {\n        handler.removeCallbacksAndMessages(null)   // Handler를 쓴다면 화면이 끝날 때 지운다\n        super.onDestroy()\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>WeakReference로 감싸면 해결됩니까?<\/strong> 증상은 가려지지만 콜백이 언제 사라질지 모르게 되어 동작이 비결정적이 됩니다. 생명주기에 맞춰 해제하는 것이 근본 해결이고, WeakReference는 소유 관계가 없어 수명이 서로 독립적인 객체를 가리킬 때만 씁니다.<\/li>\n<li><strong>릴리스 빌드에서 생기는 누수는 어떻게 압니까?<\/strong> LeakCanary는 디버그용이라 현장에서는 간접 신호를 봅니다. vitals의 memory usage가 릴리스 뒤에 올랐는지, ApplicationExitInfo에 저메모리 종료가 늘었는지 보고, 현장에서 힙 덤프를 받는 방법은 이 절의 OOM 문항에서 다룹니다.<\/li>\n<li><strong>ViewModel에서 Context가 필요하면 어떻게 합니까?<\/strong> Activity Context를 넘기지 않고 Hilt의 @ApplicationContext나 AndroidViewModel의 Application을 씁니다. 문자열 리소스처럼 화면 구성에 따라 달라지는 값은 리소스 ID로 상태에 담아 UI에서 풉니다.<\/li>\n<\/ul>"},{"no":112,"t":"OOM은 어떻게 예방하고, 메모리 사용량은 무엇으로 봅니까?","a":"<p>OutOfMemoryError는 대개 기기 메모리가 바닥나서가 아니라 앱 프로세스의 Java 힙 한도를 넘는 할당에서 납니다. 예방은 원본 크기 비트맵 같은 큰 할당을 표시 크기로 줄이고, 캐시에 바이트 단위 상한을 두고, 누수를 없애는 것이며, largeHeap으로 한도를 올리는 것은 원인을 가릴 뿐입니다. 사용량은 개발 중에 dumpsys meminfo의 PSS와 private dirty, 힙 덤프로 보고, 현장에서는 Android vitals의 memory usage로 봅니다.<\/p>\n<p>힙 한도는 기기마다 다르고 ActivityManager.getMemoryClass()가 MB 단위로 알려 줍니다. largeHeap=\"true\"는 getLargeMemoryClass() 크기의 힙을 요청하지만, 공식 문서는 대부분의 앱에는 필요 없으니 전체 사용량을 줄이는 데 집중하라고 하고, 메모리가 제한된 기기에서는 getMemoryClass()와 같을 수 있다고 적습니다. 한도가 Java 힙에만 걸린다는 점도 중요합니다. Android 8.0(API 26)부터 비트맵 픽셀은 네이티브 힙에 있어서, 큰 비트맵은 OutOfMemoryError 대신 프로세스 메모리를 키우고 저메모리 종료나 Android 17의 RAM 기반 앱 메모리 한도 종료로 나타날 수 있습니다. OOM이 없다고 메모리 문제가 없는 것이 아닙니다. 반대로 힙이 여유로워도 스레드를 지나치게 많이 만들어 새 스레드의 스택을 할당하지 못하면 OutOfMemoryError가 나므로, 라이브러리마다 스레드 풀을 따로 두거나 스레드를 직접 만드는 코드도 함께 봅니다.<\/p>\n<p>예방은 큰 것부터 합니다. 비트맵 메모리는 가로 × 세로 × 픽셀당 바이트이고 ARGB_8888은 픽셀당 4바이트라, 4,000×3,000 사진을 그대로 디코딩하면 4,800만 바이트입니다. inJustDecodeBounds로 크기만 먼저 읽고 inSampleSize로 줄여 디코딩하거나(4면 가로세로 1/4, 픽셀 수 1/16) API 28부터 있는 ImageDecoder의 setTargetSize를 쓰며, 실무에서는 이미지 로딩 라이브러리가 표시 크기로 디코딩합니다(이 절의 이미지 로딩 문항). 캐시는 항목 수가 아니라 바이트로 상한을 두고(8절의 LRU 캐시 문항) isLowRamDevice()가 true인 기기에서는 더 줄입니다. 백그라운드로 가면 onTrimMemory의 TRIM_MEMORY_UI_HIDDEN에서 화면용 큰 할당을, TRIM_MEMORY_BACKGROUND에서 다시 만들기 쉬운 캐시를 놓습니다(5절의 메모리 부족 문항). 큰 JSON을 문자열 하나로 읽거나 긴 목록을 한 번에 메모리에 올리지 않고 스트리밍 파싱과 Paging을 씁니다.<\/p>\n<p>지표는 뜻을 알고 봅니다. RSS는 공유 라이브러리와 Zygote에서 물려받은 공유 페이지까지 통째로 세어 크게 보이고, PSS는 공유 페이지를 공유하는 프로세스 수로 나눠 세는 dumpsys meminfo의 기본 지표이며, private dirty는 그 앱만 쓰고 버릴 수도 없는 메모리입니다. meminfo는 Java Heap, Native Heap, Code, Stack, Graphics로 나눠 보여 주므로, Java 힙은 작은데 합계가 크면 비트맵, NDK 라이브러리, 지도 렌더링 엔진, WebView 같은 네이티브 쪽을 의심하고 Android Studio 프로파일러의 네이티브 할당 기록이나 Perfetto로 좁힙니다. Java 쪽은 힙 덤프에서 Retained Size가 큰 객체와 중복 비트맵을 봅니다. 현장 지표인 vitals의 memory usage는 Anonymous RSS + Swap으로 재므로 공유 페이지와 파일 페이지는 빠지고, 앱이 만든 익명 메모리와 zRAM으로 밀려난 양이 함께 들어갑니다. 기준은 RAM 등급과 앱 상태별로 다르고(예: 8 GB 등급 포그라운드 2.25 GB, 백그라운드 1.50 GB), 넘는 앱은 2027년 2월부터 스토어 노출에 영향을 받을 수 있습니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 표시 크기에 맞춰 줄여 디코딩한다(실무에서는 이미지 로딩 라이브러리가 처리)\nfun decodeSampled(file: File, reqW: Int, reqH: Int): Bitmap? {\n    val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }\n    BitmapFactory.decodeFile(file.path, bounds)            // 픽셀 없이 크기만 읽는다\n    var sample = 1\n    while (bounds.outWidth / (sample * 2) &gt;= reqW &amp;&amp; bounds.outHeight / (sample * 2) &gt;= reqH) {\n        sample *= 2\n    }\n    val opts = BitmapFactory.Options().apply { inSampleSize = sample }\n    return BitmapFactory.decodeFile(file.path, opts)       // 가로세로 1/sample로 디코딩\n}<\/code><\/pre>","f":"<ul>\n<li><strong>largeHeap을 켜면 OOM이 사라지지 않습니까?<\/strong> 한도가 늘어나는 기기에서는 터지는 시점이 늦어질 뿐 원본 크기 비트맵, 상한 없는 캐시, 누수는 그대로이고, 메모리가 제한된 기기에서는 한도가 늘지도 않습니다. 원인을 줄인 뒤에도 필요하면 메모리를 많이 쓰는 독립 작업만 별도 프로세스로 떼어 내는 방법을 검토합니다.<\/li>\n<li><strong>OOM 스택 트레이스가 가리키는 코드가 원인입니까?<\/strong> 대개 아닙니다. 마지막 할당이 실패한 지점일 뿐 힙을 채운 것은 다른 객체일 수 있으므로, 힙 덤프의 Retained Size로 실제 소유자를 찾고 같은 시나리오를 반복해 계속 늘어나는 객체를 봅니다.<\/li>\n<li><strong>현장의 메모리 문제는 어떻게 잡습니까?<\/strong> Android 15의 ProfilingManager로 현장 기기에서 heap dump와 heap profile을 받고, Android 17에서는 ProfilingTrigger.TRIGGER_TYPE_ANOMALY로 메모리 한도에 닿을 때 heap dump를 받을 수 있습니다. 한도 종료는 ApplicationExitInfo의 REASON_OTHER와 설명의 MemoryLimiter:AnonSwap으로 구분합니다.<\/li>\n<\/ul>"},{"no":113,"t":"이미지 로딩 라이브러리는 무엇을 해 주고, 목록 화면에서는 무엇을 챙깁니까?","a":"<p>Coil이나 Glide 같은 라이브러리는 네트워크나 디스크에서 이미지를 받아 표시 크기로 디코딩하고, 메모리 캐시와 디스크 캐시에 두고, 화면이 사라지거나 항목이 재사용되면 요청을 취소하는 일을 대신합니다. 목록 화면에서는 이미지 영역 크기를 정해 올바른 크기로 디코딩되게 하고, 로더를 앱에 하나만 두어 캐시를 공유하고, 서버가 표시 크기에 맞는 이미지를 주도록 협의하는 것이 핵심입니다.<\/p>\n<p>요청이 오면 먼저 메모리 캐시에서 디코딩된 비트맵을 찾고, 없으면 디스크 캐시의 바이트를, 그것도 없으면 네트워크에서 받습니다. 디코딩은 표시 영역 크기에 맞춰 줄여서 하므로 원본 해상도 비트맵을 만들지 않습니다(이 절의 OOM 문항). 크기를 모르면 이 장점이 사라집니다. Coil의 AsyncImage는 컴포저블의 제약과 ContentScale로 크기를 정하지만 rememberAsyncImagePainter는 크기를 감지하지 않아 원본 크기로 불러오므로 SizeResolver를 넘겨야 합니다. Coil 문서는 ImageLoader마다 메모리 캐시, 디스크 캐시, OkHttpClient를 따로 가지므로 하나를 만들어 앱 전체에서 공유하라고 적습니다. 요청 수명도 라이브러리가 관리합니다. Glide.with(fragment)처럼 생명주기에 묶어 요청하면 그 Activity나 Fragment가 파괴될 때 로드를 지우고 자원을 돌려받고, RecyclerView에서 재사용된 View에 새 로드를 시작하면 이전 요청이 취소됩니다. 새 로드를 시작하지 않는 항목은 clear()로 지워야 이전 결과가 늦게 들어오지 않습니다.<\/p>\n<p>Bitmap.Config.HARDWARE(API 26)는 픽셀을 그래픽 메모리에만 두는 형식이라, 앱 메모리와 GPU에 하나씩 있던 사본이 하나로 줄고 그릴 때 텍스처 업로드로 생기는 버벅임도 줄어듭니다. 대신 getPixel 같은 픽셀 읽기, 소프트웨어 Canvas에 그리기, 소프트웨어 레이어가 안 되고 비트맵마다 파일 디스크립터를 하나씩 씁니다. 그래서 Palette로 색을 뽑거나 공유 요소 전환에 쓰는 요청만 Coil의 allowHardware(false)나 Glide의 disallowHardwareConfig()로 끕니다. placeholder는 최종 이미지와 같은 크기로 두어 로딩 전후로 레이아웃이 밀리지 않게 하고, 페이드는 painter의 crossfade를 씁니다. Coil 문서는 AnimatedContent가 painter crossfade보다 훨씬 비싸고 애니메이션이 끝날 때까지 이전 이미지를 메모리에 둔다며 lazy 목록에서는 crossfade를 권합니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>Coil<\/th>\n<th>Glide<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>기반<\/td>\n<td>Kotlin 우선, 코루틴과 Okio, OkHttp나 Ktor 네트워크 모듈<\/td>\n<td>Java로 작성되어 View 기반 앱에서 오래 쓰임<\/td>\n<\/tr>\n<tr>\n<td>Compose<\/td>\n<td>AsyncImage가 기본 API이고 Compose Multiplatform 지원<\/td>\n<td>별도 Compose 통합 모듈<\/td>\n<\/tr>\n<tr>\n<td>요청 수명<\/td>\n<td>컴포지션이나 View에 묶여 자동으로 멈추고 취소<\/td>\n<td>Glide.with에 넘긴 Activity, Fragment 생명주기에 묶임<\/td>\n<\/tr>\n<tr>\n<td>메모리 설정<\/td>\n<td>ImageLoader.Builder에서 캐시 크기 지정<\/td>\n<td>MemorySizeCalculator로 메모리 캐시와 LruBitmapPool 크기 지정<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>고르는 기준은 코드베이스입니다. Compose 중심의 새 코드라면 코루틴과 Compose에 맞춘 Coil이 자연스럽고, Glide 설정과 변형이 많이 쌓인 View 코드라면 그대로 두는 비용이 더 낮습니다. 두 라이브러리를 함께 두면 캐시, 스레드, 앱 크기가 중복되므로 하나로 모읍니다. 목록에서 상세 화면으로 같은 이미지를 크게 보여 줄 때는 목록 요청의 메모리 캐시 키를 상세 요청의 placeholderMemoryCacheKey로 넘겨 깜빡임 없이 이어 보이게 합니다. 서버와는 이미지 CDN이 너비와 높이 파라미터로 줄인 이미지를 주도록 협의하고, 클라이언트는 실제 표시 픽셀 크기를 URL에 붙여 요청합니다. Coil 문서도 인터셉터로 요청 크기를 URL 쿼리에 붙이는 예를 듭니다. 작은 썸네일에 원본 사진을 받으면 다운로드, 디스크, 디코딩 비용을 모두 낭비합니다.<\/p>","f":"<ul>\n<li><strong>빠르게 스크롤할 때 이미지가 잠깐 다른 항목 것으로 바뀌는 이유는 무엇입니까?<\/strong> 재사용된 항목에 이전 요청의 결과가 늦게 도착해서입니다. 라이브러리는 같은 View나 컴포저블에 새 요청을 시작하면 이전 요청을 취소하므로 콜백으로 비트맵을 직접 넣는 코드를 두지 않고, 이미지가 없는 항목도 clear()하거나 null 모델을 넘겨 placeholder나 fallback으로 바꿉니다.<\/li>\n<li><strong>이미지 로더의 디스크 캐시와 OkHttp Cache를 둘 다 켜야 합니까?<\/strong> 같은 요청에 둘 다 켜면 같은 바이트를 두 번 저장합니다. 이미지는 로더의 디스크 캐시 하나로 두고, 로더에 넘기는 OkHttpClient는 연결 풀과 공통 설정을 공유하는 용도로 씁니다.<\/li>\n<li><strong>지도 위 마커 아이콘처럼 같은 그림을 수백 번 그릴 때도 이미지 로더를 씁니까?<\/strong> 같은 그림을 크기와 상태별로 한 번 만들어 재사용하는 편이 낫습니다. 마커마다 요청을 만들면 캐시 조회, 디코딩, 할당이 반복됩니다(7절의 지도 마커 문항).<\/li>\n<\/ul>"},{"no":114,"t":"ANR은 언제 발생하고, 원인은 어떻게 분석합니까?","a":"<p>ANR은 앱이 시스템이 정한 시간 안에 응답하지 못할 때 납니다. 가장 흔한 것은 입력 이벤트에 5초 안에 응답하지 못한 input dispatching timed out이고, 원인은 대개 메인 스레드가 디스크 I/O, 락 대기, 다른 프로세스로의 동기 Binder 호출에 묶인 것입니다. 분석은 Android vitals의 ANR 클러스터와 ApplicationExitInfo의 ANR 트레이스로 그 순간 메인 스레드가 무엇을 하고 있었는지 보고, 개발 중에는 StrictMode로 메인 스레드 I/O를 미리 잡습니다.<\/p>\n<p>기준 시간은 종류마다 다르고, AOSP와 Pixel 기준이라 OEM마다 다를 수 있습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>종류<\/th>\n<th>ANR 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>입력 이벤트<\/td>\n<td>5초 안에 응답하지 못함<\/td>\n<\/tr>\n<tr>\n<td>startForegroundService로 시작한 서비스<\/td>\n<td>5초 안에 startForeground를 부르지 않음<\/td>\n<\/tr>\n<tr>\n<td>브로드캐스트, 포그라운드 intent<\/td>\n<td>Android 13 이하 10초, Android 14 이상 10~20초<\/td>\n<\/tr>\n<tr>\n<td>브로드캐스트, 백그라운드 intent<\/td>\n<td>Android 13 이하 60초, Android 14 이상 60~120초<\/td>\n<\/tr>\n<tr>\n<td>서비스의 onCreate, onBind, onStartCommand<\/td>\n<td>포그라운드 서비스 20초, 백그라운드 서비스 200초<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>ContentProvider는 ContentProviderClient.setDetectNotResponding으로 정한 시간을 넘길 때, JobService는 onStartJob이나 onStopJob이 몇 초 안에 반환하지 않을 때 ANR이 나고 targetSdk 34 이상은 앱에 보고됩니다. Play Console의 user-perceived ANR rate는 지금 input dispatching timed out만 세며, 나쁜 동작 기준은 전체 0.47%, 기기별 8%이고 최근 28일 데이터로 평가합니다.<\/p>\n<p>공식 문서가 드는 흔한 패턴은 메인 스레드의 느린 I/O나 긴 계산, 다른 프로세스로의 동기 Binder 호출이 늦게 돌아오는 경우, 다른 스레드가 오래 잡은 synchronized 블록을 기다리는 경우, Deadlock입니다. 실무의 형태로 옮기면 이렇습니다. 화면 초기 상태를 만들다 SharedPreferences나 DB를 메인 스레드에서 처음 읽는 경우가 대표적입니다. SharedPreferences.apply는 쓰기를 뒤로 미룰 뿐이라, AOSP ActivityThread는 Activity를 멈출 때와 서비스 명령을 처리할 때 QueuedWork.waitToFinish()로 밀린 쓰기를 메인 스레드에서 기다립니다(5절의 저장소 선택 문항). ContentResolver 쿼리나 시스템 서비스 조회는 다른 프로세스를 부르는 Binder 호출이라 상대가 느리면 그대로 막힙니다. onReceive는 메인 스레드에서 실행되므로 무거운 일은 goAsync()로 넘기되 그것도 브로드캐스트 기준 시간 안에 끝내야 하고, 긴 작업은 WorkManager로 보냅니다(5절의 BroadcastReceiver 문항). 싱글턴 초기화를 synchronized로 감싸 두고 백그라운드 스레드가 오래 초기화하는 동안 메인 스레드가 같은 락을 기다리는 구조도 흔합니다.<\/p>\n<p>분석은 현장 데이터부터 봅니다. vitals는 ANR을 메인 스레드 스택으로 묶어 보여 주고, API 30부터는 다음 실행 때 ApplicationExitInfo에서 REASON_ANR 기록을 찾아 getTraceInputStream()으로 시스템이 종료 전에 남긴 트레이스를 직접 모을 수 있습니다. 트레이스는 시간 초과 순간의 스냅샷이라, 메인 스레드가 이미 메시지를 기다리는 상태로 찍혔다면 원인은 그 앞의 작업이나 시스템 쪽 지연이므로 다른 스레드의 락 보유 상태와 함께 봅니다. 기기에서는 /data/anr 아래 트레이스 파일(root 필요)이나 adb bugreport로 보고, Perfetto에서는 메인 스레드가 Running이었는지, Binder 응답이나 락을 기다리며 Sleeping이었는지 구분합니다. Android 16은 ANR 같은 조건에 시스템이 트레이스를 시작하고 멈추는 system-triggered profiling을 ProfilingManager에 더했습니다. 개발 중에는 디버그 빌드의 Application.onCreate에서 StrictMode.ThreadPolicy에 detectDiskReads, detectDiskWrites, detectNetwork를 켜고 penaltyLog로 기록해 메인 스레드 I/O를 출시 전에 찾습니다.<\/p>\n<pre class=\"kotlin\"><code>// 지난 실행의 ANR 트레이스를 다음 실행 때 모은다(API 30 이상)\nval am = context.getSystemService(ActivityManager::class.java)\nam.getHistoricalProcessExitReasons(context.packageName, 0, 5)\n    .filter { it.reason == ApplicationExitInfo.REASON_ANR }\n    .forEach { info -&gt;\n        val trace = info.traceInputStream?.bufferedReader()?.use { it.readText() }\n        anrReporter.send(info.timestamp, info.description, trace)   // 자체 수집 서버로\n    }<\/code><\/pre>","f":"<ul>\n<li><strong>사용자는 ANR 대화상자를 본 적이 없다는데 ANR이 잡히는 이유는 무엇입니까?<\/strong> 백그라운드 ANR 대화상자는 개발자 옵션의 Show all ANRs를 켰을 때만 보이므로, 브로드캐스트나 서비스의 ANR은 사용자가 모르는 사이 프로세스 종료로 끝납니다. user-perceived ANR rate에는 입력 ANR만 들어가지만, 백그라운드 ANR도 알림 누락이나 동기화 실패로 나타나므로 함께 고칩니다.<\/li>\n<li><strong>코루틴으로 바꿨는데도 ANR이 나는 이유는 무엇입니까?<\/strong> Dispatchers.Main에서 블로킹 호출을 그대로 하거나, runBlocking으로 메인 스레드를 막거나, 백그라운드 코루틴이 메인 스레드도 쓰는 락을 오래 잡는 경우입니다. suspend 함수라고 main-safe한 것은 아니므로 블로킹 호출을 감싼 함수가 withContext로 스스로 디스패처를 바꾸게 합니다(2절의 Dispatchers 문항).<\/li>\n<li><strong>5초 안에만 끝나면 메인 스레드를 써도 됩니까?<\/strong> 5초는 목표가 아닙니다. 그 전에 프레임이 수백 ms씩 멈추면 사용자는 이미 앱이 멈췄다고 느끼고 vitals의 excessive frozen frames(700ms를 넘는 프레임 기준)에도 잡히므로, 메인 스레드 작업은 프레임 예산 안에 끝내는 것을 기준으로 둡니다(이 절의 화면 버벅임 문항).<\/li>\n<\/ul>"},{"no":115,"t":"크래시는 어떻게 수집하고 우선순위를 정합니까?","a":"<p>크래시는 Crashlytics 같은 수집 도구로 스택과 함께 기기, OS, 앱 버전, 직전 사용자 동작을 모으고, Play Console의 Android vitals로 스토어 기준을 지키는지 봅니다. 우선순위는 발생 건수보다 영향받은 사용자 수, 이번 버전에서 생긴 회귀인지, 앱 시작이나 길 안내 시작 같은 핵심 흐름을 막는지로 정합니다. 단계적 출시 중이라면 같은 기준으로 출시를 멈출지까지 결정합니다.<\/p>\n<p>Android vitals의 user-perceived crash rate는 Activity가 보이거나 포그라운드 서비스가 실행 중일 때처럼 사용자가 알아챘을 가능성이 큰 크래시를 세고, 나쁜 동작 기준은 전체 1.09%, 기기별 8%이며 Play는 최근 28일 데이터로 평가합니다. vitals는 일일 활성 사용자 기준이고 Crashlytics는 세션 기준이라 두 값이 다르게 나오므로, 스토어 기준 판단은 vitals로, 원인 분석과 화면별 비교는 수집 도구로 나눠 씁니다. 같은 이슈가 특정 제조사, 모델, OS 버전에 몰려 있으면 기기별로 묶어 봐야 원인이 보이고, vitals도 기기별 기준을 따로 두는 만큼 전체 비율이 낮아도 한 기종에서 무너지는 경우를 놓치지 않습니다.<\/p>\n<p>수집 품질이 판단의 바탕입니다. R8로 난독화한 스택은 빌드마다 나오는 mapping 파일로 되돌리는데, Play Console은 App Bundle과 AGP 4.1 이상이면 번들에서 자동으로 가져가고, Crashlytics Gradle 플러그인은 빌드가 mapping 파일을 만들면 자동으로 올립니다(이 절의 R8 문항). 네이티브 라이브러리는 릴리스 빌드에서 심볼이 제거되므로 android.buildTypes.release.ndk.debugSymbolLevel을 SYMBOL_TABLE(함수 이름)이나 FULL(파일과 줄 번호까지)로 두어 심볼 파일을 번들에 넣습니다. 지도 렌더링 엔진처럼 NDK 코드가 있는 앱에서 이 설정이 빠지면 네이티브 크래시를 읽을 수 없습니다. 네이티브 크래시는 시스템이 tombstone으로 남기고, API 31부터는 ApplicationExitInfo의 REASON_CRASH_NATIVE 기록에서 tombstone을 protobuf로 읽을 수 있습니다. 잡아서 처리한 예외라도 사용자 기능이 실패했다면 recordException으로 non-fatal로 남기고, 화면 이름이나 경로 탐색 옵션 같은 상태를 custom key로, 직전 동작을 breadcrumb 로그로 붙입니다. setCustomKey로 넣은 값은 바꾸기 전까지 이후 보고에도 붙으므로, 현재 화면처럼 계속 바뀌는 값은 화면에 들어갈 때 갱신하고 응답 버전처럼 그 예외에만 해당하는 값은 recordException에 키를 함께 넘깁니다. 개인정보는 넣지 않습니다.<\/p>\n<p>우선순위는 네 가지를 함께 봅니다. 영향받은 사용자 수와 비율, 이번 버전에서 새로 생겼거나 고쳤다고 닫은 뒤 다시 나타난 회귀인지, 핵심 흐름에서 나는지, 데이터 손실이나 시작 직후 반복 크래시처럼 앱을 아예 쓸 수 없게 만드는지입니다. 시작 직후 크래시는 사용자가 다시 열어도 같은 지점에서 죽으므로 건수가 적어도 먼저 봅니다. 단계적 출시 중 새 버전의 크래시율이 이전 버전보다 뚜렷하게 높거나 핵심 흐름 크래시가 새로 생기면 Play Console에서 출시를 중단합니다. 중단하면 새 사용자는 더 받지 않지만 이미 받은 사용자는 그 버전에 남으므로, 수정은 버전 코드를 올린 새 빌드로 내고 그 사이에는 서버 측 기능 플래그로 문제 기능을 끕니다(이 절의 CI/CD 문항).<\/p>\n<pre class=\"kotlin\"><code>// 잡아서 처리했어도 기능이 실패했다면 non-fatal로 남기고, 이 예외에만 상태 키를 붙인다\ntry {\n    val route = routeMapper.toDomain(response)          // 서버 응답 형식이 바뀌면 실패\n    render(route)\n} catch (e: SerializationException) {\n    Firebase.crashlytics.recordException(e) {           // 다음 실행 때 전송된다\n        key(&quot;api_version&quot;, response.version)            // 현재 화면 키는 화면에 들어갈 때 갱신한다\n    }\n    showRouteUnavailable()\n}<\/code><\/pre>","f":"<ul>\n<li><strong>크래시율은 낮은데 앱이 꺼진다는 VOC가 많으면 무엇을 봅니까?<\/strong> 크래시 보고에 안 잡히는 종료를 봅니다. ApplicationExitInfo로 ANR, 저메모리 종료, 시스템 종료 사유를 집계하고, Android 17의 메모리 한도 종료(REASON_OTHER, 설명에 MemoryLimiter:AnonSwap)도 따로 셉니다. 기기별로 묶으면 특정 제조사의 종료 정책 문제인지도 드러납니다.<\/li>\n<li><strong>non-fatal은 어디까지 남깁니까?<\/strong> 사용자 기능이 실패한 경우만 남깁니다. 네트워크 끊김처럼 예상된 실패까지 모두 남기면 실제 문제를 가리므로 별도 지표로 집계합니다. Crashlytics는 기록한 예외 중 최근 8개만 보관했다가 다음 실행 때 보내므로, 한 번에 많이 쌓이는 경로에서는 앞의 예외가 사라집니다.<\/li>\n<li><strong>네이티브 크래시 스택이 주소만 나오면 어떻게 합니까?<\/strong> 그 버전의 심볼 파일이 올라가지 않은 것입니다. debugSymbolLevel 설정과 업로드를 확인하고, 로컬에서는 NDK에 들어 있는 ndk-stack으로 같은 빌드의 심볼을 써서 되돌립니다.<\/li>\n<\/ul>"},{"no":116,"t":"앱의 네트워크 성능은 어떻게 최적화합니까?","a":"<p>네트워크 비용은 요청 수와 왕복 횟수, 주고받는 바이트, 연결 수립 비용으로 나뉘므로 각각을 줄이고, 화면이 실제로 기다리는 요청을 먼저 보내며, 느린 망에서도 화면이 비지 않게 설계합니다. 순서는 측정으로 어느 구간이 긴지 확인한 뒤 요청을 합치거나 없애고, 응답을 줄이고, 캐시와 연결 재사용을 챙기는 것입니다.<\/p>\n<p>사용자가 느끼는 시간은 서버 처리 시간이 아니라 DNS, 연결, TLS, 첫 바이트, 본문 다운로드, 파싱, UI 반영을 모두 더한 시간이므로 구간별로 잽니다. OkHttp의 EventListener로 단계별 시각을 모으고, Android Studio의 Network Inspector로 화면별 요청 순서와 크기를 보고, 현장에서는 실사용 모니터링으로 네트워크 종류와 통신사별 분포를 봅니다(9절의 모바일 네트워크 문항). 요청 ID를 헤더로 넘겨 서버 로그와 맞추면 서버 처리와 네트워크 구간이 나뉩니다.<\/p>\n<p>줄이는 방법은 네 갈래입니다. 첫째, 요청 수입니다. 화면 하나가 순차 요청 여러 개를 기다리면 왕복 지연이 쌓이므로 서로 의존하지 않는 요청은 coroutineScope 안의 async로 병렬로 보내고, 화면에 필요한 데이터를 한 번에 주는 API를 서버와 협의합니다. 여러 화면이 같은 데이터를 동시에 요청하면 Repository에서 진행 중인 요청을 공유하고, 분석 이벤트처럼 급하지 않은 요청은 모아서 WorkManager로 보냅니다. 둘째, 응답 크기입니다. 필요한 필드만 받고 목록은 페이지 단위로 받습니다(4절의 페이지 목록 문항). OkHttp는 요청에 Accept-Encoding이 없으면 gzip을 붙이고 응답을 자동으로 풀어 주므로 서버가 압축하게 하면 되고, 직접 Accept-Encoding을 넣으면 해제도 직접 해야 합니다. Brotli는 Cronet이 지원하지만 CronetEngine.Builder의 enableBrotli(true)로 켜야 요청의 Accept-Encoding에 br이 들어갑니다. 이미지는 표시 크기로, WebP처럼 압축률이 높은 포맷으로 받습니다(이 절의 이미지 로딩 문항). 셋째, 캐시와 조건부 요청입니다. 데이터마다 허용 신선도를 정해 Cache-Control과 ETag로 304를 받게 하고, 오프라인에서도 보여야 하는 데이터는 로컬 DB를 SSOT로 둡니다(9절의 HTTP 캐시 문항). 넷째, 연결입니다. OkHttpClient를 하나만 만들어 공유해야 연결 풀(기본 유휴 연결 5개를 5분 유지)과 HTTP/2 연결을 재사용하고, 설정만 다른 클라이언트는 newBuilder()로 파생해 풀을 공유합니다. OkHttp의 기본 프로토콜 목록은 HTTP/2와 HTTP/1.1이라 HTTP/2 서버와는 연결 하나에 요청을 다중화합니다. OkHttp는 HTTP/3를 기본 지원하지 않으므로 QUIC이 필요하면 Cronet이나 API 34부터 있는 HttpEngine을 검토합니다(9절의 QUIC과 HTTP/3 문항).<\/p>\n<p>다음 화면에서 쓸 것이 확실한 데이터는 미리 받습니다. 길 안내를 시작하면 경로 주변 데이터를 미리 받아 터널에서도 안내가 이어지게 하고, 목록의 다음 페이지는 끝에 닿기 전에 요청합니다. 확실하지 않은 프리페치는 데이터 요금과 배터리를 쓰므로 Wi-Fi나 충전 같은 조건을 겁니다. 화면을 떠나면 viewModelScope 취소로 요청도 취소해 대역폭을 다음 화면에 넘깁니다. 느린 망에서는 타임아웃을 종류별로 나누고 멱등한 요청만 백오프로 재시도하며(9절의 타임아웃과 재시도 문항), 저장된 값을 먼저 보여 주고 새 값으로 갱신해 화면이 응답만 기다리지 않게 합니다. 에뮬레이터의 네트워크 속도와 지연 설정으로 느린 망을 재현해 확인합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 호출 시작부터 단계별 경과 시간을 모은다\nclass TimingListener : EventListener() {\n    private var start = 0L\n    override fun callStart(call: Call) { start = System.nanoTime() }\n    override fun dnsEnd(call: Call, domainName: String, inetAddressList: List&lt;InetAddress&gt;) = mark(&quot;dns&quot;)\n    override fun secureConnectEnd(call: Call, handshake: Handshake?) = mark(&quot;tls&quot;)\n    override fun responseHeadersStart(call: Call) = mark(&quot;ttfb&quot;)\n    override fun callEnd(call: Call) = mark(&quot;total&quot;)\n    private fun mark(phase: String) {\n        metrics.record(phase, (System.nanoTime() - start) / 1_000_000)   // ms\n    }\n}\n// OkHttpClient.Builder().eventListenerFactory { TimingListener() }<\/code><\/pre>","f":"<ul>\n<li><strong>HTTP/2면 요청을 합칠 필요가 없지 않습니까?<\/strong> 연결 수와 요청 대기열 문제는 줄지만 왕복 지연은 그대로라, 앞 응답을 받아야 다음 요청을 만들 수 있는 순차 의존은 여전히 지연이 쌓입니다. 병렬로 보낼 수 있는 요청은 병렬로 보내고, 순차 의존은 API 설계로 줄입니다.<\/li>\n<li><strong>요청 본문도 gzip으로 압축하면 이득입니까?<\/strong> 서버가 지원할 때만 씁니다. OkHttp 문서의 요청 압축 예제도 많은 서버가 이를 처리하지 못한다고 경고합니다. 큰 로그나 경로 기록 업로드처럼 이득이 분명하고 서버가 지원을 약속한 요청에만 적용합니다.<\/li>\n<li><strong>프리페치가 오히려 첫 화면을 늦추는 경우는 언제입니까?<\/strong> 프리페치가 화면이 기다리는 요청과 같은 대역폭을 다투면 첫 화면이 늦어집니다. 첫 화면 요청이 끝난 뒤나 유휴 시점에 보내고, 화면을 떠나면 함께 취소합니다.<\/li>\n<\/ul>"},{"no":117,"t":"OkHttp Interceptor는 어떻게 동작하고, 토큰 갱신은 어떻게 구현합니까?","a":"<p>OkHttp는 요청을 인터셉터 체인으로 처리합니다. addInterceptor로 넣은 application interceptor가 맨 앞에서 앱이 만든 요청을 보고, OkHttp 내부의 재시도와 리다이렉트, 헤더 보강, 캐시, 연결 단계를 지나 addNetworkInterceptor로 넣은 network interceptor가 실제로 나가는 요청을 봅니다. 토큰은 application interceptor가 헤더에 붙이고, 401은 Authenticator가 받아 갱신한 토큰으로 다시 보내며, 동시에 401이 여러 개 와도 갱신은 한 번만 하고 갱신이 거절되면 로그아웃합니다.<\/p>\n<p>RealCall이 조립하는 순서는 application interceptor, RetryAndFollowUpInterceptor, BridgeInterceptor, CacheInterceptor, ConnectInterceptor, network interceptor, CallServerInterceptor입니다. 각 인터셉터는 chain.proceed()로 다음 단계를 부르고 응답을 거꾸로 돌려받습니다. application interceptor는 응답이 캐시에서 나와도 호출마다 한 번 불리고, OkHttp가 넣는 If-None-Match 같은 헤더를 보지 않으며, proceed를 부르지 않고 바로 응답하거나 여러 번 불러 재시도할 수 있습니다. network interceptor는 리다이렉트와 재시도의 중간 응답마다 불리고 캐시 적중에는 불리지 않으며, 실제 전송되는 헤더와 요청을 싣는 Connection을 봅니다. 그래서 인증 헤더와 공통 헤더, 앱 수준 로깅은 application interceptor에, 실제 전송 헤더와 바이트를 봐야 하는 계측은 network interceptor에 둡니다. 연결은 ConnectInterceptor가 커넥션 풀에서 꺼내므로 OkHttpClient는 하나만 두고 newBuilder()로 파생해 풀과 스레드를 공유합니다.<\/p>\n<p>401은 Authenticator에서 처리합니다. RetryAndFollowUpInterceptor가 401을 받으면 authenticate(route, response)를 부르고, 새 Request를 돌려주면 그 요청을 다시 보내며 null이면 401 응답을 그대로 호출자에게 돌려줍니다. 이 재요청은 application interceptor를 다시 지나지 않으므로 Authenticator가 새 토큰 헤더를 직접 넣습니다. 지킬 것은 세 가지입니다. 첫째, 갱신은 한 번만 합니다. 401을 동시에 받은 요청들이 각자 갱신하면, 리프레시 토큰을 쓸 때마다 바꾸는 서버에서는 두 번째 갱신이 이미 쓴 토큰으로 거절되고 탈취로 판단되어 정상 사용자가 로그아웃됩니다(9절의 모바일 인증 문항). 그래서 락 안에서 실패한 요청이 보낸 토큰과 지금 저장된 토큰을 비교해, 다른 요청이 이미 갱신했으면 새 토큰으로 다시 보내기만 합니다. 둘째, 무한 재시도를 막습니다. 갱신한 토큰으로 다시 보낸 요청도 401을 받으면 포기하고, 갱신 API는 Authenticator가 없는 별도 OkHttpClient로 불러 갱신 요청의 401이 다시 Authenticator로 들어오지 않게 합니다. OkHttp도 후속 요청을 20번까지만 따라가지만 이 상한에 기대지 않습니다. 셋째, 갱신이 거절되면 저장된 토큰을 지우고 앱 수준 세션 상태를 로그아웃으로 바꿔 로그인 화면으로 보냅니다(4절의 앱 전역 상태 문항). 네트워크 오류로 갱신하지 못한 것은 로그아웃 사유가 아니므로 예외로 실패시켜 재시도에 맡깁니다.<\/p>\n<p>authenticate는 suspend 함수가 아니라 OkHttp 스레드에서 불리는 블로킹 함수이므로 갱신 API는 Retrofit의 Call.execute() 같은 동기 호출로 부르고, 락은 JVM 락이면 충분합니다. 만료 시각을 알면 interceptor에서 만료 직전 토큰을 미리 갱신해 401 왕복을 줄일 수 있지만, 서버가 토큰을 먼저 폐기할 수 있으므로 Authenticator는 그대로 둡니다. 403은 권한 문제라 갱신 대상이 아닙니다.<\/p>\n<pre class=\"kotlin\"><code>class TokenAuthenticator(\n    private val tokens: TokenStore,          // 메모리 캐시와 암호화 저장소를 감싼 객체\n    private val refresher: TokenRefresher,   // Authenticator가 없는 별도 OkHttpClient로 동기 호출\n    private val session: SessionManager,     // 앱 수준 로그인 상태\n) : Authenticator {\n    override fun authenticate(route: Route?, response: Response): Request? {\n        if (response.priorResponse?.code == 401) return null  // 갱신해 다시 보낸 요청도 401이면 포기\n        val sentToken = response.request.header(&quot;Authorization&quot;)?.removePrefix(&quot;Bearer &quot;)\n        val token = synchronized(this) {\n            tokens.accessToken()?.takeIf { it != sentToken }  // 다른 요청이 이미 갱신했으면 그 토큰\n                ?: refresher.refresh()      // 새 토큰 저장까지 한다. 거절이면 null, 망 오류는 IOException\n        } ?: run { session.expire(); return null }            // 갱신 거절이면 로그아웃\n        return response.request.newBuilder().header(&quot;Authorization&quot;, &quot;Bearer $token&quot;).build()\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>Authenticator 대신 interceptor에서 401을 보고 다시 보내면 안 됩니까?<\/strong> 가능하지만 응답 본문 닫기, 재시도 횟수, 동시성 처리를 모두 직접 해야 합니다. 401 챌린지 처리는 OkHttp가 Authenticator로 제공하는 경로이고 재요청이 후속 요청 상한 안에서 관리되므로 Authenticator를 먼저 씁니다.<\/li>\n<li><strong>로깅 interceptor는 어디에 둡니까?<\/strong> 앱이 만든 요청을 보려면 application interceptor, 실제 전송 헤더와 리다이렉트를 보려면 network interceptor에 둡니다. HttpLoggingInterceptor는 redactHeader로 Authorization 값을 가리고, 릴리스 빌드에서는 본문 로깅을 끕니다.<\/li>\n<li><strong>갱신하는 동안 새로 나간 요청은 어떻게 됩니까?<\/strong> 옛 토큰으로 나가 401을 받으면 락에서 기다렸다가 저장된 새 토큰과 비교한 뒤 갱신 없이 바로 다시 보냅니다. 401 왕복 자체를 줄이려면 interceptor가 요청마다 저장소에서 최신 토큰을 읽게 합니다.<\/li>\n<\/ul>"},{"no":118,"t":"배터리 소모는 어떻게 진단하고 줄입니까?","a":"<p>배터리는 화면이 꺼진 뒤에도 CPU를 깨워 두는 wake lock, 잦은 위치 요청, 작은 요청으로 라디오를 자주 깨우는 네트워크, 너무 잦은 백그라운드 작업이 주로 씁니다. 줄이는 원칙은 백그라운드 작업을 WorkManager에 맡겨 OS가 묶어 실행하게 하고, 위치는 기능에 필요한 정확도와 빈도로만 받고, 길 안내가 끝나면 서비스와 위치 요청을 확실히 멈추는 것입니다. 진단은 vitals의 wake lock 지표와 VOC에서 출발해 Power Profiler와 시스템 트레이스로 원인을 좁힙니다.<\/p>\n<p>원인별로 보면 이렇습니다. partial wake lock을 직접 잡으면 화면이 꺼져도 기기가 저전력 상태로 들어가지 못합니다. vitals는 백그라운드나 포그라운드 서비스 실행 중에 잡은 partial wake lock 합이 24시간 중 2시간 이상이면 과도하다고 보고, 28일 동안 전체 세션의 5%를 넘으면 Play 노출에 영향을 줄 수 있으며, Google Play는 2026-03-01부터 기준을 넘는 앱에 스토어 경고와 추천 제외를 단계적으로 적용했습니다. audio, 위치, JobScheduler user-initiated API의 wake lock은 계산에서 빠집니다. 직접 잡아야 한다면 시간 제한을 둔 acquire와 finally의 release로 해제를 보장하고, 대시보드가 wake lock 이름별로 보여 주므로 알아볼 수 있는 태그를 붙입니다. 위치는 GPS를 쓰는 높은 정확도 요청이 가장 비싸므로 기능별로 Priority와 간격을 고르고, 실시간이 아닌 기록은 setMaxUpdateDelayMillis를 간격의 2배 이상으로 주어 배치로 받습니다. 위치 콜백 때 시스템이 잡는 짧은 wake lock은 wake lock 지표에서 빠지지만 위치 측정 전력은 그대로입니다(7절의 위치 업데이트 주기 문항). 네트워크는 백그라운드에서 모바일 망에 연결할 때마다 CPU를 깨우고 라디오를 켜므로 작은 요청을 흩어 보내지 말고 모으며, 백그라운드 폴링 대신 서버 푸시를 씁니다. 백그라운드 작업은 Doze와 App Standby가 이미 미루고 묶으므로(5절의 Doze와 App Standby 문항), 정확한 알람이나 포그라운드 서비스로 이 제한을 피하는 구조를 만들지 않습니다.<\/p>\n<p>도구는 바뀌었습니다. 공식 문서는 Battery Historian이 더 이상 활발히 유지되지 않는다며 시스템 트레이스, Macrobenchmark의 PowerMetric, Android Studio Power Profiler를 권합니다. Power Profiler는 Android Studio Hedgehog부터 있고, Android 10 이상의 Pixel 6 이후 기기에서 On Device Power Rails Monitor 값을 CPU, 디스플레이, GPS, 셀룰러, WLAN 같은 부분별로 보여 주므로 길 안내 중 GPS와 화면 중 무엇이 큰지 바로 나뉩니다. PowerMetric은 Experimental이고 기기 전체 소모를 재므로 Pixel 6 이후 실기기에서 같은 시나리오의 변경 전후 비교에 씁니다. Perfetto 트레이스에서는 화면이 꺼진 구간에 어떤 wake lock, 알람, Job, 네트워크 요청이 기기를 깨웠는지 시간축으로 봅니다.<\/p>\n<p>VOC는 기술 원인으로 좁혀야 고칠 수 있습니다. 먼저 기기, OS, 앱 버전, 쓴 기능과 시간을 받습니다. 화면을 켠 채 한 시간 길 안내를 했다면 디스플레이, GPS, 네트워크, 지도 렌더링이 모두 도는 정상 소모일 수 있고, 안내를 끝낸 뒤에도 소모가 이어졌다면 포그라운드 서비스나 위치 요청이 멈추지 않은 버그를 의심합니다. 같은 모델로 재현하고, 설정의 앱 배터리 사용량에서 포그라운드와 백그라운드 비중을 보며, vitals의 wake lock 이름을 버전별로 비교해 언제부터 늘었는지 확인합니다. 고친 뒤에는 같은 시나리오를 Power Profiler나 PowerMetric으로 다시 잽니다.<\/p>\n<pre class=\"kotlin\"><code>// 급하지 않은 동기화는 조건을 걸어 OS가 다른 작업과 묶어 실행하게 맡긴다\nval sync = PeriodicWorkRequestBuilder&lt;FavoritesSyncWorker&gt;(12, TimeUnit.HOURS)\n    .setConstraints(\n        Constraints.Builder()\n            .setRequiredNetworkType(NetworkType.UNMETERED)\n            .setRequiresBatteryNotLow(true)\n            .build()\n    )\n    .build()\nWorkManager.getInstance(context)\n    .enqueueUniquePeriodicWork(&quot;favorites-sync&quot;, ExistingPeriodicWorkPolicy.KEEP, sync)<\/code><\/pre>","f":"<ul>\n<li><strong>길 안내 중에는 배터리를 어떻게 더 아낍니까?<\/strong> 정차 중에는 위치 간격을 늘리고, 지도가 움직이지 않으면 매 프레임 다시 그리지 않으며, 화면이 꺼진 동안은 UI 갱신을 멈추고 알림 갱신만 남깁니다. 위치 수신 빈도와 화면 갱신 빈도를 나누면 위치는 필요한 만큼 받으면서 그리기 비용을 줄일 수 있습니다.<\/li>\n<li><strong>직접 wake lock을 잡은 적이 없는데 vitals 경고가 오면 어떻게 합니까?<\/strong> 라이브러리나 SDK가 잡은 wake lock일 수 있으므로 대시보드의 wake lock 이름으로 출처를 찾습니다. 사용자가 시작한 큰 전송이라면 user-initiated data transfer job으로 옮기는 방법도 있습니다. JobScheduler user-initiated API의 wake lock은 계산에서 빠지기 때문입니다.<\/li>\n<li><strong>배터리 최적화 예외를 요청하면 해결되지 않습니까?<\/strong> 예외는 bucket 기반 제한을 풀고 Doze 중 네트워크와 partial wake lock을 허용할 뿐 소모 원인은 그대로이고, 일반 알람은 여전히 미뤄지며 정책 제약과 사용자 부담도 있습니다. 판단 기준은 5절의 Doze와 App Standby 문항을 따르고, 먼저 작업을 시스템 스케줄러에 맞게 바꿉니다.<\/li>\n<\/ul>"},{"no":119,"t":"앱 크기는 어떻게 줄입니까?","a":"<p>App Bundle로 기기마다 필요한 것만 내려보내고, R8로 코드와 리소스를 줄이고, 이미지와 네이티브 라이브러리와 의존성처럼 큰 덩어리를 정리하는 순서로 줄입니다. 일부 사용자만 쓰는 큰 기능은 동적 기능 모듈로 뺄 수 있지만 구조 비용이 크므로 앞의 방법을 먼저 하고, 크기는 CI에서 빌드마다 재서 늘어나는 변경을 리뷰에서 잡습니다.<\/p>\n<p>2021년 8월부터 Google Play의 새 앱은 App Bundle로 출시해야 하고, Play는 번들로 기기 구성별 최적화 APK를 만들어 그 기기에 맞는 ABI, 화면 밀도, 언어의 코드와 리소스만 내려보냅니다. 밀도별 이미지와 여러 ABI의 네이티브 라이브러리를 APK 하나에 모두 넣던 비용이 여기서 사라집니다. AGP 9.0은 APK의 화면 밀도별 split 지원을 없앴으므로 기기별 최적화는 App Bundle에 맡깁니다. 코드는 R8의 축소, 최적화, 난독화로 줄이고(이 절의 R8 문항), isShrinkResources는 R8이 코드를 지운 뒤 참조가 사라진 리소스를 지웁니다. AGP 9.0에서는 android.r8.optimizedResourceShrinking 기본값도 true가 되었습니다. vitals는 DEX 코드가 10 MB를 넘는 앱에 최적화, 난독화, 축소 비율 25% 이상을 기준으로 두므로, R8을 끄고 출시하면 크기와 스토어 기준 양쪽에서 손해입니다. 지원 언어만 androidResources의 localeFilters로 남기면 라이브러리가 가져온 다른 언어 리소스도 빠집니다.<\/p>\n<p>큰 덩어리는 종류별로 정리합니다. PNG와 JPEG 이미지는 WebP로 바꿉니다. WebP는 손실 압축과 투명도를 함께 지원하고 대개 JPEG나 PNG보다 작습니다. 아이콘처럼 작은 그림은 VectorDrawable로 밀도별 파일을 없앱니다. 공식 문서는 벡터가 그리는 데 시간이 더 들고 큰 그림일수록 느리므로 작은 이미지에만 쓰라고 하고, 프레임마다 비트맵을 넣는 AnimationDrawable 대신 AnimatedVectorDrawableCompat를 권합니다. 큰 배경 이미지, 지도 데이터, 음성 안내 파일은 앱에 넣지 않고 필요할 때 받습니다. 네이티브 라이브러리는 App Bundle이 기기 ABI의 것만 보내므로 지원 ABI를 정리하고, 릴리스에서는 심볼을 제거한 채 심볼은 별도 파일로 올립니다(이 절의 크래시 문항). useLegacyPackaging을 false로 두면 설치 때 .so를 파일 시스템으로 복사하지 않아 업데이트가 작아집니다. 의존성은 같은 일을 하는 라이브러리가 둘씩 들어온 경우(JSON 파서 두 종류, 이미지 로더 두 종류)와 서버나 데스크톱용으로 만든 큰 라이브러리를 찾아 정리합니다. 공식 문서도 코드 축소로 라이브러리 안의 큰 내부 의존까지 다 지우지는 못한다고 적습니다.<\/p>\n<p>Play Feature Delivery의 기능 모듈은 조건에 따라 설치하거나 실행 중에 내려받게 해서 일부 사용자만 쓰는 큰 기능을 기본 설치에서 뺍니다. 대신 기능 모듈이 base 모듈에 의존하는 방향으로 구조가 뒤집히고, 설치 상태 처리와 테스트 경로가 늘어나므로 공식 문서도 다른 방법을 먼저 해 보라고 적습니다. 크기는 계속 늘어나므로 CI에서 잽니다. bundletool의 get-size total로 기기 구성별 예상 다운로드 크기를 재고, apkanalyzer의 apk download-size, apk compare, dex packages로 이전 빌드와 비교해 어느 파일과 패키지가 늘었는지 PR에 남깁니다. 정한 기준을 넘는 증가는 이유를 적게 하고, 새 의존성을 넣는 PR은 크기 변화를 함께 보게 합니다.<\/p>\n<pre class=\"ko
