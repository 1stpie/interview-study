곳은 정렬과 맞물릴 때입니다. 주변 장소 목록을 위치가 바뀔 때마다 거리순으로 다시 정렬해 넘기면 순서가 크게 섞여 D와 이동 항목이 함께 늘고, 화면에서도 항목이 계속 자리를 바꿉니다. 순서는 일정 거리 이상 움직였을 때만 다시 정하고 그 사이에는 거리 표시만 바꾸면 내용 변경만 생겨 계산이 가볍고, payload로 거리 칸만 다시 그릴 수 있습니다. ViewHolder 재사용과 payload 처리는 5절의 RecyclerView 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>object PlaceDiff : DiffUtil.ItemCallback&lt;PlaceUi&gt;() {\n    override fun areItemsTheSame(oldItem: PlaceUi, newItem: PlaceUi) =\n        oldItem.id == newItem.id           // 같은 장소인가: 바뀌지 않는 ID로\n    override fun areContentsTheSame(oldItem: PlaceUi, newItem: PlaceUi) =\n        oldItem == newItem                 // 화면에 보이는 내용이 같은가(불변 data class)\n}\n\nclass PlaceAdapter : ListAdapter&lt;PlaceUi, PlaceViewHolder&gt;(PlaceDiff) { /* ... */ }\n\n// 항상 새 리스트를 넘긴다. 같은 인스턴스를 고쳐서 다시 넘기면 무시된다\nadapter.submitList(places.map { it.toUi() })<\/code><\/pre>","f":"<ul>\n<li><strong>areItemsTheSame에 equals 비교를 쓰면 어떻게 됩니까?<\/strong> 내용이 하나만 바뀐 항목도 다른 항목으로 보여 삭제 뒤 삽입으로 처리되므로, 변경 애니메이션 대신 항목이 사라졌다 나타나며 깜빡입니다. areItemsTheSame은 ID처럼 바뀌지 않는 값으로 비교하고, 내용 비교는 areItemsTheSame이 true일 때만 불리는 areContentsTheSame에 둡니다.<\/li>\n<li><strong>리스트나 항목을 제자리에서 고쳐 다시 넘기면?<\/strong> AsyncListDiffer는 같은 리스트 인스턴스가 오면 아무것도 하지 않고, 항목 객체를 고쳤다면 이전 리스트도 같은 객체를 가리켜 바뀐 곳을 찾지 못합니다. 문서도 DiffUtil, ListAdapter, AsyncListDiffer에 넘긴 리스트와 원소를 고치지 말고 내용이 바뀔 때마다 새 리스트를 주라고 적으며, 바뀌지 않은 원소는 공유해도 됩니다.<\/li>\n<li><strong>Compose의 LazyColumn에서는 무엇이 이 역할을 합니까?<\/strong> LazyColumn 자체는 목록 차이를 계산하지 않고 key로 항목과 컴포지션, 상태를 짝짓습니다. 추가, 삭제, 순서 변경 애니메이션을 주는 Modifier.animateItem(compose-foundation 1.7.0에 추가)도 key를 줘야 동작한다고 문서에 적혀 있고, 나머지는 3절의 LazyColumn 성능 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":147,"t":"안정 정렬은 왜 중요하고, Java와 Kotlin의 기본 정렬은 어떤 알고리즘입니까?","a":"<p>안정 정렬은 정렬 키가 같은 원소들의 원래 순서를 유지합니다. 관련도순으로 받은 검색 결과를 별점순으로 다시 정렬해도 별점이 같은 장소끼리는 관련도 순서가 남아야 하는 경우처럼, 이미 의미 있는 순서가 있는 목록을 다른 기준으로 다시 정렬할 때 필요합니다. Java의 객체 정렬인 Arrays.sort(Object[])와 Collections.sort는 TimSort라 안정적이고, int[] 같은 기본형 배열 정렬은 Dual-Pivot Quicksort라 불안정하지만 같은 값의 기본형은 서로 구별되지 않아 문제가 없습니다. Kotlin 문서는 컬렉션의 sorted, sortedBy, sortedWith, sortedByDescending을 안정 정렬로 명시하고, JVM에서는 원소를 객체 배열로 옮겨 이 TimSort로 정렬합니다.<\/p>\n<p>TimSort는 실제 데이터에 이미 정렬된 구간이 많다는 점을 이용합니다. 오름차순이나 내림차순으로 이어진 구간을 찾아 내림차순이면 뒤집고, 짧은 구간은 이진 삽입 정렬로 최소 길이까지 늘린 뒤 크기의 균형을 맞추며 병합합니다. 병합 중 한쪽이 연속으로 이기면 갤로핑 모드로 지수 탐색을 해 한꺼번에 건너뜁니다. Java 문서 기준으로 거의 정렬된 입력은 약 n번 비교로 끝나 목록 끝에 몇 개를 붙이고 다시 정렬하는 앱 코드에 잘 맞고, 최악도 O(n log n)이며 임시 공간은 작은 상수에서 n/2 참조까지 씁니다. OpenJDK 소스에서는 원소가 32개 미만이면 병합 없이 이진 삽입 정렬만 하고 최소 구간 길이를 16~32 사이로 정합니다. 기본형의 Dual-Pivot Quicksort는 피벗 두 개로 세 구간을 나누며, Java와 Android의 Arrays 문서는 모든 데이터에서 O(n log(n)) 성능을 낸다고 적습니다.<\/p>\n<p>실무에서는 세 가지를 챙깁니다. 첫째, 여러 기준은 두 번 정렬하는 대신 compareBy({ it.distance }, { it.name })처럼 비교자 하나에 우선순위를 드러냅니다. 둘째, 화면에 쓰는 정렬은 마지막 기준으로 id 같은 고유 키를 넣어 순서를 결정적으로 만듭니다. 안정 정렬은 입력 순서를 지킬 뿐이라 서버 응답 순서나 HashMap 순회 순서가 바뀌면 동점 항목의 순서도 바뀌고, DiffUtil은 이것을 이동으로 보아 항목이 튑니다(8절의 DiffUtil 문항). 셋째, 비교하는 동안 값이 바뀌지 않게 합니다. sortedBy의 선택 함수는 비교마다 불리므로 거리처럼 비싼 값은 먼저 계산해 고정하고, 다른 스레드가 바꾸는 값으로 비교하면 결과가 앞뒤가 맞지 않아 TimSort가 \"Comparison method violates its general contract!\"와 함께 IllegalArgumentException을 던질 수 있습니다.<\/p>\n<pre class=\"kotlin\"><code>// 거리는 한 번만 계산해 고정하고, 동점은 id로 끊어 순서를 결정적으로 만든다\nval here = currentLocation                     // 정렬 중에 바뀌지 않게 한 번만 읽음\nval sorted = places\n    .map { it to distanceMeters(here, it) }\n    .sortedWith(compareBy({ it.second }, { it.first.id }))\n    .map { it.first }<\/code><\/pre>","f":"<ul>\n<li><strong>내림차순은 sortedBy 뒤에 reversed()로 해도 됩니까?<\/strong> 동점 항목의 순서까지 뒤집혀 안정 정렬의 의미가 사라집니다. sortedByDescending이나 compareByDescending을 쓰면 동점은 원래 순서를 유지합니다.<\/li>\n<li><strong><code>List&lt;Int&gt;<\/code>를 정렬할 때와 IntArray를 정렬할 때는 무엇이 다릅니까?<\/strong> <code>List&lt;Int&gt;.sorted()<\/code>는 박싱된 Integer를 객체 배열로 옮겨 TimSort로 정렬하고, IntArray.sort()는 기본형 그대로 Dual-Pivot Quicksort를 씁니다. 숫자만 대량으로 정렬한다면 객체와 참조 따라가기가 없는 IntArray가 유리합니다(8절의 상수 비용 문항).<\/li>\n<li><strong>비교 기반 정렬의 하한이 O(n log n)인 이유는?<\/strong> 가능한 순서가 n!개이고 비교 한 번은 경우를 둘로만 나누므로 log₂(n!) = Θ(n log n)번 비교가 필요합니다. 키 범위가 좁은 정수라면 비교하지 않는 계수 정렬로 O(n + k)에 정렬할 수 있습니다.<\/li>\n<\/ul>"},{"no":148,"t":"이진 탐색을 쓸 수 있는 조건은 무엇이고, 구현에서 어디를 자주 틀립니까?","a":"<p>조건은 정렬 그 자체보다 단조성입니다. 어떤 조건이 한 지점부터 끝까지 참이면(거짓, 거짓, ..., 참, 참) 그 경계를 O(log n)에 찾을 수 있고, 가운데 위치를 O(1)에 볼 수 있는 임의 접근이 함께 필요합니다. 그래서 배열에서 값을 찾는 일뿐 아니라, 주어진 폭에 들어가는 가장 큰 글자 크기처럼 답의 범위를 이진 탐색하는 매개 변수 탐색에도 씁니다. 글자가 클수록 폭도 넓어진다는 단조성이 있기 때문입니다. 자주 틀리는 곳은 중간값 오버플로, 반복 조건과 경계 갱신의 불일치, 중복 값과 반환값 처리입니다.<\/p>\n<p>값의 존재 확인과 삽입 위치는 표준 API를 씁니다. Java의 Arrays.binarySearch와 Kotlin의 binarySearch, binarySearchBy는 정렬에 쓴 것과 같은 기준으로 찾아야 하고, 아니면 결과가 정의되지 않습니다. 같은 값이 여러 개면 어느 위치가 나올지 보장하지 않고 값이 없으면 -(삽입 위치) - 1을 돌려주므로, 없음 검사는 == -1이 아니라 &lt; 0으로 하고 첫 위치가 필요하면 경계를 찾는 함수를 따로 둡니다. 임의 접근이 안 되는 LinkedList에는 맞지 않으며, Java의 Collections.binarySearch 문서도 RandomAccess가 아닌 큰 리스트는 노드 이동이 O(n) 든다고 적습니다.<\/p>\n<p>직접 짤 때 첫 번째 함정은 중간값 오버플로입니다. (lo + hi) / 2는 두 값의 합이 Int 최댓값 2^31 - 1을 넘으면 음수가 됩니다. Joshua Bloch는 2006년 글에서 자신이 JDK의 Arrays에 쓴 이진 탐색에도 이 버그가 있었고 원소가 2^30개 이상인 배열에서 드러난다고 밝혔습니다. 앱의 배열에서는 드물어도 답의 범위가 Int 끝까지 가는 매개 변수 탐색에서는 실제로 생기므로 lo + (hi - lo) / 2나 (lo + hi) ushr 1을 씁니다. 두 번째는 경계입니다. 반열린 구간 [lo, hi)면 while (lo &lt; hi)와 hi = mid, 닫힌 구간이면 while (lo &lt;= hi)와 hi = mid - 1로 짝을 맞춰야 하고, 섞으면 무한 루프나 원소 누락이 납니다. lo 왼쪽은 모두 거짓, hi부터는 모두 참이라는 루프 불변식을 먼저 정하고 짜면 이런 실수가 줄어듭니다.<\/p>\n<p>지도 앱에서는 경로 꼭짓점마다 출발점부터의 누적 거리를 배열로 두면 단조 증가하므로, 주행한 거리로 지금 어느 구간에 있는지를 이진 탐색으로 찾습니다. 다만 주행 중에는 직전 구간에서 앞으로 몇 칸만 보면 되므로 선형 탐색이 더 싸고, 재탐색으로 경로가 바뀌었거나 위치가 크게 튀었을 때 이진 탐색을 씁니다. 성능 회귀가 처음 생긴 커밋을 찾는 git bisect도 이 커밋부터 느리다는 단조성 위에서 동작합니다.<\/p>\n<pre class=\"kotlin\"><code>// 존재 확인과 삽입 위치는 표준 API로\nval i = sortedIds.binarySearch(id)\nval insertAt = if (i &gt;= 0) i else -(i + 1)       // 음수면 없음\n\n// 개념 코드: 조건이 처음 참이 되는 위치. 불변식: [0, lo)는 거짓, [hi, n)은 참\ninline fun firstTrue(n: Int, cond: (Int) -&gt; Boolean): Int {\n    var lo = 0\n    var hi = n\n    while (lo &lt; hi) {\n        val mid = (lo + hi) ushr 1               // 합이 Int를 넘어도 올바른 중간값\n        if (cond(mid)) hi = mid else lo = mid + 1\n    }\n    return lo                                    // 모두 거짓이면 n\n}\nval segment = firstTrue(cumulative.size) { cumulative[it] &gt; traveled } - 1<\/code><\/pre>","f":"<ul>\n<li><strong>원소가 계속 추가되면서 경계 검색도 잦으면?<\/strong> 위치 기록처럼 끝에만 붙는 데이터는 정렬이 유지되므로 배열 끝에 붙이고 이진 탐색하면 됩니다. 중간에 끼어드는 값이 많으면 끼워 넣기가 O(n)이므로, TreeMap의 floorKey, ceilingKey처럼 균형 트리로 넣기와 찾기를 모두 O(log n)에 합니다.<\/li>\n<li><strong>실수 범위에서 이진 탐색은 어떻게 끝냅니까?<\/strong> hi - lo가 허용 오차보다 작아질 때까지 도는 조건은 허용 오차가 부동소수점 간격보다 작으면 끝나지 않을 수 있습니다. 한 번 돌 때마다 구간이 절반이 되므로 필요한 정밀도에 맞춰 반복 횟수를 고정합니다.<\/li>\n<li><strong>이진 탐색보다 선형 탐색이 나은 경우는?<\/strong> 원소가 수십 개면 캐시에 다 들어가고 분기 예측이 잘 맞는 선형 탐색이 비슷하거나 빠를 수 있습니다. 한두 번만 찾을 데이터라면 정렬 비용 O(n log n)까지 치면 정렬 없이 선형 탐색 O(n)이 낫습니다.<\/li>\n<\/ul>"},{"no":149,"t":"동적 계획법은 무엇이고, 메모이제이션과 타뷸레이션은 어떻게 고릅니까? 분할 정복과는 무엇이 다릅니까?","a":"<p>동적 계획법은 큰 문제를 작은 문제로 나눴을 때 같은 작은 문제가 반복해서 나오면, 한 번 푼 답을 저장해 다시 쓰는 방법입니다. 같은 하위 문제가 반복되는 중복 하위 문제와, 하위 문제의 최적 답을 모으면 전체 최적 답이 되는 최적 부분 구조가 있어야 씁니다. 분할 정복도 문제를 나누지만 하위 문제가 서로 독립이라 저장할 이유가 없다는 점이 다릅니다.<\/p>\n<p>메모이제이션은 재귀를 그대로 두고 결과를 캐시하는 위에서 아래 방식이라 점화식을 옮기기 쉽고 필요한 상태만 계산합니다. 대신 재귀 깊이가 입력 크기에 비례하면 StackOverflowError가 날 수 있고 호출과 캐시 조회 비용이 붙습니다. 타뷸레이션은 작은 상태부터 표를 채우는 아래에서 위 방식이라 스택 문제가 없고 배열을 순서대로 훑어 빠르며, 직전 행만 남겨 메모리를 줄이기 쉽습니다. 그래서 도달하는 상태가 일부뿐이면 메모이제이션, 표 대부분을 채워야 하면 타뷸레이션을 고릅니다. 어느 쪽이든 상태와 전이, 초기값을 먼저 말로 정하고, 시간은 상태 수 곱하기 상태 하나의 전이 비용으로 셉니다. Kotlin에서 깊은 재귀를 피할 수 없으면 호출 스택을 힙에 두는 DeepRecursiveFunction을 쓰는데, 문서는 재귀가 천 번보다 깊어질 때를 기준으로 듭니다. 상태가 정수 두 개라면 Pair를 키로 한 HashMap보다 2차원 배열이 박싱과 할당이 없어 빠릅니다.<\/p>\n<p>대표 예가 편집 거리입니다. dp[i][j]를 첫 문자열 앞 i글자를 둘째 문자열 앞 j글자로 바꾸는 최소 편집 수로 두면, 두 글자가 같을 때 dp[i-1][j-1]이고 다르면 삭제, 삽입, 교체에 해당하는 세 칸 중 최솟값에 1을 더합니다. 시간은 O(nm)이고 직전 행만 있으면 되므로 메모리는 O(min(n, m))으로 줄입니다. 장소명 오타 교정에 쓸 때 음절 단위로 재면 자모 하나만 틀린 \"감남\"과 전혀 다른 \"눈남\"이 모두 \"강남\"과 거리 1이므로, 8절의 검색어 자동완성 문항처럼 자모로 분해한 뒤 재야 틀린 정도가 거리에 드러납니다. 두 목록의 차이를 구하는 diff는 같은 문제를 삽입과 삭제만으로 풀되, 표 전체 대신 차이에 비례해 계산하는 Myers 알고리즘을 씁니다(8절의 DiffUtil 문항).<\/p>\n<p>분할 정복의 대표는 병합 정렬, 퀵 정렬, 이진 탐색입니다. 경로 선의 점을 줄이는 Douglas-Peucker도 분할 정복으로, 양 끝을 잇는 선분에서 가장 먼 점이 허용 오차보다 멀면 그 점에서 둘로 나눠 각각 재귀하고 가까우면 사이 점을 버립니다(7절의 경로 선 문항). 동적 계획법의 대표는 편집 거리, 최장 공통 부분 수열, 배낭, 모든 간선을 V-1번 완화하는 벨만 포드입니다. 분할 정복에 메모이제이션을 붙였는데 캐시 적중이 거의 없다면 애초에 하위 문제가 겹치지 않는다는 신호입니다.<\/p>\n<pre class=\"kotlin\"><code>// 편집 거리: 직전 행만 남겨 메모리 O(m). 짧은 문자열을 b로 넘기면 O(min(n, m))\nfun editDistance(a: String, b: String): Int {\n    var prev = IntArray(b.length + 1) { it }       // dp[0][j] = j\n    var cur = IntArray(b.length + 1)\n    for (i in 1..a.length) {\n        cur[0] = i                                  // dp[i][0] = i\n        for (j in 1..b.length) {\n            val cost = if (a[i - 1] == b[j - 1]) 0 else 1\n            cur[j] = minOf(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost)  // 삭제, 삽입, 교체\n        }\n        val t = prev; prev = cur; cur = t\n    }\n    return prev[b.length]\n}<\/code><\/pre>","f":"<ul>\n<li><strong>탐욕 알고리즘과는 무엇이 다릅니까?<\/strong> 탐욕은 매 단계 가장 좋아 보이는 선택을 확정하고 되돌아보지 않아, 그 선택이 전체 최적해에 들어간다는 탐욕 선택 속성이 증명될 때만 맞습니다. 동전이 1, 3, 4원일 때 6원을 탐욕으로 거슬러 주면 4+1+1로 3개지만, 동적 계획법은 하위 답을 모두 비교해 3+3의 2개를 찾습니다.<\/li>\n<li><strong>편집 경로까지 복원하려면?<\/strong> 전체 표를 남기고 끝 칸에서부터 어느 칸에서 왔는지 거꾸로 따라갑니다. 메모리가 부족하면 분할 정복과 결합한 Hirschberg 알고리즘으로 O(min(n, m)) 메모리에 경로를 구합니다.<\/li>\n<li><strong>지도 서비스에서는 동적 계획법이 어디에 나옵니까?<\/strong> GPS 궤적을 도로에 맞추는 맵 매칭을 은닉 마르코프 모델로 푸는 방법이 대표적입니다. GPS 점마다 근처 도로 후보를 상태로 두고 위치 오차와 후보 사이 이동의 그럴듯함을 점수로 매긴 뒤, 시점마다 후보별로 가장 좋은 이전 후보만 남기는 비터비 알고리즘으로 궤적 전체에서 가장 그럴듯한 도로 순서를 고릅니다. 음영 구간 처리는 7절의 GPS가 튀거나 끊기는 곳 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":150,"t":"시간 복잡도가 같은 두 코드의 실제 속도가 크게 다른 이유는 무엇이고, Android에서는 무엇이 상수 비용을 키웁니까?","a":"<p>Big-O는 n이 커질 때의 증가율만 보고 상수와 하드웨어 효과를 지우기 때문입니다. 실제 속도는 캐시 적중률을 정하는 메모리 접근 패턴, 분기 예측, 객체 할당과 GC, 박싱, 가상 호출 같은 상수에 크게 좌우되고, n이 작으면 복잡도가 나쁜 쪽이 이기기도 합니다. Android에서는 박싱, 짧게 사는 객체의 할당과 그것을 치우는 GC, 그리고 코드가 인터프리터, JIT, AOT 중 어느 상태로 실행되는지가 상수를 키웁니다.<\/p>\n<p>같은 O(n) 순회라도 연속 배열과 연결 리스트의 차이는 캐시 지역성에서 옵니다(8절의 ArrayList와 LinkedList 문항). CPU는 분기 방향을 추측해 미리 실행하다 틀리면 파이프라인을 비우므로, 정렬된 데이터를 조건문으로 거르면 추측이 잘 맞고 무작위 데이터는 느립니다. n이 작을 때 상수가 복잡도를 이기는 예가 OpenJDK TimSort의 원소 32개 미만 이진 삽입 정렬과 최근 검색어 수십 개의 선형 검색입니다. ArrayMap은 반대로 HashMap보다 대개 느린 조회를 감수하고 메모리를 아끼는 선택입니다(8절의 ArrayMap 문항).<\/p>\n<p>Android에서 첫째는 박싱입니다. <code>List&lt;Int&gt;<\/code>, <code>Map&lt;Int, V&gt;<\/code>, <code>Int?<\/code>, 제네릭 T에 들어간 Int는 Integer 객체가 됩니다. JVM은 -128~127의 박싱 값을 캐시하지만 그 밖의 값은 박싱할 때 따로 객체가 되고, 읽을 때마다 참조를 따라가 언박싱합니다. value class도 제네릭이나 인터페이스 타입으로 쓰이면 박싱됩니다(1절의 value class 문항). 경로 좌표 수만 개를 <code>List&lt;LatLng&gt;<\/code>로 들면 점마다 객체가 생기지만, 위도와 경도를 번갈아 담은 DoubleArray는 연속 메모리 하나라 순회가 빠르고 GC가 볼 객체도 하나입니다. 둘째는 할당과 GC입니다. ART에서 할당 자체는 싸고 GC도 대부분 앱 스레드와 동시에 돌지만, 짧게 사는 객체를 많이 만들면 GC가 자주 돌며 CPU와 메모리 대역을 쓰고 그만큼 메인 스레드와 경쟁합니다. 그래서 그리기, 스크롤 콜백, 목록 항목 바인딩처럼 프레임마다 실행되는 곳에서 할당을 줄이며, Lint의 DrawAllocation도 그리기와 레이아웃 중 할당을 경고합니다. 흔한 숨은 할당은 List를 for로 돌 때의 Iterator, inline이 아닌 함수에 넘기는 캡처 람다, 가변 인자 배열, 반복문 안의 문자열 이어 붙이기와 포매팅입니다. Compose ui-util에 Iterator 없이 인덱스로 도는 fastForEach가 있는 이유이고, Sequence의 비용은 1절의 Sequence 문항, GC 동작은 10절의 GC 문항에서 다룹니다.<\/p>\n<p>셋째는 실행 상태입니다. 같은 코드라도 처음에는 인터프리터나 JIT로 돌다가 프로필에 따라 AOT 컴파일되므로 언제 재느냐에 따라 속도가 다르고, Baseline Profile은 포함한 경로를 미리 AOT 컴파일해 첫 실행부터 코드 실행 속도를 약 30% 높입니다(10절의 JIT와 AOT 문항). 그래서 판단은 복잡도로 후보를 좁힌 뒤 실제 데이터 크기로 잽니다. 함수 단위는 Jetpack Microbenchmark가 워밍업과 반복을 처리하고 시간과 할당 횟수를 함께 내며, Benchmark 1.3.0-beta01과 AGP 8.4.0 이상에서는 벤치마크 APK를 기본으로 AOT 컴파일합니다. debuggable 빌드, 에뮬레이터, 배터리 25% 미만이면 오류를 내 잘못된 측정을 막고, 화면 단위 측정은 6절의 화면 버벅임 문항에서 다룹니다.<\/p>\n<pre class=\"kotlin\"><code>// 같은 O(n) 합계라도 상수 비용이 다르다\nval boxed: List&lt;Int&gt; = List(n) { it }   // Integer 참조 배열. -128~127 밖의 값은 박싱할 때 객체 생성\nval packed = IntArray(n) { it }          // int n개가 연속 메모리에\n\nvar a = 0\nfor (x in boxed) a += x                  // Iterator를 거쳐 원소마다 참조를 따라가 언박싱\nvar b = 0\nfor (x in packed) b += x                 // 인덱스 루프로 컴파일되어 순차로 읽음<\/code><\/pre>","f":"<ul>\n<li><strong>마이크로 벤치마크는 어디서 틀립니까?<\/strong> 워밍업 부족, 결과를 쓰지 않아 컴파일러가 계산을 없애는 것, 상수 접기, 측정 중에 끼어드는 GC, 발열로 클럭이 내려가는 것입니다. 같은 입력만 반복해 캐시만 재는 것도 흔해서, Microbenchmark 문서도 반복마다 입력을 바꿔 캐시만 재는 일을 피하라고 적습니다.<\/li>\n<li><strong>할당을 줄이려고 객체 풀을 만들어야 합니까?<\/strong> 대부분 아닙니다. 풀은 메모리를 계속 잡아 두고 반납한 객체를 다시 쓰는 버그를 만드는 반면, 짧게 사는 객체 정리는 GC가 맡는 일이고 Android 17 글도 ART GC가 새로 할당된 객체를 더 자주, 가볍게 수집하게 됐다고 적습니다. 그리기 코드의 Paint나 Path처럼 프레임마다 같은 객체를 만드는 곳만 필드로 미리 만들어 재사용하고, 나머지는 할당 기록으로 문제를 확인한 곳만 고칩니다.<\/li>\n<li><strong>박싱된 Int를 ===로 비교하면 어떻게 됩니까?<\/strong> -128~127은 캐시된 같은 객체라 true, 그 밖은 서로 다른 객체라 false가 나와 작은 값으로만 테스트하면 버그가 숨습니다. Kotlin 문서도 숫자는 ==로 비교하라고 적습니다.<\/li>\n<\/ul>"}]},{"no":9,"title":"네트워크","qs":[{"no":151,"t":"앱이 HTTPS API를 호출해 화면에 결과가 뜨기까지 어떤 일이 일어납니까?","a":"<p>새 연결이라면 DNS 조회, TCP 연결, TLS 핸드셰이크, HTTP 요청과 응답, 응답 변환과 UI 반영 순서로 진행됩니다. 캐시에 없는 도메인에 TCP 위 TLS 1.3으로 처음 연결하면 DNS 1 RTT, TCP 3-way handshake 1 RTT, TLS 1.3 핸드셰이크 1 RTT, 요청과 응답 1 RTT로 서버 처리 시간을 빼도 최소 4 RTT가 듭니다. 첫 요청이 느리고, 연결 재사용과 캐시가 체감 속도를 좌우하는 이유입니다.<\/p>\n<p>네트워크 쪽을 나눠 보면 이렇습니다. DNS는 앱과 OS의 캐시를 먼저 보고 없으면 리졸버에 묻습니다. TCP 연결을 연 뒤 TLS 핸드셰이크에서 키를 합의하고 서버 인증서를 검증하며, 같은 핸드셰이크 안의 ALPN으로 HTTP/2를 쓸지 정합니다. 응답 본문은 혼잡 윈도우가 작게 시작하는 slow start 때문에 처음에는 천천히 받고, 셀룰러 모뎀이 저전력 상태였다면 깨우는 시간도 더해집니다. 단계별 원리는 9절의 DNS, TCP, TLS 1.3 문항에서 다룹니다.<\/p>\n<p>앱 안에서는 Retrofit 인터페이스 호출이 OkHttp Call이 되고, application interceptor가 인증 헤더 같은 공통 헤더를 붙이며, 연결 풀에서 같은 호스트의 살아 있는 연결을 찾습니다. Retrofit의 suspend 함수는 내부에서 enqueue로 OkHttp 비동기 호출을 쓰고 응답 변환도 OkHttp 스레드의 콜백에서 하므로 viewModelScope에서 바로 불러도 되고, 코루틴이 취소되면 Call.cancel()이 불립니다. 다만 요청 객체 생성과 @Body 직렬화는 기본으로는 호출한 스레드에서 하므로, 큰 본문을 보내는 호출은 이 비용이 메인 스레드에 남습니다. Retrofit이 제공하는 Gson, Moshi 컨버터는 withStreaming()으로 이 직렬화를 본문을 보내는 시점의 OkHttp 스레드로 미룰 수 있습니다. 그 뒤 Repository가 DTO를 도메인 모델로 바꾸고, ViewModel이 UiState를 갱신하면 Compose가 리컴포지션으로 화면을 다시 그립니다.<\/p>\n<p>줄이는 방법도 단계별입니다. 연결을 재사용하면 DNS, TCP, TLS 단계가 사라지고, HTTP/2는 연결 하나로 여러 요청을 동시에 보내며, HTTP 캐시가 적중하면 요청 자체가 사라집니다. 측정은 OkHttp EventListener의 dnsStart, connectStart, secureConnectStart, responseHeadersStart 같은 콜백으로 단계별 시각을 모아 p50과 p95로 봅니다. 서버가 재는 응답 시간에는 이 네트워크 구간과 앱의 파싱, 렌더링 시간이 빠져 있어서, 단계별 분해가 원인을 찾는 출발점이 됩니다. 요청 수와 크기를 줄이는 최적화는 6절의 네트워크 성능 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>두 번째 요청부터는 무엇이 빨라집니까?<\/strong> 같은 호스트의 연결이 풀에 살아 있으면 DNS, TCP, TLS가 빠지고 요청과 응답 1 RTT만 남습니다. 연결이 오래 쉬어 서버나 NAT가 먼저 끊었다면 다시 연결해야 하므로, 죽은 유휴 연결을 꺼냈을 때의 실패도 함께 봅니다.<\/li>\n<li><strong>TLS 세션 재개를 쓰면 0-RTT로 첫 요청을 함께 보낼 수 있습니까?<\/strong> TLS 1.3 프로토콜에는 0-RTT가 있지만 Android 10 이상의 플랫폼 TLS는 0-RTT를 지원하지 않습니다. 플랫폼 TLS에서 세션 재개는 인증서 전송과 검증을 줄이는 데 그치므로, 왕복을 줄이려면 연결 재사용이 먼저입니다.<\/li>\n<li><strong>화면 하나가 API 세 개를 차례로 부르면?<\/strong> 앞 응답으로 다음 요청을 만드는 의존 관계면 RTT가 세 번 쌓입니다. 서로 독립이면 coroutineScope 안에서 async로 동시에 보내고, 의존 관계면 화면 단위로 응답을 모아 주는 API를 서버와 맞춥니다.<\/li>\n<\/ul>"},{"no":152,"t":"TCP와 UDP는 어떻게 다르고, TCP 연결 수립과 종료, TIME_WAIT는 왜 필요합니까?","a":"<p>TCP는 연결을 맺고 순서와 도착을 보장하며 흐름 제어와 혼잡 제어를 하는 바이트 스트림이고, UDP는 연결 없이 데이터그램을 보내며 순서와 도착을 보장하지 않습니다. 고르는 기준은 늦게 도착한 데이터에도 가치가 있느냐입니다. 연결 수립에 세 번, 종료에 네 번 주고받는 절차와 TIME_WAIT는 양쪽이 상태를 확실히 맞추고, 옛 패킷이 새 연결에 섞이지 않게 하려는 장치입니다.<\/p>\n<p>UDP가 맞는 곳은 늦은 패킷을 기다리느니 버리고 다음 것을 쓰는 실시간 음성, 영상, 게임과, 질문 하나에 답 하나로 끝나 연결 설정 비용이 아까운 DNS입니다. HTTP/3의 QUIC처럼 TCP의 한계를 피해 필요한 신뢰성을 직접 구현할 때도 UDP 위에 만듭니다. TCP에서 자주 나는 버그는 메시지 경계를 가정하는 것입니다. TCP는 경계가 없는 바이트 흐름이라 read 한 번에 메시지 하나가 온다는 보장이 없으므로, 소켓 프로토콜을 직접 만들면 길이 접두나 구분자로 프레이밍해야 합니다.<\/p>\n<p>연결 수립은 클라이언트의 SYN, 서버의 SYN-ACK, 클라이언트의 ACK입니다. 양쪽이 자기 초기 순서 번호를 보내고 상대에게 확인받아야 하는데, 서버의 확인과 서버 순서 번호 전송을 한 패킷으로 합쳐 세 번이 됩니다. 두 번으로 끝내면 서버는 자기 순서 번호가 전달됐는지 모르고, 네트워크에 떠돌던 옛 SYN 때문에 원치 않는 연결이 열릴 수도 있습니다. 초기 순서 번호를 무작위로 고르는 것도 이전 연결의 패킷과 섞이지 않고 위조를 어렵게 하려는 것입니다. SYN만 대량으로 보내 서버의 반쯤 열린 연결 큐를 채우는 SYN flood는, 큐가 넘칠 때 상태를 저장하지 않고 연결 정보를 서버 순서 번호에 암호학적으로 담아 보내는 SYN 쿠키로 막습니다.<\/p>\n<p>종료가 네 번인 이유는 TCP가 방향별로 따로 닫는 half-close를 지원하기 때문입니다. 한쪽이 FIN을 보내고 ACK를 받아도 상대는 남은 데이터를 다 보낸 뒤 자기 FIN을 보냅니다. 먼저 닫은 쪽은 최대 세그먼트 수명의 두 배인 2MSL 동안 TIME_WAIT로 기다립니다. 마지막 ACK가 유실되어 상대가 FIN을 다시 보내면 응답하기 위해서, 그리고 늦게 도착한 옛 패킷이 같은 주소와 포트로 새로 맺은 연결에 섞이지 않게 하기 위해서입니다. 서버에 TIME_WAIT가 쌓이면 서버가 먼저 끊는 짧은 연결이 많다는 뜻이라 keep-alive로 연결을 재사용하는 것이 근본 해결이고, CLOSE_WAIT가 쌓이면 상대는 닫았는데 우리 코드가 소켓을 닫지 않은 버그입니다. Android 앱은 대개 클라이언트라 TIME_WAIT 부담은 작고, 대신 OkHttp 응답 본문을 다 읽거나 닫지 않아 연결이 풀로 돌아가지 못하는 실수가 흔합니다.<\/p>","f":"<ul>\n<li><strong>UDP 위에 신뢰성을 직접 만들려면 무엇이 필요합니까?<\/strong> 순서 번호, 확인 응답, 재전송, 혼잡 제어가 필요합니다. 이를 표준으로 만든 것이 QUIC이고, 손실 감지와 혼잡 제어는 RFC 9002에 따로 정의되어 있습니다.<\/li>\n<li><strong>UDP가 NAT와 방화벽에서 불리한 이유는?<\/strong> 연결 상태가 없어 NAT 매핑이 짧게 사라지므로 오래 쓰려면 주기적으로 패킷을 보내야 하고, UDP 자체를 막는 망도 있습니다. 그래서 HTTP/3 클라이언트는 TCP로 되돌아갈 경로를 함께 둡니다.<\/li>\n<li><strong>RST로 끊으면 무엇이 다릅니까?<\/strong> TIME_WAIT 없이 바로 끊지만 아직 보내지 못한 데이터는 버려집니다. 상대는 정상 종료가 아니라 연결 재설정 오류로 받습니다.<\/li>\n<\/ul>"},{"no":153,"t":"TCP의 흐름 제어와 혼잡 제어는 어떻게 다르고, 모바일 환경에는 어떤 영향을 줍니까?","a":"<p>흐름 제어는 받는 쪽 버퍼가 넘치지 않게 하고, 혼잡 제어는 중간 네트워크가 넘치지 않게 합니다. 흐름 제어는 수신자가 알려 주는 수신 윈도우로, 혼잡 제어는 송신자가 스스로 추정하는 혼잡 윈도우로 하며, 확인 없이 보낼 수 있는 양은 둘 중 작은 값입니다. 모바일에서는 무선 손실, 순간 끊김, 짧은 연결 때문에 혼잡 제어가 대역폭을 다 쓰지 못하는 일이 잦습니다.<\/p>\n<p>혼잡 윈도우는 작게 시작해 왕복마다 두 배로 늘리는 slow start를 거치고, 임계점부터는 선형으로 늘리다가 손실을 감지하면 크게 줄입니다. 늘릴 때는 더하고 줄일 때는 곱하는 이 방식을 AIMD라고 부릅니다. 알고리즘은 손실을 혼잡 신호로 보는 CUBIC(RFC 9438) 계열과, 병목 대역폭과 최소 왕복 시간을 재서 보낼 속도를 정하는 BBR 계열이 있습니다. 중복 ACK가 세 번 오면 타이머를 기다리지 않고 빠진 부분을 바로 재전송하고 윈도우를 일부만 줄이지만, 재전송 타이머가 만료되면 혼잡 윈도우를 최소로 줄이고 slow start부터 다시 합니다.<\/p>\n<p>모바일에서는 세 가지가 문제입니다. 첫째, 무선 구간에서는 혼잡이 아닌 전파 문제로도 패킷을 잃는데, 손실 기반 알고리즘은 이것까지 혼잡으로 보고 속도를 줄입니다. 둘째, 주행 중 터널이나 음영 구간에서 잠깐 끊기면 재전송 타이머가 만료되어 혼잡 윈도우가 처음부터 다시 커져야 하므로, 끊긴 시간보다 회복이 더 오래 걸립니다. 셋째, 기지국과 중간 장비의 큰 버퍼에 패킷이 쌓이면 손실 대신 지연이 계속 늘어나는 버퍼블로트가 생겨, 대용량 다운로드가 같은 망을 쓰는 작은 API 응답까지 늦춥니다.<\/p>\n<p>앱이 직접 바꿀 수 있는 것은 제한적입니다. 다운로드 속도를 정하는 혼잡 제어는 보내는 쪽인 서버 커널의 알고리즘이기 때문입니다. 앱은 연결을 재사용해 slow start를 반복하지 않게 하고, 응답 크기를 줄이고, 지도 타일 같은 큰 다운로드와 경로 API 같은 작은 요청이 서로 막지 않게 우선순위와 동시성을 조절합니다. 짧은 연결은 slow start 구간만 거치다 끝나 대역폭을 다 쓰지 못하므로 연결 재사용이 속도에 직접 영향을 줍니다. HTTP/3의 QUIC은 손실 감지와 혼잡 제어를 사용자 공간에서 구현하므로, 서버와 클라이언트 라이브러리가 OS 업데이트 없이 알고리즘을 바꿀 수 있습니다.<\/p>","f":"<ul>\n<li><strong>대역폭 지연 곱이란 무엇입니까?<\/strong> 대역폭에 왕복 시간을 곱한 값으로, 회선을 꽉 채우려면 이만큼의 데이터가 확인 없이 날아가고 있어야 합니다. 수신 윈도우나 혼잡 윈도우가 이보다 작으면 대역폭을 다 쓰지 못합니다.<\/li>\n<li><strong>수신 윈도우가 0이 되면 어떻게 됩니까?<\/strong> 송신자는 보내기를 멈추고 윈도우가 열렸는지 주기적으로 확인합니다. 받는 애플리케이션이 소켓에서 늦게 읽어 수신 버퍼가 찬 것이므로 받는 쪽 처리 속도 문제입니다.<\/li>\n<li><strong>손실 기반과 측정 기반 알고리즘은 누가 고릅니까?<\/strong> 데이터를 보내는 쪽이 고릅니다. 다운로드는 서버나 CDN 운영 쪽이 측정으로 정하고, 앱은 업로드에서만 단말 커널의 알고리즘을 따르며, QUIC을 쓰면 라이브러리 구현을 따릅니다.<\/li>\n<\/ul>"},{"no":154,"t":"HTTP/1.1, HTTP/2, HTTP/3는 무엇이 다르고, HOL 블로킹은 각각 어떻게 나타납니까?","a":"<p>HOL 블로킹은 앞의 항목이 막혀 뒤의 항목까지 진행하지 못하는 현상이고, 버전이 올라가며 막히는 지점이 아래 계층으로 내려가다 사라졌습니다. HTTP/1.1은 연결 하나에서 응답이 요청 순서대로 와야 해서 막히고, HTTP/2는 애플리케이션 계층의 막힘은 풀었지만 TCP의 순서 보장 때문에 막히며, HTTP/3는 QUIC이 스트림마다 따로 순서를 관리해 전송 계층의 막힘까지 없앴습니다.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>HTTP/1.1<\/th>\n<th>HTTP/2<\/th>\n<th>HTTP/3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>표준<\/td>\n<td>RFC 9112<\/td>\n<td>RFC 9113<\/td>\n<td>RFC 9114<\/td>\n<\/tr>\n<tr>\n<td>전송<\/td>\n<td>TCP<\/td>\n<td>TCP, 실제로는 TLS 위에서 ALPN h2로 협상<\/td>\n<td>UDP 위 QUIC, ALPN h3<\/td>\n<\/tr>\n<tr>\n<td>메시지 형식<\/td>\n<td>텍스트<\/td>\n<td>바이너리 프레임<\/td>\n<td>바이너리 프레임<\/td>\n<\/tr>\n<tr>\n<td>동시 요청<\/td>\n<td>연결 하나에 한 번에 응답 하나, 연결을 여러 개 열어 병렬화<\/td>\n<td>연결 하나에 여러 스트림을 섞어 보냄<\/td>\n<td>연결 하나에 서로 독립인 스트림<\/td>\n<\/tr>\n<tr>\n<td>헤더 압축<\/td>\n<td>없음<\/td>\n<td>HPACK<\/td>\n<td>QPACK<\/td>\n<\/tr>\n<tr>\n<td>HOL 블로킹<\/td>\n<td>앞 응답이 늦으면 뒤 요청이 대기<\/td>\n<td>패킷 하나 손실에 모든 스트림이 대기<\/td>\n<td>손실된 스트림만 대기<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>HTTP/1.1은 느린 응답 하나가 같은 연결의 뒤 요청을 모두 막습니다. 파이프라이닝은 응답 순서가 고정이라 HOL이 그대로였고 중간 장비 호환 문제로 거의 쓰이지 않았으며, 브라우저는 호스트당 연결을 여러 개 열어 병렬로 처리했습니다. HTTP/2는 요청과 응답을 스트림으로 쪼개 연결 하나에 섞어 보내고, HPACK으로 인증 토큰처럼 매번 반복되는 헤더를 줄입니다. 연결 수가 줄어 핸드셰이크와 slow start 비용이 줄므로 작은 API 요청을 많이 보내는 모바일 앱에 유리하고, OkHttp도 서버가 HTTP/2를 지원하면 같은 호스트 요청을 연결 하나로 보냅니다.<\/p>\n<p>하지만 HTTP/2의 스트림은 결국 TCP 바이트 흐름 하나에 실리므로, 패킷 하나가 손실되면 재전송될 때까지 다른 스트림의 데이터도 애플리케이션에 넘어가지 못합니다. 손실이 잦은 망에서 HTTP/2 연결 하나가 HTTP/1.1 연결 여러 개보다 느릴 수 있는 이유이고, 연결 하나가 끊기면 그 위의 모든 요청이 함께 실패합니다. HTTP/3는 QUIC 스트림이 서로 독립이라 손실된 스트림만 기다리고, 헤더 압축도 HPACK을 바꿔 HOL 블로킹을 줄인 QPACK(RFC 9204)을 씁니다. 다만 한 스트림 안의 순서는 지키므로, 큰 응답 하나는 자기 스트림의 손실 패킷을 기다립니다.<\/p>\n<p>HTTP/1.1 시절 연결 수 제한을 피하려던 도메인 샤딩, 이미지 스프라이트, 파일 합치기는 HTTP/2에서 필요 없거나 역효과입니다. 샤딩은 멀티플렉싱의 이점을 버리고 핸드셰이크와 혼잡 제어를 여러 번 하게 만들고, 파일 합치기는 작은 변경에도 큰 파일의 캐시를 통째로 무효화합니다. 반면 앞 응답이 있어야 다음 요청을 만드는 API 호출을 서버에서 하나로 묶는 것은 연결 수가 아니라 왕복 수를 줄이므로 HTTP/2에서도 유효합니다.<\/p>","f":"<ul>\n<li><strong>ALPN은 무엇입니까?<\/strong> TLS 핸드셰이크 안에서 쓸 애플리케이션 프로토콜(h2, http/1.1)을 협상하는 확장입니다. 별도 왕복 없이 프로토콜이 정해지고, HTTP/3는 ALPN 토큰 h3를 씁니다.<\/li>\n<li><strong>HTTP/2 서버 푸시는 앱에서 쓸 만합니까?<\/strong> 명세에는 있지만 성능 이득이 불분명하고 오히려 나빠진 사례가 많아, Chrome은 106부터 기본으로 껐고 대안으로 103 Early Hints를 듭니다. 앱 API에서는 필요한 데이터를 응답에 함께 담거나 미리 가져오기로 풉니다.<\/li>\n<li><strong>HTTP/2 연결이 끊기면 앱에서는 무엇을 챙깁니까?<\/strong> 그 연결의 모든 스트림이 함께 실패하므로, 멱등 요청은 새 연결로 다시 보내고 그렇지 않은 요청은 실패를 따로 처리합니다. 기준은 9절의 타임아웃과 재시도 문항과 같습니다.<\/li>\n<\/ul>"},{"no":155,"t":"QUIC과 HTTP/3는 모바일에 어떤 이점이 있고, Android 앱에서는 어떻게 쓸 수 있습니까?","a":"<p>모바일에서 큰 이점은 연결 이전과 스트림별 독립 전달입니다. QUIC은 연결을 IP 주소와 포트가 아니라 연결 ID로 식별해 Wi-Fi에서 셀룰러로 바뀌어도 연결을 유지할 수 있고, 손실된 스트림만 기다리므로 손실이 잦은 무선망에서 덜 느려집니다. 다만 OkHttp는 HTTP/3를 기본 지원하지 않으므로, Android 앱에서는 Cronet이나 플랫폼 HttpEngine을 쓰거나 OkHttp 아래에 Cronet을 전송 계층으로 붙입니다.<\/p>\n<p>QUIC(RFC 9000)은 전송 핸드셰이크와 TLS 1.3 핸드셰이크를 하나로 합쳐(RFC 9001) 새 연결을 1 RTT로 맺고, 이전 연결 정보가 있으면 0-RTT로 첫 요청을 함께 보낼 수 있습니다. 손실 감지와 혼잡 제어(RFC 9002)를 사용자 공간에서 구현해 OS 업데이트 없이 개선할 수 있고, HTTP/3(RFC 9114)가 그 위에 HTTP 의미론을 얹습니다. 새 전송 프로토콜을 만들면 인터넷의 NAT와 방화벽이 통과시키지 않으므로 이미 통과되는 UDP를 빌린 것입니다. 서버의 HTTP/3 지원은 보통 응답의 Alt-Svc 헤더로 알게 되어, 첫 연결은 TCP로 가고 다음 연결부터 QUIC을 씁니다.<\/p>\n<p>연결 이전에는 조건이 있습니다. RFC 9000은 핸드셰이크가 확정되기 전에는 연결 이전을 시작하지 못하게 하고, 상대가 disable_active_migration 전송 파라미터를 보냈으면 preferred_address를 따르는 경우가 아닌 한 다른 로컬 주소에서 보내지 못하게 합니다. 주행 중 네트워크가 바뀌는 상황의 이득은 서버와 클라이언트가 모두 이전을 허용할 때만 생기고, 서버도 RFC 9114가 적은 대로 연결 중 클라이언트 주소가 바뀔 수 있으니 IP 기반 로그와 접근 제어를 그에 맞춰야 합니다. 단점은 UDP를 막는 망에서는 QUIC 연결이 실패해 TCP로 되돌아가야 하고(RFC 9114는 이때 TCP 기반 HTTP를 시도해야 한다고 적습니다), 사용자 공간 처리라 CPU를 더 쓰며, 헤더까지 암호화되어 망 운영자가 진단하기 어렵다는 점입니다.<\/p>\n<p>Android에서 OkHttp의 Protocol.HTTP_3는 상수만 있고, KDoc에 기본 지원하지 않는다고 적혀 있습니다(5.5.1 기준). 그래서 선택지는 세 가지입니다. 첫째, Cronet은 Chromium 네트워크 스택을 라이브러리로 제공해 HTTP/3 over QUIC을 지원하고, 공식 문서는 Maps - Navigation &amp; Transit 같은 앱이 쓴다고 적습니다. play-services-cronet으로 Google Play 서비스의 Cronet을 불러오면 앱에 스택을 싣지 않아도 되고, CronetEngine은 하나만 만들어 공유합니다. 둘째, API 34와 S Extensions 7부터는 플랫폼의 android.net.http.HttpEngine이 같은 UrlRequest 방식의 API를 제공하고, setEnableQuic, addQuicHint, setConnectionMigrationOptions로 QUIC과 연결 이전 동작을 정합니다. 셋째, 기존 OkHttp와 Retrofit 코드를 유지하려면 Google의 cronet-transport-for-okhttp로 Cronet을 인터셉터나 Call.Factory로 붙입니다. 이때 OkHttp의 캐시, 재시도, 인증, 네트워크 인터셉터가 모두 우회되므로 같은 기능을 Cronet 엔진 쪽에서 다시 맞춰야 합니다.<\/p>\n<p>도입은 실험으로 결정합니다. 사용자군을 나눠 네트워크 종류와 통신사별 p95 지연과 실패율을 비교하고, UrlResponseInfo.getNegotiatedProtocol()로 실제로 QUIC으로 협상됐는지 집계하며, Play 서비스의 Cronet을 쓸 수 없는 기기를 위해 기존 OkHttp 경로를 남겨 둡니다.<\/p>","f":"<ul>\n<li><strong>연결 이전이 되면 앱 코드는 할 일이 없습니까?<\/strong> 진행 중인 요청이 살아남을 가능성이 커질 뿐 보장은 아닙니다. 이전이 허용되지 않거나 새 경로에서 실패하면 요청은 실패하므로 재시도와 멱등성 설계는 그대로 필요합니다.<\/li>\n<li><strong>HttpEngine으로 QUIC을 쓰면 0-RTT도 나갑니까?<\/strong> 나갈 수 있습니다. HttpEngine 문서는 addQuicHint 설명에서 세션 사이의 0-RTT 연결 수립을 쓰려면 디스크 HTTP 캐시가 필요하다고 적습니다. 그래서 서버는 early data로 받는 요청을 멱등한 것으로 제한해야 합니다(9절의 TLS 1.3 문항).<\/li>\n<li><strong>Cronet을 앱에 직접 넣으면 무엇을 잃습니까?<\/strong> 바이너리 크기가 늘고 보안 수정도 앱 업데이트로만 받습니다. cronet-transport-for-okhttp 문서도 Play 서비스로 플랫폼의 Cronet을 불러오는 방식을 권하고, 그것을 쓸 수 없으면 일반 OkHttp로 되돌아가라고 합니다.<\/li>\n<\/ul>"},{"no":156,"t":"TLS 1.3 핸드셰이크는 어떻게 진행되고, 0-RTT에는 어떤 위험이 있습니까?","a":"<p>TLS 1.3은 키 교환 값을 첫 메시지에 미리 실어 보내 새 연결을 1 RTT에 맺습니다. 0-RTT는 이전 세션에서 받은 키로 첫 메시지에 요청까지 싣는 모드인데, 공격자가 그 데이터를 그대로 다시 보내는 리플레이 공격을 막아 주지 않으므로 다시 실행돼도 안전한 요청에만 써야 합니다. Android 10 이상의 플랫폼 TLS는 모든 TLS 연결에 TLS 1.3을 기본으로 켜지만 0-RTT는 지원하지 않습니다.<\/p>\n<p>진행 순서는 이렇습니다. 클라이언트가 ClientHello에 지원하는 암호 모음과 키 교환 그룹, 그리고 ECDHE 공개값을 함께 보냅니다. 서버는 ServerHello에 자기 공개값을 담아 답하고, 이 시점부터 양쪽이 공유 비밀을 계산할 수 있어 이후의 서버 인증서, 인증서 개인키로 핸드셰이크 내용에 서명한 CertificateVerify, Finished를 모두 암호화해 보냅니다. 클라이언트는 인증서와 서명을 검증하고 자기 Finished와 함께 첫 HTTP 요청을 바로 보냅니다. TLS 1.2는 키 교환을 마치기까지 왕복이 두 번 필요했습니다.<\/p>\n<p>1.2에서 바뀐 점은 세 가지입니다. 정적 RSA와 정적 Diffie-Hellman 키 교환이 빠져 모든 공개키 기반 키 교환이 전방향 안전성을 갖고, 서버 개인키가 나중에 유출돼도 저장해 둔 과거 통신을 풀 수 없습니다. 오래된 암호 방식이 빠져 AEAD 방식만 남았고, ServerHello 이후의 핸드셰이크 메시지가 모두 암호화되어 인증서도 밖에서 보이지 않습니다. TLS 1.3 표준 문서는 2026-07 RFC 9846으로 개정되어 RFC 8446을 대체했습니다.<\/p>\n<p>0-RTT 데이터에는 전방향 안전성도, 연결 사이의 리플레이 방지도 없습니다. 결제 POST가 0-RTT로 나가면 공격자가 캡처한 데이터를 다시 보내 서버가 두 번 처리하게 만들 수 있습니다. 그래서 RFC 9846은 서버 인스턴스가 같은 0-RTT 핸드셰이크의 0-RTT를 최대 한 번만 받고, 클라이언트는 다시 보내도 안전하다고 판단한 early data만 보내도록 요구합니다. HTTP에서는 RFC 8470이 Early-Data 헤더와 425 Too Early 상태 코드를 정의해, 서버가 리플레이 위험이 큰 요청을 425로 거절하면 클라이언트가 핸드셰이크를 마친 뒤 다시 보냅니다. QUIC의 0-RTT도 같은 위험이 있어 HTTP/3에서 0-RTT를 쓸 때는 RFC 8470의 완화책을 반드시 적용해야 합니다.<\/p>\n<p>Android 앱에서는 쓰는 스택에 따라 다릅니다. 기본 설정의 OkHttp처럼 플랫폼 TLS 위에서 TCP로 통신하는 경로는 0-RTT를 보내지 않고, HttpEngine 같은 QUIC 스택은 0-RTT를 쓸 수 있으므로(9절의 QUIC과 HTTP/3 문항) 서버가 early data를 받는 엔드포인트를 멱등 요청으로 제한합니다. targetSdk 35 이상 앱은 TLS 1.0과 1.1을 쓸 수 없습니다. Android 17은 ClientHello를 서버 공개키로 암호화하는 ECH(RFC 9849)를 플랫폼에서 지원해, targetSdk 37 앱은 네트워킹 라이브러리와 서버가 지원할 때 ECH를 씁니다. 설정은 Network Security Config의 domainEncryption 요소로 하고, OkHttp는 5.5.0부터 opt-in으로 지원하며 Android 17에서만 동작합니다.<\/p>","f":"<ul>\n<li><strong>0-RTT를 쓰지 않으면 세션 재개는 의미가 없습니까?<\/strong> 아닙니다. PSK로 재개하면 인증서 전송과 서명 검증이 빠지고, PSK에 ECDHE를 함께 쓰는 모드는 전방향 안전성도 유지합니다. 왕복은 1 RTT로 같습니다.<\/li>\n<li><strong>포스트 양자 키 교환은 TLS 1.3에 어떻게 들어옵니까?<\/strong> 키 교환 그룹 하나로 들어옵니다. RFC 10024(2026-08)가 ML-KEM과 ECDHE를 결합한 X25519MLKEM768 등을 정의했고, Chrome은 131부터 이 코드포인트로 바꿨으며, Maven으로 배포되는 Conscrypt 2.7.0은 X25519MLKEM768을 기본으로 씁니다. 지금 저장한 트래픽을 나중에 양자 컴퓨터로 푸는 공격에 대비하는 것이고, 공개값이 커져 ClientHello가 커지는 비용이 있습니다.<\/li>\n<li><strong>ECH를 켜면 접속 대상이 완전히 숨겨집니까?<\/strong> 아닙니다. RFC 9849도 평문 DNS 질의나 서버 IP 주소로 대상 도메인이 드러날 수 있다고 적습니다. ECH 설정은 DNS HTTPS 레코드로 받으므로 보안 DNS와 함께 써야 효과가 납니다.<\/li>\n<\/ul>"},{"no":157,"t":"HTTPS에서 클라이언트는 서버 인증서를 어떻게 검증하고, 중간자 공격은 언제 성공합니까?","a":"<p>클라이언트는 서버가 보낸 인증서 체인이 기기가 신뢰하는 루트 CA까지 서명으로 이어지는지, 유효 기간과 도메인 이름이 맞는지 확인하고, 핸드셰이크의 서명으로 서버가 그 인증서의 개인키를 가졌는지 확인합니다. 중간자는 유효한 인증서의 개인키가 없어 가짜 인증서를 내밀 수밖에 없으므로, 공격은 클라이언트가 그 가짜를 믿게 되는 경우에만 성공합니다. 믿지 말아야 할 CA를 믿거나, CA가 잘못 발급했거나, 앱이 검증을 꺼 버린 경우입니다.<\/p>\n<p>검증 단계를 나누면, 서버는 자기 인증서와 중간 CA 인증서를 보내고 클라이언트는 각 인증서의 서명을 상위 인증서의 공개키로 검증해 신뢰 저장소의 루트까지 잇습니다. 이어서 유효 기간, 요청한 호스트명과 인증서 SAN의 일치, 용도와 경로 제약을 봅니다. 폐기 여부는 OCSP stapling이나 CRL로 확인하지만 클라이언트마다 확인 수준이 다릅니다. 마지막으로 서버가 CertificateVerify에 개인키로 서명해 보내므로, 남의 인증서를 가져다 내민 것이 아님이 확인됩니다.<\/p>\n<p>공격이 성공하는 첫 번째 경우는 사용자가 기업 프록시나 디버깅 도구의 루트 CA를 설치한 경우입니다. Android에서는 targetSdk 23 이하 앱만 사용자가 추가한 CA를 기본으로 믿고 그보다 높은 targetSdk의 앱은 시스템 CA만 믿으므로, 프록시 디버깅은 Network Security Config의 debug-overrides로 디버그 빌드에서만 사용자 CA를 허용합니다. 두 번째는 CA가 잘못 발급하거나 침해된 경우로, Certificate Transparency가 이런 발급을 공개 로그로 드러냅니다. Android 16(API 36)부터 CT 검증을 지원하는데 Android 16에서는 opt-in이고 Android 17에서 targetSdk 37 앱은 기본으로 켜지며, 직접 지정한 trust anchor를 쓰는 연결은 CT를 검증하지 않습니다. 라이브러리가 대응하기도 해서 OkHttp 5.5.1은 손상된 eMudhra 중간 인증서 8개를 차단했습니다. 세 번째이자 가장 흔한 경우는 앱이 모든 인증서를 믿는 TrustManager나 항상 true를 반환하는 HostnameVerifier로 검증을 끈 경우입니다. 개발 중 임시로 넣은 코드가 릴리스에 남아 실제 취약점으로 자주 발견됩니다.<\/p>\n<p>인증서 고정은 여기에 특정 공개키만 허용하는 층을 더하지만, 공식 문서는 Android 앱에 권장하지 않습니다. 서버 키가 바뀌면 그 값을 모르는 구버전 앱의 통신이 모두 끊기기 때문이고, 꼭 해야 한다면 직접 통제하는 키를 포함한 여러 예비 핀과 짧은 만료를 둡니다. 운영 방법은 6절의 Network Security Config와 인증서 고정 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>브라우저에서는 되는데 앱에서만 인증서 오류가 나면?<\/strong> 서버가 중간 인증서를 빠뜨린 경우가 대표적입니다. 브라우저는 캐시나 추가 다운로드로 체인을 채우기도 하지만 앱의 HTTP 클라이언트는 보통 실패합니다. 오래된 기기라면 새 루트 CA가 기기의 신뢰 저장소에 없는 경우도 봅니다.<\/li>\n<li><strong>디버깅 프록시로 앱 트래픽을 보려면?<\/strong> debug-overrides에 사용자 CA를 넣은 디버그 빌드에서만 봅니다. 릴리스 빌드에서 사용자 CA를 믿게 열어 두면, 사용자 기기에 CA를 설치하게 만드는 공격에 그대로 노출됩니다.<\/li>\n<li><strong>OCSP stapling은 무엇입니까?<\/strong> 서버가 인증서 폐기 여부 확인 결과를 미리 받아 핸드셰이크에 붙여 주어 클라이언트의 추가 조회를 없애는 방식입니다.<\/li>\n<\/ul>"},{"no":158,"t":"HTTP 캐시의 Cache-Control, ETag, no-cache와 no-store는 어떻게 다르고, 앱의 캐시 전략은 어떻게 세웁니까?","a":"<p>no-store는 저장 자체를 금지하고, no-cache는 저장은 하되 쓰기 전에 매번 서버에 유효한지 확인하라는 뜻입니다. 확인은 ETag를 If-None-Match로, 또는 Last-Modified를 If-Modified-Since로 보내는 조건부 요청으로 하고, 바뀌지 않았으면 서버가 본문 없이 304를 돌려줍니다. 이름과 달리 no-cache는 캐시를 쓰지 말라는 뜻이 아닙니다. 앱의 캐시 전략은 데이터마다 얼마나 오래된 값을 보여 줘도 되는지 정하는 일이고, 오프라인에서도 보여야 하는 데이터는 HTTP 캐시보다 로컬 DB를 SSOT로 둡니다.<\/p>\n<p>Cache-Control의 주요 지시어는 이렇습니다. max-age는 그 시간 동안 확인 없이 쓰라는 뜻이고, private은 사용자 기기에만, public은 CDN 같은 공유 캐시에도 저장을 허용합니다. 만료 뒤 반드시 확인하게 하려면 must-revalidate를 붙입니다. 파일명에 내용 해시를 넣은 정적 리소스는 바뀌면 URL이 바뀌므로 max-age를 길게 주고 immutable을 붙이는 것이 정석이고, stale-while-revalidate는 만료된 응답을 일단 쓰면서 뒤에서 갱신하게 합니다. 캐시 동작의 표준은 RFC 9111(2022-06)입니다.<\/p>\n<p>OkHttp는 Cache를 직접 설정해야 동작하고 기본으로는 꺼져 있으며, 별도 지정이 없으면 GET 응답만 저장합니다. POST는 OkHttp 5의 cacheUrlOverride()로 캐시용 URL을 지정했을 때만 저장합니다. stale-while-revalidate는 해석하지 않으므로, 그 동작이 필요하면 Repository에서 저장된 값을 먼저 보여 주고 뒤에서 갱신합니다. 그 밖의 캐시 헤더는 서버가 준 그대로 따릅니다. 그래서 앱의 HTTP 캐시 정책은 사실상 서버 헤더 설계이고, 인터셉터로 응답 헤더를 고쳐 강제로 캐시하는 방식은 서버와 기준이 어긋나 오래된 데이터를 보여 주기 쉽습니다. 요청 쪽 no-cache는 OkHttp에서 응답의 no-cache와 다르게 동작합니다. 당겨서 새로고침할 때 CacheControl.Builder().noCache()를 붙이면 재검증이 아니라 캐시를 건너뛰고 본문 전체를 새로 받으므로, 304로 본문을 아끼려면 maxAge(0, TimeUnit.SECONDS)로 서버 재검증만 강제합니다. 오프라인 화면에 onlyIfCached()만 쓰면 만료된 응답도 504로 끝나므로, onlyIfCached에 maxStale을 최대로 더한 CacheControl.FORCE_CACHE로 만료된 응답까지 꺼내 씁니다. 그래도 캐시에 없거나, must-revalidate가 붙은 만료 응답이나 no-cache 응답처럼 재검증이 필요하면 504가 오므로 그 경우를 처리합니다. 적중률은 EventListener의 cacheHit, cacheMiss, cacheConditionalHit로 잽니다.<\/p>\n<p>내비게이션 앱이라면 데이터별로 나눕니다. 지도 타일과 아이콘은 URL에 버전을 넣고 긴 max-age와 immutable로 CDN과 기기에 오래 둡니다. 장소 상세처럼 가끔 바뀌는 데이터는 짧은 max-age와 ETag 재검증으로 대역폭을 아끼고, 실시간 교통 정보와 경로 탐색 결과는 HTTP 캐시에 맡기지 않고 매번 새로 받습니다. 즐겨찾기와 최근 목적지는 Room에 두고 네트워크는 동기화에만 씁니다. 토큰이나 결제 정보가 담긴 응답은 no-store로 디스크에 남지 않게 합니다.<\/p>","f":"<ul>\n<li><strong>강한 ETag와 약한 ETag는 어떻게 다릅니까?<\/strong> 강한 ETag는 바이트 단위로 같을 때, W/ 접두가 붙은 약한 ETag는 의미가 같을 때 같다고 봅니다. 압축이나 사소한 표현 차이로 바이트가 달라지는 응답에는 약한 ETag를 씁니다.<\/li>\n<li><strong>304 응답이면 비용이 없습니까?<\/strong> 본문만 빠질 뿐 왕복 한 번은 그대로입니다. 지연이 중요한 화면은 max-age로 확인 자체를 줄이거나, 저장된 값을 먼저 보여 주고 뒤에서 확인합니다.<\/li>\n<li><strong>Vary 헤더는 왜 조심합니까?<\/strong> CDN 같은 공유 캐시에서는 같은 URL이 Vary로 지정한 요청 헤더 값마다 따로 저장되어 적중률이 떨어집니다. OkHttp는 URL당 항목 하나만 두므로 그 헤더 값이 바뀌면 적중하지 못하고 새 응답으로 덮어쓰며, Vary: *인 응답은 아예 저장하지 않습니다.<\/li>\n<\/ul>"},{"no":159,"t":"REST, GraphQL, gRPC는 모바일 앱 관점에서 언제 고릅니까?","a":"<p>공개 API와 단순한 리소스 조회는 HTTP 캐시와 도구를 그대로 쓰는 REST, 화면마다 필요한 데이터 모양이 크게 다르면 GraphQL, 강한 타입 계약과 작은 바이너리 메시지, 스트리밍이 중요하면 gRPC를 고릅니다. 모바일에서 더 중요한 기준은 구버전 앱이 오래 남는다는 점이라, 어느 쪽이든 하위 호환 규칙과 화면 단위로 응답을 모아 주는 BFF 설계가 프로토콜 선택만큼 중요합니다.<\/p>\n<p>REST는 리소스를 URI로, 행동을 HTTP 메서드로 표현하는 무상태 방식이라 GET 응답은 HTTP 캐시와 CDN을 그대로 쓰고 디버깅 도구도 많습니다. 단점은 화면 하나에 여러 요청이 필요한 언더페칭과 쓰지 않는 필드까지 받는 오버페칭입니다. 앞 응답으로 다음 요청을 만드는 호출이 이어지면 모바일에서는 RTT가 그대로 쌓입니다.<\/p>\n<p>GraphQL은 클라이언트가 필요한 필드를 쿼리로 골라 한 번에 받고 스키마로 타입을 공유해 오버페칭과 언더페칭을 함께 줄입니다. 대신 보통 POST 단일 엔드포인트라 HTTP 캐시를 쓰기 어렵고, OkHttp의 Cache도 기본으로 GET 응답만 저장하므로 GraphQL 클라이언트 라이브러리의 정규화 캐시나, 미리 등록한 쿼리를 GET으로 보내는 방식으로 보완합니다. OkHttp 5에서는 Request.Builder.cacheUrlOverride()로 쿼리 본문의 해시를 담은 캐시용 URL을 지정하면, 응답 헤더가 캐시를 허용하는 POST 응답도 저장합니다. 서버는 비싼 쿼리를 막는 깊이와 복잡도 제한, 리졸버의 N+1 문제를 감당해야 합니다.<\/p>\n<p>gRPC는 HTTP/2와 Protocol Buffers로 작은 바이너리 메시지, 양방향 스트리밍, 코드 생성 기반의 계약을 줍니다. JSON보다 메시지가 작고 파싱이 가벼워 경로 좌표처럼 큰 숫자 배열을 자주 받는 기능에 유리합니다. Android 클라이언트는 grpc-java의 grpc-okhttp 전송과 protobuf-lite를 씁니다. 다만 사람이 바로 읽을 수 없어 디버깅 도구가 따로 필요하고, 브라우저에서 직접 부르기 어렵고 일부 프록시 구간에서 제약이 있어 외부 공개 API보다 내부 통신이나 특정 기능에 씁니다.<\/p>\n<p>모바일은 하위 호환이 핵심입니다. 강제 업데이트를 하지 않는 한 오래전 버전의 앱도 계속 서버를 부르므로, Protobuf는 필드 번호를 바꾸거나 재사용하지 않고 지운 번호는 reserved로 막으며, GraphQL은 필드를 지우기 전에 deprecated로 표시하고 사용량을 보고, REST는 필드 추가처럼 호환되는 변경으로 버전 증가를 피합니다. 실무에서는 섞어 씁니다. 서비스 사이는 gRPC로 하고, 앱에는 화면 단위로 응답을 모아 주는 BFF를 두어 REST나 GraphQL로 노출하는 구성이 흔합니다.<\/p>","f":"<ul>\n<li><strong>REST와 GraphQL 중 무엇이 모바일 성능에 유리합니까?<\/strong> 프로토콜보다 왕복 수와 응답 크기가 결정합니다. REST도 BFF로 화면 단위 응답을 주면 요청 하나로 끝나고, GraphQL도 쿼리가 비대하면 느립니다.<\/li>\n<li><strong>Protobuf enum에 값을 추가하면 구버전 앱은 어떻게 됩니까?<\/strong> proto3의 Java 생성 코드에서 모르는 enum 값은 UNRECOGNIZED로 읽힙니다. 앱은 UNRECOGNIZED를 기본 동작으로 처리하고, 서버는 새 값을 모르는 구버전 앱이 있다는 전제로 응답을 정합니다.<\/li>\n<li><strong>gRPC 스트리밍을 백그라운드에서 유지할 수 있습니까?<\/strong> 기기가 Doze에 들어가면 네트워크 접근이 중단되고, 배터리로 동작할 때 App Standby 버킷이 Rare나 Restricted인 앱은 네트워크가 비활성화되므로 기대할 수 없습니다. 백그라운드에서 받아야 하는 신호는 푸시로 받습니다(9절의 실시간 정보 문항).<\/li>\n<\/ul>"},{"no":160,"t":"교통 정보나 도착 알림 같은 실시간 정보는 폴링, 롱 폴링, SSE, WebSocket, 푸시 알림 중 무엇으로 받습니까?","a":"<p>앱이 화면에 있거나 사용자가 시작한 주행 안내 중일 때는 SSE나 WebSocket 같은 연결 기반 방식, 앱이 백그라운드이거나 종료된 상태에서는 FCM 푸시로 받는 것이 기본 설계입니다. 백그라운드 앱은 기기가 Doze에 들어가면 네트워크 접근이 중단되고, 배터리로 동작할 때는 App Standby 버킷에 따라 네트워크가 막혀 연결을 직접 유지할 수 없기 때문입니다. 푸시는 늦거나 빠질 수 있으므로 변경이 있다는 신호로만 쓰고 실제 데이터는 API로 동기화합니다.<\/p>\n<p>방식별로 보면, 폴링은 단순하지만 지연이 주기만큼이고 대부분의 요청이 헛수고이며 요청마다 셀룰러 모뎀을 깨웁니다. 롱 폴링은 서버가 새 데이터가 생길 때까지 응답을 미뤄 지연을 줄이지만 연결과 타임아웃 관리가 필요합니다. SSE는 서버에서 클라이언트로 가는 단방향 텍스트 스트림이라 HTTP를 그대로 쓰고, Last-Event-ID로 끊긴 지점부터 이어 받을 수 있어 교통 정보나 진행 상태처럼 서버가 보내기만 하는 데이터에 맞습니다. WebSocket은 양방향 프레임 통신이라 양쪽이 자주 보내는 기능에 맞습니다. OkHttp는 newWebSocket과 okhttp-sse 모듈로 둘 다 지원합니다.<\/p>\n<p>내비게이션 앱이라면 이렇게 나눕니다. 주행 안내 중에는 사용자가 시작한 포그라운드 서비스가 돌고 있으므로, 경로 주변 교통 변화와 재탐색 제안을 SSE나 WebSocket으로 받거나 주기적인 위치 보고 요청의 응답에 실어 받아 요청 수를 줄이고, 안내가 끝나면 연결을 닫습니다. 도착 알림이나 일행의 위치 공유처럼 앱이 꺼져 있을 때 와야 하는 정보는 서버가 FCM으로 보냅니다. 배터리로 동작할 때 App Standby 버킷이 Rare나 Restricted인 앱은 네트워크가 비활성화되므로, 백그라운드 앱이 주기적으로 묻는 설계는 동작을 보장할 수 없습니다.<\/p>\n<p>FCM은 전달을 보장하지 않으므로 우선순위와 유효 기간을 정해 보냅니다. high priority 메시지는 백그라운드에서 포그라운드 서비스를 시작할 수 있는 예외 사유이지만, normal로 강등되어 도착하면 시작할 수 없으므로 RemoteMessage.getPriority()가 PRIORITY_HIGH인지 확인합니다. Android 13부터는 App Standby 버킷이 앱이 쓸 수 있는 high priority 메시지 수를 정하지 않습니다. 연결 기반 방식은 하트비트로 죽은 연결을 감지하고, 지수 백오프에 지터를 더해 다시 연결하며, 다시 연결한 뒤 마지막으로 받은 이벤트 ID 이후를 받아 빈틈을 메웁니다. OkHttp의 pingInterval은 기본값 0이라 클라이언트 ping이 꺼져 있으므로 오래 여는 WebSocket에는 직접 설정합니다.<\/p>","f":"<ul>\n<li><strong>SSE와 WebSocket 중 무엇이 운영하기 쉽습니까?<\/strong> 서버가 보내기만 한다면 SSE가 단순합니다. 일반 HTTP 요청이라 기존 인증과 프록시, HTTP/2 멀티플렉싱을 그대로 쓰고, OkHttp의 WebSocket은 HTTP/1.1 업그레이드로 연결을 따로 열어 로드 밸런서의 유휴 타임아웃과 연결 수를 따로 관리해야 합니다.<\/li>\n<li><strong>FCM 데이터 메시지에 교통 정보 전체를 실어 보내면?<\/strong> 메시지 크기에 제한이 있고 순서와 도착이 보장되지 않습니다. 메시지가 늦거나 빠져도 최종 상태가 맞도록 버전이나 시각을 담은 신호만 보내고, 앱이 API로 최신 상태를 받습니다.<\/li>\n<li><strong>WebSocket 서버를 여러 대로 늘리면?<\/strong> 연결이 서버마다 흩어지므로 Redis Pub/Sub나 Kafka 같은 메시지 브로커로 서버 사이에 메시지를 전달합니다.<\/li>\n<\/ul>"},{"no":161,"t":"타임아웃과 재시도는 어떻게 설계하고, 멱등성은 왜 필요합니까?","a":"<p>타임아웃은 연결, 읽기, 쓰기, 전체 호출로 나눠 정하고, 재시도는 멱등한 요청이나 멱등 키가 있는 요청에 한해 일시적인 오류에만 지수 백오프와 지터를 더해 정해진 횟수와 기한 안에서 합니다. 멱등성이 필요한 이유는 응답을 받기 전에 연결이 끊기면 서버가 처리했는지 알 수 없기 때문이고, 이때 그냥 다시 보내면 결제나 주문이 두 번 처리됩니다.<\/p>\n<p>연결 타임아웃은 TCP 연결 수립까지, 읽기와 쓰기 타임아웃은 데이터가 오가는 사이의 공백, 전체 호출 타임아웃은 DNS 조회부터 응답 본문까지 요청 전체의 상한입니다. OkHttp의 connectTimeout은 TCP 소켓 연결에만 걸리고, TLS 핸드셰이크 중의 각 읽기에는 readTimeout이 걸립니다. 읽기 타임아웃은 공백 기준이라 조금씩 계속 오는 응답은 끝없이 이어질 수 있습니다. OkHttp는 연결, 읽기, 쓰기 타임아웃이 기본 10초이고 callTimeout은 기본값 0으로 제한이 없으므로, 사용자가 결과를 기다리는 요청에는 전체 상한을 따로 둡니다.<\/p>\n<p>재시도 대상은 연결 실패, 502, 503, 504와 Retry-After를 지키는 429처럼 일시적인 오류입니다. 400, 403, 422처럼 요청 자체가 잘못된 4xx는 다시 보내도 결과가 같습니다. 간격은 지수 백오프에 무작위 지터를 더해 장애 뒤 클라이언트들이 같은 순간에 몰리지 않게 하고, 최대 횟수와 전체 기한을 둡니다. 클라이언트, 게이트웨이, 서버가 각자 세 번씩 시도하면 맨 아래 서비스에는 최대 3×3×3번이 몰리므로 재시도는 한 계층에서만 합니다. 주의할 점은 OkHttp의 retryOnConnectionFailure가 기본으로 켜져 있어, 요청을 보낸 뒤 연결이 끊긴 경우에도 본문이 one-shot이 아니면 메서드와 관계없이 다시 보낼 수 있다는 것입니다. 요청을 보낸 뒤 난 타임아웃은 다시 보내지 않지만 결제 POST도 이렇게 다시 나갈 수 있으므로 서버의 멱등 키 처리가 근본 대책이고, EventListener의 retryDecision으로 이 재시도를 관찰할 수 있습니다.<\/p>\n<p>멱등성은 같은 요청을 여러 번 보내도 서버 상태가 한 번 보낸 것과 같은 성질입니다. GET, HEAD, OPTIONS는 상태를 바꾸지 않는 안전한 메서드이고, 여기에 PUT과 DELETE를 더한 것이 멱등 메서드입니다. POST는 멱등하지 않고 PATCH는 보장되지 않습니다. 기준은 응답이 아니라 서버 상태라서 두 번째 DELETE가 404를 돌려줘도 멱등입니다. POST를 안전하게 재시도하려면 클라이언트가 작업마다 고유 키를 만들어 흔히 Idempotency-Key라는 헤더로 보내고, 서버는 키별 처리 결과를 저장해 같은 키가 다시 오면 처리하지 않고 저장한 결과를 돌려주며, 같은 키로 동시에 들어온 요청은 유일 제약이나 락으로 하나만 처리합니다. 키는 작업을 처음 만들 때 생성해 요청 데이터와 함께 DB에 저장해야 프로세스 종료 뒤의 재시도도 같은 키로 갑니다(4절의 오프라인 쓰기 문항). 즐겨찾기 추가처럼 클라이언트가 ID를 정할 수 있으면 그 ID로 PUT해 멱등하게 만드는 방법도 있습니다.<\/p>\n<p>재시도는 공식 수단부터 씁니다. 반드시 끝나야 하는 업로드와 동기화는 WorkManager의 백오프 정책과 Result.retry()에 맡기고, Flow는 retryWhen을 씁니다(2절의 Flow 예외 처리 문항). 사용자가 화면을 떠나면 viewModelScope 취소로 요청도 취소합니다. suspend 호출 하나를 감싸는 재시도는 아래처럼 만들 수 있고, 이 코드는 네트워크 예외만 다루므로 503 같은 응답 코드는 조건을 더해 판단합니다.<\/p>\n<pre class=\"kotlin\"><code>// 개념 코드: 멱등한 요청에만 쓰는 재시도. 지수 백오프와 full jitter\nsuspend fun &lt;T&gt; retryIo(maxAttempts: Int = 3, baseMs: Long = 500, capMs: Long = 8_000,\n                        block: suspend () -&gt; T): T {\n    repeat(maxAttempts - 1) { attempt -&gt;\n        try {\n            return block()\n        } catch (e: IOException) {                  // CancellationException은 잡지 않는다\n            val cap = minOf(capMs, baseMs shl attempt)\n            delay(Random.nextLong(cap + 1))          // 0부터 cap 사이에서 무작위로 쉰다\n        }\n    }\n    return block()                                    // 마지막 실패는 호출자에게 던진다\n}<\/code><\/pre>","f":"<ul>\n<li><strong>지터는 어떻게 넣습니까?<\/strong> 백오프 상한 안에서 0부터 상한까지 완전히 무작위로 고르는 full jitter가 몰림을 가장 잘 흩습니다. 서버가 Retry-After를 주면 그 값을 우선합니다.<\/li>\n<li><strong>재시도 예산은 무엇입니까?<\/strong> 전체 요청 가운데 재시도가 차지할 수 있는 비율에 상한을 두어, 장애 때 재시도가 부하를 키우지 않게 하는 방법입니다. 연속 실패가 이어지면 서킷 브레이커로 한동안 요청을 보내지 않고 바로 실패를 돌려줍니다.<\/li>\n<li><strong>멱등 키는 얼마나 보관합니까?<\/strong> 클라이언트가 같은 작업을 다시 보낼 수 있는 기간을 기준으로 서버가 정합니다. WorkManager가 네트워크 조건을 기다리며 한참 뒤에 다시 보낼 수 있다면 그 기간보다 짧게 잡으면 안 됩니다.<\/li>\n<\/ul>"},{"no":162,"t":"모바일 네트워크는 유선과 무엇이 다르고, 앱 설계에 어떤 영향을 줍니까?","a":"<p>지연이 크고 들쭉날쭉하며, 손실과 끊김이 잦고, 대역폭이 계속 바뀌고, 통신사 NAT와 데이터 요금이 있으며, 통신 자체가 배터리를 씁니다. 그래서 설계 원칙은 요청을 줄여 묶고, 실패를 예외가 아닌 정상 경로로 다루며, 로컬 데이터를 SSOT로 두고 네트워크는 동기화 수단으로 쓰는 것입니다.<\/p>\n<p>차이를 나눠 보면 이렇습니다. 셀룰러 모뎀은 데이터를 주고받은 뒤에도 한동안 고전력 상태에 머물러, 작은 요청을 흩어 보내면 요청마다 라디오가 깨어나 배터리를 씁니다. 주행 중 같은 통신망 안에서 기지국을 옮겨 가는 핸드오버는 보통 단말 IP가 그대로라 연결은 살아 있지만 지연이 튀고 손실이 생기고, 집이나 주차장의 Wi-Fi에서 셀룰러로 넘어가면 IP가 바뀌어 기존 TCP 연결이 모두 끊깁니다. 터널과 지하 주차장에서는 GPS와 네트워크가 함께 끊깁니다. 통신사망은 IPv6 전용이거나 통신사 NAT 뒤에 있는 경우가 많아, NAT 매핑이 짧게 사라져 오래 쉬는 연결이 조용히 끊기는 것도 감안합니다.<\/p>\n<p>설계에서는 첫째, 요청을 줄이고 묶습니다. 화면에 필요한 데이터를 한 번에 주는 BFF, 응답 압축, 화면 크기에 맞춘 이미지, 경로 안내에 필요한 데이터 미리 받기가 여기에 해당하고, 급하지 않은 동기화는 WorkManager에 네트워크 조건을 걸어 OS가 다른 작업과 묶어 실행하게 맡깁니다. 둘째, 끊김을 정상 경로로 다룹니다. 풀의 연결이 이미 죽어 있을 수 있으니 멱등 요청은 새 연결로 다시 보내고, 경로와 안내 데이터를 미리 받아 두어 터널에서도 안내가 멈추지 않게 하며, 쓰기는 로컬에 먼저 반영하고 동기화 큐로 보냅니다(4절의 오프라인 쓰기 문항). 셋째, 백그라운드 제약을 전제로 합니다. 기기가 Doze에 들어가면 네트워크 접근이 중단되고, 배터리로 동작할 때 App Standby 버킷이 Rare나 Restricted인 앱은 네트워크가 비활성화되므로 백그라운드 폴링에 기대지 않습니다(5절의 Doze와 App Standby 문항).<\/p>\n<p>네트워크 상태 판단도 조심합니다. 연결됨이 곧 인터넷이 된다는 뜻은 아니므로, ConnectivityManager의 기본 네트워크 콜백으로 바뀜을 듣고 NetworkCapabilities의 NET_CAPABILITY_VALIDATED로 인터넷 검증 여부를, NET_CAPABILITY_NOT_METERED로 데이터 요금 여부를 봅니다. 그래도 요청 전에 상태를 미리 판단해 막기보다, 요청은 보내고 실패를 처리하며 사용자에게 상태를 보여 주는 쪽을 중심으로 설계합니다. 측정은 실사용 모니터링으로 네트워크 종류와 통신사별 지연 분포를 보고, 에뮬레이터의 네트워크 속도와 지연 설정으로 느린 망을 재현합니다.<\/p>","f":"<ul>\n<li><strong>연결됨인데 요청이 실패하는 대표 사례는?<\/strong> 로그인이 필요한 공용 Wi-Fi 같은 캡티브 포털입니다. 이때 네트워크에는 NET_CAPABILITY_VALIDATED가 없고 NET_CAPABILITY_CAPTIVE_PORTAL이 붙으므로, 요청 실패를 서버 장애로 표시하지 않고 로그인 안내를 보여 줄 수 있습니다.<\/li>\n<li><strong>데이터 요금이 드는 망에서 큰 다운로드는 어떻게 합니까?<\/strong> 지도 데이터처럼 큰 내려받기는 WorkManager 제약 조건의 setRequiredNetworkType(NetworkType.UNMETERED)로 요금이 없는 망까지 미루고, 사용자가 원하면 셀룰러에서도 받게 선택지를 줍니다.<\/li>\n<li><strong>Wi-Fi에서 셀룰러로 넘어가는 순간 진행 중인 요청은?<\/strong> TCP 위의 요청은 대개 실패하므로 멱등 요청은 새 네트워크에서 다시 보내고, 그렇지 않은 요청은 서버에 처리 결과를 확인한 뒤 처리합니다. QUIC 연결 이전을 지원하는 스택이면 연결이 유지될 수 있습니다(9절의 QUIC과 HTTP/3 문항).<\/li>\n<\/ul>"},{"no":163,"t":"DNS 조회는 어떻게 이루어지고, 모바일 앱에서 DNS 때문에 생기는 문제는 무엇입니까?","a":"<p>앱과 OS의 캐시에 없으면 단말이 리졸버에 재귀 질의를 보내고, 리졸버가 루트, TLD, 권한 서버 순으로 반복 질의해 답을 얻은 뒤 TTL 동안 캐시합니다. 모바일에서는 첫 요청 지연에 DNS 시간이 들어가고, 리졸버 장애와 위조, IPv6 전용망, 평문 질의 노출이 문제가 됩니다. 앱은 IP 대신 호스트명을 쓰고 OS의 조회 API에 맡기는 것이 기본이며, Android는 시스템 수준의 보안 DNS인 Private DNS를 제공합니다.<\/p>\n<p>레코드는 A(IPv4 주소), AAAA(IPv6 주소), CNAME(별칭), NS, TXT 등이 있고, HTTPS 레코드(RFC 9460)는 ECH 설정 배포에도 쓰입니다. 질의는 보통 UDP 53번으로 하고 응답이 크면 TCP로 넘어갑니다.<\/p>\n<p>실무 문제는 이렇습니다. TTL이 길면 서버 IP를 바꿔도 한동안 옛 주소로 가므로 장애 전환을 계획할 때 미리 TTL을 낮추고, 일부 리졸버와 클라이언트는 TTL을 지키지 않는다는 점도 감안합니다. DNS가 실패하면 이미 열린 연결은 동작하지만 새 연결이 모두 실패하므로, 캐시된 데이터 표시와 오류 안내를 설계합니다. 모바일 통신사망은 IPv6 전용인 경우가 많아, 단말은 IPv6 주소만 받고 IPv4 서버에는 NAT64와 DNS64로 변환해 접근하며, 단말의 464XLAT가 IPv4만 쓰는 앱을 돕습니다. 그래서 IPv4 주소 문자열을 코드에 넣거나 IPv4 형식만 가정해 주소를 파싱하고 저장하면 이 망에서 실패하므로, 호스트명을 쓰고 OS의 주소 조회와 연결 API에 맡깁니다. IPv4와 IPv6 주소를 함께 받으면 둘을 거의 동시에 시도해 먼저 연결되는 쪽을 쓰는 Happy Eyeballs가 한쪽 경로 장애를 피하게 해 주고, OkHttp 5는 이 방식의 fastFallback이 기본으로 켜져 있습니다.<\/p>\n<p>Android 9부터 Private DNS로 DNS over TLS(RFC 7858)를 지원합니다. 기본 동작은 네트워크의 DNS 서버가 지원하면 DoT로 자동 승격하는 것이고, 사용자가 호스트명을 지정하면 모든 질의를 그 서버로 보내며 닿지 못하면 네트워크를 인터넷 없음으로 표시합니다. Android 11 이상 기기는 Google Play 시스템 업데이트로 DNS-over-HTTP/3를 받아, 이를 지원하는 잘 알려진 DNS 서버에는 DoT 대신 DoH3를 씁니다. 초기 제한 배포에서는 성공한 질의 기준으로 중앙값 질의 시간이 24%, 95번째 백분위수가 44% 줄었습니다. 앱이 OkHttp의 Dns를 직접 구현하거나 okhttp-dnsoverhttps를 쓰면 이런 시스템 설정을 거치지 않으므로, 직접 질의하는 앱은 LinkProperties.isPrivateDnsActive()로 시스템 보안 DNS 사용 여부를 확인할 수 있습니다. OkHttp 5.5.0은 ECH 키를 DNS HTTPS 레코드에서 받으려고 DNS API가 여러 레코드 유형과 비동기 결과를 다루도록 바꿨습니다.<\/p>","f":"<ul>\n<li><strong>루트 도메인에 CNAME을 둘 수 없는 이유는?<\/strong> CNAME은 같은 이름의 다른 레코드와 함께 있을 수 없는데, 루트에는 NS와 SOA가 반드시 있어야 하기 때문입니다.<\/li>\n<li><strong>앱 시작 때 DNS 지연을 줄이려면?<\/strong> 첫 화면에 필요한 호스트 수를 줄여 조회 횟수를 줄이고, 곧 쓸 호스트는 미리 연결해 DNS와 핸드셰이크를 앞당깁니다. 호스트가 늘수록 조회와 연결도 그만큼 늘어납니다.<\/li>\n<li><strong>특정 사용자만 모든 요청이 실패한다는 VOC가 오면 무엇을 봅니까?<\/strong> Private DNS를 호스트명 지정 모드로 두었는데 그 서버에 닿지 못하면 모든 DNS 질의가 실패하고 네트워크가 인터넷 없음으로 표시됩니다. 앱에는 전체 네트워크 장애처럼 보이므로 이 설정과 VPN, 광고 차단 DNS 사용 여부를 확인합니다.<\/li>\n<\/ul>"},{"no":164,"t":"모바일 앱 인증은 어떻게 설계합니까? 세션과 토큰, OAuth 2.0과 PKCE, 토큰 저장과 갱신을 설명해 보세요.","a":"<p>모바일 앱은 보통 수명이 짧은 액세스 토큰을 Authorization 헤더로 보내고, 수명이 긴 리프레시 토큰으로 갱신하며, 리프레시 토큰은 서버에 저장해 즉시 폐기할 수 있게 합니다. 로그인 수단은 passkey, Sign in with Google, 비밀번호를 다루는 Credential Manager를 먼저 쓰고, 웹 OAuth 흐름만 제공하는 외부 서비스는 시스템 브라우저나 Custom Tabs에서 OAuth 2.0 Authorization Code 흐름에 PKCE를 붙여 씁니다. 토큰은 Android Keystore 키로 암호화해 저장합니다.<\/p>\n<p>세션 방식은 서버가 로그인 상태를 저장하고 클라이언트는 세션 ID만 들고 있어 즉시 무효화가 쉽지만, 서버 여러 대가 세션 저장소를 공유해야 합니다. JWT 같은 자체 포함 토큰은 서버가 서명만 검증해 확장이 쉽지만, 발급한 토큰을 만료 전에 무효화하기 어렵고 페이로드는 누구나 읽을 수 있습니다. 검증 쪽 실수도 흔해서, alg를 none으로 바꾼 토큰을 받아 주거나 공개키를 HMAC 비밀키로 오인하는 알고리즘 혼동을 막으려면 허용 알고리즘을 고정합니다. 그래서 액세스 토큰은 수명을 짧게 두고, 리프레시 토큰은 쓸 때마다 새것으로 바꾸며, 이미 쓴 리프레시 토큰이 다시 오면 탈취로 보고 그 계열 토큰을 모두 폐기합니다. 웹은 쿠키에 HttpOnly, Secure, SameSite를 붙여 탈취와 CSRF를 줄이지만, 앱의 HTTP 클라이언트는 쿠키를 기본으로 관리하지 않으므로 헤더 방식이 일반적입니다.<\/p>\n<p>OAuth 2.0은 비밀번호를 앱에 주지 않고 접근 권한을 위임하는 인가 프레임워크이고, 로그인한 사용자의 신원은 그 위의 OpenID Connect가 ID 토큰으로 다룹니다. Authorization Code 흐름에서 앱은 브라우저로 인가 서버의 로그인 화면을 열고, 리다이렉트로 받은 인가 코드를 토큰으로 교환합니다. 모바일 앱은 클라이언트 비밀을 숨길 수 없는 공개 클라이언트라, 다른 앱이 같은 커스텀 스킴을 등록해 인가 코드를 가로챌 수 있습니다. PKCE(RFC 7636)는 앱이 매번 무작위 code_verifier를 만들어 그 해시인 code_challenge를 인가 요청에 보내고 코드 교환 때 원래 verifier를 내게 해서, 코드만 가로챈 공격자는 교환하지 못하게 합니다. OAuth 보안 권고(RFC 9700)는 공개 클라이언트에 PKCE를 필수로 요구하고 Implicit 흐름은 쓰지 않도록 권하며, 네이티브 앱 권고(RFC 8252)는 앱 내장 WebView로 인가 요청을 하지 못하게 합니다. 앱이 비밀번호 입력을 엿볼 수 있기 때문이고, 외부 브라우저를 쓰면 이미 로그인된 상태도 재사용할 수 있습니다. 리다이렉트는 App Links처럼 소유가 검증된 https 주소로 받습니다. Credential Manager는 권장 Jetpack 자격 증명 API로 passkey, Sign in with Google, 비밀번호를 한 API로 다루며 기존 Google Sign-In, One Tap, Smart Lock for Passwords를 대체하므로, 이 수단으로 되는 로그인은 Credential Manager로 하고 OAuth 흐름은 그 밖의 외부 서비스 연동에 씁니다.<\/p>\n<p>저장은 Android Keystore에 키를 두고 그 키로 토큰을 암호화합니다. security-crypto의 EncryptedSharedPreferences는 1.1.0에서 deprecated되었으므로 새로 도입하지 않고, Keystore를 직접 쓰거나 DataStore 1.3.0에 추가된 Tink 기반 datastore-tink를 씁니다. 공식 문서가 EncryptedSharedPreferences 파일을 복원 시 키가 없을 수 있다며 Auto Backup에서 빼라고 하듯, Keystore 키로 암호화한 파일은 백업에서 제외합니다. 갱신은 OkHttp Authenticator가 401을 받으면 리프레시 토큰으로 새 액세스 토큰을 받아 원 요청을 다시 보내는 방식이고, 여러 요청이 동시에 401을 받아도 갱신은 한 번만 하고 나머지는 그 결과를 쓰며, 갱신이 실패하면 로그아웃으로 보냅니다. 구현은 6절의 OkHttp Interceptor와 토큰 갱신 문항, 저장은 6절의 토큰 보호 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>state와 PKCE는 같은 역할입니까?<\/strong> state는 돌아온 응답이 내가 시작한 요청에 대한 것인지 확인해 CSRF를 막고, PKCE는 가로챈 코드가 교환되지 않게 해서 서로 보완합니다. RFC 9700은 인가 서버가 PKCE를 지원하면 PKCE의 CSRF 방어에 기대도 된다고 하지만, state는 요청 맥락을 되찾는 데도 쓰여 함께 두는 경우가 많습니다.<\/li>\n<li><strong>액세스 토큰에 권한 정보를 넣으면?<\/strong> 권한이 바뀌어도 토큰이 만료될 때까지 옛 권한이 남으므로 민감한 권한은 서버에서 다시 확인합니다.<\/li>\n<li><strong>리프레시 토큰 탈취는 어떻게 알아챕니까?<\/strong> 쓸 때마다 새 토큰으로 바꾸는 구조에서는 공격자와 정상 앱 중 한쪽이 반드시 이미 쓴 토큰을 내게 됩니다. 서버가 이 재사용을 감지해 그 계열 토큰을 모두 폐기하고 다시 로그인하게 합니다.<\/li>\n<\/ul>"}]},{"no":10,"title":"운영체제와 동시성","qs":[{"no":165,"t":"프로세스와 스레드는 메모리 관점에서 어떻게 다르고, Android 앱이 여러 프로세스를 쓰면 무엇이 달라집니까?","a":"<p>프로세스는 독립된 가상 주소 공간과 파일 디스크립터 같은 자원을 가진 자원 할당 단위이고, 스레드는 그 안의 실행 흐름입니다. 스레드는 자기 스택, 레지스터와 프로그램 카운터, 스레드 로컬 저장소만 따로 갖고 코드, 힙, 전역 데이터, 열린 파일은 같은 프로세스의 다른 스레드와 공유합니다. Android 앱이 프로세스를 여러 개 쓰면 메모리, 싱글턴, 초기화가 프로세스마다 따로 생기고 프로세스 사이 데이터는 IPC로만 오갑니다.<\/p>\n<p>공유의 대가는 격리가 없다는 점입니다. 스레드끼리는 공유 메모리로 데이터를 바로 주고받는 대신 동기화가 필요하고, 한 스레드의 잘못이 프로세스 전체로 번집니다. 네이티브 코드의 잘못된 메모리 접근은 프로세스를 죽입니다. 처리되지 않은 예외도 일반 JVM에서는 그 스레드만 끝나지만, Android에서는 기본 예외 처리기가 프로세스를 종료시켜 백그라운드 스레드의 예외 하나로 앱 전체가 크래시 납니다. 반대로 격리가 필요하면 프로세스를 나눕니다. 브라우저 엔진이 렌더러를 별도 프로세스로 두는 것이 그런 선택입니다.<\/p>\n<p>Android에서는 매니페스트의 android:process로 컴포넌트를 다른 프로세스에 띄웁니다. 얻는 것은 장애 격리와 별도 메모리 한도이고, 잃는 것이 더 자주 문제가 됩니다. 프로세스마다 ART 힙과 런타임 상태가 따로 생겨 메모리가 늘고(Zygote에서 물려받은 페이지는 공유), Application.onCreate가 프로세스마다 다시 실행되어 초기화가 중복되며, 싱글턴과 static 변수가 프로세스마다 따로 있어 같은 객체라고 믿은 상태가 갈라집니다. SharedPreferences는 공식 문서가 여러 프로세스에서 쓰는 것을 지원하지 않는다고 적으므로, 프로세스 사이 데이터는 ContentProvider, Binder 서비스, 여러 프로세스의 같은 파일 접근을 지원하는 DataStore(1.1.0부터)처럼 프로세스 경계를 고려한 통로로만 주고받습니다. 그래서 기본은 단일 프로세스이고, 격리가 꼭 필요한 부분만 나눕니다.<\/p>\n<pre class=\"kotlin\"><code>class App : Application() {\n    override fun onCreate() {\n        super.onCreate()\n        // 개념 코드: getProcessName()은 API 28부터, 그 아래는 다른 방법으로 이름을 구함\n        val process = if (Build.VERSION.SDK_INT &gt;= Build.VERSION_CODES.P) {\n            Application.getProcessName()\n        } else {\n            processNameCompat()\n        }\n        if (process == packageName) initMainProcess()   // 화면용 SDK, DI 그래프\n        else initSideProcess(process)                    // 그 프로세스에 필요한 것만\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>스레드가 공유하지 않는 것은 무엇입니까?<\/strong> 스택, 레지스터와 프로그램 카운터, 스레드 로컬 저장소입니다. 지역 변수는 스레드마다 따로이고, 힙 객체와 static 필드가 동기화 대상입니다.<\/li>\n<li><strong>다른 스레드의 예외를 메인 스레드에서 잡을 수 있습니까?<\/strong> 자동으로 전파되지 않습니다. Thread.setDefaultUncaughtExceptionHandler로 기록을 남기거나, 코루틴처럼 구조화된 동시성으로 부모에게 전파되게 설계합니다. 크래시 수집 SDK도 기존 처리기를 감싸 기록한 뒤 원래 처리기에 넘깁니다.<\/li>\n<li><strong>android:process 값이 콜론으로 시작하면 무엇이 다릅니까?<\/strong> 콜론으로 시작하면 그 앱 전용 프로세스가 필요할 때 만들어지고, 소문자로 시작하면 그 이름의 전역 프로세스가 만들어져 다른 앱과 공유할 수 있습니다. 앱 안의 격리가 목적이면 콜론 형식을 씁니다.<\/li>\n<\/ul>"},{"no":166,"t":"컨텍스트 스위칭 비용은 무엇이고, 프로세스 전환과 스레드 전환은 왜 비용이 다릅니까?","a":"<p>컨텍스트 스위칭 비용은 직접 비용과 간접 비용으로 나뉩니다. 직접 비용은 커널 진입, 현재 작업의 레지스터와 프로그램 카운터를 저장하고 다음 작업의 것을 복원하는 일, 스케줄러 실행입니다. 더 큰 것은 간접 비용으로, 새 작업이 쓰는 데이터와 주소 변환 정보가 CPU 캐시와 TLB에 없어 한동안 캐시 미스가 이어집니다. 프로세스 전환은 주소 공간까지 바뀌어 간접 비용이 커지고, 같은 프로세스의 스레드 전환은 주소 공간을 그대로 써서 상대적으로 쌉니다.<\/p>\n<p>프로세스 전환은 페이지 테이블을 바꾸므로 이전 프로세스의 TLB 항목이 쓸모없어집니다. ARM의 ASID나 x86의 PCID처럼 TLB 항목에 주소 공간 표시를 붙이는 기능이 전환 때마다 TLB를 통째로 비우는 일을 막아 주지만, 캐시에 올라 있던 데이터가 다른 프로세스 것이라는 점은 그대로입니다. 리눅스에서 스레드는 주소 공간을 공유하는 작업이라 스레드 전환도 커널을 거치지만, 주소 공간 교체가 빠져 그만큼 쌉니다.<\/p>\n<p>실무에서는 스레드 수와 IPC 횟수로 드러납니다. 요청마다 스레드를 두고 블로킹 I/O로 기다리는 모델은 동시 작업이 늘면 전환 비용과 스레드 스택 메모리 때문에 처리량이 떨어지고, 그래서 이벤트 루프와 코루틴처럼 사용자 공간에서 전환하는 방식이 나왔습니다. 코루틴의 중단과 재개는 커널을 거치지 않고 Continuation 객체의 상태만 바꾸므로 쌉니다. 다만 다른 스레드의 Dispatcher로 옮기면 작업 큐를 거치고 잠든 스레드를 깨우는 비용이 듭니다. Dispatchers.IO는 Default와 스레드를 공유하므로 Default 위에서 withContext(Dispatchers.IO)를 불러도 대개 실제 스레드 전환은 일어나지 않습니다. 동기 Binder 호출은 호출 스레드가 잠들고 다른 프로세스의 스레드가 깨어나 처리한 뒤 다시 호출 스레드를 깨우는 왕복이라, 메인 스레드에서 시스템 서비스를 반복 호출하는 코드는 결과를 캐시하거나 백그라운드로 옮깁니다.<\/p>\n<p>측정은 Perfetto의 스레드 상태로 합니다. 메인 스레드가 Running이 아니라 Runnable로 오래 머물면 CPU를 받지 못해 기다린 것이고, 짧은 실행과 깨어남이 잦게 반복되면 스레드가 너무 많거나 작업을 지나치게 잘게 나눈 것을 의심합니다.<\/p>","f":"<ul>\n<li><strong>코루틴 전환이 싼 이유는 무엇입니까?<\/strong> 커널을 거치지 않고, 중단 지점을 넘어 살아야 하는 지역 변수와 재개 위치만 Continuation 객체에 저장하기 때문입니다. 스레드처럼 별도 스택을 잡지 않습니다(2절의 suspend 함수 문항).<\/li>\n<li><strong>스레드를 너무 많이 만들면 어떻게 됩니까?<\/strong> 스레드마다 스택 메모리가 들고 스케줄링과 락 경쟁이 늘어 처리량이 오히려 떨어집니다. 모바일에서는 UI 스레드와 CPU를 다투어 프레임이 밀리므로, 스레드를 직접 만들기보다 공유 풀과 Dispatcher를 씁니다.<\/li>\n<li><strong>TLB shootdown은 무엇입니까?<\/strong> 여러 코어가 같은 주소 공간을 쓰는 중에 매핑이 바뀌면 다른 코어 TLB에 남은 낡은 항목까지 지워야 하는 일입니다. x86 리눅스는 보통 다른 코어에 IPI를 보내 각 코어가 지우게 하고, Android 기기 대부분이 쓰는 arm64 리눅스는 브로드캐스트 TLBI 명령으로 하드웨어가 모든 코어의 TLB 항목을 무효화합니다. 매핑 해제나 권한 변경이 잦은 코드에서 비용이 커집니다.<\/li>\n<\/ul>"},{"no":167,"t":"모바일 OS의 CPU 스케줄링은 서버와 무엇이 다릅니까?","a":"<p>서버 스케줄링이 많은 요청의 처리량과 공정성을 우선한다면, 모바일은 지금 보이는 앱의 응답성과 에너지를 우선합니다. 같은 리눅스 커널 스케줄러를 쓰지만 Android는 프로세스 상태에 따라 앱을 cgroup으로 옮겨 CPU 몫을 다르게 주고, 성능 코어와 효율 코어가 섞인 구조에서 전력까지 계산해 작업을 배치하며, 캐시 상태 앱은 얼려서 CPU에서 내립니다.<\/p>\n<p>알고리즘 기초는 처리량, 응답 시간, 공정성의 균형입니다. FCFS는 긴 작업 뒤에 짧은 작업이 줄 서는 호위 효과가 있고, SJF는 평균 대기 시간이 최소지만 실행 시간을 미리 알아야 하며 긴 작업이 굶습니다. 라운드 로빈은 타임 슬라이스로 돌아가며 실행해 응답성이 좋지만 슬라이스가 짧을수록 전환 비용이 늘고, MLFQ는 CPU를 오래 쓰는 작업을 낮은 큐로 내려 대화형 작업을 우대합니다. 리눅스는 2.6.23부터 가상 실행 시간이 가장 적은 작업을 고르는 CFS를 쓰다가 6.6에서 EEVDF로 바꿨습니다. EEVDF는 아직 자기 몫을 넘겨 쓰지 않은 작업 가운데 가상 마감 시각이 가장 이른 작업을 고릅니다. 이 변화는 Android 버전이 아니라 커널 버전을 따르므로 6.6 이상 커널(android15-6.6, android16-6.12, android17-6.18)을 쓰는 기기에 해당하고, Android 17 기기라도 그보다 오래된 커널이면 CFS입니다. 작업이 sched_setattr()로 짧은 타임 슬라이스를 요청해 지연 민감 작업을 앞세우는 기능은 EEVDF 전환을 마무리한 6.12에서 들어왔으므로, android15-6.6 기기에서는 쓸 수 없고 android16-6.12 이상 커널에서 쓸 수 있습니다.<\/p>\n<p>모바일이 더 고려하는 것은 세 가지입니다. 첫째, 에너지입니다. 리눅스의 EAS는 Arm big.LITTLE 같은 이종 코어 구조에서 배치에 따른 에너지 소비를 예측해, 처리량을 해치지 않는 선에서 가장 적게 쓰는 CPU를 고릅니다. 둘째, 프로세스 상태입니다. Android는 task profile과 cgroup으로 top-app 같은 그룹을 나눠 맨 앞의 앱에 CPU를 몰아주고, 그 앱의 UI 스레드와 RenderThread 우선순위를 올립니다. cached apps freezer는 AOSP 문서 기준 Android 11(API 30)부터 지원하며 캐시 상태 프로세스를 frozen cgroup으로 옮겨 CPU에서 내리고, Android 14부터는 캐시 상태가 되고 10초 뒤에 얼립니다. 얼어 있는 동안은 모든 스레드가 멈춰 GC나 onTrimMemory 처리도 하지 못합니다. 셋째, 열입니다. 발열이 쌓이면 클럭이 내려가 최고 성능을 오래 유지할 수 없습니다.<\/p>\n<p>앱이 할 일은 UI 스레드와 경쟁하지 않는 것입니다. 메인 스레드 작업은 프레임 예산 안에서 끝내고, 직접 만든 백그라운드 스레드는 Process.setThreadPriority(Process.THREAD_PRIORITY_BACKGROUND)로 우선순위를 낮추며, 작업을 잘게 자주 깨우기보다 모아서 처리해 코어가 절전 상태에 오래 머물게 합니다. Perfetto에서 메인 스레드의 Runnable 구간이 길면 CPU 경쟁을, Running인데도 느리면 효율 코어 배치나 클럭 저하를 의심합니다.<\/p>","f":"<ul>\n<li><strong>선점형과 비선점형은 무엇이 다릅니까?<\/strong> 선점형은 OS가 실행 중인 작업을 강제로 멈추고 다른 작업을 실행할 수 있습니다. 현대 범용 OS는 선점형이라 코어가 하나여도 아무 지점에서나 작업이 바뀝니다.<\/li>\n<li><strong>우선순위 역전은 무엇이고 앱에서는 어떻게 생깁니까?<\/strong> 낮은 우선순위 작업이 락을 쥔 동안 높은 작업이 그 락을 기다리고, 중간 작업이 낮은 작업을 선점해 높은 작업이 더 늦어지는 현상입니다. 메인 스레드가 우선순위를 낮춘 백그라운드 스레드의 락을 기다리면 그대로 생기므로 둘이 같은 락을 공유하지 않게 하고 결과는 상태나 메시지로 넘깁니다. Binder 드라이버는 호출자 우선순위를 처리 스레드에 물려줍니다.<\/li>\n<li><strong>응답성과 처리량은 어디서 부딪힙니까?<\/strong> 타임 슬라이스를 짧게 하면 반응은 빨라지지만 전환이 늘어 전체 처리량이 줄어듭니다. 모바일은 사용자가 느끼는 지연을 줄이는 쪽을 택합니다.<\/li>\n<\/ul>"},{"no":168,"t":"동시성과 병렬성, 경쟁 상태와 임계 구역을 설명해 보세요.","a":"<p>동시성은 여러 작업이 겹치는 시간 동안 함께 진행되는 구조이고, 병렬성은 같은 순간 여러 코어에서 실제로 실행되는 것입니다. 코어 하나에서 두 작업을 번갈아 실행하면 동시성은 있지만 병렬성은 없습니다. 경쟁 상태는 여러 실행 흐름이 공유 데이터에 접근하고 결과가 실행 순서에 따라 달라지는 상황이고, 임계 구역은 공유 데이터를 다루어 한 번에 하나만 실행되어야 하는 코드 구간입니다.<\/p>\n<p>I/O를 기다리는 시간이 대부분인 일은 동시성만으로 이득이 큽니다. 네트워크 응답을 기다리는 동안 다른 요청을 진행하면 코어 하나로도 처리량이 오릅니다. 계산이 대부분인 일은 병렬성이 있어야 빨라집니다. Kotlin 코루틴은 동시성 도구이고, Dispatchers.Default처럼 스레드가 여럿인 Dispatcher에 올리면 병렬로도 실행됩니다. 병렬화의 상한은 암달의 법칙으로 설명합니다. 전체에서 직렬 구간의 비율이 s이면 코어를 아무리 늘려도 속도 향상은 1/s를 넘지 못하므로, 병렬화 전에 직렬 구간과 공유 자원 경쟁부터 줄입니다.<\/p>\n<p>경쟁 상태의 전형은 count++입니다. 읽기, 더하기, 쓰기 세 단계라 두 스레드가 같은 값을 읽고 각자 1을 더해 쓰면 한 번이 사라집니다. \"없으면 넣기\"처럼 확인과 행동 사이에 다른 스레드가 끼어드는 check-then-act 패턴도 흔합니다. 캐시에 없으면 서버에서 받아 넣는 함수를 두 곳에서 동시에 부르면 같은 요청이 두 번 나가는 식입니다. 임계 구역 문제의 해법은 세 조건을 만족해야 합니다. 한 번에 하나만 들어가는 상호 배제, 아무도 없으면 들어가려는 쪽이 들어갈 수 있는 진행, 무한히 기다리지 않는 한정 대기입니다.<\/p>\n<p>실무 해법은 락만이 아닙니다. 원자 연산(AtomicInteger, ConcurrentHashMap.compute), 불변 객체, 공유하지 않기가 더 단순하고 안전할 때가 많습니다. 공유하지 않기는 상태를 한 스레드에 가두거나 limitedParallelism(1), 상태를 가진 코루틴 하나로 접근을 직렬화하는 방법이고, 화면 상태라면 StateFlow 하나에 두고 update로 바꿉니다. 경쟁 상태는 재현이 어려워서 코드 리뷰에서 \"이 값은 어느 스레드가 바꾸는가\"를 묻는 습관이 가장 효과가 큽니다. 코루틴 사이 공유 상태의 도구별 기준은 2절의 공유 상태 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>데이터 레이스와 경쟁 상태는 같은 말입니까?<\/strong> 다릅니다. Java 메모리 모델에서 데이터 레이스는 같은 변수에 대한 두 접근 가운데 하나 이상이 쓰기이고 둘 사이에 happens-before 순서가 없는 상태이고, 경쟁 상태는 실행 순서에 따라 논리 결과가 달라지는 더 넓은 문제입니다. 모든 접근을 동기화해 데이터 레이스를 없애도 check-then-act 같은 경쟁 상태는 남을 수 있습니다.<\/li>\n<li><strong>코어가 하나여도 동시성 버그가 생깁니까?<\/strong> 생깁니다. 선점으로 작업이 아무 지점에서나 바뀌어 실행 순서가 섞이기 때문입니다.<\/li>\n<li><strong>경쟁 상태는 어떻게 재현합니까?<\/strong> 반복 스트레스 테스트와 스레드 수를 늘린 테스트로 확률을 높이고, 네이티브 코드에는 ThreadSanitizer를 씁니다. 코루틴 사이의 끼어들기는 StandardTestDispatcher로 중단 지점 단위의 실행 순서를 정해 재현할 수 있지만, 스레드 수준의 경쟁 상태까지 재현하지는 못합니다.<\/li>\n<\/ul>"},{"no":169,"t":"뮤텍스, 세마포어, 모니터는 어떻게 다르고, Kotlin과 Java에서는 synchronized, ReentrantLock, Atomic을 언제 씁니까?","a":"<p>뮤텍스는 한 번에 하나만 들어가게 하는 락으로, 소유권이 있어 잠근 쪽이 풀어야 합니다. 세마포어는 허가 수를 세어 동시에 N개까지 들여보내는 도구로, 소유권이 없어 다른 스레드가 허가를 돌려줄 수 있습니다. 모니터는 락과 조건 변수를 언어 차원에서 묶은 것으로 Java의 synchronized와 wait, notify가 모니터입니다. 스레드를 막는 코드에서는 synchronized가 기본이고, 시간 제한이나 인터럽트, 여러 조건이 필요하면 ReentrantLock, 변수 하나의 원자적 갱신은 Atomic을 쓰며, 코루틴 코드에서는 kotlinx.coroutines의 Mutex와 Semaphore를 씁니다.<\/p>\n<p>쓰임으로 나누면 공유 상태 보호는 뮤텍스, 동시 다운로드 수나 커넥션 수 제한은 세마포어, 조건이 만족될 때까지 기다리는 생산자 소비자는 모니터의 조건 변수입니다. 조건 변수는 깨어나도 조건이 참이라는 보장이 없어 if가 아니라 while로 다시 확인합니다. Kotlin의 Any에는 wait와 notify가 없고 공식 문서도 java.util.concurrent를 권하므로, 실무에서는 직접 짜지 않고 BlockingQueue나 코루틴 Channel을 씁니다.<\/p>\n<p>synchronized는 블록을 벗어나면 예외가 나도 자동으로 풀리고 재진입이 되며, Kotlin에서는 synchronized(lock) { } 함수나 @Synchronized로 씁니다. ReentrantLock은 tryLock에 시간 제한을 주거나, lockInterruptibly로 기다리다 빠져나오거나, 공정성 옵션과 여러 Condition이 필요할 때 쓰고, 해제를 직접 해야 하므로 finally에서 풀거나 Kotlin의 withLock으로 감쌉니다. Atomic 클래스는 CAS로 락 없이 변수 하나를 갱신해 경쟁이 적을 때 가장 빠르지만, 경쟁이 심하면 재시도가 반복됩니다. 함정은 여러 변수에 걸친 불변식입니다. Atomic 두 개를 각각 원자적으로 바꿔도 둘의 관계는 깨질 수 있으므로 락을 쓰거나 두 값을 담은 불변 객체를 AtomicReference로 통째로 바꿉니다. Android 코드에서는 java.util.concurrent.atomic을 쓰고, Kotlin 공통 원자 타입인 kotlin.concurrent.atomics는 Kotlin 2.4 API 문서에서도 Experimental입니다.<\/p>\n<p>코루틴에서는 synchronized 블록 안에서 suspend 함수를 부를 수 없고(컴파일 오류), 기다리는 동안 스레드를 막지 않으려면 Mutex를 씁니다. Mutex의 lock은 suspend 함수라 기다리는 동안 스레드를 내주고, unlock이 이후에 성공하는 lock보다 happens-before라 synchronized와 비슷한 메모리 보장을 줍니다. 재개할 때 스레드가 바뀔 수 있으므로 ReentrantLock처럼 스레드 소유권을 전제로 한 락을 중단 지점 너머로 쥐면 안 됩니다. 코루틴 Semaphore는 공정해서 기다린 순서대로 허가를 받습니다.<\/p>\n<pre class=\"kotlin\"><code>private val downloadPermits = Semaphore(4)            // 동시에 내려받는 타일은 4개까지\n\nsuspend fun download(key: TileKey): ByteArray =\n    downloadPermits.withPermit { api.fetchTile(key) }  // 기다리는 동안 스레드를 막지 않음\n\nprivate val lock = ReentrantLock()                    // 스레드를 막는 코드에서 시간 제한이 필요할 때\n\nfun tryUpdate(): Boolean {\n    if (!lock.tryLock(100, TimeUnit.MILLISECONDS)) return false\n    try { updateShared() } finally { lock.unlock() }  // 해제는 반드시 finally에서\n    return true\n}<\/code><\/pre>","f":"<ul>\n<li><strong>재진입 락이란 무엇입니까?<\/strong> 이미 락을 가진 스레드가 다시 얻을 수 있는 락입니다. synchronized와 ReentrantLock은 재진입되지만 코루틴 Mutex는 재진입되지 않아, 같은 코루틴이 withLock 안에서 같은 Mutex를 다시 잡으면 자기 자신을 기다리는 Deadlock이 됩니다.<\/li>\n<li><strong>이진 세마포어와 뮤텍스는 같습니까?<\/strong> 값의 범위는 같지만 세마포어는 소유권이 없어 잠그지 않은 쪽이 풀 수 있습니다. 그래서 세마포어는 작업 완료 신호에도 쓰고, 상호 배제에는 소유권이 있는 뮤텍스가 실수를 줄입니다.<\/li>\n<li><strong>ABA 문제는 무엇입니까?<\/strong> 값이 A에서 B로 갔다가 다시 A가 되면 CAS가 그 사이의 변화를 놓치는 문제입니다. 버전 번호를 함께 비교하는 AtomicStampedReference나, 매번 새 불변 객체로 교체하는 방식으로 막습니다.<\/li>\n<li><strong>읽기가 압도적으로 많으면 무엇을 씁니까?<\/strong> ReentrantReadWriteLock으로 읽기끼리는 동시에 들어가게 하거나 StampedLock의 낙관적 읽기를 검토합니다. 쓰기가 드문 작은 리스트라면 CopyOnWriteArrayList도 선택지입니다.<\/li>\n<\/ul>"},{"no":170,"t":"Deadlock의 네 가지 조건은 무엇이고, 앱에서 실제로 Deadlock이 나는 경우와 예방법은 무엇입니까?","a":"<p>상호 배제, 점유 대기(자원을 쥔 채 다른 자원을 기다림), 비선점(남이 쥔 자원을 빼앗을 수 없음), 순환 대기 네 조건이 모두 성립해야 Deadlock이 됩니다. 하나만 깨면 예방되고, 실무에서 가장 흔한 방법은 락 획득 순서를 전역으로 정해 순환 대기를 깨는 것입니다. 앱에서는 메인 스레드가 Deadlock에 걸리면 입력을 처리하지 못해 ANR로 드러납니다.<\/p>\n<p>앱에서 실제로 나는 경우는 네 가지가 대표적입니다. 첫째, 두 락을 스레드마다 다른 순서로 잡는 경우입니다. 메인 스레드가 캐시 락을 쥐고 DB 락을 기다리는 동안 백그라운드 스레드가 DB 락을 쥐고 캐시 락을 기다립니다. 둘째, 락을 쥔 채 콜백이나 리스너를 부르는 경우입니다. 콜백이 어떤 락을 잡을지 호출자가 모르므로 순서 규칙이 깨집니다. 셋째, 메인 스레드가 다른 작업의 결과를 블로킹으로 기다리는데 그 작업이 메인 스레드로 돌아와야 끝나는 경우입니다. 메인 스레드에서 Future.get()이나 runBlocking으로 기다리는데 안쪽 코드가 Handler.post나 withContext(Dispatchers.Main)로 메인 스레드에 일을 넘기면 서로를 영원히 기다립니다. 넷째, 코루틴 Mutex를 같은 코루틴에서 다시 잡거나 두 Mutex를 서로 다른 순서로 잡는 경우입니다. 공식 ANR 문서도 메인 스레드가 앱 안의 다른 스레드와, 또는 Binder 호출을 거쳐 Deadlock에 빠지는 것을 흔한 원인으로 듭니다.<\/p>\n<p>예방은 조건을 하나씩 깨는 것입니다. 락 순서를 정하고(예: ID가 작은 쪽부터), tryLock에 시간 제한을 둬 실패하면 쥔 락을 놓고 다시 시도하며, 락 범위를 줄이고 락을 쥔 채 I/O, 콜백, 다른 모듈 호출을 하지 않습니다. 더 근본적인 방법은 공유를 줄이는 것입니다. 상태를 한 스레드나 코루틴 하나에 가두고 메시지로 주고받으면 락 자체가 사라집니다. 메인 스레드에서는 블로킹으로 기다리지 않고 결과를 suspend 함수나 콜백으로 받습니다. 진단은 ANR 추적 파일의 스레드 덤프로 합니다. 메인 스레드가 어떤 락을 기다리고 그 락을 어느 스레드가 쥐고 있는지 따라가면 순환이 보입니다.<\/p>\n<pre class=\"kotlin\"><code>// 잘못: 메인 스레드에서 부르면 Deadlock이 되어 ANR\nfun loadUserBlocking(): User = runBlocking {   // 메인 스레드를 막고 기다림\n    withContext(Dispatchers.Main) {             // 메인에 일을 넘기지만 메인은 위에서 막혀 있음\n        cache.user()\n    }\n}\n\n// 바르게: 막지 말고 중단하고, 호출자는 코루틴에서 부름\nsuspend fun loadUser(): User = withContext(ioDispatcher) { repository.user() }<\/code><\/pre>","f":"<ul>\n<li><strong>락을 쥔 채 콜백을 부르면 왜 위험합니까?<\/strong> 콜백이 어떤 락을 잡을지 호출자가 알 수 없어 순서 규칙이 깨지기 때문입니다. 필요한 상태를 복사하고 락을 푼 뒤 콜백을 부릅니다.<\/li>\n<li><strong>Deadlock과 라이브락, 기아는 어떻게 다릅니까?<\/strong> Deadlock은 서로 기다리며 잠들어 CPU를 거의 쓰지 않고, 라이브락은 서로 양보하거나 같은 간격으로 재시도하느라 CPU는 쓰지만 진행이 없으며, 기아는 전체는 진행하는데 특정 작업만 계속 밀리는 상태입니다. 라이브락은 재시도 간격에 무작위성을 넣어 풉니다.<\/li>\n<li><strong>서버 DB에서 Deadlock이 나면 어떻게 합니까?<\/strong> Deadlock을 탐지하는 DB는 대기 그래프에서 순환을 찾아 한 트랜잭션을 롤백하므로, 애플리케이션은 그 오류를 받아 트랜잭션 전체를 처음부터 다시 시도합니다. 무한 재시도를 막고 지터를 둡니다.<\/li>\n<li><strong>범용 OS는 Deadlock을 어떻게 다룹니까?<\/strong> 비용에 비해 드물어서 대부분 탐지나 회피를 하지 않고, 애플리케이션 락의 Deadlock은 애플리케이션 책임으로 둡니다. 은행원 알고리즘 같은 회피는 각 작업이 필요한 최대 자원량을 미리 알아야 해서 현실에서 거의 쓰지 않습니다.<\/li>\n<\/ul>"},{"no":171,"t":"volatile만으로 count++가 안전하지 않은 이유와 happens-before 관계를 설명해 보세요.","a":"<p>volatile은 가시성과 순서를 보장하지만 원자성은 보장하지 않기 때문입니다. count++는 읽기, 더하기, 쓰기 세 동작이라 두 스레드가 같은 값을 읽고 각자 더해 쓰면 하나가 사라집니다. happens-before는 Java 메모리 모델에서 앞 동작의 결과가 뒤 동작에 보이고 순서도 앞선다는 보장이고, volatile 필드 쓰기와 이후 그 필드 읽기 사이에 이 관계가 생깁니다.<\/p>\n<p>가시성 문제는 캐시만의 문제가 아닙니다. MESI 같은 캐시 일관성 프로토콜이 있어도 코어는 쓰기를 쓰기 버퍼에 잠시 담아 두고 명령을 순서와 다르게 실행하며, 컴파일러와 JIT도 명령 순서를 바꾸고 반복문 안의 변수를 레지스터에 올려 다시 읽지 않습니다. 그래서 while (!stop) { }은 다른 스레드가 stop을 바꿔도 끝나지 않을 수 있습니다. ARM은 x86보다 재배치를 많이 허용하는 약한 메모리 모델이라 x86 환경에서 안 나던 버그가 ARM 기기에서 드러나기도 합니다. 하드웨어 동작을 직접 추론하지 말고 메모리 모델의 규칙으로 판단합니다.<\/p>\n<p>JLS 17.4.5가 정한 happens-before는 같은 스레드 안의 프로그램 순서, 모니터 unlock과 이후 같은 모니터의 lock, volatile 필드 쓰기와 이후 그 필드 읽기, Thread.start() 호출과 시작된 스레드의 모든 동작, 한 스레드의 모든 동작과 다른 스레드가 그 스레드의 join()에서 정상 반환하는 것이고, 이 관계는 이어서 성립합니다. 그래서 volatile 변수에 쓰기 전에 한 모든 쓰기는 그 값을 읽은 스레드에게 보입니다. happens-before로 순서가 정해지지 않은 충돌 접근이 있으면 데이터 레이스입니다. Kotlin의 @Volatile도 backing field를 volatile로 만들어 같은 보장을 주지만, 원자적인 것은 backing field 읽기와 쓰기 하나씩뿐이라 getter나 setter가 여러 연산을 하면 그 전체는 원자적이지 않습니다.<\/p>\n<p>해결은 원자적 갱신입니다. AtomicInteger.incrementAndGet()은 CAS로 원자적으로 증가시키고, 쓰기 경쟁이 심하고 합계는 가끔 읽는 카운터는 LongAdder가 빠릅니다. 여러 변수를 함께 바꾸면 synchronized를 쓰고, 코루틴에서는 Mutex나 상태를 코루틴 하나에 가두는 방법을 씁니다(2절의 공유 상태 문항). volatile이 맞는 곳은 한 스레드만 쓰고 여러 스레드가 읽는 값입니다. 중지 플래그와, 완성된 불변 객체의 참조를 통째로 바꿔 끼우는 안전한 게시가 대표적입니다.<\/p>\n<pre class=\"kotlin\"><code>class TileDownloader {\n    @Volatile private var cancelled = false   // 한 스레드가 쓰고 여러 스레드가 읽는 플래그\n    private val finished = AtomicInteger()    // 여러 스레드가 함께 올리는 카운터\n\n    fun cancel() { cancelled = true }         // 이 쓰기 전의 쓰기도 읽는 쪽에 보임\n\n    fun onTileDone(): Int? {\n        if (cancelled) return null\n        return finished.incrementAndGet()     // count++ 대신 CAS로 원자적 증가\n    }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>volatile이 아닌 long은 왜 위험합니까?<\/strong> JLS 17.7은 volatile이 아닌 long과 double의 쓰기 한 번을 32비트 절반씩 두 번의 쓰기로 다룰 수 있다고 적어서, 다른 스레드가 두 쓰기의 반쪽이 섞인 값을 볼 수 있습니다. volatile long과 double, 그리고 참조의 읽기와 쓰기는 항상 원자적입니다.<\/li>\n<li><strong>이중 검사 잠금에 volatile이 왜 필요합니까?<\/strong> 객체 생성은 할당, 생성자 실행, 참조 대입으로 나뉘고 volatile이 없으면 참조 대입이 생성자보다 먼저 보일 수 있어, 다른 스레드가 초기화가 덜 끝난 객체를 씁니다. Kotlin에서는 직접 짜지 않고 object 선언이나 기본 모드의 by lazy를 씁니다.<\/li>\n<li><strong>kotlin.concurrent.atomics를 써도 됩니까?<\/strong> 공통 코드용 AtomicInt, AtomicReference 등이 있고 JVM에서는 java.util.concurrent.atomic 타입으로 표현되지만, Kotlin 2.4 API 문서에서도 @ExperimentalAtomicApi가 붙어 있습니다. Android 전용 코드라면 java.util.concurrent.atomic을 그대로 쓰는 편이 안전합니다.<\/li>\n<\/ul>"},{"no":172,"t":"가상 메모리, 페이지 폴트, TLB를 설명하고, Android의 16KB 페이지 전환이 무엇을 바꾸는지 말해 보세요.","a":"<p>가상 메모리는 프로세스마다 독립된 주소 공간을 주고, MMU가 페이지 테이블을 보고 가상 주소를 물리 주소로 바꾸는 기법입니다. 페이지 폴트는 접근한 페이지의 매핑이 없거나 권한이 맞지 않을 때 일어나 커널이 처리하는 트랩이고, TLB는 주소 변환 결과를 담는 캐시입니다. Android는 오랫동안 4KB 페이지만 지원하다가 Android 15부터 16KB 페이지 기기를 지원합니다. 페이지가 4배 커지면 TLB 항목 하나가 덮는 범위도 4배가 되어 빨라지는 대신 메모리를 조금 더 쓰고, 4KB를 가정한 네이티브 코드는 다시 빌드해야 합니다.<\/p>\n<p>가상 메모리로 얻는 것은 다른 프로세스 메모리에 접근할 수 없는 격리와 코드 페이지를 읽기 전용으로 두는 보호, 실제로 쓰는 페이지만 올리는 요구 페이징, 공유 라이브러리나 Zygote에서 물려받은 페이지처럼 같은 물리 페이지를 여러 프로세스가 함께 쓰는 공유, 파일을 메모리처럼 다루는 매핑입니다. Android는 마모 때문에 저장소를 스왑에 쓰지 않고 RAM 일부를 압축 스왑으로 쓰는 zRAM을 쓰며, 그래도 부족하면 프로세스를 종료합니다(5절의 메모리 부족 문항).<\/p>\n<p>페이지 폴트가 나면 커널은 먼저 접근이 합법인지 봅니다. 할당되지 않은 영역이거나 권한이 맞지 않으면 SIGSEGV로 프로세스를 죽이고, 합법이면 물리 프레임을 확보해 내용을 채우고 페이지 테이블을 고친 뒤 멈춘 명령을 다시 실행합니다. 파일이나 스왑에서 읽어야 하면 major 폴트, 페이지 캐시에 이미 있거나 0으로 채우거나 copy-on-write 복사만 하면 되면 minor 폴트이고, 디스크 I/O가 끼는 major 폴트가 훨씬 비쌉니다. 콜드 스타트 때 코드와 리소스 페이지가 아직 메모리에 없어 major 폴트가 몰리므로, 시작 경로에서 읽는 코드를 줄이고 모으는 최적화가 시작 시간에 바로 효과를 냅니다(6절의 Baseline Profile 문항). 페이지 테이블은 64비트 주소 공간 전체를 한 표로 만들 수 없어 여러 단계로 나누고 실제로 쓰는 영역의 하위 표만 만듭니다. 그 대가로 변환 한 번에 메모리를 여러 번 읽어야 하는데, 대부분의 접근이 TLB에서 끝나 이 비용을 숨깁니다.<\/p>\n<p>16KB 전환이 바꾸는 것은 세 가지입니다. 첫째, 성능과 메모리입니다. 공식 문서는 초기 테스트 기준으로 메모리 압박 상황의 앱 시작 시간이 평균 3.16%(일부 앱은 최대 30%) 줄고 앱 시작 중 전력 소모가 평균 4.56% 줄었으며, 대신 기기가 평균적으로 메모리를 조금 더 쓴다고 적습니다. 폴트 수와 페이지 테이블이 줄고 TLB가 넓은 범위를 덮는 대신, 페이지 끝에 남는 내부 단편화가 커지기 때문입니다. 둘째, 네이티브 코드 호환입니다. Java와 Kotlin 코드만 쓰는 앱은 라이브러리와 SDK까지 포함해 이미 16KB 기기를 지원하지만, NDK 라이브러리를 직접 또는 SDK를 통해 쓰면 ELF 세그먼트를 16KB로 정렬해 다시 빌드해야 합니다. 4096을 페이지 크기로 박아 둔 코드나 PAGE_SIZE 상수는 getpagesize()나 sysconf(_SC_PAGESIZE)로 바꿉니다. Android 16은 4KB 정렬 앱을 16KB 기기에서 돌리는 호환 모드를 추가했지만 근본 해결은 다시 빌드하는 것입니다. 셋째, 배포 조건입니다. Google Play는 Android 15(API 35) 이상을 타깃하는 앱에 64비트 기기의 16KB 지원을 요구하고, 2026-11 갱신된 문서 기준으로 2027-02-01부터는 16KB를 지원하지 않는 업데이트를 출시할 수 없습니다. 빌드 설정과 점검 도구는 5절의 targetSdk 동작 변경 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>페이지가 크면 무엇이 좋고 무엇이 나쁩니까?<\/strong> 페이지 테이블이 작아지고 TLB 하나가 덮는 범위가 넓어져 변환 비용과 폴트 수가 줄지만, 내부 단편화로 메모리를 더 씁니다. 공식 문서도 4KB를 가정하고 작은 객체를 여러 16KB 페이지에 흩어 두는 자체 메모리 할당기는 RSS를 크게 늘릴 수 있다고 경고합니다.<\/li>\n<li><strong>메인 스레드에서 mmap한 파일을 읽는 것이 위험한 이유는 무엇입니까?<\/strong> 평범한 메모리 접근처럼 보이지만 페이지 폴트로 숨은 디스크 I/O가 생겨 프레임이 끊길 수 있습니다.<\/li>\n<li><strong>페이지 폴트 수는 어떻게 봅니까?<\/strong> <code>/proc/&lt;pid&gt;/stat<\/code>의 minflt, majflt 값이나 Perfetto로 봅니다. 콜드 스타트 구간에 major 폴트가 많으면 시작 경로의 코드와 리소스 읽기를 의심합니다.<\/li>\n<\/ul>"},{"no":173,"t":"프로세스 간 통신 방법을 비교하고, Binder가 다른 방식보다 유리한 점은 무엇입니까?","a":"<p>프로세스는 주소 공간이 분리되어 있어 커널이 제공하는 통로로만 데이터를 주고받습니다. 파이프와 소켓은 바이트 흐름을 커널 버퍼에 담았다가 꺼내고, 공유 메모리는 같은 물리 페이지를 양쪽이 매핑해 복사 없이 가장 빠르지만 동기화를 직접 해야 합니다. Binder는 Android의 커널 드라이버 기반 RPC로, 다른 프로세스의 메서드를 로컬 호출처럼 부르게 해 주면서 호출자 신원, 객체 참조, 상대 프로세스 종료 알림을 함께 제공한다는 점이 유리합니다.<\/p>\n<p>방식별로 보면 파이프는 단방향 바이트 흐름으로 부모와 자식 사이에 쓰고, 이름 있는 파이프는 관계없는 프로세스끼리도 씁니다. 메시지 큐는 메시지 단위로 주고받고, 소켓은 같은 기기 안에서는 유닉스 도메인 소켓으로 쓰며 네트워크로 확장할 수 있습니다. 시그널은 데이터를 거의 싣지 못하는 알림입니다. Android 앱이 대용량을 넘길 때는 SharedMemory나 파일 디스크립터를 Binder로 넘겨 공유 메모리와 파일로 주고받습니다.<\/p>\n<p>Binder의 장점은 네 가지입니다. 첫째, 커널이 트랜잭션 전체를 받는 프로세스의 주소 공간으로 바로 복사하므로 커널 버퍼에 담았다가 다시 꺼내는 파이프나 소켓보다 복사 단계가 적습니다. 둘째, 커널이 호출자의 UID와 PID를 붙여 주므로 받는 쪽은 Binder.getCallingUid()로 얻은 값을 믿고 권한을 검사할 수 있습니다. 셋째, 객체 참조를 넘길 수 있고, 상대 프로세스가 죽으면 linkToDeath로 알림을 받습니다. 넷째, 받는 쪽은 Binder 스레드 풀에서 호출을 처리하고 드라이버가 호출자 우선순위를 처리 스레드에 물려주므로, 메서드 호출처럼 동기 모델로 쓸 수 있습니다. Intent, ContentProvider, 시스템 서비스 호출, AIDL 서비스가 모두 Binder 위에서 동작합니다.<\/p>\n<p>한계도 같은 구조에서 나옵니다. 트랜잭션 버퍼는 고정 크기 1MB이고 프로세스에서 진행 중인 모든 트랜잭션이 함께 쓰므로, 하나하나는 중간 크기여도 동시 트랜잭션이 많으면 TransactionTooLargeException이 날 수 있습니다. 큰 데이터는 ID만 넘기고 받는 쪽에서 다시 읽거나, 파일 디스크립터와 공유 메모리로 넘깁니다(5절의 TransactionTooLargeException 문항). 동기 호출은 상대가 응답할 때까지 호출 스레드를 막으므로 메인 스레드에서 느린 프로세스를 부르면 ANR이 날 수 있고, 공식 ANR 문서도 이를 흔한 원인으로 듭니다.<\/p>","f":"<ul>\n<li><strong>oneway 호출은 무엇이 다릅니까?<\/strong> 원격 호출이 응답을 기다리지 않고 트랜잭션만 보낸 뒤 바로 반환합니다. 같은 프로세스 안에서 부르면 oneway여도 동기로 실행됩니다. 커널은 받는 쪽 버퍼의 절반을 oneway용으로 따로 잡으므로, 한 프로세스로 oneway 호출을 쏟아 내면 이 공간이 바닥나 할당이 실패합니다.<\/li>\n<li><strong>AIDL 서비스 구현은 왜 스레드 안전해야 합니까?<\/strong> 원격 호출은 받는 프로세스의 Binder 스레드 풀에서 여러 스레드로 동시에 들어오기 때문입니다. 같은 프로세스 안의 호출은 호출한 스레드에서 그대로 실행되므로, 메인 스레드에서 부르면 서비스 코드도 메인 스레드에서 돕니다.<\/li>\n<li><strong>어떤 호출이 Binder를 거치는지 어떻게 압니까?<\/strong> PackageManager, ContentResolver 조회, 시스템 서비스의 getter처럼 다른 프로세스가 답하는 API는 대부분 Binder 호출입니다. Perfetto에서 메인 스레드의 binder transaction 구간으로 확인하고, 반복 호출은 결과를 캐시하거나 백그라운드로 옮깁니다.<\/li>\n<\/ul>"},{"no":174,"t":"동기와 비동기, 블로킹과 논블로킹은 어떻게 다르고, epoll 기반 이벤트 루프는 어떻게 동작합니까?","a":"<p>두 축이 다릅니다. 블로킹과 논블로킹은 호출한 함수가 결과가 준비될 때까지 제어를 돌려주지 않느냐, 바로 돌려주느냐이고, 동기와 비동기는 작업 완료를 누가 챙기느냐입니다. 호출자가 직접 결과를 받거나 확인하면 동기, 완료를 콜백이나 이벤트로 통지받으면 비동기입니다. epoll 기반 이벤트 루프는 스레드 하나가 여러 파일 디스크립터의 준비 이벤트를 기다렸다가 꺼내 처리하기를 반복하는 구조이고, Android 메인 스레드의 Looper도 이 구조입니다.<\/p>\n<p>조합하면 일반 read는 동기 블로킹, 논블로킹 소켓에 계속 read를 시도하는 것은 동기 논블로킹, 콜백이나 CompletableFuture, io_uring 완료 통지는 비동기 논블로킹입니다. 비동기 블로킹은 분류마다 정의가 다른데, select 같은 I/O 멀티플렉싱을 넣기도 하고 비동기 API를 불러 놓고 Future.get()이나 runBlocking으로 기다리는 안티 패턴을 예로 들기도 합니다. Kotlin의 suspend 함수는 코드가 동기처럼 위에서 아래로 읽히지만 기다리는 동안 스레드를 막지 않습니다. 그래서 코루틴 안에서 Thread.sleep이나 블로킹 I/O를 그대로 부르면 그 장점이 사라지고 Dispatcher 스레드가 묶입니다.<\/p>\n<p>I/O 멀티플렉싱은 select, poll, epoll 순서로 발전했습니다. select는 감시할 집합을 호출마다 커널로 복사하고 FD_SETSIZE(1024)보다 작은 번호의 디스크립터만 감시할 수 있으며, 돌아오면 전체를 훑어 준비된 것을 찾아야 합니다. poll은 개수 제한만 없앴습니다. epoll은 감시 목록을 epoll_ctl로 커널에 한 번 등록해 두고 epoll_wait가 준비된 것만 돌려주므로, 감시하는 디스크립터가 많아도 비용이 준비된 수를 따라갑니다. 이벤트 루프는 이 위에서 준비된 이벤트를 기다리고, 꺼내서 처리하고, 다시 기다리는 반복이며 Netty, Node.js, nginx가 이 구조입니다. Android의 Looper와 MessageQueue도 처리할 메시지가 없으면 네이티브 쪽에서 epoll로 잠들고, 새 메시지나 등록한 디스크립터의 이벤트가 오면 깨어납니다.<\/p>\n<p>핵심 규칙은 이벤트 루프 스레드를 막지 않는 것입니다. 처리 하나가 오래 걸리면 뒤의 모든 이벤트가 밀립니다. Android 메인 스레드가 바로 이벤트 루프라서 거기서 디스크나 네트워크를 쓰면 입력과 프레임 처리가 멈추고, 입력 이벤트에 5초 안에 응답하지 못하면 ANR이 납니다. Looper와 Handler의 세부는 5절의 Looper, Handler, MessageQueue 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>delay와 Thread.sleep은 무엇이 다릅니까?<\/strong> delay는 중단하면서 스레드를 돌려주고 시간이 되면 재개되며, Thread.sleep은 그동안 스레드를 붙잡습니다. 메인 스레드에서 sleep하면 그 시간만큼 화면이 멈춥니다.<\/li>\n<li><strong>블로킹 라이브러리를 코루틴에서 써야 하면 어떻게 합니까?<\/strong> withContext(Dispatchers.IO)로 감싸 블로킹을 감당할 스레드에서 실행합니다. Dispatcher는 2절의 Dispatcher 문항대로 주입받아 테스트에서 바꿀 수 있게 합니다.<\/li>\n<li><strong>엣지 트리거와 레벨 트리거는 무엇이 다릅니까?<\/strong> 레벨 트리거는 준비된 상태인 동안 계속 알리고, 엣지 트리거는 상태가 바뀌는 순간 한 번만 알립니다. 그래서 엣지 트리거에서는 EAGAIN이 날 때까지 남은 데이터를 끝까지 읽어야 합니다.<\/li>\n<li><strong>Android 17에서 MessageQueue는 무엇이 바뀌었습니까?<\/strong> targetSdk 37 앱은 lock-free MessageQueue 구현을 받습니다. MessageQueue의 private 필드와 메서드를 리플렉션으로 건드리는 코드는 깨질 수 있으므로, 테스트 도구나 진단 라이브러리에 그런 코드가 있는지 확인합니다.<\/li>\n<\/ul>"},{"no":175,"t":"스레드 풀 크기는 어떻게 정하고, 코루틴 Dispatcher 설계와는 어떻게 이어집니까?","a":"<p>작업 성격으로 시작점을 정하고 측정으로 확정합니다. CPU 계산 위주면 코어 수 정도, I/O 대기 위주면 기다리는 동안 다른 작업이 CPU를 쓸 수 있으므로 코어 수 × (1 + 대기 시간 / 계산 시간)이 경험식입니다. kotlinx.coroutines의 Dispatcher도 이 원칙을 따라, Dispatchers.Default는 최대 스레드 수가 CPU 코어 수(최소 2개)인 계산용 공유 풀이고 Dispatchers.IO는 병렬 한도 기본값이 64와 코어 수 중 큰 값인 블로킹 작업용으로 Default와 스레드를 공유합니다.<\/p>\n<p>코어 수보다 많은 계산 스레드는 전환 비용만 늘립니다. 실제 크기는 부하를 늘려 가며 처리량은 더 늘지 않고 지연만 커지는 지점을 찾아 정합니다. 하위 자원도 함께 봅니다. DB 커넥션이 10개인데 스레드가 100개면 90개는 커넥션을 기다리기만 합니다. 고정 크기 풀에 무제한 큐를 붙이면 처리가 밀릴 때 큐가 메모리를 먹고 지연이 끝없이 늘어나므로, 큐 크기를 제한하고 넘칠 때의 정책을 정합니다. 느린 작업이 풀을 다 차지해 빠른 작업까지 막히지 않게 작업 종류별로 풀을 나누는 것을 격벽 패턴이라고 합니다.<\/p>\n<p>코루틴에서는 풀을 새로 만들기보다 기존 Dispatcher 위에 동시 실행 수만 제한한 뷰를 만듭니다. limitedParallelism(n)은 kotlinx.coroutines 1.9.0에서 Stable이 되었고, 원래 Dispatcher의 스레드를 재사용해 따로 닫을 필요가 없습니다. 동시 호출에 약한 SDK나 디스크 캐시처럼 특정 자원의 동시성을 묶을 때 쓰고, Dispatchers.IO의 뷰는 IO 병렬 한도에 묶이지 않고 따로 늘어날 수 있어 격벽 역할을 합니다. 블로킹 SDK가 자기 몫의 스레드를 다 써도 다른 IO 작업은 막히지 않습니다. 반대로 newFixedThreadPoolContext는 스레드를 직접 소유해 다 쓰면 닫아야 하는 @DelicateCoroutinesApi이고, KDoc도 병렬 수 제한만 필요하면 Dispatchers.IO나 Default의 limitedParallelism을 쓰라고 권합니다.<\/p>\n<p>모바일에서는 코어 수가 곧 성능이 아닙니다. 성능 코어와 효율 코어가 섞여 있고 발열과 배터리가 한도를 정하므로, 계산 작업으로 코어를 꽉 채우면 UI 스레드와 CPU를 다투게 됩니다. 그래서 이미지 디코딩처럼 무거운 계산은 Default 위에 limitedParallelism으로 상한을 두고, Dispatcher는 하드코딩하지 않고 주입받아 테스트에서 TestDispatcher로 바꿉니다(2절의 Dispatcher 문항).<\/p>\n<pre class=\"kotlin\"><code>// 앱 수준에서 한 번 만들어 주입: 뷰마다 한도가 따로라 호출할 때마다 만들면 제한이 걸리지 않음\nclass AppDispatchers(\n    io: CoroutineDispatcher = Dispatchers.IO,\n    default: CoroutineDispatcher = Dispatchers.Default,\n) {\n    val legacySdk = io.limitedParallelism(2)     // 동시 호출에 약한 블로킹 SDK, IO 한도와 별도로 늘어남\n    val decode = default.limitedParallelism(2)   // 디코딩이 계산 스레드를 다 차지하지 않게\n}\n\nclass PoiRepository(private val sdk: LegacyPoiSdk, private val dispatchers: AppDispatchers) {\n    suspend fun detail(id: String): Poi = withContext(dispatchers.legacySdk) { sdk.queryBlocking(id) }\n}<\/code><\/pre>","f":"<ul>\n<li><strong>큐가 가득 찼을 때의 정책에는 무엇이 있습니까?<\/strong> ThreadPoolExecutor 기준으로 예외로 거부, 호출한 스레드가 직접 실행해 자연스럽게 속도를 늦추기, 조용히 버리기, 가장 오래된 것 버리기가 있습니다. 코루틴에서는 Channel의 버퍼 크기와 BufferOverflow 정책으로 같은 결정을 합니다.<\/li>\n<li><strong>IO의 한도가 Default보다 큰 이유는 무엇입니까?<\/strong> 블로킹 작업은 대부분 기다리는 시간이라 코어 수보다 많은 스레드가 있어야 처리량이 나오기 때문입니다. 같은 이유로 Default에서 블로킹 I/O를 하면 코어 수만큼밖에 없는 계산 스레드가 묶여 다른 계산이 밀립니다.<\/li>\n<li><strong>limitedParallelism(1)을 락 대신 써도 됩니까?<\/strong> 중단 지점 사이 구간이 한 번에 하나씩 실행되므로 중단 없는 상태 변경에는 락 없이 씁니다. 하지만 중단 지점에서 다른 코루틴이 끼어들 수 있어 Mutex를 대신하지는 못합니다(2절의 공유 상태 문항).<\/li>\n<\/ul>"},{"no":176,"t":"GC는 어떤 객체를 회수하고, ART의 GC는 앱 성능에 어떤 영향을 줍니까? 강한 참조, 약한 참조, 소프트 참조는 어떻게 다릅니까?","a":"<p>GC는 오래 안 쓴 객체가 아니라 더 이상 도달할 수 없는 객체를 회수합니다. 스레드 스택의 지역 변수, static 필드, JNI 전역 참조 같은 GC 루트에서 참조를 따라가 닿지 않는 객체가 쓰레기이고, 그래서 서로 참조하는 순환 구조도 루트에서 닿지 않으면 회수됩니다. ART의 GC는 대부분의 일을 앱과 동시에 해서 정지는 짧지만, 할당이 많을수록 자주 돌아 CPU와 배터리를 쓰고 프레임 예산을 갉아먹습니다. 참조 종류는 GC가 그 객체를 회수할 수 있는 조건을 바꿉니다.<\/p>\n<p>기본 방식은 살아 있는 객체를 표시하고 나머지를 지우는 Mark-Sweep, 살아 있는 객체를 한쪽으로 모으는 Mark-Compact, 다른 공간으로 옮기는 Copying이고, 대부분의 객체는 금방 죽는다는 세대 가설에 따라 새 객체를 자주, 오래 산 객체를 드물게 정리하는 세대별 GC가 표준입니다. ART는 Android 8부터 Concurrent Copying(CC)이 기본이 되어 read barrier로 앱 스레드를 멈추지 않고 객체를 옮겼고, Android 10부터 CC를 세대별 모드로 돌립니다. Google은 2022년에 커널의 userfaultfd를 쓰는 새 GC를 Play 시스템 업데이트로 Android 13 기기에 넣는다고 발표하면서 read barrier를 없애 컴파일된 코드 크기를 최대 약 10% 줄인다고 밝혔고, ART 소스의 Concurrent Mark-Compact(CMC) 수집기가 userfaultfd로 동시 압축을 하는 이 방식입니다. ISMM 2024 논문은 Android 14 QPR1 기준 운영 GC를 세대별 CC와 CMC 두 가지로 적고, Android 16 QPR2에서는 새 객체에 집중하는 Generational CMC가, Android 17에서는 더 잦고 가벼운 young generation 수집이 들어갔습니다. ART는 Android 12 이상에서 Play 시스템 업데이트로 갱신되므로, 같은 Android 버전이라도 ART 모듈 버전에 따라 도는 수집기가 다를 수 있습니다.<\/p>\n<p>앱 성능과의 관계는 할당률입니다. 객체를 많이 만들수록 GC가 자주 돌고, 동시 GC라도 CPU를 나눠 쓰므로 프레임 예산이 줄어듭니다. 그래서 onDraw, 스크롤, 애니메이션처럼 매 프레임 실행되는 경로에서 객체 생성을 피하고, 큰 비트맵은 표시 크기로 줄여 디코딩합니다. GC가 끊김의 원인인지는 Perfetto에서 버벅인 프레임과 같은 시각의 GC 구간을 함께 보고 확인합니다.<\/p>\n<p>참조 종류는 이렇습니다. 강한 참조는 일반 참조로 하나라도 있으면 회수되지 않습니다. 소프트 참조는 메모리가 부족할 때 회수되어 캐시용으로 만들어졌지만, Android의 SoftReference 문서는 런타임이 무엇을 지우고 남길지 판단할 정보가 없어 캐시에 비효율적이라며 크기를 정할 수 있는 LruCache를 쓰라고 합니다. 약한 참조는 강한 참조가 없으면 다음 GC에서 회수될 수 있어 WeakHashMap이나, 있으면 쓰고 없으면 그만인 참조에 씁니다. 팬텀 참조는 객체가 회수된 뒤 알림을 받는 용도라 객체에 접근할 수 없고 네이티브 자원 정리에 씁니다. 함정은 약한 참조로 누수를 덮는 것입니다. 리스너를 약하게 잡으면 언제 사라질지 GC 시점에 달려 동작이 비결정적이 되고, 익명 람다를 약하게 등록하면 다른 곳에서 강하게 잡지 않아 곧 회수되어 콜백이 오지 않습니다. 기본은 생명주기에 맞춘 명시적 해제이고, 누수를 찾는 방법은 6절의 메모리 누수 문항에서 다룹니다.<\/p>","f":"<ul>\n<li><strong>참조 카운팅과 비교하면 무엇이 다릅니까?<\/strong> 참조 카운팅은 참조가 0이 되는 즉시 해제되어 예측 가능하지만 순환 참조를 회수하지 못하고 참조를 바꿀 때마다 카운터 비용이 듭니다. 추적 방식 GC는 순환도 회수하는 대신 회수 시점을 앱이 정할 수 없습니다.<\/li>\n<li><strong>finalize 대신 무엇을 씁니까?<\/strong> finalize는 실행 시점과 실행 여부가 보장되지 않고 객체를 되살리는 문제가 있어서, 명시적 close와 Kotlin의 use 블록을 기본으로 합니다. 놓친 경우를 대비한 정리는 팬텀 참조 기반의 Cleaner로 하는데, Android에서는 API 33부터 쓸 수 있습니다.<\/li>\n<li><strong>앱 힙 한도를 넘는 OutOfMemoryError는 GC가 막아 주지 못합니까?<\/strong> GC는 도달 가능한 객체를 회수하지 않으므로, 살아 있는 참조가 잡고 있는 메모리는 GC를 몇 번 돌려도 줄지 않습니다. 비트맵 크기, 캐시 상한, 누수를 먼저 보고, 진단은 6절의 OOM 문항에서 다룹니다.<\/li>\n<\/ul>"},{"no":177,"t":"JVM과 ART는 어떻게 다르고, 인터프리터, JIT, AOT는 Android에서 어떻게 함께 쓰입니까?","a":"<p>둘 다 관리형 런타임이지만 실행하는 형식과 컴파일 전략이 다릅니다. JVM은 .class 파일의 스택 기반 바이트코드를 인터프리트하다가 자주 쓰는 코드를 JIT로 컴파일하고, ART는 여러 클래스를 한 파일에 담은 DEX의 레지스터 기반 바이트코드를 실행하며 인터프리터, JIT, AOT를 함께 씁니다. Android 7.0부터 ART는 프로필이나 미리 컴파일된 코드가 없으면 인터프리터와 JIT로 실행하면서 자주 쓰는 메서드를 프로필에 기록하고, 기기가 유휴 상태이면서 충전 중일 때 그 부분만 AOT로 미리 컴파일합니다.<\/p>\n<p>JVM의 런타임 영역은 스레드마다 있는 프로그램 카운터, JVM 스택, 네이티브 메서드 스택과, 모든 스레드가 공유하는 힙과 메서드 영역으로 나뉩니다. Android 빌드에서는 javac와 kotlinc가 만든 .class를 D8이나 R8이 DEX로 바꾸고, 기기에서는 dex2oat가 DEX를 기계어로 컴파일합니다. 컴파일 전략은 바뀌어 왔습니다. Android 5.0부터 ART만 쓰면서 설치할 때 dex2oat로 앱을 미리 컴파일했고, 큰 앱은 설치와 업데이트, OTA 뒤 재컴파일이 오래 걸리고 저장 공간도 많이 썼습니다. Android 7.0이 JIT와 프로필 기반 컴파일을 더해 지금의 혼합 방식이 되었습니다.<\/p>\n<p>세 방식의 장단점이 이 조합을 설명합니다. 인터프리터는 바로 실행할 수 있지만 느리고, JIT는 실행 중 타입 정보로 더 나은 인라이닝과 OSR 컴파일을 할 수 있지만 워밍업 시간과 메모리, CPU가 듭니다. AOT는 처음부터 빠르지만 실행 정보 없이 컴파일하고 설치 시간과 저장 공간이 듭니다. ART는 자주 쓰는 코드만 AOT로 굳히고 나머지는 필요할 때 JIT에 맡겨 두 비용을 나눕니다. 메서드는 인터프리트, JIT 컴파일, AOT 컴파일 세 상태 가운데 하나이고, 역최적화가 반복되어 JIT 코드와 AOT 코드가 함께 있으면 JIT 코드를 우선합니다.<\/p>\n<p>약점은 프로필이 없는 첫 실행입니다. 설치나 업데이트 직후에는 컴파일된 코드가 적어 시작과 첫 화면이 가장 느립니다. 이 구간을 Play가 사용자 실행 기록으로 만든 클라우드 프로필과, 앱이 시작 경로와 핵심 흐름을 담아 함께 배포하는 Baseline Profile이 메웁니다(6절의 Baseline Profile 문항). ART가 TTID와 TTFD 데이터를 이후 시작 코드의 사전 컴파일 최적화에 쓰는 것도 같은 흐름입니다. ART는 Android 12 이상에서 Play 시스템 업데이트로 갱신되어 GC와 컴파일러 개선이 OS 업데이트 없이 들어오고, 반대로 ART 내부 구조에 기대는 라이브러리는 ART 모듈이 바뀔 때 깨질 수 있습니다.<\/p>","f":"<ul>\n<li><strong>스택 기반과 레지스터 기반 바이트코드는 무엇이 다릅니까?<\/strong> 스택 기반은 피연산자를 스택에 넣고 빼서 명령이 짧고, 레지스터 기반은 명령 하나가 길지만 같은 일을 더 적은 명령으로 해서 인터프리트할 때 명령 디스패치 횟수가 줄어드는 편입니다.<\/li>\n<li><strong>JIT의 역최적화는 무엇입니까?<\/strong> \"이 호출에는 항상 이 클래스가 온다\"처럼 실행 정보로 가정하고 최적화했는데 가정이 깨지면, 최적화된 코드를 버리고 인터프리터로 돌아가는 것입니다.<\/li>\n<li><strong>컴파일 상태를 바꿔 성능을 비교하려면 어떻게 합니까?<\/strong> <code>adb shell cmd package compile -m speed-profile -f &lt;패키지&gt;<\/code>는 프로필 기반으로, <code>-m speed<\/code>는 가능한 만큼 전체를 컴파일합니다. Macrobenchmark의 CompilationMode로 같은 비교를 자동화합니다.<\/li>\n<\/ul>"}]},{"no":11,"title":"설계 문제","qs":[{"no":178,"t":"장소 검색 화면(자동완성, 최근 검색어, 결과 목록, 지도 연동)을 설계해 보세요.","a":"<p>먼저 범위를 확인하겠습니다. 검색 대상은 장소만입니까, 주소와 정류장도 포함합니까? 결과를 현재 위치 기준으로 정렬합니까? 최근 검색어는 기기에만 둡니까, 계정으로 동기화합니까? 답이 없으면 장소와 주소를 위치 기준으로 찾고 최근 검색어는 기기에만 둔다고 가정하겠습니다. 결론은 화면 하나를 ViewModel 하나가 맡아 입력 전(최근 검색어), 입력 중(자동완성), 제출 뒤(결과 목록과 지도) 세 모드를 하나의 화면 상태로 내보내고, 데이터는 기기 저장소와 서버 API로 나누는 구조입니다.<\/p>\n<p>구조는 입력, 자동완성, 최근 검색어, 결과 목록 순서로 말씀드리겠습니다. 입력 상태는 ViewModel이 가진 TextFieldState로 즉시 갱신하고 요청은 그 상태에서 파생한 Flow로 처리합니다(3절의 검색창 TextField 문항). 자동완성은 debounce, distinctUntilChanged, flatMapLatest로 이전 요청을 취소하는 흐름이고(2절의 검색어 자동완성 문항), 기기에 있는 최근 검색어와 즐겨찾기의 매칭 결과를 먼저 보여 준 뒤 서버 후보가 오면 장소 ID로 중복을 없애 합칩니다(8절의 검색어 자동완성 문항). 최근 검색어는 Room에 두고 사용자가 검색을 제출하거나 결과를 고를 때 저장하며, 같은 검색어는 시각만 갱신하고 개수 상한을 넘으면 오래된 것부터 지웁니다. 개별 삭제와 전체 삭제를 제공하고 로그아웃 때 함께 지웁니다. 결과 목록은 검색어가 바뀔 때마다 새 Pager로 갈아타는 Paging 3 목록입니다(4절의 페이지 목록 문항). 검색 결과는 금방 버리는 데이터라 DB에 쓰지 않고 네트워크 PagingSource와 cachedIn으로 충분합니다.<\/p>\n<p>지도 연동의 핵심은 목록과 지도가 같은 상태를 보는 것입니다. 선택된 장소 ID 하나를 ViewModel 상태로 두고, 목록 항목을 누르면 지도가 그 핀을 강조하고 핀을 누르면 목록이 그 항목으로 스크롤합니다. 둘이 선택을 각자 들고 있으면 바로 어긋납니다. 사용자가 지도를 움직이는 동안의 카메라 값은 지도 SDK가 갖고, 이동이 끝난 영역만 ViewModel로 올려 \"이 지역에서 다시 검색\" 버튼을 띄웁니다(3절의 지도 SDK 문항). 프로세스 종료에 대비해 검색어와 선택된 장소 ID만 SavedStateHandle에 남기고 결과는 다시 요청합니다(5절의 프로세스 종료 문항).<\/p>\n<p>핵심 결정은 세 가지입니다. 첫째, 기기 결과를 먼저 보여 주면 첫 후보는 빨리 뜨지만 서버 결과가 올 때 순서가 바뀔 수 있으므로, 순위 기준을 Repository 한곳에서 정하고 이미 보인 항목의 자리는 유지합니다. 둘째, 지도 핀은 목록이 불러온 항목만 그립니다. 같은 화면에서 LazyPagingItems.itemSnapshotList의 items를 지도에 넘기면 목록과 지도가 같은 항목을 씁니다. itemSnapshotList 자체는 placeholder가 켜져 있으면 null 자리를 포함하기 때문입니다. 검색 결과 전체를 지도에 깔려면 영역 기반 요청이 따로 필요하고, 그 구조는 이 절의 주변 장소 표시 설계 문항에서 다룹니다. 셋째, 요청에 현재 위치를 넣으면 같은 검색어도 위치마다 응답이 달라 캐시가 잘 맞지 않으므로, 캐시 키에는 위치를 격자 단위로 반올림한 값을 넣어 조금 움직였다고 캐시를 버리지 않게 합니다.<\/p>\n<p>측정과 운영은 입력이 멈춘 뒤 첫 후보가 보일 때까지의 시간, 자동완성 응답의 P95, 세션당 요청 수, 결과 0건 비율, 사용자가 고른 결과의 순위를 봅니다. 고른 순위가 계속 뒤쪽이면 순위 기준을, 세션당 요청 수가 많으면 디바운스와 캐시를 의심합니다. 디바운스 시간과 최소 글자 수는 원격 설정으로 바꿀 수 있게 하고, 서버 장애 때 기기 결과만 보여 주도록 자동완성을 끄는 kill switch를 둡니다(4절의 기능 플래그 문항).<\/p>","f":"<ul>\n<li><strong>명절처럼 검색이 몰려 서버가 429나 503을 돌려주면?<\/strong> 자동완성은 재시도하지 않습니다. 다음 입력이 곧 새 요청이라 재시도는 부하만 키웁니다. Retry-After가 지날 때까지 기기 결과만 보여 주고 원격 설정으로 디바운스 시간을 늘리며, 사용자가 제출한 검색만 Retry-After가 있으면 그 시각 뒤에, 없으면 지수 백오프와 지터로 다시 보냅니다(9절의 타임아웃과 재시도 문항).<\/li>\n<li><strong>오프라인이면 무엇이 됩니까?<\/strong> 최근 검색어와 즐겨찾기는 기기 데이터라 그대로 검색되고, 서버 검색은 오류 상태와 다시 시도 버튼을 보여 줍니다. 네트워크가 돌아왔을 때 자동으로 다시 보내는 것은 사용자가 제출한 마지막 검색 하나뿐입니다.<\/li>\n<li><strong>위치 권한이 없거나 대략적 위치만 허용했으면?<\/strong> 위치 없이 요청해 서버가 지도 중심이나 지역 기본값으로 정렬하게 하고, 대략적 위치도 정렬 기준으로 그대로 씁니다. 정밀 위치는 \"내 주변\" 정렬을 고를 때처럼 필요한 순간에 맥락과 함께 요청합니다(7절의 위치 권한 문항).<\/li>\n<\/ul>"},{"no":179,"t":"주행 안내 기능의 클라이언트 구조를 설계해 보세요. 화면, 포그라운드 서비스, 위치 스트림, 재탐색, 프로세스 종료 뒤 복구까지 포함해 주세요.","a":"<p>먼저 범위를 확인하겠습니다. 화면이 꺼지거나 다른 앱을 쓰는 동안에도 음성 안내가 이어져야 합니까? 경로 계산은 서버가 합니까? 터널 같은 음영 구간에서도 안내가 이어져야 합니까? 백그라운드 위치 권한 없이 동작해야 합니까? 답이 없으면 모두 그렇다고 가정하겠습니다. 결론은 안내 상태를 싱글턴 세션 하나가 소유하고, 계산은 위치 포그라운드 서비스 안에서 돌리며, 화면, 알림, 음성, 차량 화면은 그 상태를 구독하는 구조입니다.<\/p>\n<p>구조는 네 부분입니다. 첫째, 상태는 @Singleton 안내 세션의 StateFlow에 두고, 위치를 받아 경로 위 진행 위치, 다음 회전, 남은 거리를 계산하는 작업은 포그라운드 서비스의 lifecycleScope에서 돌립니다. 서비스가 끝나면 계산과 위치 수신도 함께 멈추고, onDestroy에서 세션 상태를 종료로 바꿔 화면에 안내 중 상태가 남지 않게 합니다. 위치는 FusedLocationProviderClient 콜백을 callbackFlow로 감싸 앱 범위에서 하나만 구독합니다(7절의 위치 Flow 문항). 간격은 LocationRequest 문서가 대부분의 고빈도 앱에 충분하다고 적은 1초를 기준으로 하고, 시작할 때의 첫 위치는 getCurrentLocation으로 받습니다. 둘째, location 타입 포그라운드 서비스는 화면이 없어도 이 계산이 계속 돌게 하는 그릇입니다. 위치는 while-in-use 권한이라 사용자가 화면에서 안내 시작을 누른 순간, 즉 Activity가 보일 때 시작합니다. 타입과 권한 선언, startForeground 시한 같은 조건은 7절의 주행 안내 서비스 문항에서 다룹니다. 음성 안내도 이 서비스 안에서 냅니다. Android 17은 targetSdk와 관계없이 오디오 재생, 포커스, 볼륨 API를 보이는 Activity나 포그라운드 서비스가 있을 때만 허용하고, targetSdk 37이면 그 서비스에 while-in-use 능력까지 요구합니다(정확한 알람 권한으로 USAGE_ALARM 스트림을 쓰면 예외). 앱이 보일 때 시작한 위치 서비스는 이 능력을 받습니다. 셋째, 알림은 다음 회전과 남은 거리를 보여 주되 표시 단위가 바뀔 때만 갱신하고, Android 16 이상에서는 Notification.ProgressStyle로 진행 상태를 보여 줍니다(7절의 Live Updates 문항). 넷째, 화면은 같은 StateFlow를 그리기만 합니다. 보이는 동안에는 차량 아이콘을 위치 사이에서 보간해 부드럽게 움직이고, 화면이 꺼지면 그리기를 멈추고 알림 갱신만 남겨 위치 수신 빈도와 화면 갱신 빈도를 나눕니다(7절의 위치 업데이트 주기 문항).<\/p>\n<p>재탐색도 세션이 판단합니다. 경로 선과의 거리, 진행 방향, 위치 정확도를 함께 보고 연속으로 벗어났을 때만 이탈로 확정해 순간적인 튐을 거릅니다(7절의 경로 이탈 문항). 확정되면 상태를 재탐색 중으로 바꾸고 기존 경로는 흐리게 남겨 복귀 판단에 쓰며, 요청은 하나만 둬 새 이탈이 오면 이전 요청을 취소하고, 응답이 오면 경로를 한 번에 바꿉니다. 핵심 결정은 두 가지입니다. 첫째, 이탈 판단은 클라이언트가, 경로 계산은 교통 정보를 가진 서버가 합니다. 이탈 판단까지 서버에 두면 위치를 계속 올려야 하고 음영 구간에서 멈춥니다. 둘째, 상태의 소유자를 서비스가 아니라 세션으로 둡니다. 서비스가 상태를 가지면 화면이 바인딩해야 읽을 수 있고 두 생명주기가 엉켜 차량 화면 같은 구독자를 붙이기 어렵습니다. 반대로 계산은 서비스의 lifecycleScope에서 돌리므로 서비스 없이 안내만 도는 상태도 생기지 않습니다.<\/p>\n<p>복구는 두 경우로 나눕니다. Activity만 다시 만들어지면 세션이 메모리에 남아 있어 화면이 다시 구독하면 끝입니다. 크래시나 메모리 부족으로 프로세스가 통째로 죽으면 메모리가 모두 사라지므로, 안내 시작과 재탐색 때마다 목적지, 경유지, 경로 옵션과 받은 경로를 Room에 저장해 둡니다. 사용자가 앱을 다시 열어 화면이 보이면 저장된 안내가 최근 것인지 확인해 이어서 안내할지 묻고, 현재 위치에서 같은 목적지로 경로를 새로 받습니다. 그사이 위치와 교통이 바뀌었으므로 저장된 경로는 오프라인일 때만 현재 위치를 맞춰 씁니다. location 서비스는 앱이 보일 때 시작해야 하므로 복구도 이 시점에 하고, 시스템의 서비스 재시작에 기대지 않는 이유는 7절의 주행 안내 서비스 문항에서 다룹니다.<\/p>\n<p>측정과 운영은 안내 세션 단위로 합니다. 정상 종료 대비 비정상 종료 비율, 위치가 끊긴 시간, 재탐색 응답 시간과 실패율, 배터리 사용량을 보고, 비정상 종료 사유는 다음 실행 때 ApplicationExitInfo(API 30)로 나눕니다. 앱은 partial wake lock을 직접 잡지 않습니다. 위치 콜백 때 시스템이 잡는 wake lock은 Android vitals의 과도한 wake lock 계산에서 빠지지만 앱이 잡은 것은 들어갑니다. 시험은 녹화한 GPS 궤적을 모의 위치로 재생해 이탈, 재탐색, 터널 구간을 반복합니다.<\/p>","f":"<ul>\n<li><strong>사고로 도로가 막혀 같은 구간 차량이 한꺼번에 재탐색하면?<\/strong> 재탐색은 사용자가 기다리는 요청이라 첫 요청에는 지연을 넣지 않고, 실패한 뒤의 재시도에만 지수 백오프와 지터를 넣으며 그동안 기존 경로 안내를 계속합니다. 서버가 같은 구간 요청을 합쳐 계산하거나 우회 경로를 안내 중 연결로 미리 내려 주면 요청 자체가 줄어듭니다(9절의 실시간 정보 문항).<\/li>\n<li><strong>터널에서 위치와 네트워크가 함께 끊기면?<\/strong> 미리 받은 경로와 마지막 속도, 센서로 위치를 추정해 안내를 이어 갑니다(7절의 GPS 튐 문항). 재탐색이 필요해도 네트워크가 돌아올 때까지는 기존 경로로 안내하고 재탐색 대기를 표시합니다.<\/li>\n<li><strong>안내 중에 사용자가 설정에서 위치 권한을 끄면?<\/strong> 런타임 권한을 회수하면 시스템이 앱 프로세스를 종료하므로 복구 경로를 탑니다. 다시 열었을 때 권한이 없으면 안내 대신 권한 안내를 보여 주고, 저장된 안내는 지우지 않아 권한을 다시 주면 이어 갑니다.<\/li>\n<li><strong>폰 화면과 차량 화면이 함께 안내하면 상태가 어긋나지 않습니까?<\/strong> 둘 다 같은 세션의 StateFlow를 읽으므로 어긋나지 않습니다. Car App Library 쪽은 NavigationManager에 안내 시작과 종료를 알리고, 재탐색 중에는 navigationEnded 대신 Trip.Builder.setLoading(true)를 씁니다(7절의 Android Auto 문항).<\/li>\n<\/ul>"},{"no":180,"t":"여러 기기에서 쓰는 즐겨찾기 동기화 기능을 설계해 보세요.","a":"<p>먼저 범위를 확인하겠습니다. 다른 기기에 반영되기까지 어느 정도 지연을 허용합니까? 순서 변경이나 폴더 같은 구조가 있습니까? 로그인하지 않아도 즐겨찾기를 쓸 수 있습니까? 답이 없으면 실시간 반영은 필요 없고, 순서 변경이 있으며, 로그인 전에도 쓸 수 있다고 가정하겠습니다. 결론은 4절의 오프라인 쓰기 구조(로컬 DB 먼저 쓰기, 멱등 키, 버전으로 충돌 감지, 삭제 표시)를 기기마다 두고, 서버를 최종 기준으로 커서 기반 증분 동기화와 변경 신호 푸시를 더하는 것입니다.<\/p>\n<p>구조는 서버 API 두 개와 클라이언트 동기화 작업 하나입니다. 쓰기는 클라이언트가 만든 ID로 PUT하면서 마지막으로 본 버전을 함께 보내 서버가 충돌을 판단하게 하고, 읽기는 마지막 커서 이후의 변경분과 다음 커서를 돌려주는 변경 조회 API이고, 새 기기의 첫 동기화는 커서 없이 전체 목록과 첫 커서를 받습니다. 동기화 작업은 WorkManager의 고유 작업으로 두고, 대기 중인 로컬 변경을 먼저 올린 뒤 서버 변경분을 받아 로컬 DB에 반영합니다. 받은 변경을 반영할 때 아직 올리지 않은 로컬 행은 서버 값으로 덮지 않고 병합 대상으로 둡니다. 동기화 계기는 앱 시작과 포
